细胞胞质棕黄色颗粒均被染成深蓝色","仅心肌核旁颗粒染深蓝而巨噬细胞保持棕黄","两种细胞颗粒均无Fe³⁺而不被普鲁士蓝着色","巨噬细胞颗粒染成深蓝而心肌核旁颗粒不变色"],"answer_idx":3,"explain":"二尖瓣狭窄致慢性肺淤血时肺泡腔红细胞漏出，被巨噬细胞吞噬分解血红蛋白形成含Fe³⁺的含铁血黄素（心衰细胞），遇普鲁士蓝亚铁氰化钾反应呈深蓝色；而萎缩心肌核两旁的黄褐色颗粒系细胞器自噬氧化的残余脂褐素，不含三价铁，故普鲁士蓝阴性不变色。","remedial_node_id":"patho_pulmonary_congestion"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_injury_hypoxia_membrane_cascade","title":"损伤病因与缺氧-ATP-钙超载级联","subject":"pathology","syllabus_refs":["syl_pathology_016","syl_pathology_017"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"病因/HLA 6p21.3易感性及缺氧→ATP耗竭→Ca²⁺激活四酶→膜损伤","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P18-P21, #P137-P142"],"diagram_assets":[{"path":"assets/patho_injury_hypoxia_cascade_p140.webp","caption":"缺血/缺氧触发线粒体ATP衰竭、钠泵/钙泵失灵与酸中毒连锁反应","source_page":140}],"payload":{"steps":[{"step_index":1,"cue":"细胞损伤三大病因与HLA遗传易感（P137-P139）","reveal":"涵盖①环境因素（生物性如细菌/病毒，非生物性如缺氧、物理冷热辐射、毒物药物）；②生命必需物质（氧、营养、水/微量元素）缺乏或过量；③遗传与免疫因素（基因突变及位于6p21.3的HLA基因多态性决定个体对损伤的免疫应答差异）。"},{"step_index":2,"cue":"缺血缺氧→ATP耗竭与早期可逆变（P18-P21, P140）","reveal":"线粒体氧化磷酸化受阻使ATP迅速下降：①细胞膜Na⁺/K⁺-ATP酶失活，Na⁺与水内流致急性细胞水肿；②粗面内质网扩张、核糖体脱落致蛋白合成下降；③代偿无氧糖酵解增强使乳酸堆积、pH下降及染色质凝集。"},{"step_index":3,"cue":"细胞膜与钙泵失灵引发胞质Ca²⁺超载（P141）","reveal":"ATP持续耗竭导致质膜及肌浆/内质网Ca²⁺-ATP酶泵瘫痪，胞外Ca²⁺顺浓度差大量涌入同时细胞内钙库（ER/线粒体）净释放增加，使原本维持极低水平的胞质游离Ca²⁺浓度急剧升高。"},{"step_index":4,"cue":"高Ca²⁺激活四大破坏酶引爆不可逆膜损伤（P142）","reveal":"升高的胞质Ca²⁺全面激活①磷脂酶（水解膜磷脂致脂双层破损并生成炎症介质）；②蛋白酶（切断细胞骨架与膜锚定蛋白）；③ATP酶（耗尽残余ATP）；④核酸内切酶（断裂DNA），伴线粒体MPTP开放迈向不可逆坏死。"}],"takeaway":"缺氧致ATP枯竭触发钠泵衰竭（可逆水肿），继发胞质Ca²⁺激酶群破坏膜结构跃过不可逆生死线。","quiz":{"stem":"急性心肌缺血第15分钟心肌细胞仅见线粒体轻度肿胀、胞质水分增多及乳酸略升，而缺血延至60分钟则突现肌膜断裂、肌浆酶漏出与核染色质碎解。标志细胞跨入不可逆膜破损最核心的钙依赖酶触发事件是：","options":["胞质Ca²⁺骤升激活磷脂酶与骨架蛋白酶降解膜","质膜钠钾ATP酶亢进运转加速钾离子高速外流","无氧糖酵解生成乳酸直接融解双层质膜结构","核糖体自内质网脱落立即中断全部膜脂再生"],"answer_idx":0,"explain":"早期ATP下降仅使钠泵失效致可逆性细胞水肿及乳酸增多；一旦Ca²⁺泵失能导致胞质游离Ca²⁺持续超载，立即激活内源磷脂酶（破坏磷脂双分子层）、蛋白酶（拆解骨架膜蛋白）、ATP酶与核酸内切酶，叠加线粒体通透性转换孔（MPTP）开放，造成不可逆生物膜裂解与酶漏出。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_injury_ros_er_stress_targets","title":"ROS氧化损伤、ER应激与四大靶点","subject":"pathology","syllabus_refs":["syl_pathology_017"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"ROS生成/清除体系、内质网UPR双相转归及线粒体/膜/ER/DNA四靶点","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P143-P146"],"diagram_assets":[{"path":"assets/patho_injury_ros_pathway_p143.webp","caption":"自由基ROS（O₂⁻·/H₂O₂/·OH）来源、酶促清除与生物大分子损伤链","source_page":143}],"payload":{"steps":[{"step_index":1,"cue":"活性氧（ROS）生成与Fenton剧毒放大（P143）","reveal":"辐射、化学毒物、缺血再灌注及吞噬细胞呼吸爆发产生活性氧：氧单电子还原生成超氧阴离子（O₂⁻·），歧化为H₂O₂；游离Fe²⁺通过Fenton反应将H₂O₂裂解为破坏力极强的羟自由基（·OH）。"},{"step_index":2,"cue":"ROS三大清除体系与三大分子打击（P143-P144）","reveal":"清除酶系为SOD（歧化O₂⁻·）、过氧化氢酶（CAT）及依赖NADPH-GSH的谷胱甘肽过氧化物酶（GPx），辅以Vit E/C及转铁蛋白阻断游离铁。清除失衡时引发膜脂质过氧化链式反应、蛋白巯基交联失活与DNA断裂。"},{"step_index":3,"cue":"内质网应激与UPR适应→凋亡转换（P145）","reveal":"缺氧或糖基化异常致ER腔内错误折叠蛋白堆积，伴侣蛋白BiP解离并激活IRE1α/XBP1等未折叠蛋白反应（UPR）：轻度时减少新生蛋白翻译、促进ERAD降解助细胞存活；若应激持续不解，则上调CHOP并激活Caspase转向凋亡。"},{"step_index":4,"cue":"细胞内受损四大核心脆弱靶点整合（P146）","reveal":"无论病因是缺氧、ROS抑或ER应激，最终均精准汇流破坏细胞四大靶点：①线粒体（ATP停产与Cyt c外漏）；②细胞膜与溶酶体膜（渗透崩溃与自身溶解）；③蛋白合成及内质网折叠系统；④核DNA完整性。"}],"takeaway":"ROS链式摧毁脂/蛋白/DNA，UPR则随应激久暂于适应与CHOP凋亡间切换，终落脚细胞四大靶点。","quiz":{"stem":"某G6PD（葡萄糖-6-磷酸脱氢酶）缺乏症患儿误服蚕豆引发急性氧化应激溶血，红细胞膜广泛发生脂质过氧化断裂。从自由基清除酶系依赖辅因子的生化联系来看，G6PD缺陷直接瘫痪了下列哪条ROS防线？","options":["无法合成过氧化氢酶（CAT）血红素辅基","阻断线粒体锰超氧化物歧化酶（Mn-SOD）","促进铜蓝蛋白大量丢失抑制铜离子氧化还原","NADPH锐减致GSH无法再生而瘫痪GPx"],"answer_idx":3,"explain":"磷酸戊糖途径（G6PD为限速酶）为红细胞唯一提供NADPH的通路，谷胱甘肽还原酶依赖NADPH将氧化型GSSG还原为GSH，供谷胱甘肽过氧化物酶（GPx）清除H₂O₂；G6PD缺乏使GPx失去还原当量而难以清除过氧化物，致红细胞膜脂质过氧化与蛋白变性溶血。","remedial_node_id":"pathophys_stress_cellular_hsp_ros"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_apoptosis_mechanisms","title":"细胞凋亡内外源机制与生化特征","subject":"pathology","syllabus_refs":["syl_pathology_013"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"线粒体BAX-Cyt c-Casp9与Fas-Casp8→Casp3梯带机制","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P122-P125, #P129"],"diagram_assets":[{"path":"assets/patho_injury_apoptosis_pathways_p124.webp","caption":"细胞凋亡外源性死亡受体通路（Fas/Caspase-8）与内源性线粒体通路（Cyt c/Caspase-9）","source_page":124}],"payload":{"steps":[{"step_index":1,"cue":"内源性线粒体通路激活（P124）","reveal":"DNA严重损伤、生长因子撤除或ER应激激活BH3-only感应蛋白，拮抗抗凋亡蛋白Bcl-2/Bcl-xL；释放BAX/BAK在线粒体外膜寡聚打孔（MOMP），漏出细胞色素c至胞浆，与Apaf-1、dATP组装凋亡小体激活Caspase-9。"},{"step_index":2,"cue":"外源性死亡受体通路启动（P124）","reveal":"FasL结合细胞膜Fas（CD95）或TNF-α结合TNFR1，受体胞内死亡结构域（DD）募集衔接蛋白FADD形成死亡诱导信号复合物（DISC），直接剪切并激活启动型蛋白酶Caspase-8，在免疫阴性选择等过程起主导作用。"},{"step_index":3,"cue":"效应Caspase执行与DNA梯带切割（P125）","reveal":"Caspase-8与Caspase-9共同活化效应酶Caspase-3/6/7，拆解细胞骨架并激活CAD核酸内切酶；CAD仅在核小体连接区切断DNA，凝胶电泳呈180–200 bp整数倍“梯状条带”（区别坏死随机断片的涂片状）。"},{"step_index":4,"cue":"磷脂酰丝氨酸外翻与无炎清除（P125, P129）","reveal":"凋亡耗能（依赖ATP与新蛋白合成），核染色质浓缩呈半月形边集并出芽形成完整膜包被的凋亡小体；膜内叶磷脂酰丝氨酸（PS）外翻释放“吃我”信号，迅速被巨噬细胞或邻近细胞吞噬，全程质膜完整且无中性粒细胞炎症反应。"}],"takeaway":"内外双轨（线粒体Caspase-9 vs 死亡受体Caspase-8）会师Caspase-3，切出180–200bp梯带并保膜无炎吞噬。","quiz":{"stem":"某滤泡性淋巴瘤因t(14;18)易位致细胞内Bcl-2蛋白持续高表达，从而显著逃避生长因子撤除诱导的细胞凋亡。下列哪项环节最能被Bcl-2过表达直接阻断，而使用外源性FasL仍可绕过该阻断触发凋亡？","options":["核小体连接区DNA被CAD切为180bp梯带","FADD募集并激活外源受体Caspase-8","BAX/BAK寡聚打孔导致线粒体Cyt c释放","邻近巨噬细胞吞噬清除外翻磷脂酰丝氨酸小体"],"answer_idx":2,"explain":"Bcl-2定位于线粒体外膜，专一拮抗促凋亡BAX/BAK寡聚打孔（MOMP）并阻断细胞色素c释放及下游Caspase-9活化，从而关闭内源性线粒体凋亡通路；但外源性FasL可通过Fas-FADD-Caspase-8直接激活Caspase-3，在部分细胞中绕过线粒体防线完成凋亡执行。","remedial_node_id":"pathophys_stress_cellular_hsp_ros"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_autophagy_and_regulated_death","title":"细胞自噬双刃剑与铁死亡/焦亡","subject":"pathology","syllabus_refs":["syl_pathology_014"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"Atg/LC3-II双层膜自噬体降解再利用，及铁死亡GPX4与焦亡GSDMD对照","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P132-P135"],"diagram_assets":[{"path":"assets/patho_injury_autophagy_p134.webp","caption":"巨自噬流程：吞噬泡延伸→双层膜自噬体→与溶酶体融合形成自噬溶酶体","source_page":134}],"payload":{"steps":[{"step_index":1,"cue":"自噬感应与双层膜自噬体形成（P132-P134）","reveal":"营养饥饿、缺氧或细胞器损伤抑制mTORC1（激活AMPK），触发ULK1起始复合物成核形成隔离膜；经Atg蛋白家族及LC3-I向脂化LC3-II转化推动膜延伸闭合，形成包裹受损胞器或长寿蛋白的双层膜结构——自噬体。"},{"step_index":2,"cue":"溶酶体融合降解与代谢回收（P134）","reveal":"成熟双层膜自噬体与溶酶体融合为单层膜自噬溶酶体（Autolysosome），溶酶体酸性水解酶将内容物降解为氨基酸与脂肪酸返回胞浆再利用，未消化脂质残留则为脂褐素（见于心肌褐色萎缩）。"},{"step_index":3,"cue":"自噬的双重命运：适应存活 vs 死亡（P134）","reveal":"适度自噬清除受损胞器、维持能量危机中的细胞存活并抑制肿瘤早期发生；但长期剧烈应激致胞质细胞器被过度自食耗竭时，则越过阈值转为自噬性细胞死亡（与凋亡相互串话调控）。"},{"step_index":4,"cue":"新型调控性死亡：铁死亡与焦亡对照（P135）","reveal":"区别于Caspase主导的凋亡：①铁死亡（Ferroptosis）因Fe²⁺蓄积或GPX4失活引起膜脂质过氧化致命累积，见线粒体皱缩、膜密度升高；②细胞焦亡（Pyroptosis）由炎症小体活化Caspase-1/4/5/11裂解GSDMD在质膜打孔，渗透破裂并释IL-1β/IL-18放炎。"}],"takeaway":"自噬通过Atg/LC3双层膜吞噬受损胞器实现饥饿自救或过度自毁；铁死亡靠Fe²⁺脂质过氧化，焦亡靠GSDMD打孔放炎。","quiz":{"stem":"实验用化合物RSL3抑制谷胱甘肽过氧化物酶4（GPX4）活性后诱导肝癌细胞大量死亡，该死亡无法被泛Caspase抑制剂zVAD阻断，电镜亦未见核浓缩边集或质膜发泡打孔，唯见线粒体体积皱缩、嵴减少且可被铁螯合剂完全挽救。该死亡方式关键执行机制为：","options":["游离Fe²⁺催生脂质过氧化物不可逆堆积致死","炎症小体激活GSDMD蛋白于质膜打孔释炎","双层膜自噬体持续融合溶酶体耗竭自身胞器","线粒体打孔外泄Cyt c激活效应酶促凋亡"],"answer_idx":0,"explain":"GPX4失活叠加Fe²⁺依赖的脂质过氧化（Fenton反应放大），伴典型线粒体皱缩与嵴消失且不依赖Caspase、能被铁螯合剂或脂溶性抗氧化剂（如Ferrostatin-1）挽救，属于典型的铁死亡（Ferroptosis，P135）；焦亡由GSDMD打孔引发渗涨破膜释炎，凋亡则依赖Caspase。","remedial_node_id":"patho_apoptosis_mechanisms"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_hyperemia_types_decompression","title":"充血分型、减压后充血与淤血病因","subject":"pathology","syllabus_refs":["syl_pathology_018","syl_pathology_019"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"区分生理性/炎性/减压后充血（防腹水骤放致脑缺血休克）与淤血三大病因及微循环阻力规律。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P8-P12"],"payload":{"bullets":["血管动力学分工（Rubin Fig 7-2）：{{细动脉}}口径小阻力高决定灌注压降，{{毛细血管}}总截面积最大，静脉系具瓣膜呈低压高容储血库。","生理性充血：神经体液调细动脉扩张，如进餐后胃肠、运动时骨骼肌及情绪激动面部充血，增强代谢后即恢复。","病理性充血两主型：①{{炎性充血}}（加速白细胞与抗体赴病灶）；②{{减压后充血}}（大量腹水或肿瘤骤然减压致受压区细动脉反射性扩张）。","淤血三大病因：①{{静脉受压}}（妊娠子宫、肠扭转、肝硬化）；②{{静脉腔阻塞}}（血栓、瘤栓）；③{{心力衰竭}}（左心肺淤血/右心肝体淤血）。"],"trap_note":"临床大量抽放腹水必须分次缓慢进行：若一次放液过快，腹腔血管床骤然减压后充血可汇流大量血液，引发脑和心相对缺血而致晕厥或休克！","quiz":{"stem":"大量腹水患者一次骤然抽放4000 mL腹水后数分钟，突发面色苍白、头晕乏力、血压骤降。最直接解释此急症的局部血管动力学突变是：","options":["腹内压骤降诱发腹腔减压后充血致回心血锐减","腹膜淋巴管开放大量回吸收淋巴液引致肺水肿","右心室泵血骤增触发体循环广泛小动脉痉挛","肝门静脉压力暴跌促使红细胞大量溶解破坏"],"answer_idx":0,"explain":"长期受压的腹腔内器官血管在腹水骤然放空、外压解除后发生“减压后充血”，细动脉反射性扩张容纳大量血液，致使有效循环血量骤降、心脑供血锐减而诱发晕厥或休克。","remedial_node_id":"patho_hyperemia_vs_congestion"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_edema_raas_and_organ_lesions","title":"全身水肿RAAS环与器官水肿病变","subject":"pathology","syllabus_refs":["syl_pathology_020"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"心衰/低蛋白经肾低灌注激活RAAS醛固酮放大全身水肿，决定凹陷体征及肺/脑/喉fatal危象。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P32,#P35-P44"],"diagram_assets":[{"path":"assets/patho_congestion_edema_raas_p36.webp","caption":"心衰与低蛋白血症经有效血容量↓激活RAAS系统放大全身性水肿机制(图3-17)","source_page":36}],"payload":{"steps":[{"cue":"全身水肿放大枢纽：心输出量↓或低蛋白血容量↓如何演变为顽固水钠潴留？","reveal":"肾血流量下降激活肾素-血管紧张素-醛固酮系统(RAAS)→醛固酮分泌↑→肾小管钠水重吸收↑→血浆容量反增并持续抬高毛细血管静水压。","mechanism_tag":"RAAS恶性正反馈"},{"cue":"水肿的大体与镜下共性特征及体液腔积液名称","reveal":"组织肿胀苍白质软、切面胶冻样渗出清液；镜下间隙增宽透亮空白或淡伊红染。体腔积液称胸腔/心包/腹腔积液；皮下按压留窝即凹陷性水肿。","mechanism_tag":"大体与镜下特征"},{"cue":"决定水肿致命性的四大器官靶点与局部危害","reveal":"喉头水肿阻塞声门致急性窒息；脑水肿使脑回扁平脑沟变浅诱发致命脑疝；肺水肿阻碍气体交换并利细菌感染；皮肤水肿压迫血供阻碍创伤愈合。","mechanism_tag":"器官致命结局"}],"takeaway":"全身水肿绝非单纯物理渗漏，有效血容量下降唤醒RAAS醛固酮蓄钠水形成恶性放大环；急性期喉头与脑水肿可迅速致命。","quiz":{"stem":"微小病变型肾病患儿大量蛋白尿丢失导致血浆白蛋白骤降、有效循环血容量反呈低灌注状态，临床却见全身高度凹陷性水肿持续加剧。驱动后期水肿恶化的神经体液环路核心为：","options":["脑垂体骤停分泌抗利尿激素加速排尿稀释","毛细淋巴管广泛增生代偿加速清蛋白回流","心房利钠肽剧增显著抑制近端小管重吸收","肾低灌注激活RAAS促醛固酮致钠水潴留"],"answer_idx":3,"explain":"血浆胶体渗透压骤降使水分大量漏入组织间隙、血管内有效血容量减少，进而减少肾血流量并强烈激活肾素-血管紧张素-醛固酮系统(RAAS)，醛固酮升高促发肾性水钠潴留，不断扩大细胞外液总量。","remedial_node_id":"physio_regulation_modes_body_fluid"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_repair_regeneration_potential","title":"损伤修复抉择与三类细胞再生潜能","subject":"pathology","syllabus_refs":["syl_pathology_026"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"依细胞周期(Cyclins-CDKs/Rb)潜能分不稳定、稳定与永久性细胞，决定完全再生或瘢痕修复。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P3-P9"],"diagram_assets":[{"path":"assets/patho_repair_regen_vs_scar_p05.webp","caption":"浅表上皮受损而基质完整走完全性再生(左)，深层组织支架毁损则走纤维性瘢痕修复(右)","source_page":5}],"payload":{"columns":["细胞再生分类","细胞周期与Cyclin-CDK状态","代表组织器官","损伤后修复归宿"],"rows":[["不稳定细胞(Labile)","持续分裂(G1→S→G2→M)，依赖干细胞补充","表皮、呼吸道/消化道黏膜、造血细胞","基底膜完整时迅速完全再生"],["稳定细胞(Stable)","平时静止于G0期，受刺激后Rb磷酸化入周期","肝细胞、肾小管、内分泌腺、成纤维/内皮","支架完整可完全再生；支架塌陷仍瘢痕"],["永久性细胞(Permanent)","终末分化退出周期，被p16/p21等持久锁定","神经元、心肌细胞（骨骼肌仅极有限再生）","死亡后几乎不能再生，多由胶质/纤维瘢痕修补"]],"quiz":{"stem":"乙型肝炎病毒导致肝实质大片散在肝细胞凋亡坏死，但肝小叶网状纤维支架完整；另一例急性重型肝脓肿则彻底溶解崩解局部网状支架。二者恢复期的组织学结局差异主要体现为：","options":["前者由间质心肌样细胞化生形成纤维包膜","前者肝细胞重入周期完全再生而后者成瘢痕","两者均因肝细胞属永久性细胞必成假小叶","后者仅靠肝内胆管上皮即可无瘢痕完美修复"],"answer_idx":1,"explain":"肝细胞属于典型的“稳定细胞”，平时处于G0期，但具有极强潜在再生力；当网状纤维支架保留完整时可精准沿支架分裂实现完全性再生，一旦脓肿摧毁网状支架，结构无从对齐则走向肉芽增生与瘢痕修复。","remedial_node_id":"patho_necrosis_outcomes"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_repair_stem_cells_tissues","title":"干细胞分型与多组织再生方式","subject":"pathology","syllabus_refs":["syl_pathology_026"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"区分ES细胞/成体干细胞龛/iPS重编程及上皮、肝再生、施万细胞引导周围神经再生规律。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P10-P16","基础医学概论 修复 基础 20241103上传.pdf#P27"],"payload":{"bullets":["干细胞核心特性：具无限分裂能力与{{非对称分裂}}（同时维持自我更新与定向分化两子代细胞）。","三大干细胞类别：胚囊内细胞团来源的{{胚胎干细胞(ES)}}（三胚层多能）；各器官已分化组织内的{{成体干细胞}}；核重编码而成的{{iPS细胞}}。","成体干细胞龛定位：表皮在{{基底细胞与毛囊隆突}}，小肠在{{隐窝底Paneth上方}}，肝细胞增殖受阻时由Hering管{{卵圆/祖细胞}}替代。","组织再生规律：被覆上皮靠邻近基底细胞移行覆盖；切右肝后左肝代偿增生；肾切除引起剩余肾单位近曲小管代偿{{肥大与增生}}。","神经再生对比：{{周围神经}}切断后远端发生髓鞘轴突崩解，由{{施万细胞}}增生引导近端轴突长入；中枢神经元损坏则形成胶质瘢痕。"],"trap_note":"iPS细胞导入干性基因使病人自身体细胞核重编码，既具备类ES细胞的多向分化潜能，又可避免胚胎伦理争议与异体免疫排斥。","quiz":{"stem":"慢性病毒性肝炎持续损害患者正常成熟肝细胞的增殖分裂能力，此时肝内仍观察到活跃的实质再生灶向肝细胞与胆管上皮双向分化。这一代偿再生储备的直接细胞来源位于：","options":["小叶中央静脉壁平滑肌去分化再建","肝血窦库普弗巨噬细胞脱颗粒转分化","Hering管处肝脏卵圆祖细胞激活","肝包膜表面被覆间皮细胞向内迁移"],"answer_idx":2,"explain":"当成熟肝细胞自身进入细胞周期受阻（如慢性肝炎或毒素抑增殖）时，定居于胆小管与肝细胞交界处Hering管的肝脏成体干细胞/卵圆祖细胞被激活，可双向分化为肝细胞与胆管细胞支持再生（P12, P27）。","remedial_node_id":"patho_repair_regeneration_potential"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_repair_growth_factors_ecm","title":"生长因子双相启动与ECM整合素调控","subject":"pathology","syllabus_refs":["syl_pathology_026"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"IL-6启动与HGF/EGF/PDGF/VEGF等生长因子经RTK-RAS驱动周期，ECM借整合素与基底膜定再生结局。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P17-P31"],"diagram_assets":[{"path":"assets/patho_repair_ecm_integrin_p23.webp","caption":"细胞外基质胶原/纤连/层粘连蛋白通过整合素黏附复合物与生长因子受体协同调控细胞增殖迁移","source_page":23}],"payload":{"steps":[{"cue":"双相增殖驱动：稳态G0期肝细胞如何克服阻滞迈向有丝分裂？","reveal":"启动期由库普弗细胞泌IL-6使肝细胞获感受态(G0→G1)；随后旁/自分泌HGF(MET)与TGF-α/EGF(EGFR)激活RTK-RAS-PI3K/MAPK信号入S期。","mechanism_tag":"IL-6启动 + RTK级联"},{"cue":"关键修复生长因子分工(表4-1)：EGF、VEGF、PDGF与TGF-β各司何职？","reveal":"VEGF促内皮增殖与通透性；PDGF与FGF趋化激活成纤维细胞；KGF/EGF促角化细胞迁移；TGF-β抑制急性炎症并强烈激活ECM合成酶。","mechanism_tag":"生长因子网络"},{"cue":"ECM三组分、硫酸肝素储库与整合素跨膜整合","reveal":"胶原(Vit C羟化与赖氨酰氧化酶交联)供张力、蛋白多糖锁水并锚定bFGF、纤连/层粘连蛋白借整合素(Integrin)与肌动蛋白骨架联动传导信号。","mechanism_tag":"ECM-整合素共信号"},{"cue":"基底膜完整性决定结局及MMP/TIMP动态改建","reveal":"Ⅳ型胶原+层粘连蛋白构成基底膜维系极性，破损即由再生转向瘢痕；MMP-1/-2/-9降解胶原而TIMP-1/-2负反馈抑制降解，失衡致纤维化。","mechanism_tag":"基底膜与MMP/TIMP"}],"takeaway":"再生是“细胞因子启动+生长因子驱动+ECM整合素支架”的三重协奏；基底膜完整性是从完全再生滑向瘢痕修复的分水岭。","quiz":{"stem":"化学毒物选择性毁损某腺上皮的基底膜网架（Ⅳ型胶原与层粘连蛋白崩解），即便邻近腺上皮细胞保留旺盛的有丝分裂能力且生长因子充足，修复最终仍走向紊乱瘢痕而非恢复正常腺体排布。其直接原因在于：","options":["缺乏整合素-基底膜锚定支架致细胞丧失极性导向","表皮生长因子无法以旁分泌模式跨越组织间隙","基底膜降解后细胞彻底丧失合成前胶原酶能力","肿瘤坏死因子即刻逆转细胞周期抑制蛋白表达"],"answer_idx":0,"explain":"细胞外基质(特别是含Ⅳ型胶原和层粘连蛋白的基底膜)不仅是物理支架，更是通过整合素决定细胞极性、定向迁移与正常组织重建的框架；基底膜一旦破坏，增生上皮失去空间导向只能走向无序瘢痕。","remedial_node_id":"histo_collagen_fibrillogenesis"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_granulation_tissue_angiogenesis","title":"肉芽组织形态、血管生成与三大作用","subject":"pathology","syllabus_refs":["syl_pathology_027"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"由新生毛细血管、增生成纤维细胞及炎细胞组成，借VEGF出芽完成抗感染、填缺损与机化。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P32-P41"],"diagram_assets":[{"path":"assets/patho_repair_granulation_lm_p39.webp","caption":"肉芽组织光镜高倍结构：大量垂直生长的新生毛细血管、成纤维细胞及炎症细胞浸润(图2-6)","source_page":39}],"payload":{"bullets":["镜下三要素：大量垂直创面生长的{{新生毛细血管}}（内皮细胞肿胀呈袢状）、增生的{{成纤维细胞}}（及肌成纤维细胞）与多种{{炎症细胞}}。","血管生成(Angiogenesis)：{{VEGF}}扩管促增殖、血管生成素促周细胞脱离、{{MMPs}}破基底膜，{{Notch}}信号筛选Tip细胞定向出芽后再募周细胞。","大体外观特征：鲜嫩{{肉红色}}、表面细{{颗粒状}}、湿润柔韧；因新生血管壁薄而{{触之易出血}}，且无神经纤维支配故{{无疼痛感}}。","三大有利作用：①{{抗感染}}保护创面；②{{填补}}创口与组织缺损；③{{机化或包裹}}坏死物、血栓、炎性渗出物及其他异物。","三大不利隐患：①原有实质功能丧失；②抗拉力弱致心梗后{{室壁瘤}}；③成熟瘢痕收缩引起腔道狭窄或关节障碍。"],"trap_note":"警惕概念混淆：“肉芽组织”(granulation tissue，正常修复中间物) ≠ “肉芽肿”(granuloma，慢性特殊炎以巨噬/上皮样细胞结节为主)！","quiz":{"stem":"临床创面换药时见创基呈鲜嫩肉红色细颗粒状、湿润柔软，棉签轻拭即渗鲜血但患者毫无痛感。以下关于该组织病理学成分及生理功能的推断，最准确的是：","options":["由致密平行Ⅰ型胶原束构成以提供极强抗张力","含大量上皮样细胞与多核巨细胞属结核肉芽肿","因毛细淋巴管全面闭塞且富含感觉神经末梢","由新生袢状毛细血管及成纤维细胞组成可抗感染"],"answer_idx":3,"explain":"鲜嫩肉红颗粒状、无痛易出血是肉芽组织的典型大体特征：其内无神经纤维故不痛，富含薄壁新生毛细血管网故呈肉红颗粒且触之易出血，协同炎细胞与成纤维细胞完成抗感染、填补缺损与机化。","remedial_node_id":"histo_lct_fibroblast"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_fibrous_scar_remodeling","title":"瘢痕组织成熟、并发症与器官纤维化","subject":"pathology","syllabus_refs":["syl_pathology_027"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肉芽闭塞血管胶原化转为苍白硬瘢痕；过度形成致瘢痕疙瘩，TGF-β↑叠加TIMP↑致器官纤维化。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P33,#P42-P45,#P53-P57,#P60-P68"],"payload":{"steps":[{"cue":"第1步：肉芽组织如何改建为成熟瘢痕(Scar)？","reveal":"炎症消退→毛细血管闭塞减少→成纤维细胞转为稀疏纤维细胞→大量平行/交错致密胶原束积聚，外观转灰白半透明、质硬韧、缺弹性但抗拉力强。","mechanism_tag":"血管退化 + 胶原致密化"},{"cue":"第2步：皮肤愈合三大失衡并发症（不足、挛缩与瘢痕疙瘩）","reveal":"形成不足致伤口裂开/溃疡；过度致瘢痕收缩(关节/瓣膜畸形)与粘连；胶原过盛玻变且向周围正常皮肤“蟹足样”侵袭越界生长称瘢痕疙瘩(Keloid)。","mechanism_tag":"瘢痕形成失衡"},{"cue":"第3步：慢性实质器官纤维化的四步细胞-基质恶性环(P60-P68)","reveal":"持续损伤(ROS/MMP-2破支架)→巨噬细胞/T细胞泌TGF-β1、PDGF、IL-13→激活肝星状/肾系膜/肺间叶细胞狂产ECM，叠加MMP-2↓与TIMP↑致器官硬化。","mechanism_tag":"TGF-β/TIMP器官纤维化"}],"takeaway":"瘢痕以牺牲弹性换取拉力；若慢性炎症不息，TGF-β驱动间叶活化叠加TIMP↑锁死MMP降解，最终将实质器官推向不可逆纤维化。","quiz":{"stem":"慢性肾小球肾炎与长期肝淤血虽始动病因迥异，最终却共同走向肾小球硬化或心源性肝硬化。以下最准确概括此类器官纤维化ECM净积聚双翼失衡机制的是：","options":["大量中性粒细胞释放弹性蛋白酶持续消融胶原","TGF-β促间叶合胶原兼TIMP抑MMP","内皮细胞通透性骤降彻底阻断了生长因子渗入","成熟纤维细胞停止分泌纤连蛋白改行凋亡程序"],"answer_idx":1,"explain":"器官纤维化并非单纯细胞增生，而是“合成↑ + 降解↓”的双翼失衡：慢性炎症巨噬细胞释放TGF-β1/PDGF等激活肝星状细胞或肾系膜细胞大量合成ECM，同时基质金属蛋白酶抑制因子TIMP↑抑制MMP-2胶原降解（P24, P62-P68）。","remedial_node_id":"patho_granulation_tissue_angiogenesis"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_wound_healing_first_vs_second","title":"皮肤创伤一期愈合 vs 二期愈合鉴别","subject":"pathology","syllabus_refs":["syl_pathology_027"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"依组织缺损、边缘整齐度与感染决定一期线状瘢痕还是二期大量肉芽伴肌成纤维细胞伤口收缩。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P35,#P46-P50"],"diagram_assets":[{"path":"assets/patho_repair_wound_healing_p48.webp","caption":"皮肤创伤一期愈合(左)与二期愈合(右)在24h、3-7天及数周的肉芽量与伤口收缩时序对比","source_page":48}],"payload":{"columns":["对比维度","一期愈合 (First intention)","二期愈合 (Second intention)"],"rows":[["创面条件与典型例","缺损少、创缘整齐、对合严密、无感染(如无菌手术切口)","缺损大、创缘不齐哆开、常伴坏死与感染(如压疮/皮肤溃疡)"],["炎症反应与肉芽量","炎症轻；仅需少量肉芽组织于24–48h后填平细隙","炎症重；需先清创排坏死，随后长出大量肉芽自底向上填平"],["伤口收缩(3–10天)","几乎无明显伤口收缩","明显伤口收缩（由肉芽内肌成纤维细胞牵拉边缘缩小创面）"],["愈合时间与瘢痕","愈合快（约1–2周拆线），遗留整齐细小线状瘢痕","愈合慢，形成大而不规则瘢痕，常伴明显局部功能障碍"]],"quiz":{"stem":"深大开放性压疮溃疡（二期愈合）在第3至10天期间创面边缘明显向心性缩小达50%以上，远超过同期表皮细胞有丝分裂推进速度。驱动这一特征性缩小现象的主要效应细胞是：","options":["表皮基底层的黑色素细胞分泌收缩因子","中性粒细胞释放胶原酶直接拉紧真皮网架","肉芽组织内含肌丝的肌成纤维细胞主动牵拉","新生毛细血管内皮平滑肌发生痉挛性闭塞"],"answer_idx":2,"explain":"二期愈合因组织缺损大，3–10天达高峰的“伤口收缩”主要依靠肉芽组织中分化的肌成纤维细胞(myofibroblast)收缩其胞质内肌动蛋白微丝，直接将创缘向中心牵拉以减小缺损面积。","remedial_node_id":"patho_granulation_tissue_angiogenesis"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_fracture_healing_and_factors","title":"骨折愈合四期与影响修复内外因素","subject":"pathology","syllabus_refs":["syl_pathology_027"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"血肿形成→纤维性骨痂→骨性骨痂→改建四期演进；Vit C缺/激素/感染阻断胶原羟化与骨痂愈合。","source_slides":["基础医学概论 修复 基础 20241103上传.pdf#P20,#P51-P52,#P58-P59"],"diagram_assets":[{"path":"assets/patho_repair_fracture_callus_p59.webp","caption":"骨折愈合四期过程模式图：血肿形成→纤维性骨痂形成→骨性骨痂形成→骨痂改建(图2-10)","source_page":59}],"payload":{"steps":[{"cue":"第1–2期：血肿形成 → 纤维性骨痂（软骨痂机化桥接）","reveal":"骨髓/骨膜血管破裂于24–48h凝成血肿；随后肉芽组织长入机化，骨膜内外成骨/软骨母细胞增生形成软骨与胶原组成的纤维性骨痂暂连断端。","mechanism_tag":"血肿机化 + 软骨痂"},{"cue":"第3–4期：骨性骨痂 → 骨痂改建重塑（恢复解剖连续性）","reveal":"纤维/软骨骨痂经膜内与软骨内骨化转为编织骨性骨痂；随负重应力由破骨吸收多余骨痂、成骨细胞改建为致密板层骨并重通骨髓腔。","mechanism_tag":"骨化 + Wolff改建"},{"cue":"全身因素：营养(Vit C/蛋白)、激素与循环代谢如何左右修复？","reveal":"蛋白与Vit C缺乏阻断成纤维细胞前胶原脯/赖氨酸羟化，致胶原脆断裂开；过量糖皮质激素抑制炎症与成纤维；老年、糖尿病及淤血水肿延缓修复。","mechanism_tag":"全身调控与Vit C"},{"cue":"局部因素：感染、异物与骨折复位固定对结局的决定作用","reveal":"局部感染是最常见延迟因素（化脓毁损肉芽）；异物存留引持续炎症；骨折端频繁机械摩擦活动阻碍骨痂骨化，可遗留纤维性“假关节”。","mechanism_tag":"局部因素与假关节"}],"takeaway":"骨是少数可完美再生重塑的特殊结缔组织，但前提是及时清创抗感染、坚强固定消除摩擦，并保证充足蛋白质、血供与Vit C支撑胶原羟化。","quiz":{"stem":"长期严重营养不良兼缺乏新鲜蔬果的术后患者，无菌手术切口虽未化脓感染，却在术后第10天拆线时突发创缘无力裂开，镜下肉芽胶原极细少且易脆断。此全身营养缺陷直接截断了胶原合成的哪一关键生化步？","options":["细胞核内mRNA剪接障碍致前α链翻译终止","内质网前胶原脯/赖氨酸羟化受阻难成稳固螺旋","高尔基体囊泡微管停运使前胶原完全无法胞吐","胞外基质MMP-1过度活化瞬间溶解新生骨痂"],"answer_idx":1,"explain":"维生素C是脯氨酰羟化酶与赖氨酰羟化酶维持Fe²⁺活性所必需的辅因子；Vit C严重缺乏（坏血病）使前胶原链无法羟化形成稳定氢键与赖氨酰氧化酶交联，肉芽胶原纤维脆弱无抗张力，直接导致手术切口裂开（P20, P52）。","remedial_node_id":"histo_collagen_fibrillogenesis"}},"added_at":"2026-11-17T15:58:56+08:00"},{"id":"patho_inflam_overview_lesions","title":"炎症本质、四类致炎因子与三大基本病变","subject":"pathology","syllabus_refs":["syl_pathology_021"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"具有血管系统的活体组织对四类致炎因子的防御反应，以血管反应为中心并发变质、渗出与增生。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P9-P18","基础医学概论 炎症 基础 20241103上传.pdf#P32-P33","基础医学概论 炎症 基础 20241103上传.pdf#P41"],"diagram_assets":[{"path":"assets/patho_inflam_overview_p10.webp","caption":"图4-1 炎症反应多步骤总览：前哨细胞识别刺激→释放介质→血管反应与白细胞渗出→清创修复","source_page":10}],"payload":{"bullets":["本质与中心环节：具有{{血管系统}}的活体组织对损伤因子发生的防御反应，以{{血管反应}}（炎性渗出+炎细胞浸润）为中心环节。","四类致炎因子：{{生物性因素}}（最常见感染，可繁殖播散成传染病）、理化因素、{{组织坏死与异物}}及超敏反应（免疫异常）。","三大基本病变：{{变质}}（局部变性坏死，损伤性变化）、{{渗出}}（液体与白细胞出血管，最具特征性）与{{增生}}（生长因子促实/间质限扩修复）。","双刃剑利与弊：有利在于抗感染防御、稀释中和毒素及{{组织修复}}；有害在于附带损伤、脓毒症、过多压迫粘连乃至{{纤维化与化生}}。","疾病演进规律：炎症普遍存在且逐步进化，认知由红肿热痛现象深入至{{组织-细胞-分子}}（如胃溃疡确立幽门螺杆菌感染病因）。"],"trap_note":"变质是损伤、渗出是急性核心特征、增生是防御限扩与修复；三者同存但随病程与因子侧重各异。","quiz":{"stem":"无血管分布的角膜中央上皮层受轻微机械损伤后，其本身为何无法直接启动典型炎症渗出反应？","options":["角膜上皮缺乏神经末梢故无法感知疼痛信号","角膜损伤不释放花生四烯酸等致炎介质分子","角膜中央缺乏血管床无法完成血管渗出反应","角膜上皮属于永久细胞完全丧失增生修复能力"],"answer_idx":2,"explain":"炎症定义为“具有血管系统的活体组织对损伤因子的防御反应”，血管反应是炎症的中心环节；无血管组织须依赖周边角膜缘血管充血渗出才出现炎细胞浸润。","remedial_node_id":"patho_necrosis_types"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_vascular_cascade","title":"急性炎症血流动力学与血管通透性机制","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"细动脉先短暂收缩再扩张加速，随后血浆渗出致血流变慢停滞，四大内皮机制推高通透性。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P109-P112"],"diagram_assets":[{"path":"assets/patho_inflam_hemodynamics_p109.webp","caption":"图4-3 急性炎症血流动力学五阶变化：扩张加速→血浆渗出变慢→白细胞游出→显著停滞","source_page":109},{"path":"assets/patho_inflam_permeability_p110.webp","caption":"图4-4 血管通透性增加四机制：A内皮收缩、B内皮损伤、C穿胞增强、D再生内皮未成熟","source_page":110}],"payload":{"steps":[{"cue":"致炎刺激瞬间触发何种短暂神经反射，随后由化学介质主导转入充血？","reveal":"先出现数秒至数分钟的细动脉短暂收缩（神经轴突反射，快而短），随即转为细动脉及毛细血管扩张、血流加速（介质主导，红与热的形态基础）。","mechanism_tag":"缩→扩加速"},{"cue":"微循环扩张后为何反而由“血流加速”逆转为“血流减慢乃至停滞(Stasis)”？","reveal":"血管通透性升高使富含蛋白血浆大量渗出→管内血液浓缩、红细胞缗钱状聚集及黏稠度骤增→血流速度显著减慢乃至停滞，并挤压白细胞靠边。","mechanism_tag":"浓缩停滞"},{"cue":"速发型短暂渗出（组胺/缓激肽）与烧伤/强毒素导致的速发持续渗出在微血管受累部位上有何不同？","reveal":"前者触发细静脉内皮细胞收缩拉大间隙（速发短暂数分钟）；后者直接造成内皮细胞坏死脱落，累及全部微循环且持续数小时至数天。","mechanism_tag":"收缩 vs 损伤"},{"cue":"除内皮收缩与直接/白细胞介导损伤外，还有哪两条通路推高通透性？","reveal":"VEGF等诱发细静脉内皮细胞内小泡穿胞作用增强；修复期新生毛细血管内皮细胞间连接尚不成熟，同样易发生通透性增高。","mechanism_tag":"穿胞与新生"}],"takeaway":"细动脉先扩流推高流体静水压，继而血浆浓缩致Stasis，伴细静脉收缩或全微循环损伤把高蛋白渗出物推出管外。","quiz":{"stem":"Ⅱ度皮肤烧伤创面在伤后迅速出现水疱且渗液持续达数日之久，其微血管通透性升高的主导机制是？","options":["全部微循环血管内皮细胞发生直接坏死脱落","细静脉内皮细胞受组胺刺激出现一过性收缩","修复期新生毛细血管内皮连接尚未发育成熟","内皮细胞受VEGF诱导发生囊泡穿胞作用增强"],"answer_idx":0,"explain":"组胺诱导的内皮细胞收缩仅累及细静脉且维持数分钟（速发短暂反应）；严重烧伤或强毒素引起直接内皮损伤，波及细动脉、毛细血管和细静脉全部微循环，持续数小时至数天。","remedial_node_id":"histo_lct_mast_cell"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_exudate_vs_transudate","title":"炎性渗出液 vs 非炎性漏出液鉴别","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"渗出液因通透性升高呈现蛋白\u003e30g/L、比重≥1.018且易自凝；漏出液因静水压或胶体压失衡呈低蛋白清亮。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P19-P23"],"diagram_assets":[{"path":"assets/patho_inflam_exudate_transudate_p21.webp","caption":"Figure 3-2 正常微血管 Starling 平衡 vs 炎性内皮间隙增大渗出 vs 非炎性静水压/胶体压失衡漏出","source_page":21}],"payload":{"columns":["鉴别维度","炎性渗出液 (Exudate)","非炎性漏出液 (Transudate)"],"rows":[["成因与本质","炎症致血管通透性↑，内皮间隙增宽（胸/腹膜炎）","非炎性Starling失衡：静水压↑(心衰)或胶体压↓(肝肾)"],["蛋白与比重","蛋白 \u003e30 g/L（含纤维蛋白原）· 比重 ≥1.018（多\u003e1.020）","蛋白 \u003c30 g/L（白蛋白为主）· 比重 \u003c1.018"],["细胞与外观","细胞数常 \u003e500×10⁶/L · 外观浑浊、易自凝、李凡他(+)","细胞数常 \u003c100×10⁶/L · 外观清亮、不自凝、李凡他(-)"],["病理利与弊","利：稀释毒素、供营养抗体补体、纤维蛋白网防扩及淋巴回流免疫；弊：压迫重要脏器、机化粘连","单纯液体积聚致压迫症状，无抗炎清创及免疫防御效应"]],"quiz":{"stem":"肝硬化腹水患者突发剧烈腹痛与高热，腹水穿刺液呈浑浊且静置自凝、蛋白38 g/L、细胞计数860×10⁶/L，最支持何种变化？","options":["门静脉流体静水压进一步骤升引发单纯漏出增加","低白蛋白血症导致血浆胶体渗透压持续下降","腹腔淋巴管受肿瘤压迫造成非炎性乳糜漏出","继发细菌性腹膜炎引起血管通透性增高渗出"],"answer_idx":3,"explain":"肝硬化基础腹水原本为低蛋白（\u003c30 g/L）、细胞稀少（\u003c100×10⁶/L）、清亮不凝的漏出液；一旦蛋白升至\u003e30 g/L、细胞\u003e500×10⁶/L且浑浊易自凝，提示继发感染使微血管通透性升高并渗出纤维蛋白原，已转化为渗出液。","remedial_node_id":"patho_edema_mechanisms"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_aa_mediators","title":"花生四烯酸代谢双支与细胞源炎症介质","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肥大细胞预存组胺率先启动H1扩血管，继而AA经COX/LOX双支与TNF/IL-1/IL-6放大或制动炎症。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P128","基础医学概论 炎症 基础 20241103上传.pdf#P130-P133","基础医学概论 炎症 基础 20241103上传.pdf#P135"],"diagram_assets":[{"path":"assets/patho_inflam_aa_mediators_p132.webp","caption":"图4-7 花生四烯酸代谢网络：PLA₂、COX(PG/TXA₂)、5-LOX(白三烯)与12-LOX(脂质素LXA₄/B₄)","source_page":132}],"payload":{"steps":[{"cue":"损伤初期为何无需转录合成即可在数分钟内引发微动脉扩张与细静脉渗出？","reveal":"肥大细胞/嗜碱粒细胞/血小板颗粒预存组胺（及5-HT），经创伤/IgE/C3a/C5a/P物质触发速释，结合内皮H1受体扩细动脉并缩细静脉内皮。","mechanism_tag":"颗粒预存速释"},{"cue":"细胞膜磷脂释放花生四烯酸(AA)后，COX通路如何调控血管张力、通透与血栓？","reveal":"类固醇抑制磷脂酶A₂；COX-1/2（NSAIDs阻断）生成PGI₂（扩血管抑血小板）、PGE₂/PGD₂（扩血管、增通透、致热致痛）及TXA₂（缩血管促聚集）。","mechanism_tag":"COX前列腺素"},{"cue":"当AA改走5-脂质氧合酶(5-LOX)与12-脂质氧合酶分支，分别产生何种相反免疫效应？","reveal":"5-LOX产生LTB₄（强白细胞趋化）及LTC₄/D₄/E₄（支气管痉挛与强增通透）；12-LOX产生脂质素LXA₄/LXB₄，抑制中性粒细胞黏附趋化以制动消退。","mechanism_tag":"LOX趋化与制动"},{"cue":"TNF/IL-1/IL-6及PAF/NO如何把局部血管反应升级为全身急性期防御或休克？","reveal":"局部上调内皮黏附分子与趋化因子、增强通透性；全身作用于下丘脑致热、肝合CRP及骨髓造血；过高TNF引发低心排、血栓与骨骼肌胰岛素抵抗。","mechanism_tag":"细胞因子放大"}],"takeaway":"细胞源介质凭“预存颗粒速发 + 膜AA脂质接力 + 细胞因子级联”精密控制炎症启停与血管重塑。","quiz":{"stem":"部分哮喘患者服用阿司匹林抑制COX-1/COX-2后反而诱发剧烈支气管痉挛与气道水肿，其花生四烯酸代谢流最可能转向何分支？","options":["糖皮质激素通路激活并生成大量脂质素A₄","5-脂质氧合酶途径生成过量LTC₄/D₄","血栓素合酶途径过量生成缩血管因子TXA₂","内皮一氧化氮合酶过度激活释放大量一氧化氮"],"answer_idx":1,"explain":"阿司匹林阻断环氧合酶(COX)后，未消耗的花生四烯酸底物分流进入5-脂质氧合酶(5-LOX)途径，生成大量LTC₄、LTD₄、LTE₄，强烈收缩支气管平滑肌并升高微血管通透性。","remedial_node_id":"histo_lct_mast_cell"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_plasma_mediators","title":"细胞源 vs 血浆源三大炎症介质系统","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"肝脏合成的血浆前体经蛋白酶水解激活为激肽、凝血纤溶与补体三大系统，与细胞源介质协同放大。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P128-P130","基础医学概论 炎症 基础 20241103上传.pdf#P134-P135"],"payload":{"columns":["介质系统/来源","核心激活与关键分子","主导炎症效应谱"],"rows":[["激肽-缓激肽系统（血浆）","组织损伤激活XII因子(Hageman因子)→激肽释放酶→缓激肽","强烈增加血管通透性、扩张血管与致痛（半衰期极短，受激肽酶快速灭活）"],["凝血-纤溶系统（血浆）","XII因子同步启动凝血酶原→凝血酶，纤溶酶降解纤维蛋白产生FDP","凝血酶促血小板聚集与白细胞黏附；纤维蛋白网限扩，FDP增通透并具趋化性"],["补体系统（血浆）","经典(抗体)/旁路(微生物)/凝集素(MBL)三途径均裂解C3产C3a/C3b/C5a/MAC","C3a与C5a为过敏毒素促肥大细胞脱颗粒；C5a强趋化；C3b调理吞噬；C5b-9 MAC溶菌"],["血浆源 vs 细胞源共性","肝脏合成前体经水解活化 vs 细胞颗粒储存或即刻合成","多经靶细胞受体介导并诱发次级介质级联放大，释放后半衰期短暂以防失控"]],"quiz":{"stem":"若患者因遗传性缺陷完全缺乏血浆补体C3成分，在细菌急性感染时其炎症局部哪组效应将同时明显受损？","options":["C3b介导的调理吞噬与C5a介导的白细胞趋化","组胺结合H1受体的细静脉收缩与一氧化氮扩管","XII因子激活的缓激肽致痛与血小板聚集反应","COX酶催化生成PGE₂引发的下丘脑调定点发热"],"answer_idx":0,"explain":"补体经典、旁路与凝集素三条激活途径均汇集于C3裂解；缺乏C3既无法在菌体表面沉积C3b行使调理吞噬，也不能形成C5转化酶产生C5a与C5b-9 MAC，导致趋化、调理和溶菌同步瘫痪。","remedial_node_id":"patho_inflam_aa_mediators"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_leukocyte_emigration","title":"白细胞渗出瀑布：黏附游出与趋化导航","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"血流变慢促白细胞边集，经选择素滚动、趋化因子激活整合素稳黏、PECAM-1游出并沿梯度趋化定位。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P113-P118","基础医学概论 炎症 基础 20241103上传.pdf#P127"],"diagram_assets":[{"path":"assets/patho_inflam_leukocyte_cascade_p114.webp","caption":"图4-5 中性粒细胞渗出分子瀑布：选择素滚动→趋化因子激活整合素稳黏→PECAM-1游出→趋化","source_page":114}],"payload":{"steps":[{"cue":"血流停滞后白细胞靠向血管壁，依靠何种低亲和力配受体对完成可逆“滚动”？","reveal":"组胺/凝血酶令Weibel-Palade小体P-选择素上膜，TNF/IL-1诱导E-选择素表达，结合白细胞唾液酸化Lewis X实现滚动（缺此糖基致LAD-2型）。","mechanism_tag":"选择素滚动"},{"cue":"滚动的白细胞如何从短暂磕碰切换为抵抗血流的“稳定黏附”？","reveal":"内皮表面呈递的趋化因子经GPCR发出由内向外信号，使白细胞整合素(LFA-1/Mac-1/VLA-4)转呈高亲和构象，紧扣内皮ICAM-1/VCAM-1（缺CD18致LAD-1）。","mechanism_tag":"整合素稳黏"},{"cue":"牢牢贴附的白细胞如何穿越内皮细胞连接并突破血管基底膜？","reveal":"借助内皮与白细胞共有的同型分子PECAM-1(CD31)穿过内皮间隙，再分泌胶原酶局部分解血管基底膜，以阿米巴样运动游出血管进入间质。","mechanism_tag":"PECAM-1游出"},{"cue":"游出血管后的白细胞为何能精准朝病灶聚拢而非盲目乱撞？何谓“趋化作用”？","reveal":"白细胞向化学刺激物做定向运动即趋化作用：外源细菌甲酰肽与内源C5a/LTB₄/IL-8招引中性粒与单核，ECF-A/前列腺素则定向趋化嗜酸性粒细胞。","mechanism_tag":"趋化定向"}],"takeaway":"白细胞渗出是炎症最具特征的改变，依“边集→选择素滚动→整合素稳黏→PECAM-1游出→化学趋化”逐级锁死完成。","quiz":{"stem":"某患儿自幼反复发生无脓液形成且脐带脱落延迟的严重细菌感染，流式细胞术提示白细胞表面CD18(β₂整合素)缺失，其白细胞渗出障碍阻断在？","options":["吞噬溶酶体与初级溶酶体膜融合障碍","内皮细胞P-选择素释放与白细胞初始滚动","白细胞高亲和力整合素介导的稳定黏附","NADPH氧化酶生成活性氧呼吸爆发杀菌"],"answer_idx":2,"explain":"I型白细胞黏附缺陷症(LAD-1)源于β₂整合素CD18链基因突变；白细胞虽能借选择素实现边集与滚动，但无法转呈高亲和整合素结合ICAM-1完成稳定黏附与游出，故病灶局部无法形成脓液。","remedial_node_id":"patho_inflam_vascular_cascade"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_phagocytosis_killing","title":"白细胞吞噬杀菌（MPO-ROS）与缺陷病","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"调理识别吞入后形成吞噬溶酶体，依赖NADPH氧化酶-MPO产生HOCl杀菌，辅以溶酶体酶与NETs。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P120-P127"],"diagram_assets":[{"path":"assets/patho_inflam_phagocytosis_ros_p122.webp","caption":"图4-6 白细胞吞噬过程与杀菌机制：识别吞入→吞噬溶酶体融合→NADPH氧化酶及MPO产HOCl","source_page":122}],"payload":{"steps":[{"cue":"白细胞如何在不误伤正常细胞的前提下识别病原体并形成吞噬溶酶体？","reveal":"IgG Fc或补体C3b等调理素包被病原体后与吞噬受体结合→细胞膜包绕成吞噬体并与初级溶酶体融合为吞噬溶酶体（Chediak-Higashi综合征融合受损）。","mechanism_tag":"调理与融泡"},{"cue":"氧气依赖性“呼吸爆发”中最强效的杀菌分子是什么？缺少其关键酶会引发何病？","reveal":"膜NADPH氧化酶产O₂⁻与H₂O₂，再由嗜天青颗粒髓过氧化物酶(MPO)催化H₂O₂+Cl⁻→HOCl（次氯酸）最强杀菌，并协力iNOS产NO；NADPH氧化酶缺陷致CGD。","mechanism_tag":"MPO-HOCl杀伤"},{"cue":"不依赖氧气的溶酶体酶及细胞外陷阱(NETs)如何协同清除病原并被宿主约束？","reveal":"溶菌酶水解细菌壁酸、中性蛋白酶（受α₁-抗胰蛋白酶和α₂-巨球蛋白制约）及嗜酸粒主要碱性蛋白(MBP)杀寄生虫；中性粒排DNA网NETs捕杀胞外菌。","mechanism_tag":"非氧酶解与NETs"},{"cue":"白细胞吞噬“咬不动”的沉积物或晶体时为何会反噬宿主引起剧烈组织损伤？","reveal":"遭遇固定平面免疫复合物（如肾小球基底膜）或尖锐尿酸盐晶体破坏吞噬体膜时，大量溶酶体酶与ROS泄入胞外，造成附带组织坏死。","mechanism_tag":"酶泄附带损伤"}],"takeaway":"调理融泡是物理前提，MPO-H₂O₂-HOCl系统构筑最强氧杀伤火力，而溶酶体酶外泄则成组织附带损伤推手。","quiz":{"stem":"慢性肉芽肿病(CGD)患儿的中性粒细胞能正常游出并吞入细菌，却反复死于过氧化氢酶阳性菌感染，其分子缺陷位于？","options":["唾液酸化Lewis X缺失阻碍初始滚动","PECAM-1缺失致使穿内皮游出停滞","溶酶体融合蛋白缺陷引发巨型颗粒沉积","吞噬细胞NADPH氧化酶缺陷致爆发受阻"],"answer_idx":3,"explain":"CGD因吞噬细胞NADPH氧化酶复合体亚基基因突变，无法还原O₂生成超氧阴离子与H₂O₂；过氧化氢酶阴性菌自产的少量H₂O₂尚可被宿主MPO利用，而过氧化氢酶阳性菌（如金葡菌）能分解自身H₂O₂从而逃脱MPO-HOCl杀灭。","remedial_node_id":"patho_inflam_leukocyte_emigration"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_cells_manifestations","title":"炎症细胞分工动力学与局部全身反应","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"不同炎症细胞依时相与病原精准登场，局部表现为红肿热痛功障，全身并发发热、白细胞核左移与SIRS。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P24-P31","基础医学概论 炎症 基础 20241103上传.pdf#P35-P40","基础医学概论 炎症 基础 20241103上传.pdf#P119"],"payload":{"bullets":["炎细胞时空分工：水肿峰后{{中性粒细胞}}（分叶核，细菌早期/化脓、假单胞菌可持续数天）领衔第1日，第2–3日由{{单核巨噬细胞}}接管清理。","特异细胞指针：{{淋巴与浆细胞}}（车轮状偏心核+嗜碱浆）主司病毒、梅毒与慢性免疫；{{嗜酸性粒细胞}}（强嗜酸颗粒MBP）专司寄生虫与过敏。","局部五大症状：血管扩张充血致{{红与热}}，炎性渗出水肿致{{肿}}，肿胀压迫叠加PGE₂/缓激肽/P物质刺激致{{痛}}，进而引发{{功能障碍}}。","全身发热与血象：IL-1/TNF/IL-6上移下丘脑调定点促发热、驱肝产{{CRP}}等急性期蛋白，并促骨髓释放白细胞增多及幼稚细胞{{核左移}}。","单核增生与SIRS：全身反应伴局部淋巴结/肝脾{{单核巨噬系统增生}}肿大；病毒与{{伤寒杆菌}}（阴性趋化）血白细胞不升反降；失控则致多器官SIRS。"],"trap_note":"“病毒感染、伤寒杆菌感染”外周血中性粒细胞常不增多甚至减少（阴性趋化性），切忌机械套用“凡感染白细胞必高”。","quiz":{"stem":"持续高热患者外周血白细胞总数低于正常（3.1×10⁹/L）且中性粒细胞减少，淋巴与单核相对占优，结合教材规律最应警惕？","options":["急性金黄色葡萄球菌引发的化脓性脑膜炎","伤寒杆菌或病毒感染引发的阴性趋化抑制","溶血性链球菌导致的弥漫性皮下蜂窝织炎","蛔虫感染引发的嗜酸性粒细胞急剧性升高"],"answer_idx":1,"explain":"大多数急性细菌感染刺激骨髓导致外周血中性粒细胞增多伴核左移；但病毒感染（淋巴细胞先到达）及伤寒杆菌感染（具阴性趋化作用）时，外周血中性粒细胞总量不增多甚至减少。","remedial_node_id":"pathophys_endogenous_pyrogens_core"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_acute_vs_chronic","title":"急性炎症 vs 慢性炎症核心异同","subject":"pathology","syllabus_refs":["syl_pathology_022"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"急性炎症数天至一月以变质渗出及中性粒细胞为主，慢性炎症数月至数年以增生纤维化及单核淋巴细胞为主。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P42-P44","基础医学概论 炎症 基础 20241103上传.pdf#P92"],"payload":{"columns":["比较维度","急性炎症 (Acute)","慢性炎症 (Chronic)"],"rows":[["病程与起病特征","持续几天～1月，起病急骤、反应剧烈","持续数月～数年，特征“杂、慢长、温迁跳”"],["主导基本病变","变质与渗出为主（少数如急性肾炎伴增生）","增生与修复为主（伴实质破坏与间质纤维化）"],["优势炎细胞群","中性粒细胞浸润为主（后期过渡至单核）","单核巨噬细胞、淋巴细胞与浆细胞浸润为主"],["临床病理分型","变质性炎；浆液/纤维素/化脓/出血性渗出炎（偶见伤寒肉芽肿）","一般慢性炎、肉芽肿性炎、炎性息肉与炎性假瘤"]],"quiz":{"stem":"关于急慢性炎症基本病变与病理分型的交叉规律，下列哪项判断最符合病理学实际？","options":["伤寒等急性炎症期也可出现巨噬细胞增生性肉芽肿","急性炎症绝对不会出现任何实质或间质细胞增生","肉芽肿性炎只见于病程超过数月的慢性感染阶段","慢性炎症仅存成纤维细胞增生而不伴组织破坏"],"answer_idx":0,"explain":"总体上急性以变质渗出为主、慢性以增生为主，但存在交叉例外：急性扁桃体炎与急性肾小球肾炎伴有显著增生，伤寒虽为急性炎症却因巨噬细胞吞噬演变为急性增生性肉芽肿（伤寒小结）；慢性炎也同时并存持续组织损伤。","remedial_node_id":"patho_inflam_overview_lesions"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_acute_exudative_types","title":"急性渗出性炎四大类型与绒毛心假膜","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"依渗出成分分为浆液、纤维蛋白、化脓及出血性炎，常提示血管受损递进，其中大量纤维蛋白易致机化粘连。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P46-P57","基础医学概论 炎症 基础 20241103上传.pdf#P76-P81"],"diagram_assets":[{"path":"assets/patho_inflam_fibrinous_pericarditis_p52.webp","caption":"Figure 3-14 纤维蛋白性心包炎：A 大体呈“绒毛心”；B 镜下粉红网状纤维蛋白(F)覆于心包表面(P)","source_page":52}],"payload":{"columns":["病理分型","渗出物与好发部位","代表病变与转归特点"],"rows":[["变质性炎（对照）","实质细胞变性坏死为主 · 肝/心/脑","重症病毒性肝炎肝细胞大片坏死、乙脑筛状软化灶→严重功障"],["浆液性炎","血浆白蛋白(3–5%)为主 · 皮肤/黏膜/浆膜","鼻浆液性卡他(感冒)、Ⅱ度烧伤/蛇咬皮肤水疱、关节积液→多吸收"],["纤维蛋白性炎","大量纤维蛋白原网(血管重损) · 浆膜/肺/黏膜","心包“绒毛心”、大叶肺炎灰肝期、白喉(咽固膜vs气管浮膜)/菌痢假膜→重者机化粘连(肺肉质变)"],["出血性炎","血管壁严重破损大量红细胞渗出(非独立型)","流行性出血热、钩端螺旋体病、鼠疫、肺及肠炭疽（伴其他炎变）"]],"quiz":{"stem":"大叶性肺炎灰色肝变期肺泡腔充满纤维蛋白与中性粒细胞，若因中性粒细胞渗出不足或抗胰蛋白酶过多将直接导致？","options":["肺泡渗出纤维蛋白迅速经淋巴管吸收完全复原","肺泡壁小血管严重破裂转变为出血性肺炭疽","肺泡内纤维蛋白机化形成纤维性实变即肺肉质变","胸膜脏层形成灰白色粘着紧密不可剥离的固膜"],"answer_idx":2,"explain":"少量纤维蛋白可被中性粒细胞释放的溶蛋白酶溶解清除而痊愈；若纤维蛋白过多、中性粒细胞不足或抗胰蛋白酶过多致溶解受阻，肉芽组织长入机化，在肺表现为“肺肉质变”，在胸膜心包则造成粘连闭锁。","remedial_node_id":"patho_necrosis_outcomes"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_suppurative_subtypes","title":"化脓性炎三型鉴别与窦道瘘管空洞","subject":"pathology","syllabus_refs":["syl_pathology_023"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"金葡菌凭凝固酶筑制脓膜局限成脓肿（可穿破成窦道瘘管），溶链菌凭透明质酸酶破基质致弥漫蜂窝织炎。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P58-P75"],"payload":{"columns":["化脓性炎分型","核心病原与酶学边界机制","好发部位与典型结局"],"rows":[["脓肿 (Abscess)","金葡菌产血浆凝固酶使纤维蛋白凝固限制扩散；周边肉芽建制脓膜","实质脏器与致密组织（肺/脑/肝/脾/骨/皮）；排脓成溃疡、单口盲管窦道、双口瘘管或空洞"],["蜂窝织炎 (Phlegmonous)","溶血性链球菌产透明质酸酶(降解基质透明质酸)与链激酶(溶纤维蛋白)","疏松结缔组织与运动器官（皮下丹毒、肌层、急性蜂窝织性阑尾炎），边界不清易弥漫扩散"],["表面化脓与积脓","黏膜或浆膜表面中性粒细胞渗出液化，向腔面或封闭体腔积聚","脓性卡他（尿道/支气管炎）、化脓性脑膜炎（蛛网膜下腔积脓）；体腔积脓（胸腹/胆囊/输卵管）"]],"quiz":{"stem":"为何溶血性链球菌引起的皮下或阑尾急性化脓性炎边界极其模糊且迅速沿组织间隙蔓延，而金葡菌却常形成局限脓肿？","options":["溶血性链球菌只吸引巨噬细胞而不触发中性粒渗出","溶链菌分泌透明质酸酶降解基质并溶纤维蛋白促扩散","溶血性链球菌缺乏毒素因而不能刺激周边纤维包裹","金葡菌分泌胶原酶溶解细胞外基质迫使病灶收缩"],"answer_idx":1,"explain":"疏松结缔组织基质依靠透明质酸-蛋白多糖分子筛阻挡细菌；溶血性链球菌分泌透明质酸酶分解透明质酸，并用链激酶溶解纤维蛋白网，失去物理约束而弥漫扩散；金葡菌相反靠血浆凝固酶使纤维蛋白沉积局限并诱发制脓膜。","remedial_node_id":"histo_ct_ground_substance_fluid"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_chronic_mechanisms","title":"慢性炎症M1/M2轴、息肉与炎性假瘤","subject":"pathology","syllabus_refs":["syl_pathology_024"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"巨噬与T细胞正反馈驱动M1杀伤与M2纤维化重塑，一般慢性炎可致器官硬化、炎性息肉或易误诊肿瘤的炎性假瘤。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P89-P99","基础医学概论 炎症 基础 20241103上传.pdf#P136-P141"],"payload":{"bullets":["慢性三联特征：持续致炎因子或急性迁延所致，呈{{慢性炎细胞浸润}}（巨噬/淋巴/浆细胞）、{{实质组织破坏}}及血管新生伴间质{{纤维化}}。","巨噬-T细胞互激环：激活巨噬细胞提呈抗原并分泌IL-12激活{{TH1/TH17淋巴细胞}}；T细胞反以{{IFN-γ与IL-17}}招募并经典激活巨噬细胞形成死循环。","M1 vs M2极化分岔：微生物与IFN-γ诱发{{M1经典激活}}产ROS/NO杀菌；IL-4/IL-13诱发{{M2替代激活}}泌TGF-β与IL-10抗炎并驱动纤维化。","一般慢性炎病变：实质坏死叠加纤维化致结构重构（慢肝{{假小叶}}、慢肾{{肾小球硬化}}、慢性肺间质纤维化及慢性胆囊炎）。","两类增生混淆灶：黏膜上皮腺体与间质增生向腔面突出带蒂肉样块称{{炎性息肉}}（鼻/宫颈）；多种炎细胞伴纤维增生边界清团块称{{炎性假瘤}}（肺/眼眶）。"],"trap_note":"炎性假瘤并非真性肿瘤，而是多种慢性炎细胞增生伴纤维化的境界清楚肿块，影像极易误诊为肺癌或眼眶肿瘤。","quiz":{"stem":"肺部CT发现一处境界极其清楚的孤立实性团块，临床怀疑肺癌行穿刺活检却见多种炎细胞混杂增生伴胶原纤维化，无异型性，该病变实为？","options":["高分化肺鳞状细胞癌伴间质反应性炎症","粘连于支气管黏膜带蒂突起的炎性息肉","中性粒细胞弥漫浸润的急性蜂窝织炎灶","多种慢性炎细胞伴纤维化的肺炎性假瘤"],"answer_idx":3,"explain":"炎性假瘤常见于肺与眼眶，本质是慢性炎症中多种炎细胞、成纤维细胞等成分增生伴纤维化形成境界清楚的瘤样团块，因肉眼和影像均极似恶性肿瘤而需病理活检鉴别。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_granuloma_types","title":"一般慢性炎 vs 肉芽肿性炎与肉芽肿分型","subject":"pathology","syllabus_refs":["syl_pathology_024"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"一般慢性炎呈弥漫细胞浸润与纤维化，肉芽肿性炎则由巨噬细胞演化成类上皮及多核巨细胞构成界清结节。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P90-P96","基础医学概论 炎症 基础 20241103上传.pdf#P100-P107","基础医学概论 炎症 基础 20241103上传.pdf#P139"],"diagram_assets":[{"path":"assets/patho_inflam_tb_granuloma_p102.webp","caption":"结核肉芽肿典型镜下构筑：短梭形核类上皮细胞与核呈花环状边缘排列的郎罕巨细胞","source_page":102}],"payload":{"columns":["慢性炎类型/分支","核心发病病因","标志性组织学特征"],"rows":[["一般慢性炎症","持久刺激或急性炎迁延（慢肝/慢肺/慢胆囊炎）","弥漫单核/淋巴/浆细胞浸润，伴实质细胞破坏、新生血管及广泛间质纤维化"],["感染性肉芽肿（结核等）","难消化病原+Ⅳ型迟发型细胞免疫（结核/伤寒/血吸虫/风湿/真菌）","结核结节：中央常有干酪样坏死→周围放射状类上皮细胞+边缘花环核Langhans巨细胞→外层淋巴细胞"],["异物肉芽肿 vs 结节病","难消化异物机械刺激（缝线/硅肺/痛风结晶）；结节病病因未明","异物巨细胞（多核杂乱堆聚细胞中央）；结节病见非干酪样类上皮肉芽肿"]],"quiz":{"stem":"肺活检见圆形结节：中央呈无结构伊红色坏死，周围环绕胞界不清的短梭形核细胞及边缘呈马蹄形花环核排列的巨细胞，最符合？","options":["结核分枝杆菌引起的感染性干酪肉芽肿","手术缝线残留引起的非免疫性异物肉芽肿","富含新生毛细血管与成纤维细胞的肉芽组织","伴广泛间质胶原纤维化的普通慢性间质肺炎"],"answer_idx":0,"explain":"典型结核结节由中央干酪样坏死、周围巨噬细胞演化而成的类上皮细胞（短梭形核）及核呈马蹄/花环状排列在胞质边缘的郎罕(Langhans)巨细胞、最外层淋巴细胞共同构成；异物巨细胞核杂乱分布中央，而肉芽组织是修复结构而非巨噬细胞演化结节。","remedial_node_id":"patho_granulation_tissue_angiogenesis"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_outcomes_spread","title":"炎症结局影响因素与蔓延扩散三途径","subject":"pathology","syllabus_refs":["syl_pathology_025"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"结局取决于局部血运结构与全身营养免疫治疗，分别走向愈复、迁延慢性或沿局部、淋巴、血道蔓延。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P82-P85","基础医学概论 炎症 基础 20241103上传.pdf#P88"],"payload":{"bullets":["结局两类影响因素：局部取决于{{组织结构特性}}与{{血液循环状态}}；全身取决于营养（如{{维生素C}}促胶原）、{{免疫反应}}及治疗措施。","结局一·痊愈（愈复）：病原清除、渗出吸收及再生结构功能恢复称{{完全愈复}}；缺损过大则靠{{纤维化与瘢痕替代}}完成{{不完全愈复}}。","结局二·迁延慢性：若致炎因子未能及时清除或机体抵抗力低下，急性炎症转入{{慢性炎症}}反复破坏与修复。","结局三·局部蔓延：机体抗力弱或病原毒力强时，经{{组织间隙或自然管道}}邻近扩散（如{{肾结核→输尿管结核→膀胱结核}}）。","结局三·脉管播散：侵入{{淋巴管}}随淋巴液引发局部淋巴管炎及{{淋巴结炎肿大}}；直接或经淋巴道入血则进入{{血道扩散}}。"],"trap_note":"不完全愈复依赖肉芽组织机化填补后成熟为瘢痕；若细菌突破淋巴结防线入血，则依入血物质与繁殖能力分级为血道播散四型。","quiz":{"stem":"长期严重缺乏维生素C且局部动脉硬化供血不足的腹壁切口感染患者，其炎症最容易发生哪类转归偏差？","options":["迅速经纤维蛋白溶解酶作用达成完全愈复","自动转归为单纯以浆液渗出为主的皮肤水疱","胶原羟化修复受阻并延误愈合致迁延扩散","因免疫系统过度激活立即转为异物肉芽肿"],"answer_idx":2,"explain":"维生素C是前胶原脯氨酸/赖氨酸羟化酶的必需辅因子，缺乏Vit C叠加局部血液循环障碍会严重抑制肉芽组织与胶原纤维修复，削弱抗感染屏障而致伤口久治不愈并迁延扩散。","remedial_node_id":"patho_granulation_tissue_angiogenesis"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_inflam_hematogenous_spread","title":"血道播散四型：菌血症至脓毒败血症","subject":"pathology","syllabus_refs":["syl_pathology_025"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"依据血液有无活菌繁殖、毒素中毒症状及多脏器迁徙性脓肿，严格区分菌血症、毒血症、败血症与脓毒败血症。","source_slides":["基础医学概论 炎症 基础 20241103上传.pdf#P85-P87"],"payload":{"columns":["血道播散类型","血中活菌/毒素状态","全身症状与特征病变"],"rows":[["菌血症 (Bacteremia)","少量细菌一过性入血未大量繁殖 · 血培养(+)","无全身中毒症状（如拔牙后少量口腔细菌短暂入血）"],["毒血症 (Toxemia)","细菌外/内毒素等毒性产物入血 · 血中无细菌(-)","显著全身中毒症状甚至中毒性休克，但原发菌仍留局部"],["败血症 (Septicemia)","细菌入血大量繁殖并产生毒素 · 血培养(+)","严重中毒症状+皮肤黏膜多发出血点、肝脾肿大、休克与DIC"],["脓毒败血症 (Pyemia)","化脓菌引起败血症并栓塞播散 · 血培养(+)","除败血症表现外，在肺、肝、肾、脑出现多发迁徙性脓肿与“败血脾”"]],"quiz":{"stem":"急诊患者高热寒战、皮肤多发瘀点伴中毒性休克，多次血培养均为阴性且原发咽喉局部拭子检出产外毒素的白喉杆菌，该患者属于？","options":["一过性菌血症（少量口腔菌短暂入血未繁殖）","典型毒血症（局部菌产毒素入血致休克无活菌）","急性败血症（病原菌入血大量繁殖并释放毒素）","脓毒败血症（化脓菌伴发全身多发迁徙性脓肿）"],"answer_idx":1,"explain":"毒血症的核心特征是病原菌局限于原发灶未入血繁殖（血培养阴性），但其外毒素或毒性产物吸收入血引起严重全身中毒症状甚至休克；败血症和脓毒败血症则必须有细菌入血繁殖且血培养阳性。","remedial_node_id":"patho_inflam_outcomes_spread"}},"added_at":"2026-11-17T16:29:42+08:00"},{"id":"patho_tumor_concept_characteristics","title":"肿瘤概念与肿瘤性增生四大特征","subject":"pathology","syllabus_refs":["syl_pathology_028"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"肿瘤源自正常细胞基因调控失常后的单克隆异常增生，具间变、自律、遗传与异质性。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P12-P16"],"diagram_assets":[{"path":"assets/patho_tumor_clonal_evolution_p16.webp","caption":"单克隆起源与基因不稳定性驱动肿瘤异质性亚群演进（Robbins图）","source_page":16}],"payload":{"bullets":["定义：机体局部正常细胞（含干细胞）在致瘤因素下基因调控失常，发生{{单克隆}}异常病理性增生形成新生物（常呈肿块）。","质变（{{间变}} anaplasia）：细胞向幼稚或异常方向分化导致形态功能失常；区别于{{去分化}}（失去已获成熟特征）。","{{自律性}}（autonomy）：与机体整体需要不协调、丧失生长终止信号，即使去除初始致瘤刺激仍持续相对无限增殖。","{{遗传性}}与{{异质性}}：子代稳定遗传异常表型；增殖中不断累积新突变形成侵袭、转移或低免疫原性等不同亚群。","核心鉴别：炎性或修复性增生属受控的{{多克隆}}可逆反应，去除病因可止；肿瘤性增生为失控单克隆异常演进。"],"trap_note":"“异型增生（不典型增生）”不同于肿瘤“间变”，轻中度异型增生在病因消除后有逆转可能；而肿瘤性增生中，间变是根本、自律是动力、遗传是基础、异质性赋予进展机会。","quiz":{"stem":"某宫颈活检曾见局灶鳞状上皮增生伴轻度形态改变，清除慢性感染后复查恢复正常；而另一例肿块切除前持续增大并保留突变克隆。后者区别于前者的最根本生物学特征是？","options":["细胞分裂速率短期显著加快","局部组织体积增大并形成肿块","丧失机体调控的单克隆自律增生","伴随慢性炎细胞浸润与血管扩张"],"answer_idx":2,"explain":"反应性/炎性增生也可有分裂加快、体积增大甚至形成炎性假瘤，但属多克隆受控反应，病因去除即停；唯有在基因水平失调控并获得自律性与遗传性的单克隆增生才是真性肿瘤（neoplasm）。","remedial_node_id":"patho_cellular_adaptation"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_morphology_parenchyma_stroma","title":"肿瘤大体形态与实质间质分工","subject":"pathology","syllabus_refs":["syl_pathology_030"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"肿瘤大体形态反映生长方式与部位，实体瘤由决定性质的实质与营养支持间质组成。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P18-P26"],"diagram_assets":[{"path":"assets/patho_tumor_gross_morphology_p21.webp","caption":"肿瘤常见八种大体形态：息肉、乳头、结节、多囊、多结节、菜花、溃疡及浸润型","source_page":21}],"payload":{"bullets":["大体外形取决于部位与生长方式：腔面外生呈{{息肉/乳头/菜花状}}，内陷成{{溃疡状}}（恶），实质内呈结节/分叶或树根状。","颜色与质地：一般良性及癌灰白，肉瘤灰红；脂瘤黄、血管瘤红、黑素瘤黑；硬度取决于{{实质间质比}}及钙化坏死。","大小、数目与包膜：多发性可为多中心或转移；良性常有完整{{包膜}}且界清，恶性无包膜、浸润周围组织。","{{实质}}（parenchyma）：即肿瘤细胞本身，决定肿瘤组织起源、生物学性质、分化方向、生长方式及分类命名。","{{间质}}（stroma）：由结缔组织、血管及浸润免疫细胞构成（各肿瘤间质成分相同但量异），负责营养支持、限制扩散与抗瘤反应。"],"trap_note":"肿瘤间质并无组织特异性，真正决定是腺癌还是纤维肉瘤的是实质细胞；但间质胶原多少决定质地（硬癌间质多、髓样癌间质少），肌纤维母细胞还可包绕限制癌细胞扩散。","quiz":{"stem":"病理切片中，两例乳腺癌患者肿瘤细胞均为低分化腺上皮，但甲例触诊坚硬如石（硬癌），乙例质软如脑髓（髓样癌）。造成两者大体硬度截然不同的直接结构因素是？","options":["间质纤维结缔组织含量的差异","肿瘤实质细胞的胚胎胚层来源","肿瘤表面是否形成完整纤维包膜","瘤细胞内糖原或脂肪空泡的蓄积"],"answer_idx":0,"explain":"实质决定肿瘤的组织起源与性质，而间质由成纤维/肌纤维母细胞及血管构成，各肿瘤间质种类相同而数量不同：间质纤维显著增生则成硬癌，癌巢大而间质稀少则质软如髓样癌。","remedial_node_id":"histo_lct_fibroblast"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_atypia_and_biology","title":"肿瘤细胞异型性与四大生物学特性","subject":"pathology","syllabus_refs":["syl_pathology_033"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"光镜HE异型性是诊断核心，辅以IHC/核型并整合失接触抑制、Warburg代谢及抗原特性。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P46-P61"],"payload":{"bullets":["{{结构异型性}}（良性瘤主要诊断依据）指细胞排列、极性与层序紊乱；恶性瘤叠加显著{{细胞与核异型性}}。","细胞/核异型：瘤细胞多形性或瘤巨细胞、胞质{{嗜碱性}}增强（核糖体↑）、{{核质比}}＞1:4–6、核膜厚、核仁大及病理核分裂。","诊断技术：{{HE光镜}}为最核心手段；电镜见细胞器量少（助鉴桥粒/张力原纤维等）；染色体呈非整倍体或Ph染色体t(9;22)；{{IHC}}定分化与浸润。","生理特征：体外培养丧失{{接触抑制}}（重叠生长）、获{{永生化}}细胞株潜能，且可在裸鼠等免疫缺陷动物体内成瘤。","生化与免疫：呈{{Crabtree/Warburg}}有氧糖酵解（乳酸↑）、合成代谢＞分解代谢（RNA/DNA↑），并表达诊断相关{{肿瘤抗原}}。"],"trap_note":"电镜对肿瘤超微结构的改变“主要为量上的差异，无恶性特异性特征”，但其检出的桥粒、张力原纤维或肌原纤维可协助判定分化方向；核型上良性常为二倍体（46），恶性多呈非整倍体（如41、96）。","quiz":{"stem":"在氧供充足的动脉血灌注条件下，实体恶性肿瘤细胞依然维持极高的葡萄糖摄取率并大量排出乳酸，同时伴核酸与蛋白合成亢进。该代谢重编程最直接的生物化学意义在于？","options":["完全关闭线粒体功能以阻断一切氧化反应","提高每摩尔葡萄糖分解产出的净ATP总量","降低胞内氢离子浓度以防止酸中毒与坏死","为快速增殖分流碳骨架支持合成代谢需求"],"answer_idx":3,"explain":"肿瘤在富氧下仍高通量糖酵解（Crabtree/Warburg效应），虽单分子葡萄糖产ATP效率低，却能将磷酸戊糖及糖酵解中间产物快速分流用于核酸（5-磷酸核糖）、氨基酸与脂质生物合成，体现“合成代谢大于分解代谢”。","remedial_node_id":"biochem_pasteur_warburg_coordination"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_benign_vs_malignant","title":"良性肿瘤 vs 恶性肿瘤核心鉴别","subject":"pathology","syllabus_refs":["syl_pathology_029"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"良恶性分类根本依据是对机体的危害程度，核心鉴别覆盖分化、生长、分裂象与转移。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P36-P44"],"payload":{"columns":["鉴别维度","良性肿瘤","恶性肿瘤"],"rows":[["分化与异型性","分化高、异型性小（多二倍体）","分化障碍或未分化、异型性大（常非整倍体）"],["核分裂象","无或少，仅见正常核分裂（赤道板）","多见，可出现病理性核分裂（多极/不对称）"],["生长方式与速度","膨胀性或外生性，有包膜界清；生长慢","浸润性或外生基底浸润，界不清；生长快"],["继发改变与转移","出血坏死少见；不转移，切除少复发","易出血坏死溃疡；可发生转移且易复发"],["对宿主危害与转归","危害较小（主为局部压迫阻塞或内分泌）","破坏组织器官，常并发感染、恶病质致死"]],"quiz":{"stem":"某软组织肿块穿刺镜检可见细胞大小悬殊、核深染且视野内高频出现“三极及不对称核分裂象”，边界与周围横纹肌交错不清。仅据上述形态最能直接确立诊断方向的证据是？","options":["肿块生长历时超过两年且体积大于十厘米","存在病理性核分裂象伴周围组织浸润生长","瘤细胞间偶见少量玻璃样变与灶状营养钙化","局部肿块表面出现机械压迫导致的皮肤溃疡"],"answer_idx":1,"explain":"良恶性根本分类依据是对机体危害程度；良性瘤也可体积巨大或因局部压迫引发继发改变，但病理性核分裂象（多极/不对称/顿挫）与浸润性生长是恶性肿瘤最具诊断价值的形态标志。","remedial_node_id":"patho_tumor_atypia_and_biology"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_nomenclature_carcinoma_sarcoma","title":"肿瘤命名原则与癌 vs 肉瘤鉴别","subject":"pathology","syllabus_refs":["syl_pathology_031"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"依组织起源及良恶分别冠以瘤、癌或肉瘤，癌与肉瘤在镜下巢状排列、网状纤维与转移迥异。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P27-P32"],"payload":{"columns":["对比项目","癌 (Carcinoma · 上皮恶性)","肉瘤 (Sarcoma · 间叶恶性)"],"rows":[["组织来源与发病","覆盖/腺上皮；常见（约为肉瘤9倍），多见\u003e40岁","间叶组织；相对少见，部分好发于青少年或儿童"],["大体外观特点","质较硬、色灰白、较干燥、切面颗粒或蟹足状","质软、色灰红、湿润呈鱼肉状、易出血坏死"],["镜下组织学排列","形成癌巢，实质与间质分界清楚，常伴纤维增生","肉瘤细胞弥漫分布，实质与间质分界不清、血管丰"],["网状纤维分布","仅包绕在癌巢周围，癌细胞之间无网状纤维","网状纤维穿行并包绕单个肉瘤细胞之间"],["主要转移与命名","多经淋巴道转移；命名=部位+组织+癌","多经血道转移；命名=部位+组织+肉瘤"]],"quiz":{"stem":"一例低分化恶性实体瘤在常规HE切片中难以区分上皮抑或间叶来源，嗜银网状纤维染色显示黑色纤维穿行并包绕在单个瘤细胞之间，而未形成巢周包绕格局。该结果高度支持此肿瘤属于？","options":["高分化腺癌，晚期常经门脉血道播散","未分化癌，早期必先经淋巴道引流转移","间叶源性肉瘤，临床应高度警惕血道转移","上皮源性癌肉瘤，仅局部浸润而不转移"],"answer_idx":2,"explain":"癌细胞呈巢状排列，网状纤维仅见于癌巢周围而细胞间缺如；肉瘤细胞弥漫排列与间质血管混杂，网状纤维多穿行于肉瘤细胞之间，且肉瘤以早期血道转移为主（如肺转移）。","remedial_node_id":"histo_reticular_tissue"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_precancer_cis_progression","title":"癌前病变、上皮内瘤变与原位癌演变","subject":"pathology","syllabus_refs":["syl_pathology_034","syl_pathology_042"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"非癌的癌前病变经异型增生/上皮内瘤变进展为基底膜完整的0期原位癌，突破基底膜成浸润癌。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P77-P78","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P99-P101"],"diagram_assets":[{"path":"assets/patho_tumor_cis_esophagus_p77.webp","caption":"食管原位癌：异型上皮累及全层但下方基底膜完整（左侧正常对照）","source_page":77}],"payload":{"steps":[{"cue":"第一步：哪些良性病变本身不是癌，却构成高恶变风险的“癌前土壤”？","reveal":"癌前病变（非恶性、不一定必变癌）：慢性炎症/溃疡（萎缩性胃炎、溃疡性结肠炎、慢性宫颈炎/胆囊炎）、黏膜白斑、乳腺纤维囊性病、结节性肝硬化、家族性结肠腺瘤性息肉病（FAP癌变率极高）及隐睾。","mechanism_tag":"癌前病变"},{"cue":"第二步：慢性刺激下上皮出现轻、中、重度异型增生，与上皮内瘤变如何衔接？","reveal":"异型增生（不典型增生）具细胞与结构异型性；未累及全层的轻-中度异型增生（对应低级别上皮内瘤变）去除病因后可逆转，重度异型增生进展至高级别上皮内瘤变（如CIN III/胃肠HGIN）。","mechanism_tag":"上皮内瘤变"},{"cue":"第三步：何为“原位癌（CIS）”？决定其极佳手术预后的解剖边界是什么？","reveal":"原位癌指癌变细胞占据黏膜上皮或表皮全层，但尚未穿透下方基底膜浸润黏膜下层或真皮（即0期非浸润癌）。因上皮内无血管淋巴管，完整切除后几乎不转移、预后极佳。","mechanism_tag":"基底膜守门"}],"takeaway":"癌前病变（可无/低恶变）→ 轻中度异型增生（可逆）→ 高级别上皮内瘤变/原位癌（全层癌变但基底膜完整）→ 穿透基底膜进入浸润癌。","quiz":{"stem":"食管内镜黏膜下剥离术标本镜检见鳞状上皮全层细胞极性完全丧失、核大深染且核分裂多见，但PAS染色显示上皮下方基底膜连续完整未见断端。关于该病变的精准分期与预后评估是？","options":["属0期非浸润性原位癌，局部完整切除后极少转移","已达I期早期浸润癌，需立即行全身预防性放化疗","仍属良性反应性化生，单纯随访观察即可自行消退","已存在淋巴道微转移风险，须常规清扫锁骨上淋巴结"],"answer_idx":0,"explain":"癌变累及上皮全层但基底膜完整即为原位癌（0期非浸润癌）。因为正常被覆上皮层内不含淋巴管与血管，只要尚未突破基底膜，瘤细胞便缺乏入管转移通道，彻底局部切除即可治愈。","remedial_node_id":"patho_atrophy_metaplasia_morphology"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_invasion_metastasis_cascade","title":"侵袭与转移三步级联及三大播散途径","subject":"pathology","syllabus_refs":["syl_pathology_035"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"癌细胞借钙黏蛋白下调与Ⅳ型胶原酶突破基底膜，经淋巴、血道或种植途径形成继发瘤。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P62-P76"],"diagram_assets":[{"path":"assets/patho_tumor_invasion_cascade_p64.webp","caption":"恶性肿瘤局部侵袭四步分子机制：松解连接→受体黏附→降解基膜→趋化迁移","source_page":64},{"path":"assets/patho_tumor_metastasis_cascade_p66.webp","caption":"肿瘤转移全级联：基底膜穿透→入管→免疫/血小板相互作用→外渗→血管生成与定植","source_page":66}],"payload":{"steps":[{"cue":"第一步（局部侵袭与脱离）：瘤细胞如何松解邻居并溶解穿透基底膜？","reveal":"四步侵袭：①钙黏蛋白（Cadherins）减少使细胞间连接松解脱离；②借层粘连蛋白/纤连蛋白受体锚定基膜；③分泌Ⅳ型胶原酶（MMPs）与纤溶酶原激活物降解基底膜；④在自分泌运动因子趋化下迁出。","mechanism_tag":"Detachment"},{"cue":"第二步（转运与“种子-土壤”筛选）：癌细胞沿淋巴道、血道还是体腔运行？","reveal":"癌多经淋巴道（先入引流淋巴结→经胸导管继发血道，如左锁骨上Virchow淋巴结提示胃癌）；肉瘤/晚期癌多经壁薄低压的静脉血道（门脉入肝、腔静脉入肺）；体腔表面瘤可脱落种植（胃癌→卵巢Krukenberg瘤）。","mechanism_tag":"Transportation"},{"cue":"第三步（生成）：到达靶器官的少数存活克隆如何形成肉眼可见的转移瘤？","reveal":"瘤栓粘附血管内皮后外渗，取决于“种子”（Ras/c-erbB-2/CD44高表达及TIMP↓）与“土壤”（肝肺血窦富集 vs 脾/骨骼肌/软骨少受累）；形成多个球状散在结节，表面中央坏死下陷呈“癌脐”。","mechanism_tag":"Formation"}],"takeaway":"侵袭是转移前提：钙黏蛋白丢失+Ⅳ型胶原酶破基膜 → 脱离、转运（淋巴/血道/种植）、生成 → 决定临床根治与分期。","quiz":{"stem":"一名晚期胃印戒细胞癌女性患者同时查见左侧锁骨上淋巴结肿大硬结（Virchow淋巴结）及双侧卵巢肿块伴血性腹水（Krukenberg瘤）。这两处病灶最符合下列哪对转移路径组合？","options":["双向淋巴道反流转移 与 门静脉系统血道转移","胸导管直接静脉穿孔 与 脑脊液逆行种植转移","体循环动脉栓塞转移 与 局部肌膜连续浸润","经胸导管淋巴道转移 与 腹膜腔脱落种植转移"],"answer_idx":3,"explain":"胃癌（腺癌）多经淋巴道引流沿胸导管到达左锁骨上（Virchow）淋巴结；胃壁全层受侵后癌细胞脱落至腹腔，顺重力种植于双侧卵巢形成Krukenberg瘤并常伴血性腹水。","remedial_node_id":"anat_portal_vein_system"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_grading_staging_diagnosis","title":"肿瘤分级分期与病理活检金标准","subject":"pathology","syllabus_refs":["syl_pathology_032","syl_pathology_036"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"分级评价镜下分化度，分期衡量TNM解剖播散范围；石蜡活检是肿瘤确诊最终金标准。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P33-P34","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P80-P85"],"diagram_assets":[{"path":"assets/patho_tumor_diff_grading_p48.webp","caption":"高分化、中分化与低分化腺癌：腺管结构保存度递减而异型性递增（分级I→III）","source_page":48}],"payload":{"bullets":["{{分级}}（Grading）：依恶性瘤分化程度、异型性及核分裂象分 I（高分化低恶）、II（中分化中恶）、III（低分化高恶）三级。","{{分期}}（Staging）：依原发灶大小浸润深度（{{T}}1–4）、区域淋巴结（{{N}}0–3）及远处转移（{{M}}0–1）定 UICC TNM 与 AJCC 0–IV 期。","病理诊断金标准：{{石蜡切片}}HE染色是确诊肿瘤及阐明起源、性质与浸润范围的最终依据（骨肿瘤需结合X线与临床）。","活检三式：{{切除活检}}供全面组织对比（勿挤压、速固定）；{{吸取/穿刺活检}}用于深部器官；{{冷冻切片}}15分钟内术中定性与切缘。","{{脱落细胞学}}（巴氏/HE痰或宫颈涂片）简便适合普查，但属参考性诊断（肺除外），发现异常必须行{{活组织检查}}确诊。"],"trap_note":"切勿混淆“分级”与“分期”：同一低分化（III级）癌若尚局限于黏膜内（T1N0M0 I期）仍可手术根治，而高分化（I级）癌一旦远端转移（M1 IV期）预后即显著恶化；肠道因粪便干扰一般不适用脱落细胞学。","quiz":{"stem":"某患者胸片及痰脱落细胞学涂片提示可疑鳞癌细胞，拟行肺叶切除术时术中切除可疑结节送检快速冷冻切片，术后再行常规石蜡切片。下列关于上述三项病理检查定位的叙述最准确的是？","options":["冷冻切片因固定充分，可完全替代术后石蜡终诊","冷冻切片十五分钟定术中范围，石蜡切片定最终金标准","痰涂片阳性已具组织结构证据，无需再行术后活检","穿刺吸取活检因切取组织最少，准确率高于切除活检"],"answer_idx":1,"explain":"冷冻切片利用恒冷切片机在15分钟内快速判定肿瘤良恶性及手术切缘范围以指导手术方式，但其冰晶伪影影响细节，仍以术后常规石蜡切片HE染色作为最终金标准；脱落细胞学异常仍需组织活检确认浸润。","remedial_node_id":"patho_tumor_benign_vs_malignant"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_oncogenes_and_ras","title":"五类原癌基因激活与Ras突变失控","subject":"pathology","syllabus_refs":["syl_pathology_037","syl_pathology_038"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"原癌基因经点突变、基因扩增或易位激活成癌基因，Ras点突变锁死GTP态持续促增殖。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P103-P110"],"diagram_assets":[{"path":"assets/patho_tumor_ras_signaling_p110.webp","caption":"Ras信号开关：突变Ras丧失GAP促GTP水解灭活能力，持续激活Raf-MAPK促进转录","source_page":110}],"payload":{"steps":[{"cue":"第一步：正常细胞增殖信号轴上的哪五类基因若发生显性激活即成癌基因？","reveal":"五类原癌基因：①生长因子（EGF/PDGF/sis）；②生长因子受体（EGFR/HER2即c-erbB-2）；③信号转导蛋白（RAS）；④核转录因子（MYC/MYB/JUN/FOS）；⑤周期素与周期素依赖激酶（Cyclin D/CDK4）。","mechanism_tag":"五类癌基因"},{"cue":"第二步：原癌基因从静止转向高活性癌蛋白的三大分子机制分别留下何种遗传印迹？","reveal":"三大激活机制：①基因扩增（如N-myc/HER2扩增形成染色体均质染色区HSR与双微体）；②染色体重排/易位（Burkitt淋巴瘤t(8;14)促MYC高表达、CML Ph染色体t(9;22)生成BCR-ABL融合酪氨酸激酶）；③点突变。","mechanism_tag":"扩增/易位/突变"},{"cue":"第三步：以K-ras点突变为例，单一碱基改变如何使细胞脱离上游生长因子独自踩死油门？","reveal":"正常Ras结合GTP活化后需内在GTPase在GAP协助下水解GTP→GDP而关闭；突变Ras丧失GTPase活性并抵抗GAP作用，永久锁死在Ras-GTP活化态，持续激活Raf-MAPK通路诱导Myc与细胞周期前进。","mechanism_tag":"Ras开关失灵"}],"takeaway":"原癌基因激活呈显性“功能获得”（单等位基因突变即可发力）：点突变/扩增/易位把五类正常增殖信号零件改装成持续开启的油门。","quiz":{"stem":"某胰腺导管腺癌检出K-RAS第12位密码子点突变，即使肿瘤微环境中无外源EGF刺激亦出现持续ERK/MAPK磷酸化。导致这一非配体依赖性信号锁死的直接分子故障是？","options":["细胞膜表面生长因子受体被快速内吞并彻底降解","突变Ras丧失GTP水解失活能力并抗GAP","核转录因子MYC蛋白发生泛素化而遭快速降解","细胞内GDP总量枯竭使Ras无法结合核苷酸"],"answer_idx":1,"explain":"Ras是膜内侧G蛋白分子开关：结合GTP呈活性态，正常依赖自身GTPase活性与GAP激活蛋白水解GTP成GDP而关闭；K-RAS点突变阻断GTP水解，使其永久滞留于活性Ras-GTP态持续向下游传递增殖信号。","remedial_node_id":"physio_signaling_receptor_matrix"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_suppressors_tp53_rb","title":"抑癌基因失活：TP53卫士与RB闸门","subject":"pathology","syllabus_refs":["syl_pathology_039"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"抑癌基因呈隐性“双打击”或甲基化失活；RB锁死E2F闸门，TP53统筹G1阻滞修复与凋亡。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P111-P113"],"diagram_assets":[{"path":"assets/patho_tumor_rb_checkpoint_p112.webp","caption":"RB分子开关：低磷酸化活态RB锚定E2F阻断S期基因，Cyclin D/CDK磷酸化使之失活","source_page":112},{"path":"assets/patho_tumor_p53_pathway_p113.webp","caption":"“基因组卫士”TP53：DNA损伤→p21阻滞/GADD45修复/Bax凋亡；失活则突变克隆扩增","source_page":113}],"payload":{"steps":[{"cue":"第一步：RB（13q14）在核内如何依靠磷酸化状态切换 G1→S 期“刹车”？","reveal":"RB以“活化的低（脱）磷酸化态”结合并扣留转录因子E2F，阻断S期基因转录；生长信号激活Cyclin D/CDK4,6使RB超磷酸化而失活，释放E2F推动跨过G1/S限制点（p16 INK4a可抑制CDK4,6护刹）。","mechanism_tag":"RB-E2F闸门"},{"cue":"第二步：“基因组卫士”TP53（17p13）监测到DNA损伤或缺氧后如何执行三线决策？","reveal":"野生型p53聚于核内激活靶基因：①上调CDK抑制剂p21停滞G1期；②启动GADD45修复DNA（成功则恢复正常）；③修复失败时上调促凋亡基因Bax启动细胞自杀，杜绝带伤分裂。","mechanism_tag":"TP53卫士"},{"cue":"第三步：抑癌基因如何失活？为何需要“两次打击”或显性负效应？","reveal":"典型抑癌基因（如家族性视网膜母细胞瘤RB）需双等位基因丢失/突变或启动子过甲基化表观沉默才彻底失刹；p53点突变后异常蛋白常聚于胞质（可与野生型形成四聚体干扰功能），使损伤细胞带着突变继续扩增。","mechanism_tag":"双等位失活"}],"takeaway":"RB把守G1→S门禁（脱磷酸化活态锁E2F），TP53统领“停周期-修DNA-促凋亡”三道防线；二者失活后肿瘤便兼获失控增殖与抗凋亡突变积累。","quiz":{"stem":"某肿瘤细胞虽无RB1基因编码区缺失，但检出CDK4基因高度扩增及p16INK4a启动子过度甲基化沉默。这一改变在G1/S检查点上产生的直接下游效应等同于？","options":["野生型p53转录活性显著上升诱导G1停滞","RB持续处于低磷酸化活化态并紧锁E2F","Bax蛋白大量表达驱动线粒体细胞色素c外漏","RB持续被超磷酸化失活并提前释放E2F转录"],"answer_idx":3,"explain":"p16正常抑制Cyclin D/CDK4,6，从而维持RB的低磷酸化活化态以扣留E2F；若p16失活叠加CDK4扩增，Cyclin D/CDK4持续把RB超磷酸化使其失活，释放E2F推动进入S期，效果等同于RB功能丧失。","remedial_node_id":"patho_tumor_oncogenes_and_ras"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_immortality_apoptosis_multistep","title":"凋亡逃逸、端粒酶永生化与多步癌变","subject":"pathology","syllabus_refs":["syl_pathology_040","syl_pathology_041","syl_pathology_045"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"Bcl-2拮抗Bax逃逸凋亡、端粒酶重激活破除衰老极限，多基因按序累积推动结肠多步癌变。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P114-P116","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P118"],"diagram_assets":[{"path":"assets/patho_tumor_colon_multistep_p116.webp","caption":"结直肠黏膜多步骤癌变：5q APC→甲基化→12p K-ras→17p TP53/18q SMAD→端粒酶","source_page":116}],"payload":{"steps":[{"cue":"第一步（凋亡调节天平失衡）：为何肿瘤细胞在缺氧与化疗压力下拒绝自我了断？","reveal":"抑制凋亡的Bcl-2（18q21，滤泡淋巴瘤t(14;18)过表达）及Bcl-XL与促凋亡的Bax/Bad（p53直接上调Bax）构成生死天平；Bcl-2过表达或p53缺失使线粒体凋亡轴静默。","mechanism_tag":"抗凋亡"},{"cue":"第二步（端粒时钟与永生化）：正常体细胞分裂有上限，癌细胞如何获得无限传代能力？","reveal":"端粒（5’-TTAGGG-3’重复序列）保护染色体末端，正常体细胞每分裂端粒缩短最终衰老死亡；约90%癌细胞重激活端粒酶补齐端粒，结合DNA修复基因缺陷（如HNPCC错配修复缺陷）实现遗传不稳与永生化。","mechanism_tag":"端粒酶永生"},{"cue":"第三步（多步骤癌变模型）：单个突变足以成癌吗？结直肠癌如何分阶段叠加突变？","reveal":"恶性肿瘤需多基因多阶段累积：正常结肠上皮→5q APC缺失→β-catenin与甲基化异常促腺上皮增生→12p K-ras突变形成腺瘤→17p TP53失活与18q SMAD2/4杂合性缺失叠加端粒酶激活→浸润性大肠癌。","mechanism_tag":"多步癌变"}],"takeaway":"成癌非一击即中：原癌激活 + 抑癌失活 + Bcl-2抗凋亡 + DNA修复失灵 + 端粒酶重激活按序接力，方跨越正常上皮到浸润癌的多道屏障。","quiz":{"stem":"若一个已发生12p K-RAS与5q APC双突变的大肠腺瘤细胞始终未能重新激活端粒酶，且保留完整的野生型TP53与错配修复系统，该腺瘤长期演进最可能受限于哪一瓶颈？","options":["染色体端粒重复序列随分裂持续缩短触发衰老停滞","细胞表面丧失钙黏蛋白并直接发生广泛的血道转移","Bcl-2蛋白表达立即清零并诱发急性液化性坏死","细胞周期被永久锁死于G0期而不能形成腺瘤息肉"],"answer_idx":0,"explain":"APC与K-ras突变可驱动结肠黏膜形成良性腺瘤（息肉），但无端粒酶重激活维持5’-TTAGGG-3’端粒长度则细胞随分裂陷入端粒危象/衰老，且野生型p53仍能在DNA严重受损时触发Bax介导凋亡，难以演变为永生化浸润癌。","remedial_node_id":"patho_apoptosis_mechanisms"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_viral_carcinogenesis","title":"人类常见致瘤病毒分子机制对比","subject":"pathology","syllabus_refs":["syl_pathology_043"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"HTLV-1(RNA)及HPV/EBV/HBV/HCV(DNA/RNA)分别经病毒癌蛋白或慢性再生劫持宿主基因。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P88-P92"],"payload":{"columns":["致瘤病毒与类型","关键致瘤蛋白/通路","典型关联人类恶性肿瘤"],"rows":[["HTLV-1（逆转录RNA病毒）","Tax蛋白激活NF-κB、IL-2/IL-2R及细胞周期蛋白，促T细胞增殖","成人T细胞白血病/淋巴瘤（ATL）"],["高危型 HPV 16/18（DNA病毒）","E6蛋白降解p53；E7蛋白结合灭活低磷酸化RB释放E2F","子宫颈鳞状细胞癌、肛门/口咽癌"],["EBV（疱疹DNA病毒）","LMP-1模拟CD40激活NF-κB及Bcl-2；助推t(8;14) MYC过表达","鼻咽癌、非洲Burkitt淋巴瘤"],["HBV（DNA）与 HCV（RNA）","HBx干扰p53/信号及病毒整合 + 慢性肝细胞坏死再生与肝硬化","原发性肝细胞癌（HCC）"]],"quiz":{"stem":"研究发现多数HPV16阳性的宫颈鳞状细胞癌患者，其肿瘤细胞内的TP53与RB1基因本身并无体细胞点突变或纯合缺失，但细胞却完全丧失了G1阻滞与DNA损伤凋亡反应。该现象的精准分子解释是？","options":["病毒Tax蛋白直接诱导两者基因启动子发生高甲基化","病毒LMP-1蛋白取代E2F与p21转录结合位点","病毒E6蛋白降解p53，同时E7蛋白结合灭活RB","病毒整合诱发9号与22号染色体发生平衡易位"],"answer_idx":2,"explain":"高危型HPV（16/18）的早期癌蛋白分工直击宿主两大抑癌核心：E6蛋白结合野生型p53并经泛素化途径将其降解；E7蛋白结合低磷酸化活化态RB使其释放E2F，因此无需基因突变即可同时废除双刹车。","remedial_node_id":"patho_tumor_suppressors_tp53_rb"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_angiogenesis_antigens_immunity","title":"肿瘤血管生成、微环境与肿瘤免疫抗原","subject":"pathology","syllabus_refs":["syl_pathology_044","syl_pathology_046"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"VEGF打破抗血管平衡使肿瘤突破2mm扩散极限，TSA/TAA驱动细胞免疫对抗并服务临床诊断。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P56-P61","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P117","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P122-P123"],"payload":{"bullets":["血管生成开关：实体瘤＞1–2 mm即缺氧，需{{VEGF}}与bFGF压倒血小板反应蛋白-1（TSP-1）、血管抑素、内皮抑素及{{TP53}}。","肿瘤新生血管内皮间隙大、基底膜缺损且无平滑肌，既供营养又极易成为瘤细胞{{入血转移}}的便利通道。","抗原分类：{{TSA}}（肿瘤特异性抗原，如突变p53、HPV E6/E7）仅见于瘤细胞；{{TAA}}（肿瘤相关抗原）在正常胚/分化组织亦微量存在。","诊断常用TAA：{{AFP}}（\u003e1000 ng/ml高度提示原发性肝癌）、{{CEA}}（大肠癌等）、PSA（前列腺癌）及过表达的HER2/neu（乳腺癌靶向标志）。","抗瘤与逃逸：以{{细胞免疫}}为主（CTL、非MHC限制性NK、巨噬细胞）；肿瘤借分泌{{TGF-β}}、下调MHC-I及诱T细胞凋亡实现免疫逃逸。"],"trap_note":"先天的免疫缺陷者肿瘤发生率可达常人200倍，AIDS或免疫抑制剂使用者亦显著上升；临床测血AFP/CEA与病理IHC检测HER2、PSA等肿瘤抗原的核心意义在于辅助诊断、靶向用药（如赫赛汀）与复发监测。","quiz":{"stem":"某微小转移瘤结节在组织中直径维持约1.5 mm并长期处于细胞增殖与凋亡持平的休眠状态；若欲使其突破该体积极限快速膨胀并提高远端再播散概率，最核心的微环境转折事件是？","options":["瘤细胞停止有氧糖酵解并重新彻底恢复氧化磷酸化","间质成纤维细胞合成I型胶原厚囊包裹隔离肿瘤巢","宿主体液免疫产生高滴度IgM抗体包被肿瘤细胞表面","缺氧诱导VEGF/bFGF压倒血管抑素促血管生成"],"answer_idx":3,"explain":"无新生血管时营养弥散极限使肿瘤停留在1–2 mm；缺氧激活促血管因子（VEGF、bFGF）胜过抑制因子（TSP-1、内皮抑素、TP53）后，结构脆弱渗漏的肿瘤血管不仅供能增殖，更提供血管内瘤栓入血途径。","remedial_node_id":"patho_granulation_tissue_angiogenesis"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_cachexia_paraneoplastic","title":"恶病质与肿瘤伴随综合征临床机制","subject":"pathology","syllabus_refs":["syl_pathology_047"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"恶病质是以极度消瘦贫血衰竭为特征的慢性消耗状态（非癌独有），伴随综合征源于异位生物活性物质。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P41","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P120-P121"],"payload":{"bullets":["{{恶病质}}（Cachexia）定义：慢性消耗性疾病导致的显著体重减轻、{{贫血}}、肌萎缩、软弱与极度衰竭状态（氧化异常、代谢物堆积）。","概念辨析：癌性恶病质常见于晚期恶性肿瘤（TNF-α等因子介导厌食与高分解），但恶病质{{非恶性肿瘤独有}}，慢性结核/重度心衰等亦可致。","良恶性一般影响：共性为局部压迫与阻塞；良性肿瘤可泌{{生理对应激素}}（如胰岛素瘤）或恶变；恶性易出血坏死感染、疼痛发热与复发。","{{肿瘤伴随综合征}}（Paraneoplastic syndrome）：约见于15%晚期病人，非肿瘤原发或转移灶直接破坏，而是分泌{{异位激素}}等物质所致。","典型伴随表型：小细胞肺癌分泌异位{{ACTH/ADH}}致库欣或低钠、鳞癌分泌{{PTH样肽}}致高钙血症，以及神经肌肉/皮肤病变（非真正骨或肾转移）。"],"trap_note":"考题高频陷阱：①把“恶病质”等价于“晚期癌症专用名词”（错！任何慢性消耗性疾病均可导致恶病质）；②将内分泌异常（如肺癌伴高血钙）误判为广泛骨转移破坏，实为肿瘤伴随综合征，切除原发瘤后症状可缓解。","quiz":{"stem":"一例肺小细胞癌患者出现明显向心性肥胖、低血钾及持续不降的高皮质醇血症，全身骨扫描与垂体MRI均未见占位或骨转移，同时伴有肌肉重度消耗与贫血。对该患者内分泌与营养衰竭的正确判读是？","options":["库欣表现属肿瘤伴随综合征，恶病质亦可见于非肿瘤慢性病","库欣表现必为脑垂体微转移灶，恶病质则是恶性肿瘤所特有","恶病质完全因异位ACTH分泌引起，仅见于呼吸系统癌肿","肺癌分泌的生理性激素压迫垂体，故术后该症状不可逆转"],"answer_idx":0,"explain":"MRI排除了垂体转移后，肺小细胞癌分泌异位ACTH引起库欣表现属于典型的肿瘤伴随综合征；而恶病质（体重锐减、贫血、明显衰竭）在晚期肿瘤中常见，但定义上属慢性消耗状态，并非恶性肿瘤专有。","remedial_node_id":"biochem_aa_pool"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_epithelial_mesenchymal_types","title":"上皮与间叶常见肿瘤谱及软组织免疫组化","subject":"pathology","syllabus_refs":["syl_pathology_048","syl_pathology_049"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"上皮肿瘤重腺管/鳞癌分型，非造血间叶肿瘤形态复杂常借IHC定分化，骨肉瘤呈Codman三角。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P125-P160"],"payload":{"columns":["组织来源","常见良性肿瘤及形态","常见恶性肿瘤及诊断要点"],"rows":[["被覆上皮","乳头状瘤（皮肤/膀胱/甲状腺，外生指状轴心）","鳞癌（角化珠/细胞间桥）、基底细胞癌（面部溃疡少转移）、尿路上皮癌"],["腺上皮","管状/囊腺（卵巢）/息肉状（结肠多发易恶）/乳腺纤维腺瘤","腺癌、黏液癌（胶冻状“粘液湖”/印戒细胞）、实性癌（硬癌vs髓样癌）"],["纤维/脂肪/脉管","纤维瘤、脂肪瘤（包膜黄软）、毛细/海绵状血管瘤（儿童错构）","纤维肉瘤、脂肪肉瘤（常见异型脂肪母细胞）；软组织瘤形态复杂多变"],["肌/骨/软骨组织","子宫平滑肌瘤、骨瘤、软骨瘤、骨巨细胞瘤（骨骺蛋壳感）","平滑肌/横纹肌肉瘤；骨肉瘤（青少年长骨干骺端X线日光放射+Codman三角）"],["IHC免疫组化鉴","明确来源及交界病变浸润：上皮标 CK/EMA","间叶标 Vimentin；肌源 Desmin/SMA；内皮 CD34；未分化癌/肉瘤必依IHC"]],"quiz":{"stem":"一名16岁男生右股骨下端疼痛肿大，X线见骨皮质破坏、日光放射状骨针及骨膜被掀起的三角形隆起（Codman三角）；另一例胃肿瘤切片见大量黏液聚积胞内将核挤向一侧。这两例肿瘤的名称与归属依次是？","options":["良性骨巨细胞瘤（上皮源） 与 胃单纯实性癌（间叶源）","骨肉瘤（非造血间叶恶性） 与 胃印戒细胞癌（腺上皮恶性）","骨软骨瘤（间叶良性） 与 胃类癌（神经内分泌肿瘤）","尤因肉瘤（淋巴造血） 与 胃多形性腺瘤（混合上皮）"],"answer_idx":1,"explain":"青少年长骨干骺端日光放射影与Codman三角是成骨肉瘤（骨肉瘤，间叶组织恶性肿瘤）的典型征象；细胞内黏液聚积将核推向边缘呈戒指状为腺癌亚型——印戒细胞癌（上皮恶性，常见于胃肠道）。","remedial_node_id":"patho_tumor_nomenclature_carcinoma_sarcoma"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"patho_tumor_special_systems_blastomas","title":"淋巴造血、神经系统及杂类与母细胞瘤规律","subject":"pathology","syllabus_refs":["syl_pathology_050","syl_pathology_051","syl_pathology_052"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"淋巴造血全为恶性，CNS良性因部位亦致命；母细胞瘤上皮神经恶而间叶良。","source_slides":["基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P32","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P44","基础医学分论（概论）-肿瘤-刘秀萍-定稿2025.11.24.pptx#P161-P164"],"payload":{"bullets":["淋巴造血系统（{{无良性肿瘤}}）：霍奇金/非霍奇金淋巴瘤、白血病、骨髓瘤全为恶性，年龄广且大多对放化疗敏感。","神经系统肿瘤：常见胶质瘤、脑膜瘤、神经鞘瘤；中枢神经系统{{特殊部位}}使组织学良性瘤亦可压迫脑干致脑疝致命，极少颅外转移。","黑痣与黑色素瘤：皮内/交界/复合痣属良性（{{交界痣}}易恶变）；恶性黑色素瘤虽以“瘤”结尾却高度恶性、常早期血道脑/肝转移。","混合瘤与畸胎瘤：涎腺{{多形性腺瘤}}（含腺+黏液软骨样）与性腺畸胎瘤均分良恶；畸胎瘤由成熟分化度决定（成熟为良、{{未成熟}}含原始神经外胚层为恶）。","母细胞瘤（-blastoma）铁律：{{上皮与神经来源}}一般为恶性（视网膜/神经/髓/肾/肝母细胞瘤）；{{间叶组织来源}}一般为良性（肌/骨/软骨母细胞瘤）。"],"trap_note":"特殊命名高频陷阱汇总：①淋巴造血无良性，白血病以“病”命名实为恶性；②黑色素瘤、精原细胞瘤、尤因瘤虽带“瘤”字却为恶性；③母细胞瘤看胚源：肾/肝/神经/髓/视网膜母细胞瘤皆恶，肌/骨/软骨母细胞瘤皆良。","quiz":{"stem":"在肿瘤总论的特殊命名与良恶性相对性规律考核中，下列四组临床诊断与生物学行为对应完全准确的一项是？","options":["软骨母细胞瘤（高度恶性） 与 成人霍奇金淋巴瘤（良性增生）","成熟囊性畸胎瘤（高度恶性） 与 垂体良性腺瘤（对宿主绝对无害）","视网膜母细胞瘤（恶性） 与 枕叶良性脑膜瘤（压迫脑疝可致死）","皮肤皮内痣（高度恶性） 与 骨母细胞瘤（早期广泛血道肺转移）"],"answer_idx":2,"explain":"上皮及神经来源母细胞瘤（如视网膜母细胞瘤）为恶性，而间叶来源（骨/软骨母细胞瘤）多良性；淋巴造血系统（霍奇金淋巴瘤）全为恶性；颅腔空间固定，组织学良性的脑膜瘤或垂体瘤仍可压迫生命中枢致死。","remedial_node_id":"patho_tumor_benign_vs_malignant"}},"added_at":"2026-11-17T16:30:13+08:00"},{"id":"histo_intro_lm_em_he_methods","title":"显微镜尺度、HE制片与立体切片判读","subject":"histology","syllabus_refs":["syl_histology_001","syl_histology_003","syl_histology_004","syl_histology_008","syl_histology_009"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"贯通光镜/特殊光镜/TEM/SEM尺度、HE酸碱染色及三维管道二维切面投影。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P4-P15","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P20"],"diagram_assets":[{"path":"assets/histo_epith_section_planes_p20.webp","caption":"图1-22 弯曲管道经横切、纵切与斜切在二维切片中呈现环状、8字形或双平行壁的立体-平面转换","source_page":20}],"payload":{"columns":["研究与观察手段","制片与成像原理","典型靶标与判读要点"],"rows":[["普通LM·石蜡HE切片","取材→固定→脱水→透明→浸蜡包埋→1–10μm切片；苏木精(碱)蓝染酸物、伊红(酸)粉染碱物","嗜碱性紫蓝(核DNA/核糖体RNA) vs 嗜酸性粉红(胞质蛋白/间质)；辅以涂/铺/磨非切片法"],["特殊LM·相差/DIC/荧光","相差/DIC利用光程折射差不需染色；荧光与激光共聚焦(针孔滤杂光)行光学断层","相差/DIC直视组织培养活细胞；荧光(DAPI染核/FITC标微丝)定位细胞分子"],["透射电镜 (TEM)","环氧树脂包埋\u003c1μm超薄切片+重金属染色，电子穿透标本按密度呈黑白灰阶","揭示亚细胞超微结构：电子致密(黑) vs 电子透亮(白)，如9+2微管与基膜双层"],["扫描电镜 (SEM)","样品表面喷镀金属膜，聚焦电子束逐点扫描激发二次/反射电子成像","仅呈现立体表面形貌（如纤毛簇、血细胞凹凸），须配“形态功能/平面立体/静动态/理论实践”四结合"]],"quiz":{"stem":"研究组织培养皿中未固定、未染色的活体神经嵴细胞迁移形态，并需连续追踪其三维立体微管骨架荧光分布，应分别优选哪组显微镜？","options":["普通明视野光镜 与 喷金扫描电镜","透射电镜超薄切片 与 骨磨片明视野","相差/DIC显微镜 与 激光扫描共聚焦","石蜡HE常规切片 与 冰冻蚀刻复型电镜"],"answer_idx":2,"explain":"相差与微分干涉差(DIC)显微镜利用未染色活细胞各部折射率差异形成明暗反差，是观察培养活细胞的首选；激光扫描共聚焦借针孔阻挡焦平面外杂光进行三维光学断层荧光重建（见P10–P12）。","remedial_node_id":"physio_research_levels_methods"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_histochem_ihc_ish_comparison","title":"PAS组织化学、免疫组化与原位杂交","subject":"histology","syllabus_refs":["syl_histology_005","syl_histology_006","syl_histology_007"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"依化学显色、抗原抗体结合及碱基互补三大分子机制，原位精确定位糖类、蛋白与核酸。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P16-P19"],"payload":{"columns":["原位检测技术","核心分子反应原理","靶标物质、标记物与典型应用"],"rows":[["组织化学 (以PAS为例)","过碘酸氧化多糖产生醛基，再与希夫(Schiff)试剂反应生成紫红色产物","检测糖类、蛋白多糖、脂质及酶；精准显示肝细胞糖原、杯状细胞黏液与基膜(PAS阳性)"],["免疫组织/细胞化学 (IHC)","利用特异性抗原与抗体高亲和力结合，再通过标记显色定位组织细胞内抗原","检测多肽与蛋白质；标记荧光素(FITC)、HRP-DAB棕染或胶体金(EM)，如区分胰岛A/B/D细胞"],["核酸原位杂交 (ISH/FISH)","两条核苷酸单链按A-T/U、C-G碱基互补配对形成杂交双链","定位特定DNA基因或mRNA表达；用核素/荧光素(FISH)/生物素/地高辛标记探针测核型或病毒DNA"]],"quiz":{"stem":"小肠常规HE切片中杯状细胞顶部呈浅淡空泡而不着色，若改用过碘酸-希夫(PAS)反应则呈现鲜明紫红色，其关键化学机制在于：","options":["荧光标记多肽抗体与黏液素表位共价结合","过碘酸氧化糖链产生醛基并与希夫试剂显色","碱性苏木精直接与中性多糖羟基形成静电盐","地高辛标记DNA探针与杯状细胞mRNA互补杂交"],"answer_idx":1,"explain":"杯状细胞富含糖蛋白/黏多糖，常规HE制片易使糖原/黏液浅染或溶失；PAS技术利用过碘酸将多糖氧化生成醛基，再结合希夫试剂形成紫红色不溶产物（P16），同样原理也使富含糖蛋白的基膜呈PAS阳性。","remedial_node_id":"histo_intro_lm_em_he_methods"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_tissue_polarity_features","title":"四大基本组织架构与上皮极性无血管特征","subject":"histology","syllabus_refs":["syl_histology_002","syl_histology_010"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"细胞+ECM成四大基本组织；上皮细胞密极性强且无血管，依赖深层CT弥散供养。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P5-P7","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P21-P23"],"payload":{"bullets":["组织与四大分类：相似功能细胞加{{细胞外基质(纤维+基质)}}构成组织，分{{上皮、结缔、肌、神经}}四类，协同拼装{{腔性器官(管壁分层)}}与实质性器官(实质+间质)。","上皮三大基本特征：①细胞多、排列极紧密而{{细胞间质极少}}；②细胞具有明显{{极性}}(游离面/侧面/基底面)；③上皮内{{无血管}}但富游离神经末梢。","功能五大分类：按功能分{{被覆上皮}}(内外表面)、{{腺上皮}}(分泌)、{{肌上皮}}(汗/乳/唾液腺收缩)、感觉上皮(嗅/味/眼/耳)与生精上皮。","胚胎起源与供养律：上皮可源自{{外、中、内三胚层}}；因无血管，全部氧与营养须由基底面深层{{结缔组织血管}}经基膜弥散供给。"],"trap_note":"切勿将“上皮无血管”误记为“无感觉”——表皮和角膜上皮富含游离神经末梢；也别忘肌上皮细胞本质属于有收缩功能的上皮组织而非肌组织。","quiz":{"stem":"食管黏膜鳞状上皮全层细胞已出现明显核异型与极性丧失，但组织学上只要癌细胞仍完全局限在基膜上方未向下穿破，临床便极少立即发生淋巴或血道转移，最直接的组织学依据是：","options":["正常上皮层内不含血管和淋巴管","上皮细胞间质极丰富阻碍瘤细胞游走","上皮细胞不具有有丝分裂和迁移潜能","上皮仅源自外胚层且缺乏细胞表面受体"],"answer_idx":0,"explain":"上皮组织特征之一为无血管与淋巴管，脉管系统仅分布于基膜深层的结缔组织固有层中；因此未穿破基膜的原位癌细胞缺乏入管播散通道。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_covering_classification","title":"被覆上皮分类原则、七型分布与结构适配","subject":"histology","syllabus_refs":["syl_histology_010"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"按层数与表层形态命名七型被覆上皮，分别适配物质交换、定向排异与抗磨保护。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P24-P33"],"diagram_assets":[{"path":"assets/histo_epith_covering_types_p24.webp","caption":"七型被覆上皮立体构筑：单层(扁平/立方/柱状)、假复层柱状、复层(角化与未角化扁平/立方/柱状)及变移上皮(排空vs充盈)","source_page":24}],"payload":{"columns":["被覆上皮类型","形态与命名核心特征","典型分布与功能适配"],"rows":[["单层扁平上皮","一层锯齿缘扁平细胞，扁椭圆核居中央","内皮(心/血管/淋巴管)、间皮(胸/腹/心包膜)、肺泡/肾小囊壁层；减摩擦利流与交换"],["单层立方与柱状上皮","立方核圆居中；柱状棱柱形椭圆核居基部（微绒毛/纤毛）","立方：肾小管/甲状腺/小叶间胆管；柱状：胃肠(微绒毛吸收)及子宫/输卵管(纤毛)"],["假复层纤毛柱状上皮","柱状/棱形/锥形/杯状细胞高低错落，基底均附着于基膜","呼吸道内表面；杯状细胞泌黏液粘尘，柱状纤毛单向摆动排异（实为单层）"],["复层扁平 (鳞状) 上皮","表层扁平+中层多边形+深层立方形/矮柱状多层细胞","未角化(口腔/食管/阴道/声带/肛门) vs 角化(皮肤表层)；耐摩擦并阻挡异物侵入"],["复层柱状与变移上皮","复层柱状表层呈柱状；变移上皮表层具盖细胞可覆盖数个中层细胞","复层柱状：睑结膜/男性尿道；变移上皮：肾盏/肾盂/输尿管/膀胱(随充盈变扁减层)"]],"quiz":{"stem":"膀胱高度充盈扩张后切取黏膜观察，可见上皮明显变薄且表层细胞呈扁平状（覆盖多个中层细胞），若误判为单层扁平上皮，其核心鉴别破绽在于：","options":["单层扁平上皮表面必有密集微绒毛","变移上皮仅分布于肺泡与心血管腔面","单层上皮细胞层数永不随功能而变化","充盈变移上皮仍为多层且见大盖细胞"],"answer_idx":3,"explain":"变移上皮属复层上皮，排空时呈6–8层、表层大型盖细胞呈立方形；充盈扩张时细胞彼此滑动，层数减至2–3层且盖细胞拉扁（仍覆盖多个中间层细胞），绝非单层上皮（P31–P33）。","remedial_node_id":"histo_epith_tissue_polarity_features"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_apical_microvilli_cilia","title":"上皮游离面特化：微绒毛与纤毛超微对比","subject":"histology","syllabus_refs":["syl_histology_011"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"微绒毛含微丝锚入终末网扩面吸收；纤毛具9+2微管借动力蛋白摆动排异。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P34-P36","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P45"],"diagram_assets":[{"path":"assets/histo_epith_microvilli_p35.webp","caption":"微绒毛高倍TEM实图：胞膜指状突起内含纵行肌动蛋白微丝束，向下锚定于胞质顶部致密终末网","source_page":35},{"path":"assets/histo_epith_cilia_axoneme_p36.webp","caption":"纤毛纵切/横切TEM与9+2轴丝模式图：9组外周双联微管配动力蛋白臂与放射辐，基部锚于基体","source_page":36}],"payload":{"columns":["对比维度","微绒毛 (Microvillus)","纤毛 (Cilium)"],"rows":[["光镜(LM)形态与可见性","细短指状，单个光镜不可见；密集整齐排列成纹状缘(小肠)或刷状缘(肾小管)","粗长指状突起，在普通光镜下即可清晰分辨"],["电镜(EM)核心骨架","核心为纵行肌动蛋白微丝(microfilament)，向下插入胞质顶部终末网(terminal web)","轴丝为9+2微管排布(9组外周二联微管+2条中央单微管)配动力蛋白臂，基部接基体"],["运动性与核心生理功能","自身不能主动摆动；大幅扩大细胞游离面吸收表面积（利于跨膜物质转运）","耗ATP驱动微管相对滑动行定向节律性摆动；推动呼吸道黏液尘粒或输卵管卵子移行"]],"quiz":{"stem":"某先天性纤毛不动综合征患者因微管动力蛋白臂基因缺陷，出现反复呼吸道细菌感染及男性不育，但小肠绒毛吸收葡萄糖与氨基酸功能却完全正常，其超微结构根源在于：","options":["小肠刷状缘微绒毛不含任何细胞骨架蛋白","微绒毛核心为微丝而非9+2微管与动力蛋白","小肠纹状缘依靠9+0初级纤毛直接吞噬营养","呼吸道假复层上皮原本不含纤毛仅靠微绒毛"],"answer_idx":1,"explain":"纤毛摆动依赖9+2双联微管上的动力蛋白臂水解ATP引发微管滑动；而小肠单层柱状上皮纹状缘由微绒毛密集排列而成，其内部骨架为肌动蛋白微丝而非微管，专司扩大膜面积促进吸收（P35–P36）。","remedial_node_id":"histo_epith_covering_classification"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_lateral_junctions","title":"上皮侧面四类细胞连接与连接复合体","subject":"histology","syllabus_refs":["syl_histology_012"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"由顶至底排布紧密连接(屏障)、中间连接(终末网)、桥粒(张力丝)与缝隙连接。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P37-P42","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P45"],"diagram_assets":[{"path":"assets/histo_epith_junctional_complex_p42.webp","caption":"小肠上皮顶端连接复合体TEM实图(箭:紧密连接；双箭:中间连接；白三角:桥粒；黑三角:缝隙连接)及五类连接空间位序图","source_page":42}],"payload":{"bullets":["紧密连接(闭锁小带)：多居侧面最顶端，相邻胞膜呈{{点状融合}}且周围成封闭索蛋白网格，既机械连接更阻止{{大分子物质}}经细胞间隙旁路渗入。","中间连接(黏着小带)：居紧密连接下方，膜间隙含丝状粘性物，胞质面连微丝{{终末网}}，司黏着、维持细胞形态并{{传递细胞收缩力}}。","桥粒(黏着斑)：呈斑状，间隙中央具{{致密中线}}，胞质面配备厚实{{附着板与张力丝}}，为{{最牢固}}的机械连接，极常见于复层扁平上皮。","缝隙连接(通讯连接)：成群点状，双膜各由6个亚单位围成{{连接小体}}并中央对接约{{2nm亲水小管}}，可开闭供离子与小分子双向流通。","连接复合体 (Junctional complex)：上述四种连接中若有{{两种或两种以上}}在侧面同时相邻存在即称连接复合体，常呈顶至底序贯排布。"],"trap_note":"区分骨架搭档：中间连接胞质面锚定“终末网（微丝）”，而桥粒胞质面锚定“附着板+张力丝（中间丝）”且间隙中独有“致密中线”；连接复合体并非必须四者齐备，≥2种并存即成立。","quiz":{"stem":"寻常型天疱疮患者体内产生抗桥粒芯糖蛋白抗体，使表皮复层扁平上皮细胞彼此分离形成松弛水疱，但小肠单层柱状上皮仍能阻挡肠腔大分子毒素经旁细胞间隙自由渗漏，其原因是：","options":["小肠上皮仅依靠缝隙连接维持化学通讯","表皮复层扁平上皮细胞间不含任何桥粒结构","阻断旁细胞大分子渗漏主要依靠顶端紧密连接","中间连接附着板能替代紧密连接封闭细胞间隙"],"answer_idx":2,"explain":"桥粒（黏着斑）是最牢固的抗牵拉机械连接，在承受摩擦的复层扁平上皮最发达，破坏后导致棘层松解起疱；而封闭胞间隙阻挡大分子旁细胞通行的核心屏障是位于顶端的紧密连接（闭锁小带）（P38–P40）。","remedial_node_id":"histo_epith_apical_microvilli_cilia"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_basal_bm_infolding","title":"基底面特化：基膜分层、质膜内褶与半桥粒","subject":"histology","syllabus_refs":["syl_histology_013"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"上皮与CT共建基膜(基板+网板)行半透膜守门；半桥粒固定，内褶夹线粒体转运。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P37","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P43-P45"],"diagram_assets":[{"path":"assets/histo_epith_basement_membrane_p43.webp","caption":"基膜分子超微模型：上皮侧基板(透明层+致密层)经Ⅶ型胶原锚原纤维连向深层网板(Ⅲ型胶原网状纤维+Ⅳ型锚斑)","source_page":43},{"path":"assets/histo_epith_basal_infolding_p44.webp","caption":"肾小管上皮基底质膜内褶TEM与模式图：基底胞膜垂直内褶夹持平行排列的大量线粒体（光镜呈基底纵纹）","source_page":44}],"payload":{"bullets":["基膜 (Basement membrane) 总构：由{{上皮与深部结缔组织}}共同形成；LM 均质透明厚薄不一，化学染色呈{{PAS阳性}}(糖蛋白)且具{{嗜银性}}(网状纤维)。","基膜EM双层构造：上层{{基板}}(上皮生成，分透明层与致密层)；下层{{网板}}(结缔组织生成，含Ⅲ型胶原网状纤维与Ⅶ型胶原锚原纤维)。","基膜核心功能：在上皮与深层组织间起{{连接与支持}}，并发挥选择性{{半透膜}}调控物质交换（且为原位癌与浸润癌的解剖分界）。","质膜内褶 (Plasma membrane infolding)：基底胞膜垂直折向胞质，内嵌大量平行{{线粒体}}；LM 下呈{{基底纵纹}}，主要见于{{肾小管}}，扩增基底面积利主动转运。","半桥粒 (Hemidesmosome)：结构仅为桥粒的{{一半}}(仅上皮侧具附着板与张力丝)，将上皮细胞基底面牢固{{固定}}于基膜之上。"],"trap_note":"基膜并非单纯一层细胞膜，也非上皮单独分泌：基板（透明层+致密层）由上皮生成呈PAS阳性，深层网板由结缔组织分泌网状纤维呈嗜银性，缺一不可。","quiz":{"stem":"缺血或线粒体毒素选择性阻断肾小管上皮细胞基底侧ATP生成后，除钠钾泵主动重吸收停摆外，电镜下基底面最先受累且形态特征显著退变的超微结构是：","options":["夹持大量平行线粒体的质膜内褶肿胀展平","上皮侧面中央的致密中线及张力丝全部溶解","细胞游离面9+2双联微管动力蛋白完全消失","结缔组织网板内的Ⅲ型嗜银网状纤维钙化"],"answer_idx":0,"explain":"肾小管上皮基底面具备密集垂直的质膜内褶（光镜呈基底纵纹），其褶间紧密排列大量线粒体就近供应ATP给基底侧Na⁺-K⁺泵；缺氧/毒素停泵后，线粒体肿胀且质膜内褶展平消失（P44，衔接肾小管水肿）。","remedial_node_id":"histo_epith_lateral_junctions"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_gland_classification","title":"腺的分类、外分泌腺构筑与三大分泌方式","subject":"histology","syllabus_refs":["syl_histology_014"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"腺上皮分有管外分泌与无管内分泌腺；外分泌腺依导管分泌部分型并按三式分泌。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P23","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P46-P47","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P49-P50"],"diagram_assets":[{"path":"assets/histo_epith_gland_secretion_p50.webp","caption":"Fig 4-21 外分泌腺三大分泌方式：a.局浆分泌(胞吐) b.全浆分泌(细胞满载脂滴崩解+基底分裂补充) c.顶浆分泌(顶部胞质脱落)","source_page":50}],"payload":{"bullets":["概念与发生分流：分泌为主的上皮成腺；胚期上皮向深部CT内陷——保留排泄管为{{外分泌腺}}(汗/唾液腺)，导管退化贴靠毛细血管为{{内分泌腺}}(甲状腺)。","外分泌腺结构：单细胞腺(如{{杯状细胞}})与多细胞腺；多细胞腺由{{分泌部}}与{{导管部}}构成，腺泡基膜内侧常贴附星形收缩性{{肌上皮细胞}}挤出分泌物。","多细胞外分泌腺分类：按导管分支分{{单腺 vs 复腺}}；按分泌部形状分{{管状、泡状与管泡状腺}}；按分泌物性质分{{浆液性、黏液性与混合性腺}}。","局浆与顶浆分泌：{{局浆分泌(Merocrine)}}靠分泌泡顶端胞吐无胞质丢失（唾液腺/胰腺，最常见）；{{顶浆分泌(Apocrine)}}连同少量顶部胞质膜包裹脱落（乳腺/大汗腺）。","全浆分泌(Holocrine)：腺细胞胞质充满脂滴后发生{{整细胞崩解死亡}}并连同分泌物一同排出，由腺泡外周{{基底细胞}}不断分裂补充（皮脂腺）。"],"trap_note":"注意分泌方式与腺细胞损耗的对应：局浆胞吐细胞完整复用；顶浆仅失部分顶端胞质；唯有全浆分泌以整个细胞程序性解体为代价，因此全浆腺外周必须高频分裂补充。","quiz":{"stem":"比较人体腮腺（浆液性唾液腺）、哺乳期乳腺与皮脂腺的分泌机制，若仅抑制腺泡外周基底细胞的有丝分裂补充而不断耗竭成熟腺细胞，哪类腺体的分泌部实质将会最迅速枯竭？","options":["依靠颗粒顶端胞吐释放蛋白酶原的腮腺","仅靠肌上皮收缩挤出预存分泌物的汗腺","顶端细胞膜包裹脂滴微芽脱落的乳腺","依赖细胞满载脂滴崩解成分泌物的皮脂腺"],"answer_idx":3,"explain":"皮脂腺采用全浆分泌(Holocrine)，整个腺细胞完成终末分化蓄满脂滴后解体随导管排出（见P50 Fig 4-21b），必须依靠基底部细胞持续分裂补充；腮腺为局浆分泌、乳腺含顶浆与局浆分泌，单次分泌不破坏整个细胞。","remedial_node_id":"histo_epith_basal_bm_infolding"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_glandular_cells_comparison","title":"四类腺细胞：浆液/黏液/肽/类固醇鉴别","subject":"histology","syllabus_refs":["syl_histology_014"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"依分泌性质区分四类腺细胞：浆液RER嗜碱、黏液PAS阳性与类固醇SER脂滴。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P48"],"diagram_assets":[{"path":"assets/histo_epith_gland_cells_p48.webp","caption":"三类典型腺细胞模式对比：左为蛋白质(浆液性)细胞、中为糖蛋白(黏液性/杯状)细胞、右为类固醇分泌细胞","source_page":48}],"payload":{"columns":["腺细胞类型","HE光镜与染色特征","电镜(EM)核心细胞器格局"],"rows":[["蛋白质分泌细胞 (浆液性)","基底部胞质呈强嗜碱性(蓝紫)，核圆居基部偏中；顶部聚集嗜酸酶原颗粒","极其发达的基部RER(核糖体RNA致嗜碱) + 核上高尔基复合体 + 顶端致密分泌颗粒"],["糖蛋白分泌细胞 (黏液性)","常规HE胞质呈浅淡泡沫状/空泡(黏原溶解)，PAS阳性；核扁平挤至基底部","基部有RER与高尔基体，细胞顶部膨大塞满大量浅淡黏原颗粒(mucinogen droplets)"],["肽分泌细胞","常规HE着色常较淡且颗粒极细小，需靠免疫组织化学(IHC)特异定位","基底部胞质含膜包被小而电子致密的肽分泌颗粒，多向基底毛细血管胞吐释出"],["类固醇分泌细胞","胞质呈嗜酸性并散布透明空泡(脂滴溶解所致)，圆核居中央（肾上腺皮质/性腺）","极发达的滑面内质网 (SER)、大量脂滴及独具特征的管状嵴线粒体"]],"quiz":{"stem":"某内分泌腺活检标本常规HE染色见腺细胞呈多边形、圆核居中、胞质嗜酸性且散布大量圆形空泡；透射电镜下可见高度发达的管网状滑面内质网及管状嵴线粒体。该细胞最可能专职分泌：","options":["胆固醇衍生的类固醇激素","高度糖基化的粘蛋白糖蛋白","胰蛋白酶原等分泌性蛋白质","短链调节肽类胃肠内分泌素"],"answer_idx":0,"explain":"类固醇分泌细胞（图3-21）合成脂溶性甾体激素，不需要海量RER打包分泌颗粒，而是依托发达的滑面内质网(SER)、管状嵴线粒体（含侧链裂解酶等）与胆固醇脂滴协同催化合成，故HE下因脂滴溶失呈嗜酸空泡状。","remedial_node_id":"histo_epith_gland_classification"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_epith_renewal_regeneration","title":"上皮生理更新与创伤再生修复机制","subject":"histology","syllabus_refs":["syl_histology_015"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"依托基底层与隐窝干细胞维持高频更新；创伤能否完全再生取决于基膜完整。","source_slides":["绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P29","绪论 上皮组织 刘琼_20260907基础医学分论（组胚）.pdf#P50"],"payload":{"steps":[{"cue":"第一步（生理更新与干细胞龛）：表层不断角化或磨耗脱落的上皮靠哪群细胞维持稳态？","reveal":"上皮属活跃的不稳定细胞，靠未分化成体干细胞有序更新：复层扁平上皮由基底层立方细胞、全浆腺由外周基底细胞、小肠单层柱状上皮由肠腺隐窝底部干细胞分裂推移分化。","mechanism_tag":"干细胞龛更新"},{"cue":"第二步（浅表创伤完全再生）：基膜未破时，邻近残留上皮如何恢复原本层数与极性？","reveal":"创缘残留基底细胞先去附着并沿完整基膜表面单层扁平移行铺满缺损，接触抑制后转为垂向有丝分裂与极性分化，重建原有上皮层次与腺体。","mechanism_tag":"沿基膜再上皮化"},{"cue":"第三步（深层毁损与化生分叉）：基膜崩解或遭遇长期慢性理化刺激会走向何种结局？","reveal":"若深及真皮/黏膜下层毁损基膜网架，上皮失去极性向导而由结缔组织肉芽瘢痕修补；若慢性刺激不撤，基底层储备细胞则转分化为耐摩擦型上皮（如支气管鳞状化生）。","mechanism_tag":"基膜守门与化生"}],"takeaway":"基底细胞/隐窝干细胞供能生理高频更新；基膜完好则沿膜移行完全再生，基膜毁损则滑向瘢痕或慢性化生。","quiz":{"stem":"一名浅Ⅱ度与深Ⅲ度皮肤烫伤对照病例中，前者仅表皮部分坏死但基底膜连续完整，愈合后皮肤纹理几近恢复；后者真皮乳头及基底膜全部毁损，愈合后遗留厚实纤维瘢痕且缺失汗腺。决定此结局分化的关键开关是：","options":["受损区域是否存在紧密连接封闭索蛋白","基膜及深层上皮干细胞龛是否保持完整","角质形成细胞是否含大量滑面内质网","表皮内部毛细血管网能否直接出芽再生"],"answer_idx":1,"explain":"上皮本身无血管，浅表损伤只要基膜与部分基底/毛囊隆突干细胞龛完整，残余基底细胞即可沿基膜移行覆盖实现完全再生；一旦真皮与基膜彻底毁损，失去极性向导支架只能由结缔组织肉芽增生形成瘢痕（衔接病理修复）。","remedial_node_id":"histo_epith_basal_bm_infolding"}},"added_at":"2026-11-17T17:02:04+08:00"},{"id":"histo_cartilage_general_growth","title":"软骨基质分子筛、软骨膜与双轨生长","subject":"histology","syllabus_refs":["syl_histology_021"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"无血管软骨靠高含水蛋白聚糖分子筛弥散养分，分间质同源群生长与软骨膜下外加生长。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P3-P13,P17-P18"],"diagram_assets":[{"path":"assets/histo_bone_hyaline_cartilage_p12.webp","caption":"图6-1 透明软骨光镜结构（P软骨膜、C软骨囊、Ch软骨细胞、Ig同源细胞群、L软骨陷窝、M基质）","source_page":12}],"payload":{"bullets":["基质与无血管特性：含大量{{蛋白聚糖分子筛}}与水成坚固凝胶；无血管靠弥散养分，陷窝周围{{硫酸软骨素}}高浓度呈强嗜碱性{{软骨囊}}。","纤维特征：透明软骨含{{Ⅱ型胶原原纤维}}，因{{折光率}}与周围基质相近，常规光镜下基质呈均质半透明而难辨纤维。","细胞成熟梯度：周边软骨细胞小扁平幼稚；深部变圆椭圆且由同一细胞分裂成2–8个{{同源细胞群}}，电镜富{{RER与高尔基体}}。","软骨膜双层分工：{{致密结缔组织}}包绕（关节软骨除外）；外层纤维密主保护，内层多血管并含梭形{{成软骨细胞}}主营养、生长与修复。","双轨持续生长：{{间质生长}}(软骨内生长)靠深部同源细胞群分裂扩增，主见幼年；{{外加生长}}(软骨膜下)由膜内祖细胞逐层向外添新。"],"trap_note":"关节软骨表面缺乏软骨膜，养分仅靠关节滑液弥散且无法启动软骨膜下外加生长，故损伤后极难自行修复。","quiz":{"stem":"关节面透明软骨因运动磨损出现缺损后往往极难修复再生，而肋软骨轻度损伤却可缓慢修复，造成这一再生差异的核心结构分水岭是：","options":["关节软骨缺乏软骨膜及内层成软骨细胞难以外加修复","关节软骨内含粗大平行Ⅰ型胶原束完全阻断养分渗透","关节软骨基质缺乏硫酸软骨素无法形成软骨囊腔隙","肋软骨内部铺满密集毛细血管网可直接输送成骨细胞"],"answer_idx":0,"explain":"关节软骨（P11, P18）表面无软骨膜覆盖，既失去软骨膜血管滋养，又缺少内层可增殖分化为软骨细胞以启动外加生长（软骨膜下生长）的祖细胞储备，因此损伤后修复极有限。","remedial_node_id":"histo_ct_ground_substance_fluid"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_cartilage_three_types_matrix","title":"三种软骨结构、纤维属性与分布鉴别","subject":"histology","syllabus_refs":["syl_histology_021"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"依纤维种类分透明(Ⅱ型胶原)、弹性(交织弹性纤维)与纤维软骨(平行Ⅰ型粗束)。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P6,P14-P16"],"diagram_assets":[{"path":"assets/histo_bone_cartilage_types_p16.webp","caption":"三种软骨（透明、弹性、纤维软骨）细胞/纤维/基质与典型分布对照表及显微图","source_page":16}],"payload":{"columns":["比较维度","透明软骨","弹性软骨","纤维软骨"],"rows":[["纤维种类与排列","Ⅱ型胶原原纤维，细小难辨（折光率近基质）","大量交织成网的弹性纤维（新鲜呈黄色）","粗大平行排列的Ⅰ型胶原纤维束（似规则致密CT）"],["细胞与软骨囊","同源细胞群常见，基质多且软骨囊明显","细胞分散较多，软骨囊较明显","细胞小而少常成行排于纤维束间，基质少囊不明显"],["力学特性与分布","一定弹性韧性；胚胎骨架、鼻喉气管、肋及关节软骨","极强弹性易回弹；耳廓、外耳道、会厌及喉软骨","伸展抗压抗摩擦；椎间盘、耻骨联合、关节盘/半月板"]],"quiz":{"stem":"常规HE切片上，纤维软骨内可见粗大嗜酸性平行纤维束及成行小软骨细胞，而透明软骨基质却均质淡蓝紫、不见清晰纤维丝。出现这一镜下反差的根本原因是：","options":["透明软骨不含任何胶原蛋白仅由透明质酸凝胶构成","透明软骨Ⅱ型胶原原纤维细小且折光率与基质相近","纤维软骨大量弹性纤维吸收伊红染料呈现鲜亮粉红","透明软骨成行排列的弹性蛋白网完全掩盖胶原横纹"],"answer_idx":1,"explain":"透明软骨（P8, P16）并非不含纤维，而是富含由Ⅱ型胶原蛋白组成的细小胶原原纤维，其直径细微且折光率与周围蛋白多糖基质接近，故在常规光镜下呈均质半透明；而纤维软骨含粗大嗜酸性Ⅰ型胶原纤维束，光镜极易辨认。","remedial_node_id":"histo_cartilage_general_growth"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_bone_matrix_composition","title":"骨基质双相组成与板层骨三维构筑","subject":"histology","syllabus_refs":["syl_histology_022"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"35%有机质(90%Ⅰ型胶原+骨钙蛋白)供韧性，65%羟磷灰石骨盐沿胶原排布供硬度。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P19-P22"],"payload":{"bullets":["有机质(占干重35%，赋韧性)：由成骨细胞分泌（未钙化前称{{类骨质}}），其中90%为{{Ⅰ型胶原蛋白}}，10%为蛋白聚糖及调节钙化的{{骨钙蛋白}}等糖蛋白。","无机质(占干重65%，赋硬度)：即{{羟磷灰石结晶}} Ca₁₀(PO₄)₆(OH)₂，呈细针状沿胶原原纤维长轴及分子间隙规律排列，贮存人体{{99%钙}}。","编织骨 vs 板层骨：胚胎/骨折初期纤维排列紊乱称{{编织骨}}；成熟改建为胶原规则排布、矿化紧密结合的{{板层骨}}。","骨板立体力学：同一{{骨板}}内胶原纤维相互平行，相邻两层骨板间纤维{{相互垂直}}并有分支互连，切片因折光差异呈交错红色纹理。"],"trap_note":"胶原纤维赋予骨韧性，羟磷灰石赋予骨硬度：酸脱钙骨仅剩有机胶原会柔韧可弯曲，火烧去有机质仅剩骨盐则极脆一捏即碎。","quiz":{"stem":"实验课上将一根长骨置于稀盐酸中充分脱钙洗净后，骨保持原外形却变得柔韧甚至能打结；而将另一根骨经高温灼烧后，骨亦保原形却一碰即碎成灰渣。该现象最精准揭示的骨基质结构原理是：","options":["钙盐微晶赋予骨组织抗拉韧性而蛋白聚糖决定抗压硬度","Ⅱ型胶原与硫酸软骨素共同决定成熟长骨的刚性承受力","Ⅰ型胶原有机质赋骨韧性而羟磷灰石无机盐赋骨硬度","酸液溶解全部骨细胞胞体而高温破坏破骨细胞溶酶体"],"answer_idx":2,"explain":"脱钙（P20–P21）去除了无机羟磷灰石结晶，留下的Ⅰ型胶原纤维有机骨架使骨柔韧有弹性；高温灼烧去除了全部有机胶原纤维，留下的纯羟磷灰石无机结晶框架则脆硬易碎，二者沿长轴结合方造就既坚硬又韧的骨质。","remedial_node_id":"histo_collagen_fibrillogenesis"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_bone_osteoblast_osteocyte","title":"骨祖细胞、极性成骨细胞与骨小管网络","subject":"histology","syllabus_refs":["syl_histology_022"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"间充质骨祖→成骨细胞借RER泌类骨质及基质小泡钙化，包埋成骨细胞借骨小管缝隙连接存活。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P23-P32,P37"],"diagram_assets":[{"path":"assets/histo_bone_osteoblast_osteocyte_p23.webp","caption":"骨祖细胞向极性成骨细胞（富RER/Golgi）分化泌类骨质，被包埋后突起穿骨小管连成骨细胞网","source_page":23}],"payload":{"bullets":["骨祖细胞：源自{{间充质干细胞}}，贴附于骨外膜内层与骨内膜，小梭形弱嗜碱，是骨生长与修复时分化为{{成骨细胞}}的干细胞库。","成骨细胞光镜与电镜：单层排于骨表面，矮柱状核偏位、胞质强嗜碱，电镜富{{RER与高尔基体}}合成释放{{类骨质}}。","基质小泡钙化开关：成骨细胞分泌膜含{{碱性磷酸酶}}(AKP)、焦磷酸酶及ATP酶的{{基质小泡}}，囊内富集Ca²⁺与初期羟磷灰石晶核启动矿化。","骨细胞空间微管网：成骨细胞被自身骨质包埋转变为扁椭圆形{{骨细胞}}；胞体居{{骨陷窝}}，细长突起穿行于{{骨小管}}交织成网。","缝隙连接与钙交换：相邻骨细胞突起间以{{缝隙连接}}相连，骨陷窝/骨小管含组织液连通血管，调控基质更新及骨钙-血钙快速交换。"],"trap_note":"骨基质钙化后呈不透水屏障，骨细胞绝非死细胞，全赖突起穿行骨小管并借缝隙连接从中央管/骨髓腔接力获取养分与传递钙信号。","quiz":{"stem":"骨基质一旦完全钙化便极度致密致自由扩散受阻，但深埋于骨板间或骨板内的大量骨细胞仍能存活数十年并即时响应激素调节血钙。其赖以获取养分及传导信号的关键超微结构保障是：","options":["骨基质内穿行大量毛细淋巴管直接包绕每个骨陷窝","骨细胞保留极高比例无氧糖酵解故完全无需组织液","破骨细胞持续在每个骨细胞周围钻出开放性血窦孔","骨细胞突起穿骨小管并借缝隙连接连通含液微管网"],"answer_idx":3,"explain":"尽管钙化骨板致密不通透，但骨细胞（P30–P32）胞体居骨陷窝、细长突起穿行于骨小管，且相邻骨细胞突起通过缝隙连接相连，骨小管内充盈组织液并最终开口于中央管或骨髓腔血管旁。","remedial_node_id":"histo_bone_matrix_composition"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_bone_osteoclast_resorption","title":"破骨细胞单核融合起源与极性溶骨机理","subject":"histology","syllabus_refs":["syl_histology_022"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"血单核细胞融合为多核嗜酸破骨细胞，借亮区封闭微环境与皱褶缘泌H⁺和蛋白酶双轨溶骨。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P33-P37"],"diagram_assets":[{"path":"assets/histo_bone_osteoclast_em_p35.webp","caption":"破骨细胞电镜超微模式图：亮区微丝密封环、皱褶缘微绒毛、溶酶体与吞饮小泡协同溶骨吸收","source_page":35}],"payload":{"steps":[{"cue":"双谱系反差：破骨细胞从何而来？其分化受哪对正负分子开关控制？","reveal":"源自血液单核细胞融合（非骨祖细胞），光镜体大、多核(数个至数十个)、胞质嗜酸；骨髓前体经M-CSF与成骨细胞所泌RANKL诱导融合激活，而OPG作诱饵受体阻断RANKL。","mechanism_tag":"单核融合 · RANKL/OPG"},{"cue":"电镜双区密封：亮区与皱褶缘如何建立高浓度不外漏的溶骨微环境？","reveal":"贴骨面周缘由微丝/微管组成无细胞器“亮区”，其平整质膜紧贴骨基质围成封闭腔；中央为不规则微绒毛构成“皱褶缘”，大幅扩增酸泵与酶释放吸收面积。","mechanism_tag":"亮区密封 + 皱褶缘扩面"},{"cue":"双轨拆解吸收入胞：无机骨盐与有机Ⅰ型胶原纤维分别怎样被同步溶解？","reveal":"碳酸酐酶催化CO₂+H₂O→H⁺+HCO₃⁻，质子泵向封闭腔泌H⁺（伴乳酸/柠檬酸）溶去羟磷灰石；溶酶体释蛋白酶（如组织蛋白酶K）裂解胶原，碎片经吞饮/吞噬泡内吞吸收。","mechanism_tag":"酸化溶盐 +
