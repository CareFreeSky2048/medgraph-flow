({{伸肌群1块}})。","前群浅层主干：{{肱二头肌}}居中覆盖深层，跨肩、肘关节行屈肘与旋后。","前群深层内上：{{喙肱肌}}起自肩胛骨喙突止于肱骨中部内侧，使肩关节{{前屈和内收}}。","前群深层远端：{{肱肌}}起自肱骨体下半前面止于{{尺骨粗隆}}，专司单纯屈肘关节。","神经穿行路标：{{肌皮神经}}穿喙肱肌后行于肱二头肌与肱肌之间，支配前群3肌；后群{{肱三头肌}}由桡神经支配。"],"trap_note":"同属臂前群的**肱二头肌**止于桡骨粗隆（屈肘兼旋后），而深层的**肱肌**止于尺骨粗隆（只屈肘不能旋后）；肌皮神经穿**喙肱肌**是臂丛终端定位的重要解剖路标。","quiz":{"stem":"上臂前侧刀刺伤切断了穿行于喙肱肌并下行于肱肌表面的神经分支，但肱桡肌与肱三头肌功能完整。查体发现患者仍能微弱屈肘，此时最可能受损的神经及完整代偿屈肘肌分别是：","options":["正中神经受损，由深层完整的喙肱肌代偿完成屈肘","尺神经受损，由浅层肱二头肌短头完全代偿旋后","桡神经受损，由外侧的旋前圆肌直接牵拉鹰嘴屈肘","肌皮神经受损，由桡神经支配的肱桡肌代偿屈肘"],"answer_idx":3,"explain":"穿喙肱肌行于肱肌前面者为**肌皮神经**，损伤后臂前群三肌全瘫，但前臂前外侧由**桡神经**支配的**肱桡肌**仍可部分代偿屈肘。","remedial_node_id":"anat_musc_limb_arm_biceps_triceps"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_forearm_layout","title":"前臂肌分群配布与神经支配规律","subject":"anatomy","syllabus_refs":["syl_anatomy_086"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"依《系统解剖学》补全**前群9肌**与**后群10肌**内外上髁起止及神经铁律。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P1,P8"],"payload":{"columns":["前臂肌对比维度","前群（屈肌+旋前，共 9 块）","后群（伸肌+旋后，共 10 块）"],"rows":[["分层排列","**浅层5**（肱旋桡掌尺）+**中层1**（指浅屈）+**深层3**（拇/指深/旋前）","**浅层5**（桡长/短伸、指伸、小指伸、尺腕伸）+**深层5**"],["共同起点标志","多起自**肱骨内上髁**及尺桡骨前面（唯肱桡肌起外侧髁上嵴）","多起自**肱骨外上髁**及尺桡骨后面"],["核心运动功能","主要**屈腕、屈指和前臂旋前**（肱桡肌实效为屈肘）","主要**伸腕、伸指和前臂旋后**（另含拇指外展）"],["神经支配铁律","**6.5正中+1.5尺**（尺腕屈/指深屈尺侧半）；仅肱桡肌归桡神经","**全部 10 块均受桡神经**（主干及其深支骨间后神经）支配"]],"quiz":{"stem":"【教材补全】前臂肌共19块，临床常按肱骨内外上髁总起点与神经支配成对记忆。关于前臂前群肌神经支配“1.5尺、余归正中”定律及胚胎移位例外的表述，正确的是：","options":["尺侧腕屈肌与指深屈肌尺侧半受尺神经支配，肱桡肌归桡神经","旋前圆肌与指浅屈肌尺侧半受尺神经支配，掌长肌归肌皮神经","指深屈肌全部与拇长屈肌均受尺神经支配，旋前方肌归桡神经","桡侧腕屈肌与旋前圆肌受桡神经支配，尺侧腕伸肌归尺神经"],"answer_idx":0,"explain":"**[教材补全说明]** 原课件P8将前臂肌列为自学。依《系统解剖学》标准：前臂前群共9块，**尺侧腕屈肌+指深屈肌尺侧半**（共1.5块）归**尺神经**；**肱桡肌**因源于背侧伸肌前移，归**桡神经**且实效为屈肘；余6.5块均归**正中神经**；后群10块全归桡神经。","remedial_node_id":"anat_upper_humerus_nerve_grooves"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_forearm_anterior","title":"前臂前群八肌分层与穿裂孔机制","subject":"anatomy","syllabus_refs":["syl_anatomy_087"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"精析前臂前群**八大必考肌**位置、**腱裂孔穿行**及腕管内外走行规律。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P1,P8","07 基础医学 肌学总论 头颈 躯干肌.pptx#P11"],"diagram_assets":[{"path":"assets/anat_musc_limb_hand_sheath_p11.webp","caption":"腕掌前面屈肌支持带、掌长肌、桡侧腕屈肌及指屈肌滑膜腱鞘关系（总论P11）","source_page":11}],"payload":{"bullets":["浅层桡侧3肌：{{肱桡肌}}止桡骨茎突（纯屈肘）；{{旋前圆肌}}斜止桡骨中部（旋前屈肘）；{{桡侧腕屈肌}}止第2掌骨底（屈腕桡偏）。","浅层内侧2肌：{{掌长肌}}移行于{{掌腱膜}}助屈腕（15%人缺如）；{{尺侧腕屈肌}}止于豌豆骨（屈腕尺偏，尺神经）。","中层穿裂孔结构：{{指浅屈肌}}分4腱止第2–5指{{中节指骨体}}两侧，并在近节裂成两脚围成腱裂孔（屈近侧指间关节）。","深层屈指双肌：{{拇长屈肌}}止拇指远节指骨底；{{指深屈肌}}4腱穿指浅屈肌腱裂孔止第2–5指{{远节指骨底}}（最深附旋前方肌）。","腕管穿行界限：指浅/深屈肌与{{拇长屈肌}}共9条肌腱伴正中神经经{{腕管}}入掌；尺侧腕屈肌与掌长肌行于屈肌支持带浅面。"],"trap_note":"**[教材补全说明]** 原课件P8标明前臂肌自学。核心易错点：**指深屈肌腱穿过指浅屈肌腱裂孔**达远节指骨，故单独屈远侧指间关节靠指深屈肌；**旋前圆肌**两头间有正中神经穿行，卡压可致正中神经麻痹；**掌长肌**与**尺侧腕屈肌**不经腕管。","quiz":{"stem":"【教材补全】工人右手示指中节掌侧锐器切割伤，急诊查体固定示指近侧指间关节时，远侧指间关节无法主动屈曲，而固定相邻手指后近侧指间关节仍能独立屈曲。最符合伤情的解剖判断是：","options":["指浅屈肌腱完全断裂而掌长肌腱尚完整","桡侧腕屈肌止点撕脱同时伴有腕管内卡压","指深屈肌腱断裂而指浅屈肌两脚止点完整","拇长屈肌腱与尺侧腕屈肌腱同时发生断离"],"answer_idx":2,"explain":"**指浅屈肌**止于中节指骨体两侧，负责屈近侧指间关节；**指深屈肌**穿过指浅屈肌腱裂孔止于远节指骨底，是唯一能屈**远侧指间关节**的肌肉，故中节远侧割断指深屈肌腱时远侧指间关节屈曲丧失而近侧指间关节尚存。","remedial_node_id":"anat_musc_limb_forearm_layout"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_forearm_posterior","title":"旋前方肌与前臂后群肌及鼻烟窝","subject":"anatomy","syllabus_refs":["syl_anatomy_088"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"补全前群最深**旋前方肌**与后群**浅5深5**伸肌，串联**鼻烟窝**与垂腕体征。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P1,P8"],"payload":{"bullets":["前群最深补遗：{{旋前方肌}}横跨尺桡骨远端1/4前面，与旋前圆肌协同前臂{{旋前}}（正中神经骨间前神经支配）。","后群浅层5肌：由桡向尺为{{桡侧腕长伸肌、桡侧腕短伸肌}}（伸腕桡偏）、{{指伸肌}}（伸2–5指）、{{小指伸肌}}与{{尺侧腕伸肌}}（伸腕尺偏）。","后群深层5肌：近端{{旋后肌}}绕桡骨颈旋后；远端专动拇示指4肌为{{拇长展肌、拇短伸肌、拇长伸肌}}与{{示指伸肌}}。","解剖学鼻烟窝：腕背桡侧凹陷，前外界为{{拇长展肌与拇短伸肌腱}}，后内界为{{拇长伸肌腱}}，窝底为手舟骨及桡动脉。","桡神经损伤定位：肱骨中段骨折伤及桡神经主干呈{{垂腕畸形}}；旋后肌管卡压骨间后神经仅不能伸指（能伸腕）。"],"trap_note":"**[教材补全说明]** 鼻烟窝记忆：“**长展短伸围前外，长伸单独守后内**”；注意高位桡神经（肱骨中段）受损导致**垂腕**，而低位骨间后神经损伤时因**桡侧腕长伸肌**（由桡神经高位发出分支）保全，故患者仍能伸腕而仅表现为**垂指**。","quiz":{"stem":"【教材补全】青年骑车撑地后腕背桡侧三角形凹陷区明显肿胀压痛，伸展外展拇指时凹陷前后两侧肌腱轮廓紧绷。构成该凹陷前后界及窝底易骨折骨块的正确组合是：","options":["桡侧腕长伸肌与指伸肌腱围界，窝底为月骨","拇长展肌与拇短伸肌腱居前外，窝底为手舟骨","旋前圆肌与掌长肌腱居中，窝底为尺骨茎突","拇长屈肌与示指伸肌腱夹持，窝底为豌豆骨"],"answer_idx":1,"explain":"解剖**鼻烟窝**的前外（桡侧）界为**拇长展肌腱与拇短伸肌腱**，后内（尺侧）界为**拇长伸肌腱**，窝底触及**手舟骨**与大多角骨（深方有桡动脉搏动）；手舟骨骨折时鼻烟窝处呈特征性深压痛。","remedial_node_id":"anat_musc_limb_forearm_layout"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_hand_muscles_nerves","title":"手肌三群分级与正中尺神经畸形","subject":"anatomy","syllabus_refs":["syl_anatomy_089"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"依《系统解剖学》补全手肌**外/内/中三群**，区分**PAD/DAB**与猿手/爪形手。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P1,P8"],"payload":{"columns":["手肌分群","组成肌群与精巧运动","神经支配与损伤畸形"],"rows":[["外侧群 (**鱼际** 4块)","拇短展肌、拇短屈肌、**拇对掌肌**、拇收肌（司对掌与内收）","前三肌归**正中神经返支**（伤致**猿手**）；拇收肌归**尺神经**"],["内侧群 (**小鱼际** 3块)","小指展肌、小指短屈肌、小指对掌肌（司小指展屈对掌）","全归**尺神经深支**支配，受损后小鱼际显著萎缩"],["中间群 (**蚓状肌** 4块)","起自指深屈肌腱止指背腱膜：**屈掌指关节、伸指间关节**","**1、2归正中神经**；**3、4归尺神经**（与指深屈肌同步）"],["中间群 (**骨间肌** 7块)","掌侧3块内收（**PAD**）；背侧4块外展（**DAB**）兼屈MCP伸IP","全部7块骨间肌均归**尺神经深支**（伤致**爪形手**）"]],"quiz":{"stem":"【教材补全】肘部尺神经沟严重卡压导致尺神经深支完全受损而正中神经完整，患者第4、5指出现掌指关节过伸而指间关节屈曲的“爪形手”，且第2至5指难以并拢夹纸。出现夹纸不能的直接受累肌群是：","options":["受正中神经返支支配的鱼际拇对掌肌与拇短展肌","受正中神经支配的第1和第2蚓状肌肌腹","受桡神经骨间后神经支配的示指伸肌与小指伸肌","受尺神经深支支配的骨间掌侧肌与拇收肌群"],"answer_idx":3,"explain":"**尺神经深支**支配全部3块**骨间掌侧肌**（PAD：使2、4、5指向中指内收夹纸）、4块骨间背侧肌（DAB：外展）、第3–4蚓状肌及**拇收肌**；其瘫痪不仅致骨间肌萎缩和第4–5指爪形手，也出现夹纸试验及Froment征阳性。","remedial_node_id":"anat_upper_hand_landmarks_joints"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_hip_core","title":"髋肌核心与梨状肌孔及安全注射","subject":"anatomy","syllabus_refs":["syl_anatomy_091"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"整合髂腰肌、阔筋膜张肌与**臀大/中肌、梨状肌**功能，掌握臀部**外上象限**注射。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P10-P15"],"diagram_assets":[{"path":"assets/anat_musc_limb_hip_tfl_p11.webp","caption":"阔筋膜张肌起自髂前上棘移行于髂胫束止于胫骨外侧髁（P11）","source_page":11},{"path":"assets/anat_musc_limb_gluteal_im_p15.webp","caption":"臀部十字象限外上象限安全注射定位与体表大转子(GT)-坐骨结节(IT)标线（P15；原图Gltuteal勘误为Gluteal）","source_page":15}],"payload":{"bullets":["前群屈髋主力：{{髂腰肌}}（腰大肌起腰椎＋髂肌起髂窝）合止于{{股骨小转子}}，屈髋旋外；下肢固定时前屈躯干。","前外侧稳定轴：{{阔筋膜张肌}}起髂前上棘经{{髂胫束}}止于胫骨外侧髁，屈髋、外展旋内并协助稳定伸直的膝关节。","后群伸髋巨肌：{{臀大肌}}起髂骨翼外面和骶骨背面，止于{{髂胫束和臀肌粗隆}}，强力伸髋旋外（登楼起立主力）。","骨盆横稳核心：{{臀中肌与臀小肌}}起髂骨翼外面止于{{股骨大转子}}，外展髋关节并在单腿支撑时稳定骨盆防下坠。","坐骨大孔分隔：{{梨状肌}}穿坐骨大孔分为梨状肌上下孔，{{坐骨神经}}经下孔出盆至臀内下方；臀部肌注须取外上象限。"],"trap_note":"纠P15英文误拼：**`Gluteal furrow`**（原片作 `Gltuteal`）；纠P12漏列：**臀中肌**起止点与臀小肌同为髂骨翼外面→股骨大转子。单侧臀中/小肌麻痹时，对侧骨盆在单腿负重期下坠呈**Trendelenburg步态**。","quiz":{"stem":"护士于患者右侧臀部进行肌肉注射时，误将针头刺入臀裂中点外下方偏内侧区域，患者随即感右足底及小腿外侧触电样剧痛并伴足背屈无力。此次误伤所及的神经及正确避让定位法分别是：","options":["伤及梨状肌下孔穿出的坐骨神经，应取十字外上象限","伤及梨状肌上孔穿出的闭孔神经，应取十字内下象限","伤及肌肉间穿行的股外侧皮神经，应取臀沟正中下方","伤及髂腰肌深面的股神经主干，应贴近大转子下缘"],"answer_idx":0,"explain":"**坐骨神经**经**梨状肌下孔**出盆后投影于臀部**内下方**（髂后上棘与大转子/坐骨结节连线内下方），故臀大肌肌内注射必须依据髂嵴最高点与臀沟（Gluteal furrow）十字划定**外上象限**安全区。","remedial_node_id":"anat_lower_pelvic_ligaments_brim"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_hip_axes_deep","title":"髋肌三轴运动与深层外旋肌勘误","subject":"anatomy","syllabus_refs":["syl_anatomy_090"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"按**髋关节三轴**归类髋肌分工，勘误补全**上下孖肌**与**闭孔外肌**后群全貌。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P10-P13"],"diagram_assets":[{"path":"assets/anat_musc_limb_hip_posterior_p12.webp","caption":"髋肌后群浅深层解剖：臀大/中/小肌、梨状肌、闭孔内肌、股方肌及腘绳肌毗邻（P12）","source_page":12}],"payload":{"columns":["髋关节运动轴","主要驱动髋肌与肌群","深层肌补遗与原片勘误"],"rows":[["冠状轴 (**屈 / 伸**)","前群**髂腰肌、阔筋膜张肌**强力屈髋；后群**臀大肌**强力伸髋","下肢固定时，髂腰肌可倒拉腰椎使**躯干前屈**（仰卧起坐）"],["矢状轴 (**展 / 收**)","**臀中肌、臀小肌**与阔筋膜张肌外展；屈髋时梨状肌/孖肌助展","髋内收主要由大腿内侧群（长/短/大收肌）承担，臀大肌下部辅助"],["垂直轴 (**旋内 / 旋外**)","旋内：**臀中/小肌前束**、阔筋膜张肌；旋外：深层短旋外肌+臀大肌","**深层旋外六肌**全貌：梨状肌、闭孔内肌、上/下孖肌、股方肌、闭孔外肌"]],"quiz":{"stem":"对照教学课件P12列表与P13功能页，发现原课件后群列表漏列了一对辅助闭孔内肌的短肌，而功能页又漏述了另一块穿闭孔膜外面的旋外肌。将两页合并补全后，髋后群深层除梨状肌与股方肌外还应包含：","options":["缝匠肌、耻骨肌与腰小肌","阔筋膜张肌、髂肌与半膜肌","闭孔内/外肌与上下孖肌","长收肌、短收肌与股薄肌"],"answer_idx":2,"explain":"**[课件勘误补全]** 原片P12列出闭孔外肌却漏列**上、下孖肌**，P13功能页补上**上、下孖肌**（协同闭孔内肌旋外伸直髋、助展屈曲髋）却漏述**闭孔外肌**；标准髋肌后群深层旋外肌应完整包含梨状肌、闭孔内肌、上/下孖肌、股方肌与闭孔外肌。","remedial_node_id":"anat_musc_limb_hip_core"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_thigh_core","title":"大腿核心七肌、股直肌与收肌裂孔","subject":"anatomy","syllabus_refs":["syl_anatomy_092"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"掌握股四头肌、缝匠肌、长/大收肌与**腘绳肌**起止功能及**收肌腱裂孔**分界。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P16-P22"],"diagram_assets":[{"path":"assets/anat_musc_limb_quadriceps_p18.webp","caption":"股四头肌四个头独立骨附着：1股外侧肌、2股内侧肌、3股直肌(唯一跨髋)、4股中间肌（P18）","source_page":18},{"path":"assets/anat_musc_limb_thigh_adductors_p19.webp","caption":"大腿内侧群深层大收肌与股骨间形成的收肌腱裂孔及股/腘血管穿行（P19）","source_page":19}],"payload":{"bullets":["前群双雄：{{缝匠肌}}起髂前上棘止胫骨上端内侧（屈髋屈膝+旋内已屈膝）；{{股四头肌}}经髌韧带止{{胫骨粗隆}}，强力伸膝。","股直肌唯一性：股四头肌四头中仅{{股直肌}}起自髂前下棘跨越双关节，故能兼行{{屈髋与伸膝}}；余三头起股骨仅伸膝。","内侧收肌代表：{{长收肌}}与{{大收肌}}起耻骨/坐骨支及坐骨结节，止股骨粗线及收肌结节，主司髋关节内收和旋外。","血管分界标志：大收肌腱与股骨之间形成{{收肌腱裂孔}}，是{{股动脉移行为腘动脉}}（及腘静脉移行为股静脉）的解剖界标。","后群腘绳肌：均起坐骨结节（股二头肌短头起股骨粗线）司伸髋屈膝；屈膝时{{股二头肌}}旋外小腿，{{半腱肌与半膜肌}}旋内小腿。"],"trap_note":"勘误提示：原课件P16与P18左图 **`Vastus laterallis`** 应为 **`Vastus lateralis`**（股外侧肌）；P21右图 `Semitendinosus/半膜肌` 标注错位；P22补齐**半腱肌**与**半膜肌**均起自坐骨结节。","quiz":{"stem":"股骨远端干骺端骨肉瘤或锐器贯穿伤位于股骨下1/3内后侧大收肌腱抵止区附近，术中探查见主干动脉正好穿过一肌性裂孔向后移行为另一命名动脉。此解剖界标与血管移行关系是：","options":["经卵圆窝穿大隐静脉，使髂外动脉直接延续为股深动脉","经收肌腱裂孔贴股骨穿出，使股动脉向后移行为腘动脉","经梨状肌下孔穿出盆腔，使髂内动脉移行为臀下动脉","经血管腔隙穿过腹股沟，使股动脉移行为胫后动脉干"],"answer_idx":1,"explain":"**大收肌**远端腱与股骨之间围成**收肌腱裂孔**（adductor hiatus），股动脉经收肌管穿出收肌腱裂孔进入腘窝后即改称**腘动脉**，故股骨下段内后侧骨折极易刺伤该处血管引发腘窝假性动脉瘤或下肢缺血。","remedial_node_id":"anat_lower_knee_joint_stabilizers"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_thigh_compartments","title":"大腿三群十肌层次与鹅足肌鉴辨","subject":"anatomy","syllabus_refs":["syl_anatomy_093"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"完整映射**大腿三群十肌**浅深层次、神经支配及**鹅足三肌**跨群共同止点。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P16-P22"],"diagram_assets":[{"path":"assets/anat_musc_limb_adductors_detail_p20.webp","caption":"大腿内侧群单肌分离图：耻骨肌、短收肌、长收肌与大收肌起点至粗线附着（P20）","source_page":20}],"payload":{"columns":["大腿肌分群 (10块)","浅→深排列层次与全部肌名","神经支配与交叉要点"],"rows":[["**前群** (2组)","浅：**缝匠肌**；深：**股四头肌**（直肌、外侧、内侧、中间肌）","**股神经**支配；缝匠肌止胫骨内侧参成**鹅足**（屈膝旋内）"],["**内侧群** (5块)","浅：**耻骨肌、长收肌、股薄肌**；中：**短收肌**；深：**大收肌**","**闭孔神经**为主；**股薄肌**唯一跨膝参成**鹅足**屈膝旋内"],["**后群** (3块)","外：**股二头肌**(长/短头止腓骨头)；内浅：**半腱肌**；内深：**半膜肌**","**坐骨神经**支配；**半腱肌**参成**鹅足**，半膜肌止内侧髁后"]],"quiz":{"stem":"前交叉韧带重建术常在胫骨上端内侧面切取“鹅足腱”作自体移植物，该结构恰巧汇集了分别来自大腿前群、内侧群与后群的三条长肌腱。构成“鹅足”的跨群三肌组合是：","options":["股直肌、大收肌与股二头肌短头","髂腰肌、耻骨肌与股外侧肌","阔筋膜张肌、短收肌与半膜肌","缝匠肌、股薄肌与半腱肌"],"answer_idx":3,"explain":"**鹅足（pes anserinus）**位于胫骨上端内侧面，由前群**缝匠肌**（股神经）、内侧群**股薄肌**（闭孔神经）及后群**半腱肌**（坐骨神经）共同止此形成，三者协同使已屈的膝关节/小腿**旋内**。","remedial_node_id":"anat_musc_limb_thigh_core"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_leg_core","title":"小腿核心肌、腓骨肌吊带与跟腱","subject":"anatomy","syllabus_refs":["syl_anatomy_094"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"掌握胫骨前肌、腓骨长/短肌、**小腿三头肌**与拇/趾长屈肌，贯通**腓骨肌吊带**。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P23-P27"],"diagram_assets":[{"path":"assets/anat_musc_limb_leg_lateral_p25.webp","caption":"小腿外侧群腓骨长肌（跨足底至第1跖骨底/内侧楔骨）与腓骨短肌（止第5跖骨粗隆）（P25）","source_page":25},{"path":"assets/anat_musc_limb_leg_posterior_p27.webp","caption":"小腿后群浅层三头肌跟腱及深层腘肌、胫骨后肌、趾长屈肌与拇长屈肌足底交叉（P27）","source_page":27}],"payload":{"bullets":["前群背屈代表：{{胫骨前肌}}起胫骨外侧面止{{内侧楔骨和第1跖骨底}}，使踝背屈并使足内翻。","外侧群双肌：浅层{{腓骨长肌}}绕外踝斜穿足底至内侧楔骨与第1跖骨底；深层{{腓骨短肌}}止第5跖骨粗隆，共司{{足外翻和跖屈}}。","腓骨肌吊带：{{胫骨前肌与腓骨长肌}}共同附着于内侧楔骨和第1跖骨底形成吊带，主动维持{{足横弓}}。","后群浅层跟腱：{{小腿三头肌}}（腓肠肌内外侧头＋比目鱼肌）经{{跟腱}}止跟骨结节，强力跖屈踝关节并泵血助静脉回流。","后群深层屈趾：{{拇长屈肌}}（居外/腓侧）与{{趾长屈肌}}（居内/胫侧）绕内踝后入足底止于远节趾骨底，司屈趾、跖屈与足内翻。"],"trap_note":"纠P26版面提示：P26“跟腱”字样悬空无引线，精确引线见P27左图；注意**腓肠肌**起自股骨内外上髁而跨膝踝（屈膝+跖屈），**比目鱼肌**仅起胫腓骨单跨踝，临床以足内翻暴力扭伤最易撕脱**腓骨短肌**止点——第5跖骨粗隆。","quiz":{"stem":"长期重体力负重患者足横弓逐渐塌陷伴前足底胼胝体疼痛，肌电图提示足底外侧斜向跨至内侧楔骨及第1跖骨底的一条长肌腱肌力明显减退。与胫骨前肌协同构筑“腓骨肌吊带”维持足横弓的关键肌肉是：","options":["经外踝后下方绕入足底的腓骨长肌","直接止于第5跖骨基部的腓骨短肌","起于股骨外侧髁斜行向下的腓肠肌","单独止于足舟骨结节的趾长屈肌"],"answer_idx":0,"explain":"**腓骨长肌**起自腓骨外侧面上部，绕外踝后下方斜穿足底，与来自内前方的**胫骨前肌**共同止于**内侧楔骨和第1跖骨底**，二者一外一内形成**腓骨肌吊带（peroneal stirrup）**托举足横弓并协调内外翻。","remedial_node_id":"anat_lower_foot_arches_structure"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_leg_compartments","title":"小腿前外后三群分层与踝足方向","subject":"anatomy","syllabus_refs":["syl_anatomy_095"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"汇总小腿**三群十肌**名称层次、三大神经分区及背屈/跖屈与**内外翻**向量。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P23-P27"],"diagram_assets":[{"path":"assets/anat_musc_limb_leg_anterior_p24.webp","caption":"小腿前群三肌定位：1胫骨前肌、2趾长伸肌、3拇长伸肌（P24）","source_page":24}],"payload":{"columns":["小腿肌分群","层次与全肌名","神经支配与踝足功能"],"rows":[["**前群** (3块)","由内向外：**胫骨前肌、拇长伸肌、趾长伸肌**","**腓深神经**支配；**踝背屈 + 伸趾**；胫骨前肌兼使**足内翻**"],["**外侧群** (2块)","浅：**腓骨长肌**；深：**腓骨短肌**","**腓浅神经**支配；**足外翻 + 辅助跖屈**；维持足横弓"],["**后群浅层**","**小腿三头肌**（腓肠肌内外侧头＋比目鱼肌）→ 跟腱","**胫神经**支配；强力**跖屈**（腓肠肌兼屈膝），构成小腿肌泵"],["**后群深层** (4块)","上：**腘肌**；下内→外：**趾长屈肌、胫骨后肌、拇长屈肌**","**胫神经**支配；跖屈、屈趾兼足内翻；**胫骨后肌**托内侧纵弓"]],"quiz":{"stem":"腓骨颈骨折压迫腓总神经主干后，患者出现典型“跨阈步态”（行走时足尖下垂且向内偏斜，需高抬膝关节以免足尖擦地）。决定患足同时呈现足下垂和内翻畸形的双重解剖机制是：","options":["胫神经麻痹使小腿三头肌及胫骨后肌丧失跖屈张力","腓深与腓浅神经并存完整，唯腓骨短肌过度挛缩","前群背屈肌与外侧群外翻肌同瘫而胫神经后群拮抗占优","股神经分支受卡压导致股四头肌无法伸直膝关节推进"],"answer_idx":2,"explain":"腓总神经在腓骨颈处分为**腓深神经**（前群背屈）和**腓浅神经**（外侧群外翻）；主干损伤使背屈与外翻肌同时瘫痪，而由**胫神经**支配的小腿后群（跖屈+足内翻）失拮抗牵拉，遂呈**马蹄内翻足（跨阈步态）**。","remedial_node_id":"anat_musc_limb_leg_core"}},"added_at":"2026-11-18T20:20:32+08:00"},{"id":"anat_musc_limb_leg_deep_popliteal","title":"小腿后深层四肌、肌腱交叉与腘窝","subject":"anatomy","syllabus_refs":["syl_anatomy_096"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"贯通**腘肌解锁**、胫后肌托弓与**FHL/FDL足底交叉**，掌握腘窝六界深浅顺序。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P26-P28"],"diagram_assets":[{"path":"assets/anat_musc_limb_popliteal_p28.webp","caption":"腘窝菱形六界标本编号(1–6)与窝内神经血管由浅入深排列（P28）","source_page":28}],"payload":{"steps":[{"cue":"腘肌(popliteus)：居膝后最深层，如何“解锁”完全伸直锁紧的膝关节？","reveal":"起股骨外侧髁外侧斜向内下止胫骨比目鱼肌线上方，起始屈膝时使**股骨外旋**（非负重时使胫骨**内旋**）以解除终末旋紧锁扣。","mechanism_tag":"膝锁解锁开关"},{"cue":"胫骨后肌(tibialis posterior)：在最深层如何兼具足内翻与维系足弓？","reveal":"居趾长与拇长屈肌之间贴骨间膜下行，绕内踝后方止于**足舟骨粗隆及楔/跖骨底**，是托举**足内侧纵弓**与足内翻的核心。","mechanism_tag":"内侧纵弓托架"},{"cue":"肌腱空间重排：为何拇长屈肌居外(腓侧)却在足底跨向内侧拇趾？","reveal":"在胫骨远端**拇长屈肌**（外）与**趾长屈肌**（内）随内踝后方入足底后发生**足底肌腱交叉**（Henry结），拇长屈肌深面跨至内侧拇趾。","mechanism_tag":"足底肌腱交叉"},{"cue":"腘窝(popliteal fossa)：菱形边界6标志与神经血管由浅入深次序？","reveal":"内上半腱/半膜肌，外上股二头肌长头，下界腓肠肌内外侧头；窝内由浅入深依次为**胫神经→腘静脉→腘动脉**。","mechanism_tag":"菱形6界浅深序"}],"takeaway":"深层4肌借**腘肌解锁、胫后肌托弓**与足底交叉协作，上接由浅入深为**胫神经-腘静脉-腘动脉**的菱形腘窝。","quiz":{"stem":"膝关节后方腘窝区急性后向刀刺伤穿透深筋膜但尚浅，尚未触及贴近股骨腘面与膝后关节囊的最深部主干血管，却已先后波及两层主要管道/神经结构。依腘窝内容物由浅入深解剖排布，最深未受损与最浅先受损的结构分别是：","options":["最深未受损为胫神经，最浅先受损为腘动脉","最深未受损为腘动脉，最浅先受损为胫神经","最深未受损为腘静脉，最浅先受损为腓总神经","最深未受损为坐骨神经，最浅先受损为大隐静脉"],"answer_idx":1,"explain":"**腘窝**内主要神经血管由浅入深排列依次为：**胫神经（最浅）→ 腘静脉（居中）→ 腘动脉（最深，紧贴股骨腘面与膝关节囊）**；因而腘窝后方浅表刺伤先累及胫神经与腘静脉，而股骨髁上骨折向后移位则最先刺破贴骨的腘动脉。","remedial_node_id":"anat_musc_limb_leg_core"}},"added_at":"2026-11-18T20:20:32+08:00"}],"edges":[{"id":"e_heart_to_hyperemia","source":"anat_heart_chambers","target":"patho_hyperemia_vs_congestion","relation_type":"structural_basis","strength":0.9,"bridge_text":"心泵构成了体/肺循环的动力起点：当动脉端主动扩张输入过多为“充血”，而心室泵血衰竭导致静脉端回流受阻则形成“淤血”。"},{"id":"e_congestion_to_lung","source":"patho_hyperemia_vs_congestion","target":"patho_pulmonary_congestion","relation_type":"causal_next","strength":0.95,"bridge_text":"左心室衰竭时肺静脉回流受阻，肺部成为最先发生急性水肿或慢性褐色硬化的淤血靶器官。"},{"id":"e_heart_to_lung","source":"anat_heart_chambers","target":"patho_pulmonary_congestion","relation_type":"structural_basis","strength":0.85,"bridge_text":"4条肺静脉直接注入左心房：左房室瓣狭窄或左心衰使压力逆传肺毛细血管，直接触发肺淤血。"},{"id":"e_lung_to_lobule","source":"patho_pulmonary_congestion","target":"histo_liver_lobule","relation_type":"contrast_with","strength":0.85,"bridge_text":"左心衰累及肺泡毛细血管，而右心衰逆流沿下腔静脉直抵肝小叶中央静脉——先看清肝小叶的微血管流向。"},{"id":"e_lobule_to_liver_congestion","source":"histo_liver_lobule","target":"patho_hepatic_congestion","relation_type":"structural_basis","strength":0.95,"bridge_text":"正因为血液从门管区经肝窦流向中央静脉（越近中央氧越少），右心衰时中央3区最先淤血坏死，周边1区脂肪变，造就红黄相间的“槟榔肝”。"},{"id":"e_liver_congestion_to_portal","source":"patho_hepatic_congestion","target":"anat_portal_vein_system","relation_type":"causal_next","strength":0.95,"bridge_text":"长期槟榔肝使肝星状细胞胶原化、进展为淤血性肝硬化，阻塞肝窦血流并直接推高肝门静脉压力，迫使三大门腔侧支循环开放。"},{"id":"e_portal_to_edema","source":"anat_portal_vein_system","target":"patho_edema_mechanisms","relation_type":"clinical_manifestation","strength":0.9,"bridge_text":"门静脉高压使腹腔毛细血管流体静水压骤增，叠加肝衰引起的低白蛋白血症（胶体渗透压↓），共同引发顽固性腹水与下肢水肿。"},{"id":"e_congestion_to_edema","source":"patho_hyperemia_vs_congestion","target":"patho_edema_mechanisms","relation_type":"causal_next","strength":0.85,"bridge_text":"任何部位的静脉性淤血都会抬高微静脉端流体静水压，因此“淤血性水肿”是水肿发生最常见的原因之一。"},{"id":"e_portal_to_hyperammonemia","source":"anat_portal_vein_system","target":"biochem_hyperammonemia_he","relation_type":"cross_discipline","strength":0.95,"bridge_text":"【跨学科枢纽】门体侧支吻合开放后，肠道细菌产生的氨与腐败胺绕过肝脏直接进入体循环并透过血脑屏障，成为肝硬化患者诱发肝性脑病的直接通道。"},{"id":"e_liver_congestion_to_urea","source":"patho_hepatic_congestion","target":"biochem_urea_cycle","relation_type":"cross_discipline","strength":0.88,"bridge_text":"【跨学科枢纽】肝小叶大量肝细胞萎缩、坏死及线粒体受损时，仅存于肝细胞的鸟氨酸循环（CPS-Ⅰ等）能力崩塌，血氨失去最重要清除去路。"},{"id":"e_pool_to_transam","source":"biochem_aa_pool","target":"biochem_transamination_deamination","relation_type":"causal_next","strength":0.92,"bridge_text":"氨基酸代谢库中多余氨基酸进入分解去路时，第一步必须先将α-氨基脱下——这靠“转氨基 + 谷氨酸脱氢”的联合脱氨基完成。"},{"id":"e_transam_to_sources","source":"biochem_transamination_deamination","target":"biochem_blood_ammonia_sources","relation_type":"causal_next","strength":0.95,"bridge_text":"体内各组织经联合脱氨基释放出的游离NH₃汇入血液，连同肠道产氨和肾小管泌氨共同构成血氨的三大来源。"},{"id":"e_putrefaction_to_sources","source":"biochem_protein_putrefaction","target":"biochem_blood_ammonia_sources","relation_type":"causal_next","strength":0.82,"bridge_text":"结肠细菌腐败脱氨基及肠菌尿素酶水解尿素，构成了每天约4g血氨的第二个主要来源（其吸收受肠道pH离子障严格调控）。"},{"id":"e_putrefaction_to_he","source":"biochem_protein_putrefaction","target":"biochem_hyperammonemia_he","relation_type":"causal_next","strength":0.85,"bridge_text":"肠道腐败产生的酪胺和苯乙胺若未被肝单胺氧化酶清除而进入脑组织，将转化为假神经递质干扰儿茶酚胺传递。"},{"id":"e_sources_to_transport","source":"biochem_blood_ammonia_sources","target":"biochem_ammonia_transport","relation_type":"causal_next","strength":0.95,"bridge_text":"游离NH₃对脑组织有剧毒，不能直接随血远距离漂流，必须由外周组织先合成为丙氨酸或谷氨酰胺这两种无毒载体运往肝肾。"},{"id":"e_transport_to_urea","source":"biochem_ammonia_transport","target":"biochem_urea_cycle","relation_type":"causal_next","strength":0.96,"bridge_text":"丙氨酸与谷氨酰胺抵达肝脏后释放NH₃，随即进入肝细胞“两步线粒体、三步胞质”的鸟氨酸循环转化为无毒尿素。"},{"id":"e_urea_to_he","source":"biochem_urea_cycle","target":"biochem_hyperammonemia_he","relation_type":"causal_next","strength":0.95,"bridge_text":"一旦鸟氨酸循环酶缺陷或肝功能衰竭受阻，血氨急剧飙升突破脑代偿上限，通过抽空α-酮戊二酸导致脑能量危机与星形胶质细胞水肿。"},{"id":"e_transport_to_asparaginase","source":"biochem_ammonia_transport","target":"biochem_asparaginase_leukemia","relation_type":"clinical_manifestation","strength":0.72,"bridge_text":"谷氨酰胺不仅运氨，还是体内合成天冬酰胺的酰胺基供体——利用白血病细胞缺乏天冬酰胺合成酶这一弱点，催生了天冬酰胺酶靶向疗法。"},{"id":"e_homeo_to_transport","source":"physio_homeostasis_feedback","target":"physio_membrane_transport","relation_type":"prerequisite","strength":0.85,"bridge_text":"内环境与细胞内液的成分分隔与稳态维持，直接依靠细胞膜上的各种跨膜物质转运蛋白（尤其是Na⁺-K⁺泵）。"},{"id":"e_transport_to_rp","source":"physio_membrane_transport","target":"physio_resting_potential","relation_type":"prerequisite","strength":0.96,"bridge_text":"Na⁺-K⁺泵建立的“胞内高K⁺、胞外高Na⁺”浓度梯度，正是静息时K⁺外流形成负值静息电位的全部化学势能基础。"},{"id":"e_rp_to_ap","source":"physio_resting_potential","target":"physio_action_potential","relation_type":"prerequisite","strength":0.96,"bridge_text":"静息负电位使电压门控Na⁺通道处于“可激活的静息态”；当刺激使其去极化至阈电位，通道再生性正反馈开放即爆发动作电位。"},{"id":"e_ap_to_homeo","source":"physio_action_potential","target":"physio_homeostasis_feedback","relation_type":"cross_discipline","strength":0.75,"bridge_text":"动作电位上升支“去极化→更多Na⁺通道开→更多Na⁺内流”的Hodgkin循环，正是细胞水平最典型的正反馈调节实例。"},{"id":"e_ap_to_synapse","source":"physio_action_potential","target":"histo_chemical_synapse","relation_type":"causal_next","strength":0.9,"bridge_text":"沿有髓神经纤维跳跃传导的动作电位抵达轴突末梢后，需要跨越化学突触的超微三元结构才能把兴奋交给肌肉细胞。"},{"id":"e_synapse_to_nmj","source":"histo_chemical_synapse","target":"physio_nmj_transmission","relation_type":"structural_basis","strength":0.95,"bridge_text":"运动终板正是特化的化学突触：前膜囊泡、20–30nm间隙内的AChE与后膜N₂受体通道共同决定了1:1单向高效传递。"},{"id":"e_nmj_to_triad","source":"physio_nmj_transmission","target":"histo_skeletal_muscle_triad","relation_type":"causal_next","strength":0.94,"bridge_text":"终板电位(EPP)触发一般肌膜动作电位后，兴奋必须经肌膜内陷的T小管深入肌纤维内部——这离不开肌节与“三联管”的超微构筑。"},{"id":"e_triad_to_sliding","source":"histo_skeletal_muscle_triad","target":"physio_ec_coupling_sliding","relation_type":"structural_basis","strength":0.96,"bridge_text":"三联管的T管(DHPR)与终池(RyR)机械贴合触发Ca²⁺瞬间释放，随后Ca²⁺作用于细肌丝TnC，正式启动横桥周期与肌丝滑行。"},{"id":"e_sliding_to_smooth","source":"physio_ec_coupling_sliding","target":"physio_skeletal_vs_smooth","relation_type":"contrast_with","strength":0.9,"bridge_text":"掌握骨骼肌Ca²⁺-TnC耦联后，务必对比无T管且无肌钙蛋白的平滑肌——它走的是胞外Ca²⁺→CaM→MLCK磷酸化路径。"},{"id":"e_sliding_to_load","source":"physio_ec_coupling_sliding","target":"physio_muscle_load_factors","relation_type":"causal_next","strength":0.9,"bridge_text":"微观横桥能与肌动蛋白形成多少有效连接、以及胞内Ca²⁺浓度多高，直接决定了宏观肌肉的前负荷（最适初长度）、后负荷与收缩能力曲线。"},{"id":"e_nmj_to_pharma","source":"physio_nmj_transmission","target":"pharma_efferent_transmitters","relation_type":"cross_discipline","strength":0.92,"bridge_text":"【跨学科枢纽】运动神经释放ACh经AChE毫秒级分解终止传递，这只是传出神经递质的一半图景；药理学还需对比交感神经去甲肾上腺素(NA)的摄取1回收机制。"},{"id":"e_adapt_to_hydropic","source":"patho_cellular_adaptation","target":"patho_hydropic_degeneration","relation_type":"causal_next","strength":0.92,"bridge_text":"当损伤刺激超出细胞适应（萎缩/肥大/增生/化生）的代偿极限，细胞进入可逆性损伤阶段——其中最先且最常出现的便是细胞水肿。"},{"id":"e_transport_to_hydropic","source":"physio_membrane_transport","targ lycolysis_pathway_atp","target":"biochem_pfk1_pfk2_switch","relation_type":"causal_next","strength":0.94,"bridge_text":"正因为糖酵解先耗2 ATP后产4 ATP并高度依赖细胞能荷平衡，第3步不可逆限速酶PFK-1及其上游双功能酶PFK-2/FBP-2演化为决定糖流放行或刹车的最高阀门。"},{"id":"e_glycolysis_to_hydropic","source":"biochem_glycolysis_pathway_atp","target":"patho_hydropic_degeneration","relation_type":"cross_discipline","strength":0.88,"bridge_text":"机体缺氧时线粒体氧化磷酸化瘫痪，仅靠糖酵解单糖净产2 ATP远不足以维持细胞膜Na⁺-K⁺泵运转，Na⁺与水大量潴留胞内即直接诱发病理学细胞水肿（颗粒变性）。"},{"id":"e_pfk1_to_pdh","source":"biochem_pfk1_pfk2_switch","target":"biochem_pdh_complex_mechanism","relation_type":"causal_next","strength":0.94,"bridge_text":"当PFK-1与丙酮酸激酶阀门在富氧高能需求下放行糖酵解通量后，终产物丙酮酸进入线粒体基质接受PDH复合体不可逆氧化脱羧生成乙酰CoA，正式跨入有氧氧化阶段。"},{"id":"e_pdh_to_shuttles","source":"biochem_pdh_complex_mechanism","target":"biochem_cytosolic_nadh_shuttles","relation_type":"causal_next","strength":0.92,"bridge_text":"有氧条件下丙酮酸进入线粒体由PDH脱羧而非在胞质还原成乳酸，导致胞质GAPDH生成的NADH必须寻找α-磷酸甘油或苹果酸-天冬氨酸两条穿梭通道跨越线粒体内膜。"},{"id":"e_transam_to_shuttles","source":"biochem_transamination_deamination","target":"biochem_cytosolic_nadh_shuttles","relation_type":"prerequisite","strength":0.88,"bridge_text":"苹果酸-天冬氨酸穿梭之所以能零损耗运送NADH，全赖胞质与基质内的天冬氨酸转氨酶(AST，辅酶PLP)将不能透内膜的草酰乙酸可逆转化为天冬氨酸完成闭环。"},{"id":"e_shuttles_to_tca","source":"biochem_cytosolic_nadh_shuttles","target":"biochem_tca_cycle_steps_energy","relation_type":"causal_next","strength":0.94,"bridge_text":"胞质穿梭送入线粒体的还原当量与PDH生成的乙酰CoA在线粒体汇合，推动乙酰CoA与草酰乙酸缩合启动三羧酸循环八步脱氢脱羧，产出单糖有氧30或32 ATP中的20 ATP主力。"},{"id":"e_tca_steps_to_hub","source":"biochem_tca_cycle_steps_energy","target":"biochem_tca_regulation_hub","relation_type":"causal_next","strength":0.94,"bridge_text":"三羧酸循环三步不可逆放能反应与四次脱氢奠定了产能主轴，也使三大限速酶必须接收能荷/产物反馈并借回补机制统筹糖、脂、氨基酸之间的碳骨架互换。"},{"id":"e_tca_steps_to_hyperammonemia","source":"biochem_tca_cycle_steps_energy","target":"biochem_hyperammonemia_he","relation_type":"cross_discipline","strength":0.9,"bridge_text":"TCA循环中间产物α-酮戊二酸既是关键氧化脱羧节点，也是脑星形胶质细胞中和游离NH₃合成谷氨酰胺的必经受体，高血氨持续抽空α-酮戊二酸将直接引发脑TCA能量衰竭。"},{"id":"e_t 应期、相对不应期、超常期与低常期的兴奋性时间轴。"},{"id":"e_excitability_cycle_to_clamp_gap","source":"physio_excitability_refractory_cycle","target":"physio_voltage_patch_clamp_gap","relation_type":"causal_next","strength":0.88,"bridge_text":"要从实验上验证上述周期性电导变化，必须依托电压钳/膜片钳配合TTX/TEA拆解单离子电导；而单细胞爆发的AP则需进一步靠缝隙连接跨细胞电传播。"},{"id":"e_ap_to_clamp_gap","source":"physio_action_potential","target":"physio_voltage_patch_clamp_gap","relation_type":"prerequisite","strength":0.9,"bridge_text":"理解动作电位去极内向流与复极外向流的宏观波形后，需回溯霍奇金-赫胥黎电压钳/膜片钳怎样排除电容电流干扰并分离出G_Na与G_K的电压-时间依赖性。"},{"id":"e_clamp_gap_to_smooth","source":"physio_voltage_patch_clamp_gap","target":"physio_skeletal_vs_smooth","relation_type":"cross_discipline","strength":0.86,"bridge_text":"由六聚体连接子构成的缝隙连接把电信号低阻双向传遍相邻细胞，是胃肠道与子宫等单单位平滑肌同步舒缩成为“功能合胞体”的结构基础。"},{"id":"e_clamp_gap_to_summation","source":"physio_voltage_patch_clamp_gap","target":"physio_contraction_summation_motor_unit","relation_type":"causal_next","strength":0.88,"bridge_text":"不同于借缝隙连接整片同步兴奋的平滑肌/心肌，骨骼肌纤维彼此电绝缘，必须由脊髓α运动神经元按大小原则分批募集运动单位并借高频总和精准调节张力。"},{"id":"e_load_to_summation","source":"physio_muscle_load_factors","target":"physio_contraction_summation_motor_unit","relation_type":"prerequisite","strength":0.92,"bridge_text":"掌握单根骨骼肌的前负荷与后负荷规律后，方能理解肌肉在对抗负荷时如何先等长蓄力后等张缩短，并通过频率总和与多纤维募集突破单收缩张力上限。"},{"id":"e_ec_to_summation","source":"physio_ec_coupling_sliding","target":"physio_contraction_summation_motor_unit","relation_type":"prerequisite","strength":0.9,"bridge_text":"虽然肌膜动作电位因不应期无法叠加，但高频兴奋使终池来不及通过SERCA泵清零胞质Ca²⁺，从而驱动横桥连续拉动肌丝输出3–4倍张力的完全强直收缩。"},{"id":"e_homeo_to_energy_substrates","source":"physio_homeostasis_feedback","target":"physio_energy_substrates_atp_cp","relation_type":"prerequisite","strength":0.9,"bridge_text":"机体依靠下丘脑摄食中枢与饱中枢经血糖及瘦素信号负反馈交互抑制，才能长期维持能量摄入与消耗的动态稳态。"},{"id":"e_tca_to_energy_substrates","source":"biochem_tca_cycle_steps_energy","target":"physio_energy_substrates_atp_cp","relation_type":"cross_discipline","strength":0.86,"bridge_text":"糖、脂肪与蛋白质分解产物最终均汇入线粒体三羧酸循环与呼吸链释放C-H化学能，耦联生成ATP并有55%–75%直接转热维持体温。"},{"id":"e_fa_beta_to_energy_substrates","source":"biochem_fa_beta_oxidation_shuttle","target":"physio_energy_substrates_atp_cp","relation_type":"cross_discipline","strength":0.84,"bridge_text":"脂肪酸经肉碱穿梭与β-氧化产生远高于等质量糖类的ATP与乙酰CoA，奠定了脂肪占体内储能75%且主导饥饿期供能的生化基础。"},{"id":"e_substrates_to_calorimetry","source":"physio_energy_substrates_atp_cp","target":"physio_calorimetry_thermal_equiv","relation_type":"causal_next","strength":0.9,"bridge_text":"正因为除骨骼肌做外功外一切生物能最终都转化为热能，安静不做外功时只要测出热释放或氧耗定比关系即可定量测定能量代谢率。"},{"id":"e_urea_to_calorimetry","source":"biochem_urea_cycle","target":"physio_calorimetry_thermal_equiv","relation_type":"cross_discipline","strength":0.88,"bridge_text":"肝脏鸟氨酸循环将蛋白质脱下的氨基合成为尿素随尿排出并保留残余化学能，直接造成蛋白质生物热价(18.0)低于体外物理热价(23.4)。"},{"id":"e_calorimetry_to_rq","source":"physio_calorimetry_thermal_equiv","target":"physio_rq_nprq_clinical_eval","relation_type":"causal_next","strength":0.92,"bridge_text":"确定糖、脂肪、蛋白质各自的热价、氧热价与RQ特征值后，临床即可利用定比定律解析患者实测RQ波动并通过尿氮剥离蛋白算出NPRQ。"},{"id":"e_ketone_to_rq_eval","source":"biochem_ketogenesis_extrahepatic_use","target":"physio_rq_nprq_clinical_eval","relation_type":"cross_discipline","strength":0.85,"bridge_text":"糖尿病血糖利用受阻转为脂肪动员及高通量生酮供能使RQ跌近0.71，若叠加酮症酸中毒触发深大通气则会呼出额外CO₂导致RQ假性抬高。"},{"id":"e_gng_to_rq_eval","source":"biochem_gluconeogenesis_bypasses","target":"physio_rq_nprq_clinical_eval","relation_type":"cross_discipline","strength":0.8,"bridge_text":"长期饥饿时糖异生与脂肪及氨基酸分解协同重塑碳骨架去路，使整体RQ依底物比例在脂肪(0.71)与蛋白(0.80)区间规律移动。"},{"id":"e_rq_to_factors","source":"physio_rq_nprq_clinical_eval","target":"physio_energy_factors_sda","relation_type":"causal_next","strength":0.9,"bridge_text":"掌握直接与间接测热工具并排除通气误差后，便能定量测量肌肉活动、精神紧张、环境温度及进食SDA对整体能量代谢的放大效应。"},{"id":"e_urea_to_sda","source":"biochem_urea_cycle","target":"physio_energy_factors_sda","relation_type":"cross_discipline","strength":0.88,"bridge_text":"肝内氨基酸脱氨基后启动鸟氨酸循环每合成1分子尿素须消耗4个高能磷酸键，构成了蛋白质诱发高达30%食物特殊动力效应的肝内耗能主因。"},{"id":"e_muscle_load_to_factors","source":"physio_muscle_load_factors","target":"physio_energy_factors_sda","relation_type":"cross_discipline","strength":0.85,"bridge_text":"肌肉负荷越高、横桥ATP酶与肌浆网钙泵作功越剧烈，机体耗氧量可呈10–20倍跃升并在运动后以氧债(EPOC)形式偿还缺氧债务。"},{"id":"e_factors_to_bmr","source":"physio_energy_factors_sda","target":"physio_bmr_surface_law","relation_type":"prerequisite","strength":0.92,"bridge_text":"正是因为肌肉活动、进食SDA(可持续8h)、精神紧张与冷热环境剧烈拉高能耗，测BMR才必须严卡空腹12–14h、静卧、20–25℃四大基础条件。"},{"id":"e_bmr_to_body_temp","source":"physio_bmr_surface_law","target":"physio_body_temp_core_shell_rhythms","relation_type":"causal_next","strength":0.88,"bridge_text":"基础与日常代谢持续释放的大量热能构成了内源热底座，经血液循环分布后形成37℃稳定的体核温度与受环境影响的体壳温度梯度。"},{"id":"e_body_temp_to_heat_prod","source":"physio_body_temp_core_shell_rhythms","target":"physio_heat_production_organs_ucp","relation_type":"causal_next","strength":0.9,"bridge_text":"当外界寒冷使体壳散热剧增并威胁体核37℃稳态时，机体必须按静息、运动或新生儿状态切换肝脏、战栗骨骼肌与BAT-UCP1产热引擎。"},{"id":"e_bat_histo_to_heat_prod","source":"histo_adipose_tissue","target":"physio_heat_production_organs_ucp","relation_type":"structural_basis","strength":0.9,"bridge_text":"棕色脂肪多小脂滴、极丰富线粒体与密集毛细血管网的超微构造，直接支撑了UCP1质子漏产生大量非战栗热量并迅速暖血入体核。"},{"id":"e_heat_prod_to_heat_loss","source":"physio_heat_production_organs_ucp","target":"physio_heat_loss_physics_sweat_vaso","relation_type":"contrast_with","strength":0.9,"bridge_text":"产热器官决定体内生成多少热量，而体热能否守恒还取决于对侧由皮肤血流量及辐射、传导、对流、蒸发四条物理通道决定的散热速率。"},{"id":"e_body_temp_to_heat_loss_prereq","source":"physio_body_temp_core_shell_rhythms","target":"physio_heat_loss_physics_sweat_vaso","relation_type":"prerequisite","strength":0.85,"bridge_text":"只有体核温度高于体壳皮肤温度、且皮肤温度高于环境温度时，体热才能顺梯度经血运转移至体表并依靠辐射、传导与对流发散。"},{"id":"e_heat_loss_to_setpoint","source":"physio_heat_loss_physics_sweat_vaso","target":"physio_thermoregulation_setpoint","relation_type":"causal_next","strength":0.92,"bridge_text":"皮肤血管舒缩、胆碱能发汗等散热输出与战栗/BAT产热引擎，统一接受视前区-下丘脑前部(POAH)37℃调定点比较器整合内外温度后的负反馈闭环调度。"},{"id":"e_heat_loss_to_hyperthermia","source":"physio_heat_loss_physics_sweat_vaso","target":"pathophys_fever_vs_hyperthermia","relation_type":"cross_discipline","strength":0.88,"bridge_text":"环境≥皮温且高湿阻断唯一蒸发散热出口或无汗腺障碍时，POAH调定点虽未上移却仍发生危及生命的被动“过热/热射病”，区别于致热原引起的调节性“发热”。"},{"id":"e_bmr_to_fever_bat","source":"physio_bmr_surface_law","target":"pathophys_fever_metabolism_bat","relation_type":"cross_discipline","strength":0.85,"bridge_text":"正常生理须在20–25℃基础状态标化BMR，而病理性发热时中心体温每升高1℃即可直接推高BMR约13%，伴负氮平衡与蛋白分解消耗增加。"},{"id":"e_heat_prod_to_fever_bat","source":"physio_heat_production_organs_ucp","target":"pathophys_fever_metabolism_bat","relation_type":"cross_discipline","strength":0.86,"bridge_text":"正常御寒时交感儿茶酚胺驱动BAT内UCP1质子漏与战栗产热的生理机制，在发热体温上升期被PGE₂上移的新调定点全面征用以快速推高体温。"},{"id":"e_homeo_to_disease_concept","source":"physio_homeostasis_feedback","target":"pathophys_health_subhealth_disease","relation_type":"prerequisite","strength":0.92,"bridge_text":"生理学负反馈维系的动态稳态构成健康的躯体基线；一旦强病因突破自我调节上限，系统即偏离稳态跌入亚健康或疾病状态。"},{"id":"e_disease_to_etiology","source":"pathophys_health_subhealth_disease","target":"pathophys_etiology_vs_condition","relation_type":"causal_next","strength":0.9,"bridge_text":"疾病定义明确指向“一定病因引发稳态紊乱”，因此必须先辨析赋予疾病特异性的病因、调控发病阈值并可互换的条件以及起催化作用的诱因。"},{"id":"e_etiology_to_seven_classes","source":"pathophys_etiology_vs_condition","target":"pathophys_etiology_seven_classes","relation_type":"causal_next","strength":0.88,"bridge_text":"厘清病因与条件的相对转化规律后，方能按生物、理化、遗传、先天、免疫、营养与心理社会七大门类把握不同因子的致病选择性与作用时程。"},{"id":"e_seven_classes_to_laws","source":"pathophys_etiology_seven_classes","target":"pathophys_pathogenesis_general_laws","relation_type":"causal_next","strength":0.88,"bridge_text":"七大类病因虽入侵门户与组织选择性各异，但击破机体防线后无一例外沿稳态失衡、损伤抗损伤转化、因果交替与局部整体互作四大共同规律演进。"},{"id":"e_etiology_prereq_laws","source":"pathophys_etiology_vs_condition","target":"pathophys_pathogenesis_general_laws","relation_type":"prerequisite","strength":0.9,"bridge_text":"明确了病因决定特异性及条件加速致病的门槛机制，才能理解失血或感染等原始病因如何触发损伤与抗损伤的因果交替循环。"},{"id":"e_homeo_prereq_laws","source":"physio_homeostasis_feedback","target":"pathophys_pathogenesis_general_laws","re n","target":"histo_bone_growth_regulation","relation_type":"structural_basis","strength":0.88,"bridge_text":"破骨细胞表面RANK受体及成骨细胞所产RANKL/OPG比率，是PTH、雌激素与IL-1/IL-6等全身及局部因子调控骨吸收的核心分子汇合点。"},{"id":"e_chol_vitd_to_bone_reg","source":"biochem_cholesterol_transformation_bile","target":"histo_bone_growth_regulation","relation_type":"cross_discipline","strength":0.88,"bridge_text":"皮肤7-脱氢胆固醇经UV、肝25-羟化及肾1α-羟化生成的活性1,25-(OH)₂D₃，是促肠钙吸收并保证骨类骨质及时钙化的必要前馈条件。"},{"id":"e_signaling_to_bone_reg","source":"physio_signaling_receptor_matrix","target":"histo_bone_growth_regulation","relation_type":"cross_discipline","strength":0.85,"bridge_text":"PTH/降钙素走膜GPCR快速调钙，GH走细胞因子招募型受体促增殖，而1,25-(OH)₂D₃、甲素与性激素走核受体调控成骨/软骨基因转录。"},{"id":"e_bone_reg_to_excitability","source":"histo_bone_growth_regulation","target":"physio_excitability_refractory_cycle","relation_type":"cross_discipline","strength":0.88,"bridge_text":"骨骼作为99%钙贮库受PTH与Vit D稳衡；一旦血钙调控崩塌致低钙血症，即减弱细胞外Na⁺通道屏蔽使阈电位下移，诱发手足搐搦惊厥。"},{"id":"e_bone_matrix_to_calcification","source":"histo_bone_matrix_composition","target":"patho_calcification_types","relation_type":"structural_basis","strength":0.88,"bridge_text":"正常骨基质依赖基质小泡与Ⅰ型胶原实现受控生理性钙化；理解生理矿化机制方可界定病理切片中坏死局部沉积或高钙血症驱动的病理性钙化。"},{"id":"e_osteoclast_to_calcification","source":"histo_bone_osteoclast_resorption","target":"patho_calcification_types","relation_type":"cross_discipline","strength":0.86,"bridge_text":"甲状旁腺功能亢进或骨肿瘤诱发破骨细胞亢进溶骨时，海量羟磷灰石释放入血致高钙血症，驱动肾小管、肺泡壁与胃黏膜发生转移性钙化。"},{"id":"e_bone_matrix_to_patho_fracture","source":"histo_bone_matrix_composition","target":"patho_fracture_healing_and_factors","relation_type":"structural_basis","strength":0.88,"bridge_text":"90%Ⅰ型胶原有机质骨架决定了骨折愈合必须依赖足够蛋白质与维生素C羟化胶原链，否则即使血钙充足新生骨痂亦脆弱难愈。"},{"id":"e_remodeling_to_osteosarcoma","source":"histo_long_bone_growth_remodeling","target":"patho_tumor_epithelial_mesenchymal_types","relation_type":"structural_basis","strength":0.85,"bridge_text":"青少年长骨干骺端（骺板成骨区）是全身成骨祖细胞分裂与骨改建最旺盛的部位，因而也成为恶性成骨肉瘤最易好发并掀起骨外膜呈Codman三角之处。"},{"id":"e_remodeling_ th","strength":0.88,"bridge_text":"对比分叶核携特殊颗粒执行快速非特异吞噬或过敏反应的有粒细胞，无粒的单核与淋巴细胞分别转向长效巨噬清除与T/B特异性免疫。"},{"id":"e_agranulocytes_to_platelet","source":"histo_blood_agranulocytes","target":"histo_blood_platelet","relation_type":"causal_next","strength":0.86,"bridge_text":"血细胞第三大家族并非完整有核细胞，而是骨髓巨核细胞脱落的无核胞质片——血小板，携微管束与两类颗粒把控血管破口止血。"},{"id":"e_plasma_to_platelet","source":"histo_blood_composition_plasma","target":"histo_blood_platelet","relation_type":"causal_next","strength":0.85,"bridge_text":"血小板激活后释放致密/α颗粒启动聚集形成初期血栓，还需协同血浆凝血酶将可溶纤维蛋白原转为纤维蛋白网才能完成稳固止血。"},{"id":"e_reticular_to_marrow","source":"histo_reticular_tissue","target":"histo_bone_marrow_hematopoiesis","relation_type":"structural_basis","strength":0.86,"bridge_text":"星形网状细胞连网并分泌嗜银Ⅲ型网状纤维构成骨髓造血支架，结合血窦壁共同托举造血干细胞与各系血细胞逐级分化。"},{"id":"e_reticulocyte_to_marrow","source":"histo_blood_reticulocyte","target":"histo_bone_marrow_hematopoiesis","relation_type":"causal_next","strength":0.82,"bridge_text":"外周血网织红细胞的释放消长正是红骨髓内造血干细胞经原红、早中晚幼红细胞脱核成熟与六大演变规律的终末缩影。"},{"id":"e_plasma_to_body_fluid","source":"histo_blood_composition_plasma","target":"physio_regulation_modes_body_fluid","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【跨学科】血浆作为占细胞外液1/4的关键流动隔室，借65–85 g/L血浆蛋白(A:G 1.5–2.5)维系胶体渗透压与内环境稳态。"},{"id":"e_rbc_to_hb_biochem","source":"histo_blood_erythrocyte","target":"biochem_hb_allostery_bpg_bohr","relation_type":"cross_discipline","strength":0.88,"bridge_text":"【跨学科】成熟红细胞抛弃细胞核与细胞器腾出全部胞质装载血红蛋白(Hb)，这正是生化Hb变构T↔R正协同与波尔效应发挥运氧缓冲的结构载体。"},{"id":"e_rbc_to_ppp_biochem","source":"histo_blood_erythrocyte","target":"biochem_pentose_phosphate_pathway","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【跨学科】正因为成熟红细胞没有线粒体与细胞核无法再生膜蛋白，它高度依赖磷酸戊糖途径生成NADPH维持还原型谷胱甘肽以保护血影蛋白免于氧化溶血。"},{"id":"e_rbc_to_membrane_transport","source":"histo_blood_erythrocyte","target":"physio_membrane_transport","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【跨学科】红细胞膜上丰富的带3蛋白(Cl⁻/HCO₃⁻交换)与Na⁺-K⁺泵共同调节胞内渗透压与气体碳酸氢盐转运，维系双凹盘不发生渗透性溶血。"},{" xt":"明确神经元是神经组织感受整合与传导冲动的核心单元后，须深入胞体核周质的尼氏体与神经原纤维，解析其高强度合成与长距离运输的细胞器基础。"},{"id":"e_neuro_soma_to_processes","source":"histo_neuro_soma_ultrastructure","target":"histo_neuro_processes_classification","relation_type":"prerequisite","strength":0.9,"bridge_text":"只有先掌握胞体内尼氏体(rER)与微管在核周质和轴丘的分布梯度，才能看懂树突与轴突的超微分化以及多极/双极/假单极神经元的回路分工。"},{"id":"e_neuro_processes_to_synapse","source":"histo_neuro_processes_classification","target":"histo_chemical_synapse","relation_type":"causal_next","strength":0.88,"bridge_text":"感觉、中间与运动神经元分化出极性轴突终末与树突棘后，必须通过特化细胞连接——化学突触——才能完成神经元间及神经元对效应细胞的单向信息传递。"},{"id":"e_neuro_synapse_to_glia","source":"histo_chemical_synapse","target":"histo_neuro_glia_comparison","relation_type":"causal_next","strength":0.86,"bridge_text":"高频率的突触囊泡释放与长距离轴突传导一刻也离不开神经胶质细胞的绝缘、递质回收与免疫巡检——由此对比中枢4类与周围2类胶质细胞的分工。"},{"id":"e_neuro_glia_to_bbb","source":"histo_neuro_glia_comparison","target":"histo_neuro_astrocyte_bbb","relation_type":"prerequisite","strength":0.9,"bridge_text":"定位星形胶质细胞的中枢支架与GFAP特征后，进一步解剖其血管周脚板如何协同连续内皮紧密连接与基膜共同构筑血脑屏障(BBB)。"},{"id":"e_neuro_bbb_to_myelin","source":"histo_neuro_astrocyte_bbb","target":"histo_neuro_myelin_ultrastructure","relation_type":"causal_next","strength":0.86,"bridge_text":"从胶质界膜保护微环境转向胶质细胞对神经元长突起的紧密包裹：胶质质膜沿着轴突系膜螺旋卷绕形成髓鞘并留出郎飞结实现高速信号绝缘传导。"},{"id":"e_neuro_glia_to_myelin","source":"histo_neuro_glia_comparison","target":"histo_neuro_myelin_ultrastructure","relation_type":"structural_basis","strength":0.9,"bridge_text":"施万细胞与少突胶质细胞的质膜螺旋包卷构筑了髓鞘电镜下的主致密线与板层间线，同时也直接决定基膜与施兰切迹的有无。"},{"id":"e_neuro_myelin_to_fibers","source":"histo_neuro_myelin_ultrastructure","target":"histo_neuro_fibers_comparison","relation_type":"prerequisite","strength":0.9,"bridge_text":"理解髓鞘同心板层、施兰切迹与郎飞结的超微构筑后，便可横向区分PNS/CNS有髓纤维与Remak束/裸露无髓纤维在结构与传导速度上的全谱差异。"},{"id":"e_neuro_fibers_to_sensory","source":"histo_neuro_fibers_comparison","target":"histo_neuro_sensory_endings","relation_type":"causal_next","strength":0.86,"bridge_text":"周围感觉神经纤维抵达皮肤或骨骼肌靶区时脱去髓鞘，依裸露或被囊包裹差异特化为游离末梢、触觉/环层小体与肌梭四类感受器。"},{"id":"e_neuro_sensory_to_motor_endplate","source":"histo_neuro_sensory_endings","target":"histo_neuro_motor_endplate","relation_type":"causal_next","strength":0.86,"bridge_text":"感觉末梢传入信息经中枢整合后沿传出神经纤维下达效应器——在骨骼肌特化为结构精密的运动终板，而在平滑肌腺体则形成串珠状膨体。"},{"id":"e_neuro_synapse_to_motor_endplate","source":"histo_chemical_synapse","target":"histo_neuro_motor_endplate","relation_type":"structural_basis","strength":0.88,"bridge_text":"躯体运动终板本质上是轴突终末与骨骼肌膜之间特化的外周化学突触，在突触三元构造上进一步演化出施万细胞帽、基膜AChE与深陷的突触后膜皱褶。"},{"id":"e_neuro_motor_to_regen","source":"histo_neuro_motor_endplate","target":"histo_neuro_degen_regen","relation_type":"causal_next","strength":0.85,"bridge_text":"当长距离投射的周围或中枢神经纤维遭受离断损伤、下游效应器失去支配后，成体神经干细胞分布与胶质微环境将彻底分流PNS再生与CNS瘢痕结局。"},{"id":"e_neuro_soma_to_regen","source":"histo_neuro_soma_ultrastructure","target":"histo_neuro_degen_regen","relation_type":"structural_basis","strength":0.86,"bridge_text":"微管轴浆运输阻断触发远端华勒变性，而胞体尼氏体(rER)溶解并重编程大量合成结构蛋白则是近端轴突芽生再生不可或缺的代谢支撑。"},{"id":"e_neuro_bbb_to_regen","source":"histo_neuro_astrocyte_bbb","target":"histo_neuro_degen_regen","relation_type":"structural_basis","strength":0.86,"bridge_text":"正常护卫血脑屏障的星形胶质细胞在中枢神经重创后激活增殖，堆积成致密GFAP⁺胶质瘢痕并从物理与化学两面锁死中枢轴突再生。"},{"id":"e_epith_to_neuro_overview","source":"histo_epith_tissue_polarity_features","target":"histo_neuro_tissue_overview","relation_type":"causal_next","strength":0.84,"bridge_text":"从四大基本组织总纲承接至最高分化的神经组织：外胚层衍生的神经元与胶质细胞放弃丰富间质，专职打造快速电-化学信号网络。"},{"id":"e_ct_to_neuro_overview","source":"histo_ct_general_features","target":"histo_neuro_tissue_overview","relation_type":"contrast_with","strength":0.84,"bridge_text":"与中胚层间充质起源、细胞散在且细胞外基质极其丰富的结缔组织相反，神经组织细胞极度密集而间质极少，代谢支护全交由神经胶质细胞与脑血管承担。"},{"id":"e_methods_to_neuro_myelin","source":"histo_intro_lm_em_he_methods","target":"histo_neuro_myelin_ultrastructure","relation_type":"causal_next","strength":0.8,"bridge_text":"石蜡HE制片乙醇二甲苯脱脂会使含脂髓鞘呈空网状伪象，因此必须结合锇酸固定或镀银与电镜技术才能还原髓鞘板层与施兰切迹真实面貌。"},{"id":"e_macrophage_to_neuro_glia","source":"histo_lct_macrophage","target":"histo_neuro_glia_comparison","relation_type":"contrast_with","strength":0.85,"bridge_text":"外周疏松结缔组织单核源巨噬细胞穿行游走吞噬，而脑实质内同样由单核细胞迁入的小胶质细胞则作为CNS常驻巨噬细胞承担免疫警戒与突触修剪。"},{"id":"e_junctions_to_neuro_synapse","source":"histo_epith_lateral_junctions","target":"histo_chemical_synapse","relation_type":"contrast_with","strength":0.82,"bridge_text":"上皮细胞侧面六聚体连接子构成的缝隙连接在神经系统即为“电突触”（双向快传），而多数神经元间通讯仍仰赖伴20–30nm间隙与囊泡的单向“化学突触”。"},{"id":"e_junctions_to_neuro_bbb","source":"histo_epith_lateral_junctions","target":"histo_neuro_astrocyte_bbb","relation_type":"structural_basis","strength":0.86,"bridge_text":"正如肠道上皮顶端紧密连接封闭旁细胞大分子渗漏，脑连续毛细血管内皮间极度发达的紧密连接正是血脑屏障阻挡水溶性毒素入脑的首道结构闸门。"},{"id":"e_bm_to_neuro_bbb","source":"histo_epith_basal_bm_infolding","target":"histo_neuro_astrocyte_bbb","relation_type":"structural_basis","strength":0.85,"bridge_text":"连续内皮外侧紧贴的完整基膜与周细胞构成了血脑屏障的中间分子筛基座，与最外围星形胶质细胞脚板协同维持微血管渗透选择性。"},{"id":"e_dense_ct_to_neuro_nerve","source":"histo_dense_ct","target":"histo_neuro_myelin_ultrastructure","relation_type":"structural_basis","strength":0.84,"bridge_text":"外周神经干最外层包被的神经外膜即属致密结缔组织，为内部神经束膜与脆弱的施万髓鞘神经纤维束提供抗牵拉保护并携带营养血管。"},{"id":"e_neuro_soma_to_rp","source":"histo_neuro_soma_ultrastructure","target":"physio_resting_potential","relation_type":"structural_basis","strength":0.85,"bridge_text":"神经元胞体及突起表面镶嵌钾漏通道与钠泵的可兴奋质膜，是生理学K⁺外流建立-70~-90mV静息电位的细胞膜结构基础。"},{"id":"e_neuro_fibers_to_ap","source":"histo_neuro_fibers_comparison","target":"physio_action_potential","relation_type":"structural_basis","strength":0.86,"bridge_text":"有髓神经纤维在郎飞结裸露处高密度聚集电压门控Na⁺通道、结间体借高电阻低电容髓鞘绝缘，正是生理学动作电位高速跳跃传导的结构前提。"},{"id":"e_synapse_contrast_gap","source":"histo_chemical_synapse","target":"physio_voltage_patch_clamp_gap","relation_type":"contrast_with","strength":0.85,"bridge_text":"化学突触依靠前膜囊泡递质实现单向可塑调节（伴延搁），而电突触借缝隙连接六聚体连接子实现几乎无延搁的双向同步电传导。"},{"id":"e_neuro_bbb_to_ep","source":"histo_neuro_astrocyte_bbb","target":"pathophys_ep_entry_and_pos_mediators","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【跨学科枢纽】正常脑区紧闭的血脑屏障(BBB)阻隔外周大分子细胞因子，而下丘脑OVLT区缺少BBB的有孔血管及BBB特异性转运通路恰是内生致热原入脑上移调定点的门户。"},{"id":"e_neuro_bbb_to_he","source":"histo_neuro_astrocyte_bbb","target":"biochem_hyperammonemia_he","relation_type":"cross_discipline","strength":0.84,"bridge_text":"【跨学科枢纽】血氨升高时脂溶性游离NH₃可自由穿透血脑屏障进入包绕血管的星形胶质细胞，大量合成谷氨酰胺引起胶质渗透性肿胀与肝性脑病脑水肿。"},{"id":"e_neuro_endplate_to_triad","source":"histo_neuro_motor_endplate","target":"histo_skeletal_muscle_triad","relation_type":"structural_basis","strength":0.86,"bridge_text":"运动终板皱褶激活N₂受体引发的局部终板电位触发一般肌膜动作电位后，兴奋随即沿着横管(T管)深入肌纤维内部激活A-I交界处的三联管。"},{"id":"e_neuro_endplate_to_nmj","source":"histo_neuro_motor_endplate","target":"physio_nmj_transmission","relation_type":"structural_basis","strength":0.86,"bridge_text":"运动终板的ACh突触小泡、突触间隙基膜AChE与高密度终板膜皱褶N₂受体通道，共同奠定了生理学“Ca²⁺触发量子式释放→1:1终板电位”的超微构筑。"},{"id":"e_neuro_endplate_to_smooth","source":"histo_neuro_motor_endplate","target":"physio_skeletal_vs_smooth","relation_type":"structural_basis","strength":0.85,"bridge_text":"躯体运动终板1:1精准支配单根骨骼肌纤维，而内脏自主神经无髓纤维末端的串珠状膨体则广域扩散递质，配合平滑肌缝隙连接实现整片同步调节。"},{"id":"e_neuro_endplate_to_pharma","source":"histo_neuro_motor_endplate","target":"pharma_efferent_transmitters","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【跨学科枢纽】运动终板间隙基膜中的AChE决定胆碱能神经信号毫秒级灭活，而内脏串珠状膨体同时涵盖ACh与NA（依赖NET摄取1消除），直通传出神经药理学靶点。"},{"id":"e_neuro_regen_to_potential","source":"histo_neuro_degen_regen","target":"patho_repair_regeneration_potential","relation_type":"structural_basis","strength":0.88,"bridge_text":"成熟神经元退出细胞周期的“永久性细胞”本质及中枢缺乏基膜引导管而易生GFAP⁺胶质瘢痕，正是病理学判定脑脊髓毁损无法完全再生的组胚依据。"},{"id":"e_neuro_regen_to_stem","source":"histo_neuro_degen_regen","target":"patho_repair_stem_cells_tissues","relation_type":"cross_discipline","strength":0.88,"bridge_text":"【跨学科枢纽】成体脑SVZ/SGZ神经干细胞龛位与周围神经断裂后施万细胞形成Büngner带引导再生，在组织学与病理修复学中共同阐明了神经组织的修复极限。"},{"id":"e_monocyte_to_osteoclast_lineage","source":"histo_blood_agranulocytes","target":"histo_bone_osteoclast_resorption","relation_type":"causal_next" pidermis","source":"histo_ear_vestibular_corti_receptors","target":"histo_skin_epidermis_layers_barrier","relation_type":"causal_next","strength":0.85,"bridge_text":"外胚层不仅在内耳分化出精密的听觉与位觉毛细胞感受机械振波，更在人体最外表面演化为角化复层扁平上皮——**表皮**，借角蛋白交联与板层颗粒脂质封隙筑成抗磨防渗屏障。"},{"id":"e_sensory_epidermis_to_nonkeratinocytes","source":"histo_skin_epidermis_layers_barrier","target":"histo_skin_nonkeratinocytes_comparison","relation_type":"causal_next","strength":0.88,"bridge_text":"在以角质形成细胞为主体筑起物理渗透盾的表皮层间，还镶嵌着分别来自神经嵴、骨髓单核与APUD系统的三大**非角质形成细胞**，补全防UV色素、表皮免疫警戒与精细触觉功能。"},{"id":"e_sensory_nonkeratinocytes_to_appendages","source":"histo_skin_nonkeratinocytes_comparison","target":"histo_skin_dermis_appendages_nail","relation_type":"causal_next","strength":0.88,"bridge_text":"表皮基底层和黑素细胞不仅依真皮乳头层毛细血管获取弥散养分，更在胚胎期向下陷入**真皮网织层**与皮下组织，分化出毛囊、全浆皮脂腺、双型汗腺及指(趾)甲等完整皮肤附属器。"},{"id":"e_epith_covering_to_cornea","source":"histo_epith_covering_classification","target":"histo_eye_cornea_uvea_aqueous","relation_type":"structural_basis","strength":0.9,"bridge_text":"角膜外表面**未角化复层扁平上皮**（耐磨兼透光）与内表面单层扁平角膜内皮，正是被覆上皮按层数和表层形态分类在高度透明光学界面上的精准应用。"},{"id":"e_epith_covering_to_epidermis","source":"histo_epith_covering_classification","target":"histo_skin_epidermis_layers_barrier","relation_type":"structural_basis","strength":0.9,"bridge_text":"表皮是典型的**角化复层扁平上皮**，将多层耐摩擦上皮的分化演进至透明角质颗粒交联、胞核消失与角质层持续脱屑，适配体表干燥抗磨环境。"},{"id":"e_epith_junctions_to_retina","source":"histo_epith_lateral_junctions","target":"histo_eye_retina_relay_fovea","relation_type":"structural_basis","strength":0.9,"bridge_text":"视网膜色素上皮细胞(PEC)侧面发达的**紧密连接**筑成了血-视网膜外屏障，而PEC顶部与视细胞外节之间偏偏缺乏桥粒或紧密连接，成为**视网膜脱离**的好发弱点。"},{"id":"e_epith_junctions_to_epidermis","source":"histo_epith_lateral_junctions","target":"histo_skin_epidermis_layers_barrier","relation_type":"structural_basis","strength":0.9,"bridge_text":"表皮棘层细胞借大量**桥粒**锚定张力原纤维抵抗剪切撕裂，而桥粒芯糖蛋白遭自身抗体破坏即导致棘层松解水疱（寻常型天疱疮）。"},{"id":"e_epith_bm_to_cornea","source":"histo_epith_basal_bm_infolding","target":"histo_eye_cornea_uvea_aqueous","re oss_discipline","strength":0.84,"bridge_text":"【解剖→组胚拓展】成人红骨髓退守松质骨间隙而骨干填充黄骨髓，大失血时黄骨髓可重返造血，微观即遵循**骨髓造血微环境与血细胞发生律**。"},{"id":"e_anat_bone_macro_to_vein_char","source":"anat_bone_shape_macrostructure","target":"anat_vein_characteristics","relation_type":"cross_discipline","strength":0.85,"bridge_text":"【骨学→脉管】经骨**滋养孔与扁骨板障**走行的骨内静脉及板障静脉缺乏肌层与瓣膜，与颅内硬脑膜窦共同构成颅内外吻合及感染扩散通道。"},{"id":"e_anat_bone_macro_to_patho_fracture","source":"anat_bone_shape_macrostructure","target":"patho_fracture_healing_and_factors","relation_type":"cross_discipline","strength":0.87,"bridge_text":"【解剖→病理】骨折后**骨膜内层成骨细胞**增殖与**骨膜/滋养动脉**再通决定骨痂形成快慢，关键动脉断流则引发骨愈合延迟或**缺血性骨坏死**。"},{"id":"e_histo_bone_matrix_to_anat_chem","source":"histo_bone_matrix_composition","target":"anat_bone_chemistry_biomechanics","relation_type":"structural_basis","strength":0.86,"bridge_text":"【组胚→解剖】组胚揭示的**Ⅰ型胶原(35%)**与**羟磷灰石(65%)**超微嵌合（解剖按成人约3∶7计），直接决定脱钙骨可打结与煅烧骨易碎。"},{"id":"e_histo_cartilage_to_anat_joint_basic","source":"histo_cartilage_three_types_matrix","target":"anat_joint_basic_auxiliary_motion","relation_type":"structural_basis","strength":0.87,"bridge_text":"【组胚→解剖】无软骨膜且含Ⅱ型胶原的**透明软骨**铺就光滑难再生的关节面，而粗大Ⅰ型胶原**纤维软骨**则专职构成耐压减震的关节盘与半月板。"},{"id":"e_histo_dense_ct_to_anat_joint_basic","source":"histo_dense_ct","target":"anat_joint_basic_auxiliary_motion","relation_type":"cross_discipline","strength":0.85,"bridge_text":"【组胚→解剖】平行排列Ⅰ型胶原束的**规则致密结缔组织**赋予关节韧带极强抗张力，交织排列的**不规则致密CT**则构筑包裹关节的纤维层。"},{"id":"e_histo_osteogenesis_to_anat_ossification","source":"histo_osteogenesis_mechanisms","target":"anat_bone_ossification_plasticity","relation_type":"structural_basis","strength":0.86,"bridge_text":"【组胚→解剖拓展】长骨两端加长的**骺板软骨骨化**沿用软骨内成骨置换机制，而骨外膜贴面增粗则重演成骨细胞直接分泌类骨质的膜内成骨。"},{"id":"e_histo_growth_remodel_to_anat_ossification","source":"histo_long_bone_growth_remodeling","target":"anat_bone_ossification_plasticity","relation_type":"causal_next","strength":0.86,"bridge_text":"【组胚→解剖拓展】组胚骺板四区推长与“外膜成骨+内膜破骨”切锥改建机制，在解剖学上正对应**X线骺板透亮带闭合**及**茜草银丝实验**。"},{"id":"e_his ","strength":0.9,"bridge_text":"总论**扁骨板障**与**骨膜动脉血供**规律落地为：肩胛骨扁薄多肌覆易愈合，而**锁骨无骨髓腔**且全靠骨膜供血，中外1/3交界易断。"},{"id":"e_anat_joint_basic_to_upper_shoulder","source":"anat_joint_basic_auxiliary_motion","target":"anat_upper_shoulder_girdle_joint","relation_type":"structural_basis","strength":0.9,"bridge_text":"滑膜关节**关节唇加深骨窝**与薄松关节囊负压总则，在肩关节具体演化为盂唇配大头浅窝、三面护持唯**前下薄弱**。"},{"id":"e_anat_axes_to_upper_forearm_wrist","source":"anat_synovial_joint_axes_classes","target":"anat_upper_forearm_wrist_thumb","relation_type":"causal_next","strength":0.86,"bridge_text":"总论抽象的**单轴车轴、双轴椭圆与双轴鞍状**几何约束，在上肢远端分别实体化为桡尺旋转、桡腕屈伸收展及拇指对掌机制。"},{"id":"e_anat_direct_to_upper_forearm_wrist","source":"anat_direct_synarthroses_types","target":"anat_upper_forearm_wrist_thumb","relation_type":"contrast_with","strength":0.85,"bridge_text":"前臂**骨间膜**正是总论**纤维韧带连结**的典型代表，它虽无关节腔，却与滑膜型近远侧桡尺关节协同传递手撑地轴向应力。"},{"id":"e_upper_girdle_to_veins","source":"anat_upper_girdle_clavicle_scapula","target":"anat_upper_limb_veins","relation_type":"cross_discipline","strength":0.85,"bridge_text":"【骨学→脉管】**锁骨中内段与肩胛骨喙突**下方覆以锁胸筋膜，构成**头静脉**经三角肌胸大肌间沟深穿注入腋静脉的骨性门户标志。"},{"id":"e_upper_elbow_to_veins","source":"anat_upper_elbow_joint_triangle","target":"anat_upper_limb_veins","relation_type":"cross_discipline","strength":0.85,"bridge_text":"【骨关节→脉管】肘关节前方肘窝浅表紧邻**肘正中静脉**采血通路，行肘脱位或肱骨髁上骨折复位固定时须严防血肿压迫浅深静脉回流。"},{"id":"e_upper_humerus_to_fracture","source":"anat_upper_humerus_nerve_grooves","target":"patho_fracture_healing_and_factors","relation_type":"cross_discipline","strength":0.86,"bridge_text":"【解剖→病理】肱骨**外科颈**与中段**桡神经沟**骨折若未获坚强复位固定而致断端反复微动，骨痂无法骨化将遗留纤维性**假关节**。"},{"id":"e_anat_bone_macro_to_trunk_general","source":"anat_bone_shape_macrostructure","target":"anat_trunk_composition_general_vertebra","relation_type":"structural_basis","strength":0.91,"bridge_text":"明确骨分**扁骨/不规则骨**与红骨髓分布后，即可定位51块躯干骨及典型椎骨“一体一弓七突起”基本结构。"},{"id":"e_anat_intro_to_trunk_general","source":"anat_intro_position_planes_axes","target":"anat_trunk_composition_general_vertebra
