血管旁的“速发高敏放大器”：异染性颗粒预存组胺/肝素/趋化因子实现秒级脱颗粒，胞质白三烯协同触发水肿、哮喘与休克。","quiz":{"stem":"临床对过敏性哮喘急性发作患者单用纯组胺 H1 受体拮抗剂往往难以完全缓解支气管痉挛，结合肥大细胞介质来源分析其直接原因是：","options":["肥大细胞释放的肝素会直接诱发支气管平滑肌强直收缩","肥大细胞除颗粒释放组胺外，胞质内还同步释放白三烯，同样强力导致支气管平滑肌痉挛与血管通透性升高","嗜酸性粒细胞趋化因子直接放大全身小动脉扩张并升高血压","IgE 的 Fc 受体位于细胞核膜内侧不受抗体交联调控"],"answer_idx":1,"explain":"肥大细胞颗粒内含组胺/肝素/嗜酸性粒细胞趋化因子，胞质内另含白三烯；组胺与白三烯双轨并行诱发微静脉通透性↑、支气管痉挛及小动脉扩张。","remedial_node_id":"histo_ct_ground_substance_fluid"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_lct_plasma_and_resident_cells","title":"浆细胞超微构造与疏松CT储备细胞","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"B细胞分化的浆细胞具偏位辐射核与核旁浅染区(平行RER+Golgi)泌抗体，伴间充质/白细胞。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P8,P18,P28"],"payload":{"bullets":["浆细胞来源与定位：由 {{B 淋巴细胞}}分化而来，多分布于病原物质易于入侵部位及{{慢性炎症区}}。","浆细胞光镜标志：胞质呈强{{嗜碱性}}，核旁有明显{{浅染区}}；细胞核偏于一侧，染色质呈{{辐射状}}（车轮状）分布。","浆细胞电镜与功能：电镜见大量{{平行排列的 RER}} 及发达高尔基体，专职合成并分泌{{免疫球蛋白（抗体）}}。","疏松CT其余细胞：另有沿小血管分布的{{未分化间充质细胞}}（修复分化储备）、穿出血管的各类{{白细胞}}及脂肪细胞。"],"trap_note":"“核旁浅染区”并非胞质空泡或脂滴，而是极其庞大的高尔基复合体区缺乏核糖体、不着碱性染料形成的亮区；成纤维与浆细胞皆富RER，需靠核位置与染色质排列区分。","quiz":{"stem":"在慢性炎症区切片中，某卵圆形细胞胞质呈强嗜碱性、细胞核偏于一侧且染色质呈辐射状排列，核旁紧邻一浅染亮区。该浅染区在电镜下对应什么结构？","options":["被石蜡切片有机溶剂溶解的大型中性脂肪滴","大量溶酶体与吞噬体聚集区，专职吞噬清除细菌","缺乏核糖体的发达高尔基复合体区，负责将平行RER合成的免疫球蛋白加工包装分泌","退化萎缩的线粒体空泡，提示细胞即将坏死"],"answer_idx":2,"explain":"浆细胞胞质因平行排列的大量RER呈强嗜碱性，而核旁集中了体积巨大的高尔基复合体，因缺少核糖体RNA不着碱性染料而呈特征性核旁浅染区。","remedial_node_id":"histo_lct_fibroblast"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_dense_ct","title":"致密结缔组织分型、结构与分布鉴别","subject":"histology","syllabus_refs":["syl_histology_018"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"致密CT以粗大密集纤维为主、细胞单一且基质少，依纤维排布分规则、不规则与弹性三型。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P7,P24,P27"],"diagram_assets":[{"path":"assets/histo_dense_ct_micro_p27.webp","caption":"致密结缔组织光镜实图对照：左为规则致密CT（平行胶原束+成排扁平核），右为不规则致密CT（交错粗大胶原束）","source_page":27}],"payload":{"columns":["分型","纤维排列与光镜特征","细胞成分与典型分布"],"rows":[["1. 规则致密结缔组织","粗大Ⅰ型胶原纤维束紧密平行顺向排列，基质极少","细胞种类单一，主要为夹于胶原束间的扁平翼状成纤维细胞（腱细胞）；见于肌腱、韧带"],["2. 不规则致密结缔组织","粗大胶原纤维束纵横交错编织成致密网板，夹少量弹性纤维","成纤维细胞散在纤维束间；见于皮肤真皮网状层、硬脑膜、巩膜及器官被膜"],["3. 弹性组织","粗大弹性纤维平行或膜状密集排列，新鲜呈黄色","弹性纤维间夹少量胶原纤维与成纤维细胞；见于项韧带、黄韧带、弹性动脉中膜"]],"quiz":{"stem":"同为以粗大纤维为主、细胞单一（主要为成纤维细胞）的致密结缔组织，为何跟腱必须“规则平行排列”，而皮肤真皮与器官被膜则必须“不规则交错编织”？","options":["肌腱胶原纤维含67nm周期性横纹而真皮胶原纤维完全无横纹","规则平行胶原束最大化承受肌肉收缩的单向强大拉力，而交错编织网板则可抵抗来自多方向的机械牵拉与撕裂","规则致密结缔组织富含巨噬细胞，不规则致密结缔组织富含浆细胞","不规则致密结缔组织细胞成分远多于疏松结缔组织"],"answer_idx":1,"explain":"致密结缔组织以支持和连接为主要功能，其纤维空间排布严格服从受力方向：单向受力处（肌腱）平行成束，多向受力处（真皮/被膜）纵横交错成网。","remedial_node_id":"histo_ct_fibers_comparison"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_reticular_tissue","title":"网状组织细胞支架与造血淋巴微环境","subject":"histology","syllabus_refs":["syl_histology_020"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"星形网状细胞连网并分泌嗜银Ⅲ型网状纤维与基质，构建骨髓造血及淋巴器官基质微环境。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P23,P30"],"payload":{"bullets":["三元基本构成：由{{网状细胞}}、{{网状纤维}}以及基质共同组成。","网状细胞光电镜特征：细胞呈{{星形}}、有突起并彼此连接成网；核大色浅，胞质弱嗜碱性且 {{RER 丰富}}。","结构-功能因果链：网状细胞依靠丰富 RER 产生{{Ⅲ型胶原网状纤维}}（银染呈黑色，又称嗜银纤维）与基质，构建多孔立体网架。","器官定位与功能：专门参与构成{{造血组织（骨髓）}}和{{淋巴组织（淋巴结、脾等）}}的微环境支架。"],"trap_note":"切勿将“网状纤维”（一种Ⅲ型胶原细胞外纤维，也分布于上皮基膜与肝窦周隙）与“网状组织”（由星形网状细胞+网状纤维共同构成的完整造血/淋巴支架组织）混为一谈。","quiz":{"stem":"常规 H\u0026E 染色的淋巴结切片中难以辨认其三维纤维支架，经硝酸银浸染后立刻显现黑色网架；同时注意：肝血窦周隙富含网状纤维却不称为“网状组织”。二者判定的核心分界在于：","options":["网状组织专指由星形多突起‘网状细胞’与Ⅲ型嗜银网状纤维及基质共同构成的造血和淋巴器官基质支架，而非仅含网状纤维的普通部位","网状组织必须含有大量弹性蛋白并用醛复红染成紫色","肝血窦周隙中的网状纤维没有 67nm 周期性横纹","网状细胞源于外周血单核细胞而不能合成细胞外纤维"],"answer_idx":0,"explain":"网状纤维分布广泛（基膜、肝窦周隙等），而“网状组织”是由特化的网状细胞（星形连接、RER丰富产生纤维基质）+ 网状纤维 + 基质构成的特化结缔组织，专司构成造血与淋巴组织支架。","remedial_node_id":"histo_ct_fibers_comparison"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_adipose_tissue","title":"黄色（单泡）vs棕色（多泡）脂肪","subject":"histology","syllabus_refs":["syl_histology_019"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"黄脂单大脂滴挤扁核主贮能缓冲保温，棕脂多小脂滴核居中富线粒体与毛细血管主产热。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P28-P29"],"payload":{"columns":["鉴别维度","黄色脂肪组织（单泡）","棕色脂肪组织（多泡）"],"rows":[["胞内脂滴与细胞核","细胞内有 1 个大脂滴（常规HE制片溶解成大空泡），核扁圆被挤至周边","细胞内有多个散在小脂滴；细胞核居中，不被脂滴挤压"],["线粒体与毛细血管","线粒体少且细长；组织中毛细血管较少","线粒体极丰富（含细胞色素呈棕色）；组织中毛细血管极其丰富"],["年龄分布","成人皮下、肠系膜、大网膜等广泛分布","新生儿多，成人体内极少"],["核心生理功能","贮能、维持体温（隔热）、缓冲、保护、填充","主要是维持体温：寒冷刺激下快速分解氧化释放大量热能"]],"quiz":{"stem":"新生儿棕色脂肪组织在胞质内保留“多个小脂滴”而非融合成单一大脂滴，并配备极丰富的线粒体与毛细血管，这一超微特化的直接生理适配在于：","options":["增加机械缓冲垫厚度以防止新生儿骨骼受压","极大增大脂滴总表面积供脂肪酶迅速动员，同时依托丰富毛细血管供氧与密集线粒体快速分解氧化释放大量热能","腾出中央胞质空间以便大量合成Ⅰ型胶原纤维","将甘油三酯转化为免疫球蛋白直接分泌入血"],"answer_idx":1,"explain":"多泡小脂滴大幅提高脂解酶接触总表面积，丰富毛细血管保障充足氧供与热量散播，密集线粒体在寒冷刺激下迅速氧化脂肪酸释放大量热能维持新生儿体温。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"physio_thermoregulation_setpoint","title":"正常体温调节与POAH调定点","subject":"physiology","syllabus_refs":["syl_physiology_014","syl_physiology_013"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"POAH整合冷热敏神经元信号充当37℃调定点比较器，借负反馈平衡产热与散热。","source_slides":["发热20251030.pdf#P4-P6,P39","能量代谢与体温-基础医学分论2026-chyh.ppt#P60-P67"],"payload":{"bullets":["体温调节中枢核心（正调节中枢）：{{视前区-下丘脑前部 (POAH)}}，含热敏神经元（兴奋促{{散热}}）与冷敏神经元（兴奋促{{产热}}）。","体温调定点 (Set Point, SP) ≈ {{37℃}}：中心温度 \u003c SP 时触发骨骼肌寒战/BAT产热↑与皮肤血管收缩散热↓；反之促汗腺分泌与血管舒张散热。","双重调节模式：{{行为性体温调节}}（添减衣被/环境趋避）协同{{自主性体温调节}}（交感缩扩血管、汗腺、骨骼肌效应器）。","正常体温测量基准：直肠 (36.5–37.7℃) \u003e 舌下 (36.3–37.2℃) \u003e 腋窝 (36.0–37.0℃)，昼夜波动不超过 {{1℃}}。"],"trap_note":"调定点并非死板的固定物理常数，而是可被中枢介质重新设定的比较参照值（类似空调遥控器的设定温度）。","quiz":{"stem":"若动物实验选择性损毁下丘脑 POAH 的热敏神经元（保留冷敏神经元），置于 35℃ 温暖环境时最可能出现何种稳态失调？","options":["寒战与棕色脂肪产热持续强化并伴发大汗","POAH 调定点被立即上移引发调节性发热","血管舒张与发汗散热受阻而致体温被迫升高","外周冷感受器接管全身交感胆碱能散热反射"],"answer_idx":2,"explain":"POAH 热敏神经元感知血温升高并触发血管舒张和交感胆碱能发汗散热；一旦被选择性损毁，高温下散热指令失效，体温便被迫升高超过正常调定点。","remedial_node_id":"physio_homeostasis_feedback"}},"added_at":"2026-11-16T21:53:00+08:00","diagram_assets":[{"path":"assets/physio_thermo_poah_setpoint_p66.webp","caption":"PO/AH区热敏(B)与冷敏(A)神经元放电频率对脑温的半对数曲线：交点决定37℃调定点，致热原使交点右移","source_page":66}]},{"id":"pathophys_fever_vs_hyperthermia","title":"发热 vs 过热本质鉴别","subject":"pathophys","syllabus_refs":["syl_pathophys_005"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"发热是致热原上移调定点引起的调节性升温；过热是调定点未变时的被动性体温失控。","source_slides":["发热20251030.pdf#P7-P9"],"payload":{"columns":["鉴别维度","发热 (Fever)","过热 (Hyperthermia)"],"rows":[["体温调定点 (SP)","上移（体温主动追踪新调定点，调节性升高 \u003e0.5℃）","不变或受损（体温被动超过 SP，与调定点不相适应）"],["三大核心病因","致热原（感染、肿瘤、抗原抗体复合物、无菌坏死等）","产热过度(癫痫大发作/甲亢)、散热障碍(中暑/鱼鳞病/无汗腺)、中枢损毁(下丘脑出血炎症)"],["退热药 (NSAIDs) 效应","有效（阻断 PGE₂ 合成使调定点回降）","无效（无调定点上移，必须靠物理降温与祛除病因）"]],"quiz":{"stem":"盛夏重体力劳动突发 40.8℃ 高热伴无汗昏迷（热射病），静注阿司匹林完全无效的根本病生机制是：","options":["大量内生致热原饱和了环氧合酶受体","中心体温此时仍显著低于上移调定点","属散热衰竭型过热且调定点未曾上移","脑血管屏障完全阻断了水杨酸类入脑"],"answer_idx":2,"explain":"热射病/中暑、甲亢、癫痫及下丘脑损伤均为过热(Hyperthermia)，调定点未上移且无 PGE₂ 介导，须靠物理降温而非 COX 抑制剂。","remedial_node_id":"physio_thermoregulation_setpoint"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_pyrogen_activators_toxins","title":"发热激活物与内外毒素鉴别","subject":"pathophys","syllabus_refs":["syl_pathophys_005"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"外致热原（以G⁻菌LPS脂质A最关键）与体内产物激活产EP细胞；内毒素耐高热难被常规灭菌清除。","source_slides":["发热20251030.pdf#P11-P26"],"payload":{"columns":["鉴别维度","内毒素 (Endotoxin, ET / LPS)","外毒素 (Exotoxin，如超抗原)"],"rows":[["来源与存在部位","革兰阴性菌细胞壁成分，细菌裂解后释出","革兰阳性菌及部分革兰阴性菌，活菌分泌或溶解散出"],["化学本质与核心毒基","脂多糖（O-多糖 + R-核心 + 脂质A；脂质A为主要致热和毒性成分）","蛋白质（如链球菌致热外毒素、白喉毒素、葡萄球菌可溶性外毒素）"],["热稳定性（输液警戒）","极强（160℃ 2–4小时方破坏；常规高压蒸汽灭菌不破坏致热性）","差（60–80℃ 30分钟即破坏）"],["致热机制与体内激活物","通用致热/休克/DIC；抗原性弱无中和抗体（对比体内产物：Ag-Ab复合物、无菌坏死、本胆烷醇酮、尿酸盐结晶）","毒性强且具器官选择性；抗原性强可产生抗毒素（补：病毒HA、真菌多糖、疟原虫裂殖子/疟色素）"]],"quiz":{"stem":"某批生理盐水经标准高压蒸汽灭菌（121℃ 30min）无菌检验合格，但静脉输液后患者仍突发寒战高热，最关键的分子根因是：","options":["残存不耐热外毒素直接激活效应T细胞","高压蒸汽灭菌使盐水产生高渗化学刺激","灭菌促使外毒素异构为内源类固醇产物","耐热革兰阴性菌LPS脂质A未被灭菌破坏"],"answer_idx":3,"explain":"革兰阴性菌裂解后释出的内毒素（LPS 核心成分脂质 A）极其耐热，常规 121℃ 灭菌无法破坏其致热活性（须 160℃ 2–4 小时），是临床输液发热反应最典型原因。","remedial_node_id":"pathophys_fever_vs_hyperthermia"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_ep_tlr4_signaling","title":"产EP细胞活化：LPS-TLR4通路","subject":"pathophys","syllabus_refs":["syl_pathophys_005"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"LPS借LBP结合髓系mCD14或血浆sCD14递交TLR4-MD2二聚化，激活NF-κB释放IL-1/TNF/IL-6。","source_slides":["发热20251030.pdf#P27-P28,P34-P36"],"diagram_assets":[{"path":"assets/pathophys_tlr4_pathway_p35.webp","caption":"LPS·LBP 经 sCD14（内皮/上皮细胞）与 mCD14（单核/巨噬细胞）双轨激活 TLR4-NF-κB 表达 EP 图解","source_page":35}],"payload":{"steps":[{"cue":"谁是产 EP 细胞，为何大分子 LPS 不直接入脑调定点？","reveal":"包括单核/巨噬细胞（主力）、内皮/上皮细胞、淋巴细胞、星状细胞与肿瘤细胞。发热激活物多为大分子，必须先激活这些细胞合成释放内生致热原 (EP)。","mechanism_tag":"产 EP 细胞总动员"},{"cue":"内皮/上皮细胞表面没有膜 CD14 (mCD14)，LPS 如何递交给 TLR4？","reveal":"LBP 结合 LPS 单体后分两路：① 单核/巨噬细胞直接结合膜锚定 mCD14；② 内皮/上皮细胞借助血浆可溶性 sCD14 组成 LPS·LBP·sCD14 三联复合体，在 MD-2 协助下使 TLR4 二聚化。","mechanism_tag":"mCD14 vs sCD14 双轨递交"},{"cue":"TLR4-MD2 二聚化后下游哪些胞内通路驱动 EP 基因转录？","reveal":"TLR4 胞内招募 MyD88/TIRAP 与 TRAM/TRIF 接头蛋白，激活 NF-κB、JNK/AP-1 与 IRF3 转录因子，大量转录并释放 IL-1、TNF 与 IL-6。","mechanism_tag":"NF-κB/AP-1 基因转录"}],"takeaway":"LBP + CD14 (mCD14/sCD14) + MD-2 构成 LPS 识别放大器，使髓系与非髓系细胞均能经 TLR4→NF-κB 批量生产 EP。","quiz":{"stem":"血管内皮细胞表面缺乏膜结合型 mCD14，但革兰阴性菌血症时仍能被 LPS 激活产生 IL-1/IL-6，这依赖哪一关键配体递交环节？","options":["血浆LBP协同可溶性sCD14递交至TLR4","LPS自由穿核膜并直接激活核内NF-κB","内皮细胞直接将LPS作为抗原呈递给T细胞","脂质A绕过TLR4受体直接激活磷酸二酯酶"],"answer_idx":0,"explain":"缺乏 GPI 锚定 mCD14 的血管内皮与上皮细胞必须依赖血浆 LPS 结合蛋白(LBP) 与可溶性 sCD14 形成 LPS·LBP·sCD14 复合体再递交给 TLR4-MD2。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_ep_superantigen_tcr","title":"产EP细胞活化：超抗原TCR通路","subject":"pathophys","syllabus_refs":["syl_pathophys_005"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"外毒素超抗原(SAg)免APC加工直接桥接MHC-II外侧与TCR-Vβ激活5–20%T细胞，经PTK引发细胞因子风暴。","source_slides":["发热20251030.pdf#P37-P38"],"payload":{"steps":[{"cue":"革兰阳性菌外毒素超抗原 (SAg) 为何能跳过常规免疫提呈并强力致热？","reveal":"SAg 不需 APC 胞内加工，也不进入抗原肽结合槽，而是从外侧直接交联 APC 膜上 MHC-II 非多态区外侧与 T 细胞 TCR-Vβ 外侧（不受 MHC 限制），一次性激活 5–20% 的 CD4⁺ T 细胞。","mechanism_tag":"非槽外侧桥接·无MHC限制"},{"cue":"TCR 被超抗原交联后经哪两条胞内信号支路启动转录？","reveal":"TCR 结合后迅速活化蛋白酪氨酸激酶 (PTKs)，随后分叉驱动：① 磷脂酶 C (PLC) → IP₃/DAG → 激活 NFAT 与 NF-κB；② P21ras (Ras) → Raf-1/MAPK → 激活 Fos \u0026 Jun (AP-1)。","mechanism_tag":"PTK → PLC / Ras 双分支"},{"cue":"这两条支路最终诱导 T 细胞与单核巨噬细胞释放哪些 EP 效应？","reveal":"协同转录大量释放 IL-1、TNF 与 IFN，临床可骤发高热乃至链球菌中毒休克综合征 (STSS) 样细胞因子风暴。","mechanism_tag":"IL-1 / TNF / IFN 爆发"}],"takeaway":"超抗原绕过常规抗原肽槽实现多克隆 T 细胞海啸式激活（5–20%），与固有免疫模式识别 TLR4 通路形成双轨驱动。","quiz":{"stem":"A 族链球菌致热外毒素引发链球菌中毒休克综合征(STSS)时爆发“细胞因子风暴”，其激活 T 细胞数量远超普通抗原（达 5–20%）的结构基础是：","options":["经APC加工后精确嵌入MHC-II抗原肽槽呈递","通过血浆LBP和mCD14非特异激活所有B细胞","外侧交联MHC-II非多态区与TCR-Vβ片断","在血循环内直接裂解生成PGE₂跨越血脑屏障"],"answer_idx":2,"explain":"普通抗原只激活约万分之一特定克隆 T 细胞；超抗原不经 APC 抗原加工、绕开抗原肽槽与 MHC 限制性，直接从外侧桥接 MHC-II 非多态区与特定 TCR-Vβ 从而激活 5–20% T 细胞。","remedial_node_id":"pathophys_ep_tlr4_signaling"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_endogenous_pyrogens_core","title":"四大内生致热原(EP)特征鉴别","subject":"pathophys","syllabus_refs":["syl_pathophys_005"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"IL-1/TNF/IFN/IL-6均为不耐热多肽；TNF与IL-1互诱呈双相热，IFN易耐受，IL-6为下游关键整合点。","source_slides":["发热20251030.pdf#P29-P33"],"payload":{"columns":["内生致热原 (均不耐热)","来源、互诱网络与耐受特性","热型曲线与关键实验证据"],"rows":[["白细胞介素-1 (IL-1α/β)","强致热性，两亚型共用受体；靠近 POAH 的下丘脑外侧区受体密度最大","静脉或脑室注入引起双相热；可被水杨酸钠阻断"],["肿瘤坏死因子 (TNFα/β)","TNFα 与 IL-1β 体内外可相互诱导；可被布洛芬（COX 抑制剂）阻断","一般剂量呈单相热，大剂量因 TNFα↔IL-1β 互诱呈双相热"],["干扰素 (IFNα/β/γ)","抗病毒/抗肿瘤蛋白，主要由单核细胞与淋巴细胞产生；可产生耐受性","注射引起单峰热；连续反复应用发热反应衰减"],["白细胞介素-6 (IL-6)","单核、内皮、纤维细胞等分泌；受 TNFα 和 IL-1β 共同诱导，单用致热弱于前两者","IL-6 基因敲除鼠注射 LPS 无发热，补给 IL-6 即恢复；布洛芬/吲哚美辛阻断（另有 MIP-1/IL-2/CNTF/IL-8/ET）"]],"quiz":{"stem":"实验发现 IL-6 基因敲除小鼠注射致热剂量 LPS 后完全不发热，外源补给重组 IL-6 即可恢复发热；而大剂量 TNF-α 注射诱发双相热可被布洛芬阻断。这共同说明：","options":["IL-6位于最上游并直接触发LPS释放","IL-6为TNF-α/IL-1下游核心环氧合酶枢纽","IFN是唯一不依赖PGE₂的内生致热原","敲除IL-6基因直接破坏了外周汗腺分泌"],"answer_idx":1,"explain":"大剂量 TNF-α 需与 IL-1β 互诱生成第二热峰，而 IL-6 KO 小鼠对 LPS 不发热证实 IL-6 是两者下游必经的核心整合因子，且最终依赖环加氧酶(PGE₂)致热。","remedial_node_id":"pathophys_ep_tlr4_signaling"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_ep_entry_and_pos_mediators","title":"EP入脑途径与中枢正调节介质","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"EP经OVLT有孔血管或BBB转运入脑，诱发PGE₂、cAMP、Na⁺/Ca²⁺↑、CRH与NO等正介质上移调定点。","source_slides":["发热20251030.pdf#P40-P48"],"payload":{"steps":[{"cue":"大分子蛋白质 EP 如何绕过或跨越血脑屏障将致热信号传给 POAH？","reveal":"两条主径：① 经紧挨 POAH、视上隐窝上方无紧密连接的终板血管器 (OVLT) 有孔毛细血管作用于局部巨噬细胞；② 经血脑屏障毛细血管床 IL-1/IL-6/TNF 可饱和载体转运或脉络丛渗入（存在潜伏期）。","mechanism_tag":"OVLT + BBB 可饱和转运"},{"cue":"哪些快速经典正调节介质直接推动 POAH 调定点上移？","reveal":"① PGE₂（由花生四烯酸经 COX 合成，潜伏期极短，被阿司匹林/布洛芬抑制）；② Na⁺/Ca²⁺ 比值↑ → cAMP↑（茶碱抑 PDE 升高 cAMP 助热，VitB3/尼克酸激活 PDE 降 cAMP 解热；脑室 Ca²⁺ 降体温并阻断 EGTA 致热）。","mechanism_tag":"PGE₂ \u0026 Na⁺/Ca²⁺→cAMP"},{"cue":"CRH 与气体信使 NO 在正调节网络中扮演什么特殊角色？","reveal":"① CRH（41肽，室旁核/杏仁核）促热同时诱导 POMC 裂解产生 ACTH 与散热介质 MSH（双相调节介质）；② NO 分布于 POAH/OVLT 及 BAT，既直接助热又抑制负调节介质合成释放。","mechanism_tag":"CRH 双相 \u0026 NO 抑负介质"}],"takeaway":"EP 存在潜伏期是因为必须经 OVLT/BBB 诱发下丘脑 PGE₂、Na⁺/Ca²⁺→cAMP、CRH 与 NO 等正调节介质群才能改写调定点。","quiz":{"stem":"预先向家兔侧脑室灌注 CaCl₂ 再给予金属螯合剂 EGTA，不仅阻止体温升高且抑制 CSF 中 cAMP 飙升；而布洛芬可迅速阻断 EP 致热。这两项反转实验揭示：","options":["胞外Ca²⁺本身作为正介质加速cAMP生成","烟酸与茶碱均抑制PDE升高脑内cAMP","EP须在脑室内水解为氨基酸才能激活CRH","EGTA升Na⁺/Ca²⁺比增cAMP且受COX阻断"],"answer_idx":3,"explain":"EGTA 通过螯合胞外 Ca²⁺ 抬高下丘脑 Na⁺/Ca²⁺ 比值从而提升 cAMP 上移调定点；预先灌注 CaCl₂ 压低该比值可阻断升温，布洛芬则阻断上游 PGE₂ 合成（VitB3 激活 PDE 降 cAMP）。","remedial_node_id":"physio_thermoregulation_setpoint"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_febrile_limit_neg_mediators","title":"负调节介质拮抗与热限稳态","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"腹中膈VSA/中杏仁核等释放AVP、α-MSH、Annexin A1与IL-10拮抗正介质，将发热限在41℃内。","source_slides":["发热20251030.pdf#P39,P43,P49-P51"],"diagram_assets":[{"path":"assets/pathophys_fever_master_p51.webp","caption":"发热发病学总图：五大正调节介质(+)与四大负调节介质(⊖)在中枢拮抗博弈决定调定点上移高度","source_page":51}],"payload":{"bullets":["热限 (Febrile Limit) 与负调节中枢：发热体温极少超过 {{41℃}}，因升温同步激活{{腹中膈 (VSA)}}、中杏仁核 (MAN) 与弓状核等负调节中枢进行自稳封顶。","{{精氨酸升压素 (AVP / ADH)}}：视上核与室旁核合成释放至 VSA，在常温(25℃)加强散热、冷环境(4℃)减少产热。","{{α-黑素细胞刺激素 (α-MSH)}} 与 {{IL-10}}：CRH 促使 POMC 经腺垂体生成 α-MSH 强力促散热；IL-10 作为细胞因子合成抑制因子负反馈压制 EP。","糖皮质激素 (GC) → {{膜联蛋白 A1 (Annexin A1 / 脂皮质蛋白-1)}}：GC 诱导产生 Annexin A1 抑制磷脂酶 A₂，从上游切断花生四烯酸→PGE₂ 合成（兼具解热机制钩子）。"],"trap_note":"热限只存在于调定点尚受正负介质共同博弈的“发热”中；中暑等“过热”因调定点未动、散热衰竭，体温可轻松突破 41–42℃ 致不可逆脑损伤。","quiz":{"stem":"感染性发热极少突破 41℃（热限），而严重中暑（过热）体温却常飙升至 42℃ 以上甚至危及生命，核心原因在于：","options":["超过41℃时革兰阴性菌失去致热激活能力","中暑患者棕色脂肪UCP1受AVP持续强激活","发热受负调节介质封顶而过热失散热控制","41℃高热促使下丘脑PGE₂转为抗利尿激素"],"answer_idx":2,"explain":"热限时高热激活 VSA/MAN 等负调节中枢释放 AVP、α-MSH、Annexin A1 与 IL-10 封顶调定点；而过热是物理散热彻底衰竭，体核温脱离调定点保护无限制飙升。","remedial_node_id":"pathophys_ep_entry_and_pos_mediators"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_fever_phases","title":"发热三时相动态机制与规律","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"依中心体温与调定点的动态差值依次经历上升期（寒战缩血管）、持续期（高位平衡）与退热期（大汗防虚脱）。","source_slides":["发热20251030.pdf#P52-P56"],"diagram_assets":[{"path":"assets/pathophys_fever_phases_p52.webp","caption":"蓝色阶跃调定点与红色滞后体温曲线在上升期（寒战/缩血管）、高峰期与退热期（发汗/扩血管）的差值对照","source_page":52}],"payload":{"columns":["发热时相","体核温度 vs 调定点 (SP)","神经效应环路与临床体征"],"rows":[["1. 体温上升期 (Incrementi)","体核温度 ＜ 上移的 SP（产热＞散热）","冷信号抑制 POAH 热敏神经元→解除对寒战中枢抑制(⊘)→红核→脊髓侧索→前角运动N→寒战；交感兴奋缩血管/立毛肌/BAT分解→苍白发冷鸡皮、功能性少尿"],["2. 高温持续期 (Fastigium)","体核温度 ≈ 上移的 SP（高位相对平衡）","寒战停止，热敏神经元占优使皮肤血管扩张、血流增多→皮肤发红灼热、自觉酷热、口唇干燥"],["3. 体温下降期 (Defervescence)","体核温度 ＞ 回降的 SP（散热＞产热）","调定点回降激发皮肤血管剧烈舒张与大量出汗，易因急剧脱水与有效循环血量骤减发生低血容量休克/虚脱"]],"quiz":{"stem":"高热持续期患者皮肤潮红灼热而无寒战，服用退热药进入体温下降期后，突然大汗淋漓、面色苍白伴血压骤降。这两期截然不同的血管状态源于：","options":["持续期高位平衡而退热期体温高于调定点","体温下降期交感亢进收缩皮肤血管致苍白","高热持续期体核温低于调定点靠扩血管散热","退热期骨骼肌强直寒战耗尽冠脉储备致休克"],"answer_idx":0,"explain":"高热持续期中心体温与上移调定点在高水平重建平衡（皮肤血管适度扩张）；退热期调定点骤降使原本的高体温瞬间高于 SP，触发剧烈扩血管与大汗排水导致有效循环血量锐减而虚脱。","remedial_node_id":"physio_thermoregulation_setpoint"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_fever_curve_types","title":"临床四大典型热型曲线鉴别","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"依体温曲线形态鉴别稽留热、弛张热、间歇热与波状热，并警惕抗生素与激素导致的非典型掩盖。","source_slides":["发热20251030.pdf#P57-P61"],"payload":{"columns":["热型","体温曲线与波动幅度","典型疾病与非典型化陷阱"],"rows":[["稽留热 (Continued)","恒定在 39–40℃ 以上数天至数周，24h 波动 ≤ 1℃","大叶性肺炎、伤寒高热期"],["弛张热 (Remittent)","常在 39℃ 以上，24h 波动幅度 ＞ 2℃（最低仍高于正常）","败血症、风湿热、重症肺结核、化脓性炎症"],["间歇热 (Intermittent)","骤升达高峰持续数小时后骤降至正常，无热期 1–数天交替","疟疾、急性肾盂肾炎"],["波状热 (Undulant)","渐升至 ≥39℃ 数天后渐降至正常，数日后再渐升反复","布鲁菌病（陷阱：抗生素、解热药/糖皮质激素及老年低反应性可使热型变不规则）"]],"quiz":{"stem":"疑似大叶性肺炎患者院外自服布洛芬并静滴地塞米松，入院体温单未呈典型“稽留热”而显不规则低热。临床判读最应避免的误区是：","options":["因非典型热型直接排除大叶性肺炎或伤寒等急性感染","追溯院外解热药与糖皮质激素用药史对特征性热型的掩盖","结合肺部影像学与病原学指标综合评估病情","注意老年人因免疫反应性较低亦可仅现低热或无发热"],"answer_idx":0,"explain":"P61 强调：抗生素、解热药/糖皮质激素及老年个体低反应性均可使经典热型变得不典型或呈不规则热，不可据此排除相应感染。","remedial_node_id":"pathophys_fever_phases"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_fever_metabolism_bat","title":"发热代谢重塑与BAT产热","subject":"pathophys","syllabus_refs":["syl_pathophys_006","syl_pathophys_005"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"体温每升1℃基础代谢率↑13%并呈负氮平衡；非寒战产热靠BAT激活UCP1解偶联与急性期铁锌下调。","source_slides":["发热20251030.pdf#P63-P66,P70-P72"],"diagram_assets":[{"path":"assets/pathophys_bat_ucp1_p65.webp","caption":"棕色脂肪组织(BAT)非寒战产热机制：SNS儿茶酚胺→AR→脂滴FFA→线粒体UCP1质子漏解偶联产热入血","source_page":65}],"payload":{"bullets":["物质代谢加速：体温每升高 1℃，基础代谢率 (BMR) 升高 {{13%}}；糖分解↑致糖原耗竭与乳酸↑，脂肪分解致酮症消瘦，蛋白分解呈{{负氮平衡}}，VitB/C 消耗大增。","棕色脂肪 (BAT) 非寒战产热：交感儿茶酚胺作用于肾上腺素受体促进脂肪动员，激活线粒体{{解偶联蛋白 1 (UCP1)}}，使电子传递与 ATP 合成解偶联直接释放热量。","急性期防御与免疫双刃剑：EP 促使肝合成{{急性期蛋白}}并令血清铁、锌下降（铜↑）抑制细菌生长，增强白细胞吞噬并杀伤缺氧肿瘤细胞，但高热也可抑制 {{NK 细胞}}活性。","水盐分期演变：上升期功能性少尿、持续期皮肤呼吸道失水、退热期大量出汗脱水及尿量恢复。"],"trap_note":"BAT 产热依赖于组胚学中多小脂滴、极富线粒体与密集毛细血管网的构筑，以及线粒体内膜 UCP1 制造“H⁺ 漏流”释放热能而不受 ATP/ADP 呼吸控制抑制。","quiz":{"stem":"发热上升期寒战以外，交感儿茶酚胺驱动棕色脂肪组织(BAT)高效产热而不因胞内 ATP 堆积受阻，其关键分子与组织学协同机制是：","options":["单大脂滴直接水解为肌糖原供肌丝强收缩","UCP1加速Na⁺-K⁺泵催化线粒体合成磷酸肌酸","BAT缺乏线粒体主要靠糖酵解产乳酸生热","UCP1解偶联配丰富线粒体及密毛细血管产热"],"answer_idx":3,"explain":"BAT 线粒体内膜表达解偶联蛋白 UCP1 使质子漏回漏产热而不受 ATP 合成抑制，同时借助多小脂滴、极丰富线粒体和密集毛细血管迅速将热能泵入血液。","remedial_node_id":"histo_adipose_tissue"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_fever_organ_dysfunction","title":"高热多器官功能变化与心率拐点","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"体温每升1℃心率↑18次/分（\u003e160-180反降）；高热致小儿惊厥、呼碱、消化抑制与肾小管上皮水肿。","source_slides":["发热20251030.pdf#P67-P69"],"payload":{"bullets":["循环系统拐点：体温每升 1℃ 心率约增 {{18 次/分}}（热血刺激窦房结 + IL-1/TNF 兴奋交感）；心率超过 {{160–180 次/分}} 时舒张充盈不足，心输出量反降。","中枢神经改变：兴奋性升高致烦躁、谵妄、幻觉、抽搐（小儿高热易诱发{{热惊厥}}），严重衰竭可转淡漠、嗜睡。","呼吸与消化改变：高血温提高呼吸中枢对 CO₂ 敏感性叠加酸产物↑促过度通气，易致{{呼吸性碱中毒}}；交感兴奋致消化液与蠕动↓。","泌尿系统分期：上升期功能性少尿（尿比重↑）；高热持续期因缺氧耗能出现{{肾小管上皮细胞水肿}}伴蛋白尿；退热期尿量恢复。"],"trap_note":"高热时既有“酸产物增多”，为何反而常表现呼吸性碱中毒？因为热血本身和代谢刺激呼吸中枢使通气量剧增、CO₂ 排出过多，导致 PaCO₂ 下降。","quiz":{"stem":"高热持续期患者体温升至 40.5℃、心率达 176 次/分，随后血压不升反降并伴一过性蛋白尿。其中“心输出量下降”与“蛋白尿”最直接的病生断点分别是：","options":["高血温抑窦房结致极度心动过缓伴少尿","心率\u003e160致充盈期不足及肾小管细胞水肿","交感麻痹致心输出量骤降及基底膜被溶解","呼吸性酸中毒闭锁冠脉并发肾转移性钙化"],"answer_idx":1,"explain":"心率突破 160–180 次/分后心室舒张充盈时间严重不足使心输出量反降；高热缺氧与代谢加重引发肾小管上皮细胞水肿，造成可逆性一过性蛋白尿。","remedial_node_id":"patho_hydropic_degeneration"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"pathophys_fever_antipyretic_principle","title":"【拓展】发热防治原则与解热指征","subject":"pathophys","syllabus_refs":["syl_pathophys_006"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"一般发热(\u003c38.5℃)重在治因与补液营养不急解热；高热\u003e40℃、心脏病与妊娠期须及时药物或物理降温。","source_slides":["发热20251030.pdf#P73,P77-P79"],"payload":{"bullets":["治疗原发病与一般处理：多数发热源于自限性病毒或细菌感染；体温 {{\u003c 38.5℃}} 且无严重基础病时不急于解热（避免掩盖热型），重点治疗原发病与补充营养、维生素及水。","三类必须及时解热的危象：① 高热 {{\u003e 40℃}}（防神经细胞损伤与热惊厥）；② {{心脏病}}患者（防心率过快增加心脏负荷）；③ {{妊娠期}}妇女（防致畸及诱发心衰）。","药物与物理措施（药理接口钩子）：水杨酸类（抑 COX 降 PGE₂）与糖皮质激素（促 Annexin A1 抑 PLA₂）均靶向调定点回降；辅以中草药及酒精擦浴/冰帽等物理降温。"],"trap_note":"退热药仅对“调定点上移”的发热有效，对过热无效；解热大汗期务必同步补水防脱水休克。此节点为后续《药理学》NSAIDs 预留桥接接口。","quiz":{"stem":"面对两位患者——甲：既往健康的急性病毒性上感青年，体温 38.2℃；乙：合并冠心病左心衰的老年肺炎患者，体温 38.8℃。依据病生防治原则更审慎的决策是：","options":["甲乙患者均须立即联合大剂量激素强退热","甲对因补液观察为主而乙因心脏负担须退热","甲须物理冰毯降回36℃而乙可任其自然升热","只要体温未破41℃热限均应避免干预体温"],"answer_idx":1,"explain":"一般低中度发热(\u003c38.5℃)不急于强行退热以免掩盖热型或削弱免疫防御，宜补液与对因观察；但心肺功能不全或严重冠心病患者每升 1℃ 心率增 ~18 次/分，极易诱发心衰，属必须及时退热减负人群。","remedial_node_id":"pathophys_febrile_limit_neg_mediators"}},"added_at":"2026-11-16T21:53:00+08:00"},{"id":"biochem_glycolysis_hk_vs_gk","title":"己糖激酶 vs 葡萄糖激酶调控","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"葡萄糖进胞后靠磷酸化生成带负电荷的G-6-P锁定胞内；肝葡萄糖激酶高Km且不受G-6-P抑制，专司餐后血糖缓冲。","source_slides":["糖代谢2026.pdf#P30-P31,P198","第2章酶-20260915.pptx#P34,P110-P113,P151"],"payload":{"columns":["比较维度","己糖激酶 (HK I–III型)","葡萄糖激酶 (GK / HK IV型)"],"rows":[["组织分布与底物专一性","全身绝大多数细胞（如脑、骨骼肌）；专一性弱（可磷酸化多种己糖）","仅肝细胞（与胰岛β细胞）；专一性强（仅催化葡萄糖）"],["对葡萄糖亲和力 (Km)","Km很低（亲和力极高）：空腹低血糖时仍可饱和高效摄糖供能","Km很高（亲和力低，Vmax大）：仅餐后门静脉高血糖时迅速启动合成糖原"],["产物与激素调节机制","受产物 G-6-P 强烈反馈抑制，不受胰岛素诱导表达","不受 G-6-P 抑制；受葡糖激酶调节蛋白(GKRP)抑制，胰岛素诱导其基因表达"],["磷酸化的共同生理意义","① G-6-P带负电不能出膜；② 消耗胞内游离糖维持浓度梯度促GLUT内流；③ 活化己糖","三点意义相同，使肝脏充当“血糖高低缓冲器”而不致在空腹时抢夺脑组织葡萄糖"]],"quiz":{"stem":"饱餐后门静脉血糖骤升至 15 mmol/L 时，肝细胞能持续大量将葡萄糖转为 G-6-P 储存糖原而不受积聚的 G-6-P 阻断，而空腹血糖降至 3.5 mmol/L 时肝细胞又几乎停止截留葡萄糖让位给大脑。决定肝脏这一“缓冲器”行为的核心酶学机制是：","options":["肝葡萄糖激酶(GK) Km 高且不受产物 G-6-P 反馈抑制，仅高糖时高通量激活","肝细胞仅表达 Km 极低的己糖激酶 I 型并受果糖-2,6-双磷酸直接抑制","G-6-P 可经肝细胞膜 GLUT2 逆向主动泵回门静脉","胰岛素直接使己糖激酶磷酸化以解除 G-6-P 抑制"],"answer_idx":0,"explain":"肝 GK (IV型) 对葡萄糖 Km 很高（约 10 mmol/L 级）且不受产物 G-6-P 抑制，因此空腹低糖时几乎不工作、餐后高糖时大通量磷酸化；而脑/肌细胞依赖低 Km 的 GLUT3/HK 保证低血糖时仍优先供能。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_glycolysis_pathway_atp","title":"糖酵解全流程、底物磷酸化与产能","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"胞质十步反应含1步氧化还原、2步底物水平磷酸化与3步不可逆限速开关，净产2 ATP(糖原起点3 ATP)并靠LDH再生NAD⁺。","source_slides":["糖代谢2026.pdf#P28-P56"],"diagram_assets":[{"path":"assets/biochem_glycolysis_pathway_p52.webp","caption":"糖酵解途径全览：E1/E2/E3三步不可逆酶、GAPDH与LDH之间的NADH/NAD⁺胞质闭环及四大特征归纳","source_page":52}],"payload":{"steps":[{"cue":"投资耗能与六碳裂解：为何要先把醛糖(G-6-P)异构为酮糖(F-6-P)再二次磷酸化？","reveal":"己糖激酶(E1)耗1 ATP；磷酸己糖异构酶将羰基移至C2使C3-C4键易断裂；PFK-1(E2)再耗1 ATP生成F-1,6-BP，醛缩酶将其对称裂解为DHAP与3-磷酸甘油醛(G3P，经TPI互变使2分子均进入下游)。","mechanism_tag":"耗2 ATP·两次活化裂解"},{"cue":"唯一氧化还原与第一底物磷酸化：GAPDH如何把氧化自由能直接铸成高能磷酸键？","reveal":"3-磷酸甘油醛脱氢酶(GAPDH)以活性中心Cys-SH亲核攻击醛基成硫半缩醛，NAD⁺氧化成高能硫酯并产生NADH+H⁺，再经无机磷酸Pi磷酸解生成1,3-二磷酸甘油酸(1,3-BPG)；随后磷酸甘油酸激酶将其高能酰基磷酸转移给ADP生成2×1=2 ATP（碘代乙酸烷化Cys-SH可彻底阻断此步）。","mechanism_tag":"Cys-SH硫酯·首次底物磷酸化"},{"cue":"脱水聚能与第二底物磷酸化：2-磷酸甘油酸如何再次产出ATP并被NaF阻断？","reveal":"变位酶将磷酸基从C3移至C2，烯醇化酶催化脱水重排能量形成高能磷酸烯醇式丙酮酸(PEP，NaF可抑制烯醇化酶故用作血糖管抗酵解剂)；丙酮酸激酶(E3, 需Mg²⁺/K⁺)不可逆生成丙酮酸及2×1=2 ATP。","mechanism_tag":"烯醇化酶/NaF·二次底物磷酸化"},{"cue":"缺氧闭环与净ATP核算：为何无线粒体红细胞或剧烈运动肌必须将丙酮酸还原为乳酸？","reveal":"胞质NAD⁺总量极有限，无氧条件下线粒体无法氧化NADH，必须由乳酸脱氢酶(LDH)用丙酮酸接受GAPDH产生的NADH还原为乳酸以再生NAD⁺（否则糖酵解停摆）。净产出：游离葡萄糖起点 2×2-2 = 2 ATP；糖原(Gn)起点省去HK步故净产 2×2-1 = 3 ATP。","mechanism_tag":"LDH再生NAD⁺·净2/3 ATP"}],"takeaway":"糖酵解全部反应在胞质完成，“1氧化、2磷酸化、3不可逆、4激酶”；GAPDH与LDH形成NADH↔NAD⁺胞质闭环，使红细胞、骨髓及缺氧骨骼肌无需氧气也能持续产ATP。","quiz":{"stem":"向正在进行无氧酵解的红细胞悬液中加入碘代乙酸（不可逆烷化半胱氨酸-SH基团）后，下列代谢指标变化组合最准确的是：","options":["GAPDH受阻导致F-1,6-BP与磷酸丙糖堆积，下游1,3-BPG、乳酸与ATP生成同时锐减","己糖激酶完全失活，细胞内游离葡萄糖无法磷酸化，F-1,6-BP立刻降为零","烯醇化酶受阻导致3-磷酸甘油酸大量堆积，但GAPDH仍持续产生NADH和乳酸","丙酮酸激酶被共价激活，乳酸生成翻倍但细胞净消耗ATP"],"answer_idx":0,"explain":"如图P41机制所示，碘代乙酸共价修饰GAPDH活性中心关键Cys-SH使之失活，导致其底物3-磷酸甘油醛（及上游DHAP、F-1,6-BP）堆积，而下游两步底物水平磷酸化与NADH→乳酸全部断流，红细胞ATP迅速枯竭。","remedial_node_id":"biochem_glycolysis_hk_vs_gk"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_pfk1_pfk2_switch","title":"PFK-1变构与F-2,6-BP开关","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"PFK-1是糖酵解最核心限速酶，既受ATP双位点与柠檬酸反馈抑制，更受胰高血糖素/PKA磷酸化PFK-2/FBP-2调节的F-2,6-BP最强控制。","source_slides":["糖代谢2026.pdf#P33-P37,P48-P49,P102"],"diagram_assets":[{"path":"assets/biochem_pfk1_pfk2_regulation_p37.webp","caption":"PFK-1变构效应物网络与PFK-2/FBP-2双功能酶共价磷酸化反转2,6-双磷酸果糖水平机制图","source_page":37}],"payload":{"steps":[{"cue":"ATP双位点悖论：生理浓度4–5 mM的ATP平时为何会自己踩下PFK-1刹车，AMP又如何放大信号？","reveal":"ATP既是PFK-1活性中心的底物，高浓度时又结合其别构抑制位点使酶活性骤降；当细胞耗能使ATP微降、ADP升高时，腺苷酸激酶(2ADP ↔ ATP+AMP)因体内[ATP]≈50×[AMP]而把AMP浓度百分比放大数倍，AMP与F-2,6-BP共同解除ATP和柠檬酸的抑制。","mechanism_tag":"ATP双位点·AMP信号放大"},{"cue":"F-2,6-BP双功能酶开关：饱餐 vs 饥饿时肝脏如何借同一条多肽链倒转PFK-1活性？","reveal":"PFK-2与FBP-2位于同一双功能酶蛋白上：空腹胰高血糖素↑ → cAMP → PKA磷酸化该酶，使其PFK-2活性失活、FBP-2活性激活，快速水解F-2,6-BP为F-6-P；F-2,6-BP作为PFK-1最强变构激活剂一旦下降，ATP/柠檬酸抑制效应即占主导，糖酵解刹车。","mechanism_tag":"PKA磷酸化·PFK-2/FBP-2反转"},{"cue":"胰岛素反转与下游PK协同：血糖升高时F-2,6-BP与丙酮酸激酶如何联动放行？","reveal":"进食胰岛素↑激活磷蛋白磷酸酶去磷酸化双功能酶（PFK-2恢复活性）→ F-2,6-BP↑强力激活PFK-1；产生的F-1,6-BP再作为前馈别构激活剂激活下游丙酮酸激酶(PK)，而PK同时受高ATP/丙氨酸变构抑制及胰高血糖素/PKA磷酸化失活，防止中间物死锁。","mechanism_tag":"F-1,6-BP前馈PK·上下游协同"}],"takeaway":"PFK-1整合了局部能荷（ATP/柠檬酸⊖ vs AMP/ADP⊕）与全身激素信号（PKA磷酸化双功能酶使F-2,6-BP↓），并与F-1,6-BP前馈激活丙酮酸激酶构成糖酵解主阀门。","quiz":{"stem":"若通过基因定点突变把肝细胞双功能酶 PFK-2/FBP-2 上被 PKA 磷酸化的丝氨酸突变为丙氨酸（无法被磷酸化），在空腹高胰高血糖素状态下该肝细胞最可能出现什么反常代谢改变？","options":["胰高血糖素无法关闭PFK-2并激活FBP-2，胞内F-2,6-BP维持高位并持续强力激活PFK-1，阻碍糖异生","丙酮酸激酶失去F-1,6-BP前馈激活而完全停摆，细胞立刻转为无氧酮症","高浓度ATP不再能够结合PFK-1的活性中心导致F-6-P彻底耗竭","肝葡萄糖激酶立即受G-6-P强烈反馈抑制并关闭GLUT2"],"answer_idx":0,"explain":"正常空腹时胰高血糖素经cAMP-PKA磷酸化双功能酶（关PFK-2、开FBP-2），令F-2,6-BP骤降以撤除对PFK-1的激活；若磷酸化位点突变失效，F-2,6-BP持续高企将把糖流死锁在PFK-1正向酵解方向。","remedial_node_id":"biochem_glycolysis_pathway_atp"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_pdh_complex_mechanism","title":"丙酮酸脱氢酶复合体与砷/B1阻断","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"线粒体基质PDH复合体(E1/E2/E3配5种辅酶)不可逆将丙酮酸氧化脱羧为乙酰CoA，受产物比值与磷酸化修饰双重锁控。","source_slides":["糖代谢2026.pdf#P61-P69,P96-P97"],"diagram_assets":[{"path":"assets/biochem_pdh_complex_p63.webp","caption":"丙酮酸脱氢酶复合体E1/E2/E3与TPP、硫辛酸、HSCoA、FAD、NAD⁺五步接力及脚气病/砒霜抑制位点","source_page":63}],"payload":{"steps":[{"cue":"3酶5辅酶接力机制：乙酰基与氢原子如何从丙酮酸依次转移到乙酰CoA和NADH？","reveal":"① E1(丙酮酸脱氢酶，辅酶TPP/Vit B1)催化脱羧成羟乙基-TPP；② E2(二氢硫辛酰胺转乙酰酶)将乙酰基转给氧化型硫辛酸后，再移交给HSCoA(泛酸)生成乙酰CoA，自身留两个-SH；③ E3(二氢硫辛酰胺脱氢酶)依次借FAD(Vit B2)与NAD⁺(Vit PP)氧化双巯基再生二硫键，产出NADH+H⁺。","mechanism_tag":"E1-TPP → E2-硫辛酸 → E3-FAD/NAD⁺"},{"cue":"双轨调控锁：脂肪动员或胰岛素刺激下，PDH如何决定碳流是否放行进入TCA？","reveal":"① 别构反馈：高乙酰CoA/HSCoA与高NADH/NAD⁺及ATP直接抑制PDH，AMP/ADP/NAD⁺激活；② 共价磷酸化：PDH激酶磷酸化E1使PDH失活（受乙酰CoA、NADH、ATP激活，ADP、NAD⁺抑制）；PDH磷酸酶去磷酸化激活PDH（受胰岛素与Ca²⁺激活）。","mechanism_tag":"磷酸化失活·胰岛素/Ca²⁺去磷酸化"},{"cue":"临床与毒理断点：为何Vit B1缺乏、砒霜中毒与先天PDH缺陷都会引发乳酸性酸中毒？","reveal":"Vit B1缺乏（脚气病）缺TPP使E1卡死；砒霜/有机砷螯合二氢硫辛酰胺的双-SH使E2停摆；先天E1缺陷（P67 PBL患儿）使丙酮酸无法生成乙酰CoA，在胞质被迫还原为乳酸、转氨为丙氨酸并伴脑ATP危机（视神经萎缩、共济失调、HCO₃⁻↓）。","mechanism_tag":"B1/砷剂/先天PDH缺陷→乳酸↑"}],"takeaway":"PDH复合体是连接胞质糖酵解与线粒体TCA的不可逆单行门，集齐TPP(B1)、硫辛酸、CoA、FAD(B2)和NAD⁺(PP)五大辅酶，任何一环断裂都会令丙酮酸倒灌成乳酸与丙氨酸。","quiz":{"stem":"PBL临床案例：3岁患儿出现小颅畸形、视神经萎缩、共济失调，血丙酮酸、乳酸与丙氨酸均显著升高伴血清HCO₃⁻↓（确诊先天性PDH E1亚基缺陷）。若对患儿改用“高脂生酮饮食+低碳水化合物”方案可明显减轻乳酸酸中毒，其根本生化原理是：","options":["脂肪酸β-氧化可直接在线粒体绕过PDH复合体生成乙酰CoA供外周及部分组织氧化与生酮供脑，减少丙酮酸堆积","高脂饮食能直接将血中乳酸通过PDH E2/E3逆向还原为葡萄糖","酮体在胞质无需线粒体即可经糖酵解生成2分子ATP并降低NADH","乙酰CoA大量积累后可强力激活PDH激酶并修复E1亚基缺陷"],"answer_idx":0,"explain":"PDH缺陷使葡萄糖走糖酵解后止步于丙酮酸（被迫转成乳酸和丙氨酸），高碳水反而加重乳酸酸中毒；低碳高脂生酮饮食使脂肪直接生成乙酰CoA与酮体绕开PDH断点供能。","remedial_node_id":"biochem_pfk1_pfk2_switch"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_cytosolic_nadh_shuttles","title":"胞质NADH双穿梭与有氧ATP核算","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"胞质GAPDH产生的NADH无法直接穿透线粒体内膜，须经α-磷酸甘油穿梭(产1.5 ATP)或苹果酸-天冬氨酸穿梭(产2.5 ATP)送入呼吸链，决定1葡萄糖总产30或32 ATP。","source_slides":["糖代谢2026.pdf#P42,P90-P94"],"diagram_assets":[{"path":"assets/biochem_malate_aspartate_shuttle_p93.webp","caption":"苹果酸-天冬氨酸穿梭：苹果酸脱氢酶(MDH)与天冬氨酸转氨酶(AST)配合两大膜载体无损耗转运胞质NADH至线粒体基质","source_page":93}],"payload":{"columns":["对比维度","α-磷酸甘油穿梭","苹果酸-天冬氨酸穿梭"],"rows":[["主要分布与反应特点","骨骼肌、脑；速度快、单向不可逆（受限粒体内膜外侧酶控制）","肝、心肌；速度较慢、全程可逆，同时平衡草酰乙酸出入"],["跨膜载体与关键催化酶","胞质NADH还原DHAP→α-磷酸甘油（可透外膜）→线粒体内膜FAD依赖α-磷酸甘油脱氢酶氧化","胞质OAA+NADH→苹果酸→经苹果酸-α-KG载体入基质→基质MDH再生NADH；OAA借AST转Asp经Glu-Asp载体出膜"],["呼吸链受氢体与单分子ATP","进入线粒体后变为 FADH₂ → 仅获 1.5 ATP（P/O损耗1 ATP）","进入基质仍为 NADH+H⁺ → 完整获 2.5 ATP（零能量损耗）"],["1分子葡萄糖有氧总ATP账本","酵解(-2 + 4 + 2×1.5) + PDH(5) + 2×TCA(20) = 30 ATP","酵解(-2 + 4 + 2×2.5) + PDH(5) + 2×TCA(20) = 32 ATP"]],"quiz":{"stem":"若用氨基氧乙酸（AST转氨酶特异性抑制剂）处理心肌细胞，阻断草酰乙酸与天冬氨酸在胞质-线粒体间的氨基互换，1分子葡萄糖经糖酵解完全有氧氧化时总ATP净产量最可能如何变化？","options":["苹果酸-天冬氨酸穿梭停摆，胞质2 NADH改走α-磷酸甘油穿梭或受限，单糖最高总ATP由32降至30","线粒体内丙酮酸脱氢酶产生的2 NADH也无法进入呼吸链，总ATP降至25","底物水平磷酸化与TCA内3 NADH受阻，总ATP仅剩2","苹果酸可直接顺浓度梯度与天冬氨酸自由扩散穿过内膜，ATP维持32不变"],"answer_idx":0,"explain":"心肌主要依赖苹果酸-天冬氨酸穿梭（产32 ATP）。抑制AST会破坏OAA→Asp出线粒体回环，使胞质2分子GAPDH产生的NADH无法以NADH(2.5 ATP)形式入基质，只能改走产FADH₂(1.5 ATP)的α-磷酸甘油穿梭，损失2×1=2 ATP而降至30 ATP。","remedial_node_id":"biochem_pdh_complex_mechanism"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_tca_cycle_steps_energy","title":"三羧酸循环八步反应与产能计数","subject":"biochem","syllabus_refs":["syl_biochem_010"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"线粒体基质8步不可逆循环：1次底物磷酸化、2次脱羧、3个关键酶、4次脱氢（3 NADH+1 FADH₂+1 GTP = 10 ATP/乙酰CoA）。","source_slides":["糖代谢2026.pdf#P70-P85","第2章酶-20260915.pptx#P39-P40,P139"],"payload":{"steps":[{"cue":"缩合与异构化：草酰乙酸浓度极低为何仍能启动TCA，顺乌头酸酶为何能把叔醇变成易氧化仲醇？","reveal":"① 柠檬酸合酶（第一关键酶，高亲和力且断高能硫酯键放能不可逆）将乙酰CoA(2C)+草酰乙酸(4C)缩合为柠檬酸(6C)；② 顺乌头酸酶催化脱水再水合将难氧化叔醇柠檬酸异构化为仲醇异柠檬酸（灭鼠药氟乙酸→氟代乙酰CoA→氟代柠檬酸强力抑制该酶）。","mechanism_tag":"CS不可逆·氟柠檬酸阻断"},{"cue":"两次不可逆氧化脱羧：哪两步释放2分子CO₂并产生前2分子NADH？","reveal":"③ 异柠檬酸脱氢酶（第二关键酶，Mg²⁺）：先脱氢生草酰琥珀酸(β-酮酸)再β-脱羧成α-酮戊二酸(5C)+CO₂+NADH；④ α-酮戊二酸脱氢酶复合体（第三关键酶，组成与PDH相似且E3完全相同）：氧化脱羧生成高能硫酯琥珀酰CoA(4C)+CO₂+NADH。","mechanism_tag":"IDH + α-KGDH(同E3)·2脱羧"},{"cue":"唯一底物水平磷酸化：琥珀酰CoA的高能硫酯键如何转变为高能磷酸键？","reveal":"⑤ 琥珀酰CoA合成酶将硫酯键能量保存为GTP（哺乳动物分ADP特异性[高耗能细胞]与GDP特异性[合成旺盛细胞]同工酶，经核苷二磷酸激酶GTP+ADP↔GDP+ATP），这是TCA循环中唯一的底物水平磷酸化步骤。","mechanism_tag":"1次底物水平磷酸化(GTP/ATP)"},{"cue":"四步再生草酰乙酸与计数口诀：TCA中唯一嵌在线粒体内膜的酶是谁？每圈共几ATP？","reveal":"⑥ 琥珀酸脱氢酶(SDH，辅酶FAD+铁硫中心，唯一结合于线粒体内膜且兼属呼吸链复合体II)→FADH₂+延胡索酸；⑦ 延胡索酸酶加水→苹果酸；⑧ 苹果酸脱氢酶→NADH+草酰乙酸（因OAA不断被CS消耗而拉动正向）。口诀：1底磷、2脱羧、3关键酶、4脱氢 → 3×2.5+1×1.5+1 = 10 ATP/圈。","mechanism_tag":"SDH内膜·1-2-3-4口诀·10 ATP"}],"takeaway":"TCA循环每转一圈消耗1乙酰CoA、再生1草酰乙酸，输出“2 CO₂ + 3 NADH + 1 FADH₂ + 1 GTP（=10 ATP）”，因CS、IDH、α-KGDH三步放能不可逆而成为单向旋转引擎。","quiz":{"stem":"小鼠误食含氟乙酸的毒饵后在体内转化为氟代柠檬酸并特异性抑制顺乌头酸酶。此时检测心肌细胞线粒体，下列推演错误的是：","options":["柠檬酸大量堆积，其后游离α-酮戊二酸及草酰乙酸再生均停滞","线粒体3次NAD⁺脱氢与1次FAD脱氢断流，ATP迅速崩溃","通过静脉追加大量丙酮酸生成乙酰CoA即可绕过顺乌头酸酶恢复每圈10 ATP产出","顺乌头酸酶受阻是因为氟代柠檬酸占据活性中心阻断柠檬酸向仲醇异柠檬酸转化"],"answer_idx":2,"explain":"TCA循环是串联闭环：氟代柠檬酸阻断第2步顺乌头酸酶后，上游乙酰CoA无论再多也只会继续积压成柠檬酸，完全无法跨过第3–8步产生还原当量或再生草酰乙酸。","remedial_node_id":"biochem_cytosolic_nadh_shuttles"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_tca_regulation_hub","title":"TCA循环调控与三大代谢枢纽","subject":"biochem","syllabus_refs":["syl_biochem_010"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"TCA三关键酶受能荷(ATP/ADP)与产物反馈精密调控；中间产物只作催化剂无净增加，并作为三大营养素互变总枢纽。","source_slides":["糖代谢2026.pdf#P86-P89,P98-P100,P106"],"diagram_assets":[{"path":"assets/biochem_tca_hub_p89.webp","caption":"TCA循环代谢枢纽图：丙酮酸羧化回补OAA，柠檬酸输出合成脂酸胆固醇，α-KG/延胡索酸/琥珀酰CoA衔接氨基酸与卟啉","source_page":89}],"payload":{"bullets":["三大限速酶别构规则：{{柠檬酸合酶}}受ATP/柠檬酸/NADH/琥珀酰CoA抑制、ADP激活；{{异柠檬酸脱氢酶}}受ATP抑制、ADP/Ca²⁺激活；{{α-酮戊二酸脱氢酶复合体}}受琥珀酰CoA/NADH抑制、Ca²⁺激活。","催化剂与不可净合成铁律（同位素追踪）：TCA中间产物（含草酰乙酸）只起{{催化剂}}作用本身无净增量——进入的2碳乙酰CoA等价于脱出的2 CO₂，故{{不能通过TCA从乙酰CoA净合成草酰乙酸或葡萄糖}}。","草酰乙酸回补(Anaplerosis)：当TCA中间产物被抽走用于合成代谢时，草酰乙酸主要靠{{丙酮酸羧化酶}}（丙酮酸+CO₂→OAA）或苹果酸脱氢回补，其终极碳源仍是葡萄糖。","三大营养素合成/分解总枢纽：柠檬酸出线粒体合成{{脂肪酸与胆固醇}}（并涉足非经典TCA ACLY路径调控干细胞分化）；α-KG与OAA经转氨双向连{{氨基酸}}；琥珀酰CoA承接{{奇数碳脂酸及Val/Ile/Met}}并合成{{卟啉(血红素)}}；延胡索酸承接Asp/Phe/Tyr。","上下游呼吸链偶联：TCA脱氢生成的NADH/FADH₂必须及时经氧化磷酸化消耗以再生NAD⁺/FAD，一旦{{NADH/NAD⁺}}升高即反向掐断全部TCA脱氢酶。"],"trap_note":"典型考试陷阱：偶碳链脂肪酸β-氧化全变成乙酰CoA，在TCA转一圈释放2 CO₂，故偶碳脂肪“不能净转变为糖”；只有奇数碳脂肪酸尾端生成的丙酰CoA→琥珀酰CoA才可微量净生糖！","quiz":{"stem":"将[1,2-¹⁴C]标记的乙酰CoA注入处于饥饿糖异生状态的肝细胞匀浆中，很快在生成的葡萄糖分子中检测到了¹⁴C放射性；但生化定量却发现肝细胞葡萄糖与TCA中间产物的“净摩尔总量”并未因为乙酰CoA氧化而增加。能完美解释这一同位素悖论的机理是：","options":["标记碳经柠檬酸→琥珀酸随机分布于部分草酰乙酸分子中进入糖异生，但TCA每进入2碳乙酰CoA必同时以2分子CO₂形式排出2碳，中间体无净增量","乙酰CoA在胞质直接逆转丙酮酸脱氢酶反应，无需经过TCA循环即生成¹⁴C-丙酮酸","顺乌头酸酶将乙酰CoA的两个碳直接插入6-磷酸葡萄糖而不消耗草酰乙酸","草酰乙酸本身在柠檬酸合酶催化下每圈增殖一倍并释放出半数进入糖异生"],"answer_idx":0,"explain":"同位素交换与化学计量净合成必须严格区分：乙酰CoA的2个碳虽能在琥珀酸对称分子洗牌后部分混入OAA骨架，但整个TCA每进2碳必出2碳(2 CO₂)，OAA只是催化剂，无法凭空净增长出碳骨架变成糖。","remedial_node_id":"biochem_tca_cycle_steps_energy"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_pasteur_warburg_coordination","title":"巴斯德效应、能量协调与沃伯格效应","subject":"biochem","syllabus_refs":["syl_biochem_009"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"有氧时TCA产生的柠檬酸与ATP抑制PFK-1且NADH入线粒体从而抑制无氧酵解（巴斯德效应）；肿瘤细胞却在富氧下仍高通量糖酵解排乳酸（沃伯格效应）。","source_slides":["糖代谢2026.pdf#P101-P105"],"payload":{"columns":["调控现象","巴斯德效应 (Pasteur Effect)","沃伯格效应 (Warburg Effect)"],"rows":[["发生场景与表型特征","正常细胞由缺氧转为氧供充足时：葡萄糖消耗急剧下降，乳酸生成停止","多数实体肿瘤细胞即使在氧供充足条件下，仍优先进行高通量糖酵解并排出大量乳酸"],["核心酶学与还原当量机制","① O₂足→NADH改走双穿梭入线粒体不再还原丙酮酸；② 丙酮酸入线粒体走TCA→高ATP与柠檬酸强力变构抑制PFK-1","糖酵解速率大增以满足快速增殖肿瘤对碳骨架、PPP核糖/NADPH及微环境酸化的需求（尽管单糖产ATP少）"],["上下游协调信号放大器","腺苷酸激酶(2ADP↔ATP+AMP)借50倍[ATP]/[AMP]基差把ATP微跌放大为AMP飙升，精密匹配酵解与氧化磷酸化速率","肿瘤细胞打破正常柠檬酸/ATP反馈刹车，高表达GLUT与糖酵解酶系，是临床PET-CT显像(¹⁸F-FDG高摄取)的生化基础"]],"quiz":{"stem":"将处于剧烈无氧酵解的骨骼肌或酵母悬浮液突然通入充足氧气后，葡萄糖摄入速率与乳酸排出量迅速下降（巴斯德效应）。下列哪项最准确解释了为什么有氧反而“省糖”并抑制糖酵解？","options":["单分子葡萄糖有氧产30–32 ATP是无氧(2 ATP)的15倍以上，升高的ATP与线粒体溢出的柠檬酸共同别构抑制PFK-1，且胞质NADH改入线粒体","氧气直接共价氧化失活己糖激酶的活性中心Cys残基","有氧氧化使肝细胞迅速激活PFK-2并大幅提升F-2,6-BP浓度","氧气阻断了3-磷酸甘油醛脱氢酶对NAD⁺的结合"],"answer_idx":0,"explain":"巴斯德效应是经典的能量效率反馈：有氧供能效率剧增使ATP↑、AMP↓且TCA产生的柠檬酸累积反馈抑制PFK-1，同时穿梭抢走胞质NADH，双重关闭乳酸酵解。","remedial_node_id":"biochem_pfk1_pfk2_switch"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_pentose_phosphate_pathway","title":"磷酸戊糖途径、NADPH与蚕豆病","subject":"biochem","syllabus_refs":["syl_biochem_011"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"胞质分流途径不产ATP；限速酶G6PD受NADPH/NADP⁺比值调控，专门产出合成供氢体NADPH（维持红细胞GSH防溶血）与5-磷酸核糖。","source_slides":["糖代谢2026.pdf#P109-P121","脂质代谢-2026.pdf#P115,P172"],"payload":{"steps":[{"cue":"第一阶段（不可逆氧化）：G-6-P如何产出两分子NADPH，谁是限速总阀门？","reveal":"6-磷酸葡萄糖脱氢酶(G6PD，核心限速酶)催化G-6-P脱氢成6-磷酸葡萄糖酸内酯（产第1个NADPH+H⁺），水解后再经6-磷酸葡萄糖酸脱氢酶氧化脱羧生成5-磷酸核酮糖+CO₂（产第2个NADPH+H⁺）。G6PD严格受胞质NADPH/NADP⁺比值负反馈调控（NADPH需求↑→比值↓→激活PPP）。","mechanism_tag":"G6PD限速·NADPH/NADP⁺调控"},{"cue":"第二阶段（可逆基团转移）：为何又称磷酸戊糖旁路，转酮酶与转醛酶各需要什么条件？","reveal":"3×C5（5-磷酸核酮糖异构为1分子5-磷酸核糖+2分子5-磷酸木酮糖）经转酮醇酶（转2C单位，辅酶为TPP/Vit B1）与转醛醇酶（转3C单位）经历C5+C5↔C7+C3↔C6+C4再与C5重组为2×F-6-P(C6)+1×G3P(C3)回流糖酵解，实现只产NADPH而不积聚多余戊糖。","mechanism_tag":"转酮(TPP)/转醛·重返糖酵解"},{"cue":"两大生理意义与蚕豆病机制：NADPH与5-磷酸核糖分别挽救了什么关键生理需求？","reveal":"① 5-磷酸核糖是体内合成核酸(RNA/DNA)核糖的唯一直接来源；② NADPH不进呼吸链产能，而是用于脂肪酸/胆固醇合成、肝CYP羟化解毒，以及在红细胞内使氧化型谷胱甘肽(GSSG)还原为2 GSH——G6PD遗传缺乏者遇蚕豆或氧化药物后无法维持GSH，导致红细胞膜蛋白巯基氧化破裂引发急性溶血（蚕豆病）。","mechanism_tag":"核糖唯一来源·GSH护膜防蚕豆病"}],"takeaway":"PPP总式“3 G-6-P + 6 NADP⁺ → 2 F-6-P + G3P + 6 NADPH+6H⁺ + 3 CO₂”，核心输出不在ATP而在NADPH抗氧化/合成还原力与核酸原料5-磷酸核糖。","quiz":{"stem":"一名广东男性儿童食用新鲜蚕豆数小时后突发寒战、酱油色血红蛋白尿及黄疸（G6PD缺乏症/蚕豆病）。红细胞发生急性血管内溶血的直接生化断裂链条是：","options":["G6PD缺乏→红细胞无法通过PPP生成足够NADPH→GSSG不能还原为GSH→膜蛋白-SH与脂质遭过氧化物氧化破坏","G6PD缺乏→红细胞失去糖酵解唯一产ATP途径→Na⁺-K⁺泵停摆水肿胀破","G6PD缺乏→红细胞线粒体TCA循环失去5-磷酸核糖而停止氧化磷酸化","蚕豆毒素不可逆抑制转酮醇酶TPP辅酶→5-磷酸木酮糖结晶刺破红细胞膜"],"answer_idx":0,"explain":"成熟红细胞无线粒体且无其他高效NADPH来源，完全依赖G6PD启动PPP产生NADPH以维持还原型谷胱甘肽(GSH)池；G6PD缺乏遇强氧化剂(蚕豆/伯氨喹等)时GSH耗竭，红细胞膜氧化破裂溶血。","remedial_node_id":"biochem_glycolysis_hk_vs_gk"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_glycogen_synthesis_breakdown","title":"糖原合成与分解双轨及肝肌差异","subject":"biochem","syllabus_refs":["syl_biochem_012"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"胞质糖原合成以UDPG为活性供体、糖原合酶促α-1,4延长与分支酶造α-1,6支链；分解靠磷酸化酶磷酸解出G-1-P，仅肝肾含G6Pase能直接补充血糖。","source_slides":["糖代谢2026.pdf#P123-P145"],"payload":{"columns":["对比维度","糖原合成 (Glycogenesis)","糖原分解 (Glycogenolysis)"],"rows":[["定位与核心活化工序","肝/肌胞质：G→G-6-P→G-1-P，再与UTP经UDPG焦磷酸化酶生成活性供体 UDPG（耗2高能键，PPi水解拉动不可逆）","肝/肌胞质磷酸解为主（少部分溶酶体酸性α-苷酶自噬水解）：磷酸化酶直接利用胞内高浓度Pi切下非还原端→G-1-P"],["限速酶与糖苷键延长/切断","糖原合酶（限速酶）：只能把UDPG接在原有“糖原引物”非还原端，形成 α-1,4-糖苷键","糖原磷酸化酶（限速酶）：仅能切断 α-1,4-糖苷键，至分支点前4个葡萄糖残基即受阻"],["分支点处理与结构优势","分支酶转移约6–7糖链以 α-1,6-糖苷键接支（每12–18G一分支）→ 提高溶解度且倍增非还原端以利快速动员","脱支酶双重活性：先α-1,4-糖基转移酶移走3G暴露分支点，再α-1,6-糖苷酶水解放出1分子“游离葡萄糖”"],["肝糖原 vs 肌糖原归宿(G6Pase)","肝糖原(90–100g, ≤5%)可用单糖或非糖物质异生合成；肌糖原(200–500g, 1–2%)主要靠葡萄糖合成","肝/肾有葡萄糖-6-磷酸酶(G6Pase)→G-6-P水解为血糖（维持空腹12–18h）；肌肉无G6Pase→G-6-P只能进酵解供肌收缩(出乳酸)"]],"quiz":{"stem":"一名健壮大学生完成400米全力冲刺后检测血乳酸飙升而血糖并未因大量肌糖原分解而直接升高；相反，在禁食14小时安静状态下其血糖仍基本稳定。造成肝、肌糖原分解代谢归宿截然不同的关键酶差异是：","options":["骨骼肌细胞缺乏葡萄糖-6-磷酸酶(G6Pase)，肌糖原分解出的G-6-P无法脱磷酸透膜入血，只能经酵解产出ATP与乳酸","骨骼肌缺乏磷酸葡萄糖变位酶，无法将G-1-P转变为G-6-P","肌糖原只有α-1,4糖苷键没有α-1,6分支，因此不能经脱支酶生成葡萄糖","肝脏缺乏糖原磷酸化酶，仅能靠溶酶体酸性糖苷酶缓慢水解维持血糖"],"answer_idx":0,"explain":"G-6-P带磷酸基团无法跨膜。肝、肾独有内质网葡萄糖-6-磷酸酶(G6Pase)能把G-6-P水解成游离葡萄糖入血；骨骼肌缺G6Pase，故肌糖原只能“自产自销”经酵解或有氧氧化供肌肉收缩。","remedial_node_id":"biochem_glycolysis_hk_vs_gk"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_glycogen_covalent_allosteric","title":"糖原共价反向级联与糖原累积症","subject":"biochem","syllabus_refs":["syl_biochem_012"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"胰高血糖素/肾上腺素经cAMP-PKA同步磷酸化关闭糖原合酶、激活磷酸化酶并锁定PP-1抑制剂；G6Pase等遗传缺陷则致糖原累积症。","source_slides":["糖代谢2026.pdf#P146-P153"],"diagram_assets":[{"path":"assets/biochem_glycogen_cascade_p149.webp","caption":"糖原合成与分解共价修饰级联：PKA同时磷酸化糖原合酶、磷酸化酶b激酶与磷蛋白磷酸酶抑制剂(抑制PP-1)","source_page":149}],"payload":{"steps":[{"cue":"激素上游分工：为何低血糖时胰高血糖素主攻肝糖原，而应激时肾上腺素还能动员肌糖原？","reveal":"肝细胞膜高表达胰高血糖素受体与肾上腺素受体，而骨骼肌细胞膜缺乏胰高血糖素受体、仅对肾上腺素响应；两者均偶联腺苷酸环化酶(AC)生成第二信使cAMP并激活PKA，但信号放大人海战术使微摩尔激素迅速撬动毫摩尔级糖原分解。","mechanism_tag":"肝(胰高+肾上) vs 肌(仅肾上)"},{"cue":"PKA三靶点共价锁定：磷酸化修饰如何做到“加强分解时绝对关死合成”？","reveal":"有活性PKA同时磷酸化三组靶点：① 糖原合酶a(活性)→b-P(无活性)；② 磷酸化酶b激酶→-P(活性)→再将磷酸化酶b(低活)磷酸化成a-P(高活)；③ 磷蛋白磷酸酶抑制剂→-P(激活)从而抑制PP-1去磷酸化，彻底锁死反向空耗。","mechanism_tag":"PKA三连击·共价逆向锁"},{"cue":"胰岛素与葡萄糖的协同解锁：餐后血糖升高如何一举逆转磷酸化级联？","reveal":"胰岛素激活PDE降cAMP并激活磷蛋白磷酸酶-1(PP-1)，使糖原合酶去磷酸化恢复a型(开)、磷酸化酶a-P去磷酸化变b型(关)；同时肝内高浓度葡萄糖作为磷酸化酶a的别构抑制剂，诱导其由R(疏松)转为T(紧密)构象暴露Ser-14-P，极大加速PP-1去磷酸化复位。","mechanism_tag":"胰岛素PP-1·葡萄糖R→T构象"},{"cue":"糖原累积症断点：为何不同酶缺陷分别出现“低血糖+酸中毒”或“运动痛无乳酸”？","reveal":"I型(Von Gierke)缺G6Pase→肝肾糖原堆积、空腹严重低血糖抽搐（喂糖即缓解）且堆积的G-6-P溢流糖酵解致乳酸性酸中毒；II型(Pompe)缺溶酶体酸性α-1,4/1,6糖苷酶累及全组织心肌；V型(McArdle)缺肌磷酸化酶致运动肌痉挛且血乳酸不升；另有脱支酶(外周短链多分支)/分支酶(外周长链少分支)异常。","mechanism_tag":"GSD I/II/V型临床断点"}],"takeaway":"记住糖原调节极简律：“磷酸化激活分解、抑制合成（胰高/肾上腺素驱动）；去磷酸化激活合成、抑制分解（胰岛素+高葡萄糖R→T协同驱动）”。","quiz":{"stem":"一名6个月婴儿表现为严重空腹低血糖抽搐（静注葡萄糖迅速苏醒）、肝脏显著肿大伴高乳酸血症与呼吸深快酸中毒（糖原累积症I型，葡萄糖-6-磷酸酶缺陷）。下列为何同时合并“空腹低血糖”与“乳酸性酸中毒”？","options":["G6Pase缺失使肝糖原分解及糖异生生成的G-6-P均无法水解成血糖释放，大量潴留的G-6-P被迫反向溢流入肝糖酵解生成过多乳酸","G6Pase缺失使骨骼肌无法进行任何糖酵解从而积聚丙酮酸","G6Pase缺失直接阻断肝脏糖原合酶使其永久保持去磷酸化状态","肝内无法合成UDPG导致游离葡萄糖在血中结晶触发代谢性酸中毒"],"answer_idx":0,"explain":"G6Pase是肝糖原分解与糖异生输出游离葡萄糖的共同最终出口。该酶缺失令肝内G-6-P只进不出，一方面无法维持空腹血糖，另一方面高浓度G-6-P推高糖原合成致肝大并溢出进入糖酵解产出大量乳酸引发酸中毒。","remedial_node_id":"biochem_glycogen_synthesis_breakdown"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_gluconeogenesis_bypasses","title":"糖异生三步绕行、穿梭与底物循环","subject":"biochem","syllabus_refs":["syl_biochem_012"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"肝肾线粒体与胞质协同以4种关键酶绕过糖酵解3个不可逆步，须匹配丙酮酸羧化支路中的草酰乙酸双穿梭与NADH供给平衡。","source_slides":["糖代谢2026.pdf#P155-P173"],"payload":{"steps":[{"cue":"第一绕行（丙酮酸→PEP）：为何必须先入线粒体羧化成草酰乙酸，如何受乙酰CoA激活？","reveal":"① 线粒体丙酮酸羧化酶（辅酶生物素，受乙酰CoA强力变构激活、ADP抑制）耗ATP将丙酮酸+CO₂羧化为草酰乙酸(OAA)；② 磷酸烯醇式丙酮酸羧激酶(PEPCK，线粒体与胞质均有分布，耗GTP)将OAA脱羧磷酸化生成PEP。","mechanism_tag":"PC(生物素/乙酰CoA⁺) + PEPCK"},{"cue":"草酰乙酸双穿梭与乙醇低血糖：为何氨基酸糖异生走苹果酸出线粒体，而乳酸原料走天冬氨酸？","reveal":"糖异生在胞质1,3-BPG→G3P步需消耗NADH+H⁺：以氨基酸为原料时胞质缺NADH，故线粒体OAA先还原为苹果酸运出再氧化回OAA顺带运出NADH；以乳酸为原料时LDH(乳酸→丙酮酸)已在胞质产足NADH，故OAA可经AST转为天冬氨酸出膜或直接在线粒体生成PEP出膜。大量饮酒时乙醇脱氢酶产生海量胞质NADH耗竭NAD⁺，直接扼死乳酸→丙酮酸转化引发空腹低血糖！","mechanism_tag":"苹果酸带NADH vs 天冬氨酸·乙醇中毒"},{"cue":"第二、三绕行与四大原料边界：哪些非糖物可转糖，哪些绝对不能？","reveal":"绕过PFK-1的是胞质果糖双磷酸酶-1(FBPase-1：F-1,6-BP→F-6-P)；绕过HK的是内质网葡萄糖-6-磷酸酶(G6Pase，仅肝/肾有)。生糖原料包括乳酸、生糖氨基酸（转α-酮酸入TCA→OAA）、甘油（甘油激酶→α-磷酸甘油→DHAP）；乙酰CoA（偶碳脂肪）不能净生糖！","mechanism_tag":"FBPase-1 + G6Pase·原料边界"},{"cue":"两大底物循环协同：如何避免糖酵解与糖异生同时空转成耗ATP的无效循环？","reveal":"① F-6-P/F-1,6-BP循环：F-2,6-BP与AMP激活PFK-1同时抑制FBPase-1（柠檬酸反之）；胰高血糖素/PKA降F-2,6-BP使流向翻转为糖异生；② PEP/丙酮酸循环：胰高血糖素/PKA抑制L型丙酮酸激酶、诱导PEPCK转录，加上乙酰CoA抑制PDH同时激活PC，彻底将丙酮酸推向糖异生。","mechanism_tag":"F-2,6-BP + 乙酰CoA双底物开关"}],"takeaway":"糖异生并非糖酵解简单倒转：必须动用PC+PEPCK（耗1 ATP+1 GTP，共耗6 ATP/Glc）、FBPase-1、G6Pase四关键酶，并在F-2,6-BP与乙酰CoA协同下与糖酵解严密互斥。","quiz":{"stem":"P164临床生化题：一名饥饿24小时（肝糖原几乎耗竭）后大量饮酒（乙醇）的青年被送急诊，表现为严重低血糖昏迷伴血乳酸显著升高。肝脏乙醇氧化反应(CH₃CH₂OH + NAD⁺ → CH₃CHO + NADH+H⁺)直接卡断糖异生的哪一关键耦合？","options":["胞质NADH/NAD⁺比值飙升抑制LDH将乳酸氧化为丙酮酸，不仅令乳酸堆积，更切断了糖异生最核心的丙酮酸底物来源（甚至将丙酮酸推回乳酸）","乙醇直接共价破坏线粒体丙酮酸羧化酶的生物素辅基使其无法结合CO₂","产生的乙酰CoA强力激活丙酮酸激酶与PFK-1加速耗糖","乙醛直接诱导肝葡萄糖-6-磷酸酶大量分泌入血"],"answer_idx":0,"explain":"饥饿超过12–18h后维持血糖几乎全靠肝糖异生。肝胞质乙醇脱氢酶海量消耗NAD⁺产生NADH+H⁺，逆向阻断乳酸+NAD⁺→丙酮酸+NADH+H⁺（并把苹果酸↔OAA也推向苹果酸），使丙酮酸与OAA枯竭、糖异生崩溃且乳酸飙升。","remedial_node_id":"biochem_pdh_complex_mechanism"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_cori_cycle_physiological","title":"Cori乳酸循环与肾糖异生泌氨","subject":"biochem","syllabus_refs":["syl_biochem_012"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"肝具G6Pase与高Km GK而肌缺G6Pase，造就肝-肌Cori乳酸循环(耗6 ATP)；饥饿酸中毒时肾糖异生PEPCK上升则驱动泌NH₃排H⁺。","source_slides":["糖代谢2026.pdf#P174-P181"],"diagram_assets":[{"path":"assets/biochem_cori_cycle_p180.webp","caption":"乳酸循环(Cori Cycle)：肌肉无G6Pase排乳酸入血，肝脏有G6Pase且GK Km高负责回收乳酸异生为血糖再输肌","source_page":180}],"payload":{"bullets":["Cori循环的酶分布不对称基石：骨骼肌无{{葡萄糖-6-磷酸酶}}只能把肌糖原酵解为乳酸入血；肝脏同时拥有高Km葡萄糖激酶与{{葡萄糖-6-磷酸酶}}，专门回收乳酸异生为葡萄糖送回肌肉。","能量代价与防酸中毒意义：肝内2分子乳酸异生为1分子葡萄糖净耗{{6分子ATP}}（PC 2 ATP + PEPCK 2 GTP + PGK逆反应2 ATP），既防止剧烈运动后乳酸堆积酸中毒，又完成碳骨架二次回收。","餐后三碳途径（肝糖原间接合成）：进食2–3小时内因肝葡萄糖激酶{{Km高}}对游离葡萄糖亲和力低，大部分葡萄糖先在肝外分解为乳酸/丙酮酸等三碳物，再回肝经糖异生高效补充{{肝糖原}}。","长期饥饿防低血糖接力：肝糖原最多维持血糖{{12–18小时}}；饥饿早期靠肌蛋白分解经丙氨酸-葡萄糖循环与脂肪甘油异生供脑与红细胞，长期禁食后外周改用酮体省糖。","肾糖异生与酸碱平衡：长期饥饿伴代谢性酸中毒时，体液pH↓直接诱导肾小管{{PEPCK}}合成，增强肾糖异生消耗{{α-酮戊二酸}}，拉动谷氨酰胺脱氨分泌{{NH₃}}入管腔中和原尿H⁺（保钠排氢）。"],"trap_note":"不要把乳酸循环的能量账算错：肌糖酵解产2 ATP（或从肌糖原产3 ATP），肝异生回1葡萄糖消耗6 ATP，整个器官间闭环净耗能（以肝脏代价换取肌肉快速爆发力与防酸中毒）。","quiz":{"stem":"长期饥饿诱发酮症代谢性酸中毒时，肾皮质糖异生流量显著跃升且尿液中铵盐(NH₄⁺)排泄同步倍增。以下准确连接“肾糖异生”与“肾小管泌氨排酸”因果桥梁的机制是：","options":["酸中毒诱导肾小管PEPCK表达增强糖异生，加速消耗α-酮戊二酸，从而拉动谷氨酰胺与谷氨酸脱氨释放NH₃入肾小管腔结合H⁺排出","肾小管直接将血液中的尿素通过逆转鸟氨酸循环水解为葡萄糖和游离NH₃","升高的原尿H⁺直接激活肾葡萄糖-6-磷酸酶把乳酸转化为NH₄⁺","肾糖异生通过α-磷酸甘油穿梭把胞质H⁺直接泵入肾小球滤过液"],"answer_idx":0,"explain":"如图P178所示，酸中毒诱导肾小管PEPCK增强糖异生后，作为糖异生中转的α-酮戊二酸被快速抽走变成草酰乙酸→PEP→糖，进而按质量作用定律拉动谷氨酰胺→谷氨酸→α-KG脱氨生成大量NH₃泌入管腔缓冲H⁺。","remedial_node_id":"biochem_gluconeogenesis_bypasses"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_carb_digestion_glut","title":"糖消化吸收、SGLT与GLUT分布","subject":"biochem","syllabus_refs":["syl_biochem_008"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"淀粉经α-淀粉酶与刷状缘双糖酶(阿卡波糖抑制)变为单糖，借SGLT主动吸收经门静脉入肝，再依GLUT1–5不同Km梯度分配至各器官。","source_slides":["糖代谢2026.pdf#P18-P24,P194"],"payload":{"bullets":["淀粉两阶段水解：唾液与胰液{{α-淀粉酶}}（切α-1,4键）产麦芽糖、麦芽三糖、α-临界糊精与异麦芽糖；小肠刷状缘{{α-葡萄糖苷酶}}（被降糖药{{阿卡波糖}}抑制）、α-临界糊精酶、蔗糖酶与乳糖酶终解为单糖（人缺β-糖苷酶故不消化纤维素）。","SGLT-1 vs SGLT-2继发性主动转运：均依赖Na⁺-K⁺泵建立的Na⁺梯度。{{SGLT-1}}位于小肠纹状缘与肾近曲小管S3段（高亲和力、低转运量，占肾重吸收10%）；{{SGLT-2}}位于肾S1段（低亲和力、高转运量，占90%，达格列净等SGLT-2抑制剂靶点）。","门静脉首过与GLUT家族亲和力阶梯：吸收入血的单糖经{{肝门静脉}}首先入肝；各组织摄取取决于不耗能GLUT载体，对葡萄糖亲和力排序为 {{GLUT3(Km 1.8mM, 脑/神经元) \u003e GLUT4(4.6mM, 胰岛素依赖性肌/脂肪) \u003e GLUT1(6.9mM, 红细胞/血脑屏障) \u003e GLUT2(17.1mM, 肝/胰岛β细胞)}}。","特化转运分工：{{GLUT5}}专司小肠果糖转运；{{GLUT4}}平时储于胞内囊泡，仅在胰岛素或肌收缩刺激下移位至质膜完成餐后大宗降糖摄取。"],"trap_note":"Km越小亲和力越高！因此饥饿低血糖时脑神经元GLUT3 (1.8 mM) 与红细胞/BBB GLUT1仍接近饱和持续供能，而肝/胰岛β细胞GLUT2 (17.1 mM) 忠实随血糖高低线性感知并调节代谢。","quiz":{"stem":"比较临床两类口服降糖药——刷状缘α-葡萄糖苷酶抑制剂（阿卡波糖）与肾小管SGLT-2抑制剂（达格列净），患者服用前者常出现腹胀排气甚至渗透性腹泻，而后者主要表现为无明显低血糖风险的治疗性糖尿。决定二者机制差异的生理与转运定位根因是：","options":["阿卡波糖阻断小肠寡糖水解令未消化糖进入结肠被菌群发酵产气产酸；SGLT-2抑制剂仅阻断肾近曲小管S1段90%滤过糖重吸收而不干扰小肠SGLT-1吸收","阿卡波糖直接阻断心肌与脑神经元的GLUT3转运；达格列净同时抑制小肠与肾脏所有GLUT2","达格列净强力刺激胰岛β细胞大量释放胰岛素引起餐后低血糖","阿卡波糖抑制胰液α-淀粉酶分泌导致脂肪泻"],"answer_idx":0,"explain":"阿卡波糖作用于小肠刷状缘α-葡萄糖苷酶，未水解寡糖入结肠经细菌发酵导致腹胀腹泻；达格列净高度选择性抑制肾近曲小管S1段SGLT-2（不抑制小肠SGLT-1），直接排糖出尿且因SGLT-1仍保底10%重吸收及不促胰岛素释放而极少诱发低血糖。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_fructose_galactose_disorders","title":"果糖与半乳糖代谢旁路及不耐受","subject":"biochem","syllabus_refs":["syl_biochem_008"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"肝果糖激酶绕开PFK-1快速产F-1-P，缺乏醛缩酶B致耗Pi低血糖果糖不耐受；半乳糖依赖Gal-1-P尿苷酰转移酶与UDPG互换入糖代谢。","source_slides":["糖代谢2026.pdf#P54,P183-P189"],"payload":{"columns":["比较维度","果糖代谢与果糖不耐受","半乳糖代谢与半乳糖血症"],"rows":[["组织分工与入口酶","肌/脂肪由己糖激酶→F-6-P；肝脏主要经果糖激酶(Fructokinase)→1-磷酸果糖(F-1-P)","牛乳乳糖水解产物；主要在肝脏先由半乳糖激酶(耗ATP)→1-磷酸半乳糖(Gal-1-P)"],["核心接轨糖酵解步骤","F-1-P经醛缩酶B(Aldolase B)裂解为DHAP + 甘油醛（丙糖激酶→G3P），完全绕开己糖激酶与PFK-1限速步","Gal-1-P与UDPG经“半乳糖-1-磷酸尿苷酰转移酶”交换生成UDP-Gal + G-1-P→变位酶→G-6-P；UDP-Gal 4-差向异构酶可逆转UDP-Gal↔UDPG"],["遗传缺陷与病理反转结局","遗传性缺乏醛缩酶B→进食蔗糖/果糖后F-1-P海量堆积耗竭肝内Pi与ATP→加速酵解与尿酸生成，突发乳酸性酸中毒与餐后低血糖","缺乏Gal-1-P尿苷酰转移酶→Gal-1-P蓄积毒害肝脑并致半乳糖醇沉积诱发白内障、肝肿大；正常时UDPG可借差向异构酶内源供UDP-Gal合成糖脂糖蛋白"]],"quiz":{"stem":"一名遗传性果糖不耐受症（肝醛缩酶B缺乏）患者误饮含蔗糖饮料后，出现肝内ATP骤降、餐后低血糖与严重乳酸性酸中毒。为什么肝果糖激酶不发生自我反馈刹车而导致肝脏无机磷(Pi)与ATP被“掏空”？","options":["肝果糖激酶绕开PFK-1限速阀门且不受ATP与底物反馈抑制，持续消耗ATP把大量无机磷锁死在F-1-P中，使ATP再生衰竭并阻断糖原分解/糖异生","F-1-P强力激活PFK-2并大量合成F-2,6-BP导致糖异生暴增","缺乏醛缩酶B使肌细胞GLUT4彻底失活引发高血糖昏迷","果糖在肝脏必须先经过半乳糖-1-磷酸尿苷酰转移酶耗尽UTP"],"answer_idx":0,"explain":"如P186–P187所示，肝果糖激酶持续激活且不受高ATP或能量充足抑制；当下游醛缩酶B缺失时，果糖被不断磷酸化成无法出路的F-1-P，海绵般吸干肝胞质Pi与ATP库，继而瘫痪依赖ATP的糖异生与破坏糖原磷酸化酶所需Pi供给引发严重低血糖。","remedial_node_id":"biochem_pfk1_pfk2_switch"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_blood_glucose_hormones_dm","title":"血糖激素稳态、OGTT与糖尿病分型","subject":"biochem","syllabus_refs":["syl_biochem_013"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"正常血糖3.89–6.11 mmol/L受胰岛素(唯一降糖)与胰高/肾上/糖皮质激素精密拮抗；其失调引发低血糖休克或1型/2型糖尿病急性/慢性病变。","source_slides":["糖代谢2026.pdf#P191-P222","脂质代谢-2026.pdf#P106,P182"],"payload":{"columns":["比较维度","1型糖尿病 (胰岛素依赖型)","2型糖尿病 (非胰岛素依赖型，占95%)"],"rows":[["发病根因与胰岛素/C肽","自身免疫炎症破坏胰岛β细胞→胰岛素绝对缺乏，血胰岛素及C肽释放试验低下或缺乏","遗传+肥胖致胰岛素抵抗(效应器敏感性↓)+相对分泌不足（峰值延迟）；长期高糖终致β细胞衰竭"],["激素稳态破坏机制（靶点对比）","失去胰岛素5大作用(GLUT4↑/PDE↓cAMP/PDH磷酸酶↑/PEPCK↓/HSL↓)→胰高血糖素无拮抗，脂肪动员暴增","正常餐后血糖(3.89–6.11)及OGTT被打破，空腹≥7.0或2h≥11.1 mmol/L；超肾糖阈(8.88–10)出现渗透性利尿与糖尿"],["临床特征与急慢性并发症","青少起病急、消瘦、“三多一少”典型；酮症酸中毒(DKA)倾向大；肾病(30–45%)为主死因，对胰岛素敏感","中老超重起病隐匿；易发高渗性昏迷；心血管(\u003e70%)及微血管(视网膜/周围神经/糖足坏疽)为主要死因；早期胰岛素抵抗"],["对立紊乱：低血糖休克警戒","空腹血糖\u003c2.8 mmol/L因脑无法用脂酸供能即出现头晕心悸直至昏迷死亡，须立即静注葡萄糖","区别于高血糖，胰岛β细胞瘤、糖原累积病(如GSD-I)、腺垂体/肾上腺皮质功能低下及乙醇中毒均诱发低血糖"]],"quiz":{"stem":"临床长期大剂量使用糖皮质激素（或库欣综合征患者）极易并发“类固醇性高血糖/糖尿病”。根据糖皮质激素调控糖代谢的两大直接生化位点（P207），其致病机制是：","options":["① 促进骨骼肌蛋白分解供氨基酸入肝增强糖异生；② 抑制肝外组织丙酮酸氧化脱羧并协助脂肪动员间接阻断葡萄糖摄取","① 不可逆破坏胰岛β细胞触发自身免疫炎症；② 直接关闭肝细胞葡萄糖-6-磷酸酶","① 强力激活胞质PDE使cAMP清零；② 大幅上调肌细胞膜GLUT4数量","① 促进小肠刷状缘果糖激酶磷酸化；② 抑制胰高血糖素分泌使肾糖阈降至2.8 mmol/L"],"answer_idx":0,"explain":"糖皮质激素一端推高肝糖输出（促肌蛋白分解供生糖氨基酸+诱导PEPCK增强糖异生），另一端直接抑制外周组织丙酮酸氧化脱羧并发挥对脂肪动员的允许作用以拮抗胰岛素降糖，从而诱发高血糖与胰岛素抵抗。","remedial_node_id":"biochem_gluconeogenesis_bypasses"}},"added_at":"2026-11-16T22:30:07+08:00"},{"id":"biochem_aa_composition_classification","title":"蛋白质含氮律与20种L-α-氨基酸分类","subject":"biochem","syllabus_refs":["syl_biochem_001"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"蛋白质平均含氮16%（定氮×6.25）；人体20种编码L-α-氨基酸按侧链极性与电性分五类（甲硫氨酸归非极性）。","source_slides":["生物化学-第一章 氨基酸与蛋白质-1.pdf#P8-P28","生物化学-第一章 氨基酸与蛋白质-2.pdf#P2-P3"],"payload":{"bullets":["元素定氮铁律：蛋白质主要由C、H、O、N、S组成（可含P/Fe/Cu/Zn/I），各蛋白含氮量极稳定且平均为{{16%}}，故生物样品蛋白质含量 = 含氮量 × {{6.25}}。","L-α-氨基酸通式与三大例外：除{{甘氨酸}}(R为H，无手性碳)与{{脯氨酸}}(环状亚氨基酸)外均属L-α-氨基酸；极少数还原酶/过氧化物酶含第21种{{硒代半胱氨酸}}(UGA密码子+SECIS元件+特异tRNA)。","五类侧链分类（人卫版坐标）：①非极性脂肪族（Gly、Ala、Val、Leu、Ile、Pro及含硫{{Met甲硫氨酸}}）；②极性中性（Ser、Thr、Cys、Asn、Gln）；③芳香族（Phe、Tyr、Trp）；④酸性（Asp、Glu）；⑤碱性（Arg胍基、Lys、His咪唑基）。","营养必需与非编码代谢氨基酸：成人必需8种（{{赖、色、苯丙、甲硫、苏、异亮、亮、缬}}），婴儿额外需{{组氨酸}}（半必需：Arg、His）；尿素循环中的鸟氨酸、瓜氨酸与精氨酸代琥珀酸属不参与蛋白合成的L-α-氨基酸。"],"trap_note":"两处高频考坑：① 复旦与人卫教材将甲硫氨酸(Met)归入“非极性脂肪族氨基酸”而非极性中性；② 凯氏定氮法只测总氮，不法分子掺入高氮非蛋白物质（如三聚氰胺含氮66%、尿素含氮46%）会造成蛋白含量虚高假象。","quiz":{"stem":"某乳制品厂在奶粉检测前违规掺入三聚氰胺（含氮量约66%），导致凯氏定氮测得的“粗蛋白含量”表面达标而实际真蛋白严重不足。这一测算漏洞的根本生化原因是：","options":["三聚氰胺能与20种L-α-氨基酸的R基共价交联，使蛋白质实际含氮率飙升至66%","甘氨酸不含手性碳原子，在凯氏定氮消化过程中会逃逸导致必须用三聚氰胺补足","以平均含氮16%乘6.25估算总氮，无法区分肽氮与非蛋白氮","三聚氰胺取代了半胱氨酸中的硫原子，使蛋白质转变为含硒代半胱氨酸的稳定结构"],"answer_idx":2,"explain":"天然蛋白质平均含氮量为16%（1/0.16=6.25），凯氏定氮只定量样本总氮并统一乘以6.25推算蛋白量；三聚氰胺(N 66%)或尿素(N 46%)等非蛋白含氮物会人为拉高总氮，制造虚高蛋白读数。","remedial_node_id":"biochem_aa_pool"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_aa_properties_reactions","title":"氨基酸等电点pI、280nm吸收与茚三酮","subject":"biochem","syllabus_refs":["syl_biochem_001"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"pH与pI相对大小决定氨基酸带电与电泳方向；Trp/Tyr呈280nm紫外吸收，茚三酮570nm显色唯独Pro例外。","source_slides":["生物化学-第一章 氨基酸与蛋白质-1.pdf#P29-P41","生物化学-第一章 氨基酸与蛋白质-2.pdf#P4"],"payload":{"steps":[{"cue":"两性解离与pI通用算法：如何一眼锁定兼性离子两侧的pKₙ与pKₙ₊₁？","reveal":"溶液pH \u003c pI时氨基酸带净正电荷（向负极泳动）；pH \u003e pI时带净负电荷（向正极泳动）；pH = pI呈电中性兼性离子。中性AA取pI = 1/2(pK₁+pK₂)；侧链可解离AA先数完全质子化时正电荷基团数n，pK从小到大排列后取pI = 1/2(pKₙ+pKₙ₊₁)（如Glu n=1取(2.2+4.3)/2=3.25；Lys n=2取(pK₂+pK₃)/2）。","mechanism_tag":"pH vs pI·完全质子化正电数n"},{"cue":"光吸收定量双法：为什么不用测总氮即可快速测定蛋白浓度，或灵敏定量游离氨基酸？","reveal":"① 紫外吸收：Trp(色氨酸，最大)与Tyr(酪氨酸)侧链含共轭双键，在280 nm处有特征吸收峰（Phe吸收弱且近257 nm），故A₂₈₀正比于蛋白浓度；② 茚三酮反应：α-氨基酸与水合茚三酮弱酸共热脱氨脱羧，释放的NH₃再桥联两分子茚三酮缩合成570 nm蓝紫色化合物（灵敏定量/指纹显色，但亚氨基酸Pro不能释放游离NH₃，生成黄色产物为例外）。","mechanism_tag":"280nm(Trp/Tyr) · 570nm茚三酮(Pro除外)"},{"cue":"α-氨基/α-羧基代谢转化枢纽：脱羧、脱氢与席夫碱分别通向哪三条生化通路？","reveal":"① 谷氨酸脱羧酶脱CO₂生成中枢抑制性递质γ-氨基丁酸(GABA)；② 谷氨酸脱氢酶(GDH)以NAD(P)⁺氧化脱氨生成α-酮戊二酸（直入TCA循环）与NH₄⁺；③ 氨基酸α-氨基与醛/酮（如PLP辅酶醛基）脱水缩合生成含-C=N-的活泼中间体席夫碱(Schiff base)，启动转氨基等催化反应。","mechanism_tag":"GABA · α-KG · 席夫碱(-C=N-)"}],"takeaway":"记住三条理化诊断法则：pH与pI定电泳极向（pH\u003cpI正电向负极），280nm认色/酪氨酸共轭环，570nm茚三酮唯独脯氨酸显黄；席夫碱与谷氨酸脱氢直接桥接第5章转氨脱氨。","quiz":{"stem":"将谷氨酸(pI=3.25)、甘氨酸(pI=5.97)与赖氨酸(pI=9.74)的混合液置于pH=6.0的缓冲液中进行电泳，并另取纯脯氨酸做茚三酮共热显色实验。下列实验结果完全正确的是：","options":["pH=6.0时谷氨酸带正电泳向负极、赖氨酸带负电泳向正极；纯脯氨酸在570nm处产生最强蓝紫色吸收峰","pH=6.0时谷氨酸带负电泳向正极、赖氨酸带正电泳向负极、甘氨酸几乎停留原点；纯脯氨酸与茚三酮共热不产生570nm蓝紫色产物","三者因均成肽前呈电中性故全部停留在点样原点；仅色氨酸因含吲哚环才与茚三酮显蓝紫色","因甘氨酸无手性碳故在280nm处紫外吸收最强，而赖氨酸在pH=6.0时净电荷为0"],"answer_idx":1,"explain":"pH=6.0时：对Glu(3.25)而言pH\u003epI带负电移向正极；对Lys(9.74)而言pH\u003cpI带正电移向负极；Gly(5.97)接近等电点几乎不动。脯氨酸为环状亚氨基酸，无游离α-伯氨基，与茚三酮反应不生成570nm蓝紫色化合物而呈黄色。","remedial_node_id":"biochem_aa_composition_classification"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_peptide_plane_bioactive","title":"肽键部分双键共轭、肽平面与活性肽","subject":"biochem","syllabus_refs":["syl_biochem_002","syl_biochem_001"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"肽键C-N具40%双键共轭(1.32Å)将6原子锁成刚性反式肽平面，只留Φ/Ψ单键旋转；GSH含非α γ-肽键。","source_slides":["生物化学-第一章 氨基酸与蛋白质-1.pdf#P38,P43-P49","生物化学-第一章 氨基酸与蛋白质-2.pdf#P5"],"diagram_assets":[{"path":"assets/biochem_protein_peptide_plane_p45.webp","caption":"肽单元(肽平面)共面几何：C-N键长1.32Å介于单双键之间，Cα1-C-O-N-H-Cα2共面呈反式，仅绕Φ(N-Cα)与Ψ(Cα-C)二面角旋转","source_page":45}],"payload":{"bullets":["多肽链极性与尺度：由α-COOH与α-NH₂脱水缩合形成，链中称氨基酸残基，从游离{{N-端(氨基末端)读至C-端(羧基末端)}}；常规划分寡肽(2–20残基)、多肽(21–50残基)、蛋白质(\u003e50残基)。","肽键部分双键共轭：羰基氧(C=O)与酰胺氮(N-H)孤对电子共振，使肽键C-N键长缩短为{{1.32 Å}}（短于正常C-N单键1.46 Å、长于C=N双键），呈现约40%双键性质而{{不能自由旋转}}。","刚性反式肽平面（肽单元）：参与肽键的6个原子({{Cα₁、C、O、N、H、Cα₂}})共处同一刚性平面，且相邻两个Cα原子严格处于C-N键对侧（{{反式Trans构象}}，除极少数Pro前顺式外），肽链折叠的自由度完全由连接两平面的单键二面角{{Φ(N-Cα)与Ψ(Cα-C)}}决定。","谷胱甘肽(GSH)非α肽键与抗氧化环：三肽L-γ-谷氨酰-L-半胱氨酰-甘氨酸以Glu的{{γ-羧基}}而非α-羧基成键；其Cys-SH可在含硒{{GSH过氧化物酶}}催化下清除H₂O₂变为二聚GSSG，再由依赖{{NADPH}}的GSH还原酶再生。","内源多肽激素修饰规律：下丘脑促甲状腺素释放激素(TRH)虽仅3肽，但其N-端谷氨酸环化为{{焦谷氨酸}}、C-端脯氨酸酰胺化为脯氨酰胺以抵抗外肽酶降解；另有脑啡肽(5肽)、内啡肽(31肽)、催产/加压素(9肽)等。"],"trap_note":"不要误以为多肽链中只有Cα-C单键能转，而忽略肽键C-N不能自由旋转才是α-螺旋/β-折叠能够规律盘绕的刚性积木前提；同时牢记GSH的“γ-酰胺键”是非核糖体合成的典型非α肽键。","quiz":{"stem":"若红细胞内磷酸戊糖途径限速酶G6PD发生遗传性严重缺陷，会直接破坏谷胱甘肽(GSH)活性功能循环中的哪一步，从而导致细胞膜巯基遭过氧化物破坏？","options":["GSH中的γ-酰胺键被迅速水解为α-肽键，使其失去结合半胱氨酸的能力","G6PD缺乏直接破坏了核糖体催化GSH三肽脱水缩合的肽键共振平面","硒代半胱氨酸中的Se原子被替换为S原子，阻断了GSSG向H₂O₂的逆向转化","胞质NADPH供给枯竭，使GSSG无法经GSH还原酶还原再生为2分子具游离-SH的还原型GSH"],"answer_idx":3,"explain":"如图1-47与第3章PPP途径协同所示：2分子GSH经含硒GSH过氧化物酶还原H₂O₂生成GSSG后，必须消耗磷酸戊糖途径产生的NADPH+H⁺才能经GSH还原酶再生为2 GSH；G6PD缺乏令NADPH断供，抗氧化防线崩塌引发溶血（蚕豆病）。","remedial_node_id":"biochem_pentose_phosphate_pathway"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_primary_anfinsen","title":"一级结构、胰岛素双硫键与Anfinsen","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"一级结构指N→C残基排列顺序及二硫键位置；Anfinsen实验证明一级序列编码三维折叠基础，进化高度保守。","source_slides":["生物化学-第一章 氨基酸与蛋白质-2.pdf#P13-P14,P45-P46,P51-P54","生物化学-第一章 氨基酸与蛋白质-3.pdf#P2"],"payload":{"steps":[{"cue":"一级结构定义与胰岛素标尺：除肽键外，二硫键归属于哪一级结构，胰岛素有几条键？","reveal":"一级结构是蛋白质分子从N-端至C-端的氨基酸排列顺序，主要化学键为肽键，还包括二硫键（由2个半胱氨酸残基氧化脱氢形成胱氨酸）。例如牛/人胰岛素含A链21aa + B链30aa = 51个残基、共49个肽键，以及3个二硫键（A6-A11链内1个 + A7-B7与A20-B19链间2个）。","mechanism_tag":"肽键 + 二硫键定位 · 51aa=49肽键"},{"cue":"Anfinsen牛胰核糖核酸酶A实验：一级结构是否独立决定空间构象？","reveal":"尿素（破坏氢键、疏水键等非共价键）+ β-巯基乙醇（还原4对二硫键成8个-SH）使RNase A彻底伸展失活；同时透析去除尿素和β-巯基乙醇并暴露于空气后，酶自发重新折叠并恢复\u003e90%天然活性——证明一级结构是空间构象与生物学功能的基础（但并非唯一决定因素，体内还受伴侣与环境调控）。","mechanism_tag":"一级序列编码三维折叠"},{"cue":"序列进化、多态性与翻译后修饰：同源蛋白为何既能保留核心功能又记录演化距离？","reveal":"① 同源蛋白关键部位序列高度保守（如人-黑猩猩细胞色素C差异0、人-猕猴仅1个残基、人-酵母达51个，构成分子进化树；泛素极高度保守）；② 等位基因造成同一人群氨基酸存在≥2种差异（且最高频率≤99%）称蛋白多态性，通常不影响功能；③ 翻译后糖基化、磷酸化、甲基化、乙酰化、羟基化、泛素化进一步微调溶解度、定位与互作。","mechanism_tag":"细胞色素C进化 · 多态性与修饰"}],"takeaway":"一级结构（残基序+二硫键）是蛋白质空间构象的蓝图与功能基石，决定进化保守与分子功能边界，但体内折叠仍需化学修饰与分子伴侣护航。","quiz":{"stem":"在Anfinsen经典的牛核糖核酸酶A（含8个Cys，4对二硫键）体外复性实验中，若研究者改变透析顺序：**先在8M尿素仍存在的条件下除去β-巯基乙醇并通氧氧化，最后再透析去除尿素**，所得酶活性的预期结局是：","options":["仅剩极低活性（约1%左右），因为变性伸展状态下8个-SH随机错配形成非天然二硫键并被锁死","立刻恢复近100%天然活性，因为空气中的氧会先精确引导4对天然二硫键配对再由尿素促折叠","形成由2条独立亚基构成的胰岛素样四级结构二聚体","由于肽键被β-巯基乙醇彻底切断，即使去除尿素也永远无法再成链"],"answer_idx":0,"explain":"天然构象引导二硫键正确配对！若在高浓度尿素未除时先撤去还原剂，无序肽链上的8个半胱氨酸随机氧化配对成105种可能组合中的“错配二硫键”，即使后续去掉尿素也因共价错锁而无法回折出天然活性中心。","remedial_node_id":"biochem_peptide_plane_bioactive"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_secondary_helix_sheet","title":"二级结构：α-螺旋 vs β-折叠与β-转角","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"二级结构靠主链肽键间氢键维系（不直接含侧链），但侧链大小/电荷与Pro亚氨基严格筛选α-螺旋或β-折叠。","source_slides":["生物化学-第一章 氨基酸与蛋白质-2.pdf#P15-P33"],"diagram_assets":[{"path":"assets/biochem_protein_beta_sheet_p20.webp","caption":"反平行式(间距0.70nm/7Å，氢键近乎直线更稳定) vs 平行式(6.5Å，氢键呈斜角)β-折叠几何对照","source_page":20}],"payload":{"columns":["比较维度","α-螺旋 (α-helix)","β-折叠 (β-sheet) \u0026 转角/无规卷曲"],"rows":[["主链几何与周期参数","右手螺旋主链盘绕：每圈3.6个残基（单残基旋转100°、轴升1.5Å），螺距0.54 nm；侧链全部伸向螺旋外侧","充分伸展锯齿状片层（5–8残基/段，以Cα为转折点，侧链交替分布上下方）；β-转角4残基(180°折返)；Ω-环6–16残基(首尾\u003c1nm)"],["主链氢键排布与稳定性","链内氢键：第i个肽键N-H与第i+4个肽键C=O形成平行于螺旋轴的分子内氢键","肽段间氢键：反平行式(间距0.70nm)氢键近直线排列故最稳定（丝心蛋白）；平行式(6.5Å)氢键倾斜较弱；β-转角为第1位C=O与第4位N-H成氢键"],["氨基酸侧链的筛选规律","偏好A、E、L、M；Pro缺酰胺氢且呈刚性五元环必破坏α-螺旋；相邻同电荷斥力或大支链亦干扰螺旋；3–4疏水/亲水交替造两亲性表面螺旋","β-折叠密集堆叠要求小侧链，丝心蛋白(-Gly-Ser-Gly-Ala-)ₙ富含Gly/Ala；I型β-转角第2位常为Pro，II型第3位常为Gly；无规卷曲常构成酶/活性功能位点"],["高阶组合：超二级结构与模体","αα、βαβ、ββ三种基础组合；常见DNA结合模体为α-螺旋-转角-α-螺旋（HTH）、亮氨酸拉链（疏水条带拉合）","EF手型(螺旋-环-螺旋结合Ca²⁺)、锌指结构(ββα配位Zn²⁺)、希腊回纹(Greek key)及β-三明治等具特异功能的特征性模体(motif)"]],"quiz":{"stem":"研究一种富含重复片段(-Gly-Ser-Gly-Ala-Gly-Ala-)ₙ的反平行β-折叠纤维蛋白（丝心蛋白）时，若通过基因工程把所有Gly和Ala定点突变为带正电的大侧链精氨酸(Arg)，同时在某球状蛋白跨膜α-螺旋中段插入一个脯氨酸(Pro)，两者最直接的结构后果分别是：","options":["丝心蛋白转变为更稳定的右手α-螺旋；α-螺旋中插入Pro将把螺距从0.54nm精确压缩为0.30nm","反平行β-折叠因片层间大侧链空间位阻与同电荷排斥而无法致密堆叠；α-螺旋中段因Pro环状刚性且缺乏N-H氢键供体而发生扭折中断","丝心蛋白因Arg形成额外主链i→i+4氢键而抗拉强度翻倍；Pro在第2位必然诱发平行式β-折叠","由于二级结构仅涉及主链骨架原子而不受侧链影响，两种突变均不会改变其局部主链构象"],"answer_idx":1,"explain":"二级结构主链虽不直接包含侧链，但侧链的空间位阻与电性决定“主链能否排得进去”：β-折叠上下堆叠需小侧链Gly/Ala（突变Arg立即撑裂片层）；Pro的亚氨基锁在五元环内且成肽后失去酰胺H，是著名的α-螺旋“破坏者”（却常出现在I型β-转角第2位）。","remedial_node_id":"biochem_peptide_plane_bioactive"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_tertiary_quaternary_folding","title":"三四级结构、结构域与分子伴侣折叠","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"三级结构靠疏水/盐键/氢键/范德华力(+二硫键)折叠单肽链与结构域；分子伴侣防错聚；四级结构需≥2个独立三级亚基非共价缔合。","source_slides":["生物化学-第一章 氨基酸与蛋白质-2.pdf#P9-P10,P34-P44"],"diagram_assets":[{"path":"assets/biochem_protein_tertiary_bonds_p35.webp","caption":"维系蛋白质三维构象的四类化学键：疏水相互作用与范德华力、氢键、二硫键(共价)及离子键(盐键)","source_page":35}],"payload":{"bullets":["三级结构定义与五大维系键：单条肽链全部主侧链原子的三维排布（亲水侧链朝外、疏水侧链埋入内部成核），主要靠{{疏水作用、离子键(盐桥)、氢键、范德华力}}等次级键维系，辅以链内二硫键。","结构域（Domain）：大分子蛋白内部常折出多个连续100–200残基的{{独立折叠与功能单位}}（如GAPDH亚基含1–146aa的{{NAD⁺辅酶结合域}}与147–333aa的{{3-磷酸甘油醛底物结合域}}）；用限制性蛋白酶切下后各结构域仍能维持构象与结合活性（超二级结构则不能）。","分子伴侣与伴侣蛋白护航折叠：{{分子伴侣}}(如Hsp70/DnaK单体70–100kDa、PDI二硫键异构酶、PPI肽脯氨酰顺反异构酶、SecB)可逆结合疏水暴露区防聚集、纠错二硫键；{{伴侣蛋白(Chaperonin)}}(800kDa寡聚体笼)隔绝外界并在水解{{ATP}}后释放正确折叠蛋白。","四级结构（Quaternary）的铁律：由{{2条及以上具完整三级结构的亚基(subunit)}}经非共价键（主要为{{氢键与离子键}}，如Hb靠8对盐键组装α₂β₂）缔合而成（同/异二聚体、寡聚体）。","纤维状 vs 球状蛋白与家族边界：纤维状蛋白（长/短轴\u003e10，如胶原、角蛋白、丝心蛋白）难溶主司结构支架；球状蛋白（\u003c10，如酶、Mb/Hb、抗体）水溶主司催化运输；序列与构象俱近为家族，序列低但共享功能模体（如锌指、PDZ）称超家族。"],"trap_note":"经典辨析陷阱：成熟牛胰岛素虽由A(21aa)与B(30aa)两条肽链构成，但两条链在胰岛素原切除C肽后由2对共价二硫键死锁，单链不具备独立完整三级结构，因此胰岛素【只有三级结构而无四级结构】！","quiz":{"stem":"用温和的限制性蛋白酶在铰链区切开3-磷酸甘油醛脱氢酶(GAPDH)单条亚基，并分离得到N端1–146aa与C端147–333aa两个独立片段。下列说法中符合“结构域(domain)”与“四级结构”定义的是：","options":["一旦肽链被蛋白酶切开，结构域就会像普通超二级结构一样瞬间完全解折叠丧失结合力","因为GAPDH每条亚基含两个结构域，所以一条独立的GAPDH亚基自身就已具备四级结构","N/C端结构域可各自独立结合底物，完整四级结构仍需多亚基非共价组装","N端与C端结构域之间主要依靠800 kDa的伴侣蛋白水解GTP才能维持一级肽键不断裂"],"answer_idx":2,"explain":"结构域是三级结构内部可独立折叠并执行局部功能的功能模块（限制性酶切分离后常保留原构象与结合能力，区别于超二级结构）；而四级结构必须由多条各自具备完整三级结构的独立亚基通过氢键/离子键缔合而成（如2×GAPDH或Hb α₂β₂）。","remedial_node_id":"biochem_protein_secondary_helix_sheet"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_mb_vs_hb_oxygen_binding","title":"肌红蛋白 vs 血红蛋白结构与氧解离曲线","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"Mb为单链三级蛋白(P50≈1mmHg双曲线，专司储氧)；Hb为α₂β₂四级结构(P50≈26mmHg S形曲线，适配肺吸组织卸)。","source_slides":["生物化学-第一章 氨基酸与蛋白质-2.pdf#P7,P36,P43","生物化学-第一章 氨基酸与蛋白质-3.pdf#P8-P17"],"payload":{"columns":["对比维度","肌红蛋白 (Myoglobin, Mb)","血红蛋白 (Hemoglobin, HbA)"],"rows":[["分子组成与结构层次","单一肽链153aa(含A-H 8段α-螺旋，占比\u003e75%)+1个血红素辅基；最高仅具三级结构","α₂β₂四聚体：2×α(141aa)+2×β(146aa)+4个血红素，亚基间靠8对盐键紧扣；具完整四级结构"],["血红素Fe²⁺配位方式","铁卟啉Fe²⁺ 6配位：4个吡咯环N + 近端组氨酸His93(F8)配位 + 1个O₂（远端His64(E7)与O₂成氢键稳氧防CO）","与Mb高度同源（对比细胞色素C：以CXXCH模体Cys形成共价硫醚键结合血红素；Mb/Hb则为非共价配位+丙酸侧链盐键）"],["氧解离曲线形态与P₅₀","双曲线（非协同独立结合）：P₅₀ ≈ 1 mmHg，极低氧分压下即迅速近100%饱和","S形曲线（正协同效应）：P₅₀ ≈ 26 mmHg，在肺泡(pO₂≈100)接近饱和而在组织(pO₂ 20–40)位于最陡卸氧坡段"],["生理功能分工与亚基演化","骨骼肌/心肌细胞内专职“储氧库”，仅在极度缺氧运动时释放储备氧","血液专职“运氧车”：肺部高效装氧、外周组织高效卸氧；发育期依次经历胚胎ζ₂ε₂→胎儿HbF(α₂γ₂)→成人HbA(α₂β₂)+HbA₂(α₂δ₂)"]],"quiz":{"stem":"假设人体通过基因替换让红细胞内不再表达血红蛋白四聚体(Hb)，而是以等摩尔浓度的高亲和力肌红蛋白单体(Mb，P₅₀ ≈ 1 mmHg)取而代之。当血液从肺毛细血管(pO₂=100 mmHg)流经安静骨骼肌毛细血管(pO₂=40 mmHg)时，会发生什么致命生理灾难？","options":["Mb由于缺乏四级结构，在肺部100 mmHg高氧分压下完全无法结合任何氧气","Mb会与血红素形成共价硫醚键导致Fe²⁺永久氧化为高铁血红蛋白","Mb在组织中P₅₀升高到100 mmHg以上，将二氧化碳逆向泵回红细胞","Mb在肺接近满饱和且到40 mmHg组织仍保持\u003e97%饱和而难卸氧"],"answer_idx":3,"explain":"如图3-P17氧解离曲线对照所示：Mb呈双曲线且P₅₀仅1 mmHg，在40 mmHg乃至20 mmHg处仍几乎全饱和，卸氧率极微；只有四聚体Hb的S形曲线(P₅₀≈26 mmHg)在20–40 mmHg处最陡峭，才能把近一半所载氧气高效卸载给组织。","remedial_node_id":"biochem_protein_tertiary_quaternary_folding"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_hb_allostery_bpg_bohr","title":"Hb变构：T↔R、2,3-BPG与波尔效应","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"O₂引Fe²⁺入环0.4Å牵动His F8并打破8对盐键实现15°旋转(T→R正协同)；2,3-BPG与波尔效应(H⁺)锁定T态右移曲线。","source_slides":["生物化学-第一章 氨基酸与蛋白质-3.pdf#P18-P29"],"diagram_assets":[{"path":"assets/biochem_protein_mb_hb_odc_p28.webp","caption":"Hb正协同T↔R构象转换、Mb vs Hb氧解离曲线对比，以及2,3-BPG(0/5/8 mmol/L)精准右移Hb氧解离曲线调节示意图","source_page":28}],"payload":{"steps":[{"cue":"机械触发：第1个O₂结合血红素铁，如何从原子级位移撬动整座四聚体T→R跃迁？","reveal":"脱氧T态亚基靠8对亚基间/内盐键（含α₁-α₂、α-β及β链内Asp94-His146）紧锁，第1亚基亲和力最小。O₂配位后Fe²⁺半径缩小，向卟啉环平面位移0.4 Å，牵拉近端His F8及F螺旋移动，连续打断8对盐键，驱动α₁β₁与α₂β₂二聚体相对旋转15°跃迁至松弛R态；末位亚基对O₂亲和力飙升至首亚基的约300倍（序变模型vs齐变模型）。","mechanism_tag":"Fe²⁺ 0.4Å→His F8→8盐键→15°(T→R)"},{"cue":"负向别构开关 2,3-BPG：糖酵解短支路产物如何只在低氧组织/高原发力促卸氧？","reveal":"红细胞糖酵解1,3-BPG支路生成的2,3-BPG带高密度负电荷，在R态下因中央空腔过窄而被排斥，唯独能楔入脱氧T态两β亚基之间与带正电残基(Lys82、His143、His2等)形成盐键，稳定T态并显著右移氧解离曲线。高原低氧时红细胞2,3-BPG由5升至8 mmol/L，肺高pO₂不受明显影响而外周组织卸氧激增。","mechanism_tag":"仅嵌β链T态中央腔 · 曲线右移"},{"cue":"波尔效应(Bohr)与胎儿HbF抢氧机制：H⁺/CO₂与γ亚基如何改写氧亲和力？","reveal":"① 波尔效应：代谢旺盛组织H⁺↑(pH↓)与CO₂↑，质子化β链His146使其与Asp94形成更稳的盐键（见图3-P23）从而锁定T态、右移曲线促卸氧；肺部排CO₂后逆转；② 胎儿HbF(α₂γ₂)用γ亚基取代β亚基（Ser替换His143），丧失2,3-BPG结合位点故曲线较母体HbA左移，确保氧气跨胎盘单向由母血(结合较松)流向胎儿(结合更紧)。","mechanism_tag":"β-His146盐键(波尔) · HbF抗BPG"}],"takeaway":"Hb四级构象是一台双向分子开关：O₂入Fe²⁺打破盐键推向R态（正协同“抓氧”）；2,3-BPG与H⁺/CO₂则各自靠嵌入β中央腔或质子化His146加固T态（异促别构“卸氧”），而HbF撤除BPG锚点实现胎盘抢氧。","quiz":{"stem":"临床抢救严重失血患者时，若大量输注已在血库冷藏保存数周、红细胞内2,3-BPG已近耗竭的陈旧库存血，受血者短期内反而可能出现“外周组织缺氧加重”的悖论（即使动脉血氧饱和度正常）。其分子机制是：","options":["缺2,3-BPG使T态失稳、氧解离曲线显著左移，组织毛细血管难卸氧","2,3-BPG耗竭使血红素Fe²⁺不可逆向外突出0.4Å并断裂F8配位键，无法在肺部结合O₂","库存血中β链已转化为γ链形成HbF，导致H⁺波尔效应过度右移","缺乏2,3-BPG使Hb四聚体解离为单链Mb，在40mmHg组织处瞬间过度放氧引起氧中毒"],"answer_idx":0,"explain":"如3-P26/P28曲线对比所示：2,3-BPG=0时Hb氧解离曲线大幅左移、O₂亲和力过强；库存血短期内2,3-BPG尚未通过红细胞糖酵解恢复，会导致血液经肺能吸足氧却在组织“吝啬不卸氧”。","remedial_node_id":"biochem_mb_vs_hb_oxygen_binding"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_molecular_vs_conformational_disease","title":"分子病(HbS) vs 构象病(PrP)","subject":"biochem","syllabus_refs":["syl_biochem_002"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"分子病(HbS)源于一级基因突变改写极性，构象病(PrP/AD)一级序列完全正常却由α-螺旋错折成β-折叠淀粉样沉淀。","source_slides":["生物化学-第一章 氨基酸与蛋白质-3.pdf#P4-P6,P30-P33"],"diagram_assets":[{"path":"assets/biochem_protein_hbs_sickle_p05.webp","caption":"镰刀形红细胞贫血致病三步链：β链第6位Glu→Val单点突变→脱氧态暴露疏水斑聚合成纤维→红细胞镰变栓塞溶血","source_page":5}],"payload":{"columns":["鉴别维度","分子病代表：镰刀形红细胞贫血 (HbS)","构象病代表：疯牛病 (PrP) / 神经退行性病"],"rows":[["一级结构(氨基酸序列)是否改变","改变（点突变）：DNA GAG→GTG，令Hb β链第6位亲水负电Glu突变为疏水Val（α₂S₂）","完全不变：朊病毒蛋白(PrP)编码基因与氨基酸序列均正常，本质是蛋白质折叠错误"],["致病构象转变触发机制","含氧R态时Val藏匿；一旦脱氧进入T态，表面暴露出“β6-Val疏水黏斑”并精准嵌入相邻HbS的疏水口袋","正常可溶、富含α-螺旋的PrPᶜ受错误模板PrPˢᶜ诱导，二聚化重折为富含β-折叠的PrPˢᶜ并连锁放大"],["聚集形态与病理结局","大量脱氧HbS首尾聚合为刚性绳索状长纤维，把红细胞机械拉弯成镰刀状，脆性↑易溶血并阻塞微血管","PrPˢᶜ溶解性极差且抗蛋白酶水解，聚集成淀粉样纤维沉淀毒害神经元（同类：阿尔茨海默病、亨廷顿病）"],["鉴别拓展与临床防线","另有苯丙酮尿症(PAH酶缺陷致苯丙氨酸及其酮酸蓄积，低Phe饮食干预)及多基因肌营养不良症","构象病非基因序列突变所致“分子病”，而是分子伴侣失衡/模板错误诱导下的二级α→β折叠灾难"]],"quiz":{"stem":"镰刀形红细胞贫血纯合子患者(HbS: α₂S₂)在动脉高氧环境中红细胞形态尚多呈圆盘状，但一旦血液流经低氧外周毛细血管或患者遭遇缺氧时却骤然发生大量细胞镰变与微血管危象；同时，用常规蛋白酶处理疯牛病脑组织淀粉样斑块却难以清除PrPˢᶜ。分别最准确解释这两种现象的是：","options":["高压氧会直接切开HbS的第6位缬氨酸肽键阻止聚合；PrPˢᶜ因发生了β6 Glu→Val突变而对蛋白酶彻底免疫","脱氧T态才暴露HbS β6-Val疏水黏斑聚合；PrPˢᶜ高β-折叠屏蔽酶切位点","动脉血pH较低使HbS带正电相互排斥；PrPˢᶜ是由游离氨基酸未经核糖体直接非α肽键合成","HbS的铁卟啉中Fe²⁺脱氧后化为Fe³⁺使细胞膜溶解；PrPᶜ由β-折叠转变为α-螺旋后溶解度下降"],"answer_idx":1,"explain":"如图3-P5与3-P32/33所示：β6-Val只有在HbS释放氧气转入脱氧T构象时才会暴露出匹配的疏水互补口袋，从而线性聚合成纤维使红细胞镰变；而PrPˢᶜ是在一级序列零改变下发生α-螺旋→致密β-折叠构象转换，形成不溶且抗蛋白水解酶的淀粉样纤维沉淀。","remedial_node_id":"biochem_hb_allostery_bpg_bohr"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_colloid_salting_out","title":"蛋白质两性电离、胶体双稳定因素与盐析","subject":"biochem","syllabus_refs":["syl_biochem_003","syl_biochem_001"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"1–100nm蛋白质胶体靠“表面同性电荷(pH≠pI)+亲水表面水化膜”稳定；盐析脱除双盾但不破构象；双缩脲测肽键。","source_slides":["生物化学-第一章 氨基酸与蛋白质-3.pdf#P35-P37,P44-P46,P48"],"diagram_assets":[{"path":"assets/biochem_protein_colloid_precip_p37.webp","caption":"蛋白质胶体稳定性双因素与聚沉机制：溶液酸碱(pH=pI)消除表面同性电荷，脱水作用剥离水化膜，双盾均失即聚沉析出","source_page":37}],"payload":{"bullets":["两性电离与净电荷规律：蛋白质除N/C末端外主要靠侧链可解离基团带电，存在特征等电点pI；血浆白蛋白pI≈4.7，在正常血浆pH 7.4下{{带大量净负电荷}}。","胶体直径与两大稳定因素：球状蛋白直径{{1–100 nm}}（不能透过半透膜，透析借此截留除盐），其稳定悬浮依赖①{{颗粒表面同性电荷斥力}}(pH≠pI)与②{{亲水基团吸引的水化膜}}(hydration shell)。","生理枢纽——血浆胶体渗透压：血浆白蛋白因低pI净负电吸引水化层且难以滤过毛细血管壁，构成了维持血管内外水分平衡的{{血浆胶体渗透压}}主力（低蛋白血症→水肿）。","盐析（Salting out）：高浓度中性盐如{{(NH₄)₂SO₄、Na₂SO₄或NaCl}}同时中和表面电荷并争夺水分子破坏水化膜，使蛋白在不破坏高级构象的前提下可逆析出（常作纯化第一步粗提）。","呈色与质谱外定量双法：① {{双缩脲反应(Biuret)}}：≥2个肽键在稀碱中与Cu²⁺呈紫红色，可追踪{{蛋白质水解程度}}（彻底水解成游离AA则转阴性）；② 紫外280 nm（Trp/Tyr）及水解后茚三酮570 nm。"],"trap_note":"高浓度硫酸铵“盐析”同时撤去了电荷与水化膜两道防线但**完全保留三维天然构象**，加水稀释或透析脱盐即可复溶且酶活不失；此外“双缩脲反应”测的是肽键而非游离氨基酸，因此蛋白质越被胰蛋白酶切碎至游离氨基酸，双缩脲显色越弱而茚三酮显色越强。","quiz":{"stem":"肾病综合征患者因肾小球滤过膜受损每日丢失大量血浆白蛋白(pI≈4.7)导致严重全身水肿；同时实验室拟用胰蛋白酶监控某纯化蛋白是否已彻底水解为游离氨基酸。下列判断与选法最精准的是：","options":["白蛋白在血液pH 7.4下刚好处于等电点不带电，丢失后因水化膜过厚堵塞淋巴管引发水肿；监测彻底水解只需看A₂₈₀彻底归零","血液中白蛋白直径\u003c1 nm极易自由穿透毛细血管；双缩脲反应专门只与游离α-氨基酸显紫红色","白蛋白减少导致血浆胶体渗透压骤降而水肿；完全水解终点看双缩脲转阴且茚三酮达峰","水肿是因为血浆中性盐浓度升高导致白蛋白发生不可逆盐析凝块沉积于肺泡"],"answer_idx":2,"explain":"血浆白蛋白作为1–100nm带负电亲水胶体是维持血浆胶体渗透压的绝对主力，丢失后毛细血管重吸收水分能力塌陷引发Starling水肿；而双缩脲反应需要完整多肽/蛋白中的肽键与Cu²⁺络合，彻底水解为游离氨基酸后双缩脲反应消失（同时游离α-氨基剧增令茚三酮570nm显色最强），A₂₈₀因游离Trp/Tyr仍在而不归零！","remedial_node_id":"biochem_aa_properties_reactions"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_denaturation_coagulation","title":"蛋白质盐析、可逆变性复性与凝固鉴别","subject":"biochem","syllabus_refs":["syl_biochem_003"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"变性破坏非共价键及二硫键而保留一级结构；沉淀不一定变性(如盐析)，变性后加热凝成坚固凝块则成不可逆凝固。","source_slides":["生物化学-第一章 氨基酸与蛋白质-3.pdf#P38-P44","第2章酶-20260915.pptx#P27,P122,P124,P126"],"payload":{"columns":["理化过程","化学键与构象变化本质","溶解度/活性与可逆性","医学与实验应用"],"rows":[["盐析 (Salting out)","中性盐(NH₄)₂SO₄等仅中和电荷并夺走水化膜，高级构象与肽键均完整","蛋白析出沉淀但无变性；透析/稀释去盐后可复溶并完全保留生物活性","蛋白质纯化的第一步粗提分级沉淀"],["变性 (Denaturation) 与 复性","物理(热/UV/超声)或化学(强酸碱/重金属/尿素/乙醇)破坏非共价键及二硫键，有序→无序，但一级序列完整","生物活性丧失，疏水基外露易聚沉；温和轻度变性去除诱因后可复性(如RNase A)","75%乙醇/高压蒸汽/重金属消毒灭菌；疫苗等蛋白制剂须防热/震荡变性"],["沉淀 (Precipitation)","表面电荷与水化膜失稳导致聚沉（可由变性疏水暴露引起，也可由温和脱水剂引起）","“变性蛋白易沉淀，但沉淀未必变性”：如低温乙醇/丙酮或盐析沉淀可保活性","调节pH至pI或配合低温有机溶剂分级收集活性蛋白"],["凝固 (Coagulation)","变性产生的絮状蛋白经进一步加热，伸展肽链高度交联缠结成致密网架","彻底不可逆：变成坚固凝块，即使加入强酸、强碱亦极难再溶解","临床尿蛋白加热乙酸法凝固鉴别；高温致不可逆组织细胞损伤"]],"quiz":{"stem":"生物化学实验课上，某同学欲从血清中提取仍有催化活性的免疫球蛋白与血清酶，设计并对比了三份样本处理：① 加饱和硫酸铵(4℃)；② 加75%乙醇并煮沸10分钟；③ 加0.1 mol/L CuSO₄重金属盐后立即透析。以下关于三组样本复溶后生物活性的判断正确的是：","options":["三组均为沉淀过程且均未断裂一级肽键，因此透析去除试剂后三组活性均能100%恢复","②号因乙醇能温和脱去水化膜故最适合纯化活性酶，①号硫酸铵则会直接水解肽键","①号组在离心后已破坏全部疏水键和二硫键，必须再加尿素才能使蛋白质凝固激活","仅①组盐析透析去盐可复溶保活；②组已热凝固、③组重金属变性极难复性"],"answer_idx":3,"explain":"盐析脱除表面电荷与水化膜但完整保护蛋白质空间构象（可逆沉淀不变性），广泛用于活性蛋白粗提；沸水煮沸变性絮凝成不可逆凝固块；重金属离子紧扣负电羧基/巯基造成重度变性使活性不可逆或极难恢复。","remedial_node_id":"biochem_protein_colloid_salting_out"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_purification_separation","title":"【拓展】蛋白纯化：层析、超速离心与电泳","subject":"biochem","syllabus_refs":["syl_biochem_004"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"纯化须避变性（盐析开局、透析收尾）；分子筛大先出，离子交换高盐洗脱，SDS-PAGE变性按分子量分离只适分离不适纯化。","source_slides":["生物化学-第一章 氨基酸与蛋白质-3.pdf#P48-P58"],"diagram_assets":[{"path":"assets/biochem_protein_gel_filtration_p50.webp","caption":"凝胶过滤(分子筛)层析原理：大分子被凝胶珠孔隙排阻沿珠间通道快速洗脱，小分子渗入微孔滞后洗脱","source_page":50}],"payload":{"columns":["分离/纯化技术","物理依据与核心参数","出峰/泳动顺序规律","保活纯化 vs 仅作分析"],"rows":[["盐析 \u0026 透析 (Dialysis)","溶解度(盐析去电荷/水化膜) vs 1–100nm半透膜分子大小截留","盐析作第一步粗提；透析去小分子盐/浓缩常作最后一步","温和保活（纯化核心原则：尽量避免蛋白变性）"],["凝胶过滤 / 分子筛层析","多孔凝胶珠孔径按分子有效半径/分子量分配","大分子无法入孔被排阻而“先洗脱”；小分子进孔路径长而“后洗脱”","温和保活，既可纯化也可测相对分子量"],["离子交换层析 \u0026 亲和层析","净电荷(取决于溶液pH vs 蛋白pI) vs 受体-配体特异亲和力","离子交换：无绑定/弱带电者低盐先流，强吸附者须升高NaCl浓度洗脱","温和保活，亲和层析一步纯化倍数最高"],["超速离心 (≥500,000 g)","沉降系数 S=v/(ω²r) (1S=10⁻¹³s) 与密度梯度(蔗糖/CsCl)","密度/分子量越大、越致密者沉降越快，停留在等密度梯度带","温和保活，分选亚细胞器与蛋白复合体"],["非变性电泳 vs SDS-PAGE / 双向电泳","Fe=qE(pH≠pI)；SDS(12C阴离子去污剂)使蛋白变性且荷质比均一；双向=IEF(pH梯度定pI)×SDS-PAGE(定MW)","SDS-PAGE严格按分子量从小到大向下泳动（小分子走得快），配合抗体免疫印迹(Western)特异鉴带","SDS-PAGE破坏空间结构，“只适合分离鉴定，不适合活性纯化”"]],"quiz":{"stem":"混合物中含两种球状蛋白：蛋白A（MW=120 kDa，pI=4.5）与蛋白B（MW=20 kDa，pI=9.0），现用pH=7.0的缓冲液分别进行以下三项分离实验：① 凝胶过滤层析；② 阴离子交换层析（固定相带正电荷，逐步升高NaCl洗脱）；③ 还原型SDS-PAGE电泳。各实验中“先出来”或“跑得更快”的蛋白顺序依次是：","options":["①分子筛：B先洗脱；②阴离子交换：A先流穿；③SDS-PAGE：A泳动更快","①分子筛：A先洗脱；②阴离子交换：B先流穿（A需高盐后洗脱）；③SDS-PAGE：B泳动更快靠近正极底端","①分子筛：A先洗脱；②阴离子交换：A因分子量更大无法结合树脂先流穿；③SDS-PAGE：因电荷相同A与B停在同一条带","①分子筛：同时出峰；②阴离子交换：pH=7.0时B带负电吸附最牢；③SDS-PAGE：A因120kDa受力大跑在B前面"],"answer_idx":1,"explain":"三技术物理机制截然不同：① 分子筛看体积：大分子A(120 kDa)被凝胶珠排阻走捷径先洗脱；② pH 7.0时A(pI 4.5\u003c7)带净负电牢牢吸在带正电阴离子交换柱上，B(pI 9.0\u003e7)带净正电不受吸附随低盐先流出；③ SDS把A和B均变性包上均一负电荷，凝胶筛分仅看分子量，小分子B(20 kDa)泳动远快于A！","remedial_node_id":"biochem_protein_colloid_salting_out"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_protein_structure_sequencing_methods","title":"【拓展】蛋白测序(Edman)与空间测定原理","subject":"biochem","syllabus_refs":["syl_biochem_004"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"一级测序靠Edman降解核心与质谱（已知蛋白直接由DNA推演）；CD测二级结构；X射线/NMR/冷冻电镜/AlphaFold析三维。","source_slides":["生物化学-第一章 氨基酸与蛋白质-1.pdf#P6","生物化学-第一章 氨基酸与蛋白质-3.pdf#P59-P61"],"payload":{"bullets":["一级序列测定双路径：1955年Sanger完成牛胰岛素测序后，经典化学法演进为从N-端逐个剥离鉴定的{{Edman降解法}}（现今常以{{气相色谱/液相色谱串联质谱}}联用，底层裂解逻辑仍源自Edman）；若基因序列已知，则可直接由{{DNA/cDNA碱基序列}}依密码子推演。","二级结构光学指纹：{{圆二色光谱法(CD)}}利用光学活性肽链对左旋与右旋圆偏振光吸收系数不等({{εL ≠ εR}})的特征，快速测定溶液中α-螺旋与β-折叠相对比例。","三大经典三维结构解析术比较：{{X射线晶体衍射}}需先制备高纯度蛋白晶体；{{核磁共振(NMR)}}可在接近生理的液相环境中解析构象（受限于分子量不宜过大）；{{冷冻电镜(Cryo-EM)}}无需结晶即可高分辨率快速解析超大蛋白复合物的相对天然状态。","结构生物学新纪元：在X射线衍射(Pauling发现α-螺旋、Kendrew/Perutz解析Mb/Hb)与冷冻电镜基础上，人工智能({{AlphaFold}})实现了从一级氨基酸序列高精度预测三维折叠构象。"],"trap_note":"不要将电泳（SDS-PAGE仅估测分子量）、圆二色谱（仅评估α/β二级结构含量百分比）与原子级三维坐标解析混淆；膜蛋白复合物极难长出单晶且分子量巨大超出常规NMR上限，现代结构生物学首选冷冻电镜(Cryo-EM)。","quiz":{"stem":"研究团队发现一种分子量高达650 kDa的跨膜离子通道蛋白复合物，因含有大量疏水跨膜区极难培养出高质量单晶，但希望在不结晶、尽量接近天然水合构象的条件下直接解析其原子级三维结构，同时还想先验证其溶液二级结构中α-螺旋是否随pH变化而发生解旋。最恰当的方法组合是：","options":["冷冻电镜(Cryo-EM)解析近天然三维高分辨率结构 + 圆二色光谱法(CD)监测溶液α-螺旋含量变化","X射线衍射(无需结晶)解析三维结构 + SDS-PAGE精确测定其三维氢键夹角","Edman降解测序直接输出三维晶体坐标 + 凝胶过滤层析检测εL与εR吸收差","核磁共振(NMR)直接解析650 kDa非同位素标记复合物 + 茚三酮显色测定α-螺旋螺距"],"answer_idx":0,"explain":"X射线衍射硬性依赖蛋白单晶，常规液相NMR难以解析650 kDa超大膜蛋白复合物，故Cryo-EM是无需结晶且近天然高分辨率解析大复合物三维结构的首选；而溶液二级结构比例变化则由圆二色光谱(CD)依据εL≠εR精准追踪。","remedial_node_id":"biochem_protein_primary_anfinsen"}},"added_at":"2026-11-17T08:21:50+08:00"},{"id":"biochem_enzyme_cofactors_vitamins","title":"酶分子组成、辅因子与B族维生素衍生","subject":"biochem","syllabus_refs":["syl_biochem_005"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"结合酶由酶蛋白(定专一性)与辅因子(定反应类型)组成全酶；B族维生素衍生物构成多数有机辅酶/辅基。","source_slides":["第2章酶-20260915.pptx#P3,P8-P11,P28-P46"],"payload":{"bullets":["生物催化剂本质与结构层次：绝大多数酶是蛋白质（分{{单体酶、寡聚酶、多酶体系[如PDH]及多功能串联酶[如脂肪酸合酶]}}），少数催化RNA称{{核酶(ribozyme)}}。","单纯酶 vs 结合酶分工：单纯酶仅含氨基酸（如胃蛋白酶）；结合酶由{{酶蛋白}}（决定底物特异性）与{{辅因子}}（决定反应类型，递电子/氢/基团）组成{{全酶}}才具活性。","辅酶 vs 辅基及金属离子：{{辅酶}}与酶蛋白非共价疏松结合（{{透析/超滤可除去}}），{{辅基}}紧密共价结合不可透析；金属酶紧锁金属离子参与中心，金属激活酶仅松散激活。","氧化还原与酰基/醛基辅因子：Vit B1→{{TPP}}（转醛基）；Vit B2→{{FMN/FAD}}（递氢）；Vit PP→{{NAD⁺/NADP⁺}}（递氢递电子）；泛酸→{{CoA}}与硫辛酸（转酰基）。","氨基/羧基/一碳载体：Vit B6→{{磷酸吡哆醛(PLP)}}（转氨/脱羧）；生物素共价结合Lys ε-氨基（{{羧基载体}}）；叶酸→{{四氢叶酸(FH₄)}}（一碳载体）；Vit B12→甲基/变位载体。"],"trap_note":"经典辨析：维生素在体内多作为前体转化为辅酶/辅基（如生物素自身直接共价做辅基）；单靠透析只能去除疏松结合的辅酶与松散金属离子，无法剥离共价结合的辅基。","quiz":{"stem":"将某结合酶溶液放入半透膜袋中充分透析后，再加入足量底物时催化活性完全丧失；若把外液煮沸浓缩后加回袋内，酶活迅速恢复。该实验证明此前透析失活的本质是：","options":["透析促使酶蛋白高级结构不可逆变性并聚沉","疏松结合的耐热有机辅酶被透出且去辅酶后无活性","与酶蛋白共价结合的辅基在常温下发生水解断裂","酶蛋白在膜内自发降解为无活性的单链多肽片段"],"answer_idx":1,"explain":"结合酶只有酶蛋白与辅因子结合成全酶才有催化活性。该辅因子结合疏松能透过半透膜且煮沸后加回仍能复活，说明它是耐热的小分子有机辅酶（非不耐热的酶蛋白，也不是透析不出的共价辅基）。","remedial_node_id":"biochem_protein_tertiary_quaternary_folding"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_active_center_es","title":"酶活性中心分工、必需基团与ES诱导契合","subject":"biochem","syllabus_refs":["syl_biochem_005"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"活性中心是三级折叠形成的疏水裂隙，由结合基团定专一性、催化基团促转化，与底物经诱导契合形成ES。","source_slides":["第2章酶-20260915.pptx#P47-P53,P80,P100"],"payload":{"bullets":["活性中心三维定位：酶分子表面由一级序列相距甚远、经空间折叠聚拢的必需基团构成{{疏水裂隙或凹陷}}（如溶菌酶裂隙容纳6个单糖基），形成利于脱溶剂化的局部微环境。","活性中心内必需基团分工：{{结合基团}}负责识别结合底物（决定酶的{{专一性}}）；{{催化基团}}直接打断/形成化学键将底物转为产物（决定酶促反应的{{性质}}）。","常见必需基团与中心外基团：常见催化必需基团包括{{Ser-OH、His-咪唑基、Cys-SH及Asp/Glu-COOH}}；位于活性中心{{以外的必需基团}}负责维持三维构象稳定或结合调节剂。","中间产物与诱导契合：酶先与底物形成不稳定中间复合物{{ES}}（E+S ⇌ ES → E+P）；结合时酶与底物靠近定向并{{相互诱导构象变形}}，达成精确契合后催化反应并释放产物。"],"trap_note":"易混防错：并非所有必需基团都在活性中心内！活性中心外的必需基团虽不直接接触底物，但一旦被修饰或破坏仍会引发活性中心塌陷而失活。","quiz":{"stem":"研究胰蛋白酶结构时分别做两组单点突变：① 将口袋底的结合基团 Asp189 突变为电中性的 Ser；② 将催化三联体中的 His57 突变为 Ala。下列对两组突变后果的判断正确的是：","options":["①号主要破坏酸碱质子转移能力，②号主要丧失对正电赖氨酸的识别","两组突变均会立刻使胰蛋白酶的一级序列肽键彻底断裂","①号使底物专一结合力骤降，②号使催化转化步骤停滞","①号和②号都只改变活性中心外部调节位点而不影响ES转化"],"answer_idx":2,"explain":"结合基团（如胰蛋白酶 Asp189 负电羧基）决定底物识别与专一性，突变后底物难结合；催化基团（如 His57 咪唑基）执行质子转移催化肽键水解，突变后虽仍可能微弱结合却无法完成催化反应。","remedial_node_id":"biochem_enzyme_cofactors_vitamins"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_specificity_kinetics_factors","title":"酶的三大特异性与温度/pH/[E]双效应","subject":"biochem","syllabus_refs":["syl_biochem_006"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"酶具绝对/相对/立体三种特异性；温度与pH呈双效应调节（非特征常数），底物饱和时速率与[E]成正比。","source_slides":["第2章酶-20260915.pptx#P16-P23,P118-P125,P151"],"diagram_assets":[{"path":"assets/biochem_enzyme_specificity_pocket_p20.webp","caption":"胰蛋白酶(Asp189负电袋)、胰凝乳蛋白酶(Ser189疏水袋)与弹性蛋白酶(Val216/190浅袋)决定底物专一性","source_page":20}],"payload":{"bullets":["三大特异性（由结合基团构象决定）：{{绝对专一性}}仅作用于一种底物（脲酶只水解尿素、不水甲基脲）；{{相对专一性}}作用于一类键或基团（脂肪酶、胰蛋白酶/胰凝乳蛋白酶切不同肽键）。","立体结构专一性：作用于旋光或几何异构体之一，如{{L-精氨酸酶}}仅催化L-精氨酸（不催化D型），{{延胡索酸酶}}仅加水水解反丁烯二酸（不作用于顺丁烯二酸）。","温度双重效应：低温仅降低碰撞速率但不使酶变性（回温后{{活性可恢复}}）；升温先加速碰撞，超过{{最适温度}}（动物酶多约37℃）后热变性占主导使活性骤降。","pH双重效应：pH改变酶活性中心基团与底物的{{解离状态}}（胃蛋白酶最适pH约1.5–2，胆碱酯酶约8–10）；过酸过碱致变性失活，最适pH亦为{{最稳定pH}}。","酶浓度与激活剂：[S]≫[E]饱和时反应速率与[E]成{{正比}}（V=k₃[E]）；必需激活剂（如{{Mg²⁺}}于己糖激酶）不可或缺，非必需激活剂（如Cl⁻于唾液淀粉酶）仅提速。"],"trap_note":"高频考点陷阱：最适温度与最适pH都【不是】酶的特征性常数！它们受底物浓度、缓冲液种类及酶纯度等测定条件影响，唯有 Km 是特征常数。","quiz":{"stem":"将两份相同的唾液淀粉酶溶液分别作如下处理：甲组置于 0℃ 冰浴 2 小时后恢复至 37℃，乙组置于 80℃ 水浴 10 分钟后冷却至 37℃。测定两组在 37℃、pH 6.8 下的酶活力，结果应为：","options":["甲组与乙组均因破坏肽键一级结构而永久失活","甲组和乙组在回到37℃后均可完全恢复催化活性","甲组因低温凝固完全失活，乙组因解折叠而活化","甲组可恢复原有活性，乙组因热变性而不可逆失活"],"answer_idx":3,"explain":"低温仅抑制分子热运动与碰撞速率而不破坏酶的空间构象（故低温保存酶制剂后复温即可恢复活力）；80℃高温远超酶最适温度，破坏维系三级结构的非共价键致蛋白变性甚至凝固，冷却后无法复活。","remedial_node_id":"biochem_protein_denaturation_coagulation"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_michaelis_km_vmax","title":"米氏方程推导逻辑与 Km/Vmax 物理意义","subject":"biochem","syllabus_refs":["syl_biochem_005"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"稳态米氏方程呈矩形双曲线：Km为V=1/2Vmax时的[S]且与[E]无关，Vmax=k₃[E]正比于酶量。","source_slides":["第2章酶-20260915.pptx#P93-P115"],"diagram_assets":[{"path":"assets/biochem_enzyme_km_affinity_p112.webp","caption":"米氏常数 Km 判别最适天然底物：Km 愈小（曲线左陡），达到 1/2 Vmax 所需 [S] 愈低、对浓度波动愈灵敏","source_page":112}],"payload":{"steps":[{"cue":"矩形双曲线三区段：随底物浓度 [S] 升高，初速率 V₀ 为何先线性上升后趋于平台？","reveal":"测定单底物初速率([S]≫[E]且逆反应可略)时：[S]≪Km 呈一级反应(V与[S]成正比)；[S]升高呈混合级；[S]≫Km 时酶活性中心被彻底饱和呈零级反应，速率逼近 Vmax。","mechanism_tag":"一级 → 混合级 → 零级饱和"},{"cue":"稳态假设与 Km 的真实含义：何时 Km 才能代表酶对底物亲和力的倒数？","reveal":"由 d[ES]/dt=0 得 Km=(k₂+k₃)/k₁，数值等于 V=Vmax/2 时的 [S](mol/L)。Km 是酶的特征常数(与[E]无关)；仅当 k₂≫k₃ 时 Km≈Ks 才反比于亲和力，用以判别天然最适底物(Km最小)及同工酶。","mechanism_tag":"Km=(k₂+k₃)/k₁ · k₂≫k₃时表亲和"},{"cue":"Vmax 与转换数 k₃：酶浓度加倍时，Km 和 Vmax 各自怎么变？","reveal":"Vmax=k₃[E] 与酶浓度成正比（非酶特征常数，[E]加倍则Vmax加倍而Km不变）；转换数 k₃=Vmax/[E](s⁻¹) 表征单个活性中心每秒最大催化底物分子数（如过氧化氢酶 4×10⁷ s⁻¹）。","mechanism_tag":"Vmax=k₃[E] · 转换数 k₃"}],"takeaway":"记住参数反差：Km 仅取决于酶/底物结构与反应微环境而与 [E] 无关；Vmax 随 [E] 等比例放大；作图判定天然底物选 Km 最小（左陡）者。","quiz":{"stem":"某生化实验测得纯化酶 E 对底物 S 的 Km=0.2 mmol/L、Vmax=100 μmol/min。若保持 pH、温度和体积不变，仅把体系中的酶量 [E] 精确稀释为原来的 1/2，则新体系的动力学参数为：","options":["Km 仍为 0.2 mmol/L，Vmax 降为 50 μmol/min","Km 降为 0.1 mmol/L，Vmax 保持 100 μmol/min","Km 升为 0.4 mmol/L，Vmax 降为 50 μmol/min","Km 仍为 0.2 mmol/L，Vmax 保持 100 μmol/min"],"answer_idx":0,"explain":"Km 是酶的特征性常数，只与酶结构、底物结构及温度/pH/离子强度有关，与酶浓度 [E] 无关；而 Vmax = k₃[E]，当 [E] 减半时 Vmax 随之减半。","remedial_node_id":"biochem_enzyme_active_center_es"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_competitive_inhibition","title":"竞争性抑制动力学特征与磺胺/他汀实战","subject":"biochem","syllabus_refs":["syl_biochem_005"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"竞争性抑制剂与底物结构相似抢占活性中心：表观Km增大、Vmax不变，提高[S]可解除抑制（磺胺/丙二酸/他汀）。","source_slides":["第2章酶-20260915.pptx#P137-P142,P187,P201","脂质代谢-2026.pdf#P180"],"diagram_assets":[{"path":"assets/biochem_enzyme_competitive_lb_p138.webp","caption":"竞争性抑制 Lineweaver-Burk 双倒数图：纵截距 1/Vmax 不变，斜率增大，横截距 -1/Km' 向右增大","source_page":138}],"payload":{"steps":[{"cue":"位点抢占本质：抑制剂 I 为何既要“长得像底物”，又只能与游离酶 E 结合？","reveal":"竞争性抑制剂结构与底物高度相似，能可逆进入同一活性中心形成无效 EI，与 S 互斥竞争。抑制程度取决于 [I]/[S] 比值与解离常数 Ki，故大量增加 [S] 可将 I 挤出活性中心恢复催化。","mechanism_tag":"结构相似 · 互斥抢活性中心"},{"cue":"双倒数坐标指纹：竞争性抑制的直线在 Lineweaver-Burk 图上如何旋转？","reveal":"当 [S]→∞ 时底物彻底夺回全部酶分子，故 Vmax 不变（纵截距 1/Vmax 共交一点）；但达到 Vmax/2 需更高 [S]，故表观 Km'=Km(1+[I]/Ki) 增大，斜率升高，横截距 -1/Km' 右移趋向 0。","mechanism_tag":"Vmax不变 · 表观Km增大"},{"cue":"三大医学生化经典：磺胺为何能专杀细菌却不毒害人体细胞叶酸代谢？","reveal":"① 磺胺类结构似对氨基苯甲酸(PABA)，竞争细菌二氢叶酸合成酶阻断合成；人直接摄取食物叶酸无此酶故免疫；② 丙二酸竞争抑制 TCA 琥珀酸脱氢酶；③ 他汀类竞争抑制胆固醇合成限速酶 HMG-CoA 还原酶。","mechanism_tag":"磺胺(PABA) · 丙二酸 · 他汀"}],"takeaway":"抓住“共交纵轴 1/Vmax 不变、提高 [S] 可逆转、表观 Km 增大”三句话，即可秒判竞争性抑制并解释坏死组织 PABA 拮抗磺胺抑菌。","quiz":{"stem":"临床用磺胺类药物治疗化脓性细菌感染时，常须彻底清创引流脓液；否则伤口大量组织坏死释放的对氨基苯甲酸(PABA)会令磺胺抑菌疗效显著下降。这一现象最根本的酶动力学机制是：","options":["PABA 直接共价修饰二氢叶酸合成酶使磺胺永久失活","PABA 升高令 [I]/[S] 降低，竞争挤出磺胺恢复催化","PABA 与酶-磺胺复合物结合促使酶蛋白热凝固失活","坏死脓液激活人体细胞二氢叶酸合成酶旁路代偿"],"answer_idx":1,"explain":"磺胺与 PABA 结构相似，两者竞争细菌二氢叶酸合成酶活性中心。坏死组织释放高浓度底物 PABA 降低了 [I]/[S] 比例，把磺胺从活性中心挤出从而削弱其竞争性抑制效应（这也是为何局部麻醉药普鲁卡因代谢产 PABA 不宜与磺胺联用）。","remedial_node_id":"biochem_enzyme_michaelis_km_vmax"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_reversible_inhibitions_matrix","title":"三种可逆抑制动力学、位点与双倒数鉴别","subject":"biochem","syllabus_refs":["syl_biochem_006"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"竞争性交纵轴(Km↑Vmax不变)、非竞争性交横轴(Km不变Vmax↓)、反竞争性呈平行线(Km↓Vmax↓)。","source_slides":["第2章酶-20260915.pptx#P136-P150"],"diagram_assets":[{"path":"assets/biochem_enzyme_reversible_inhib_table_p150.webp","caption":"三种可逆性抑制作用结合部位、表观 Km/Vmax 及 Lineweaver-Burk 截距斜率对比总表","source_page":150}],"payload":{"columns":["对比维度","竞争性抑制","非竞争性抑制","反竞争性抑制"],"rows":[["结合部位与复合物","活性中心；仅结合游离酶 E→EI","活性中心外必需基团；均等结合 E 与 ES(EI/ESI)","非活性中心；仅结合 ES 复合物→ESI"],["表观 Km 与 Vmax","Km 增大 · Vmax 不变","Km 不变 · Vmax 降低","Km 与 Vmax 同比例减小"],["双倒数交点与斜率","交于纵轴(1/Vmax) · 斜率增大 · 横截距右移","交于横轴(-1/Km) · 纵截距与斜率均增大","一组平行线(斜率 Km/Vmax 不变) · 横截距左移"],["高[S]能否解除及实例","提高[S]可解除；丙二酸、磺胺类、他汀类","提高[S]不能解除；哇巴因(抑Na⁺-K⁺泵)、亮氨酸(抑精氨酸酶)","高[S]产生更多ES反加重抑制；多见于双底物酶促"]],"quiz":{"stem":"向某酶促反应体系加入抑制剂 X 后，测得其 Lineweaver-Burk 双倒数曲线相对无抑制剂对照表现为：纵轴截距增大一倍，斜率保持完全不变（两线平行），横轴截距相应向左移动。抑制剂 X 的结合对象与动力学类型是：","options":["仅与游离酶 E 竞争活性中心，属竞争性抑制","等亲和力结合 E 与 ES，属非竞争性抑制","仅与酶-底物复合物 ES 结合，属反竞争性抑制","共价修饰活性中心 Ser-OH，属不可逆抑制"],"answer_idx":2,"explain":"反竞争性抑制剂只结合 ES 生成不能解离产物的 ESI，导致表观 Vmax 与表观 Km 按相同因子 (1+[I]/Ki) 同步缩小；因此在双倒数图上斜率 Km'/Vmax' = Km/Vmax 保持不变，呈现一组平行直线，且横截距 -1/Km' 向左减小、纵截距 1/Vmax' 增大。","remedial_node_id":"biochem_enzyme_competitive_inhibition"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_irreversible_inhibition_toxins","title":"不可逆抑制 vs 可逆抑制及解毒靶点","subject":"biochem","syllabus_refs":["syl_biochem_006"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"不可逆抑制剂以共价键锁死必需基团(透析不可除)，有机磷杀羟基酶(解磷定复活)、重金属/砷杀巯基酶(BAL解毒)。","source_slides":["第2章酶-20260915.pptx#P126-P136"],"payload":{"columns":["抑制机制类型","化学本质与可逆性","典型毒物与受损必需基团","靶向急救与复能原理"],"rows":[["可逆抑制 vs 酶变性","非共价可逆结合(透析可恢复)；抑制有选择性，变性无选择性","竞争/非竞争/反竞争调节剂；酸碱热重金属致构象破坏","降低抑制剂浓度或追加高[S](仅竞争性)即可恢复"],["有机磷共价抑制羟基酶","不可逆共价磷酰化活性中心；透析/超滤无法去除","敌百虫/敌敌畏/沙林共价结合 AChE 活性中心 Ser-OH","解磷定夺取磷酰基复活 AChE + 阿托品阻断过剩ACh受体"],["重金属/砷抑制巯基酶","共价结合巯基成硫醇盐/环状螯合物；不可透析恢复","Hg²⁺/Pb²⁺/Ag⁺及路易士气/As³⁺锁死 Cys-SH 或双硫辛酸","二巯基丙醇(BAL)富含双-SH 强力夺取毒物并释出酶活性"]],"quiz":{"stem":"某农户误服大量敌敌畏有机磷农药中毒入院，急诊对中毒血液透析仅能清除游离未结合毒物，却无法直接使已被抑制的红细胞胆碱酯酶(AChE)复活。此时静脉使用解磷定复能的根本机制是：","options":["解磷定非共价竞争取代突触间隙的乙酰胆碱结合M受体","解磷定靠二巯基螯合有机磷中的重金属砷核排出体外","解磷定通过高压透析把变性凝固的胆碱酯酶重新折叠","解磷定亲核夺取Ser-OH上的磷酰基使羟基酶恢复活性"],"answer_idx":3,"explain":"有机磷化合物与 AChE 活性中心催化基团 Ser-OH 形成稳定的共价磷酰化酶，故透析等物理分离手段无效；肟类胆碱酯酶复活剂（解磷定）能夺取该磷酰基形成无毒复合物排出，从而重新解放 Ser-OH（需配合阿托品阻断已蓄积 ACh 对 M 受体的过度兴奋）。","remedial_node_id":"biochem_enzyme_reversible_inhibitions_matrix"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_allosteric_regulation","title":"酶活性的别构调节、协同效应与S形曲线","subject":"biochem","syllabus_refs":["syl_biochem_006"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"代谢物可逆结合多亚基别构酶调节部位诱发T↔R构象协同跃迁；曲线呈S形，激活左移、抑制右移。","source_slides":["第2章酶-20260915.pptx#P156-P163"],"diagram_assets":[{"path":"assets/biochem_enzyme_allosteric_scurve_p161.webp","caption":"别构酶正协同 S 形动力学曲线与别构激活左移(趋双曲线)/别构抑制右移调节曲线","source_page":161}],"payload":{"steps":[{"cue":"别构结合位点：为何体内代谢终产物结构与底物毫不相似，却能快速反向刹住途径限速酶？","reveal":"别构效应剂（结构常异于底物）非共价可逆结合活性中心外的别构调节部位，经亚基构象传递实现低亲和力 T 态与高亲和力 R 态切换；别构酶常含偶数多亚基（分催化亚基与调节亚基）。","mechanism_tag":"非共价别构部位 · T↔R跃迁"},{"cue":"
