<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MedGraph Flow · 复旦基础医学碎片图谱</title>
  <link rel="manifest" href="./manifest.json">
  <style>:root {
  color-scheme: light;
  --bg: #f4f7f8;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --line: #e2e8f0;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --rose: #e11d48;
  --rose-soft: #ffe4e6;
  --emerald: #059669;
  --emerald-soft: #d1fae5;
  --shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.55;
}

.hidden { display: none !important; }

.app-shell {
  min-height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 14px 10px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--teal);
  flex: none;
}

.brand-title {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.01em;
}

.mode-pill {
  border: 1px solid #99f6e4;
  background: #f0fdfa;
  color: var(--teal);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
  cursor: pointer;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 10px;
  padding: 5px 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.icon-btn:active { transform: scale(0.97); }

.detour-banner {
  position: sticky;
  top: 49px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  background: #fffbeb;
  border-bottom: 1px solid #fcd34d;
  color: #92400e;
  font-size: 12.5px;
}

.detour-text {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detour-return-btn {
  flex: none;
  border: none;
  background: #d97706;
  color: #fff;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.stage-wrap {
  flex: 1;
  padding: 12px 12px 128px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.reconnect-strip {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.breadcrumb-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding: 2px 0;
  scrollbar-width: none;
}
.breadcrumb-bar::-webkit-scrollbar { display: none; }

.crumb-chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.crumb-chip.current {
  border-color: var(--teal);
  background: #f0fdfa;
  color: var(--teal);
  font-weight: 700;
}
.crumb-arrow { color: var(--ink-3); font-size: 11px; flex: none; }

.bridge-box {
  background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
  border: 1px solid #99f6e4;
  border-left: 4px solid var(--teal);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 13px;
  color: var(--ink-2);
}

.bridge-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: var(--teal);
  margin-right: 6px;
}

.recap-details {
  background: #ffffff;
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--ink-3);
}
.recap-details summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.recap-details p { margin: 5px 0 0; color: var(--ink-2); }

.card-stage {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.card-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.subj-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: #e0f2fe;
  color: #0369a1;
}
.subj-pathology { background: #ffe4e6; color: #be123c; }
.subj-biochem { background: #fef3c7; color: #b45309; }
.subj-physiology { background: #ccfbf1; color: #0f766e; }
.subj-histology { background: #ede9fe; color: #6d28d9; }
.subj-pharmacology { background: #e0e7ff; color: #4338ca; }
.subj-pathophys { background: #ffedd5; color: #c2410c; }

.tier-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: #f1f5f9;
  color: var(--ink-2);
}
.tier-core_underlined { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.tier-master { background: #ecfdf5; color: #047857; }
.tier-understand { background: #f8fafc; color: #64748b; }

.card-meta-right {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.type-badge {
  font-size: 11px;
  color: var(--ink-3);
}

.kw-toggle-btn {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  color: var(--ink-3);
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}
.kw-toggle-btn.on {
  border-color: #fde68a;
  background: #fffbeb;
  color: #b45309;
}

.kw-core {
  font-weight: 700;
  color: #0f172a;
  background: rgba(251, 191, 36, 0.17);
  border-bottom: 1.5px solid rgba(217, 119, 6, 0.55);
  padding: 0 2px;
  border-radius: 2px;
}
.kw-metric {
  font-weight: 700;
  color: #0369a1;
}
.kw-contrast {
  font-weight: 700;
  color: #b91c1c;
  text-decoration: underline;
  text-decoration-color: rgba(185, 28, 28, 0.38);
  text-underline-offset: 3px;
}
.kw-label {
  font-weight: 700;
  color: var(--ink);
}
.takeaway-card .kw-core,
.trap-box .kw-core {
  background: rgba(255, 255, 255, 0.72);
  border-bottom-color: rgba(180, 83, 9, 0.55);
}

.card-title {
  margin: 0 0 6px;
  font-size: 19px;
  line-height: 1.35;
  font-weight: 800;
  color: var(--ink);
}

.anchor-summary {
  margin: 0 0 12px;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: 10px;
  font-size: 13.5px;
  color: var(--ink-2);
}

.source-chip {
  margin-top: 12px;
  font-size: 11px;
  color: var(--ink-3);
}

/* Type 1: Mechanism Flow */
.flow-list { display: flex; flex-direction: column; gap: 8px; }

.flow-step {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
}
.flow-step.revealed {
  border-color: #99f6e4;
  background: #f8fffd;
}
.flow-step-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--ink);
}
.flow-tag {
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal);
  flex: none;
}
.flow-reveal-text {
  margin: 6px 0 0;
  font-size: 13.5px;
  color: var(--ink-2);
}
.flow-next-btn {
  width: 100%;
  margin-top: 4px;
  padding: 11px 14px;
  border: 1.5px dashed var(--teal);
  background: #f0fdfa;
  color: var(--teal);
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.takeaway-card {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  font-size: 13px;
  color: #065f46;
}

/* Type 2: Structure Cloze */
.cloze-toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 8px;
}
.mini-btn {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
}
.cloze-list {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 14.5px;
}
.cloze-pill {
  display: inline-block;
  padding: 1px 8px;
  margin: 0 2px;
  border-radius: 6px;
  border: 1px solid #0f766e;
  background: #0f766e;
  color: transparent;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  user-select: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 13.5px;
  transition: all 0.16s ease;
}
.cloze-pill.open {
  background: #ccfbf1;
  color: #0f766e;
  text-shadow: none;
  user-select: text;
}
.trap-box {
  margin-top: 12px;
  padding: 9px 11px;
  border-radius: 10px;
  background: #fffbeb;
  border: 1px solid #fde68a;
  font-size: 12.5px;
  color: #92400e;
}

/* Type 3: Comparison Matrix + Quick Quiz */
.matrix-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.matrix-table th {
  background: var(--surface-muted);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-weight: 700;
}
.matrix-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--ink-2);
  vertical-align: top;
}
.matrix-table tr:last-child td { border-bottom: none; }

.quiz-card {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid var(--line);
}
.quiz-stem {
  font-size: 13.5px;
  font-weight: 700;
  margin: 0 0 8px;
}
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quiz-opt {
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
}
.quiz-opt.correct { background: var(--emerald-soft); border-color: var(--emerald); color: #065f46; font-weight: 700; }
.quiz-opt.wrong { background: var(--rose-soft); border-color: var(--rose); color: #9f1239; }
.quiz-explain {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 7px 10px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
}

/* Bottom Fixed Thumb Dock */
.thumb-dock {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 720px;
  z-index: 35;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 12px max(10px, env(safe-area-inset-bottom));
  box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.06);
}

.neighbor-bar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.mini-galaxy-btn {
  border: 1px solid #cbd5e1;
  background: var(--surface-muted);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.queue-progress { font-size: 11.5px; color: var(--teal); font-weight: 700; }

/* Planned Detour & Inline Non-Truncated Galaxy Map */
.planned-detour-pill {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-left: 4px solid #2563eb;
  color: #1e40af;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 600;
}

.galaxy-card-section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
}

.galaxy-section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.galaxy-section-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.galaxy-section-sub {
  font-size: 11px;
  color: var(--ink-3);
}

.galaxy-board {
  position: relative;
  width: 100%;
  min-height: 250px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: radial-gradient(circle at 50% 45%, #f0fdfa 0%, #f8fafc 74%);
  overflow: hidden;
}

.galaxy-lines-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.galaxy-edge-tag {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 1px 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e2e8f0;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
  pointer-events: none;
  z-index: 2;
}

.galaxy-node-pill {
  position: absolute;
  transform: translate(-50%, -50%);
  width: min(44%, 172px);
  padding: 6px 8px;
  border-radius: 11px;
  border: 1.5px solid #cbd5e1;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
  text-align: left;
  cursor: pointer;
  z-index: 3;
  transition: transform 0.14s ease, border-color 0.14s ease;
}
.galaxy-node-pill:active { transform: translate(-50%, -50%) scale(0.97); }
.galaxy-node-pill.center {
  width: min(58%, 215px);
  border-color: var(--teal);
  background: #f0fdfa;
  box-shadow: 0 4px 14px rgba(15, 118, 110, 0.18);
  z-index: 4;
  cursor: default;
}
.galaxy-node-pill.selected {
  border-color: #d97706;
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25);
  z-index: 5;
}
.galaxy-node-pill.weak {
  border-color: #fda4af;
  background: #fff1f2;
}
.galaxy-node-top {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--ink-3);
  margin-bottom: 2px;
}
.galaxy-node-title {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.28;
  color: var(--ink);
  word-break: break-word;
}

.galaxy-preview-bar {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.galaxy-preview-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.galaxy-preview-bridge {
  font-size: 12.5px;
  color: var(--ink-2);
}
.galaxy-preview-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.galaxy-extra-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.galaxy-extra-btn {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
}

.rating-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.rate-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 11px 6px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
}
.rate-btn:active { transform: scale(0.97); }
.rate-again { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
.rate-fuzzy { border-color: #fde68a; background: #fffbeb; color: #b45309; }
.rate-mastered { border-color: #a7f3d0; background: #ecfdf5; color: #047857; }
.rate-btn.recommended {
  box-shadow: 0 0 0 2.5px rgba(15, 118, 110, 0.45);
}

/* Modal & Drawers */
.sheet-modal {
  width: min(94vw, 640px);
  max-height: 86dvh;
  border: none;
  border-radius: 18px;
  padding: 0;
  box-shadow: 0 18px 48px rgba(15, 23, 42, 0.25);
}
.sheet-modal::backdrop { background: rgba(15, 23, 42, 0.45); }
.modal-head {
  position: sticky;
  top: 0;
  background: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-close {
  border: none;
  background: #f1f5f9;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 14px;
}
.modal-body {
  padding: 14px 16px 20px;
  overflow-y: auto;
  max-height: calc(86dvh - 58px);
}

.tab-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-muted);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tab-btn.active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}

.route-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  width: 100%;
}
.route-card:hover { border-color: var(--teal); }
.route-card h3 { margin: 0 0 3px; font-size: 14px; color: var(--ink); }
.route-card p { margin: 0; font-size: 12px; color: var(--ink-3); }

.syl-subject-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.syl-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 13.5px;
  margin-bottom: 6px;
}
.progress-track {
  height: 7px;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--teal);
}
.node-dot-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.node-dot-pill {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11.5px;
  cursor: pointer;
}

.galaxy-svg {

":false},{"id":"syl_histology_050","course":"基础医学分论","subject":"histology","chapter":"组胚专题 · 受精过程及其生物学意义","title":"受精过程及其生物学意义","raw_text":"受精过程及其生物学意义","tier":"master","underlined":false},{"id":"syl_histology_051","course":"基础医学分论","subject":"histology","chapter":"组胚专题 · 卵裂和胚泡形成","title":"卵裂和胚泡形成","raw_text":"卵裂和胚泡形成","tier":"familiar","underlined":false},{"id":"syl_histology_052","course":"基础医学分论","subject":"histology","chapter":"组胚专题 · 植入，胚层形成与分化，胎膜与胎盘","title":"植入，胚层形成与分化，胎膜与胎盘","raw_text":"植入，胚层形成与分化，胎膜与胎盘","tier":"master","underlined":false},{"id":"syl_histology_053","course":"基础医学分论","subject":"histology","chapter":"组胚专题 · 胚胎各期外形特征","title":"胚胎各期外形特征","raw_text":"胚胎各期外形特征","tier":"familiar","underlined":false},{"id":"syl_histology_054","course":"基础医学分论","subject":"histology","chapter":"组胚专题 · 生殖工程","title":"生殖工程","raw_text":"生殖工程","tier":"familiar","underlined":false},{"id":"syl_physiology_001","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"机体功能的研究内容和方法","raw_text":"1.机体功能的研究内容和方法：机体功能研究与医学的关系，机体功能的研究水平（整体、器官和系统、细胞和分子），研究方法（在体和离体实验，急性和慢性实验、人体和动物实验）。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_physiology_002","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"兴奋性和刺激的概念","raw_text":"2.生命的基本特征：新陈代谢，兴奋性和刺激的概念，生殖。","tier":"core_underlined","underlined":true,"underlined_span":"兴奋性和刺激的概念"},{"id":"syl_physiology_003","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"内环境稳态体液及其组成内环境和稳态的概念，稳态的维持和生理意义。","raw_text":"3.机体的内环境和稳态：体液及其组成，体液的分隔和沟通，内环境和稳态的概念，稳态的维持和生理意义。","tier":"core_underlined","underlined":true,"underlined_span":"内环境稳态体液及其组成内环境和稳态的概念，稳态的维持和生理意义。"},{"id":"syl_physiology_004","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"神经调节、体液调节、自身调节的概念和特点。反馈（包括负反馈和正反馈）控制，前馈控制的概念及其生理意义。","raw_text":"4.机体功能的调节：生理功能的调节方式：神经调节、体液调节、自身调节的概念和特点。体液调节的方式，神经-体液调节的概念。体内的控制系统的反馈（包括负反馈和正反馈）控制，前馈控制的概念及其生理意义。","tier":"core_underlined","underlined":true,"underlined_span":"神经调节、体液调节、自身调节的概念和特点。反馈（包括负反馈和正反馈）控制，前馈控制的概念及其生理意义。"},{"id":"syl_physiology_005","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类","raw_text":"5.细胞膜物质转运功能：细胞膜的分子组成和结构；物质的跨膜转运：单纯扩散；易化扩散：经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类；原发性和继发性主动转运；钠-钾泵的概念和生理意义；出胞和入胞（包括受体介导入胞）。","tier":"core_underlined","underlined":true,"underlined_span":"经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类；原发性和继发性主动转运；钠-钾泵的概念和生理意义"},{"id":"syl_physiology_006","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体内信号传递","raw_text":"6.体内信号传递：体内细胞间信息传递，细胞的跨膜信号转导：细胞跨膜信号转导的概念及主要方式：G 蛋白耦联受体介导的信号转导，酶耦联型受体介导的信号转导（招募型受体介导的信号转导），离子通道型受体介导的信号转导，核受体介导的信号转导。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_physiology_007","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念","raw_text":"7.细胞的生物电活动：静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念；动作电位的概念及产生机制，锋电位、后电位的概念、内向电流和外向电流的概念，电压门控钠通道的功能状态，电压钳和膜片钳的基本原理和在细胞生物电研究中的运用；动作电位的引起和传导：阈强度、阈值、阈刺激，阈电位的概念，动作电位的“全或无”特性；动作电位的传导：动作电位在同一细胞上传导，局部电流学说，动作电位传播的不衰减特征，动作电位在有髓神经纤维上的传导；动作电位在细胞之间的传递（缝隙连接的结构特征和生理意义）；细胞兴奋性及其在动作电位周期中的变化：可兴奋细胞和兴奋性、兴奋的概念；细胞膜的被动电学特性和电紧张电位、局部电位：局部电位的概念和特征、局部兴奋的概念及其机制。","tier":"core_underlined","underlined":true,"underlined_span":"静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念；动作电位的概念及产生机制，锋电位、后电位的概念、内向电流和外向电流的概念，电压门控钠通道的功能状态，；动作电位的引起和传导：阈强度、阈值、阈刺激，阈电位的概念，动作电位的“全或无”特性；动作电位的传导：动作电位在同一细胞上传导，局部电流学说，动作电位传播的不衰减特征，动作电位在有髓神经纤维上的传导；动作电位在细胞之间的传递（缝隙连接的结构特征和生理意义）；细胞兴奋性及其在动作电位周期中的变化：局部电位：局部电位的概念和特征、局部兴奋的概念及其机制"},{"id":"syl_physiology_008","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"骨骼肌神经-肌接头处兴奋的传递过程","raw_text":"8.肌细胞的收缩：骨骼肌神经-肌接头处兴奋的传递过程：终板电位、微终板电位、量子性释放的概念；骨骼肌的细微结构，肌管系统；骨骼肌的收缩和舒张机制，横纹肌的兴奋-收缩耦联；骨骼肌收缩的表现：等长收缩、等张收缩；影响骨骼肌收缩的因素：前负荷、后负荷、肌肉收缩能力；单收缩和强直收缩的概念。多纤维总和，运动单位，大小原则，肌紧张的概念，平滑肌的收缩功能。","tier":"core_underlined","underlined":true,"underlined_span":"骨骼肌神经-肌接头处兴奋的传递过程：终板电位、微终板电位、量子性释放的概念；骨骼肌的收缩和舒张机制，横纹肌的兴奋-收缩耦联骨骼肌收缩的表现：等长收缩、等张收缩；影响骨骼肌收缩的因素：前负荷、后负荷、肌肉收缩能力；单收缩和强直收缩的概念。"},{"id":"syl_physiology_009","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体质指数的概念、生理和病理变化","raw_text":"9.机体能量的来源和利用：糖、脂肪和蛋白质在机体供能、储能中的作用，能量的贮存及ATP和磷酸肌酸的关系，能量代谢的平衡，体质指数的概念、生理和病理变化。","tier":"core_underlined","underlined":true,"underlined_span":"体质指数的概念、生理和病理变化"},{"id":"syl_physiology_010","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。","raw_text":"10.能量代谢的测定：直接和间接测热法，食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。","tier":"core_underlined","underlined":true,"underlined_span":"食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。"},{"id":"syl_physiology_011","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"食物的特殊动力作用的概念及其机制。","raw_text":"11.影响能量代谢的主要因素：食物的特殊动力作用的概念及其机制。","tier":"core_underlined","underlined":true,"underlined_span":"食物的特殊动力作用的概念及其机制。"},{"id":"syl_physiology_012","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"基础代谢、基础状态和基础代谢率的概念基础代谢率的概念和个体间比较——体表面积定律基础代谢率的测量、生理病理变化及意义。","raw_text":"12.基础代谢：基础代谢、基础状态和基础代谢率的概念，基础代谢率的概念和个体间比较——体表面积定律，基础代谢率的测量、生理病理变化及意义。","tier":"core_underlined","underlined":true,"underlined_span":"基础代谢、基础状态和基础代谢率的概念基础代谢率的概念和个体间比较——体表面积定律基础代谢率的测量、生理病理变化及意义。"},{"id":"syl_physiology_013","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体温及其定义，体表温度和体核温度的定义及其特点","raw_text":"13.体温及其生理波动：体温及其定义，体表温度和体核温度的定义及其特点，体温正常值及生理变动。","tier":"core_underlined","underlined":true,"underlined_span":"体温及其定义，体表温度和体核温度的定义及其特点"},{"id":"syl_physiology_014","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"产热器官、产热方式及其调节机体的散热方式及其调节体温调节方式温度感受器和体温调节中枢体温调定点学说及视前区/下丘脑前部的作用。","raw_text":"14.产热与散热：产热器官、产热方式及其调节，机体的散热方式及其调节，体温调节方式，温度感受器和体温调节中枢，体温调定点学说及视前区/下丘脑前部的作用。","tier":"core_underlined","underlined":true,"underlined_span":"产热器官、产热方式及其调节机体的散热方式及其调节体温调节方式温度感受器和体温调节中枢体温调定点学说及视前区/下丘脑前部的作用。"},{"id":"syl_pathophys_001","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。","raw_text":"1.疾病和健康相关的基本概念：疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。","tier":"core_underlined","underlined":true,"underlined_span":"疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。"},{"id":"syl_pathophys_002","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"病因的分类","raw_text":"2.病因的分类：生物因素、理化因素、营养因素、遗传因素、先天因素、免疫因素、心理和社会因素。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathophys_003","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"脑死亡的判断标准","raw_text":"3.疾病发生发展的一般规律：损伤与抗损伤并存；因果交替；局部和整体相互影响。疾病发生发展的基本机制：神经机制；体液机制；细胞机制；分子机制。疾病的转归：康复与死亡；康复包括：完全康复和不完全康复；脑死亡的判断标准：①自主呼吸停止；②不可逆性深度昏迷；③脑干神经反射消失；④脑电波消失；⑤脑血液循环完全停止；诊断脑死亡的意义：①协助医务人员判定患者的死亡时间、适时终止复苏抢救；②节省卫生资源，减轻社会和家庭的经济和情感负担；③有利于器官移植。","tier":"core_underlined","underlined":true,"underlined_span":"脑死亡的判断标准：①自主呼吸停止；②不可逆性深度昏迷；③脑干神经反射消失；④脑电波消失；⑤脑血液循环完全停止；诊断脑死亡的意义：①协助医务人员判定患者的死亡时间、适时终止复苏抢救；②节省卫生资源，减轻社会和家庭的经济和情感负担；③有利于器官移植。"},{"id":"syl_pathophys_004","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"疾病研究的基本方法","raw_text":"4. 疾病研究的基本方法：整体动物模型、离体器官模型和离体细胞模型。","tier":"understand","underlined":false,"underlined_span":""},{"id":"syl_pathophys_005","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"发热、过热的概念发热激活物","raw_text":"5.发热、过热的概念。发热病因和发病机制：发热激活物；产生内生致热原细胞；内生致热原。","tier":"core_underlined","underlined":true,"underlined_span":"发热、过热的概念发热激活物；产生内生致热原细胞；内生致热原。"},{"id":"syl_pathophys_006","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"致热信号传入中枢的途径","raw_text":"6.发热时的体温调节机制：致热信号传入中枢的途径；发热中枢调节介质：正调节介质；负调节介质。体温调节的方式及发热的时相：体温上升期；高温持续期；体温下降期；发热时机体主要的代谢功能变化；发热的防治原则。","tier":"core_underlined","underlined":true,"underlined_span":"致热信号传入中枢的途径；发热中枢调节介质：正调节介质；负调节介质。"},{"id":"syl_pathophys_007","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"应激、应激原的概念","raw_text":"7.应激、应激原的概念；应激反应的分类。","tier":"core_underlined","underlined":true,"underlined_span":"应激、应激原的概念；"},{"id":"syl_pathophys_008","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"蓝斑-交感-肾上腺髓质系统","raw_text":"8.应激时神经内分泌反应及机制：蓝斑-交感-肾上腺髓质系统；下丘脑-垂体-肾上腺皮质激素系统；其他神经内分泌反应；应激时的免疫反应；急性期反应和急性期蛋白；细胞应激反应：热休克反应；氧化应激。应激的心理行为反应。","tier":"core_underlined","underlined":true,"underlined_span":"蓝斑-交感-肾上腺髓质系统；下丘脑-垂体-肾上腺皮质激素系统；急性期反应和急性期蛋白；"},{"id":"syl_pathophys_009","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"应激与应激性溃疡","raw_text":"9.应激与疾病：应激与心血管疾病；应激与应激性溃疡；应激与精神神经疾病：创伤后应激障碍；应激与内分泌和代谢性疾病。","tier":"core_underlined","underlined":true,"underlined_span":"应激与应激性溃疡；创伤后应激障碍"},{"id":"syl_pathophys_010","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"病理性应激的防治原则。","raw_text":"10.病理性应激的防治原则。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_001","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"萎缩概念类型（包括生理性和病理性）心肌萎缩","raw_text":"萎缩概念、类型（包括生理性和病理性）及各类型的病理学改变和后果，心肌萎缩为例。","tier":"core_underlined","underlined":true,"underlined_span":"萎缩概念类型（包括生理性和病理性）心肌萎缩"},{"id":"syl_pathology_002","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肥大概念","raw_text":"肥大概念、类型（包括生理性和病理性，应性和替代性）及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"肥大概念"},{"id":"syl_pathology_003","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"增生概念","raw_text":"增生概念、类型及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"增生概念"},{"id":"syl_pathology_004","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"化生概念","raw_text":"化生概念、类型及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"化生概念"},{"id":"syl_pathology_005","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)","raw_text":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)。","tier":"core_underlined","underlined":true,"underlined_span":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)"},{"id":"syl_pathology_006","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及电镜下)","raw_text":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及电镜下)。","tier":"core_underlined","underlined":true,"underlined_span":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及 机制，包括血管反应（血管反应包括血流动力学和血管通透性改变，识别渗出液和漏出液特点，解释渗出液的利和弊）；白细胞浸润、及炎症介质（白细胞浸润过程（边集、附壁、游出、趋化、吞噬、降解），识别各类炎症细胞、解释趋化概念）；炎症介质定义，各类炎症介质。急性炎症临床症状：急性炎症局部症状、描述全身症状；四种渗出为主的急性炎症病理类型（浆液性、纤维蛋白性、化脓性、其他如出血性炎），各种炎症好发的部位、渗出物形态特点、脏器病变举例及结局。","tier":"core_underlined","underlined":true,"underlined_span":"解释趋化概念急性炎症临床症状：急性炎症局部症状、描述全身症状四种渗出为主的急性炎症病理类型（浆液性、纤维蛋白性、化脓性、其他如出血性炎），各种炎症好发的部位、渗出物形态特点、脏器病变举例及结局。"},{"id":"syl_pathology_024","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"慢性炎症特点和慢性炎症细胞类型炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。","raw_text":"13.慢性炎症：慢性炎症发生机制，慢性炎症特点和慢性炎症细胞类型；慢性炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。","tier":"core_underlined","underlined":true,"underlined_span":"慢性炎症特点和慢性炎症细胞类型炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。"},{"id":"syl_pathology_025","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"炎症结局的影响因素（局部、全身）","raw_text":"14.炎症结局：炎症结局的影响因素（局部、全身）；三种不同的炎症结局（痊愈、迁延至慢性、蔓延扩散）；蔓延扩散的三种途径（局部、淋巴道、血道）。血道播散引起的菌血症、毒血症、败血症及脓毒败血症。","tier":"core_underlined","underlined":true,"underlined_span":"炎症结局的影响因素（局部、全身）；三种不同的炎症结局（痊愈、迁延至慢性、蔓延扩散）；蔓延扩散的三种途径（局部、淋巴道、血道）。血道播散引起的菌血症、毒血症、败血症及脓毒败血症。"},{"id":"syl_pathology_026","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能干细胞概念、分类细胞外基质对组织细胞再生的作用","raw_text":"15.细胞增殖的调控；不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能；干细胞概念、分类、与再生医学研究的关系；细胞因子和细胞外基质对组织细胞再生的作用；","tier":"core_underlined","underlined":true,"underlined_span":"不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能干细胞概念、分类细胞外基质对组织细胞再生的作用"},{"id":"syl_pathology_027","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肉芽组织的概念、形态特点和作用纤维性修复过程一期愈合和二期愈合的特点","raw_text":"16.肉芽组织的概念、形态特点和作用；纤维性修复过程；影响修复的因素；一期愈合和二期愈合的特点。","tier":"core_underlined","underlined":true,"underlined_span":"肉芽组织的概念、形态特点和作用纤维性修复过程一期愈合和二期愈合的特点"},{"id":"syl_pathology_028","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。","raw_text":"17.肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。"},{"id":"syl_pathology_029","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的良恶性","raw_text":"18.肿瘤的良恶性：分类的根本依据（对机体的危害程度），良恶性肿瘤的区别要点（肿瘤分化、生长方式、生长速度、核分裂象、播散、后果）。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的良恶性：分类的根本依据（对机体的危害程度），良恶性肿瘤的区别要点（肿瘤分化、生长方式、生长速度、核分裂象、播散、后果）。"},{"id":"syl_pathology_030","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的基本病变","raw_text":"19.肿瘤的基本病变：肿瘤的形态改变，包括外形、颜色、大小、数目及肿瘤的结构。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的基本病变：肿瘤的形态改变，包括外形、颜色、大小、数目及肿瘤的结构。"},{"id":"syl_pathology_031","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的分类、命名基本原则","raw_text":"20.肿瘤的分类、命名基本原则：良恶性肿瘤命名的差别，强调癌、肉瘤的定义，了解肿瘤的其他特殊命名。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的分类、命名基本原则：良恶性肿瘤命名的差别，强调癌、肉瘤的定义，了解肿瘤的其他特殊命名。"},{"id":"syl_pathology_032","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的分级和分期","raw_text":"21.肿瘤的分级和分期：强调分级是指肿瘤分化的程度，而分级是指肿瘤的大小和播散的范围。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的分级和分期：强调分级是指肿瘤分化的程度，而分级是指肿瘤的大小和播散的范围。"},{"id":"syl_pathology_033","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的生物学特性以肿瘤的形态特征为重点。光镜下肿瘤良恶性鉴别的要点、共性失接触抑制、永生化生长、裸鼠中的成瘤性Crabtree效应，合成代谢大于分解代谢等特征","raw_text":"22.肿瘤的生物学特性：包括肿瘤的形态特征、生理特征、生化代谢、免疫特征。以肿瘤的形态特征为重点。形态特征中要求掌握在光镜下肿瘤良恶性鉴别的要点、共性。强调HE染色光镜检查是肿瘤病理诊断的最重要手段。简单介绍电镜、染色体检测、组织化学、免疫组织化学和原位分子杂交等技术在肿瘤诊断中的辅助作用，特别强调免疫组织化学染色在确定肿瘤分化方向、甚至在判别肿瘤良恶性、有无浸润方面的作用。肿瘤生理特征中重点介绍失接触抑制、永生化生长、裸鼠中的成瘤性。生化代谢主要介绍Crabtree效应，合成代谢大于分解代谢等特征。免疫特征中主要介绍与肿瘤诊断相关的抗原。介绍肿瘤侵袭转移的基本分子生物学基础。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的生物学特性以肿瘤的形态特征为重点。光镜下肿瘤良恶性鉴别的要点、共性失接触抑制、永生化生长、裸鼠中的成瘤性Crabtree效应，合成代谢大于分解代谢等特征"},{"id":"syl_pathology_034","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系","raw_text":"23.掌握原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系。","tier":"core_underlined","underlined":true,"underlined_span":"原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系"},{"id":"syl_pathology_035","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤转移的三个步骤淋巴道、血道、种植性转移三种不同的转移方式","raw_text":"24.掌握肿瘤转移的三个步骤，了解肿瘤转移的基本分子学基础。强调癌的转移途径和肉瘤转移途径的差异性，同时强调不同肿瘤转移的个性，并举例说明。掌握淋巴道、血道、种植性转移三种不同的转移方式，淋巴结转移中强调左锁骨上淋巴节转移的意义，血道转移中介绍肝和肺的常见转移，种植性转移中介绍Kruekenberg tumor。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤转移的三个步骤淋巴道、血道、种植性转移三种不同的转移方式"},{"id":"syl_pathology_036","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围","raw_text":"25.肿瘤的病理诊断：强调病理诊断中切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围；强调病理诊断在肿瘤诊断中的金标准作用，强调石蜡切片在病理诊断中的最终诊断作用。介绍脱落细胞学检查的作用和应用越来越广泛的趋势，强调细胞学检查发现异常后需要再做活组织检查的必要性。","tier":"core_underlined","underlined":true,"underlined_span":"切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围"},{"id":"syl_pathology_037","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式","raw_text":"26.原癌基因分类：介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式。","tier":"core_underlined","underlined":true,"underlined_span":"介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式"},{"id":"syl_pathology_038","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响","raw_text":"原癌基因激活的方式：重点以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响。","tier":"core_underlined","underlined":true,"underlined_span":"以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响"},{"id":"syl_pathology_039","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用","raw_text":"27.抑癌基因的分类及失活：以TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用。","tier":"core_underlined","underlined":true,"underlined_span":"TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用"},{"id":"syl_pathology_040","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"凋亡调节基因在细胞恶变过程中的作用","raw_text":"28.凋亡调节基因在细胞恶变过程中的作用：介绍抑癌基因与凋亡调节基因的相互作用，凋亡调节基因表达紊乱在细胞恶变中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_041","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"端粒酶在细胞永生化中的作用","raw_text":"29.端粒酶在细胞永生化中的作用：端粒酶的生理作用，端粒酶在体细胞中重激活后在细胞癌变中的作用，端粒酶与细胞永生化的作用，癌细胞的永生化特性的获得与端粒酶的关系。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_042","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系","raw_text":"30.常见的癌前病变：掌握癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系。了解各种癌前病变的癌变率。","tier":"core_underlined","underlined":true,"underlined_span":"癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系"},{"id":"syl_pathology_043","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"介绍几种与人类肿瘤相关的致瘤病毒","raw_text":"31.介绍几种与人类肿瘤相关的致瘤病毒：RNA病毒为人T细胞白血病病毒Ⅰ型的致瘤机制；DNA病毒中介绍HPV、EBV、HBV和HCV的致瘤机制，重点结合目前的分子病理学进展介绍HPV的致瘤机制。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_044","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤抗原的分类、肿瘤抗原在肿瘤免疫中的作用","raw_text":"32.肿瘤抗原的分类、肿瘤抗原在肿瘤免疫中的作用：重点介绍肿瘤抗原在肿瘤诊断中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_045","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤发生的多步骤理论及其与分子结构变化的关系，以结肠癌发生的模式图说明。","raw_text":"33.肿瘤发生的多步骤理论及其与分子结构变化的关系，以结肠癌发生的模式图说明。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_046","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤间质特别是肿瘤血管在肿瘤生长中的作用。","raw_text":"34.肿瘤间质特别是肿瘤血管在肿瘤生长中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_047","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"恶病质的定义","raw_text":"35.恶病质的定义：指出恶病质不一定全由恶性肿瘤引起。肿瘤伴随综合征的概念。","tier":"core_underlined","underlined":true,"underlined_span":"恶病质的定义"},{"id":"syl_pathology_048","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"常见肿瘤","raw_text":"36.常见肿瘤：以（上皮来源的）鳞状细胞良恶性肿瘤和腺上皮细胞良恶性肿瘤为例，再次强调良 "动脉细支持续痉挛引致剧烈疼痛与发绀","血管舒张神经亢进直接诱发肌膜蛋白凝固","持续缺氧致实质细胞萎缩兼间质纤维硬化","局部血流速度增快迫使白蛋白大量渗漏"],"answer_idx":2,"explain":"动脉性充血为主动血管扩张，氧供与代谢防御功能增强，诱因解除后即恢复；而长期静脉性淤血系静脉回流受阻所致被动瘀滞缺氧，既迫使实质细胞萎缩、变性乃至坏死，又诱发网状纤维塌陷胶原化及成纤维细胞增生，形成淤血性硬化(congestive sclerosis)。","remedial_node_id":"anat_heart_chambers"}},"diagram_assets":[{"path":"assets/patho_congestion_outcomes_flow_p12.webp","caption":"静脉性淤血致静脉压升高与缺氧代谢产物堆积的病理转归流程图","source_page":12}]},{"id":"patho_pulmonary_congestion","title":"左心衰与急性/慢性肺淤血（心衰细胞）","subject":"pathology","syllabus_refs":["syl_pathology_019"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"左心衰致肺静脉压骤升：急性期肺泡水肿咳粉红泡沫痰；慢性期见含铁血黄素心衰细胞与肺褐色硬化。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P13-P22","充血和淤血（基医 2学时）2026秋.pptx#P14,#P17,#P19,#P20"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"起点：左心衰竭 → 肺静脉回流受阻","reveal":"肺毛细血管静水压升高、管壁高度扩张充满红细胞（光镜呈串珠样），红细胞与血浆渗入肺泡腔。","mechanism_tag":"血液动力学改变"},{"cue":"急性肺淤血表现（突发左心衰）","reveal":"肺饱满暗红、切面流泡沫状血性液体；镜下肺泡腔充满嗜酸性水肿液，临床表现为端坐呼吸、咳大量粉红色泡沫痰。","mechanism_tag":"急性肺水肿"},{"cue":"慢性肺淤血：巨噬细胞吞噬与肺褐色硬化","reveal":"肺泡腔内巨噬细胞吞噬漏出的红细胞，将血红蛋白分解为棕黄色含铁血黄素，形成“心衰细胞”（咳铁锈色痰）；伴肺泡壁纤维化增厚，肺质硬棕褐称“肺褐色硬化”。","mechanism_tag":"慢性纤维化与心衰细胞"}],"takeaway":"心衰细胞 = 肺泡腔内吞噬含铁血黄素的巨噬细胞（提示慢性左心衰/肺淤血，而非细胞自身起源于心脏）。","quiz":{"stem":"慢性风湿性心脏病二尖瓣狭窄患者咳铁锈色痰，痰涂片见大量胞质充满粗大棕黄色折光颗粒的圆形大细胞，普鲁士蓝染色呈深蓝色。该细胞及其颗粒本质为：","options":["肺泡巨噬细胞吞噬分解红细胞成含铁血黄素","肺间质成纤维细胞自噬塌陷胶原生成脂褐素","脱落肺泡Ⅱ型上皮摄取漏出肺泡内的铁蛋白","增生左心室心肌细胞迁移入肺并释放肌红蛋白"],"answer_idx":0,"explain":"左心衰或二尖瓣狭窄致肺静脉压长期升高，红细胞漏入肺泡腔后被肺泡巨噬细胞吞噬，血红蛋白降解为含Fe³⁺的棕黄色含铁血黄素(普鲁士蓝阳性)，即“心衰细胞”；其提示左心衰慢性肺淤血而非来自心脏本身的细胞。","remedial_node_id":"anat_heart_chambers"}},"diagram_assets":[{"path":"assets/patho_congestion_heart_failure_cells_p20.webp","caption":"慢性肺淤血光镜：肺泡壁毛细血管扩张充血及肺泡腔含铁血黄素心衰细胞(图3-1)","source_page":20}]},{"id":"histo_liver_lobule","title":"肝小叶微循环与肝窦结构","subject":"histology","syllabus_refs":["syl_histology_002"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"血液自门管区小叶间静脉/动脉经肝窦向心流至中央静脉，决定淤血时中央3区最先缺氧坏死。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P24-P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["肝小叶血流方向：门管区（小叶间静脉、小叶间动脉）→ {{肝血窦}} → {{中央静脉}} → 小叶下静脉 → 肝静脉 → 下腔静脉。","门管区三联管（Portal triad）：{{小叶间静脉}}(PV)、小叶间动脉(HA)、小叶间胆管(BD)。","肝血窦壁与肝细胞之间为{{窦周隙(Disse间隙)}}，内含贮脂细胞（{{肝星状细胞}}），激活后可合成胶原导致肝纤维化。"],"trap_note":"由于血氧自周边1区流向中央3区递减，右心衰逆流压迫时，中央静脉周围3区最先、最重受累；1区相对缺氧较轻而先发生脂肪变性。"}},{"id":"patho_hepatic_congestion","title":"右心衰与慢性肝淤血（槟榔肝→淤血性肝硬化）","subject":"pathology","syllabus_refs":["syl_pathology_019","syl_pathology_006"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"右心衰致中央静脉/肝窦高度淤血发红，周边肝细胞脂肪变发黄，构成红黄相间“槟榔肝”，久之成心源性肝硬化。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P23-P31","充血和淤血（基医 2学时）2026秋.pptx#P27,#P28,#P30,#P31"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"第1步：右心衰引发肝静脉→中央静脉逆行压力升高","reveal":"急性肝淤血时肝大暗红，镜下肝小叶中央静脉和邻近肝窦高度扩张充满红细胞。","mechanism_tag":"下腔静脉回流受阻"},{"cue":"第2步：分区损伤造就“槟榔肝 (Nutmeg Liver)”","reveal":"肝小叶中央区因严重淤血及压迫缺氧，肝细胞萎缩甚至坏死呈暗红色；周边部肝细胞轻度缺氧致脂肪变性呈黄色，切面红黄相间似槟榔。","mechanism_tag":"慢性肝淤血典型病变"},{"cue":"第3步：长期淤血→淤血性（心源性）肝硬化","reveal":"小叶中央肝细胞崩解、网状纤维塌陷胶原化，窦周隙肝星状细胞增生并大量合成胶原纤维，肝脏体积缩小、变硬并阻塞门静脉窦内血流。","mechanism_tag":"肝纤维化结局"}],"takeaway":"记忆口诀：中央红（淤血坏死）+ 周边黄（脂肪变性）= 槟榔肝；星状细胞活化 + 网状纤维胶原化 = 淤血性肝硬化。","quiz":{"stem":"慢性右心衰患者尸检见肝脏切面红黄相间呈“槟榔肝”，镜下见中央静脉周围肝细胞萎缩崩解伴大片淤血，而汇管区周边肝细胞却满布脂肪空泡。此分区差异根源于：","options":["门管区胆管胆汁逆流优先溶解中央带肝细胞","中央静脉血流氧压最高最先发生脂肪酸氧化","汇管区肝血窦无内皮窗孔阻止红细胞进入","中央3区承受最高逆流压且血氧供最少先坏死"],"answer_idx":3,"explain":"肝小叶血供自周边门管区流向中央静脉。右心衰压力逆传经下腔静脉→肝静脉直抵中央静脉，中央3区既最直接受高压淤血挤压、又处血氧梯度最末端而率先萎缩坏死呈暗红；周边1区轻度缺氧致脂变呈黄，构成红黄相间槟榔肝。","remedial_node_id":"histo_liver_lobule"}},"diagram_assets":[{"path":"assets/patho_congestion_nutmeg_liver_p31.webp","caption":"慢性肝淤血三联观：A.中央肝窦扩张肝细胞受压萎缩；B.大体槟榔肝；C.晚期蓝色胶原纤维化","source_page":31}]},{"id":"anat_portal_vein_system","title":"肝门静脉系属支与三大门腔侧支吻合","subject":"anatomy","syllabus_refs":["syl_anatomy_235","syl_anatomy_236"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"肝门静脉无功能性瓣膜且两端连毛细血管；肝硬化高压时经食管、直肠、脐周三大吻合支代偿致出血。","source_slides":["16 基础医学 静脉 淋巴.pdf#P28-P35"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["主干汇合：通常由{{肠系膜上静脉}}与{{脾静脉}}在胰颈后方汇合而成，收集腹腔内不成对脏器（肝除外）静脉血。","结构特点：两端均连接毛细血管网（胃肠毛细血管网与肝血窦），且缺乏{{功能性静脉瓣}}，门脉高压时血液易逆流。","吻合1（食管路径）：门静脉 → 胃左静脉 → {{食管静脉丛}} → 奇静脉 → 上腔静脉（曲张破裂致{{呕血}}）。","吻合2（直肠路径）：门静脉 → 肠系膜下静脉 → 直肠上静脉 → {{直肠静脉丛}} → 直肠下/肛静脉 → 髂内静脉 → 下腔静脉（曲张致{{便血}}）。","吻合3（脐周路径）：门静脉 → {{附脐静脉}} → 脐周静脉网 → 胸腹壁/腹壁上静脉（入上腔）及腹壁浅/下静脉（入下腔），形成“海蛇头”征。"],"trap_note":"门体分流开放虽缓解门脉高压，但使肠道吸收的氨与胺类未经肝解毒直接进入体循环，诱发高血氨与肝性脑病！"}},{"id":"patho_edema_mechanisms","title":"水肿发生机制：Starling 平衡失调与淋巴回流受阻","subject":"pathology","syllabus_refs":["syl_pathology_020"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"组织液积聚源于血管静水压↑、血浆胶体渗透压↓、血管通透性↑或淋巴回流障碍。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P32-P44","充血和淤血（基医 2学时）2026秋.pptx#P33,#P34,#P35,#P38"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"机制1：毛细血管流体静水压↑（心源性/淤血性水肿）","reveal":"右心衰或静脉栓塞使静脉回流受阻，毛细血管静脉端静水压超过胶体渗透压，液体滤出增多并滞留组织间隙（如下肢凹陷性水肿、腹水）。","mechanism_tag":"流体静水压升高"},{"cue":"机制2：血浆胶体渗透压↓（肝性/肾性/营养不良性水肿）","reveal":"肝衰时白蛋白合成↓（或肾病综合征大量蛋白尿丢失白蛋白），血浆胶体渗透压降低导致组织液重吸收减少。","mechanism_tag":"低蛋白血症"},{"cue":"机制3与4：淋巴回流障碍 \u0026 微血管通透性↑","reveal":"丝虫阻塞或淋巴结清扫后富蛋白淋巴液滞留（象皮肿）；炎症介质使内皮间隙增宽形成富蛋白炎性水肿（需警惕喉头水肿窒息、脑水肿脑疝）。","mechanism_tag":"淋巴/通透性机制"}],"takeaway":"浆膜腔积液包括胸腔积液、心包积液与腹腔积液(ascites)；肺水肿阻碍气血交换，脑水肿诱发颅内高压与脑疝。","quiz":{"stem":"乳腺癌根治术行腋窝淋巴结清扫后，患者同侧上肢逐渐出现顽固性肿胀，抽吸组织液检测蛋白含量显著高于单纯心源性水肿。引发该局部肿胀的核心动力学紊乱是：","options":["锁骨下动脉代偿性扩张导致动脉端滤过骤升","盲端淋巴管受阻致间质蛋白滞留抬高渗透压","肝脏合成白蛋白锐减致使全身胶体压暴跌","组胺持续释放使微静脉内皮间隙全面崩解"],"answer_idx":1,"explain":"正常毛细血管动脉端滤出约14mL/min，静脉端重吸收12mL/min，余下2mL/min连同渗出小量蛋白靠毛细淋巴管回收；淋巴结清扫或丝虫阻塞淋巴回流后，组织间隙蛋白无法清除而不断抬高间质胶体渗透压，抽吸水肿持续加重（淋巴水肿）。","remedial_node_id":"histo_ct_ground_substance_fluid"}},"diagram_assets":[{"path":"assets/patho_congestion_edema_starling_p34.webp","caption":"毛细血管微循环正常滤过平衡(14=12+2mL/min)及B静水压↑/C胶体渗透压↓/D通透性↑/E淋巴阻塞机制","source_page":34}]},{"id":"biochem_aa_pool","title":"氨基酸代谢库与三条去路","subject":"biochem","syllabus_refs":["syl_biochem_029"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"外源消化吸收与内源蛋白降解共同构成氨基酸代谢库（骨骼肌占\u003e50%），主要合成蛋白、供能转化或变含氮活性物。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P8,P19-P28","2026-基医-氨基酸代谢-2.pdf#P26"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["代谢库分布不均：{{骨骼肌}}占 \u003e50%，肝约10%，血浆仅1%–6%（因氨基酸不能自由穿膜）。","内源蛋白质两条降解途径：胞质{{泛素-蛋白酶体途径}}（ATP依赖，E1/E2/E3标记短寿命/异常蛋白）与{{溶酶体途径}}（ATP非依赖，组织蛋白酶降解长寿命/膜蛋白）。","三条主要去路：① 合成体内{{蛋白质/多肽}}（最主要）；② 转变为嘌呤、嘧啶、肌酸、NO等特殊含氮物；③ {{脱氨基}}生成NH₃与α-酮酸。"],"trap_note":"9种营养必需氨基酸（体内不能合成）决定食物蛋白质营养价值；植物蛋白（谷类缺赖氨酸 vs 豆类缺蛋/色氨酸）混合食用可互补。","quiz":{"stem":"长期绝对素食者若仅以玉米为主食而完全不搭配豆制品，最易出现负氮平衡且限制蛋白合成的机制是？","options":["必需氨基酸缺乏且比例失衡限制体内蛋白合成","肠道泛素蛋白酶体活性亢进加速内源蛋白降解","溶酶体组织蛋白酶失活阻碍外源蛋白质的水解","骨骼肌氨基酸代谢库容量萎缩无法储存游离氨"],"answer_idx":0,"explain":"食物蛋白质的营养价值取决于必需氨基酸的种类与比例（9种必需氨基酸体内无法合成）。玉米等谷类缺乏赖氨酸，单独长期食用会因必需氨基酸短板使蛋白合成低于分解，导致负氮平衡；搭配豆类即可互补。","remedial_node_id":"biochem_aa_composition_classification"}},"diagram_assets":[{"path":"assets/biochem_aa_pool_overview_p28.webp","caption":"氨基酸代谢库全景：外源消化/腐败与内源溶酶体/蛋白酶体双轨汇聚入库，分流脱氨基、脱羧基及合成含氮活性物质","source_page":28}]},{"id":"biochem_transamination_deamination","title":"转氨基、L-谷氨酸脱氢与联合脱氨基作用","subject":"biochem","syllabus_refs":["syl_biochem_030"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"多数氨基酸通过转氨酶（辅酶PLP）将氨基集中至谷氨酸，再由线粒体GDH氧化脱氨释放游离NH₃。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P31-P45","丙氨酸联合脱氨基2026基础班.pptx","2026-基医-氨基酸代谢-1.pdf#P30-P42"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"第1步：转氨基作用（只换位、不脱氨）","reveal":"转氨酶（如ALT/GPT、AST/GOT）以维生素B₆衍生物磷酸吡哆醛(PLP)为辅酶，将α-氨基酸的氨基可逆转移至α-酮戊二酸，生成谷氨酸与新的α-酮酸。","mechanism_tag":"PLP 乒乓机制"},{"cue":"第2步：L-谷氨酸氧化脱氨基","reveal":"肝、肾、脑线粒体内的L-谷氨酸脱氢酶(GDH)以NAD⁺/NADP⁺为辅酶催化谷氨酸脱氨生成α-酮戊二酸与游离NH₃（ATP/GTP抑制、ADP/GDP激活）。","mechanism_tag":"释放游离 NH₃"},{"cue":"第3步：联合脱氨基 \u0026 α-酮酸去路","reveal":"上述两步偶联即“联合脱氨基”（骨骼肌/心肌GDH活性低，改走嘌呤核苷酸循环）。脱氨后剩下的α-酮酸可：① 再氨基化成非必需氨基酸；② 转变成糖或脂；③ 入TCA循环彻底氧化供能。","mechanism_tag":"碳氮分流汇合"}],"takeaway":"口诀：B₆兄弟三（吡哆醛/醇/胺），磷酸化后“脱羧又转氨”；联合脱氨基把20种氨基酸的氨基统一汇入谷氨酸再放氨。","quiz":{"stem":"异烟肼长期治疗诱发维生素B₆(磷酸吡哆醛)耗竭时，联合脱氨基与血清转氨酶活性将呈现何种改变？","options":["心肌AST活性升高而肝细胞ALT活性显著降低","L-谷氨酸脱氢酶因缺NADP⁺辅酶而完全失活","氨基酸转氨基反应加速而谷氨酸脱氢过程停止","氨基在氨基酸与α-酮酸间的换位转移明显受阻"],"answer_idx":3,"explain":"转氨酶(ALT/AST)以维生素B₆磷酸酯PLP为辅酶，经席夫碱乒乓机制可逆转移α-氨基；PLP耗竭直接阻断转氨基接力环节（赖/苏/脯/羟脯氨酸本身不转氨，GDH辅酶则是NAD⁺/NADP⁺）。","remedial_node_id":"biochem_enzyme_cofactors_vitamins"}},"diagram_assets":[{"path":"assets/biochem_aa_plp_schiff_p34.webp","caption":"转氨酶辅酶磷酸吡哆醛(PLP)与α-氨基酸形成席夫碱异构传递氨基生成磷酸吡哆胺(PMP)及B₆口诀","source_page":34}]},{"id":"biochem_blood_ammonia_sources","title":"血氨三大来源与 pH 依赖性离子障吸收","subject":"biochem","syllabus_refs":["syl_biochem_030","syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"血氨来自氨基酸脱氨、肠道产氨与肾小管泌氨；NH₃较NH₄⁺更易透膜，偏碱环境促血氨入血加重中毒。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P2-P5","2026-基医-氨基酸代谢-1.pdf#P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["来源1（最主要）：体内各组织{{氨基酸脱氨基}}产生（正常血氨 47–65 μmol/L）。","来源2（肠道约4g/d）：结肠内未吸收氨基酸腐败脱氨，以及血尿素渗入肠道后经肠菌{{尿素酶}}水解释放NH₃。","来源3（肾小管泌氨）：谷氨酰胺在{{谷氨酰胺酶}}作用下释放NH₃进入肾小管腔，与H⁺结合为NH₄⁺随尿排出以排酸保碱。","临床“离子障”陷阱：肠道或尿液偏{{碱}}时，NH₄⁺去质子转化为脂溶性{{NH₃}}，更易跨膜吸收入血；故肝性脑病禁用{{碱性肥皂水}}灌肠，且肝硬化腹水慎用碱性利尿药。"],"trap_note":"高血氨灌肠应选弱酸性溶液（如乳果糖酸化肠腔），使氨保留为不易透膜的 NH₄⁺ 随粪便排出。","quiz":{"stem":"肝硬化患者并发肝性脑病时，若误用碱性肥皂水灌肠并予碱性利尿药，血氨急剧飙升的物理化学根源是？","options":["肠菌尿素酶受碱激活加速水解尿素释放NH₄⁺","NH₄⁺去质子化转为脂溶性NH₃迅速跨膜入血","肾小管谷氨酰胺酶受抑使谷氨酰胺滞留肠腔","酸性环境增强肠道氨基酸脱羧基生成组胺酸"],"answer_idx":1,"explain":"NH₃较带正电的NH₄⁺更易透膜。肠腔或尿液偏碱时NH₄⁺平衡右移转为NH₃，使结肠氨与肾小管氨绕过排出大量吸收入血加重脑中毒；临床须用弱酸溶液（如乳果糖）灌肠。","remedial_node_id":"biochem_transamination_deamination"}}},{"id":"biochem_ammonia_transport","title":"血氨无毒转运：丙氨酸-葡萄糖循环 vs 谷氨酰胺","subject":"biochem","syllabus_refs":["syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"游离NH₃剧毒，血液主要以肌肉→肝的丙氨酸（兼供糖）和脑/肌肉→肝肾的谷氨酰胺两种无毒形式运氨。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P6-P8"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["比较项目","丙氨酸-葡萄糖循环","谷氨酰胺 (Gln) 运氨"],"rows":[["出发与靶器官","骨骼肌 → 血液 → 肝脏（返还葡萄糖）","脑、骨骼肌等 → 血液 → 肝脏（成尿素）/肾（排NH₄⁺）"],["关键酶与耗能","肌/肝ALT(转氨) + 肝糖异生(耗6ATP)","谷氨酰胺合成酶(耗1ATP) / 谷氨酰胺酶(分解)"],["核心生理意义","运氨出肌 + 肝向肌肉持续供应葡萄糖","氨的暂时储存、解毒与运输；脑氨中毒解毒关键"]],"quiz":{"stem":"关于谷氨酰胺在体内氨代谢中的作用，下列叙述错误的是：","options":["既是氨的运输形式，也是氨的解毒和储存形式","谷氨酰胺合成酶催化谷氨酸与NH₃结合并消耗ATP","该合成与分解过程由同一个酶催化可逆完成","临床上可输入谷氨酸盐辅助降低血氨"],"answer_idx":2,"explain":"谷氨酰胺的合成（谷氨酰胺合成酶，耗ATP）与水解（谷氨酰胺酶）由不同酶催化，各自不可逆。"}},"diagram_assets":[{"path":"assets/biochem_aa_ala_glc_cycle_p7.webp","caption":"丙氨酸-葡萄糖循环：骨骼肌借转氨将氨与丙酮酸打包为丙氨酸入肝，肝脏脱氨合成尿素并糖异生返还葡萄糖","source_page":7}]},{"id":"biochem_urea_cycle","title":"鸟氨酸循环（尿素合成五步与限速调节）","subject":"biochem","syllabus_refs":["syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肝脏“两步线粒体、三步胞质”耗3分子ATP(4高能键)将2分子NH₃和CO₂转化为无毒尿素。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P10-P24"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"线粒体第1步（启动限速）：NH₃ + CO₂ + 2ATP → 氨基甲酰磷酸","reveal":"由肝线粒体氨基甲酰磷酸合成酶Ⅰ (CPS-Ⅰ) 催化，N-乙酰谷氨酸 (AGA) 是其必需别构激活剂；精氨酸可激活AGA合酶。","mechanism_tag":"CPS-Ⅰ \u0026 AGA 变构激活"},{"cue":"线粒体第2步：与鸟氨酸缩合为瓜氨酸","reveal":"鸟氨酸氨基甲酰转移酶 (OCT) 催化瓜氨酸生成，随后瓜氨酸跨线粒体内膜进入胞质。","mechanism_tag":"跨膜出线粒体"},{"cue":"胞质第3–5步：天冬氨酸供第2个氮→裂解延胡索酸→释放尿素","reveal":"③ 瓜氨酸+天冬氨酸在精氨酸代琥珀酸合成酶（活性最低、决定稳态速度）催化下消耗ATP(→AMP+PPi)成精氨酸代琥珀酸；④ 裂解为精氨酸+延胡索酸（联结TCA循环）；⑤ 精氨酸酶水解出尿素并再生鸟氨酸。","mechanism_tag":"联结TCA循环 · 再生鸟氨酸"}],"takeaway":"总反应耗 3 ATP（4个高能磷酸键）；两个氮分别来自游离 NH₃ 和天冬氨酸；CPS-Ⅰ 负责启动，精氨酸代琥珀酸合成酶决定整体反应速度。","quiz":{"stem":"先天性N-乙酰谷氨酸(AGA)合酶完全缺陷的新生儿出现致死性高氨血症，其尿素循环直接卡死在哪一步？","options":["胞质精氨酸酶无法水解精氨酸释放出尿素分子","胞质精氨酸代琥珀酸无法裂解生成延胡索酸","线粒体CPS-Ⅰ失活致氨基甲酰磷酸无法合成","线粒体OCT失活致瓜氨酸无法运出细胞质基质"],"answer_idx":2,"explain":"N-乙酰谷氨酸(AGA)是肝细胞线粒体启动限速酶氨基甲酰磷酸合成酶Ⅰ(CPS-Ⅰ)的必需别构激活剂；缺乏AGA会导致NH₃与CO₂无法缩合生成氨基甲酰磷酸，循环首步即告中断。","remedial_node_id":"biochem_ammonia_transport"}},"diagram_assets":[{"path":"assets/biochem_aa_urea_cycle_p24.webp","caption":"肝脏鸟氨酸循环全景：线粒体CPS-Ⅰ/OCT两步与胞质精氨酸代琥珀酸合成酶/裂解酶/精氨酸酶三步及天冬氨酸-TCA耦合","source_page":24}]},{"id":"biochem_hyperammonemia_he","title":"高血氨症与肝性脑病的两条生化机制","subject":"biochem","syllabus_refs":["syl_biochem_031","syl_biochem_030"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肝衰或门体分流使血氨/胺类绕过解毒入脑：NH₃耗竭脑内α-酮戊二酸致ATP锐减；酪胺/苯乙胺转成假神经递质。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P16","2026-基医-氨基酸代谢-2.pdf#P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"线索1（氨中毒）：大量NH₃消耗脑内α-酮戊二酸","reveal":"过量NH₃逆推脑内GDH与谷氨酰胺合成酶反应：α-酮戊二酸 → 谷氨酸 → 谷氨酰胺。","mechanism_tag":"TCA 中间物被抽空"},{"cue":"能量衰竭与渗透性脑水肿","reveal":"α-酮戊二酸枯竭使脑细胞TCA循环受阻、ATP合成急剧下降；同时胞内谷氨酰胺堆积升高渗透压引发星形胶质细胞水肿，致嗜睡、昏迷。","mechanism_tag":"脑能量危机 + 水肿"},{"cue":"线索2（假神经递质）：肠道腐败胺绕肝入脑","reveal":"肠菌脱羧生成酪胺、苯乙胺，经门体侧支绕过肝灭活后入脑，经β-羟化酶生成β-羟酪胺与苯乙醇胺，竞争性取代去甲肾上腺素/多巴胺而抑制脑功能。","mechanism_tag":"假神经递质假说"}],"takeaway":"肝性脑病是“门体解剖分流 + 鸟氨酸循环解毒失败 + 脑TCA能量障碍/假神经递质”的三科交汇典型。","quiz":{"stem":"肝衰引发严重高氨血症并诱发昏迷和脑水肿时，过量NH₃在脑星形胶质细胞内引发能量危机的核心环节是？","options":["大量抽空α-酮戊二酸并堆积谷氨酰胺抬高渗透压","直接阻断呼吸链细胞色素氧化酶抑制氧化磷酸化","过度激活丙酮酸脱氢酶复合体耗竭胞质丙酮酸池","大量消耗脑内多巴胺与去甲肾上腺素耗尽突触囊泡"],"answer_idx":0,"explain":"过量NH₃进入脑后逆推GDH与谷氨酰胺合成酶，抽空TCA中间产物α-酮戊二酸合成谷氨酰胺，既断绝脑细胞ATP生成，又因谷氨酰胺胞内渗透压升高引发星形胶质细胞水肿。","remedial_node_id":"biochem_urea_cycle"}}},{"id":"biochem_asparaginase_leukemia","title":"【拓展】天冬酰胺酶选择性治疗白血病的生化基础","subject":"biochem","syllabus_refs":["syl_biochem_028"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"白血病细胞缺乏天冬酰胺合成酶，外源注射天冬酰胺酶耗竭血中天冬酰胺即可饿死肿瘤细胞。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P9"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["正常细胞可通过{{天冬酰胺合成酶}}（由{{谷氨酰胺}}提供酰胺基）自主合成天冬酰胺。","某些急性白血病细胞自身缺乏天冬酰胺合成酶，高度依赖血浆供给；应用{{天冬酰胺酶}}水解血中天冬酰胺为天冬氨酸，可选择性阻断白血病蛋白合成。"],"trap_note":"属于大纲拓展联系点，主干巡航默认折叠在邻域探索胶囊中。","quiz":{"stem":"临床注射左旋门冬酰胺酶治疗急性淋巴细胞白血病时，为何能够选择性“饿死”肿瘤细胞而较安全？","options":["白血病细胞缺乏谷氨酰胺酶无法转运血液中游离氨","白血病细胞缺乏天冬酰胺合成酶高度依赖血浆供给","正常肝细胞能够直接从尿素循环逆向再生出天冬酰胺","外源酶可穿过瘤细胞膜直接水解其胞内蛋白肽键"],"answer_idx":1,"explain":"正常细胞可利用天冬酰胺合成酶借谷氨酰胺酰胺基自主合成天冬酰胺；某些急性白血病细胞缺乏此酶，依赖血浆外源天冬酰胺，注射天冬酰胺酶耗竭血中天冬酰胺即可选择性杀伤肿瘤。","remedial_node_id":"biochem_ammonia_tran ":"assets/physio_nak_pump_cycle_p23.webp","caption":"Na⁺-K⁺泵六步构象循环：胞内E构象结合3Na⁺耗1ATP磷酸化转E-P构象排Na⁺，再结合2K⁺去磷酸化恢复E构象","source_page":23}]},{"id":"physio_resting_potential","title":"静息电位产生机制：K⁺ 平衡电位与生电钠泵修正","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"静息电位(-70~-90mV)主要源于膜对K⁺高通透性促使K⁺外流达电化学平衡，因少量Na⁺内流而略低于Ek。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P9-P16","生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P3-P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"前提条件：离子不均分布 + 静息膜选择性通透","reveal":"钠泵维持胞内高K⁺、胞外高Na⁺；静息时膜对离子通透比约为 K⁺ : Na⁺ = 1 : 0.01~0.05（K⁺通道开放为主）。","mechanism_tag":"基础稳态条件"},{"cue":"平衡确立：K⁺外流形成内负外正的扩散电位","reveal":"K⁺顺浓度差外流使膜内负电荷积聚，形成的电场力反过来阻止K⁺继续外流；当电化学驱动力 ECDF = Vm - Ek = 0 时达Nernst平衡电位(Ek)。","mechanism_tag":"Nernst 平衡"},{"cue":"实测修正：Vm 略小于(负值略低于) Ek 的原因","reveal":"因静息时仍有微弱Na⁺内流部分抵消K⁺外流，实测静息电位绝对值略小于Ek；而钠泵3出2入的生电作用额外贡献不超过5%的超极化。","mechanism_tag":"GHK 方程修正"}],"takeaway":"膜电位向某一离子的平衡电位移动规则：哪种离子通透性骤增，Vm就迅速扑向该离子的平衡电位！","quiz":{"stem":"临床高钾血症使细胞外[K⁺]o明显升高（仍低于[K⁺]i），其对静息电位(Vm)及电化学驱动力的直接改变是：","options":["K⁺平衡电位负值减小导致膜静息去极化","K⁺外流电化学驱动力骤增引起膜超极化","膜对Na⁺静息通透性骤增触发反极化超射","Cl⁻平衡电位大幅正移主导静息电位逆转"],"answer_idx":0,"explain":"依Nernst公式，[K⁺]o升高缩小[K⁺]i/[K⁺]o比值，使Ek负值减小（如-90mV移向-70mV），进而把主要由K⁺通透主导的Vm拉向去极化方向。","remedial_node_id":"physio_membrane_transport"}},"diagram_assets":[{"path":"assets/physio_resting_ecdf_p10.webp","caption":"静息跨膜电化学驱动力(ECDF = Vm − Ex)：K⁺呈+20mV外向驱动、Cl⁻近平衡0mV、Na⁺达-130mV强内向驱动","source_page":10}]},{"id":"physio_action_potential","title":"动作电位产生、Na⁺ 通道三态与不应期传导","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"阈刺激触发电压门控Na⁺通道正反馈开放（去极化超射）随后失活并叠加延迟K⁺外流复极，呈“全或无”不衰减传导。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P20-P35","生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P18-P35"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"去极上升支：达阈电位后Na⁺通道呈正反馈再生开放","reveal":"局部去极化至阈电位，电压门控Na⁺通道从“静息态”一过性转为“激活态”，Na⁺迅速内流（内向电流）形成去极化与超射，逼近E_Na。","mechanism_tag":"G_Na 骤增 · 全或无"},{"cue":"复极下降支与绝对不应期：Na⁺通道失活 + K⁺延迟外流","reveal":"去极化迅速触发Na⁺通道进入“失活态”（此时任何强刺激都无法再激活，构成绝对不应期），同时电压门控K⁺通道延迟激活使K⁺大量外流复极。","mechanism_tag":"失活态决定不应期"},{"cue":"兴奋传导：局部电流与有髓纤维跳跃传导","reveal":"同一细胞膜上通过局部电流使邻近未兴奋区达阈电位，动作电位幅度不衰减传导；在有髓神经纤维上仅在郎飞结产生兴奋呈高速跳跃式传导。","mechanism_tag":"局部电流不衰减"}],"takeaway":"局部电位（电紧张扩布、可总和、衰减）vs 动作电位（全或无、不衰减传导、有绝对不应期）。","quiz":{"stem":"若药物选择性延长神经元电压门控Na⁺通道“失活态”向“静息态”复活所需时间，最直接改变的是：","options":["静息电位因K⁺漏通道受阻而显著超极化","单次动作电位上升支瞬间反转变为负相","无髓纤维局域电流立即转为有髓跳跃传导","动作电位后的绝对不应期与最小发火间隔延长"],"answer_idx":3,"explain":"只有等Na⁺通道h门从失活态恢复至静息态后膜才能再次被激活；拖延失活态复活会直接拉长绝对不应期，从而降低高频放电极限。","remedial_node_id":"physio_resting_potential"}},"diagram_assets":[{"path":"assets/physio_nav_states_p28.webp","caption":"电压门控Na⁺通道三态门控(m/h门：静息→激活→失活)与电压门控K⁺通道(n门：静息→延迟激活)构象转换","source_page":28}]},{"id":"histo_chemical_synapse","title":"化学突触的超微结构（前膜、间隙与后膜）","subject":"histology","syllabus_refs":["syl_histology_041"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"化学突触由突触前成分（含囊泡与线粒体）、20–30nm突触间隙和含受体/酶的突触后膜组成，确保单向传递。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx","肌细胞的收缩-基础医学分论2026-chyh.pdf#P3","第五讲 神经组织（基础医学，2023）.pptx#P29-P33"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["突触前成分（如轴突终末/运动终板前膜）：含大量线粒体与{{突触囊泡}}（每个囊泡含约10⁴个{{ACh}}分子）及前膜致密投影。","突触间隙：宽约 {{20–30 nm}} 的细胞外隙，内含细胞外基质与分解递质的酶（如神经-肌接头间隙侧的{{乙酰胆碱酯酶 AChE}}）。","突触后成分（如终板膜）：胞质侧有电子致密物质，膜上密集镶嵌特异性受体离子通道（终板膜为{{N₂型ACh受体}}阳离子通道）。"],"trap_note":"电突触本质是缝隙连接（双向、几乎无延搁，如心肌闰盘）；化学突触只能从前膜向后膜单向传递且存在时间延搁。","quiz":{"stem":"若药物选择性耗竭突触前终末囊泡表面的突触素Ⅰ并抑制囊泡向活性带锚定融合，此时即便动作电位正常抵达突触前膜，仍必然直接受阻的生理特征是：","options":["经连接子蛋白完成的双向高速电传递","动作电位沿有髓轴突的郎飞结跳跃传导","突触后膜受体对静息电位平衡的维持","由前膜向后膜呈现时间延搁的单向传递"],"answer_idx":3,"explain":"化学突触以突触囊泡（表面附突触素I与细胞骨架锚定，Ca²⁺内流促发解离胞吐）释放神经递质跨越10–30nm间隙作用于后膜受体，因此决定其只能从前膜向后膜单向传递且伴突触延搁；电突触则依赖缝隙连接直接传电流（P31, P33）。","remedial_node_id":"histo_neuro_processes_classification"}},"diagram_assets":[{"path":"assets/histo_neuro_chemical_synapse_p33.webp","caption":"化学突触三元超微构筑（P33）：前成分突触小泡(表面附突触素I)与线粒体、10–30nm突触间隙及后膜受体离子通道","source_page":33}]},{"id":"physio_nmj_transmission","title":"骨骼肌神经-肌接头兴奋传递（Ca²⁺ 触发量子式释放）","subject":"physiology","syllabus_refs":["syl_physiology_008"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"电-化学-电三步转换：神经AP→Ca²⁺内流→ACh囊泡量子释放→N₂受体阳离子通道开→终板电位(EPP)扩布引发肌膜AP。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P3-P9"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"电 → 化学耦联：前膜Ca²⁺内流促发ACh量子式释放","reveal":"神经末梢AP开放前膜电压门控Ca²⁺通道，Ca²⁺内流触发约125个囊泡与前膜融合出胞（1个囊泡即1个量子，自发释放1个仅产生微终板电位mEPP）。","mechanism_tag":"Ca²⁺ 依赖的量子释放"},{"cue":"化学 → 电转换：终板膜产生去极化终板电位 (EPP)","reveal":"ACh结合终板膜N₂型ACh受体阳离子通道（Na⁺内流为主、少量K⁺外流），产生50–75 mV去极化局部电位——终板电位(EPP)。","mechanism_tag":"N₂受体 · 1:1高安全系数"},{"cue":"肌膜扩布与终止：触发一般肌膜AP \u0026 AChE迅速消除","reveal":"EPP电紧张扩布至邻近一般肌膜达阈电位激发肌膜动作电位；ACh在几毫秒内被终板膜间隙侧AChE分解。筒箭毒碱、α-银环蛇毒阻断N₂受体可致肌麻痹。","mechanism_tag":"AChE 终止信号"}],"takeaway":"记住神经-肌接头传递六大特征：化学性、单向、时间延搁、EPP属局部电位、安全系数高呈1:1传递、易受毒物/内环境影响。","quiz":{"stem":"Lambert-Eaton肌无力综合征患者体内存在抗突触前膜电压门控Ca²⁺通道抗体，其神经-肌接头传递最核心的阻塞环节是：","options":["终板膜N₂型ACh受体阳离子通道失去Na⁺通透性","突触间隙乙酰胆碱酯酶(AChE)过速水解已释放递质","运动神经轴突动作电位无法传导到达神经末梢终扣","动作电位触发的ACh囊泡量子式同步融合释放锐减"],"answer_idx":3,"explain":"前膜Ca²⁺内流是触发约125个ACh囊泡同步胞吐产生足够大终板电位(50-75mV)的必经耦联；前膜VGCC被阻断会直接削减量子释放量而非阻断后膜N₂受体。","remedial_node_id":"histo_chemical_synapse"}},"diagram_assets":[{"path":"assets/physio_nmj_pathway_p04.webp","caption":"神经-肌接头兴奋传递①–⑧过程：前膜Ca²⁺内流→ACh量子释放→N₂受体阳离子通道开→EPP扩布触发肌膜AP→AChE水解回收","source_page":4}]},{"id":"histo_skeletal_muscle_triad","title":"骨骼肌超微结构：肌节排列与三联管","subject":"histology","syllabus_refs":["syl_histology_034","syl_physiology_008"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"相邻两Z线间为一个肌节（1/2 I带 + A带 + 1/2 I带）；T小管与两侧肌浆网终池构成三联管完成兴奋耦联。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P10-P16","2026-基础医学分论-血液、肌组织.pptx#P30-P35"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["基本收缩单位：相邻两条 {{Z线}} 之间的区段称为{{肌节(sarcomere)}}，包含 ½明带(I带)+暗带(A带)+½明带(I带)。","肌丝分子构成：粗肌丝由{{肌球蛋白(myosin)}}组成，其头部连桥臂构成横桥（具{{ATP酶}}活性）；细肌丝由肌动蛋白、原肌球蛋白与肌钙蛋白按 {{7:1:1}} 比例组成。","肌钙蛋白(Troponin)三亚基：{{TnC}}结合Ca²⁺、TnI抑制肌动蛋白结合位点、TnT连于原肌球蛋白。","兴奋-收缩耦联结构基础：{{横管(T管)}}与两侧相邻肌浆网{{终池}}在A-I交界处紧密相贴，构成{{三联管(triad)}}（心肌在Z线水平多为二联管）。"],"trap_note":"肌肉收缩时肌节缩短、明带(I带)与H带变窄，而暗带(A带)以及粗、细肌丝本身的长度均保持不变！","quiz":{"stem":"骨骼肌纤维在电镜下每条肌节出现两个三联管，若某基因突变导致横小管(T管)与终池之间发生解剖脱耦联，即使肌膜产生正常动作电位仍将瘫痪，直接卡在：","options":["相邻Z线之间明暗带无法在静息时对齐排列","细肌丝肌动蛋白完全降解失去与Z线锚定","兴奋无法由A-I交界传入触发终池释放Ca²⁺","粗肌丝豆芽状横桥失去自身ATP酶水解活性"],"answer_idx":2,"explain":"骨骼肌横小管由肌膜在A-I带交界处垂直内陷环绕肌原纤维，两侧紧贴肌浆网膨大的终池构成“三联管”；只有三联管结构耦合完好，肌膜动作电位才能迅速传入深部触发终池释放Ca²⁺。","remedial_node_id":"histo_muscle_general_classification"}},"diagram_assets":[{"path":"assets/histo_hema_muscle_skeletal_triad_p32.webp","caption":"骨骼肌纤维超微立体剖面图：A带/I带/Z盘肌节排布、肌浆网纵管终池与横小管在A-I交界构成三联管","source_page":32}]},{"id":"physio_ec_coupling_sliding","title":"横纹肌兴奋-收缩耦联与横桥周期（肌丝滑行）","subject":"physiology","syllabus_refs":["syl_physiology_008","syl_histology_035"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"Ca²⁺是耦联因子：T管兴奋触发终池RyR放Ca²⁺→Ca²⁺结合TnC移开原肌球蛋白→横桥扭动45°拉细肌丝向M线滑行。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P10-P18"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"兴奋→Ca²⁺释放（三联管耦联）","reveal":"肌膜AP沿T管传入，使T管膜L型Ca²⁺通道(DHPR)变构并机械偶联激活肌浆网终池兰尼碱受体(RyR)，胞质[Ca²⁺]骤增约100倍。","mechanism_tag":"机械偶联放 Ca²⁺"},{"cue":"位点暴露（细肌丝去抑制）","reveal":"Ca²⁺结合肌钙蛋白TnC亚基引发构象变构，减弱TnI抑制并把原肌球蛋白推入细肌丝双螺旋沟槽深部，暴露肌动蛋白上的横桥结合位点。","mechanism_tag":"TnC 构象解除抑制"},{"cue":"横桥周期：扭动滑行、ATP解离复位与Ca²⁺回收舒张","reveal":"高势能横桥结合肌动蛋白并释放ADP+Pi，头部向M线扭动45°产生棘齿作用拖动细肌丝滑行；必须结合新ATP才能使横桥与肌动蛋白分离并水解ATP复位（死后缺ATP出现尸僵）。停止兴奋后肌浆网钙泵(SERCA)耗ATP回收Ca²⁺致舒张。","mechanism_tag":"ATP 兼供解离与复位"}],"takeaway":"ATP在横桥周期中的双重铁律：水解ATP给横桥“上弦蓄能”，结合新ATP才能让横桥“松手分离”。","quiz":{"stem":"动物死后ATP耗竭却仍有充分胞质Ca²⁺残留时会出现骨骼肌“尸僵”，其分子机理直接卡在横桥周期哪一环节？","options":["横管DHPR无法感知肌膜静息电位去极化","肌球蛋白头部缺新ATP结合而难与肌动蛋白分离","肌钙蛋白TnC失去结合胞质游离Ca²⁺的构象能力","肌浆网终池RyR1通道持续锁死无法开放释钙"],"answer_idx" 神经肌萎缩；注意“假性肥大”"],["肥大 (Hypertrophy)","细胞体积增大、细胞器增多","高血压左室心肌代偿性肥大、妊娠子宫平滑肌"],["增生 (Hyperplasia)","实质细胞数量增多","妊娠期乳腺增生、前列腺增生（仅具分裂能力细胞可发生）"],["化生 (Metaplasia)","一种已分化细胞转化为另一种同源成熟细胞","长期吸烟支气管纤毛柱状上皮→鳞状上皮化生；胃肠上皮化生"]],"quiz":{"stem":"老烟民支气管活检示部分假复层纤毛柱状上皮被分化良好的复层鳞状上皮替代，无明显核异型或基底膜突破。针对这一适应性改变临床后果的逆向推断，下列说法最准确的是：","options":["虽提高抗烟雾摩擦力却削弱纤毛清痰易发感染","由成熟纤毛柱状上皮直接分裂转变并立即癌变","已属跨越胚层界的不可逆肿瘤前原位癌阶段","腺体分泌黏液能力增强且伴软骨骨基质钙化"],"answer_idx":0,"explain":"支气管鳞状上皮化生（P47-P48）源自基底储备细胞在慢性烟雾刺激下重新分化，短期内以坚韧的复层鳞状上皮耐受刺激，却因丧失了原本柱状上皮的纤毛摆动与黏液屏障功能而显著削弱呼吸道清除力、增加反复感染风险；若持续刺激才可能历经不典型增生进展为鳞癌，化生本身尚可逆。","remedial_node_id":"patho_atrophy_metaplasia_morphology"}},"diagram_assets":[{"path":"assets/patho_injury_metaplasia_bronchus_p48.webp","caption":"慢性支气管炎黏膜假复层纤毛柱状上皮化生为复层鳞状上皮","source_page":48}]},{"id":"patho_hydropic_degeneration","title":"缺氧所致细胞水肿机制与光镜/电镜病变","subject":"pathology","syllabus_refs":["syl_pathology_005"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"缺氧或毒物抑制线粒体ATP生成→细胞膜Na⁺-K⁺泵衰竭→Na⁺与水大量潴留胞内，镜下呈现颗粒变性/气球样变。","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P18-P21","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P55-P60"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"分子起点：缺血/缺氧 → 氧化磷酸化障碍、ATP↓","reveal":"损伤因子直接损伤线粒体使ATP骤降，胞膜上高度耗能的Na⁺-K⁺泵活性迅速衰竭。","mechanism_tag":"能量泵衰竭"},{"cue":"渗透失衡：胞内Na⁺潴留触发水分子大量内移","reveal":"Na⁺无法泵出而滞留胞质，细胞内渗透压升高吸引水分进入；同时无氧酵解产乳酸使胞内pH下降、溶酶体膜通透性增高。","mechanism_tag":"钠水潴留"},{"cue":"形态演进：颗粒变性 → 疏松空泡变 → 气球样变（可逆上限）","reveal":"电镜见线粒体肿胀嵴变短、内质网扩张；光镜见细胞肿大、胞质淡染出现红染细颗粒或透亮空泡（病毒性肝炎见气球样变）；大体器官肿胀包膜紧张、切面浑浊。","mechanism_tag":"可逆性损伤形态"}],"takeaway":"细胞水肿是最常见、最早发生的可逆性损伤；解除缺氧后ATP恢复、钠泵重启即可复原，持续加重则滑向坏死。","quiz":{"stem":"急性病毒性肝炎患者肝穿刺见肝细胞体积显著肿大、胞质疏松淡染呈气球样变，电镜见线粒体肿胀、嵴变短及粗面内质网扩张形成大小不等囊泡。直接解释这一形态学演变的亚细胞离子转运障碍在于：","options":["高尔基体囊泡主动泵出钠水加速胞浆脱水","ATP匮乏使细胞膜钠泵失效致Na⁺水滞留","溶酶体大量自噬肝糖原转化成低渗黏多糖颗粒","氯离子通道持续开放驱动细胞外钙主动排出"],"answer_idx":1,"explain":"线粒体受损致氧化磷酸化减产、ATP匮乏，使细胞膜Na⁺/K⁺-ATP酶泵（钠泵）失效，Na⁺滞留胞内形成渗透压梯度吸引水分子涌入，表现为光镜下胞体肿大、胞质颗粒/气球样变，电镜下恰见线粒体与内质网囊泡状肿胀。","remedial_node_id":"physio_membrane_transport"}},"diagram_assets":[{"path":"assets/patho_injury_hydropic_swelling_p57.webp","caption":"肝细胞水肿（胞体肿大、胞质淡染颗粒/水变性）与正常肝小叶对比","source_page":57}]},{"id":"patho_fatty_change","title":"脂肪变（肝脂肪变与虎斑心）","subject":"pathology","syllabus_refs":["syl_pathology_006"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"非脂肪细胞胞质内蓄积中性脂肪滴（甘油三酯），HE制片因脂滴溶解呈大小不等的空泡，需苏丹Ⅲ或油红O冰冻切片染色证实。","source_slides":["《基础医学分论》病理部分大纲 · 脂肪变","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P61-P69"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["肝脂肪变机制：游离脂肪酸进入过多、{{脂肪酸β-氧化}}障碍（如缺氧/酒精）、或脂蛋白合成（{{载脂蛋白}}缺乏）排泄受阻。","病理切片识别技巧：常规石蜡切片制作中有机溶剂溶去脂滴，HE下仅见{{境界清楚的圆形空泡}}，易将细胞核挤向一侧；确诊需做冰冻切片{{苏丹Ⅲ}}（橘红）或油红O染色。","心肌脂肪变（{{虎斑心}}）：慢性缺氧或严重贫血时，左心室内膜下及乳头肌心肌细胞呈成排黄色条纹，与未受累红褐色心肌相间呈虎皮斑纹状。"],"trap_note":"注意区分脂肪变（胞质内蓄积空泡，实质细胞受累）与心肌脂肪浸润（心外膜脂肪组织增生深入心肌间质，易致心脏破裂）。","quiz":{"stem":"重度缺铁性贫血尸检见左心室心内膜下及乳头肌表面呈红黄相间的平行条纹（虎斑心），冰冻切片苏丹Ⅲ染色证实黄色条纹区心肌胞质蓄积大量甘油三酯空泡。黄色脂肪变条纹为何主要局限于心内膜下而非呈全心肌均质弥漫？","options":["心外膜处冠状动脉分支末梢最易发生脂蛋白渗出","乳头肌静息时仅依赖无氧糖酵解合成甘油三酯","心内膜下处于供氧最薄弱区率先受缺氧抑制氧化","右心室心肌细胞缺乏酯酰辅酶A无法蓄积中性脂"],"answer_idx":2,"explain":"心肌主要依靠脂肪酸β-氧化供能。重度贫血致全身慢性缺氧时，左心室内膜下及乳头肌位于冠脉垂直穿支最末梢、且受心室收缩压迫影响，供氧最薄弱，局部心肌β-氧化率先受抑使甘油三酯蓄积呈黄色条纹，并与供氧相对较好的暗红心肌区交替形成“虎斑心”。","remedial_node_id":"biochem_tg_synthesis_fatty_liver"}},"diagram_assets":[{"path":"assets/patho_injury_tiger_heart_p67.webp","caption":"心肌脂肪变（虎斑心）：心内膜下及乳头肌呈红黄相间虎斑状条纹","source_page":67}]},{"id":"patho_necrosis_types","title":"细胞坏死核改变及六种坏死病理类型鉴别","subject":"pathology","syllabus_refs":["syl_pathology_010","syl_pathology_011"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"坏死的形态金标准是核固缩→核碎裂→核溶解；不同组织成分和酶活性决定凝固性、液化性、干酪样、脂肪、纤维蛋白样坏死及坏疽。","source_slides":["《基础医学分论》病理部分大纲 · 坏死","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P98-P117"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["坏死类型","核心特征与机制","好发器官/疾病代表"],"rows":[["凝固性坏死","蛋白质凝固，灰黄干燥、早期组织轮廓仍保留","心、肾、脾贫血性梗死（干酪样坏死属特殊彻底类型，见于结核）"],["液化性坏死","蛋白少脂质多或蛋白酶丰富，组织彻底溶解液化","脑软化(脑梗死)、化脓性炎脓肿、阿米巴肝脓肿"],["脂肪坏死","胰酶释放或创伤释放脂肪酸与Ca²⁺结合成钙皂","急性胰腺炎（酶解性）、乳腺外伤性脂肪坏死"],["纤维蛋白样坏死","免疫复合物沉积或高血压致胶原/血管壁坏死似纤维素","风湿病、结节性多动脉炎、急进性高血压小动脉"],["坏疽 (Gangrene)","大块坏死伴不同程度腐败菌感染发黑","干性（四肢末梢干燥边界清）/ 湿性（肠、肺、子宫）/ 气性（深创产气荚膜）"]],"quiz":{"stem":"三份病理标本分别表现为：①急进型高血压肾入球小动脉壁大片强嗜酸性无结构粉染物；②大面积脑梗死数日后呈混浊液态软化灶；③干酪样坏死灶经久形成彻底无轮廓细颗粒粉染物。将①②③病理学坏死类型依次配对正确的是：","options":["凝固性坏死、干酪样坏死、脂肪酶解坏死","干性坏疽、液化性坏死、纤维蛋白样坏死","纤维蛋白样坏死、凝固性坏死、气性坏疽","纤维蛋白样坏死、液化性坏死、干酪样坏死"],"answer_idx":3,"explain":"①急进型高血压血管壁免疫复合物或剧烈机械损伤致血浆纤维蛋白原渗入并转化呈红染无结构颗粒（似纤维素），属纤维蛋白样坏死；②脑组织富含脂质且蛋白质少，缺血后酶迅速将其完全液化呈软化灶；③结核干酪样坏死脂质极高致坏死彻底，组织原有轮廓完全消失，区别于普通凝固性坏死保留轮廓的特征。","remedial_node_id":"patho_hydropic_degeneration"}},"diagram_assets":[{"path":"assets/patho_injury_necrosis_nuclear_p101.webp","caption":"坏死基本核改变三步曲：核固缩（pyknosis）→ 核碎裂（karyorrhexis）→ 核溶解（karyolysis）","source_page":101}]},{"id":"patho_necrosis_outcomes","title":"坏死的四大结局（溶解吸收、分离排出、机化、钙化）","subject":"pathology","syllabus_refs":["syl_pathology_012"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"坏死灶依大小与位置走向溶解吸收、经管道排空形成空洞/溃疡、肉芽组织机化包裹，或发生营养不良性钙化。","source_slides":["《基础医学分论》病理部分大纲 · 坏死结局","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P118-P121"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["① 溶解吸收：小坏死灶由中性粒细胞与巨噬细胞释放蛋白水解酶液化，经淋巴管/血管吸收。","② 分离排出：较大坏死灶与周围组织分解脱落——皮肤黏膜形成深达黏膜下层的{{溃疡(ulcer)}}；肾肺等内脏排出后遗留{{空洞(cavity)}}；深部连至体表开口管道称{{窦道}}，通连两腔或皮肤与体腔称{{瘘管}}。","③ {{机化(organization)}}：不能完全溶解吸收的坏死物、血栓或纤维素渗出物，被新生的{{肉芽组织}}取代并最终形成瘢痕的过程。","④ 包裹与钙化：过大坏死灶周围纤维结缔组织增生将其包裹，随后发生{{营养不良性钙化}}。"],"trap_note":"机化（Granulation tissue 取代坏死/血栓）≠ 化生（成熟细胞类型转变），考试名词解释极易混淆！","quiz":{"stem":"一名患者肺实质深部存在直径约2.5 cm、内容物富含脂质的慢性结核干酪样坏死灶，既未靠近支气管开口，也因体积过大及胶原基质阻挡无法被巨噬细胞短时溶解吸收。临床上该病灶最典型且稳定的转归顺序是：","options":["在中性粒细胞溶酶体作用下数日彻底吸净","经肺泡壁直接分离脱落并形成空洞排出肺外","邻近肺泡上皮完全再生取代整个坏死肺叶","周围肉芽组织长入机化或成纤维包裹并钙化"],"answer_idx":3,"explain":"深部较大、难以在短期溶解吸收或分离排出的坏死灶（尤其结核干酪样坏死），机体主要通过周围新生毛细血管和成纤维细胞组成的肉芽组织向内长入，溶解吸收坏死物并逐步胶原化瘢痕形成（机化）；若坏死灶过大仅周边机化则形成纤维包裹，并常继发营养不良性钙化趋于稳定。","remedial_node_id":"histo_lct_fibroblast"}},"diagram_assets":[{"path":"assets/patho_injury_organization_p120.webp","caption":"坏死机化流程：新生肉芽组织长入坏死灶吸收替代并最终纤维瘢痕化","source_page":120}]},{"id":"patho_calcification_types","title":"营养不良性钙化 vs 转移性钙化","subject":"pathology","syllabus_refs":["syl_pathology_015"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"营养不良性钙化血钙正常、局限于变性坏死组织；转移性钙化源于全身高钙血症、沉积于未受损正常组织。","source_slides":["《基础医学分论》病理部分大纲 · 病理性钙化","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P91-P93"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["比较点","营养不良性钙化","转移性钙化"],"rows":[["血钙 / 血磷浓度","正常（无全身钙磷代谢障碍）","显著升高（全身钙磷代谢异常）"],["沉积部位与前提","局部变性、坏死组织或异物（先伤后钙）","多处正常健康组织：肺泡壁、肾小管、胃黏膜（先钙后伤）"],["典型疾病实例","结核干酪样坏死钙化、动脉粥样硬化斑块、血栓静脉石","甲状旁腺功能亢进、骨肿瘤溶骨破坏、VitD中毒"]],"quiz":{"stem":"甲患者血钙、血磷及甲状旁腺激素均完全正常，冠状动脉粥样硬化纤维帽深处坏死灶却见大片蓝紫色钙盐沉着；乙患者血钙显著升高、双侧肾小管基膜与胃黏膜多灶性钙盐沉着。对甲、乙两类钙化本质分型及机制判定正确的是：","options":["甲为转移性钙化且局部碱性磷酸酶活性受抑","两者皆需血钙超标方可在受损细胞线粒体沉积","甲为营养不良性局部钙化而乙属全身高钙转移型","乙因器官发生坏死释放大量磷脂引流高钙盐"],"answer_idx":2,"explain":"甲血钙磷代谢正常，钙盐（磷酸钙/碳酸钙）选择性沉积于坏死或变性粥样斑块、血栓等局部受损组织（线粒体先钙化及局部碱性偏高促成核），属营养不良性钙化；乙由于甲状旁腺功能亢进等钙磷代谢紊乱导致高血钙，钙盐广泛沉积于本无预先损伤的正常排酸器官（肾、肺、胃黏膜），属转移性钙化。","remedial_node_id":"patho_necrosis_outcomes"}},"diagram_assets":[{"path":"assets/patho_injury_calcification_p92.webp","caption":"病理性钙化：变性坏死组织中蓝紫色无定形钙盐颗粒沉着（HE染色）","source_page":92}]},{"id":"patho_apoptosis_vs_necrosis","title":"【拓展】细胞凋亡 vs 细胞坏死形态与炎症差异","subject":"pathology","syllabus_refs":["syl_pathology_010","syl_pathology_013"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"凋亡是基因主动调控（Caspase级联）的单细胞缩水程序性死亡，膜完整、形成凋亡小体、不引发周围炎症。","source_slides":["《基础医学分论》病理部分大纲 · 凋亡与坏死","细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P126-P131"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["对比特征","细胞坏死 (Necrosis)","细胞凋亡 (Apoptosis)"],"rows":[["诱导与范围","强烈病理打击 · 成片细胞","生理/轻度损伤基因编程 · 单个散在细胞"],["细胞体积与质膜","细胞肿胀、胞膜破裂内容物外溢","细胞皱缩固缩、胞膜完整出芽成“凋亡小体”"],["DNA 降解与电泳","随机降解 → 琼脂糖电泳呈弥散涂片状","核小体间规律断裂 → 特征性 180–200bp 梯状条带"],["周围组织反应","必然引起明显急性炎症反应","巨噬细胞静默吞噬凋亡小体，无炎症反应"]],"quiz":{"stem":"实验分别提取药物诱导后的两组离体肝细胞行电镜观察及DNA凝胶电泳：A组见胞膜完整性保持至晚期、核染色质紧贴核膜呈新月形边集、电泳呈180–200 bp梯状条带且周边巨噬细胞吞噬无水肿坏死碎屑；B组膜早破、胞浆内容物溢散。A组最符合下列哪项判据？","options":["属耗能主动程控的细胞凋亡且伴膜PS外翻","属缺血骤停供能所致早期可逆性细胞水肿","属炎症小体激活GSDMD质膜打孔所致焦亡","属被动坏死因细胞数量过少才未触发炎症反应"],"answer_idx":0,"explain":"细胞凋亡在形态与生化上同步具备：质膜始终完整（不泄漏胞浆酶）、核染色质固缩呈新月/块状边集、内切酶于核小体间精确切出180–200 bp DNA梯带，以及膜内叶磷脂酰丝氨酸（PS）外翻募集邻近细胞/巨噬细胞无炎吞噬凋亡小体；焦亡则发生质膜打孔肿胀破裂并剧烈放炎，坏死则电泳呈弥漫涂片状并引发中性粒细胞浸润。","remedial_node_id":"patho_apoptosis_mechanisms"}},"diagram_assets":[{"path":"assets/patho_injury_apoptosis_lm_em_p126.webp","caption":"凋亡镜下与超微特征：单个细胞固缩深染、核染色质半月边集及膜包被凋亡小体","source_page":126}]},{"id":"anat_vein_characteristics","title":"体循环静脉结构共性与深浅静脉分布规律","subject":"anatomy","syllabus_refs":["syl_anatomy_222"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"静脉壁薄腔大、含防止逆流的静脉瓣，分浅静脉（皮下采血输液）与伴行动脉的深静脉，吻合与变异丰富。","source_slides":["16 基础医学 静脉 淋巴.pdf#P3-P7"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["五大结构特点：① 壁薄、腔大、弹性小、压力小；② 四肢静脉内含向心单向开放的{{静脉瓣}}防止血液倒流；③ 分深、浅两套系统；④ 吻合多；⑤ 变异多。","深浅分工：{{浅静脉}}位于皮下浅筋膜内不与动脉伴行，临床常用于静脉注射、输液与采血；{{深静脉}}多与同名动脉伴行。","特殊静脉：{{硬脑膜窦}}壁无平滑肌且无瓣膜（颅外骨折或感染易致颅内出血或扩散）；板障静脉与导静脉沟通颅内外。"],"trap_note":"并非所有静脉血都是低氧静脉血：左右共4条肺静脉流回左心房的都是含氧丰富的动脉血！"}},{"id":"anat_danger_triangle_face","title":"面部“危险三角”面静脉感染颅内扩散路径","subject":"anatomy","syllabus_refs":["syl_anatomy_222","syl_anatomy_219"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"鼻根至两侧口角三角区内的面静脉缺乏功能性静脉瓣，挤压疖肿可逆流经内眦静脉→眼上静脉→颅内海绵窦。","source_slides":["16 基础医学 静脉 淋巴.pdf#P12-P14"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"解剖定位：鼻根至两侧口角的面部三角区","reveal":"面静脉起于内眦静脉，经面部斜行向下汇入颈内静脉；该段面静脉缺乏功能性静脉瓣膜且面部肌肉收缩易挤压血管。","mechanism_tag":"无瓣膜交通薄弱区"},{"cue":"逆行通路1（直接眶内通路）","reveal":"挤压危险三角区疖肿时，细菌栓子可逆行向上：面静脉 → 内眦静脉 → 眼上静脉 → 眶上裂 → 颅内海绵窦。","mechanism_tag":"眼上静脉逆流"},{"cue":"逆行通路2（翼静脉丛通路）与临床后果","reveal":"也可经面深静脉 → 翼静脉丛 → 卵圆孔/破裂孔导静脉入海绵窦，引发致命的海绵窦血栓性静脉炎或颅内感染。","mechanism_tag":"海绵窦颅内蔓延"}],"takeaway":"记忆核心：面部危险三角禁挤压——缺乏静脉瓣 + 眼上静脉/翼静脉丛直接交通海绵窦。"}},{"id":"anat_upper_limb_veins","title":"上肢三大浅静脉行程与临床静脉穿刺路径","subject":"anatomy","syllabus_refs":["syl_anatomy_226"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"手背静脉网桡侧起头静脉（穿锁胸筋膜入腋静脉），尺侧起贵要静脉（入肱/腋静脉），肘窝斜连肘正中静脉供采血。","source_slides":["16 基础医学 静脉 淋巴.pdf#P15-P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["{{头静脉 (Cephalic v.)}}：起自手背静脉网桡侧 → 沿前臂及臂外侧（肱二头肌外侧沟）上行 → 经三角肌胸大肌间沟穿锁胸筋膜注入{{腋静脉}}（或锁骨下静脉）。","{{贵要静脉 (Basilic v.)}}：起自手背静脉网尺侧 → 沿前臂及臂内侧（肱二头肌内侧沟）上行 → 在臂中点穿深筋膜注入{{肱静脉}}（或直接续为腋静脉，较直且口径大，常选作PICC置管）。","{{肘正中静脉 (Median cubital v.)}}：在肘窝处由头静脉斜向内上连向贵要静脉，粗短浅表且有深穿支固定不易滑动，是临床静脉{{采血和注射}}首选部位。"],"trap_note":"口诀：“头外侧、贵要内、正中肘窝连两家”；注意贵要静脉因径直汇入腋静脉→锁骨下静脉→上腔静脉，是经外周中心静脉置管(PICC)的首选。"}},{"id":"anat_lower_limb_veins","title":"下肢大、小隐静脉行程与静脉曲张机制","subject":"anatomy","syllabus_refs":["syl_anatomy_233"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"大隐静脉起足背内侧经内踝前方入股静脉（全身最长浅静脉）；小隐静脉经外踝后方入腘静脉；瓣膜关闭不全致曲张。","source_slides":["16 基础医学 静脉 淋巴.pdf#P22-P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["对比特征","大隐静脉 (Great saphenous v.)","小隐静脉 (Small saphenous v.)"],"rows":[["起点与踝部标志","足背静脉弓内侧端 → 经内踝前方（临床切开/穿刺标志）","足背静脉弓外侧端 → 经外踝后方"],["上行路径与注入","沿小腿及大腿内侧上行，穿隐静脉裂孔注入股静脉","沿小腿后面正中上行至腘窝，穿深筋膜注入腘静脉"],["临床意义","全身最长浅静脉；下肢静脉曲张高发部位；冠状动脉搭桥常用取材","与大隐静脉及深静脉借穿静脉广泛交通，深静脉血栓致水肿"]],"quiz":{"stem":"在急诊行下肢浅静脉切开术时，为定位大隐静脉最恒定的体表解剖标志是：","options":["外踝后方 1 cm 处","内踝前方（足背静脉弓内侧端延续）","腘窝正中深筋膜深面","腹股沟韧带下方外侧"],"answer_idx":1,"explain":"记住“大内前、小外后”：大隐静脉恒定行于内踝前方，小隐静脉行于外踝后方。"}}},{"id":"pathophys_stress_axes","title":"应激核心神经内分泌轴（蓝斑-交感 vs HPA 轴）与应激性溃疡","subject":"pathophys","syllabus_refs":["syl_pathophys_007","syl_pathophys_008","syl_pathophys_009"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"应激即时激活蓝斑-交感-肾上腺髓质系统(LC/NE，儿茶酚胺↑)与HPA轴(糖皮质激素↑)；胃黏膜缺血+酸分泌诱发应激性溃疡。","source_slides":["应激-20251029.pdf","《基础医学分论》病理生理部分大纲","应激-20251029.pdf#P28-P35","应激-20251029.pdf#P68-P71"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"快速反应轴：蓝斑-交感-肾上腺髓质系统 (SAM轴)","reveal":"应激原激活脑干蓝斑核，促使肾上腺髓质与交感末梢释放大量儿茶酚胺（肾上腺素/去甲肾上腺素），心率↑、血压↑、支气管扩张，血液重分布保心脑。","mechanism_tag":"儿茶酚胺“战或逃”反应"},{"cue":"持续调节轴：下丘脑-垂体-肾上腺皮质系统 (HPA轴)","reveal":"下丘脑室旁核释放CRH→垂体ACTH→肾上腺皮质释放糖皮质激素(GC)，升高血糖、增强血管对儿茶酚胺敏感性，并抑制过度炎症反应（同时抑制免疫）。","mechanism_tag":"糖皮质激素代谢保障"},{"cue":"典型器官损伤：应激性溃疡的发病机制","reveal":"交感强烈兴奋致胃肠道小血管收缩、胃黏膜缺血缺氧（细胞水肿/坏死、HCO₃⁻及黏液屏障破坏），加上糖皮质激素促胃酸胃蛋白酶分泌、抑黏膜上皮更新，诱发急性糜烂出血溃疡。","mechanism_tag":"缺血屏障破坏 + 侵袭↑"}],"takeaway":"应激双轴协同（SAM提供即时儿茶酚胺动员 + HPA提供持续糖皮质激素允许作用），但胃肠黏膜缺血牺牲易诱发应激性溃疡。","quiz":{"stem":"动物实验切除双侧肾上腺后遭遇失血应激，即使外源静注大量去甲肾上腺素仍难维持血压。这一经典现象最能直接证明：","options":["去甲肾上腺素必须进入垂体前叶才能合成CRH","蓝斑神经元在肾上腺切除后完全停止向脊髓投射","糖皮质激素直接收缩血管小动脉而非依赖受体","儿茶酚胺发挥缩血管升压活性需GC的允许作用"],"answer_idx":3,"explain":"如图 P35 所示，糖皮质激素(GC)本身对血管无直接收缩作用，但儿茶酚胺的心血管调节活性与脂动员必须有 GC 存在方能充分显现，即 GC 的“允许作用”（permissive action）。","remedial_node_id":"physio_regulation_modes_body_fluid"}},"diagram_assets":[{"path":"assets/pathophys_stress_lsam_hpac_p29.webp","caption":"蓝斑-交感-肾上腺髓质系统(LSAM)上行边缘环路、下行交感及启动HPAC轴结构基础","source_page":29},{"path":"assets/pathophys_stress_ulcer_p70.webp","caption":"强烈应激原通过LSAM胃黏膜缺血与HPAC高酸/抑修复双轨诱发应激性溃疡机制","source_page":70}]},{"id":"biochem_protein_putrefaction","title":"【拓展】未消化蛋白质的肠道腐败作用","subject":"biochem","syllabus_refs":["syl_biochem_028"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"结肠细菌对未吸收氨基酸无氧分解产生胺类（组胺/酪胺/苯乙胺）、氨、苯酚、吲哚与硫化氢，大多有害且需经肝解毒。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P15-P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["氨基酸脱羧生成有毒胺类：组氨酸→{{组胺}}(降压)、赖氨酸→尸胺、酪氨酸→{{酪胺}}(升压)、苯丙氨酸→{{苯乙胺}}。","腐败产氨与硫化氢：肠菌尿素酶水解渗入肠道的尿素，连同脱氨反应每天产生约4g {{NH₃}}，正常经门静脉入肝合成尿素。","其他有害物（苯酚、吲哚、甲基吲哚、H₂S）：在肝内经氧化及与硫酸/葡萄糖醛酸结合而解毒。"],"trap_note":"“肠菌产维生素/短链脂肪酸”是腐败作用的少数有益产物；绝大多数腐败胺类与氨是肝衰患者神经毒性的直接源头。","quiz":{"stem":"门体侧支分流伴严重肝衰竭患者摄入高蛋白餐后迅速出现意识障碍，其中由肠道腐败胺类介导的病理环节是？","options":["肠菌将谷氨酸脱羧成GABA跨血脑屏障抑制皮层","肠菌生成的吲哚与硫化氢在脑内替代乙酰胆碱传递","结肠尿素酶将组胺水解为氨并抽空脑内草酰乙酸","酪胺与苯乙胺绕肝入脑经β-羟化酶生成假神经递质"],"answer_idx":3,"explain":"结肠细菌将未吸收的酪氨酸与苯丙氨酸脱羧成酪胺和苯乙胺；肝功衰竭或门体分流使二者绕过肝清除入脑，经β-羟化酶生成β-羟酪胺与苯乙醇胺，竞争干扰儿茶酚胺递质诱发肝性脑病。","remedial_node_id":"biochem_blood_ammonia_sources"}}},{"id":"histo_ct_general_features","title":"结缔组织一般特征、间充质与上皮鉴别","subject":"histology","syllabus_refs":["syl_histology_016"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"结缔组织源自中胚层间充质，细胞少无极性、富纤维基质与血管，分固有CT及血软骨骨。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P3-P6"],"payload":{"columns":["鉴别维度","上皮组织","结缔组织（含中胚层间充质起源）"],"rows":[["细胞与细胞外基质","细胞多、排列极密集，细胞间质极少","细胞少、散在分布，细胞外基质（纤维+无定形基质）极丰富"],["细胞极性与血供","细胞有明显极性（游离面/基底面）；无血管，有游离神经末梢","细胞无极性；富含血管、淋巴管与神经（营养支持相邻上皮）"],["胚胎来源与原初态","外、中、内三胚层皆可分化","源自中胚层间充质（星状连接、核大色浅、多液态基质无纤维）"],["分布、分类与命名","覆被内外表面或成腺体；按细胞层数与表面细胞形态分类","填充器官组织细胞间；按基质状态及细胞纤维命名（固有CT四型+血/软骨/骨）"]],"quiz":{"stem":"表皮或消化道被覆上皮自身不含血管却能持续更新并迅速启动创伤修复，其根本组织学结构依仗是：","options":["上皮细胞具有极性可直接从空气或管腔吸收全部氧供","上皮深面紧邻富含血管、淋巴管及间充质储备细胞的结缔组织提供营养与修复细胞","上皮细胞间质极其丰富足以储存长期营养","结缔组织细胞同样具有极性可直接转化为复层鳞状上皮"],"answer_idx":1,"explain":"上皮组织无血管而有极性，必须依靠基膜下方富含血管、淋巴管与未分化间充质细胞的疏松结缔组织弥散供氧供能并参与修复。"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_lct_fibroblast","title":"成纤维细胞与纤维细胞的超微转化","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"成纤维细胞富RER与高尔基体呈弱嗜碱，合成分泌三纤维与基质，静止为梭形纤维细胞。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P8-P10"],"diagram_assets":[{"path":"assets/histo_fibroblast_lm_em_p09.webp","caption":"成纤维细胞与纤维细胞光镜(A)及超微结构(B)对照：活跃期多突起富RER/Golgi，静止期梭形","source_page":9}],"payload":{"bullets":["光镜构型：疏松结缔组织最常见细胞，呈扁平星状多突起；核大卵圆色浅，胞质丰富呈{{弱嗜碱性}}。","电镜超微特化：胞质富含{{粗面内质网(RER)}}与发达的{{高尔基复合体}}，直接支撑蛋白与糖胺聚糖分泌。","功能输出：合成分泌{{胶原、弹性、网状三种纤维}}以及蛋白多糖、糖蛋白等细胞外基质成分。","状态切换：功能静止时转化为梭形、核小深染、RER极少的{{纤维细胞}}；创伤修复时可逆转为成纤维细胞。"],"trap_note":"光镜下“胞质弱嗜碱性 + 核大色浅常染色质”均是转录翻译活跃的形态信号，与电镜大量 RER 一一对应；切勿与核偏位呈车轮状、强嗜碱且有核旁浅染区的浆细胞混淆。","quiz":{"stem":"组织深部缺损进入修复期时，局部原静止的梭形“纤维细胞”需发生何种超微转化，若阻断此转化会直接破坏哪一步？","options":["转为核小深染无突起的细胞，仅阻断免疫球蛋白分泌","胞体伸展呈星状多突起、核大色浅且RER与高尔基体大量扩增；受阻则三种纤维与基质均无法合成","穿入毛细血管转化为外周血单核细胞","胞质溶酶体骤增以专职溶解正常肌腱胶原"],"answer_idx":1,"explain":"静止纤维细胞在修复刺激下逆转为代谢活跃的成纤维细胞，依赖骤增的RER合成前α-多肽链与核心蛋白，经高尔基体加工分泌三种纤维和基质。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_collagen_fibrillogenesis","title":"胶原纤维合成组装与67nm横纹形成","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"成纤维细胞胞吐前胶原至胞外经肽内切酶切为原胶原，1/4错位聚合出67nm横纹。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P10,P20-P21"],"diagram_assets":[{"path":"assets/histo_collagen_assembly_p21.webp","caption":"胶原蛋白胞内羟化、前胶原肽内切酶切割及1/4错位交联聚合出67nm周期性横纹机理图","source_page":21}],"payload":{"steps":[{"cue":"胞内合成：成纤维细胞在 RER 与高尔基体内如何将α-多肽链装配为可分泌前体？","reveal":"RER合成前α-多肽链→赖氨酸/脯氨酸羟化→三条链螺旋缠绕成两端带前肽的“前胶原蛋白分子(Procollagen)”，经高尔基体囊泡胞吐释放。","mechanism_tag":"RER羟化 + 前胶原胞吐"},{"cue":"胞外酶切：为何胶原蛋白不在细胞内直接聚合成粗大纤维撑破细胞？","reveal":"分泌到胞外后，前胶原蛋白两端的 N/C 端阻聚前肽才被“肽内切酶(Procollagen peptidase)”切除，解锁转化为长约 300nm(3000Å)的原胶原蛋白(Tropocollagen)。","mechanism_tag":"肽内切酶精准解锁"},{"cue":"错位聚合：电镜下胶原原纤维为何呈现特征性的 67nm 周期性明暗相间横纹？","reveal":"原胶原分子首尾留 40nm(400Å)间隙并排，且相邻分子纵向错开 1/4 长度并由醛醇/组氨酸交联加固；周期性“重叠区/间隙区”在电镜下形成 67nm 横纹胶原原纤维，再粘合成束即胶原纤维。","mechanism_tag":"1/4错位聚合 → 67nm横纹"}],"takeaway":"胶原形成跨“胞内羟化装配 → 胞外肽内切酶切除前肽防早聚 → 1/4错位交联出67nm横纹”三步，任一断点均致结构脆弱。","quiz":{"stem":"若成纤维细胞分泌出前胶原蛋白后，细胞外基质缺乏“前胶原肽内切酶”无法切除两端 N/C 端前肽，结缔组织最直接的结构缺陷是？","options":["原胶原蛋白在细胞内提前自发聚合成粗束并涨破细胞膜","两端前肽的空间位阻阻碍原胶原1/4错位聚合与共价交联，无法组装出67nm横纹胶原原纤维致抗张力锐减","弹性蛋白赖氨酰氧化酶活性倍增使胶原全部变为弹性纤维","透明质酸主干无法结合核心蛋白"],"answer_idx":1,"explain":"N/C端前肽是胞内防早聚的“安全帽”；若分泌到胞外后因缺乏肽内切酶而不能摘帽，分子无法整齐1/4错位聚合成具67nm横纹的胶原原纤维。","remedial_node_id":"histo_lct_fibroblast"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_ct_fibers_comparison","title":"三种结缔组织纤维结构与染色鉴别","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对比Ⅰ/Ⅲ型胶原(白纤维)、交联弹性纤维(黄纤维)与嗜银Ⅲ型网状纤维的光电镜特征。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P20,P22-P24"],"diagram_assets":[{"path":"assets/histo_fibers_table_p24.webp","caption":"胶原纤维、弹性纤维与网状纤维物理色泽、粗细、特殊染色及分布部位对照总表","source_page":24}],"payload":{"columns":["鉴别维度","胶原纤维（白纤维）","弹性纤维（黄纤维）","网状纤维（嗜银纤维）"],"rows":[["分子构筑与电镜","Ⅰ型与Ⅲ型胶原蛋白；EM具67nm周期性横纹","核心弹性蛋白(赖氨酰氧化酶交联卷曲网络)+周围微原纤维；无横纹","Ⅲ型胶原蛋白+表面糖蛋白；EM同样具67nm周期性横纹"],["光镜形态与粗细","数量最多，粗1–12μm，波浪状成束走形、不分支","较细0.1–0.2μm，有分支、折光性强，断端因回缩而卷曲","最细，直而多分支并吻合交织成三维纤细网架"],["新鲜色泽与染色","新鲜白色；HE浅红色；Masson蓝 / VG红 / 银染棕","新鲜黄色；HE淡红色；醛复红紫色 / 地衣红黑色","HE常规不显色；硝酸银(AgNO₃)浸染呈黑色"],["力学特性与分布","韧性极强抗牵拉；肌腱、韧带、真皮、器官间质","富弹性可拉伸回弹、韧性差；项韧带、声带、肺、弹性动脉","提供软支架；基膜、淋巴器官、骨髓、肝窦周隙"]],"quiz":{"stem":"在淋巴结或肝窦周隙切片中，为何“网状纤维”在常规 H\u0026E 染色中难以辨认且须用硝酸银染成黑色，而电镜下却与胶原纤维一样可见 67nm 横纹？","options":["网状纤维由弹性蛋白构成但缺乏氨基酸侧链","网状纤维本质上也是由具67nm错位周期的Ⅲ型胶原原纤维组成，但因极细且表面覆糖蛋白呈嗜银性而难被伊红显色","网状纤维仅在胚胎期存在、成人后彻底消失","银盐只能与成纤维细胞核膜结合而不能与胶原结合"],"answer_idx":1,"explain":"网状纤维由Ⅲ型胶原蛋白构成（保留67nm周期性横纹），因直径最细且外包富糖蛋白鞘，HE着色浅淡难辨而对银盐具有强亲和力（嗜银纤维）。","remedial_node_id":"histo_collagen_fibrillogenesis"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_ct_ground_substance_fluid","title":"基质蛋白多糖分子筛与组织液微循环","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"透明质酸主干串联蛋白多糖成瓶刷分子筛屏障，配合糖蛋白黏附及血管-淋巴组织液循环。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P7,P25-P26"],"diagram_assets":[{"path":"assets/histo_ground_sieve_p25.webp","caption":"基质三维分子筛网络（左）与透明质酸-结合蛋白-核心蛋白-氨基聚糖瓶刷状聚合体（右）","source_page":25}],"payload":{"bullets":["蛋白多糖立体构筑：以长链{{透明质酸}}为中轴，借结合蛋白连结核心蛋白与放射状{{氨基聚糖}}侧链，组装成极富亲水性的“瓶刷状”复合物。","防御分子筛：三维多孔{{分子筛}}允许水与小分子营养自由通过而阻挡细菌扩散；细菌分泌{{透明质酸酶}}破坏分子筛即致弥漫性{{蜂窝组织炎}}。","糖蛋白作用：在细胞与纤维/基质间架桥，介导细胞识别、黏附与定向迁移。","组织液微循环：由毛细血管{{动脉端}}滤过渗出，携氧供营养后大部分经毛细血管{{静脉端}}重吸收，余液与大分子经盲端{{毛细淋巴管}}回流。"],"trap_note":"透明质酸本身是唯一不与核心蛋白共价结合、且不含硫酸基的氨基聚糖长链，作为瓶刷集合体的“主干轴”一旦被酶解，整片基质凝胶粘度骤降、感染迅速蔓延。","quiz":{"stem":"溶血性链球菌等细菌侵入皮下疏松结缔组织时常大量分泌透明质酸酶，导致感染迅速向四周蔓延发展为弥漫性“蜂窝组织炎”，其被直接切断的微观枢纽是？","options":["胶原纤维束内 67nm 醛醇共价交联键断裂","蛋白多糖聚合体的中轴长链透明质酸解聚，三维多孔分子筛凝胶屏障坍塌","成纤维细胞粗面内质网膜上的核糖体全部脱落","毛细淋巴管盲端内皮细胞间的紧密连接完全封闭"],"answer_idx":1,"explain":"透明质酸是整个蛋白多糖“瓶刷”聚合体的中轴主干；透明质酸酶切断该长链后分子筛孔径瞬间丧失阻隔力，细菌及渗出液随之沿疏松结缔组织广泛扩散。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_lct_macrophage","title":"巨噬细胞溶酶体吞噬与MHC抗原提呈","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"血单核细胞穿入组织分化为巨噬细胞，借溶酶体与伪足完成趋化吞噬、MHC提呈及分泌。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P11-P13"],"payload":{"bullets":["起源与光镜：由外周血{{单核细胞}}穿出血管分化而来；形态随变形运动多变，具突起和{{伪足}}，胞质呈{{嗜酸性}}并常含空泡及异物颗粒。","电镜装备：胞质内含大量{{溶酶体}}、吞噬体及吞饮泡，适应高强度内吞消化。","双轨吞噬：{{非特异性吞噬}}直接黏附清除粉尘或死亡自体细胞；{{特异性吞噬}}须借识别因子（如抗体）识别黏附细菌、病毒或异体细胞。","抗原提呈与分泌：溶酶体保留{{抗原决定基}}形成{{抗原肽-MHC分子复合物}}，输送至膜表面提呈给 T 淋巴细胞，并分泌多种生物活性物质。"],"trap_note":"巨噬细胞对蛋白抗原并非一律彻底降解成游离单个氨基酸——在抗原提呈路径中必须精准保留“抗原决定基”并与 MHC 组装呈递，才能激活特异性 T 细胞。","quiz":{"stem":"巨噬细胞电镜下富含大量溶酶体，但在启动特异性免疫应答时却不能把吞入的外来蛋白质抗原彻底水解成游离单个氨基酸，必须停留在哪一关键步？","options":["将完整活细菌直接胞吐移交给浆细胞","在溶酶体内保留抗原决定基并组装成抗原肽-MHC分子复合物，输送至细胞表面提呈给T淋巴细胞","改由肝素中和抗原并经毛细淋巴管排出","将抗原封存进中性脂肪滴供后期氧化"],"answer_idx":1,"explain":"抗原提呈（P13）要求巨噬细胞将吞噬抗原在溶酶体中适度加工，保留具免疫原性的抗原决定基并与 MHC 分子结合后呈递至膜表面供 T 细胞识别。","remedial_node_id":"histo_ct_ground_substance_fluid"}},"added_at":"2026-11-16T21:40:08+08:00"},{"id":"histo_lct_mast_cell","title":"肥大细胞IgE脱颗粒与速发过敏效应","subject":"histology","syllabus_refs":["syl_histology_017"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"沿小血管分布的肥大细胞借膜IgE受体交联脱颗粒，释放组胺/白三烯等致水肿哮喘休克。","source_slides":["结缔组织（基础医学分论，2025秋）V.pdf#P15-P17"],"payload":{"steps":[{"cue":"微区定位与装备：为何肥大细胞多贴近小血管分布，普通水洗制片时却常看不清其胞质颗粒？","reveal":"肥大细胞多沿小血管/毛细血管分布便于直接调控微循环；膜上有 IgE 的 Fc 受体，胞质满载异染性颗粒（极易溶于水），颗粒内预存组胺、肝素和嗜酸性粒细胞趋化因子，胞质另含白三烯。","mechanism_tag":"血管旁定植 + 易溶颗粒"},{"cue":"触发开关：再次接触同一过敏原时，胞膜与胞质如何完成毫秒级动员？","reveal":"过敏原同时结合并交联膜表面 IgE-Fc 受体复合物，瞬间触发肥大细胞脱颗粒胞吐颗粒内介质，并同步从胞质释放白三烯引起过敏反应。","mechanism_tag":"IgE交联 → 脱颗粒"},{"cue":"靶器官临床推演：释放出的四类化学介质如何各自塑造过敏症状并形成负反馈？","reveal":"① 组胺 + 白三烯：皮肤微静脉和毛细血管扩张、通透性增加，血浆蛋白和液体溢出→组织水肿形成荨麻疹；支气管平滑肌痉挛→哮喘；全身小动脉扩张→血压下降引起休克；② 肝素抗凝血；③ 嗜酸性粒细胞趋化因子趋化嗜酸性粒细胞减轻过敏反应。","mechanism_tag":"血管通透/痉挛 + 自限"}],"takeaway":"肥大细胞是小
