<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>MedGraph Flow · 复旦基础医学碎片图谱</title>
  <link rel="manifest" href="./manifest.json">
  <style>:root {
  color-scheme: light;
  --bg: #f4f7f8;
  --surface: #ffffff;
  --surface-muted: #f8fafc;
  --ink: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --line: #e2e8f0;
  --teal: #0f766e;
  --teal-soft: #ccfbf1;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --rose: #e11d48;
  --rose-soft: #ffe4e6;
  --emerald: #059669;
  --emerald-soft: #d1fae5;
  --shadow: 0 2px 12px rgba(15, 23, 42, 0.06);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.55;
}

.hidden { display: none !important; }

.app-shell {
  min-height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) 14px 10px;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--teal);
  flex: none;
}

.brand-title {
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -0.01em;
}

.mode-pill {
  border: 1px solid #99f6e4;
  background: #f0fdfa;
  color: var(--teal);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 150px;
  cursor: pointer;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.icon-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 10px;
  padding: 5px 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.icon-btn:active { transform: scale(0.97); }

.detour-banner {
  position: sticky;
  top: 49px;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  background: #fffbeb;
  border-bottom: 1px solid #fcd34d;
  color: #92400e;
  font-size: 12.5px;
}

.detour-text {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.detour-return-btn {
  flex: none;
  border: none;
  background: #d97706;
  color: #fff;
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.stage-wrap {
  flex: 1;
  padding: 12px 12px 128px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.reconnect-strip {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.breadcrumb-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding: 2px 0;
  scrollbar-width: none;
}
.breadcrumb-bar::-webkit-scrollbar { display: none; }

.crumb-chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.crumb-chip.current {
  border-color: var(--teal);
  background: #f0fdfa;
  color: var(--teal);
  font-weight: 700;
}
.crumb-arrow { color: var(--ink-3); font-size: 11px; flex: none; }

.bridge-box {
  background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
  border: 1px solid #99f6e4;
  border-left: 4px solid var(--teal);
  border-radius: 12px;
  padding: 9px 12px;
  font-size: 13px;
  color: var(--ink-2);
}

.bridge-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: var(--teal);
  margin-right: 6px;
}

.recap-details {
  background: #ffffff;
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--ink-3);
}
.recap-details summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.recap-details p { margin: 5px 0 0; color: var(--ink-2); }

.card-stage {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.card-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.subj-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: #e0f2fe;
  color: #0369a1;
}
.subj-pathology { background: #ffe4e6; color: #be123c; }
.subj-biochem { background: #fef3c7; color: #b45309; }
.subj-physiology { background: #ccfbf1; color: #0f766e; }
.subj-histology { background: #ede9fe; color: #6d28d9; }
.subj-pharmacology { background: #e0e7ff; color: #4338ca; }
.subj-pathophys { background: #ffedd5; color: #c2410c; }

.tier-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 6px;
  background: #f1f5f9;
  color: var(--ink-2);
}
.tier-core_underlined { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.tier-master { background: #ecfdf5; color: #047857; }
.tier-understand { background: #f8fafc; color: #64748b; }

.type-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-3);
}

.card-title {
  margin: 0 0 6px;
  font-size: 19px;
  line-height: 1.35;
  font-weight: 800;
  color: var(--ink);
}

.anchor-summary {
  margin: 0 0 12px;
  padding: 8px 10px;
  background: var(--surface-muted);
  border-radius: 10px;
  font-size: 13.5px;
  color: var(--ink-2);
}

.source-chip {
  margin-top: 12px;
  font-size: 11px;
  color: var(--ink-3);
}

/* Type 1: Mechanism Flow */
.flow-list { display: flex; flex-direction: column; gap: 8px; }

.flow-step {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: #fff;
}
.flow-step.revealed {
  border-color: #99f6e4;
  background: #f8fffd;
}
.flow-step-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--ink);
}
.flow-tag {
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal);
  flex: none;
}
.flow-reveal-text {
  margin: 6px 0 0;
  font-size: 13.5px;
  color: var(--ink-2);
}
.flow-next-btn {
  width: 100%;
  margin-top: 4px;
  padding: 11px 14px;
  border: 1.5px dashed var(--teal);
  background: #f0fdfa;
  color: var(--teal);
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
}
.takeaway-card {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #ecfdf5;
  border: 1px solid #a7f3d0;
  font-size: 13px;
  color: #065f46;
}

/* Type 2: Structure Cloze */
.cloze-toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 8px;
}
.mini-btn {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
}
.cloze-list {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 14.5px;
}
.cloze-pill {
  display: inline-block;
  padding: 1px 8px;
  margin: 0 2px;
  border-radius: 6px;
  border: 1px solid #0f766e;
  background: #0f766e;
  color: transparent;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
  user-select: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 13.5px;
  transition: all 0.16s ease;
}
.cloze-pill.open {
  background: #ccfbf1;
  color: #0f766e;
  text-shadow: none;
  user-select: text;
}
.trap-box {
  margin-top: 12px;
  padding: 9px 11px;
  border-radius: 10px;
  background: #fffbeb;
  border: 1px solid #fde68a;
  font-size: 12.5px;
  color: #92400e;
}

/* Type 3: Comparison Matrix + Quick Quiz */
.matrix-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.matrix-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.matrix-table th {
  background: var(--surface-muted);
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-weight: 700;
}
.matrix-table td {
  padding: 8px 10px;
  border-bottom: 1px solid #f1f5f9;
  color: var(--ink-2);
  vertical-align: top;
}
.matrix-table tr:last-child td { border-bottom: none; }

.quiz-card {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid var(--line);
}
.quiz-stem {
  font-size: 13.5px;
  font-weight: 700;
  margin: 0 0 8px;
}
.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quiz-opt {
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
}
.quiz-opt.correct { background: var(--emerald-soft); border-color: var(--emerald); color: #065f46; font-weight: 700; }
.quiz-opt.wrong { background: var(--rose-soft); border-color: var(--rose); color: #9f1239; }
.quiz-explain {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
  padding: 7px 10px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
}

/* Bottom Fixed Thumb Dock */
.thumb-dock {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 720px;
  z-index: 35;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 8px 12px max(10px, env(safe-area-inset-bottom));
  box-shadow: 0 -4px 18px rgba(15, 23, 42, 0.06);
}

.neighbor-bar-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.mini-galaxy-btn {
  border: 1px solid #cbd5e1;
  background: var(--surface-muted);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
}
.queue-progress { font-size: 11.5px; color: var(--teal); font-weight: 700; }

/* Planned Detour & Inline Non-Truncated Galaxy Map */
.planned-detour-pill {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-left: 4px solid #2563eb;
  color: #1e40af;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 600;
}

.galaxy-card-section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px;
}

.galaxy-section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.galaxy-section-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.galaxy-section-sub {
  font-size: 11px;
  color: var(--ink-3);
}

.galaxy-board {
  position: relative;
  width: 100%;
  min-height: 250px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: radial-gradient(circle at 50% 45%, #f0fdfa 0%, #f8fafc 74%);
  overflow: hidden;
}

.galaxy-lines-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.galaxy-edge-tag {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 1px 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e2e8f0;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
  pointer-events: none;
  z-index: 2;
}

.galaxy-node-pill {
  position: absolute;
  transform: translate(-50%, -50%);
  width: min(44%, 172px);
  padding: 6px 8px;
  border-radius: 11px;
  border: 1.5px solid #cbd5e1;
  background: rgba(255, 255, 255, 0.97);
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
  text-align: left;
  cursor: pointer;
  z-index: 3;
  transition: transform 0.14s ease, border-color 0.14s ease;
}
.galaxy-node-pill:active { transform: translate(-50%, -50%) scale(0.97); }
.galaxy-node-pill.center {
  width: min(58%, 215px);
  border-color: var(--teal);
  background: #f0fdfa;
  box-shadow: 0 4px 14px rgba(15, 118, 110, 0.18);
  z-index: 4;
  cursor: default;
}
.galaxy-node-pill.selected {
  border-color: #d97706;
  box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.25);
  z-index: 5;
}
.galaxy-node-pill.weak {
  border-color: #fda4af;
  background: #fff1f2;
}
.galaxy-node-top {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--ink-3);
  margin-bottom: 2px;
}
.galaxy-node-title {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.28;
  color: var(--ink);
  word-break: break-word;
}

.galaxy-preview-bar {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.galaxy-preview-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}
.galaxy-preview-bridge {
  font-size: 12.5px;
  color: var(--ink-2);
}
.galaxy-preview-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.galaxy-extra-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.galaxy-extra-btn {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11.5px;
  color: var(--ink-2);
  cursor: pointer;
}

.rating-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.rate-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 11px 6px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
}
.rate-btn:active { transform: scale(0.97); }
.rate-again { border-color: #fecdd3; background: #fff1f2; color: #be123c; }
.rate-fuzzy { border-color: #fde68a; background: #fffbeb; color: #b45309; }
.rate-mastered { border-color: #a7f3d0; background: #ecfdf5; color: #047857; }
.rate-btn.recommended {
  box-shadow: 0 0 0 2.5px rgba(15, 118, 110, 0.45);
}

/* Modal & Drawers */
.sheet-modal {
  width: min(94vw, 640px);
  max-height: 86dvh;
  border: none;
  border-radius: 18px;
  padding: 0;
  box-shadow: 0 18px 48px rgba(15, 23, 42, 0.25);
}
.sheet-modal::backdrop { background: rgba(15, 23, 42, 0.45); }
.modal-head {
  position: sticky;
  top: 0;
  background: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 { margin: 0; font-size: 16px; }
.modal-close {
  border: none;
  background: #f1f5f9;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 14px;
}
.modal-body {
  padding: 14px 16px 20px;
  overflow-y: auto;
  max-height: calc(86dvh - 58px);
}

.tab-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-muted);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tab-btn.active {
  background: var(--teal);
  color: #fff;
  border-color: var(--teal);
}

.route-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  background: #fff;
  cursor: pointer;
  text-align: left;
  width: 100%;
}
.route-card:hover { border-color: var(--teal); }
.route-card h3 { margin: 0 0 3px; font-size: 14px; color: var(--ink); }
.route-card p { margin: 0; font-size: 12px; color: var(--ink-3); }

.syl-subject-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.syl-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 13.5px;
  margin-bottom: 6px;
}
.progress-track {
  height: 7px;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--teal);
}
.node-dot-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.node-dot-pill {
  border: 1px solid var(--line);
  background: var(--surface-muted);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11.5px;
  cursor: pointer;
}

.galaxy-svg {
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f8fafc;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
  font-size: 12.5px;
}
.form-field input, .form-field textarea {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #cbd5e1;
  font-size: 13px;
  font-family: inherit;
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.primary-btn {
  border: none;
  background: var(--teal);
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.toast {
  position: fixed;
  bottom: calc(122px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  max-width: calc(100vw - 32px);
  text-align: center;
  background: rgba(15, 23, 42, 0.92);
  color: #fff;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

反馈（包括负反馈和正反馈）控制，前馈控制的概念及其生理意义。"},{"id":"syl_physiology_005","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类","raw_text":"5.细胞膜物质转运功能：细胞膜的分子组成和结构；物质的跨膜转运：单纯扩散；易化扩散：经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类；原发性和继发性主动转运；钠-钾泵的概念和生理意义；出胞和入胞（包括受体介导入胞）。","tier":"core_underlined","underlined":true,"underlined_span":"经载体、通道介导的易化扩散，载体的概念及特征，通道的概念和分类；原发性和继发性主动转运；钠-钾泵的概念和生理意义"},{"id":"syl_physiology_006","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体内信号传递","raw_text":"6.体内信号传递：体内细胞间信息传递，细胞的跨膜信号转导：细胞跨膜信号转导的概念及主要方式：G 蛋白耦联受体介导的信号转导，酶耦联型受体介导的信号转导（招募型受体介导的信号转导），离子通道型受体介导的信号转导，核受体介导的信号转导。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_physiology_007","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念","raw_text":"7.细胞的生物电活动：静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念；动作电位的概念及产生机制，锋电位、后电位的概念、内向电流和外向电流的概念，电压门控钠通道的功能状态，电压钳和膜片钳的基本原理和在细胞生物电研究中的运用；动作电位的引起和传导：阈强度、阈值、阈刺激，阈电位的概念，动作电位的“全或无”特性；动作电位的传导：动作电位在同一细胞上传导，局部电流学说，动作电位传播的不衰减特征，动作电位在有髓神经纤维上的传导；动作电位在细胞之间的传递（缝隙连接的结构特征和生理意义）；细胞兴奋性及其在动作电位周期中的变化：可兴奋细胞和兴奋性、兴奋的概念；细胞膜的被动电学特性和电紧张电位、局部电位：局部电位的概念和特征、局部兴奋的概念及其机制。","tier":"core_underlined","underlined":true,"underlined_span":"静息电位的概念和产生机制，极化、去极化、反极化、超射、复极化的概念；动作电位的概念及产生机制，锋电位、后电位的概念、内向电流和外向电流的概念，电压门控钠通道的功能状态，；动作电位的引起和传导：阈强度、阈值、阈刺激，阈电位的概念，动作电位的“全或无”特性；动作电位的传导：动作电位在同一细胞上传导，局部电流学说，动作电位传播的不衰减特征，动作电位在有髓神经纤维上的传导；动作电位在细胞之间的传递（缝隙连接的结构特征和生理意义）；细胞兴奋性及其在动作电位周期中的变化：局部电位：局部电位的概念和特征、局部兴奋的概念及其机制"},{"id":"syl_physiology_008","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"骨骼肌神经-肌接头处兴奋的传递过程","raw_text":"8.肌细胞的收缩：骨骼肌神经-肌接头处兴奋的传递过程：终板电位、微终板电位、量子性释放的概念；骨骼肌的细微结构，肌管系统；骨骼肌的收缩和舒张机制，横纹肌的兴奋-收缩耦联；骨骼肌收缩的表现：等长收缩、等张收缩；影响骨骼肌收缩的因素：前负荷、后负荷、肌肉收缩能力；单收缩和强直收缩的概念。多纤维总和，运动单位，大小原则，肌紧张的概念，平滑肌的收缩功能。","tier":"core_underlined","underlined":true,"underlined_span":"骨骼肌神经-肌接头处兴奋的传递过程：终板电位、微终板电位、量子性释放的概念；骨骼肌的收缩和舒张机制，横纹肌的兴奋-收缩耦联骨骼肌收缩的表现：等长收缩、等张收缩；影响骨骼肌收缩的因素：前负荷、后负荷、肌肉收缩能力；单收缩和强直收缩的概念。"},{"id":"syl_physiology_009","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体质指数的概念、生理和病理变化","raw_text":"9.机体能量的来源和利用：糖、脂肪和蛋白质在机体供能、储能中的作用，能量的贮存及ATP和磷酸肌酸的关系，能量代谢的平衡，体质指数的概念、生理和病理变化。","tier":"core_underlined","underlined":true,"underlined_span":"体质指数的概念、生理和病理变化"},{"id":"syl_physiology_010","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。","raw_text":"10.能量代谢的测定：直接和间接测热法，食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。","tier":"core_underlined","underlined":true,"underlined_span":"食物的热价和氧热价，呼吸商的概念、变化及其意义，非蛋白呼吸商的概念。"},{"id":"syl_physiology_011","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"食物的特殊动力作用的概念及其机制。","raw_text":"11.影响能量代谢的主要因素：食物的特殊动力作用的概念及其机制。","tier":"core_underlined","underlined":true,"underlined_span":"食物的特殊动力作用的概念及其机制。"},{"id":"syl_physiology_012","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"基础代谢、基础状态和基础代谢率的概念基础代谢率的概念和个体间比较——体表面积定律基础代谢率的测量、生理病理变化及意义。","raw_text":"12.基础代谢：基础代谢、基础状态和基础代谢率的概念，基础代谢率的概念和个体间比较——体表面积定律，基础代谢率的测量、生理病理变化及意义。","tier":"core_underlined","underlined":true,"underlined_span":"基础代谢、基础状态和基础代谢率的概念基础代谢率的概念和个体间比较——体表面积定律基础代谢率的测量、生理病理变化及意义。"},{"id":"syl_physiology_013","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"体温及其定义，体表温度和体核温度的定义及其特点","raw_text":"13.体温及其生理波动：体温及其定义，体表温度和体核温度的定义及其特点，体温正常值及生理变动。","tier":"core_underlined","underlined":true,"underlined_span":"体温及其定义，体表温度和体核温度的定义及其特点"},{"id":"syl_physiology_014","course":"基础医学分论","subject":"physiology","chapter":"生理学","title":"产热器官、产热方式及其调节机体的散热方式及其调节体温调节方式温度感受器和体温调节中枢体温调定点学说及视前区/下丘脑前部的作用。","raw_text":"14.产热与散热：产热器官、产热方式及其调节，机体的散热方式及其调节，体温调节方式，温度感受器和体温调节中枢，体温调定点学说及视前区/下丘脑前部的作用。","tier":"core_underlined","underlined":true,"underlined_span":"产热器官、产热方式及其调节机体的散热方式及其调节体温调节方式温度感受器和体温调节中枢体温调定点学说及视前区/下丘脑前部的作用。"},{"id":"syl_pathophys_001","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。","raw_text":"1.疾病和健康相关的基本概念：疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。","tier":"core_underlined","underlined":true,"underlined_span":"疾病、健康、亚健康、病因、条件、诱因、发病学、完全康复、脑死亡。"},{"id":"syl_pathophys_002","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"病因的分类","raw_text":"2.病因的分类：生物因素、理化因素、营养因素、遗传因素、先天因素、免疫因素、心理和社会因素。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathophys_003","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"脑死亡的判断标准","raw_text":"3.疾病发生发展的一般规律：损伤与抗损伤并存；因果交替；局部和整体相互影响。疾病发生发展的基本机制：神经机制；体液机制；细胞机制；分子机制。疾病的转归：康复与死亡；康复包括：完全康复和不完全康复；脑死亡的判断标准：①自主呼吸停止；②不可逆性深度昏迷；③脑干神经反射消失；④脑电波消失；⑤脑血液循环完全停止；诊断脑死亡的意义：①协助医务人员判定患者的死亡时间、适时终止复苏抢救；②节省卫生资源，减轻社会和家庭的经济和情感负担；③有利于器官移植。","tier":"core_underlined","underlined":true,"underlined_span":"脑死亡的判断标准：①自主呼吸停止；②不可逆性深度昏迷；③脑干神经反射消失；④脑电波消失；⑤脑血液循环完全停止；诊断脑死亡的意义：①协助医务人员判定患者的死亡时间、适时终止复苏抢救；②节省卫生资源，减轻社会和家庭的经济和情感负担；③有利于器官移植。"},{"id":"syl_pathophys_004","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"疾病研究的基本方法","raw_text":"4. 疾病研究的基本方法：整体动物模型、离体器官模型和离体细胞模型。","tier":"understand","underlined":false,"underlined_span":""},{"id":"syl_pathophys_005","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"发热、过热的概念发热激活物","raw_text":"5.发热、过热的概念。发热病因和发病机制：发热激活物；产生内生致热原细胞；内生致热原。","tier":"core_underlined","underlined":true,"underlined_span":"发热、过热的概念发热激活物；产生内生致热原细胞；内生致热原。"},{"id":"syl_pathophys_006","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"致热信号传入中枢的途径","raw_text":"6.发热时的体温调节机制：致热信号传入中枢的途径；发热中枢调节介质：正调节介质；负调节介质。体温调节的方式及发热的时相：体温上升期；高温持续期；体温下降期；发热时机体主要的代谢功能变化；发热的防治原则。","tier":"core_underlined","underlined":true,"underlined_span":"致热信号传入中枢的途径；发热中枢调节介质：正调节介质；负调节介质。"},{"id":"syl_pathophys_007","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"应激、应激原的概念","raw_text":"7.应激、应激原的概念；应激反应的分类。","tier":"core_underlined","underlined":true,"underlined_span":"应激、应激原的概念；"},{"id":"syl_pathophys_008","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"蓝斑-交感-肾上腺髓质系统","raw_text":"8.应激时神经内分泌反应及机制：蓝斑-交感-肾上腺髓质系统；下丘脑-垂体-肾上腺皮质激素系统；其他神经内分泌反应；应激时的免疫反应；急性期反应和急性期蛋白；细胞应激反应：热休克反应；氧化应激。应激的心理行为反应。","tier":"core_underlined","underlined":true,"underlined_span":"蓝斑-交感-肾上腺髓质系统；下丘脑-垂体-肾上腺皮质激素系统；急性期反应和急性期蛋白；"},{"id":"syl_pathophys_009","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"应激与应激性溃疡","raw_text":"9.应激与疾病：应激与心血管疾病；应激与应激性溃疡；应激与精神神经疾病：创伤后应激障碍；应激与内分泌和代谢性疾病。","tier":"core_underlined","underlined":true,"underlined_span":"应激与应激性溃疡；创伤后应激障碍"},{"id":"syl_pathophys_010","course":"基础医学分论","subject":"pathophys","chapter":"病理生理学","title":"病理性应激的防治原则。","raw_text":"10.病理性应激的防治原则。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_001","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"萎缩概念类型（包括生理性和病理性）心肌萎缩","raw_text":"萎缩概念、类型（包括生理性和病理性）及各类型的病理学改变和后果，心肌萎缩为例。","tier":"core_underlined","underlined":true,"underlined_span":"萎缩概念类型（包括生理性和病理性）心肌萎缩"},{"id":"syl_pathology_002","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肥大概念","raw_text":"肥大概念、类型（包括生理性和病理性，应性和替代性）及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"肥大概念"},{"id":"syl_pathology_003","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"增生概念","raw_text":"增生概念、类型及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"增生概念"},{"id":"syl_pathology_004","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"化生概念","raw_text":"化生概念、类型及病理学改变和后果。","tier":"core_underlined","underlined":true,"underlined_span":"化生概念"},{"id":"syl_pathology_005","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)","raw_text":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)。","tier":"core_underlined","underlined":true,"underlined_span":"细胞水肿的概念及病理学改变(大体、光镜及电镜下)"},{"id":"syl_pathology_006","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及电镜下)","raw_text":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及电镜下)。","tier":"core_underlined","underlined":true,"underlined_span":"脂肪变的概念，肝脂肪变及心脂肪变的病理学改变(大体、光镜及电镜下)"},{"id":"syl_pathology_007","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"透明变性的概念、类型及其病理学改变","raw_text":"透明变性的概念、类型及其病理学改变：细胞内透明变性，血管壁透明变性及结缔组织透明变性举例。","tier":"core_underlined","underlined":true,"underlined_span":"透明变性的概念、类型及其病理学改变"},{"id":"syl_pathology_008","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"病理学改变","raw_text":"黏液样变性概念、及其病理学改变。","tier":"core_underlined","underlined":true,"underlined_span":"病理学改变"},{"id":"syl_pathology_009","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"淀粉样变性病理学改变","raw_text":"淀粉样变性概念、类型及其病理学改变。","tier":"core_underlined","underlined":true,"underlined_span":"淀粉样变性病理学改变"},{"id":"syl_pathology_010","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"坏死的概念及病理学改变","raw_text":"坏死的概念及病理学改变：细胞核（核固缩，核碎裂，核溶解）、细胞质、间质的改变。","tier":"core_underlined","underlined":true,"underlined_span":"坏死的概念及病理学改变"},{"id":"syl_pathology_011","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"六种坏死病理类型的概念及病理学改变凝固性坏死、液化性坏死、干酪样坏死、脂肪坏死，纤维蛋白样坏死，及坏疽","raw_text":"六种坏死病理类型的概念及病理学改变：包括凝固性坏死、液化性坏死、干酪样坏死、脂肪坏死，纤维蛋白样坏死，及坏疽（干性、湿性、气性）。","tier":"core_underlined","underlined":true,"underlined_span":"六种坏死病理类型的概念及病理学改变凝固性坏死、液化性坏死、干酪样坏死、脂肪坏死，纤维蛋白样坏死，及坏疽"},{"id":"syl_pathology_012","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"坏死的结局","raw_text":"坏死的结局：溶解吸收，分离排除，机化（概念），钙化。","tier":"core_underlined","underlined":true,"underlined_span":"坏死的结局：溶解吸收，分离排除，机化（概念），钙化。"},{"id":"syl_pathology_013","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"细胞凋亡的概念，镜下特点，简单分子机制。","raw_text":"细胞凋亡的概念，镜下特点，简单分子机制。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_014","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"自噬的概念及简单机制。","raw_text":"自噬的概念及简单机制。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_015","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"病理性钙化的概念，类型（营养不良性、转移性）","raw_text":"4.病理性钙化的概念，类型（营养不良性、转移性）及危害。","tier":"core_underlined","underlined":true,"underlined_span":"病理性钙化的概念，类型（营养不良性、转移性）"},{"id":"syl_pathology_016","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"细胞损伤的原因","raw_text":"5.细胞损伤的原因：外界环境因素（生物性因子，非生物性因素），细胞必需物质的缺乏或过多，遗传核免疫反应异常。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_017","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"细胞损伤的机制","raw_text":"6.细胞损伤的机制：缺氧（缺血）性损伤，自由基损伤。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_018","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"动脉性充血概念和类型（生理性充血、病理性充血）、形态特点、类型及其意义","raw_text":"7.动脉性充血概念和类型（生理性充血、病理性充血）、形态特点、类型及其意义；","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_019","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"静脉性充血（淤血）的原因、病变及其后果肺脏和肝脏淤血发生的原因、病理形态变化及其后果","raw_text":"8.静脉性充血（淤血）的原因、病变及其后果。肺脏和肝脏淤血发生的原因、病理形态变化及其后果；","tier":"core_underlined","underlined":true,"underlined_span":"静脉性充血（淤血）的原因、病变及其后果肺脏和肝脏淤血发生的原因、病理形态变化及其后果"},{"id":"syl_pathology_020","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"水肿的概念","raw_text":"9.水肿的概念、病因和发病机制、形态改变；","tier":"core_underlined","underlined":true,"underlined_span":"水肿的概念"},{"id":"syl_pathology_021","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"三种基本病变（变质、渗出、增生）炎症对机体的利与弊","raw_text":"10.炎症概述：炎症的定义、解释炎症特点（普遍性、常见病多发病、认识逐渐深入）；三种基本病变（变质、渗出、增生）；炎症对机体的利与弊；4类致炎因子（生物、理化因子、组织坏死和异物、超敏反应）。","tier":"core_underlined","underlined":true,"underlined_span":"三种基本病变（变质、渗出、增生）炎症对机体的利与弊"},{"id":"syl_pathology_022","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"炎症分类（急性和慢性）","raw_text":"11.炎症分类：炎症分类（急性和慢性）；两种类型炎症的特点和异同","tier":"core_underlined","underlined":true,"underlined_span":"炎症分类（急性和慢性）；两种类型炎症的特点和异同"},{"id":"syl_pathology_023","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"解释趋化概念急性炎症临床症状","raw_text":"12.急性炎症：急性炎症发生的机制，包括血管反应（血管反应包括血流动力学和血管通透性改变，识别渗出液和漏出液特点，解释渗出液的利和弊）；白细胞浸润、及炎症介质（白细胞浸润过程（边集、附壁、游出、趋化、吞噬、降解），识别各类炎症细胞、解释趋化概念）；炎症介质定义，各类炎症介质。急性炎症临床症状：急性炎症局部症状、描述全身症状；四种渗出为主的急性炎症病理类型（浆液性、纤维蛋白性、化脓性、其他如出血性炎），各种炎症好发的部位、渗出物形态特点、脏器病变举例及结局。","tier":"core_underlined","underlined":true,"underlined_span":"解释趋化概念急性炎症临床症状：急性炎症局部症状、描述全身症状四种渗出为主的急性炎症病理类型（浆液性、纤维蛋白性、化脓性、其他如出血性炎），各种炎症好发的部位、渗出物形态特点、脏器病变举例及结局。"},{"id":"syl_pathology_024","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"慢性炎症特点和慢性炎症细胞类型炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。","raw_text":"13.慢性炎症：慢性炎症发生机制，慢性炎症特点和慢性炎症细胞类型；慢性炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。","tier":"core_underlined","underlined":true,"underlined_span":"慢性炎症特点和慢性炎症细胞类型炎症病理类型（一般慢性炎症、肉芽肿性炎症）及两者炎症发病原因，两者炎症的组织学特征。炎症息肉、炎性假瘤概念。"},{"id":"syl_pathology_025","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"炎症结局的影响因素（局部、全身）","raw_text":"14.炎症结局：炎症结局的影响因素（局部、全身）；三种不同的炎症结局（痊愈、迁延至慢性、蔓延扩散）；蔓延扩散的三种途径（局部、淋巴道、血道）。血道播散引起的菌血症、毒血症、败血症及脓毒败血症。","tier":"core_underlined","underlined":true,"underlined_span":"炎症结局的影响因素（局部、全身）；三种不同的炎症结局（痊愈、迁延至慢性、蔓延扩散）；蔓延扩散的三种途径（局部、淋巴道、血道）。血道播散引起的菌血症、毒血症、败血症及脓毒败血症。"},{"id":"syl_pathology_026","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能干细胞概念、分类细胞外基质对组织细胞再生的作用","raw_text":"15.细胞增殖的调控；不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能；干细胞概念、分类、与再生医学研究的关系；细胞因子和细胞外基质对组织细胞再生的作用；","tier":"core_underlined","underlined":true,"underlined_span":"不同类型的细胞（不稳定细胞、稳定细胞、永久性细胞）的再生潜能干细胞概念、分类细胞外基质对组织细胞再生的作用"},{"id":"syl_pathology_027","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肉芽组织的概念、形态特点和作用纤维性修复过程一期愈合和二期愈合的特点","raw_text":"16.肉芽组织的概念、形态特点和作用；纤维性修复过程；影响修复的因素；一期愈合和二期愈合的特点。","tier":"core_underlined","underlined":true,"underlined_span":"肉芽组织的概念、形态特点和作用纤维性修复过程一期愈合和二期愈合的特点"},{"id":"syl_pathology_028","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。","raw_text":"17.肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的 (neoplasm)的概念。肿瘤性增生的4大特点（间变、自律性、遗传性、异质性）的含义。"},{"id":"syl_pathology_029","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的良恶性","raw_text":"18.肿瘤的良恶性：分类的根本依据（对机体的危害程度），良恶性肿瘤的区别要点（肿瘤分化、生长方式、生长速度、核分裂象、播散、后果）。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的良恶性：分类的根本依据（对机体的危害程度），良恶性肿瘤的区别要点（肿瘤分化、生长方式、生长速度、核分裂象、播散、后果）。"},{"id":"syl_pathology_030","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的基本病变","raw_text":"19.肿瘤的基本病变：肿瘤的形态改变，包括外形、颜色、大小、数目及肿瘤的结构。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的基本病变：肿瘤的形态改变，包括外形、颜色、大小、数目及肿瘤的结构。"},{"id":"syl_pathology_031","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的分类、命名基本原则","raw_text":"20.肿瘤的分类、命名基本原则：良恶性肿瘤命名的差别，强调癌、肉瘤的定义，了解肿瘤的其他特殊命名。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的分类、命名基本原则：良恶性肿瘤命名的差别，强调癌、肉瘤的定义，了解肿瘤的其他特殊命名。"},{"id":"syl_pathology_032","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的分级和分期","raw_text":"21.肿瘤的分级和分期：强调分级是指肿瘤分化的程度，而分级是指肿瘤的大小和播散的范围。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的分级和分期：强调分级是指肿瘤分化的程度，而分级是指肿瘤的大小和播散的范围。"},{"id":"syl_pathology_033","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤的生物学特性以肿瘤的形态特征为重点。光镜下肿瘤良恶性鉴别的要点、共性失接触抑制、永生化生长、裸鼠中的成瘤性Crabtree效应，合成代谢大于分解代谢等特征","raw_text":"22.肿瘤的生物学特性：包括肿瘤的形态特征、生理特征、生化代谢、免疫特征。以肿瘤的形态特征为重点。形态特征中要求掌握在光镜下肿瘤良恶性鉴别的要点、共性。强调HE染色光镜检查是肿瘤病理诊断的最重要手段。简单介绍电镜、染色体检测、组织化学、免疫组织化学和原位分子杂交等技术在肿瘤诊断中的辅助作用，特别强调免疫组织化学染色在确定肿瘤分化方向、甚至在判别肿瘤良恶性、有无浸润方面的作用。肿瘤生理特征中重点介绍失接触抑制、永生化生长、裸鼠中的成瘤性。生化代谢主要介绍Crabtree效应，合成代谢大于分解代谢等特征。免疫特征中主要介绍与肿瘤诊断相关的抗原。介绍肿瘤侵袭转移的基本分子生物学基础。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤的生物学特性以肿瘤的形态特征为重点。光镜下肿瘤良恶性鉴别的要点、共性失接触抑制、永生化生长、裸鼠中的成瘤性Crabtree效应，合成代谢大于分解代谢等特征"},{"id":"syl_pathology_034","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系","raw_text":"23.掌握原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系。","tier":"core_underlined","underlined":true,"underlined_span":"原位癌的定义及其临床意义，了解原位癌与上皮内肿瘤的关系"},{"id":"syl_pathology_035","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤转移的三个步骤淋巴道、血道、种植性转移三种不同的转移方式","raw_text":"24.掌握肿瘤转移的三个步骤，了解肿瘤转移的基本分子学基础。强调癌的转移途径和肉瘤转移途径的差异性，同时强调不同肿瘤转移的个性，并举例说明。掌握淋巴道、血道、种植性转移三种不同的转移方式，淋巴结转移中强调左锁骨上淋巴节转移的意义，血道转移中介绍肝和肺的常见转移，种植性转移中介绍Kruekenberg tumor。","tier":"core_underlined","underlined":true,"underlined_span":"肿瘤转移的三个步骤淋巴道、血道、种植性转移三种不同的转移方式"},{"id":"syl_pathology_036","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围","raw_text":"25.肿瘤的病理诊断：强调病理诊断中切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围；强调病理诊断在肿瘤诊断中的金标准作用，强调石蜡切片在病理诊断中的最终诊断作用。介绍脱落细胞学检查的作用和应用越来越广泛的趋势，强调细胞学检查发现异常后需要再做活组织检查的必要性。","tier":"core_underlined","underlined":true,"underlined_span":"切除活检、吸取活检、冷冻切片在病理诊断中的不同作用和应用范围"},{"id":"syl_pathology_037","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式","raw_text":"26.原癌基因分类：介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式。","tier":"core_underlined","underlined":true,"underlined_span":"介绍生长因子、生长因子受体、信号转导蛋白、核转录因子、周期素和周期素依赖蛋白五类原癌基因和激活方式"},{"id":"syl_pathology_038","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响","raw_text":"原癌基因激活的方式：重点以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响。","tier":"core_underlined","underlined":true,"underlined_span":"以ras基因点突变为例，介绍信号转导蛋白点突变后对细胞增殖的影响"},{"id":"syl_pathology_039","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用","raw_text":"27.抑癌基因的分类及失活：以TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用。","tier":"core_underlined","underlined":true,"underlined_span":"TP53基因和RB基因为例，介绍抑癌基因的正常功能和丢失后产生的细胞生长抑制功能丧失在癌变中的作用"},{"id":"syl_pathology_040","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"凋亡调节基因在细胞恶变过程中的作用","raw_text":"28.凋亡调节基因在细胞恶变过程中的作用：介绍抑癌基因与凋亡调节基因的相互作用，凋亡调节基因表达紊乱在细胞恶变中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_041","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"端粒酶在细胞永生化中的作用","raw_text":"29.端粒酶在细胞永生化中的作用：端粒酶的生理作用，端粒酶在体细胞中重激活后在细胞癌变中的作用，端粒酶与细胞永生化的作用，癌细胞的永生化特性的获得与端粒酶的关系。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_042","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系","raw_text":"30.常见的癌前病变：掌握癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系。了解各种癌前病变的癌变率。","tier":"core_underlined","underlined":true,"underlined_span":"癌前病变的定义及与癌的关系，掌握轻、中、度不典型增生与上皮内肿瘤的关系"},{"id":"syl_pathology_043","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"介绍几种与人类肿瘤相关的致瘤病毒","raw_text":"31.介绍几种与人类肿瘤相关的致瘤病毒：RNA病毒为人T细胞白血病病毒Ⅰ型的致瘤机制；DNA病毒中介绍HPV、EBV、HBV和HCV的致瘤机制，重点结合目前的分子病理学进展介绍HPV的致瘤机制。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_044","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤抗原的分类、肿瘤抗原在肿瘤免疫中的作用","raw_text":"32.肿瘤抗原的分类、肿瘤抗原在肿瘤免疫中的作用：重点介绍肿瘤抗原在肿瘤诊断中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_045","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤发生的多步骤理论及其与分子结构变化的关系，以结肠癌发生的模式图说明。","raw_text":"33.肿瘤发生的多步骤理论及其与分子结构变化的关系，以结肠癌发生的模式图说明。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_046","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"肿瘤间质特别是肿瘤血管在肿瘤生长中的作用。","raw_text":"34.肿瘤间质特别是肿瘤血管在肿瘤生长中的作用。","tier":"familiar","underlined":false,"underlined_span":""},{"id":"syl_pathology_047","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"恶病质的定义","raw_text":"35.恶病质的定义：指出恶病质不一定全由恶性肿瘤引起。肿瘤伴随综合征的概念。","tier":"core_underlined","underlined":true,"underlined_span":"恶病质的定义"},{"id":"syl_pathology_048","course":"基础医学分论","subject":"pathology","chapter":"病理学总论","title":"常见肿瘤","raw_text":"36.常见肿瘤：以（上皮来源的）鳞状细胞良恶性肿瘤和腺上皮细胞良恶性肿瘤为例，再次强调良 下腔静脉}} → 右心房。","肺循环：右心室（{{肺动脉干}}，内流静脉血）→ 肺泡毛细血管 → 4条{{肺静脉}}（流动脉血）→ 左心房。","右心房3入口1出口：上腔静脉口、下腔静脉口、{{冠状窦口}}，经{{三尖瓣}}入右心室。","左心室壁厚9–12mm（约为心房肌3倍），经{{二尖瓣复合体}}接左房血，经主动脉瓣射血。"],"trap_note":"左心衰时左室射血受阻，血液逆向淤积在左房与肺静脉（肺淤血）；右心衰时右室/右房压力升高，血液逆向淤积在上下腔静脉（体循环/肝淤血）。"}},{"id":"patho_hyperemia_vs_congestion","title":"动脉性充血 vs 静脉性淤血","subject":"pathology","syllabus_refs":["syl_pathology_018","syl_pathology_019"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"充血是动脉输入↑的主动过程（红热肿）；淤血是静脉回流受阻的被动过程（紫冷肿）。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P6-P12"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["比较维度","动脉性充血 (Hyperemia)","静脉性淤血 (Congestion)"],"rows":[["发生机制","细动脉主动扩张，动脉血输入↑","静脉回流受阻，血液被动淤积于小静脉和毛细血管"],["体征三联","鲜红 · 温度升高 · 轻度肿胀","紫绀(发绀) · 温度降低 · 肿胀与水肿"],["代谢与功能","代谢及防御功能增强，多为一过性","缺氧→实质细胞萎缩/变性/坏死，间质纤维化（淤血性硬化）"]],"quiz":{"stem":"下列哪项是慢性静脉性淤血而非动脉性充血的特征性后果？","options":["局部组织鲜红、皮温升高","血管舒张神经兴奋性增高所致","实质细胞萎缩伴间质纤维组织增生（淤血性硬化）","生理性进餐后胃肠道血流增多"],"answer_idx":2,"explain":"淤血为被动缺氧过程，长期静脉淤血使实质细胞萎缩/变性/坏死，成纤维细胞增生形成淤血性硬化。"}}},{"id":"patho_pulmonary_congestion","title":"左心衰与急性/慢性肺淤血（心衰细胞）","subject":"pathology","syllabus_refs":["syl_pathology_019"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"左心衰致肺静脉压骤升：急性期肺泡水肿咳粉红泡沫痰；慢性期见含铁血黄素心衰细胞与肺褐色硬化。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P13-P22"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"起点：左心衰竭 → 肺静脉回流受阻","reveal":"肺毛细血管静水压升高、管壁高度扩张充满红细胞（光镜呈串珠样），红细胞与血浆渗入肺泡腔。","mechanism_tag":"血液动力学改变"},{"cue":"急性肺淤血表现（突发左心衰）","reveal":"肺饱满暗红、切面流泡沫状血性液体；镜下肺泡腔充满嗜酸性水肿液，临床表现为端坐呼吸、咳大量粉红色泡沫痰。","mechanism_tag":"急性肺水肿"},{"cue":"慢性肺淤血：巨噬细胞吞噬与肺褐色硬化","reveal":"肺泡腔内巨噬细胞吞噬漏出的红细胞，将血红蛋白分解为棕黄色含铁血黄素，形成“心衰细胞”（咳铁锈色痰）；伴肺泡壁纤维化增厚，肺质硬棕褐称“肺褐色硬化”。","mechanism_tag":"慢性纤维化与心衰细胞"}],"takeaway":"心衰细胞 = 肺泡腔内吞噬含铁血黄素的巨噬细胞（提示慢性左心衰/肺淤血，而非细胞自身起源于心脏）。"}},{"id":"histo_liver_lobule","title":"肝小叶微循环与肝窦结构","subject":"histology","syllabus_refs":["syl_histology_002"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"血液自门管区小叶间静脉/动脉经肝窦向心流至中央静脉，决定淤血时中央3区最先缺氧坏死。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P24-P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["肝小叶血流方向：门管区（小叶间静脉、小叶间动脉）→ {{肝血窦}} → {{中央静脉}} → 小叶下静脉 → 肝静脉 → 下腔静脉。","门管区三联管（Portal triad）：{{小叶间静脉}}(PV)、小叶间动脉(HA)、小叶间胆管(BD)。","肝血窦壁与肝细胞之间为{{窦周隙(Disse间隙)}}，内含贮脂细胞（{{肝星状细胞}}），激活后可合成胶原导致肝纤维化。"],"trap_note":"由于血氧自周边1区流向中央3区递减，右心衰逆流压迫时，中央静脉周围3区最先、最重受累；1区相对缺氧较轻而先发生脂肪变性。"}},{"id":"patho_hepatic_congestion","title":"右心衰与慢性肝淤血（槟榔肝→淤血性肝硬化）","subject":"pathology","syllabus_refs":["syl_pathology_019","syl_pathology_006"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"右心衰致中央静脉/肝窦高度淤血发红，周边肝细胞脂肪变发黄，构成红黄相间“槟榔肝”，久之成心源性肝硬化。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P23-P31"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"第1步：右心衰引发肝静脉→中央静脉逆行压力升高","reveal":"急性肝淤血时肝大暗红，镜下肝小叶中央静脉和邻近肝窦高度扩张充满红细胞。","mechanism_tag":"下腔静脉回流受阻"},{"cue":"第2步：分区损伤造就“槟榔肝 (Nutmeg Liver)”","reveal":"肝小叶中央区因严重淤血及压迫缺氧，肝细胞萎缩甚至坏死呈暗红色；周边部肝细胞轻度缺氧致脂肪变性呈黄色，切面红黄相间似槟榔。","mechanism_tag":"慢性肝淤血典型病变"},{"cue":"第3步：长期淤血→淤血性（心源性）肝硬化","reveal":"小叶中央肝细胞崩解、网状纤维塌陷胶原化，窦周隙肝星状细胞增生并大量合成胶原纤维，肝脏体积缩小、变硬并阻塞门静脉窦内血流。","mechanism_tag":"肝纤维化结局"}],"takeaway":"记忆口诀：中央红（淤血坏死）+ 周边黄（脂肪变性）= 槟榔肝；星状细胞活化 + 网状纤维胶原化 = 淤血性肝硬化。"}},{"id":"anat_portal_vein_system","title":"肝门静脉系属支与三大门腔侧支吻合","subject":"anatomy","syllabus_refs":["syl_anatomy_261","syl_anatomy_262"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"肝门静脉无功能性瓣膜且两端连毛细血管；肝硬化高压时经食管、直肠、脐周三大吻合支代偿致出血。","source_slides":["16 基础医学 静脉 淋巴.pdf#P28-P35"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["主干汇合：通常由{{肠系膜上静脉}}与{{脾静脉}}在胰颈后方汇合而成，收集腹腔内不成对脏器（肝除外）静脉血。","结构特点：两端均连接毛细血管网（胃肠毛细血管网与肝血窦），且缺乏{{功能性静脉瓣}}，门脉高压时血液易逆流。","吻合1（食管路径）：门静脉 → 胃左静脉 → {{食管静脉丛}} → 奇静脉 → 上腔静脉（曲张破裂致{{呕血}}）。","吻合2（直肠路径）：门静脉 → 肠系膜下静脉 → 直肠上静脉 → {{直肠静脉丛}} → 直肠下/肛静脉 → 髂内静脉 → 下腔静脉（曲张致{{便血}}）。","吻合3（脐周路径）：门静脉 → {{附脐静脉}} → 脐周静脉网 → 胸腹壁/腹壁上静脉（入上腔）及腹壁浅/下静脉（入下腔），形成“海蛇头”征。"],"trap_note":"门体分流开放虽缓解门脉高压，但使肠道吸收的氨与胺类未经肝解毒直接进入体循环，诱发高血氨与肝性脑病！"}},{"id":"patho_edema_mechanisms","title":"水肿发生机制：Starling 平衡失调与淋巴回流受阻","subject":"pathology","syllabus_refs":["syl_pathology_020"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"组织液积聚源于血管静水压↑、血浆胶体渗透压↓、血管通透性↑或淋巴回流障碍。","source_slides":["充血和淤血（基医 2学时）2026秋.pptx#P32-P44"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"机制1：毛细血管流体静水压↑（心源性/淤血性水肿）","reveal":"右心衰或静脉栓塞使静脉回流受阻，毛细血管静脉端静水压超过胶体渗透压，液体滤出增多并滞留组织间隙（如下肢凹陷性水肿、腹水）。","mechanism_tag":"流体静水压升高"},{"cue":"机制2：血浆胶体渗透压↓（肝性/肾性/营养不良性水肿）","reveal":"肝衰时白蛋白合成↓（或肾病综合征大量蛋白尿丢失白蛋白），血浆胶体渗透压降低导致组织液重吸收减少。","mechanism_tag":"低蛋白血症"},{"cue":"机制3与4：淋巴回流障碍 \u0026 微血管通透性↑","reveal":"丝虫阻塞或淋巴结清扫后富蛋白淋巴液滞留（象皮肿）；炎症介质使内皮间隙增宽形成富蛋白炎性水肿（需警惕喉头水肿窒息、脑水肿脑疝）。","mechanism_tag":"淋巴/通透性机制"}],"takeaway":"浆膜腔积液包括胸腔积液、心包积液与腹腔积液(ascites)；肺水肿阻碍气血交换，脑水肿诱发颅内高压与脑疝。"}},{"id":"biochem_aa_pool","title":"氨基酸代谢库与三条去路","subject":"biochem","syllabus_refs":["syl_biochem_029"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"外源消化吸收与内源蛋白降解共同构成氨基酸代谢库（骨骼肌占\u003e50%），主要合成蛋白、供能转化或变含氮活性物。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P8,P19-P28"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["代谢库分布不均：{{骨骼肌}}占 \u003e50%，肝约10%，血浆仅1%–6%（因氨基酸不能自由穿膜）。","内源蛋白质两条降解途径：胞质{{泛素-蛋白酶体途径}}（ATP依赖，E1/E2/E3标记短寿命/异常蛋白）与{{溶酶体途径}}（ATP非依赖，组织蛋白酶降解长寿命/膜蛋白）。","三条主要去路：① 合成体内{{蛋白质/多肽}}（最主要）；② 转变为嘌呤、嘧啶、肌酸、NO等特殊含氮物；③ {{脱氨基}}生成NH₃与α-酮酸。"],"trap_note":"9种营养必需氨基酸（体内不能合成）决定食物蛋白质营养价值；植物蛋白（谷类缺赖氨酸 vs 豆类缺蛋/色氨酸）混合食用可互补。"}},{"id":"biochem_transamination_deamination","title":"转氨基、L-谷氨酸脱氢与联合脱氨基作用","subject":"biochem","syllabus_refs":["syl_biochem_030"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"多数氨基酸通过转氨酶（辅酶PLP）将氨基集中至谷氨酸，再由线粒体GDH氧化脱氨释放游离NH₃。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P31-P45","丙氨酸联合脱氨基2026基础班.pptx"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"第1步：转氨基作用（只换位、不脱氨）","reveal":"转氨酶（如ALT/GPT、AST/GOT）以维生素B₆衍生物磷酸吡哆醛(PLP)为辅酶，将α-氨基酸的氨基可逆转移至α-酮戊二酸，生成谷氨酸与新的α-酮酸。","mechanism_tag":"PLP 乒乓机制"},{"cue":"第2步：L-谷氨酸氧化脱氨基","reveal":"肝、肾、脑线粒体内的L-谷氨酸脱氢酶(GDH)以NAD⁺/NADP⁺为辅酶催化谷氨酸脱氨生成α-酮戊二酸与游离NH₃（ATP/GTP抑制、ADP/GDP激活）。","mechanism_tag":"释放游离 NH₃"},{"cue":"第3步：联合脱氨基 \u0026 α-酮酸去路","reveal":"上述两步偶联即“联合脱氨基”（骨骼肌/心肌GDH活性低，改走嘌呤核苷酸循环）。脱氨后剩下的α-酮酸可：① 再氨基化成非必需氨基酸；② 转变成糖或脂；③ 入TCA循环彻底氧化供能。","mechanism_tag":"碳氮分流汇合"}],"takeaway":"口诀：B₆兄弟三（吡哆醛/醇/胺），磷酸化后“脱羧又转氨”；联合脱氨基把20种氨基酸的氨基统一汇入谷氨酸再放氨。"}},{"id":"biochem_blood_ammonia_sources","title":"血氨三大来源与 pH 依赖性离子障吸收","subject":"biochem","syllabus_refs":["syl_biochem_030","syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"血氨来自氨基酸脱氨、肠道产氨与肾小管泌氨；NH₃较NH₄⁺更易透膜，偏碱环境促血氨入血加重中毒。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P2-P5"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["来源1（最主要）：体内各组织{{氨基酸脱氨基}}产生（正常血氨 47–65 μmol/L）。","来源2（肠道约4g/d）：结肠内未吸收氨基酸腐败脱氨，以及血尿素渗入肠道后经肠菌{{尿素酶}}水解释放NH₃。","来源3（肾小管泌氨）：谷氨酰胺在{{谷氨酰胺酶}}作用下释放NH₃进入肾小管腔，与H⁺结合为NH₄⁺随尿排出以排酸保碱。","临床“离子障”陷阱：肠道或尿液偏{{碱}}时，NH₄⁺去质子转化为脂溶性{{NH₃}}，更易跨膜吸收入血；故肝性脑病禁用{{碱性肥皂水}}灌肠，且肝硬化腹水慎用碱性利尿药。"],"trap_note":"高血氨灌肠应选弱酸性溶液（如乳果糖酸化肠腔），使氨保留为不易透膜的 NH₄⁺ 随粪便排出。"}},{"id":"biochem_ammonia_transport","title":"血氨无毒转运：丙氨酸-葡萄糖循环 vs 谷氨酰胺","subject":"biochem","syllabus_refs":["syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"游离NH₃剧毒，血液主要以肌肉→肝的丙氨酸（兼供糖）和脑/肌肉→肝肾的谷氨酰胺两种无毒形式运氨。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P6-P8"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["比较项目","丙氨酸-葡萄糖循环","谷氨酰胺 (Gln) 运氨"],"rows":[["出发与靶器官","骨骼肌 → 血液 → 肝脏（返还葡萄糖）","脑、骨骼肌等 → 血液 → 肝脏（成尿素）/肾（排NH₄⁺）"],["关键酶与耗能","肌/肝ALT(转氨) + 肝糖异生(耗6ATP)","谷氨酰胺合成酶(耗1ATP) / 谷氨酰胺酶(分解)"],["核心生理意义","运氨出肌 + 肝向肌肉持续供应葡萄糖","氨的暂时储存、解毒与运输；脑氨中毒解毒关键"]],"quiz":{"stem":"关于谷氨酰胺在体内氨代谢中的作用，下列叙述错误的是：","options":["既是氨的运输形式，也是氨的解毒和储存形式","谷氨酰胺合成酶催化谷氨酸与NH₃结合并消耗ATP","该合成与分解过程由同一个酶催化可逆完成","临床上可输入谷氨酸盐辅助降低血氨"],"answer_idx":2,"explain":"谷氨酰胺的合成（谷氨酰胺合成酶，耗ATP）与水解（谷氨酰胺酶）由不同酶催化，各自不可逆。"}}},{"id":"biochem_urea_cycle","title":"鸟氨酸循环（尿素合成五步与限速调节）","subject":"biochem","syllabus_refs":["syl_biochem_031"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肝脏“两步线粒体、三步胞质”耗3分子ATP(4高能键)将2分子NH₃和CO₂转化为无毒尿素。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P10-P24"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"线粒体第1步（启动限速）：NH₃ + CO₂ + 2ATP → 氨基甲酰磷酸","reveal":"由肝线粒体氨基甲酰磷酸合成酶Ⅰ (CPS-Ⅰ) 催化，N-乙酰谷氨酸 (AGA) 是其必需别构激活剂；精氨酸可激活AGA合酶。","mechanism_tag":"CPS-Ⅰ \u0026 AGA 变构激活"},{"cue":"线粒体第2步：与鸟氨酸缩合为瓜氨酸","reveal":"鸟氨酸氨基甲酰转移酶 (OCT) 催化瓜氨酸生成，随后瓜氨酸跨线粒体内膜进入胞质。","mechanism_tag":"跨膜出线粒体"},{"cue":"胞质第3–5步：天冬氨酸供第2个氮→裂解延胡索酸→释放尿素","reveal":"③ 瓜氨酸+天冬氨酸在精氨酸代琥珀酸合成酶（活性最低、决定稳态速度）催化下消耗ATP(→AMP+PPi)成精氨酸代琥珀酸；④ 裂解为精氨酸+延胡索酸（联结TCA循环）；⑤ 精氨酸酶水解出尿素并再生鸟氨酸。","mechanism_tag":"联结TCA循环 · 再生鸟氨酸"}],"takeaway":"总反应耗 3 ATP（4个高能磷酸键）；两个氮分别来自游离 NH₃ 和天冬氨酸；CPS-Ⅰ 负责启动，精氨酸代琥珀酸合成酶决定整体反应速度。"}},{"id":"biochem_hyperammonemia_he","title":"高血氨症与肝性脑病的两条生化机制","subject":"biochem","syllabus_refs":["syl_biochem_031","syl_biochem_030"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"肝衰或门体分流使血氨/胺类绕过解毒入脑：NH₃耗竭脑内α-酮戊二酸致ATP锐减；酪胺/苯乙胺转成假神经递质。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P16","2026-基医-氨基酸代谢-2.pdf#P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"线索1（氨中毒）：大量NH₃消耗脑内α-酮戊二酸","reveal":"过量NH₃逆推脑内GDH与谷氨酰胺合成酶反应：α-酮戊二酸 → 谷氨酸 → 谷氨酰胺。","mechanism_tag":"TCA 中间物被抽空"},{"cue":"能量衰竭与渗透性脑水肿","reveal":"α-酮戊二酸枯竭使脑细胞TCA循环受阻、ATP合成急剧下降；同时胞内谷氨酰胺堆积升高渗透压引发星形胶质细胞水肿，致嗜睡、昏迷。","mechanism_tag":"脑能量危机 + 水肿"},{"cue":"线索2（假神经递质）：肠道腐败胺绕肝入脑","reveal":"肠菌脱羧生成酪胺、苯乙胺，经门体侧支绕过肝灭活后入脑，经β-羟化酶生成β-羟酪胺与苯乙醇胺，竞争性取代去甲肾上腺素/多巴胺而抑制脑功能。","mechanism_tag":"假神经递质假说"}],"takeaway":"肝性脑病是“门体解剖分流 + 鸟氨酸循环解毒失败 + 脑TCA能量障碍/假神经递质”的三科交汇典型。"}},{"id":"biochem_asparaginase_leukemia","title":"【拓展】天冬酰胺酶选择性治疗白血病的生化基础","subject":"biochem","syllabus_refs":["syl_biochem_028"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"白血病细胞缺乏天冬酰胺合成酶，外源注射天冬酰胺酶耗竭血中天冬酰胺即可饿死肿瘤细胞。","source_slides":["2026-基医-氨基酸代谢-2.pdf#P9"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["正常细胞可通过{{天冬酰胺合成酶}}（由{{谷氨酰胺}}提供酰胺基）自主合成天冬酰胺。","某些急性白血病细胞自身缺乏天冬酰胺合成酶，高度依赖血浆供给；应用{{天冬酰胺酶}}水解血中天冬酰胺为天冬氨酸，可选择性阻断白血病蛋白合成。"],"trap_note":"属于大纲拓展联系点，主干巡航默认折叠在邻域探索胶囊中。"}},{"id":"physio_homeostasis_feedback","title":"内环境稳态与负反馈、正反馈及前馈控制","subject":"physiology","syllabus_refs":["syl_physiology_003","syl_physiology_004"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"细胞外液构成内环境；负反馈维持稳态，正反馈加速过程完成（如动作电位Na⁺内流），前馈提前纠偏。","source_slides":["基础医学分论-1-绪论机体功能的调节20261014.pptx"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["控制模式","调节方向与特征","医学经典例证"],"rows":[["负反馈","反馈信号抑制原控制信息，维持稳态核心","减压反射稳血压、体温调节、激素轴调节"],["正反馈","反馈信号放大原反应，加速推向终点","动作电位去极相Na⁺再生性内流、排尿、凝血、分娩"],["前馈控制","干扰未实际改变受控变量前提前预判调节","看到食物分泌唾液胃液、运动前呼吸心率预上升"]],"quiz":{"stem":"下列生理过程中属于典型“正反馈”调节的是：","options":["动脉血压升高触发颈动脉窦压力感受性反射使血压回降","动作电位爆发时Na⁺内流进一步去极化并开放更多Na⁺通道","体温升高时汗腺分泌增加以促进散热","寒冷环境下寒战产热维持核心体温"],"answer_idx":1,"explain":"Na⁺内流→去极化→更多电压门控Na⁺通道开放形成Hodgkin循环，是细胞电生理最经典的再生性正反馈。"}}},{"id":"physio_membrane_transport","title":"细胞膜跨膜物质转运与 Na⁺-K⁺ 泵核心地位","subject":"physiology","syllabus_refs":["syl_physiology_005"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"易化扩散顺梯度不耗能（载体饱和/通道闸门）；Na⁺-K⁺泵每耗1ATP泵出3Na⁺泵入2K⁺，既立梯度又直接生电。","source_slides":["细胞跨膜物质转运-基础医学分论2026-chyh.pdf"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["转运方式","浓度梯度与耗能","关键特征与代表"],"rows":[["单纯扩散","顺电化学梯度 · 不耗能","无膜蛋白协助（O₂、CO₂、NH₃、脂溶性小分子）"],["载体易化扩散","顺梯度 · 不耗能","结构特异性、饱和现象、竞争性抑制（GLUT运糖）"],["通道易化扩散","顺梯度 · 速率极快","电压/化学/机械门控，离子选择性（Na⁺/K⁺/Ca²⁺通道）"],["Na⁺-K⁺泵(原发主动)","逆梯度 · 直接耗1ATP","出3Na⁺入2K⁺：建立细胞内外离子势能+5%生电超极化+维持胞容"],["继发性主动转运","逆梯度 · 借Na⁺梯度势能","SGLT同向吸收葡萄糖、小肠氨基酸-Na⁺三联体吸收"]],"quiz":{"stem":"阻断钠钾泵（如缺氧致ATP锐减或应用哇巴因）后，最早直接丧失动力的是：","options":["O₂经脂质双分子层的单纯扩散","小肠黏膜SGLT对葡萄糖和氨基酸的继发性主动吸收","巨噬细胞吞噬细菌的入胞作用","乙醇自由穿膜扩散"],"answer_idx":1,"explain":"继发性主动转运依赖钠泵建立的胞外高Na⁺电化学势能；此外缺氧使钠泵停摆也是细胞水肿的起点。"}}},{"id":"physio_resting_potential","title":"静息电位产生机制：K⁺ 平衡电位与生电钠泵修正","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"静息电位(-70~-90mV)主要源于膜对K⁺高通透性促使K⁺外流达电化学平衡，因少量Na⁺内流而略低于Ek。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P9-P16"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"前提条件：离子不均分布 + 静息膜选择性通透","reveal":"钠泵维持胞内高K⁺、胞外高Na⁺；静息时膜对离子通透比约为 K⁺ : Na⁺ = 1 : 0.01~0.05（K⁺通道开放为主）。","mechanism_tag":"基础稳态条件"},{"cue":"平衡确立：K⁺外流形成内负外正的扩散电位","reveal":"K⁺顺浓度差外流使膜内负电荷积聚，形成的电场力反过来阻止K⁺继续外流；当电化学驱动力 ECDF = Vm - Ek = 0 时达Nernst平衡电位(Ek)。","mechanism_tag":"Nernst 平衡"},{"cue":"实测修正：Vm 略小于(负值略低于) Ek 的原因","reveal":"因静息时仍有微弱Na⁺内流部分抵消K⁺外流，实测静息电位绝对值略小于Ek；而钠泵3出2入的生电作用额外贡献不超过5%的超极化。","mechanism_tag":"GHK 方程修正"}],"takeaway":"膜电位向某一离子的平衡电位移动规则：哪种离子通透性骤增，Vm就迅速扑向该离子的平衡电位！"}},{"id":"physio_action_potential","title":"动作电位产生、Na⁺ 通道三态与不应期传导","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"阈刺激触发电压门控Na⁺通道正反馈开放（去极化超射）随后失活并叠加延迟K⁺外流复极，呈“全或无”不衰减传导。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P20-P35"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"去极上升支：达阈电位后Na⁺通道呈正反馈再生开放","reveal":"局部去极化至阈电位，电压门控Na⁺通道从“静息态”一过性转为“激活态”，Na⁺迅速内流（内向电流）形成去极化与超射，逼近E_Na。","mechanism_tag":"G_Na 骤增 · 全或无"},{"cue":"复极下降支与绝对不应期：Na⁺通道失活 + K⁺延迟外流","reveal":"去极化迅速触发Na⁺通道进入“失活态”（此时任何强刺激都无法再激活，构成绝对不应期），同时电压门控K⁺通道延迟激活使K⁺大量外流复极。","mechanism_tag":"失活态决定不应期"},{"cue":"兴奋传导：局部电流与有髓纤维跳跃传导","reveal":"同一细胞膜上通过局部电流使邻近未兴奋区达阈电位，动作电位幅度不衰减传导；在有髓神经纤维上仅在郎飞结产生兴奋呈高速跳跃式传导。","mechanism_tag":"局部电流不衰减"}],"takeaway":"局部电位（电紧张扩布、可总和、衰减）vs 动作电位（全或无、不衰减传导、有绝对不应期）。"}},{"id":"histo_chemical_synapse","title":"化学突触的超微结构（前膜、间隙与后膜）","subject":"histology","syllabus_refs":["syl_histology_041"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"化学突触由突触前成分（含囊泡与线粒体）、20–30nm突触间隙和含受体/酶的突触后膜组成，确保单向传递。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx","肌细胞的收缩-基础医学分论2026-chyh.pdf#P3"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["突触前成分（如轴突终末/运动终板前膜）：含大量线粒体与{{突触囊泡}}（每个囊泡含约10⁴个{{ACh}}分子）及前膜致密投影。","突触间隙：宽约 {{20–30 nm}} 的细胞外隙，内含细胞外基质与分解递质的酶（如神经-肌接头间隙侧的{{乙酰胆碱酯酶 AChE}}）。","突触后成分（如终板膜）：胞质侧有电子致密物质，膜上密集镶嵌特异性受体离子通道（终板膜为{{N₂型ACh受体}}阳离子通道）。"],"trap_note":"电突触本质是缝隙连接（双向、几乎无延搁，如心肌闰盘）；化学突触只能从前膜向后膜单向传递且存在时间延搁。"}},{"id":"physio_nmj_transmission","title":"骨骼肌神经-肌接头兴奋传递（Ca²⁺ 触发量子式释放）","subject":"physiology","syllabus_refs":["syl_physiology_008"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"电-化学-电三步转换：神经AP→Ca²⁺内流→ACh囊泡量子释放→N₂受体阳离子通道开→终板电位(EPP)扩布引发肌膜AP。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P3-P9"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"电 → 化学耦联：前膜Ca²⁺内流促发ACh量子式释放","reveal":"神经末梢AP开放前膜电压门控Ca²⁺通道，Ca²⁺内流触发约125个囊泡与前膜融合出胞（1个囊泡即1个量子，自发释放1个仅产生微终板电位mEPP）。","mechanism_tag":"Ca²⁺ 依赖的量子释放"},{"cue":"化学 → 电转换：终板膜产生去极化终板电位 (EPP)","reveal":"ACh结合终板膜N₂型ACh受体阳离子通道（Na⁺内流为主、少量K⁺外流），产生50–75 mV去极化局部电位——终板电位(EPP)。","mechanism_tag":"N₂受体 · 1:1高安全系数"},{"cue":"肌膜扩布与终止：触发一般肌膜AP \u0026 AChE迅速消除","reveal":"EPP电紧张扩布至邻近一般肌膜达阈电位激发肌膜动作电位；ACh在几毫秒内被终板膜间隙侧AChE分解。筒箭毒碱、α-银环蛇毒阻断N₂受体可致肌麻痹。","mechanism_tag":"AChE 终止信号"}],"takeaway":"记住神经-肌接头传递六大特征：化学性、单向、时间延搁、EPP属局部电位、安全系数高呈1:1传递、易受毒物/内环境影响。"}},{"id":"histo_skeletal_muscle_triad","title":"骨骼肌超微结构：肌节排列与三联管","subject":"histology","syllabus_refs":["syl_histology_034","syl_physiology_008"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"相邻两Z线间为一个肌节（1/2 I带 + A带 + 1/2 I带）；T小管与两侧肌浆网终池构成三联管完成兴奋耦联。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P10-P16"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["基本收缩单位：相邻两条 {{Z线}} 之间的区段称为{{肌节(sarcomere)}}，包含 ½明带(I带)+暗带(A带)+½明带(I带)。","肌丝分子构成：粗肌丝由{{肌球蛋白(myosin)}}组成，其头部连桥臂构成横桥（具{{ATP酶}}活性）；细肌丝由肌动蛋白、原肌球蛋白与肌钙蛋白按 {{7:1:1}} 比例组成。","肌钙蛋白(Troponin)三亚基：{{TnC}}结合Ca²⁺、TnI抑制肌动蛋白结合位点、TnT连于原肌球蛋白。","兴奋-收缩耦联结构基础：{{横管(T管)}}与两侧相邻肌浆网{{终池}}在A-I交界处紧密相贴，构成{{三联管(triad)}}（心肌在Z线水平多为二联管）。"],"trap_note":"肌肉收缩时肌节缩短、明带(I带)与H带变窄，而暗带(A带)以及粗、细肌丝本身的长度均保持不变！"}},{"id":"physio_ec_coupling_sliding","title":"横纹肌兴奋-收缩耦联与横桥周期（肌丝滑行）","subject":"physiology","syllabus_refs":["syl_physiology_008","syl_histology_035"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"Ca²⁺是耦联因子：T管兴奋触发终池RyR放Ca²⁺→Ca²⁺结合TnC移开原肌球蛋白→横桥扭动45°拉细肌丝向M线滑行。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P10-P18"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"兴奋→Ca²⁺释放（三联管耦联）","reveal":"肌膜AP沿T管传入，使T管膜L型Ca²⁺通道(DHPR)变构并机械偶联激活肌浆网终池兰尼碱受体(RyR)，胞质[Ca²⁺]骤增约100倍。","mechanism_tag":"机械偶联放 Ca²⁺"},{"cue":"位点暴露（细肌丝去抑制）","reveal":"Ca²⁺结合肌钙蛋白TnC亚基引发构象变构，减弱TnI抑制并把原肌球蛋白推入细肌丝双螺旋沟槽深部，暴露肌动蛋白上的横桥结合位点。","mechanism_tag":"TnC 构象解除抑制"},{"cue":"横桥周期：扭动滑行、ATP解离复位与Ca²⁺回收舒张","reveal":"高势能横桥结合肌动蛋白并释放ADP+Pi，头部向M线扭动45°产生棘齿作用拖动细肌丝滑行；必须结合新ATP才能使横桥与肌动蛋白分离并水解ATP复位（死后缺ATP出现尸僵）。停止兴奋后肌浆网钙泵(SERCA)耗ATP回收Ca²⁺致舒张。","mechanism_tag":"ATP 兼供解离与复位"}],"takeaway":"ATP在横桥周期中的双重铁律：水解ATP给横桥“上弦蓄能”，结合新ATP才能让横桥“松手分离”。"}},{"id":"physio_skeletal_vs_smooth","title":"骨骼肌 vs 平滑肌结构与收缩耦联机制","subject":"physiology","syllabus_refs":["syl_histology_037","syl_physiology_008"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"平滑肌无肌节与肌钙蛋白TnC，胞外Ca²⁺为主结合钙调蛋白(CaM)激活MLCK磷酸化肌球蛋白轻链引发滑行。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P25-P29"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["核心对比","骨骼肌","平滑肌"],"rows":[["超微结构","有规则肌节与Z线，T管+终池构成三联管","无肌节横纹，有致密体/致密斑；质膜小凹，无T管"],["Ca²⁺ 主要来源","几乎完全依赖发达的肌浆网(SR)终池释放","主要来自细胞外Ca²⁺内流（L型通道）+ 药物IP₃R通路"],["Ca²⁺ 靶蛋白与触发","结合细肌丝肌钙蛋白TnC，构象变构暴露位点","无TnC！结合CaM激活MLCK使肌球蛋白轻链(MLC)磷酸化"],["电耦联特性","单根肌纤维独立支配（无电耦联）","内脏单单位平滑肌借缝隙连接同步舒缩（含慢波）"]],"quiz":{"stem":"平滑肌与横纹肌（骨骼肌/心肌）分子收缩启动机制最根本的差异在于平滑肌缺乏：","options":["肌动蛋白和肌球蛋白","ATP 酶活性的横桥结构","细肌丝上的肌钙蛋白 (Troponin)","Ca²⁺ 作为收缩触发因子"],"answer_idx":2,"explain":"平滑肌没有肌钙蛋白，其调控在粗肌丝端完成：Ca²⁺-CaM 激活 MLCK 磷酸化肌球蛋白轻链启动滑行。"}}},{"id":"physio_muscle_load_factors","title":"影响骨骼肌收缩效能的因素（前负荷/后负荷/收缩能力）","subject":"physiology","syllabus_refs":["syl_physiology_008"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"前负荷决定最适初长度(2.0–2.2μm)；后负荷决定缩短速度与张力；频率与多纤维总和放大总张力。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P19-P24"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["调节因素","作用机制与曲线规律","典型表现与极值"],"rows":[["前负荷 (Preload)","决定收缩前肌肉初长度与粗细肌丝有效重叠","肌节2.0–2.2μm达最适初长度（横桥作用位点最多）"],["后负荷 (Afterload)","收缩时才承受的阻力（先等长后等张收缩）","后负荷↑ → 收缩张力↑，但开始缩短推迟、速度↓、距离↓"],["肌肉收缩能力","不依赖负荷的内在特性（Ca²⁺、横桥ATP酶活性）","肾上腺素/交感兴奋↑；缺氧/酸中毒↓"],["时间与空间总和","高频刺激叠加(时间) + 募集更多运动单位(空间)","完全强直收缩张力可达单收缩 3–4 倍（大小原则募集）"]],"quiz":{"stem":"在后负荷逐渐增大的等张收缩实验中，关于骨骼肌机械表现的描述正确的是：","options":["肌肉开始缩短的时间提前","肌肉缩短的初速度加快","肌肉主动发展的张力增大，但缩短速度和幅度减小","肌节最适初长度随之成比例延长"],"answer_idx":2,"explain":"后负荷越大，等长收缩阶段需蓄积更高张力才能拉动负荷，因此开始缩短推迟、缩短速度及缩短距离下降。"}}},{"id":"pharma_efferent_transmitters","title":"传出神经系统递质（ACh 与 NA）合成、释放与消除","subject":"pharmacology","syllabus_refs":["syl_pharmacology_061","syl_pharmacology_062","syl_pharmacology_063"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"ACh依赖突触间隙AChE极速水解消除；去甲肾上腺素(NA)主要依赖突触前膜NET主动摄取1回收消除。","source_slides":["《基础医学分论》药理部分大纲 · 传出神经概论"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["对比环节","乙酰胆碱 (ACh · 胆碱能神经)","去甲肾上腺素 (NA · 肾上腺素能神经)"],"rows":[["生物合成限速","胆碱 + 乙酰CoA（胆碱乙酰转移酶，胆碱摄取限速）","酪氨酸 → 多巴（酪氨酸羟化酶为限速酶）→ 多巴胺 → NA"],["囊泡贮存与释放","囊泡储存；AP→Ca²⁺内流促量子化胞裂外排","囊泡储存；Ca²⁺内流促胞裂外排"],["作用消失主方式","被间隙内乙酰胆碱酯酶(AChE)迅速水解（极快）","约75–90%被突触前膜摄取1(NET)主动再摄取（可卡因抑制）"],["主要作用受体","M受体（G蛋白偶联）/ N₁、N₂受体（离子通道）","α₁/α₂、β₁/β₂/β₃ 受体（均为GPCR）"]],"quiz":{"stem":"去甲肾上腺素释放到突触间隙后，其生理效应终止的最主要方式是：","options":["被突触间隙单胺氧化酶(MAO)瞬间彻底灭活","被突触前膜摄取1主动再摄取回神经末梢囊泡","被乙酰胆碱酯酶水解失活","全部扩散进入血液由肾脏原形排出"],"answer_idx":1,"explain":"与ACh靠酶快速水解不同，NA主要靠突触前膜主动再摄取（摄取1）终止作用并可重新入囊泡再利用。"}}},{"id":"patho_cellular_adaptation","title":"细胞适应四大类型（萎缩/肥大/增生/化生）","subject":"pathology","syllabus_refs":["syl_pathology_001","syl_pathology_002","syl_pathology_003","syl_pathology_004"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"萎缩体积↓、肥大体积↑、增生数量↑、化生是同源已分化细胞类型转换（多为上皮间或间叶间可逆转化）。","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P24-P45"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["适应类型","细胞本质改变","经典生理/病理实例与陷阱"],"rows":[["萎缩 (Atrophy)","实质细胞体积缩小（数量也可减）","脑萎缩、肾盂积水压迫性萎缩、去神经肌萎缩；注意“假性肥大”"],["肥大 (Hypertrophy)","细胞体积增大、细胞器增多","高血压左室心肌代偿性肥大、妊娠子宫平滑肌"],["增生 (Hyperplasia)","实质细胞数量增多","妊娠期乳腺增生、前列腺增生（仅具分裂能力细胞可发生）"],["化生 (Metaplasia)","一种已分化细胞转化为另一种同源成熟细胞","长期吸烟支气管纤毛柱状上皮→鳞状上皮化生；胃肠上皮化生"]],"quiz":{"stem":"关于“化生 (Metaplasia)”的概念，下列理解正确的是：","options":["成熟上皮细胞直接转化为骨骼肌细胞","属于细胞恶性转化和异型增生的不可逆终点","由干细胞重编程分化为另一种同源成熟细胞，去除刺激可逆，但长期存在可增加癌变风险","本质是间质脂肪细胞增生引起的假性肥大"],"answer_idx":2,"explain":"化生常发生在同源上皮之间或同源间叶之间（经组织干细胞重编程），初期可逆并增强局部耐受，但可能减弱防御或诱发癌变。"}}},{"id":"patho_hydropic_degeneration","title":"缺氧所致细胞水肿机制与光镜/电镜病变","subject":"pathology","syllabus_refs":["syl_pathology_005"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"缺氧或毒物抑制线粒体ATP生成→细胞膜Na⁺-K⁺泵衰竭→Na⁺与水大量潴留胞内，镜下呈现颗粒变性/气球样变。","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P18-P21"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"分子起点：缺血/缺氧 → 氧化磷酸化障碍、ATP↓","reveal":"损伤因子直接损伤线粒体使ATP骤降，胞膜上高度耗能的Na⁺-K⁺泵活性迅速衰竭。","mechanism_tag":"能量泵衰竭"},{"cue":"渗透失衡：胞内Na⁺潴留触发水分子大量内移","reveal":"Na⁺无法泵出而滞留胞质，细胞内渗透压升高吸引水分进入；同时无氧酵解产乳酸使胞内pH下降、溶酶体膜通透性增高。","mechanism_tag":"钠水潴留"},{"cue":"形态演进：颗粒变性 → 疏松空泡变 → 气球样变（可逆上限）","reveal":"电镜见线粒体肿胀嵴变短、内质网扩张；光镜见细胞肿大、胞质淡染出现红染细颗粒或透亮空泡（病毒性肝炎见气球样变）；大体器官肿胀包膜紧张、切面浑浊。","mechanism_tag":"可逆性损伤形态"}],"takeaway":"细胞水肿是最常见、最早发生的可逆性损伤；解除缺氧后ATP恢复、钠泵重启即可复原，持续加重则滑向坏死。"}},{"id":"patho_fatty_change","title":"脂肪变（肝脂肪变与虎斑心）","subject":"pathology","syllabus_refs":["syl_pathology_006"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"非脂肪细胞胞质内蓄积中性脂肪滴（甘油三酯），HE制片因脂滴溶解呈大小不等的空泡，需苏丹Ⅲ或油红O冰冻切片染色证实。","source_slides":["《基础医学分论》病理部分大纲 · 脂肪变"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["肝脂肪变机制：游离脂肪酸进入过多、{{脂肪酸β-氧化}}障碍（如缺氧/酒精）、或脂蛋白合成（{{载脂蛋白}}缺乏）排泄受阻。","病理切片识别技巧：常规石蜡切片制作中有机溶剂溶去脂滴，HE下仅见{{境界清楚的圆形空泡}}，易将细胞核挤向一侧；确诊需做冰冻切片{{苏丹Ⅲ}}（橘红）或油红O染色。","心肌脂肪变（{{虎斑心}}）：慢性缺氧或严重贫血时，左心室内膜下及乳头肌心肌细胞呈成排黄色条纹，与未受累红褐色心肌相间呈虎皮斑纹状。"],"trap_note":"注意区分脂肪变（胞质内蓄积空泡，实质细胞受累）与心肌脂肪浸润（心外膜脂肪组织增生深入心肌间质，易致心脏破裂）。"}},{"id":"patho_necrosis_types","title":"细胞坏死核改变及六种坏死病理类型鉴别","subject":"pathology","syllabus_refs":["syl_pathology_010","syl_pathology_011"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"坏死的形态金标准是核固缩→核碎裂→核溶解；不同组织成分和酶活性决定凝固性、液化性、干酪样、脂肪、纤维蛋白样坏死及坏疽。","source_slides":["《基础医学分论》病理部分大纲 · 坏死"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["坏死类型","核心特征与机制","好发器官/疾病代表"],"rows":[["凝固性坏死","蛋白质凝固，灰黄干燥、早期组织轮廓仍保留","心、肾、脾贫血性梗死（干酪样坏死属特殊彻底类型，见于结核）"],["液化性坏死","蛋白少脂质多或蛋白酶丰富，组织彻底溶解液化","脑软化(脑梗死)、化脓性炎脓肿、阿米巴肝脓肿"],["脂肪坏死","胰酶释放或创伤释放脂肪酸与Ca²⁺结合成钙皂","急性胰腺炎（酶解性）、乳腺外伤性脂肪坏死"],["纤维蛋白样坏死","免疫复合物沉积或高血压致胶原/血管壁坏死似纤维素","风湿病、结节性多动脉炎、急进性高血压小动脉"],["坏疽 (Gangrene)","大块坏死伴不同程度腐败菌感染发黑","干性（四肢末梢干燥边界清）/ 湿性（肠、肺、子宫）/ 气性（深创产气荚膜）"]],"quiz":{"stem":"脑梗死后形成的软化灶主要属于哪种坏死类型？其组织轮廓为何不能像心肌梗死那样暂时保留？","options":["凝固性坏死；因脑缺血后胶原蛋白瞬间凝固","液化性坏死；因脑组织含大量磷脂与水分且蛋白含量较少，易溶解","干酪样坏死；因脑内巨噬细胞释放大量结核菌脂质","纤维蛋白样坏死；因大脑动脉壁免疫复合物沉积"],"answer_idx":1,"explain":"脑组织脂质和水分丰富而结构蛋白较少，坏死后迅速发生酶性溶解，形成典型的液化性坏死。"}}},{"id":"patho_necrosis_outcomes","title":"坏死的四大结局（溶解吸收、分离排出、机化、钙化）","subject":"pathology","syllabus_refs":["syl_pathology_012"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"坏死灶依大小与位置走向溶解吸收、经管道排空形成空洞/溃疡、肉芽组织机化包裹，或发生营养不良性钙化。","source_slides":["《基础医学分论》病理部分大纲 · 坏死结局"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["① 溶解吸收：小坏死灶由中性粒细胞与巨噬细胞释放蛋白水解酶液化，经淋巴管/血管吸收。","② 分离排出：较大坏死灶与周围组织分解脱落——皮肤黏膜形成深达黏膜下层的{{溃疡(ulcer)}}；肾肺等内脏排出后遗留{{空洞(cavity)}}；深部连至体表开口管道称{{窦道}}，通连两腔或皮肤与体腔称{{瘘管}}。","③ {{机化(organization)}}：不能完全溶解吸收的坏死物、血栓或纤维素渗出物，被新生的{{肉芽组织}}取代并最终形成瘢痕的过程。","④ 包裹与钙化：过大坏死灶周围纤维结缔组织增生将其包裹，随后发生{{营养不良性钙化}}。"],"trap_note":"机化（Granulation tissue 取代坏死/血栓）≠ 化生（成熟细胞类型转变），考试名词解释极易混淆！"}},{"id":"patho_calcification_types","title":"营养不良性钙化 vs 转移性钙化","subject":"pathology","syllabus_refs":["syl_pathology_015"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"营养不良性钙化血钙正常、局限于变性坏死组织；转移性钙化源于全身高钙血症、沉积于未受损正常组织。","source_slides":["《基础医学分论》病理部分大纲 · 病理性钙化"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["比较点","营养不良性钙化","转移性钙化"],"rows":[["血钙 / 血磷浓度","正常（无全身钙磷代谢障碍）","显著升高（全身钙磷代谢异常）"],["沉积部位与前提","局部变性、坏死组织或异物（先伤后钙）","多处正常健康组织：肺泡壁、肾小管、胃黏膜（先钙后伤）"],["典型疾病实例","结核干酪样坏死钙化、动脉粥样硬化斑块、血栓静脉石","甲状旁腺功能亢进、骨肿瘤溶骨破坏、VitD中毒"]],"quiz":{"stem":"肺结核干酪样坏死灶经治疗稳定后局部出现钙盐沉积，其根本机制属于：","options":["血钙浓度显著升高所致的转移性钙化","血钙正常而局部坏死组织碱性磷酸酶及酸性环境改变所致的营养不良性钙化","属于细胞适应中的鳞状上皮化生","仅见于甲状旁腺功能亢进患者"],"answer_idx":1,"explain":"结核干酪样坏死灶局部钙盐沉积时全身血钙正常，是营养不良性钙化的最经典实例。"}}},{"id":"patho_apoptosis_vs_necrosis","title":"【拓展】细胞凋亡 vs 细胞坏死形态与炎症差异","subject":"pathology","syllabus_refs":["syl_pathology_010"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"凋亡是基因主动调控（Caspase级联）的单细胞缩水程序性死亡，膜完整、形成凋亡小体、不引发周围炎症。","source_slides":["《基础医学分论》病理部分大纲 · 凋亡与坏死"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["对比特征","细胞坏死 (Necrosis)","细胞凋亡 (Apoptosis)"],"rows":[["诱导与范围","强烈病理打击 · 成片细胞","生理/轻度损伤基因编程 · 单个散在细胞"],["细胞体积与质膜","细胞肿胀、胞膜破裂内容物外溢","细胞皱缩固缩、胞膜完整出芽成“凋亡小体”"],["DNA 降解与电泳","随机降解 → 琼脂糖电泳呈弥散涂片状","核小体间规律断裂 → 特征性 180–200bp 梯状条带"],["周围组织反应","必然引起明显急性炎症反应","巨噬细胞静默吞噬凋亡小体，无炎症反应"]],"quiz":{"stem":"判断组织切片中发生细胞凋亡而非坏死的最关键组织学依据是：","options":["大块心肌细胞肿胀破裂伴大量中性粒细胞浸润","散在单个细胞皱缩、染色质边集并形成包膜完整的凋亡小体，周围无炎性反应","出现核溶解并伴大片红染纤维素渗出","伴有钙盐沉积成蓝紫色团块"],"answer_idx":1,"explain":"凋亡细胞膜完整、迅速被邻近吞噬细胞清除，故不引发周围急性炎症反应。"}}},{"id":"anat_vein_characteristics","title":"体循环静脉结构共性与深浅静脉分布规律","subject":"anatomy","syllabus_refs":["syl_anatomy_248"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"静脉壁薄腔大、含防止逆流的静脉瓣，分浅静脉（皮下采血输液）与伴行动脉的深静脉，吻合与变异丰富。","source_slides":["16 基础医学 静脉 淋巴.pdf#P3-P7"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["五大结构特点：① 壁薄、腔大、弹性小、压力小；② 四肢静脉内含向心单向开放的{{静脉瓣}}防止血液倒流；③ 分深、浅两套系统；④ 吻合多；⑤ 变异多。","深浅分工：{{浅静脉}}位于皮下浅筋膜内不与动脉伴行，临床常用于静脉注射、输液与采血；{{深静脉}}多与同名动脉伴行。","特殊静脉：{{硬脑膜窦}}壁无平滑肌且无瓣膜（颅外骨折或感染易致颅内出血或扩散）；板障静脉与导静脉沟通颅内外。"],"trap_note":"并非所有静脉血都是低氧静脉血：左右共4条肺静脉流回左心房的都是含氧丰富的动脉血！"}},{"id":"anat_danger_triangle_face","title":"面部“危险三角”面静脉感染颅内扩散路径","subject":"anatomy","syllabus_refs":["syl_anatomy_248","syl_anatomy_245"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"鼻根至两侧口角三角区内的面静脉缺乏功能性静脉瓣，挤压疖肿可逆流经内眦静脉→眼上静脉→颅内海绵窦。","source_slides":["16 基础医学 静脉 淋巴.pdf#P12-P14"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"解剖定位：鼻根至两侧口角的面部三角区","reveal":"面静脉起于内眦静脉，经面部斜行向下汇入颈内静脉；该段面静脉缺乏功能性静脉瓣膜且面部肌肉收缩易挤压血管。","mechanism_tag":"无瓣膜交通薄弱区"},{"cue":"逆行通路1（直接眶内通路）","reveal":"挤压危险三角区疖肿时，细菌栓子可逆行向上：面静脉 → 内眦静脉 → 眼上静脉 → 眶上裂 → 颅内海绵窦。","mechanism_tag":"眼上静脉逆流"},{"cue":"逆行通路2（翼静脉丛通路）与临床后果","reveal":"也可经面深静脉 → 翼静脉丛 → 卵圆孔/破裂孔导静脉入海绵窦，引发致命的海绵窦血栓性静脉炎或颅内感染。","mechanism_tag":"海绵窦颅内蔓延"}],"takeaway":"记忆核心：面部危险三角禁挤压——缺乏静脉瓣 + 眼上静脉/翼静脉丛直接交通海绵窦。"}},{"id":"anat_upper_limb_veins","title":"上肢三大浅静脉行程与临床静脉穿刺路径","subject":"anatomy","syllabus_refs":["syl_anatomy_252"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"手背静脉网桡侧起头静脉（穿锁胸筋膜入腋静脉），尺侧起贵要静脉（入肱/腋静脉），肘窝斜连肘正中静脉供采血。","source_slides":["16 基础医学 静脉 淋巴.pdf#P15-P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["{{头静脉 (Cephalic v.)}}：起自手背静脉网桡侧 → 沿前臂及臂外侧（肱二头肌外侧沟）上行 → 经三角肌胸大肌间沟穿锁胸筋膜注入{{腋静脉}}（或锁骨下静脉）。","{{贵要静脉 (Basilic v.)}}：起自手背静脉网尺侧 → 沿前臂及臂内侧（肱二头肌内侧沟）上行 → 在臂中点穿深筋膜注入{{肱静脉}}（或直接续为腋静脉，较直且口径大，常选作PICC置管）。","{{肘正中静脉 (Median cubital v.)}}：在肘窝处由头静脉斜向内上连向贵要静脉，粗短浅表且有深穿支固定不易滑动，是临床静脉{{采血和注射}}首选部位。"],"trap_note":"口诀：“头外侧、贵要内、正中肘窝连两家”；注意贵要静脉因径直汇入腋静脉→锁骨下静脉→上腔静脉，是经外周中心静脉置管(PICC)的首选。"}},{"id":"anat_lower_limb_veins","title":"下肢大、小隐静脉行程与静脉曲张机制","subject":"anatomy","syllabus_refs":["syl_anatomy_259"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"大隐静脉起足背内侧经内踝前方入股静脉（全身最长浅静脉）；小隐静脉经外踝后方入腘静脉；瓣膜关闭不全致曲张。","source_slides":["16 基础医学 静脉 淋巴.pdf#P22-P25"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"columns":["对比特征","大隐静脉 (Great saphenous v.)","小隐静脉 (Small saphenous v.)"],"rows":[["起点与踝部标志","足背静脉弓内侧端 → 经内踝前方（临床切开/穿刺标志）","足背静脉弓外侧端 → 经外踝后方"],["上行路径与注入","沿小腿及大腿内侧上行，穿隐静脉裂孔注入股静脉","沿小腿后面正中上行至腘窝，穿深筋膜注入腘静脉"],["临床意义","全身最长浅静脉；下肢静脉曲张高发部位；冠状动脉搭桥常用取材","与大隐静脉及深静脉借穿静脉广泛交通，深静脉血栓致水肿"]],"quiz":{"stem":"在急诊行下肢浅静脉切开术时，为定位大隐静脉最恒定的体表解剖标志是：","options":["外踝后方 1 cm 处","内踝前方（足背静脉弓内侧端延续）","腘窝正中深筋膜深面","腹股沟韧带下方外侧"],"answer_idx":1,"explain":"记住“大内前、小外后”：大隐静脉恒定行于内踝前方，小隐静脉行于外踝后方。"}}},{"id":"pathophys_stress_axes","title":"应激核心神经内分泌轴（蓝斑-交感 vs HPA 轴）与应激性溃疡","subject":"pathophys","syllabus_refs":["syl_pathophys_007","syl_pathophys_008","syl_pathophys_009"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"应激即时激活蓝斑-交感-肾上腺髓质系统(LC/NE，儿茶酚胺↑)与HPA轴(糖皮质激素↑)；胃黏膜缺血+酸分泌诱发应激性溃疡。","source_slides":["应激-20251029.pdf","《基础医学分论》病理生理部分大纲"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"steps":[{"cue":"快速反应轴：蓝斑-交感-肾上腺髓质系统 (SAM轴)","reveal":"应激原激活脑干蓝斑核，促使肾上腺髓质与交感末梢释放大量儿茶酚胺（肾上腺素/去甲肾上腺素），心率↑、血压↑、支气管扩张，血液重分布保心脑。","mechanism_tag":"儿茶酚胺“战或逃”反应"},{"cue":"持续调节轴：下丘脑-垂体-肾上腺皮质系统 (HPA轴)","reveal":"下丘脑室旁核释放CRH→垂体ACTH→肾上腺皮质释放糖皮质激素(GC)，升高血糖、增强血管对儿茶酚胺敏感性，并抑制过度炎症反应（同时抑制免疫）。","mechanism_tag":"糖皮质激素代谢保障"},{"cue":"典型器官损伤：应激性溃疡的发病机制","reveal":"交感强烈兴奋致胃肠道小血管收缩、胃黏膜缺血缺氧（细胞水肿/坏死、HCO₃⁻及黏液屏障破坏），加上糖皮质激素促胃酸胃蛋白酶分泌、抑黏膜上皮更新，诱发急性糜烂出血溃疡。","mechanism_tag":"缺血屏障破坏 + 侵袭↑"}],"takeaway":"应激双轴协同（SAM提供即时儿茶酚胺动员 + HPA提供持续糖皮质激素允许作用），但胃肠黏膜缺血牺牲易诱发应激性溃疡。"}},{"id":"biochem_protein_putrefaction","title":"【拓展】未消化蛋白质的肠道腐败作用","subject":"biochem","syllabus_refs":["syl_biochem_028"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"结肠细菌对未吸收氨基酸无氧分解产生胺类（组胺/酪胺/苯乙胺）、氨、苯酚、吲哚与硫化氢，大多有害且需经肝解毒。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P15-P17"],"added_at":"2026-11-16T10:00:00+08:00","payload":{"bullets":["氨基酸脱羧生成有毒胺类：组氨酸→{{组胺}}(降压)、赖氨酸→尸胺、酪氨酸→{{酪胺}}(升压)、苯丙氨酸→{{苯乙胺}}。","腐败产氨与硫化氢：肠菌尿素酶水解渗入肠道的尿素，连同脱氨反应每天产生约4g {{NH₃}}，正常经门静脉入肝合成尿素。","其他有害物（苯酚、吲哚、甲基吲哚、H₂S）：在肝内经氧化及与硫酸/葡萄糖醛酸结合而解毒。"],"trap_note":"“肠菌产维生素/短链脂肪酸”是腐败作用的少数有益产物；绝大多数腐败胺类与氨是肝衰患者神经毒性的直接源头。"}}],"edges":[{"id":"e_heart_to_hyperemia","source":"anat_heart_chambers","target":"patho_hyperemia_vs_congestion","relation_type":"structural_basis","strength":0.9,"bridge_text":"心泵构成了体/肺循环的动力起点：当动脉端主动扩张输入过多为“充血”，而心室泵血衰竭导致静脉端回流受阻则形成“淤血”。"},{"id":"e_congestion_to_lung","source":"patho_hyperemia_vs_congestion","target":"patho_pulmonary_congestion","relation_type":"causal_next","strength":0.95,"bridge_text":"左心室衰竭时肺静脉回流受阻，肺部成为最先发生急性水肿或慢性褐色硬化的淤血靶器官。"},{"id":"e_heart_to_lung","source":"anat_heart_chambers","target":"patho_pulmonary_congestion","relation_type":"structural_basis","strength":0.85,"bridge_text":"4条肺静脉直接注入左心房：左房室瓣狭窄或左心衰使压力逆传肺毛细血管，直接触发肺淤血。"},{"id":"e_lung_to_lobule","source":"patho_pulmonary_congestion","target":"histo_liver_lobule","relation_type":"contrast_with","strength":0.85,"bridge_text":"左心衰累及肺泡毛细血管，而右心衰逆流沿下腔静脉直抵肝小叶中央静脉——先看清肝小叶的微血管流向。"},{"id":"e_lobule_to_liver_congestion","source":"histo_liver_lobule","target":"patho_hepatic_congestion","relation_type":"structural_basis","strength":0.95,"bridge_text":"正因为血液从门管区经肝窦流向中央静脉（越近中央氧越少），右心衰时中央3区最先淤血坏死，周边1区脂肪变，造就红黄相间的“槟榔肝”。"},{"id":"e_liver_congestion_to_portal","source":"patho_hepatic_congestion","target":"anat_portal_vein_system","relation_type":"causal_next","strength":0.95,"bridge_text":"长期槟榔肝使肝星状细胞胶原化、进展为淤血性肝硬化，阻塞肝窦血流并直接推高肝门静脉压力，迫使三大门腔侧支循环开放。"},{"id":"e_portal_to_edema","source":"anat_portal_vein_system","target":"patho_edema_mechanisms","relation_type":"clinical_manifestation","strength":0.9,"bridge_text":"门静脉高压使腹腔毛细血管流体静水压骤增，叠加肝衰引起的低白蛋白血症（胶体渗透压↓），共同引发顽固性腹水与下肢水肿。"},{"id":"e_congestion_to_edema","source":"patho_hyperemia_vs_congestion","target":"patho_edema_mechanisms","relation_type":"causal_next","strength":0.85,"bridge_text":"任何部位的静脉性淤血都会抬高微静脉端流体静水压，因此“淤血性水肿”是水肿发生最常见的原因之一。"},{"id":"e_portal_to_hyperammonemia","source":"anat_portal_vein_system","target":"biochem_hyperammonemia_he","relation_type":"cross_discipline","strength":0.95,"bridge_text":"【跨学科枢纽】门体侧支吻合开放后，肠道细菌产生的氨与腐败胺绕过肝脏直接进入体循环并透过血脑屏障，成为肝硬化患者诱发肝性脑病的直接通道。"},{"id":"e_liver_congestion_to_urea","source":"patho_hepatic_congestion","target":"biochem_urea_cycle","relation_type":"cross_discipline","strength":0.88,"bridge_text":"【跨学科枢纽】肝小叶大量肝细胞萎缩、坏死及线粒体受损时，仅存于肝细胞的鸟氨酸循环（CPS-Ⅰ等）能力崩塌，血氨失去最重要清除去路。"},{"id":"e_pool_to_transam","source":"biochem_aa_pool","target":"biochem_transamination_deamination","relation_type":"causal_next","strength":0.92,"bridge_text":"氨基酸代谢库中多余氨基酸进入分解去路时，第一步必须先将α-氨基脱下——这靠“转氨基 + 谷氨酸脱氢”的联合脱氨基完成。"},{"id":"e_transam_to_sources","source":"biochem_transamination_deamination","target":"biochem_blood_ammonia_sources","relation_type":"causal_next","strength":0.95,"bridge_text":"体内各组织经联合脱氨基释放出的游离NH₃汇入血液，连同肠道产氨和肾小管泌氨共同构成血氨的三大来源。"},{"id":"e_putrefaction_to_sources","source":"biochem_protein_putrefaction","target":"biochem_blood_ammonia_sources","relation_type":"causal_next","strength":0.82,"bridge_text":"结肠细菌腐败脱氨基及肠菌尿素酶水解尿素，构成了每天约4g血氨的第二个主要来源（其吸收受肠道pH离子障严格调控）。"},{"id":"e_putrefaction_to_he","source":"biochem_protein_putrefaction","target":"biochem_hyperammonemia_he","relation_type":"causal_next","strength":0.85,"bridge_text":"肠道腐败产生的酪胺和苯乙胺若未被肝单胺氧化酶清除而进入脑组织，将转化为假神经递质干扰儿茶酚胺传递。"},{"id":"e_sources_to_transport","source":"biochem_blood_ammonia_sources","target":"biochem_ammonia_transport","relation_type":"causal_next","strength":0.95,"bridge_text":"游离NH₃对脑组织有剧毒，不能直接随血远距离漂流，必须由外周组织先合成为丙氨酸或谷氨酰胺这两种无毒载体运往肝肾。"},{"id":"e_transport_to_urea","source":"biochem_ammonia_transport","target":"biochem_urea_cycle","relation_type":"causal_next","strength":0.96,"bridge_text":"丙氨酸与谷氨酰胺抵达肝脏后释放NH₃，随即进入肝细胞“两步线粒体、三步胞质”的鸟氨酸循环转化为无毒尿素。"},{"id":"e_urea_to_he","source":"biochem_urea_cycle","target":"biochem_hyperammonemia_he","relation_type":"causal_next","strength":0.95,"bridge_text":"一旦鸟氨酸循环酶缺陷或肝功能衰竭受阻，血氨急剧飙升突破脑代偿上限，通过抽空α-酮戊二酸导致脑能量危机与星形胶质细胞水肿。"},{"id":"e_transport_to_asparaginase","source":"biochem_ammonia_transport","target":"biochem_asparaginase_leukemia","relation_type":"clinical_manifestation","strength":0.72,"bridge_text":"谷氨酰胺不仅运氨，还是体内合成天冬酰胺的酰胺基供体——利用白血病细胞缺乏天冬酰胺合成酶这一弱点，催生了天冬酰胺酶靶向疗法。"},{"id":"e_homeo_to_transport","source":"physio_homeostasis_feedback","target":"physio_membrane_transport","relation_type":"prerequisite","strength":0.85,"bridge_text":"内环境与细胞内液的成分分隔与稳态维持，直接依靠细胞膜上的各种跨膜物质转运蛋白（尤其是Na⁺-K⁺泵）。"},{"id":"e_transport_to_rp","source":"physio_membrane_transport","target":"physio_resting_potential","relation_type":"prerequisite","strength":0.96,"bridge_text":"Na⁺-K⁺泵建立的“胞内高K⁺、胞外高Na⁺”浓度梯度，正是静息时K⁺外流形成负值静息电位的全部化学势能基础。"},{"id":"e_rp_to_ap","source":"physio_resting_potential","target":"physio_action_potential","relation_type":"prerequisite","strength":0.96,"bridge_text":"静息负电位使电压门控Na⁺通道处于“可激活的静息态”；当刺激使其去极化至阈电位，通道再生性正反馈开放即爆发动作电位。"},{"id":"e_ap_to_homeo","source":"physio_action_potential","target":"physio_homeostasis_feedback","relation_type":"cross_discipline","strength":0.75,"bridge_text":"动作电位上升支“去极化→更多Na⁺通道开→更多Na⁺内流”的Hodgkin循环，正是细胞水平最典型的正反馈调节实例。"},{"id":"e_ap_to_synapse","source":"physio_action_potential","target":"histo_chemical_synapse","relation_type":"causal_next","strength":0.9,"bridge_text":"沿有髓神经纤维跳跃传导的动作电位抵达轴突末梢后，需要跨越化学突触的超微三元结构才能把兴奋交给肌肉细胞。"},{"id":"e_synapse_to_nmj","source":"histo_chemical_synapse","target":"physio_nmj_transmission","relation_type":"structural_basis","strength":0.95,"bridge_text":"运动终板正是特化的化学突触：前膜囊泡、20–30nm间隙内的AChE与后膜N₂受体通道共同决定了1:1单向高效传递。"},{"id":"e_nmj_to_triad","source":"physio_nmj_transmission","target":"histo_skeletal_muscle_triad","relation_type":"causal_next","strength":0.94,"bridge_text":"终板电位(EPP)触发一般肌膜动作电位后，兴奋必须经肌膜内陷的T小管深入肌纤维内部——这离不开肌节与“三联管”的超微构筑。"},{"id":"e_triad_to_sliding","source":"histo_skeletal_muscle_triad","target":"physio_ec_coupling_sliding","relation_type":"structural_basis","strength":0.96,"bridge_text":"三联管的T管(DHPR)与终池(RyR)机械贴合触发Ca²⁺瞬间释放，随后Ca²⁺作用于细肌丝TnC，正式启动横桥周期与肌丝滑行。"},{"id":"e_sliding_to_smooth","source":"physio_ec_coupling_sliding","target":"physio_skeletal_vs_smooth","relation_type":"contrast_with","strength":0.9,"bridge_text":"掌握骨骼肌Ca²⁺-TnC耦联后，务必对比无T管且无肌钙蛋白的平滑肌——它走的是胞外Ca²⁺→CaM→MLCK磷酸化路径。"},{"id":"e_sliding_to_load","source":"physio_ec_coupling_sliding","target":"physio_muscle_load_factors","relation_type":"causal_next","strength":0.9,"bridge_text":"微观横桥能与肌动蛋白形成多少有效连接、以及胞内Ca²⁺浓度多高，直接决定了宏观肌肉的前负荷（最适初长度）、后负荷与收缩能力曲线。"},{"id":"e_nmj_to_pharma","source":"physio_nmj_transmission","target":"pharma_efferent_transmitters","relation_type":"cross_discipline","strength":0.92,"bridge_text":"【跨学科枢纽】运动神经释放ACh经AChE毫秒级分解终止传递，这只是传出神经递质的一半图景；药理学还需对比交感神经去甲肾上腺素(NA)的摄取1回收机制。"},{"id":"e_adapt_to_hydropic","source":"patho_cellular_adaptation","target":"patho_hydropic_degeneration","relation_type":"causal_next","strength":0.92,"bridge_text":"当损伤刺激超出细胞适应（萎缩/肥大/增生/化生）的代偿极限，细胞进入可逆性损伤阶段——其中最先且最常出现的便是细胞水肿。"},{"id":"e_transport_to_hydropic","source":"physio_membrane_transport","target":"patho_hydropic_degeneration","relation_type":"cross_discipline","strength":0.94,"bridge_text":"【跨学科枢纽】生理学中维持细胞容积的Na⁺-K⁺泵一旦因缺氧ATP枯竭而停摆，Na⁺和水顺势涌入胞内，在病理显微镜下就表现为细胞水肿（颗粒变性）。"},{"id":"e_hydropic_to_fatty","source":"patho_hydropic_degeneration","target":"patho_fatty_change","relation_type":"causal_next","strength":0.88,"bridge_text":"同样源于缺氧或中毒引起的线粒体功能受损，若导致脂肪酸β-氧化受阻或载脂蛋白合成减少，实质细胞便会出现另一种常见可逆损伤——脂肪变。"},{"id":"e_fatty_to_liver_congestion","source":"patho_fatty_change","target":"patho_hepatic_congestion","relation_type":"clinical_manifestation","strength":0.86,"bridge_text":"肝脂肪变不仅单独见于脂肪肝，也是慢性肝淤血时肝小叶周边1区呈黄色的形态学本质——与中央区暗红淤血共同拼出“槟榔肝”。"},{"id":"e_hydropic_to_necrosis","source":"patho_hydropic_degeneration","target":"patho_necrosis_types","relation_type":"causal_next","strength":0.92,"bridge_text":"若缺氧或毒物未能解除，胞膜与溶酶体膜彻底破裂引发“不可逆损伤”，细胞出现核固缩、核碎裂、核溶解并按组织质地走向六种坏死形态。"},{"id":"e_fatty_to_necrosis","source":"patho_fatty_change","target":"patho_necrosis_types","relation_type":"causal_next","strength":0.88,"bridge_text":"细胞水肿与重度脂肪变等可逆损伤若未能及时纠正，代谢崩溃后终将突破膜稳定极限，滑向不可逆坏死。"},{"id":"e_smooth_to_load","source":"physio_skeletal_vs_smooth","target":"phy
