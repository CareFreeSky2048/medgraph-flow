 酶解吸收"}],"takeaway":"破骨细胞属于单核-巨噬细胞谱系而非间充质骨祖谱系；“亮区封腔 + 皱褶缘扩面 + 泌酸溶盐 + 溶酶体切胶原”四步缺一不可。","quiz":{"stem":"遗传突变导致破骨细胞无法聚合微丝形成贴附骨面的环形“亮区”，但细胞本身仍具多核、正常碳酸酐酶及足量溶酶体酶。此缺陷最直接使破骨细胞丧失哪项关键功能条件？","options":["无法围成封闭微环境致质子与蛋白酶迅速稀释逃逸","单核细胞无法融合而使细胞退变为单核成骨细胞","基质小泡丧失碱性磷酸酶活性难以沉积羟磷灰石","无法合成胶原前体导致骨基质有机韧性完全丧失"],"answer_idx":0,"explain":"亮区（clear zone，P35）是皱褶缘周围一圈含丰富微丝微管、质膜平整并紧贴骨基质的环形胞质区，其核心作用是构建封闭的低pH溶骨微环境；若亮区密封失效，H⁺与溶酶体蛋白酶直接随组织液扩散，无法有效溶骨。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_osteogenesis_mechanisms","title":"膜内成骨 vs 软骨内成骨四期机制","subject":"histology","syllabus_refs":["syl_histology_023"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"成骨基本细胞过程一致，膜内成骨直接结缔组织膜成骨，软骨内成骨借骨领与钙化软骨中轴置换。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P49-P56"],"diagram_assets":[{"path":"assets/histo_bone_endochondral_stages_p56.webp","caption":"长骨软骨内成骨四阶段全景：软骨雏形→骨领→初级/次级骨化中心→骺板→骺线","source_page":56}],"payload":{"columns":["对比维度","膜内成骨","软骨内成骨"],"rows":[["胚胎起点与典型骨","间充质直接化为含骨祖细胞的结缔组织膜；顶/额/下颌骨、部分锁骨","先塑透明软骨雏形再被骨组织置换；四肢骨、躯干骨、部分颅底骨"],["核心成骨步骤","骨化中心→针状初级骨小梁→网状初级骨松质；周围间充质成骨膜","①软骨雏形→②中段骨领(膜内成骨)→③初级骨化中心→④次级骨化中心与骨骺"],["关键过渡构造","直接分泌类骨质钙化为编织骨小梁，外周骨化扩展","中段软骨肥大分泌AKP钙化退化→血管破骨入→残存钙化软骨为中轴的过渡性骨小梁"],["生长保留结构","内外改建为扁骨外板、内板与板障，终生骨膜增厚","关节面留薄层关节软骨；骨骺与骨干间留骺板（17–20岁闭合为骺线）"]],"quiz":{"stem":"软骨内成骨的初级骨化中心刚形成时，切片中“过渡性骨小梁”外层红染骨组织包围着深紫蓝色中轴。关于该深紫蓝色中轴的本质与后续命运，最准确的组胚判断是：","options":["由透明软骨细胞直接转分化而成的成熟板层骨骨板","未吸收残存的钙化软骨基质中轴，后续被破骨吸收重塑","成骨细胞分泌的未钙化类骨质核心，随后转变为黄骨髓","骨外膜穿通纤维聚集成的致密核心，永久保留于骨髓腔"],"answer_idx":1,"explain":"软骨内成骨并非软骨细胞转变为骨细胞（P53–P54）：中段软骨细胞肥大钙化并死亡，破骨细胞溶解部分钙化软骨基质形成隧道，新入驻的成骨细胞贴附在残存强嗜碱（深紫蓝）钙化软骨基质表面成骨形成“过渡性骨小梁”，最终随骨髓腔融合被破骨细胞吸收改建。","remedial_node_id":"histo_cartilage_three_types_matrix"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_long_bone_lamellae_osteon","title":"长骨密质骨骨单位、穿通管与骨松质","subject":"histology","syllabus_refs":["syl_histology_024"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"骨干密质骨由内外环骨板、同心圆骨单位及残余间骨板构成，中央管与穿通管网通全骨养分。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P38-P48"],"diagram_assets":[{"path":"assets/histo_bone_compact_osteon_p40.webp","caption":"图6-13 长骨骨干立体结构：内外环骨板、骨单位、间骨板、中央管、横向穿通管及骨内外膜","source_page":40}],"payload":{"bullets":["内外环骨板与穿通纤维：{{外环骨板}}厚且整齐，骨外膜粗大{{穿通纤维}}(Sharpey纤维)斜穿其中锚固；内环骨板薄且不甚整齐。","骨单位(哈弗斯系统)：夹于内外环骨板间，长轴平行骨干；由{{中央管}}(内含血管神经与骨内膜)及周围同心{{哈弗斯骨板}}构成。","黏合线与骨小管折返：骨单位外表覆高骨盐少纤维强折光的{{黏合线}}(质)；最内层骨小管开口{{中央管}}，最外层在黏合线{{折返}}。","穿通管与间骨板：{{穿通管}}(福克曼管)横向贯通密质骨连接内外膜与中央管；{{间骨板}}为旧骨单位残余，含骨陷窝但{{无血管通道}}。","骨松质与骨膜：松质骨见于骨骺及骨干内面，由几层平行骨板构成针片状{{骨小梁}}围成骨髓腔，骨小管直通{{骨髓腔}}；骨外膜内层与骨内膜供{{骨祖细胞}}。"],"trap_note":"骨单位最外层骨小管遇到高矿化的黏合线会折返向中央管供养，因此骨单位彼此独立供养，而无血管通道的间骨板只能依托残存微网或周边弥散。","quiz":{"stem":"在长骨骨干横断面骨磨片上，骨单位最外层骨细胞伸出的骨小管抵达黏合线后大多发生折返而不向外穿入邻近间骨板；同时镜下在间骨板区域也看不到血管通道。这一分布规律反映了：","options":["间骨板因完全无骨细胞存活故不需建立营养微管","穿通管专供间骨板血流而完全绕开哈弗斯骨单位","骨单位营养由中央管由内向外经骨小管独立放射供应","黏合线由疏松胶原束组成，专责向骨外膜排出钙盐"],"answer_idx":2,"explain":"每个骨单位（P43–P46）是一个相对独立的营养和结构柱：横向穿通管将血管引至纵向中央管，最内层骨小管开口于中央管接纳组织液逐层外传，最外层则在含高骨盐、强折光的黏合线处折返。","remedial_node_id":"histo_bone_osteoblast_osteocyte"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_long_bone_growth_remodeling","title":"骺板四区加长、增粗平衡与骨单位改建","subject":"histology","syllabus_refs":["syl_histology_024"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"骺板按储备→增生→钙化→成骨四区推进加长，外膜成骨配内膜破骨增粗，切锥由外向内重建骨单位。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P57-P63"],"diagram_assets":[{"path":"assets/histo_bone_epiphyseal_zones_p59.webp","caption":"胎儿长骨纵切骺板四区顺序演化：软骨储备区→软骨增生区→软骨钙化区→成骨区","source_page":59},{"path":"assets/histo_bone_osteon_remodeling_p62.webp","caption":"骨干密质骨改建切锥示意图：吸收区破骨挖道→转变区血管祖细胞进入→由外周向中央建造新骨单位","source_page":62}],"payload":{"steps":[{"cue":"纵向加长（骺板前两区）：软骨储备区与增生区如何驱动骨干向两端推长？","reveal":"靠近骨骺端为小而分散的软骨储备区（基质弱嗜碱）；向下进入软骨增生区，软骨细胞变大并沿长轴形成纵行排列成柱的同源细胞群，持续分裂增殖把骨骺推向远端。","mechanism_tag":"储备区 → 增生细胞柱"},{"cue":"纵向加长（后两区与闭合）：钙化区与成骨区如何把软骨柱替换为骨小梁？","reveal":"再向下为软骨钙化区，软骨细胞肥大退化留下大空陷窝、基质钙化呈强嗜碱性；进入成骨区，破骨与血管侵入，成骨细胞沿钙化基质铺骨成初级骨小梁；17–20岁骺板被完全取代闭合为骺线。","mechanism_tag":"钙化退化 → 成骨区(→骺线)"},{"cue":"骨干增粗耦合：外径不断变粗时为何骨髓腔不致被长满成实心重棒？","reveal":"外增内吸动态偶联：骨外膜内层成骨细胞在外周持续膜下成骨加厚皮质，同时骨内膜面破骨细胞同步吸收陈旧内层骨质，使骨髓腔按比例扩大以兼顾轻便与抗弯刚度。","mechanism_tag":"外周成骨 + 内面吸收"},{"cue":"终身骨单位改建：一代代新骨单位如何在致密骨干中替换旧骨单位？","reveal":"破骨细胞先在骨干纵行凿出吸收腔（吸收区）→血管与骨祖细胞随之进入（转变区）→成骨细胞贴附管壁由外周向中央逐层铺建同心骨板（正在建造→已建造区），旧骨单位残片留为间骨板。","mechanism_tag":"切锥吸收 → 向心填板"}],"takeaway":"骨生长不是简单堆积，而是“骺板四区有序替换、外增内吸扩髓腔、切锥由外向内建新骨单位留间骨板”的精密耦合。","quiz":{"stem":"骨干密质骨内部改建形成新一代哈弗斯系统时，最初生成的骨单位外周清晰包绕着一条黏合线，越靠近中央管的骨板反而是最晚合成的。决定这一“最外层最老、最内层最新”空间序列的建造方向是：","options":["中央管内皮细胞直接向外分泌钙化盐逐层顶开旧骨","由骨髓腔内的间骨板向骨外膜表面放射状逐层推挤","成骨细胞先填满中央管再由破骨细胞从中心挖开管腔","成骨细胞贴附吸收腔内壁由外周向中央逐层向心成骨"],"answer_idx":3,"explain":"骨干密质骨改建（P62–P63）先由破骨细胞开凿纵行吸收腔，血管与骨祖细胞随行入驻，分化出的成骨细胞贴附于吸收腔最外缘（黏合线处）开始向心性由外周向中央逐层铺建同心圆骨板，最后保留中心毛细血管通道即为中央管。","remedial_node_id":"histo_long_bone_lamellae_osteon"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_flat_bone_diploe_structure","title":"扁骨三明治结构：内外板、板障与骨膜","subject":"histology","syllabus_refs":["syl_histology_025"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"颅顶扁骨由膜内成骨形成外板与内板两层骨密质，中间夹含红骨髓与板障静脉的松质骨板障。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P50","《基础医学分论》组胚大纲 · 扁骨的结构"],"payload":{"bullets":["发生来源：顶骨、额骨等颅盖扁骨不经软骨雏形，由胚胎间充质结缔组织膜经{{膜内成骨}}直接改建而成。","外板与内板(骨密质)：居于扁骨表面与深面的两层{{骨密质}}，由平行骨板及少量骨单位构成，分别外覆{{骨外膜}}、内衬硬脑膜/骨内膜。","板障(骨松质中层)：夹于内外板之间的{{骨松质}}，由交错{{骨小梁}}围成网眼，内含终身保持造血功能的{{红骨髓}}与薄壁板障静脉。","工程减重与脆弱点：三明治夹心以轻质量获高抗弯抗冲击力；但若{{外板}}完好时{{内板}}仍可因应力集中先骨折（或经板障静脉蔓延颅内感染）。"],"trap_note":"扁骨无长骨那样的单一大中央髓腔，造血红骨髓终身分布于“板障”骨小梁网孔中，这使胸骨/髂骨扁骨成为临床骨髓穿刺首选部位。","quiz":{"stem":"临床骨髓穿刺常首选髂骨或胸骨等扁骨而非成人股骨骨干中段，且颅盖骨呈中空夹心结构在受外力撞击时能兼顾轻质保护大脑。支撑这两项特点的扁骨核心组织学架构是：","options":["内外两层骨密质板夹持含丰富红骨髓的松质骨板障","由透明软骨雏形与巨大型哈弗斯中央髓腔直接构成","外层致密弹性纤维直接缓冲冲击而全骨无钙化骨板","整块扁骨通体由无血管间骨板与脂肪黄骨髓实心填满"],"answer_idx":0,"explain":"扁骨（如颅顶骨、胸骨、髂骨）由较厚外板与较薄内板两层骨密质夹持中间松质骨板障（diploë）组成；板障网孔内含终生造血的红骨髓和板障静脉，既减重抗弯又承载造血功能。","remedial_node_id":"histo_osteogenesis_mechanisms"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_bone_growth_regulation","title":"激素、维生素与细胞因子对骨生长的调控","subject":"histology","syllabus_refs":["syl_histology_026"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"GH/甲状腺/性激素驱动骺板增生与闭合，PTH与降钙素/Vit D协同RANKL-OPG稳衡骨量血钙。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P36,P65"],"payload":{"columns":["调节因子类别","核心作用位点与细胞机制","失衡或缺乏的典型临床表型"],"rows":[["生长激素(GH) \u0026 甲状腺激素","GH促骺板软骨细胞分裂加长；甲状腺激素协同促骨发育与骨化成熟","儿童缺GH致垂体性侏儒，过量致巨人症；成人过量(骺板已闭)致肢端肥大症；幼缺甲素致呆小症"],["甲状旁腺素(PTH) vs 降钙素(CT)","PTH促骨细胞溶骨并上调成骨RANKL/↓OPG激活破骨升血钙；CT抑破骨皱褶缘降血钙","甲旁亢致过度溶骨纤维囊性骨炎、高血钙与转移性钙化；降钙素拮抗急性高钙"],["性激素（雌/雄激素）","青春期促骨生长突增，同时加速骺板钙化闭合；雌激素抑制破骨分化与凋亡延迟","性早熟致骺板早闭终身高矮小；绝经后雌激素锐减致RANKL↑、骨吸收＞成骨引骨质疏松"],["维生素 D、C、A","VitD促肠钙磷吸收与类骨质矿化；VitC作Ⅰ型胶原羟化酶辅因子；VitA平衡成骨与破骨","缺VitD致儿童佝偻病/成人骨软化症；缺VitC致坏血病骨基质胶原脆弱；VitA过/缺皆致畸"],["局部因子与力学负荷","TGF-β/EGF/PGE₂/IL-1/IL-6与RANKL-OPG轴互作；力学压电刺激促成骨(Wolff定律)","慢性炎症IL-1/IL-6上调RANKL致局灶骨破坏；长期卧床失用缺乏负荷致废用性骨萎缩"]],"quiz":{"stem":"同一病因——垂体分泌过量生长激素（GH），若发生在骨骺未闭合的青少年表现为身材异常高大的“巨人症”，若发生在成年人则表现为手足指端宽厚与下颌前突的“肢端肥大症”。导致这两种截然不同骨骼重塑表型的组织学分界是：","options":["成人破骨细胞已完全凋亡故仅能向外表面骨膜沉积","成人长骨骺板软骨已完全骨化闭合成骺线无法纵向加长","成人扁骨板障转为软骨雏形从而优先发生软骨内成骨","成人体内成骨细胞全部丧失合成Ⅰ型胶原有机质能力"],"answer_idx":1,"explain":"长骨纵向加长完全依赖骺板软骨细胞的分裂增殖与软骨内成骨（P55, P58, P65）。17–20岁后骺板闭合成骺线，GH虽能继续刺激骨外膜外加增粗及短扁骨不规则增生（致肢端肥大症），却已无法再推动长骨纵向伸长。","remedial_node_id":"histo_long_bone_growth_remodeling"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_bone_fracture_regeneration","title":"骨折后骨膜双轨软骨成骨与骨痂改建","subject":"histology","syllabus_refs":["syl_histology_027"],"syllabus_tier":"understand","node_type":"mechanism_flow","anchor_summary":"血肿机化后骨膜骨祖细胞依局部血供氧分压分流为软骨痂与编织骨，终重塑为板层骨。","source_slides":["202609154软骨与骨（基础医学分论）.pdf#P64"],"diagram_assets":[{"path":"assets/histo_bone_fracture_repair_p64.webp","caption":"图6-22 长骨骨折修复示意图：a.早期血肿与骨外膜撕裂/死骨；b.血肿机化肉芽、软骨与新骨形成","source_page":64}],"payload":{"steps":[{"cue":"早期出血与清创：骨折断端在组织学上如何清理死骨与机化血肿？","reveal":"骨膜及髓腔血管撕裂形成血肿，断端附近骨细胞与骨髓因血供中断发生坏死（死骨）；随后肉芽组织（新生毛细血管+成纤维细胞）与巨噬细胞/破骨细胞长入清除坏死并机化血肿。","mechanism_tag":"血肿机化 + 清除死骨"},{"cue":"骨膜双轨分流：为何骨折早期修补区会同时出现“新骨”与“透明软骨”？","reveal":"骨外膜内层与骨内膜骨祖细胞大量增殖：靠近丰富毛细血管、氧供充足区域直接分化为成骨细胞膜内成骨；断端中央血供尚差相对缺氧区则先分化为软骨细胞形成软骨骨痂暂连断端。","mechanism_tag":"氧分压分流：膜内 vs 软骨痂"},{"cue":"骨性替换与改建：编织骨与软骨骨痂怎样恢复为原始承重板层骨？","reveal":"缺氧改善后软骨骨痂经软骨内成骨被编织骨替代连成骨性骨痂；最后在负重应力引导下，由破骨细胞吸收多余骨痂、成骨细胞构建新骨单位改建为板层骨并重通骨髓腔。","mechanism_tag":"软骨内替换 + 板层重塑"}],"takeaway":"骨具有极强的完全再生能力：骨外膜/骨内膜骨祖细胞兼具“成骨/成软骨”双潜能，血供稳定与力学固定共同决定能否平滑重塑。","quiz":{"stem":"骨折复位后若外固定不牢导致断端持续微动、局部新生毛细血管反复撕裂缺氧，组织学切片常在断端间隙看见大量软骨甚至纤维组织长期滞留而不转为骨性骨痂。这揭示骨祖细胞分化的局部调控规律是：","options":["缺氧会即刻诱导破骨细胞分泌大量Ⅰ型胶原取代骨板","机械微动激活降钙素受体直接阻断全身肠道钙吸收","低氧加微动促使骨祖细胞倾向成软骨分化并延缓骨化","缺氧迫使成熟骨细胞直接逆分化为弹性软骨同源群"],"answer_idx":2,"explain":"图6-22（P64）及再生规律显示：骨祖细胞在高氧供稳固环境直接分化成骨细胞，而在血供未通、机械微动与低氧张力区则优先分化为软骨细胞产生无血管软骨骨痂；持续摩擦微动破坏新生血管便阻碍其进一步钙化替换为骨性骨痂。","remedial_node_id":"histo_bone_osteoblast_osteocyte"}},"added_at":"2026-11-17T17:34:37+08:00"},{"id":"histo_blood_composition_plasma","title":"血液组成、血浆与血清及血涂片染色","subject":"histology","syllabus_refs":["syl_histology_028"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"液态结缔组织含55%血浆与45%血细胞；凝血消耗纤维蛋白原后的清亮液即血清。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P2-P5"],"payload":{"bullets":["液态结缔组织：成人血量约5L（占体重7%–8%），抗凝离心上段为{{血浆}}(55%)，下段沉降{{血细胞}}(45%，红细胞比容)。","血浆理化与蛋白：含90%水及10%溶质，pH {{7.35–7.45}}（313 mOsm）；血浆蛋白(65–85 g/L)含{{白蛋白/球蛋白}}(A:G 1.5–2.5)与纤维蛋白原。","血浆 vs 血清：凝血酶原激活为{{凝血酶}}后，将可溶性{{纤维蛋白原}}转为不溶纤维蛋白网析出，剩余不含纤维蛋白原的淡黄液为{{血清}}。","血涂片镜检窗口：常规用{{瑞氏/吉姆萨(Wright-Giemsa)染色}}，碱性亚甲蓝将核与RNA染紫蓝，酸性伊红将血红蛋白等染粉红。"],"trap_note":"抗凝离心上清仍是“血浆”（保留纤维蛋白原），自然凝血析出血块后挤出的上清才是“血清”（已耗尽纤维蛋白原与部分凝血因子）。","quiz":{"stem":"抽血后若分别注入“加肝素抗凝离心管”与“无抗凝剂静置凝血离心管”，所得两种淡黄色上清液在成分上的核心差异是后者缺乏：","options":["维持胶体渗透压的白蛋白组分","参与体液免疫应答的球蛋白组分","可被凝血酶切割的纤维蛋白原","调节酸碱稳态的无机盐缓冲对"],"answer_idx":2,"explain":"加抗凝剂离心获得血浆，完整保留白蛋白、球蛋白与纤维蛋白原；无抗凝剂自然凝固时，凝血酶将可溶性纤维蛋白原转为不溶性纤维蛋白凝块，析出的清亮液即血清，不再含纤维蛋白原。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_blood_erythrocyte","title":"红细胞双凹形态、膜骨架与正常参考值","subject":"histology","syllabus_refs":["syl_histology_029"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"成熟红细胞无核无细胞器而富Hb，借血影蛋白膜骨架保持弹性变形，寿命约120天。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P5-P8"],"diagram_assets":[{"path":"assets/histo_hema_muscle_rbc_skeleton_p07.webp","caption":"红细胞双凹剖面及膜下血影蛋白-肌动蛋白-带4.1-锚蛋白-带3-血型糖蛋白A膜骨架三维结构图","source_page":7}],"payload":{"bullets":["形态与减法特化：直径约7.5 μm、缘厚2.0 μm的{{双凹圆盘状}}，成熟后{{无核、无细胞器}}，腾出全部胞质装载血红蛋白(Hb)。","正常值与贫血界限：RBC男(4.0–5.5)×10¹²/L、女(3.5–5.0)×10¹²/L；Hb男120–150、女110–140 g/L；{{RBC\u003c3×10¹²/L或Hb\u003c100 g/L}}示贫血。","膜骨架与弹性变形：膜下{{血影蛋白(spectrin)}}借锚蛋白/带4.1连于带3蛋白与{{血型糖蛋白A}}(ABO抗原)，赋予其挤过狭隙的塑性。","渗透脆性与血沉：置低渗液吸水涨破释Hb后残留空膜称{{血影(ghost)}}，高渗皱缩；叠连加速使红细胞沉降率(血沉)增快。","核心功能与寿命：借Hb高效运输{{O₂与CO₂}}并缓冲血液pH，在循环中存活约{{120天}}后于脾肝被巨噬细胞清除。"],"trap_note":"双凹圆盘形态并非“薄弱易破”，恰恰使表面积/体积比最大化并保留变形余量；遗传性血影蛋白缺陷致红细胞变圆球形时，反而渗透脆性剧增易在脾窦溶血。","quiz":{"stem":"遗传性球形红细胞增多症患者因膜骨架蛋白（血影蛋白/锚蛋白）缺陷导致红细胞变为小圆球形，这类红细胞在脾脏极易破裂溶血的力学根源是：","options":["表面积与体积比下降丧失变形挤过脾窦窦隙的余量","细胞核滞留胞内大幅加重膜渗透压导致低渗即刻破","血红蛋白四聚体解体失去二硫键牵拉双凹盘中央凹","线粒体过度耗氧产生过量自由基直接溶解磷脂双层"],"answer_idx":0,"explain":"正常双凹圆盘形态提供了远超同体积球体的膜表面积余量，并依托血影蛋白-肌动蛋白膜骨架发生大尺度弹性变形钻过微血管与脾血窦内皮间隙；变球形后表面积/体积比骤降、膜变硬且渗透脆性升高，极易在脾窦阻滞溶破。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_blood_reticulocyte","title":"网织红细胞残余核糖体与造血活力意义","subject":"histology","syllabus_refs":["syl_histology_030"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"刚入血的未完全成熟红细胞保留少量游离核糖体，煌焦油蓝染呈细网，直映骨髓造血活力。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P9"],"diagram_assets":[{"path":"assets/histo_hema_muscle_reticulocyte_p09.webp","caption":"煌焦油蓝活体染色血涂片（箭指含蓝紫色细网状核糖体沉淀的网织红细胞）","source_page":9}],"payload":{"bullets":["成熟过渡状态：自红骨髓刚释放入外周血的{{未完全成熟红细胞}}，已脱去细胞核但胞体仍较成熟RBC略大，约1–2天彻底成熟。","染色定位标志：胞质尚存少量合成Hb残留的{{游离核糖体(rRNA)}}，常规瑞氏染微呈嗜多色，经{{煌焦油蓝活体染色}}凝集成深蓝细网或颗粒。","正常占比参考：成人外周血占红细胞总数 {{0.5%–1.5%}}，新生儿及小儿显著偏高，约为 {{3%–6%}}。","临床造血指标：可直接评估{{骨髓红系造血功能}}——急性溶血/失血及缺铁补铁见效时显著升高，再生障碍性贫血时明显降低。"],"trap_note":"网织红细胞已没有细胞核，它还能短暂继续合成少量血红蛋白靠的是残余的“游离核糖体(rRNA)”，且必须用煌焦油蓝活体染色才能清晰显网。","quiz":{"stem":"缺铁性贫血患者足量补铁治疗1周后，外周血血红蛋白尚未完全回升，而煌焦油蓝染色下的网织红细胞比例率先从0.4%跃升至5.2%，这提示：","options":["外周成熟红细胞重新恢复有丝分裂补充血量","煌焦油蓝误将衰老皱缩红细胞的核碎片染蓝","骨髓造血功能受铁过载抑制发生红系核左移","骨髓红系造血正加速释放含核糖体幼红细胞"],"answer_idx":3,"explain":"网织红细胞是骨髓刚脱核释放、尚含游离核糖体（煌焦油蓝染呈蓝网）的未成熟红细胞。补铁/叶酸/B₁₂见效或急性溶血失血代偿时，网织红细胞比值率先飙升，是骨髓红系造血恢复的最敏锐早期指针。","remedial_node_id":"histo_blood_erythrocyte"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_blood_granulocytes","title":"三种有粒白细胞：核型、颗粒与功能","subject":"histology","syllabus_refs":["syl_histology_031"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"中性、嗜酸、嗜碱性粒细胞借分叶核型与两类颗粒分工，执掌化脓吞噬、抗虫抗过敏与速发变态。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P5","2026-基础医学分论-血液、肌组织.pptx#P10-P16"],"diagram_assets":[{"path":"assets/histo_hema_muscle_wbc_panel_p11.webp","caption":"瑞氏染色五类白细胞(N/E/B/LY/MO)显微形态、正常百分比与核心免疫防御分工总览","source_page":11}],"payload":{"columns":["鉴别维度","中性粒细胞 (N)","嗜酸性粒细胞 (E)","嗜碱性粒细胞 (B)"],"rows":[["比例与核型","50%–70%(10–12μm)；核杆状或分2–5叶(常2–3叶)","0.5%–3%(10–15μm)；核常分2叶呈“八”字形","0%–1%(10–15μm)；核呈S形浅染常被颗粒遮盖"],["颗粒与EM","淡紫嗜天青20%(溶酶体)+淡红特殊80%(分泌颗粒)","粗大均匀桔红颗粒；EM含高密度长方形结晶体","大小不等紫蓝异染颗粒；EM呈细粒或致密板层状"],["核心内含物","MPO/酸性磷酸酶/溶菌酶/胶原酶/乳铁蛋白","酸性磷酸酶/过氧化物酶/芳基硫酸酯酶等","肝素、组胺、白三烯及嗜酸性粒细胞趋化因子"],["功能与核象","强趋化吞噬细菌→脓细胞；感染见核左移(杆状↑)","灭活组胺/白三烯、吞噬免疫复合物、杀蠕虫","与肥大细胞协同，抗凝血并介导速发过敏反应"]],"quiz":{"stem":"支气管哮喘与蛔虫感染患儿的外周血涂片均可见一种白细胞比例显著飙升，其核呈典型对称“八”字形两叶，电镜颗粒内嵌高密度长方形结晶体，它抗过敏的关键在于：","options":["大量释放肝素与白三烯触发支气管平滑肌收缩","分泌酶类分解组胺并灭活白三烯减弱变态反应","吞噬化脓细菌后借髓过氧化物酶爆发呼吸杀伤","依靠异染性颗粒直接释放组胺放大毛细管渗出"],"answer_idx":1,"explain":"核分两叶“八”字形且颗粒含长方形电镜结晶体的为嗜酸性粒细胞(0.5%–3%)；它能被嗜碱性粒细胞/肥大细胞释放的趋化因子招来，选择性吞噬抗原-抗体复合物，并分解组胺、灭活白三烯以负向制动过敏反应，同时可杀伤蠕虫。","remedial_node_id":"histo_lct_mast_cell"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_blood_agranulocytes","title":"单核细胞与淋巴细胞：形态、亚群及归宿","subject":"histology","syllabus_refs":["syl_histology_031"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"无粒白细胞分两系：最大体积肾形核单核细胞出血管成巨噬细胞；窄蔚蓝胞质淋巴细胞分T/B/NK。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P5","2026-基础医学分论-血液、肌组织.pptx#P17-P19"],"payload":{"columns":["鉴别特征","单核细胞 (Monocyte)","淋巴细胞 (Lymphocyte)"],"rows":[["占比与体径","3%–8%，体积最大(14–20 μm)，呈圆或椭圆形","25%–30%，小6–8/中9–12/大13–20 μm，圆或卵圆"],["胞核与胞质","偏位卵圆/肾形/马蹄形浅染松散核；灰蓝胞质含嗜天青颗粒","深染圆核一侧常有小凹陷；胞质极少呈蔚蓝色窄带"],["酶系与超微","含酸性磷酸酶、过氧化物酶、非特异性酯酶及溶菌酶","富游离核糖体、具水解酶；无过氧化物酶(H₂O₂酶)"],["归宿与分工","穿出血管分化为巨噬细胞等；活跃趋化吞噬、造血调控","T(细胞免疫)/B(→浆细胞体液免疫)/NK(杀伤肿瘤)；再循环"]],"quiz":{"stem":"肺泡腔内的“尘细胞”与肝血窦壁上的“枯否细胞”虽形态与位置迥异，但二者均直接起源于外周血中哪一种白细胞穿出血管后的终末分化？","options":["嗜碱性粒细胞：胞核S形伴大小不等异染颗粒","小淋巴细胞：胞核深染带凹陷伴蔚蓝色窄环","单核细胞：体积最大伴肾形松散核及灰蓝胞质","中性粒细胞：核分二至五叶伴大量粉红特殊颗粒"],"answer_idx":2,"explain":"单核细胞(3%–8%，14–20 μm，肾形/马蹄形松散浅染核)在血流中仅停留数小时，穿出微血管进入结缔组织及各脏器后即分化为巨噬细胞（肺尘细胞、肝枯否细胞、脑小胶质细胞等单核吞噬细胞系统）。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_blood_platelet","title":"血小板超微两区两管系与止血机制","subject":"histology","syllabus_refs":["syl_histology_032"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"巨核细胞脱落的无核细胞质片((100–300)×10⁹/L)，靠周缘微管束维形及开放小管/双颗粒完成止血。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P5","2026-基础医学分论-血液、肌组织.pptx#P20-P21"],"diagram_assets":[{"path":"assets/histo_hema_muscle_platelet_em_p20.webp","caption":"骨髓巨核细胞脱落的静止血小板模式图（左）及×180,000/×200,000电镜示周缘环形微管束（右）","source_page":20}],"payload":{"bullets":["起源、正常值与寿命：源自{{骨髓巨核细胞}}脱落的胞质片，正常 {{(100–300)×10⁹/L}}（直径2–4 μm，寿命约10天），{{无核但有细胞器}}。","光镜两区划分：静止呈双凸圆盘状，中央为含紫红颗粒的{{颗粒区}}，周边为浅蓝均一的{{透明区}}（激活后伸出伪足）。","透明区超微骨架：周缘环绕{{微管束}}维持圆盘形态，微丝负责收缩；质膜内陷成{{开放小管系}}通胞外，伴储存Ca²⁺的致密小管系。","颗粒区双颗粒：含较大{{特殊颗粒(α颗粒)}}（纤维蛋白原/vWF/PDGF）与较小电子致密的{{致密颗粒(δ颗粒)}}（ADP/ATP/Ca²⁺/5-HT）及溶酶体。","特性与生理功能：经{{黏附→聚集→释放→收缩→吸附}}参与血管收缩、血栓形成与凝血，并维持{{毛细血管内皮完整性}}（防紫癜）。"],"trap_note":"血小板虽同成熟红细胞一样“无细胞核”，但红细胞也无细胞器，而血小板却保留线粒体、两套小管系与α/δ两类颗粒，具备活跃代谢与释放收缩能力！","quiz":{"stem":"电镜观察静止血小板横切面时，若用药物解聚其透明区周缘一圈整齐排布的“微管束”，最先直接出现的形态与力学后果是：","options":["开放小管系彻底闭锁令致密颗粒无法向胞外释放","胞核染色质快速固缩失去合成血浆凝血因子能力","致密小管系完全消失失去维持毛细血管完整功能","失去周缘支撑骨架而难以保持静止时的双凸圆盘"],"answer_idx":3,"explain":"透明区紧贴质膜下环绕的环形微管束是维持静止血小板双凸圆盘几何形态的结构支架；解聚微管束后血小板立即丧失扁平圆盘构型（血小板无核，故核固缩/自产血浆凝血因子均不成立）。","remedial_node_id":"histo_blood_composition_plasma"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_bone_marrow_hematopoiesis","title":"【拓展】骨髓造血微环境与血细胞发生律","subject":"histology","syllabus_refs":[],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"红骨髓由网状基质造血组织与血窦构成，造血干细胞经祖细胞遵循六大通用规律演变为成熟血细胞。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P23-P27"],"diagram_assets":[{"path":"assets/histo_hema_muscle_hematopoiesis_p26.webp","caption":"造血干细胞经髓系造血干细胞与淋巴造血干细胞向各系成熟血细胞分化演进图谱","source_page":26}],"payload":{"bullets":["造血器官时序迁移：胚胎第3周{{卵黄囊血岛}}→第6周{{肝}}→第4月{{脾}}→4月后及出生后主要由{{红骨髓}}造血（辅以胸腺/脾/淋巴结）。","红骨髓双构筑：由{{血窦}}与{{造血组织}}组成——后者依托{{网状组织}}支架托举造血干细胞(HSC)、各期幼血细胞、巨噬、浆及脂肪细胞。","HSC vs 造血祖细胞(HPC)：HSC具极强增殖、{{多向分化}}与{{自我复制}}能力（脾集落实验证实）；HPC增殖有限且定向分化特定血细胞。","发生六大形态演变：胞体大→小、胞核大→小（{{巨核细胞均相反：核体由小→大}}）、染色质细→粗、胞质蓝→红、核质比大→小、分裂有→无。"],"trap_note":"常考唯一反例：所有血细胞发育均遵循“胞体与胞核大→小”，唯独巨核细胞是“小→大”且核多倍体分叶却不胞质分裂，成熟后胞质碎裂释放血小板。","quiz":{"stem":"除红骨髓巨核细胞系呈现“由小变大”的反常趋势外，绝大多数血细胞从原始阶段迈向成熟释放过程中，胞质染色由深蓝渐转为粉红（或伴特殊颗粒）的直接超微依据是：","options":["游离核糖体渐少而血红蛋白或特殊颗粒积累","滑面内质网剧增且吞噬外源酸性染料进溶酶体","粗面内质网与线粒体倍增使嗜碱性成分暴增","核膜溶解后碱性染色质直接弥散进入细胞质"],"answer_idx":0,"explain":"原始血细胞富含大量游离核糖体(RNA呈酸性)，故瑞氏染色胞质呈深嗜碱性蓝色；随分化成熟，核糖体逐渐减少，同时合成并蓄积大量血红蛋白或中性/嗜酸特殊颗粒，胞质遂转呈红色。","remedial_node_id":"histo_reticular_tissue"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_muscle_general_classification","title":"肌组织一般构筑、三层被膜与三大分类","subject":"histology","syllabus_refs":["syl_histology_033"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"肌细胞(肌纤维)借肌膜/肌质/肌浆网特化与结缔组织三层被膜协同，按横纹与意志分三型。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P29-P30","2026-基础医学分论-血液、肌组织.pptx#P40"],"payload":{"bullets":["通用超微对应术语：肌细胞呈长纤维状称{{肌纤维(myofiber)}}，胞膜称{{肌膜}}(sarcolemma)、胞质称{{肌浆}}(sarcoplasm)、SER特化为{{肌浆网}}。","骨骼肌三层CT被膜：整块肌外包致密CT{{肌外膜}}，入内分隔肌束为{{肌束膜}}，包绕单根肌纤维并导行毛细血管与神经末梢为{{肌内膜}}。","结构分型（横纹 vs 无横纹）：{{骨骼肌}}与{{心肌}}肌丝规则排列成肌节而呈横纹肌；{{平滑肌}}有肌丝但无肌原纤维与肌节，故无横纹。","支配与分布分型：受躯体运动神经支配的{{随意肌}}仅骨骼肌（含舌/轮匝/食管上段）；受自主神经支配的{{不随意肌}}为心肌与平滑肌（内脏血管）。"],"trap_note":"切勿将“肌纤维”与结缔组织中的“胶原纤维/弹性纤维”混淆——结缔组织纤维是胞外蛋白丝，而肌纤维是完整能收缩的“肌细胞”本身！","quiz":{"stem":"食管上段肌层与舌肌在光镜下呈现与肱二头肌相同的特征性横纹，若依据肌组织通用分类法判断，它们与其他内脏管壁肌群的核心归属差异在于：","options":["属于无横纹肌且依靠自主神经节律性搏动","属于骨骼肌横纹肌受躯体运动神经随意支配","属于内脏平滑肌且细胞质内具有致密体结构","属于心肌样分支肌且靠闰盘传递动作电位"],"answer_idx":1,"explain":"骨骼肌不仅附着于骨骼，也分布于轮匝肌、舌肌及食管上段，均属长圆柱状多核的横纹肌与躯体运动神经支配的随意肌；而心壁属于有横纹不随意肌，其余内脏与血管壁属于无横纹不随意平滑肌（P29）。","remedial_node_id":"histo_ct_general_features"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_skeletal_sliding_filament","title":"骨骼肌收缩肌丝滑动与带长变化规律","subject":"histology","syllabus_refs":["syl_histology_035"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"横桥结合肌动蛋白后向M线扭动牵拉细肌丝滑行，令肌节/I带/H带缩短而A带与肌丝自身恒长。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P32-P33","2026-基础医学分论-血液、肌组织.pptx#P36"],"diagram_assets":[{"path":"assets/histo_hema_muscle_sarcomere_slide_p36.webp","caption":"肌节纵切电镜与粗细肌丝滑动对应示意图：Z线、I带、A带及中央H区定位关系","source_page":36}],"payload":{"steps":[{"cue":"位点解锁与横桥牵拉方向","reveal":"Ca²⁺结合细肌丝肌钙蛋白TnC使原肌球蛋白移位，暴露肌动蛋白结合位点；粗肌丝豆芽状头部(横桥)水解ATP后向M线方向屈动，拉动两端细肌丝向肌节中央滑行。","mechanism_tag":"横桥向 M 线牵引"},{"cue":"肌节各明暗带长度的增减对照","reveal":"细肌丝沿粗肌丝间隙滑入A带中心，导致两Z线彼此靠拢、整个肌节缩短；仅含细肌丝的I带与仅含粗肌丝中央裸区的H带同步缩短甚至消失。","mechanism_tag":"I/H带变窄、Z线靠拢"},{"cue":"为何暗带(A带)宽度全程纹丝不动","reveal":"粗肌丝与细肌丝分子自身长度完全不变，仅发生相对重叠度增加；因为A带宽度等于整根粗肌丝全长，所以收缩时A带宽度始终恒定不变。","mechanism_tag":"A带与肌丝自身恒长"}],"takeaway":"肌丝滑动核心口诀：粗细肌丝自身不缩、A带等长不动，仅仅重叠加深导致“Z线靠拢、肌节/I带/H带三缩短”。","quiz":{"stem":"电镜对比同一块骨骼肌在“充分舒张”与“最大等张缩短”两种状态下的单个肌节纵切面，下列哪组明暗带宽度指标完全保持不变？","options":["暗带(A带)宽度及粗细肌丝各自的长度","明带(I带)宽度及肌节两侧Z线间的距离","H带宽度及粗细肌丝中央无重叠区跨度","明带(I带)宽度及H带中央亮区全部长度"],"answer_idx":0,"explain":"依据肌丝滑动学说，收缩时粗、细肌丝本身均不缩短，仅细肌丝向M线滑入使重叠加深：故肌节、I带与H带均缩短（H带甚至消失），而由粗肌丝全长决定的A带宽度全程保持不变。","remedial_node_id":"histo_skeletal_muscle_triad"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_cardiac_muscle_intercalated_disc","title":"心肌光超微特征：二联体与闰盘连接","subject":"histology","syllabus_refs":["syl_histology_036"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"短柱分支单中核心肌纤维在Z线处具粗T管与二联体，借阶梯状闰盘(纵缝隙/横黏着)同步搏动。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P37-P38","2026-基础医学分论-血液、肌组织.pptx#P40"],"diagram_assets":[{"path":"assets/histo_hema_muscle_cardiac_disc_p38.webp","caption":"心肌阶梯状闰盘三维图解：横位中间连接/桥粒抗牵拉，纵位缝隙连接传导冲动，及Z线粗T管与肌浆网","source_page":38}],"payload":{"bullets":["光镜形态特征：短柱状、有分支并吻合成网；每细胞常含{{1个卵圆形居中核}}（核周常见脂褐素），{{横纹不及骨骼肌明显}}，细胞间见深染闰盘。","肌原纤维与线粒体：粗细不等、分隔不完整，但{{线粒体极其丰富}}（占胞质大部，伴糖原肌红蛋白），满足心脏终身不停搏的有氧供能。","Z线粗T管与二联体：{{T小管较粗且位于Z线水平}}（非骨骼肌A-I交界）；肌浆网稀疏、终池少，T管多仅与一侧终池贴合形成{{二联体(diad)}}。","闰盘(intercalated disc)阶梯双分工：位于Z线水平——{{横位有中间连接与桥粒}}(传导张力防扯断)，{{纵位有缝隙连接}}(传电冲动促同步收缩)。","心房肌内分泌特化：部分心房肌纤维胞质核周含分泌颗粒，能合成释放{{心房钠尿肽(ANP)}}，调节排钠排水与血压稳态。"],"trap_note":"常考三大对比陷坑：①心肌T管在Z线（非A-I交界）且多为二联体；②闰盘横向是机械锚定（中间连接+桥粒），纵向才是电耦联（缝隙连接）；③肌浆网不发达，故更依赖胞外Ca²⁺触发。","quiz":{"stem":"心肌阶梯状闰盘在功能上必须同时解决“强大收缩牵拉不被撕裂”与“千万心肌细胞瞬间同步除极”两大工程难题，这两项任务分别由闰盘哪两部分执行？","options":["横位缝隙连接抗牵拉，纵位桥粒传电流","横位紧密连接封间隙，纵位半桥粒锚定","横位中间连接/桥粒锚定，纵位缝隙连接","横位终池构成三联管，纵位肌浆网传兴奋"],"answer_idx":2,"explain":"闰盘位于Z线水平呈阶梯状：垂直于肌丝牵拉方向的“横位”装配中间连接与桥粒（强力锚定肌丝骨架传递张力），平行于长轴的“纵位”装配缝隙连接（低电阻离子通道直接传递动作电位，使心房/心室各自同步收缩）。","remedial_node_id":"histo_epith_lateral_junctions"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_smooth_muscle_ultrastructure","title":"平滑肌超微骨架：小凹、密体与密斑","subject":"histology","syllabus_refs":["syl_histology_037"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"长梭形无横纹平滑肌缺T管与肌钙蛋白，代以质膜小凹与密体/密斑/中间丝立体网格触发持久收缩。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P39-P40"],"diagram_assets":[{"path":"assets/histo_hema_muscle_smooth_3d_p39.webp","caption":"平滑肌纤维超微纵切与3D立体图：基底膜、质膜小凹(Caveola)、密体/密区(Dense body/area)及缝隙连接","source_page":39}],"payload":{"bullets":["光镜形态与排布：细胞呈{{长梭形无分支}}，大小悬殊、镶嵌紧密排列；含{{1个居中核}}（长椭圆形，收缩时呈螺旋扭曲状）。","无横纹无肌节：胞质有{{粗、细肌丝}}（肌动蛋白与肌球蛋白）但未组装成整齐肌原纤维与肌节，故{{无横纹}}且呈均匀嗜酸性。","无T管与质膜小凹：肌浆网极稀疏，{{无横小管}}，质膜向内凹陷成成排烧瓶状{{小凹(caveolae)}}，聚集膜Ca²⁺通道以浓缩并导入胞外Ca²⁺。","发达细胞骨架锚点：胞质散在{{密体(dense body)}}、质膜内侧附{{密斑(dense plaque/area)}}（含α-辅肌动蛋白，相当于Z线），借{{中间丝}}连成斜行收缩网格。","分子收缩与电耦联：缺TnC，胞外Ca²⁺入胞结合{{钙调蛋白(CaM)}}激活MLCK磷酸化肌球蛋白引发滑行；相邻细胞借{{缝隙连接}}同步收缩。"],"trap_note":"记住“无横纹 ≠ 无肌丝”！平滑肌同样依靠粗细肌丝滑动收缩，只是肌丝斜向锚定在“密体与密斑”三维骨架上（收缩时整个梭形细胞像拧毛巾般螺旋短缩）。","quiz":{"stem":"电镜追踪内脏平滑肌细胞收缩时的力传递路径：其胞质细肌丝既不连接Z线，也不构成平行肌节，这些细肌丝在胞内与质膜侧的机械锚定支架相当于骨骼肌Z线的是：","options":["横小管与终池贴合形成的二联体通道","阶梯状闰盘横位部分排布的桥粒斑块","质膜内陷成排聚集钙通道的烧瓶小凹","胞质内散在的密体与质膜内侧的密斑"],"answer_idx":3,"explain":"平滑肌无Z线与肌节，细肌丝分别附着于胞质内的“密体”和质膜内面的“密斑”（富含α-辅肌动蛋白，功能等价于Z线），再借中间丝连成斜交三维网架，故收缩时牵拉细胞呈螺旋缩短（小凹仅类比T管负责Ca²⁺内流而非锚定肌丝）。","remedial_node_id":"physio_skeletal_vs_smooth"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_muscle_histogenesis_regeneration","title":"肌组织发生起源与三种肌再生潜能","subject":"histology","syllabus_refs":["syl_histology_038"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"三肌同源中胚层成肌细胞：骨骼肌靠卫星细胞有限修复、心肌坏死成瘢痕、平滑肌保留最强分裂再生。","source_slides":["2026-基础医学分论-血液、肌组织.pptx#P29-P40 (补充大纲 syl_histology_038 教材标准)"],"payload":{"columns":["对比维度","骨骼肌","心肌","平滑肌"],"rows":[["发生起源","中胚层成肌细胞(肌节)增殖融合为多核肌管","中胚层成肌细胞不融合，各自端端借闰盘连接","脏壁/局部中胚层间充质分化为单核长梭形细胞"],["细胞周期","终末肌纤维不再分裂；肌膜与基膜间留存肌卫星细胞","出生后迅速退出细胞周期，属典型永久性细胞","成年细胞仍保留有丝分裂与去分化增殖能力"],["损伤后再生","较弱/有限再生：局部微伤时肌卫星细胞激活融合修补","极微弱/几乎无再生能力，坏死心肌无法原位复生","三种肌中最强：存活细胞直接分裂+血管周间充质分化"],["大损与转归","肌束/基膜大面积毁损则由成纤维细胞瘢痕替代","心梗坏死后必由肉芽组织机化形成纤维性瘢痕","平滑肌层缺损常可实现实质肌细胞再生修复"]],"quiz":{"stem":"三名患者分别遭受骨骼肌轻微拉伤（基膜完整）、急性心肌透壁梗死与子宫肌层手术切口，数月后复查原位肌细胞完全性再生最弱、几乎全由胶原瘢痕替代的是：","options":["子宫平滑肌切口：既无卫星细胞又无间充质储备","急性心肌梗死灶：成人心肌属永久细胞难分裂","骨骼肌轻度拉伤：因多核融合完全无法启动修复","三者完全相同：所有肌组织损伤皆由胶质细胞补"],"answer_idx":1,"explain":"三种肌组织同源中胚层但再生力悬殊：平滑肌保留有丝分裂及血管周间充质分化能力（再生最强）；骨骼肌基膜完整时可激活肌膜与基膜间的“肌卫星细胞”融合修补（有限再生）；心肌细胞终末分化为永久性细胞，心梗坏死后几乎不能再生，只得由纤维瘢痕替代。","remedial_node_id":"patho_repair_regeneration_potential"}},"added_at":"2026-11-17T17:34:58+08:00"},{"id":"histo_neuro_tissue_overview","title":"神经组织组成、发生双源与功能分工","subject":"histology","syllabus_refs":["syl_histology_039"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"神经组织由神经元（感受整合传导）与神经胶质（支持绝缘修复）及极少细胞间质构成；源自神经管/神经嵴与单核细胞。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P03,P06,P61"],"diagram_assets":[{"path":"assets/histo_neuro_origin_p03.webp","caption":"神经管闭合与神经上皮细胞分化图谱：神经管成CNS、神经嵴成PNS，而小胶质细胞独源于血液单核细胞","source_page":3}],"payload":{"bullets":["核心组分：神经组织细胞密集且{{细胞外基质}}极少，主要由{{神经元（神经细胞）}}与数量更多的{{神经胶质细胞}}两大家族构成。","神经元分工：作为神经系统{{结构和功能的基本单位}}，膜具高度兴奋性，专门负责{{接受刺激、整合信息与传导冲动}}。","神经胶质分工：有突起但{{无树突轴突之分}}，不能产生和传导神经冲动，终身保留分裂潜能，专司{{支持、营养、保护、绝缘与修复}}。","胚胎发生三源：{{神经管}}（神经上皮）分化为CNS神经元及星形/少突/室管膜细胞；{{神经嵴}}形成PNS神经节与施万/卫星细胞；{{小胶质细胞}}独源于中胚层单核细胞。","宏观组织布局：CNS中胞体与无髓纤维/突触密集区称{{灰质（或皮质）}}，有髓神经纤维束集区称{{白质（或髓质）}}；PNS由神经节、神经与末梢组成。"],"trap_note":"神经胶质细胞虽数量远超神经元且同样起自神经外胚层（除小胶质细胞外），但无化学突触与动作电位传导能力；小胶质细胞的中胚层单核细胞起源是高频鉴别点。","quiz":{"stem":"胚胎神经管封闭后若实验性阻断外周单核细胞迁入脑实质，成年中枢神经组织中仍能按神经上皮谱系正常分化、唯独缺如的细胞是：","options":["源自单核细胞的中枢小胶质细胞","源自神经上皮的星形胶质细胞","形成中枢髓鞘的少突胶质细胞","衬覆脑室腔面的纤毛室管膜细胞"],"answer_idx":0,"explain":"神经组织中绝大多数细胞来自神经外胚层神经上皮（成神经细胞→神经元，成胶质细胞→星形/少突胶质细胞，室管膜细胞），唯独小胶质细胞由中胚层单核细胞迁移入脑分化而来（P03）。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_soma_ultrastructure","title":"神经元胞体：尼氏体与神经原纤维","subject":"histology","syllabus_refs":["syl_histology_040"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"神经元胞体具可兴奋膜、大而色浅的空泡状核，核周质富强嗜碱尼氏体（rER+fRib）与镀银神经原纤维（神经丝+微管）司轴浆运输。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P21-P26"],"diagram_assets":[{"path":"assets/histo_neuro_nissl_em_p23.webp","caption":"尼氏体光镜强嗜碱斑块（左上）、粗面内质网与高尔基复合体电镜实图（左下）及胞体-轴丘超微立体结构（右）","source_page":23}],"payload":{"bullets":["胞膜与细胞核：胞膜为镶嵌离子通道与受体的{{可兴奋膜}}；胞核居中、{{核大色浅、核膜清楚、核仁大而明显}}（常染色质丰富，转录极活跃）。","尼氏体 (Nissl bodies)：LM呈{{强嗜碱性}}粒状或虎斑块状（分布于胞体与树突）；EM为平行排列的{{粗面内质网(rER)与游离聚核糖体}}，合成分泌结构蛋白与递质合成酶。","神经原纤维 (Neurofibril)：镀银染色LM呈棕黑细丝交织网；EM由{{神经丝（约10nm中间丝）与微管（约20–25nm）}}为主及微丝组成，维持细胞形态并作运输轨道。","双向轴浆运输：依托微管轨道，{{驱动蛋白 (Kinesin)}}介导自胞体向终末的{{顺向运输}}（运突触囊泡/酶/线粒体）；{{动力蛋白 (Dynein)}}介导终末向胞体的{{逆向运输}}（运NGF及狂犬病毒/破伤风毒素）。","树突棘与轴丘始段：树突表面常伸出{{树突棘}}扩增兴奋性突触表面；{{轴丘}}及{{轴突始段}}完全无尼氏体，始段密集Nav通道为动作电位起始触发区。"],"trap_note":"神经原纤维(neurofibril)是光镜镀银下因银盐沉积并合呈现的微细丝网，而电镜真实对应的是神经丝(neurofilament)与微管(microtubule)；衰老神经元胞质内常聚积脂褐素残余体。","quiz":{"stem":"秋水仙碱选择性解聚神经元轴突内的微管骨架后，轴浆运输中率先停摆并导致远端靶器官神经营养因子(NGF)回传中断的核心环节是：","options":["轴突始段电压门控钠通道即刻永久失活","神经元胞体高尔基复合体顺向分泌加速","依赖动力蛋白与驱动蛋白的轴浆运输中断","树突棘内粗面内质网聚核糖体大量增殖"],"answer_idx":2,"explain":"微管不仅是神经原纤维的核心超微组分，更是顺向（驱动蛋白 Kinesin）与逆向（动力蛋白 Dynein）轴浆运输的刚性轨道；微管解聚后顺逆向物质与NGF回传均受阻。","remedial_node_id":"histo_neuro_tissue_overview"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_processes_classification","title":"神经元突起鉴别与形态功能分类","subject":"histology","syllabus_refs":["syl_histology_040"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"树突≥1条粗细递减含尼氏体与树突棘司接收，轴突恒1条细均无尼氏体司传出；综合突起数目、高尔基Ⅰ/Ⅱ型与三功能分类定位反射弧。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P26-P28"],"payload":{"columns":["比较与分类维度","形态超微与突起格局","典型部位与神经回路功能"],"rows":[["树突 vs 轴突","树突≥1条多分支，具树突棘且胞器同核周质(含尼氏体)；轴突恒1条细均，始于轴丘，有侧支无尼氏体","树突接受并整合多源突触输入(向胞体传)；轴突始段触发动作电位并单向传向终末"],["多极神经元","1条轴突 + 多条分支树突（人体数量最多）","脊髓前角运动神经元、大脑锥体细胞、小脑浦肯野细胞（主司运动传出与联络整合）"],["双极 vs 假单极神经元","双极两极各1树1轴；假单极胞体发出1单突呈T型分中枢突与周围突","双极见视网膜/嗅上皮/前庭耳蜗节；假单极居脊神经节与脑神经节，司躯体感觉传入"],["高尔基Ⅰ/Ⅱ型与功能分型","Ⅰ型长轴突投射远距；Ⅱ型短轴突局部成网（中间神经元占99%）","串联形成“感觉(传入)→中间(联络整合)→运动(传出)”基本反射通路"]],"quiz":{"stem":"光学与电子显微镜下，多极运动神经元的轴突（含轴丘）与同一神经元树突在超微细胞器配置上最显著的鉴别点在于轴突全程缺乏：","options":["纵向平行排列的微管与神经丝","强嗜碱性的粗面内质网尼氏体","维持离子梯度的线粒体与膜泵","可触发局部或动作电位的胞膜"],"answer_idx":1,"explain":"树突靠近胞体段保持与核周质相同的细胞器配置（含有尼氏体），而轴突从漏斗状轴丘起始直到轴突终末完全缺乏尼氏体（粗面内质网），依赖胞体顺向轴浆运输补给蛋白（P26）。","remedial_node_id":"histo_neuro_soma_ultrastructure"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_glia_comparison","title":"中枢与周围六类神经胶质细胞鉴别","subject":"histology","syllabus_refs":["syl_histology_042"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"CNS含星形/少突/小胶质/室管膜4类胶质，PNS含施万与卫星细胞2类；成鞘机制（1对多vs1对1带基膜）与免疫吞噬分工迥异。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P34-P39"],"payload":{"columns":["胶质细胞分类","胚胎起源、形态与标志","核心功能与病理修复角色"],"rows":[["星形胶质细胞 (CNS)","神经管；最大星形分原浆性(灰质)/纤维性(白质)，含胶质丝GFAP⁺","支持营养与离子递质缓冲；脚板筑胶质界膜(BBB)；受损增生胶质瘢痕"],["少突胶质细胞 (CNS)","神经管；胞体较小突起少，单细胞伸多叶突同时包绕多条轴突","形成CNS髓鞘（无基膜与神经膜），髓鞘崩解碎片释放轴突生长抑制因子"],["小胶质细胞 (CNS)","中胚层血单核细胞迁入；最小长椭形多刺突，Iba1⁺/MHC-II","CNS常驻巨噬细胞，脑损伤或炎症时活化吞噬碎屑并提呈抗原"],["室管膜细胞 (CNS)","神经管腔面；单层立方/柱状上皮样衬覆脑室及脊髓中央管，顶面具纤毛","参与脉络丛分泌并摆动推动脑脊液(CSF)循环，部分室管膜下区含NSC"],["施万细胞 (PNS)","神经嵴；又称神经膜细胞，外具完整基膜，1:1缠绕PNS有髓结间体","形成PNS髓鞘与Remak束；断伤后在基膜管内增殖成Büngner带引导再生"],["卫星细胞 (PNS)","神经嵴；又称被囊细胞，扁平或立方形单层紧包神经节胞体","分隔保护周围神经节神经元胞体并调控营养代谢交换"]],"quiz":{"stem":"临床上格林-巴利综合征(GBS)选择性破坏周围神经髓鞘而大脑白质完好，而多发性硬化(MS)则专攻中枢白质髓鞘。两者受损靶细胞结构与再生能力截然不同的核心在于：","options":["PNS靠带基膜的施万细胞1:1成鞘而CNS靠少突胶质","PNS靠无基膜的卫星细胞成鞘而CNS靠原浆星形胶质","PNS靠单核源小胶质细胞成鞘而CNS靠室管膜纤毛","PNS靠纤维性星形胶质成鞘而CNS靠神经嵴细胞"],"answer_idx":0,"explain":"PNS有髓纤维由神经嵴来源、外被基膜的施万细胞1:1包绕单一轴突结间体（易引导再生）；CNS有髓纤维则由神经管来源的少突胶质细胞一拖多成鞘且无基膜。","remedial_node_id":"histo_neuro_tissue_overview"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_astrocyte_bbb","title":"星形胶质细胞足板与血脑屏障构筑","subject":"histology","syllabus_refs":["syl_histology_042"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"星形胶质细胞含GFAP胶质丝，借脚板贴附脑毛细血管，与内皮紧密连接、基膜及周细胞共同筑成选择性血脑屏障(BBB)。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P36-P38"],"diagram_assets":[{"path":"assets/histo_neuro_bbb_p38.webp","caption":"血脑屏障(BBB)横切超微模式图（P38）：连续毛细血管内皮（紧密连接、极少吞饮小泡）、基膜、周细胞与星形胶质细胞脚板","source_page":38}],"payload":{"bullets":["两型分化与标志：{{原浆性星形胶质细胞}}居灰质、突起粗短多分支；{{纤维性星形胶质细胞}}居白质、突起细长少分支，胞质皆含特征性{{GFAP 胶质丝}}。","稳态与瘢痕双面：正常时摄取突触外K⁺与谷氨酸、分泌{{神经营养因子}}滋养神经元；脑损伤后大量增生充填缺损形成{{胶质瘢痕}}。","血脑屏障 (BBB) 概念：阻挡血浆蛋白、水溶性大分子毒素与病原体自由进入脑实质，维系中枢离子与递质微环境恒定的{{四层选择性屏障}}。","BBB 四层超微结构：由内向外依次为无窗孔的{{连续毛细血管内皮}}（细胞间具{{紧密连接}}且{{极少吞饮小泡}}）、完整{{基膜}}、{{周细胞}}及星形胶质细胞脚板构成的{{胶质界膜}}。","特例突破窗口：下丘脑{{终板血管器(OVLT)}}、垂体后叶等室周器官缺乏典型BBB（呈有孔毛细血管），供内生致热原或血中多肽信号感知入脑。"],"trap_note":"血脑屏障并非仅靠星形胶质细胞脚板一层——阻断水溶性物质旁细胞扩散的首要物理封锁在于脑毛细血管内皮细胞之间严密的“紧密连接”以及极低水平的跨细胞吞饮转运。","quiz":{"stem":"常规青霉素或多数水溶性大分子抗生素在脑膜未发炎时极难透过血脑屏障(BBB)进入脑脊液与脑实质，其中决定“阻断旁细胞自由渗漏”的最关键第一道结构闸门是：","options":["星形胶质细胞释放神经营养因子的胞吐囊泡","无窗孔脑毛细血管内皮细胞间的紧密连接","衬覆脑室腔表面的室管膜上皮细胞顶面纤毛","脑动脉外膜致密胶原纤维网架与成纤维细胞"],"answer_idx":1,"explain":"血脑屏障由连续内皮+紧密连接、基膜、周细胞与胶质界膜组成；其中内皮无窗孔、极少吞饮小泡且细胞间具紧密连接，是阻断水溶性大分子经细胞旁路渗漏的首道闸门（P38）。","remedial_node_id":"histo_epith_lateral_junctions"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_myelin_ultrastructure","title":"神经纤维髓鞘电镜板层与郎飞结","subject":"histology","syllabus_refs":["syl_histology_043"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"髓鞘由胶质膜沿轴突系膜螺旋卷绕形成，EM呈主致密线与板层间线交替；郎飞结裸露轴膜富Nav通道支撑跳跃传导。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P41-P47,P51"],"diagram_assets":[{"path":"assets/histo_neuro_myelin_nodes_p47.webp","caption":"有髓神经纤维纵切模式图（P47）：髓鞘内漏斗状施兰切迹残余胞质通道（上）与郎飞结结旁袢放大构筑（下）","source_page":47}],"payload":{"bullets":["纤维与神经干三膜：神经纤维 = 神经元长突起 + 外包胶质；外周神经干由内向外分别被{{神经内膜}}（围单纤维）、{{神经束膜}}（血-神经屏障）与{{神经外膜}}（致密CT）包绕。","卷绕成鞘与EM板层：胶质膜沿{{轴突系膜}}同心螺旋缠绕并排挤胞质，EM现明暗板层：胞膜内表面紧贴融合形成{{主致密线}}，外表面相邻形成{{板层间线}}。","三染色显像差异：常规石蜡{{HE染色}}因酒精二甲苯溶去脂质使髓鞘呈{{浅染网状}}；{{锇酸}}固定脂质染{{黑色}}；银染显出贯穿板层的漏斗状{{施兰切迹}}（残余施万胞质营养通道）。","郎飞结与跳跃传导：相邻髓鞘节段（{{结间体}}）之间的缩窄裸露区称{{郎飞结 (Node of Ranvier)}}；结区轴膜高密度聚集{{电压门控Na⁺通道}}，实现快速{{跳跃式传导}}。"],"trap_note":"髓鞘并非纯脂质惰性管，它由高度特化的神经胶质细胞质膜多层紧压而成（脂蛋白占约70–80%）；施兰切迹正是螺旋包绕时未完全挤净的胞质通道，在光镜银染下易被误判为断裂损伤。","quiz":{"stem":"观察正常周围有髓神经纤维切片时，常规石蜡 HE 染色仅见轴突周围呈淡红空网状，而用锇酸固定可染出致密黑环、银染则显出斜行棕黑漏斗状纹。造成三者形态分化的超微根因是：","options":["HE染轴突线粒体而锇酸和银染专标施万细胞核膜","HE溶去胶原纤维而锇酸和银染仅显示郎飞结钠泵","常规制片溶去髓鞘脂质而锇酸固定脂质银染施兰切迹","常规制片膨大板层间线而锇酸溶解髓鞘内磷脂蛋白"],"answer_idx":2,"explain":"石蜡HE制片的乙醇和二甲苯脱脂溶解了髓鞘中约70–80%的脂质，只剩网状神经角蛋白骨架；锇酸可固定并黑染不饱和脂质；银染可显出贯穿髓鞘板层的施兰切迹残余胞质通道（P43, P47）。","remedial_node_id":"histo_intro_lm_em_he_methods"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_fibers_comparison","title":"PNS与CNS有髓及无髓纤维对比","subject":"histology","syllabus_refs":["syl_histology_043"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"区分PNS有髓(施万1:1+基膜)、CNS有髓(少突1拖多+无基膜)、PNS无髓(施万Remak束)与CNS无髓(完全裸露)的包绕及传导差异。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P41-P50"],"diagram_assets":[{"path":"assets/histo_neuro_unmyelinated_remak_p49.webp","caption":"PNS无髓神经纤维模式图与TEM实图（P49）：连续施万细胞胞质槽同时嵌包多条细轴突（Remak束），无同心髓鞘与郎飞结","source_page":49}],"payload":{"columns":["神经纤维类型","胶质包绕格局与基膜","郎飞结与兴奋传导模式"],"rows":[["PNS 有髓神经纤维","1个施万细胞仅包1条轴突的1个结间体；外具神经膜与基膜","有典型郎飞结与施兰切迹；借郎飞结跳跃式传导，速度极快"],["CNS 有髓神经纤维","1个少突胶质细胞伸多叶突同时包多条轴突；无神经膜与基膜","有郎飞结行跳跃传导（裸露区较宽）；通常缺乏施兰切迹"],["PNS 无髓神经纤维","1条连续施万细胞表面纵槽嵌包多条细轴突(Remak束)；外有基膜","无同心圆髓鞘、无郎飞结；沿轴膜局部电流连续传导，速度慢"],["CNS 无髓神经纤维","轴突完全裸露无任何胶质细胞包卷，直接穿行于神经毡间隙","无髓鞘与郎飞结；局部电流连续慢速传导（主要居灰质局部环路）"]],"quiz":{"stem":"周围神经系统内负责传导慢痛的 C 类无髓神经纤维在电子显微镜下与有髓神经纤维最本质的结构-电生理对应关系是：","options":["单个施万细胞1:1成鞘且具备郎飞结跳跃传导","少突胶质细胞多叶卷绕且具备施兰切迹高速传导","轴突完全裸露无胶质包裹且仅于灰质局部电流传导","连续施万细胞合包多轴突却无髓鞘郎飞结故慢传"],"answer_idx":3,"explain":"PNS无髓神经纤维并非完全裸露（只有CNS无髓纤维才裸露），而是由连续施万细胞凹陷包裹多条细轴突（Remak束），但膜不作同心螺旋卷绕也无郎飞结，故只能以局部电流连续慢速传导（P49–P50）。","remedial_node_id":"histo_neuro_myelin_ultrastructure"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_sensory_endings","title":"感觉神经末梢：游离、小体与肌梭","subject":"histology","syllabus_refs":["syl_histology_044"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"游离神经末梢无被囊司痛温轻触；有被囊感觉末梢包含真皮触觉小体、深部环层小体(压/振觉)及骨骼肌本体感受器肌梭。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P52-P56"],"diagram_assets":[{"path":"assets/histo_neuro_muscle_spindle_p56.webp","caption":"图8-34 肌梭结构模式图（P56）：CT被囊包裹核袋/核链梭内肌，配备环状与花枝样感觉末梢及运动末梢感应伸缩","source_page":56}],"payload":{"columns":["感觉神经末梢","被囊与光镜超微构筑","典型分布与感受模态"],"rows":[["游离神经末梢","有髓/无髓纤维近末梢失鞘成裸露细分支，无结缔组织被囊","表皮棘层/角膜/消化道上皮与CT；感受痛觉、温度觉与轻触觉"],["触觉小体 (Meissner)","扁平施万样细胞横叠成椭圆形柱，外包薄CT被囊，神经盘绕其间","真皮乳头层（指尖、唇、乳头最密）；感受精细应力与两点辨别触觉"],["环层小体 (Pacinian)","多层扁平细胞如洋葱同心层叠成囊，中央轴索穿入均质内棍","皮下组织、肠系膜、骨膜、韧带；感受深部压觉与高频振动觉"],["肌梭 (Muscle spindle)","梭形CT被囊包核袋与核链梭内肌，受环状/花枝状感觉及γ运动支配","与梭外骨骼肌并行；本体觉感受器，实时监测肌纤维长度与牵张速率"]],"quiz":{"stem":"一名糖尿病周围神经病变患者主诉足底深部震动觉及肢体位置本体觉明显减退，但皮肤针刺痛温觉尚存。从神经末梢解剖分型定位，优先受累的是哪组感受器及其传入纤维？","options":["有被囊的环层小体、肌梭与粗大有髓感觉纤维","表皮内裸露的游离神经末梢与细无髓痛觉纤维","真皮浅层无被囊交感血管末梢与节后膨胀终末","骨骼肌膜凹陷处的运动终板与乙酰胆碱能轴突"],"answer_idx":0,"explain":"环层小体专司压觉与振动觉（P55），肌梭专司骨骼肌伸缩本体觉（P56），二者均依赖粗大有髓传入纤维；皮肤痛温觉则由表皮游离神经末梢及较细纤维传导（P53）。","remedial_node_id":"histo_neuro_fibers_comparison"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_motor_endplate","title":"躯体运动终板超微构筑与内脏膨体","subject":"histology","syllabus_refs":["syl_histology_044"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"躯体运动终板是神经-肌接头特化化学突触（ACh囊泡/间隙基膜AChE/终板皱褶N₂受体）；内脏末梢呈串珠状膨体调控平滑肌与腺体。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P29,P57-P60"],"diagram_assets":[{"path":"assets/histo_neuro_motor_endplate_p59.webp","caption":"躯体运动终板(神经-肌连接)结构模式图（P59）：施万细胞覆帽、终末ACh突触小泡、突触后膜皱褶N型受体与肌原纤维","source_page":59}],"payload":{"bullets":["运动终板总构：躯体运动轴突近骨骼肌失去髓鞘并分支嵌入肌膜{{突触槽}}，背面由{{施万细胞}}覆帽绝缘保护（又称神经-肌连接）。","突触前成分：轴突终扣内富含供应合成能量的{{线粒体}}及密集含{{乙酰胆碱 (ACh)}}的清亮圆形突触小泡，前膜具活性带。","突触间隙与基膜酶：约20–50nm的初级与次级突触间隙内含肌膜延续的{{基膜}}，基膜中嵌合大量{{乙酰胆碱酯酶 (AChE)}}毫秒级水解终止递质。","终板膜后皱褶：突触后肌膜呈深褶内陷（{{突触后膜皱褶}}）极大扩增表面积，褶脊顶部密集排布{{N₂型ACh受体}}（化学门控阳离子通道）触发肌膜兴奋。","内脏运动神经末梢：自主神经无髓纤维末端不形成终板，沿途膨大为含ACh或NA囊泡的{{串珠状膨体}}，对平滑肌/心肌/腺细胞行过路突触调控。"],"trap_note":"不要把运动终板间隙里的基膜当成障碍物——恰恰是这道穿行于初级与次级突触间隙的基膜牢牢锚定了乙酰胆碱酯酶(AChE)，确保单次神经冲动只引发一次肌肉抽搐而不致强直痉挛。","quiz":{"stem":"重症肌无力患者体内自身抗体持续结合并破坏神经-肌接头突触后膜褶脊结构，电镜观察该病变位置时最典型受累的分子靶点与超微改变是：","options":["突触前终扣活性带囊泡内乙酰胆碱完全停止合成","终板膜突触后皱褶展平伴N₂型ACh受体数量锐减","突触间隙基膜内的乙酰胆碱酯酶发生不可逆灭活","平滑肌旁自主神经串珠状膨体释放的去甲肾上腺素"],"answer_idx":1,"explain":"重症肌无力的自身抗体主要攻击骨骼肌终板膜皱褶脊顶密集分布的N₂型ACh受体（阳离子通道），诱发补体介导损伤使突触后膜皱褶变浅展平、受体显著减少（P59）。","remedial_node_id":"histo_chemical_synapse"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_neuro_degen_regen","title":"神经干细胞与神经纤维溃变再生","subject":"histology","syllabus_refs":["syl_histology_045"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"成体NSC定居SVZ与海马SGZ；神经断伤诱发远端华勒变性与胞体尼氏体溶解，PNS凭施万基膜管Büngner带再生，CNS因少突抑阻与胶质瘢痕失败。","source_slides":["第五讲 神经组织（基础医学，2023）.pptx#P03,P37,P42","《基础医学分论》组胚教学大纲 · syl_histology_045"],"payload":{"steps":[{"cue":"成体脑内神经干细胞(NSC)位于何处，有何分化潜能？","reveal":"主要定居侧脑室室管膜下区(SVZ)与海马齿状回颗粒下区(SGZ)，可自我更新并向神经元、星形与少突胶质三系分化，参与可塑性但难自发修补大片毁损。","mechanism_tag":"NSC双栖龛位"},{"cue":"神经纤维切断后，远端与近端胞体分别发生何种溃变反应？","reveal":"远端失胞体营养而发生华勒变性（轴突髓鞘崩解，由巨噬细胞/施万细胞吞噬）；近端胞体肿胀、核偏位及中央尼氏体溶解，重编合成再生所需结构蛋白。","mechanism_tag":"华勒变性与逆行溶解"},{"cue":"为何周围神经(PNS)切断吻合后常能实现轴突再生与功能恢复？","reveal":"远端保留的施万细胞基膜管内，施万细胞迅速增殖排列成施万细胞索（Büngner带）并分泌NGF，引导近端轴突芽生（生长锥）穿越断端支配靶器官。","mechanism_tag":"施万基膜管+Büngner带"},{"cue":"为何中枢神经(CNS)传导束断裂后极难再生恢复？","reveal":"CNS神经元属永久性细胞且缺施万基膜引导管；少突胶质细胞髓鞘碎片含Nogo等生长抑制分子，反应性星形胶质细胞增生形成GFAP⁺胶质瘢痕物理阻断穿越。","mechanism_tag":"髓鞘抑阻+胶质瘢痕"}],"takeaway":"PNS成于“完整施万基膜管+Büngner带+NGF引导”；CNS败于“无基膜管+少突碎片抑阻+星形胶质瘢痕封锁”。","quiz":{"stem":"外伤致尺神经断裂后行显微神经外膜吻合术，数月后远端手部肌力可逐步恢复；而脊髓胸段传导束同等程度横断后却长期瘫痪难愈。决定两者再生结局分歧的关键结构微环境是：","options":["尺神经神经元属不稳定细胞可由外周干细胞替代","脊髓神经元断离后不发生中央尼氏体溶解反应","外周施万细胞基膜管成带引路而中枢生胶质瘢痕","中枢少突胶质细胞迅速分化为多极运动神经元"],"answer_idx":2,"explain":"无论PNS还是CNS成熟神经元均为永久性细胞（靠近端轴突芽生而非分裂替代）；PNS远端保留施万细胞基膜管并增殖成Büngner带引导轴突长入，而CNS无基膜管且产生少突抑制碎片与星形胶质瘢痕。","remedial_node_id":"histo_neuro_astrocyte_bbb"}},"added_at":"2026-11-17T17:35:21+08:00"},{"id":"histo_eye_cornea_uvea_aqueous","title":"角膜五层、虹膜睫状体与房水循环","subject":"histology","syllabus_refs":["syl_histology_046"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"角膜借正交胶原板层与**内皮泵**维系透明；睫状体非色素上皮分泌房水经前房角小梁网入**Schlemm管**，受阻致青光眼。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P04-P12,P26"],"diagram_assets":[{"path":"assets/histo_sensory_eye_anterior_p03.webp","caption":"眼前节解剖模式图（P09）：角膜、前房/后房、虹膜、睫状肌与睫状突、悬韧带(睫状小带)及巩膜静脉窦(Schlemm管)","source_page":9}],"payload":{"steps":[{"cue":"角膜如何靠五层分部在无血管下兼顾坚韧透光与快速修复？","reveal":"由前向后为未角化复扁上皮（富游离神经末梢、基底层分裂快）→前界层(Bowman均质无细胞)→占厚9/10的规则正交**胶原板层**基质（无血管色素）→后界层(Descemet厚基膜)→单扁**角膜内皮**（侧面Na⁺-K⁺泵脱水）。","mechanism_tag":"角膜五层与泵脱水"},{"cue":"虹膜基质与双层上皮如何既决定眼色又精细调控瞳孔？","reveal":"虹膜前缘层与基质为富含血管和色素细胞的疏松CT；后表面属视网膜盲部双层上皮，前层特化为**肌上皮细胞**（副交感瞳孔括约肌与交感瞳孔开大肌），后层为立方形**色素上皮**遮挡杂散光。","mechanism_tag":"虹膜基质+肌上皮"},{"cue":"睫状体与脉络膜在眼内分别承担哪两类协同供养与屈光职能？","reveal":"三角状睫状体含外纵/中放/内环**睫状肌**调控小带；内层**非色素上皮**富线粒体/RER/Golgi，合成睫状小带并分泌房水。脉络膜借富含血管与色素的疏松CT供养视网膜外1/3并成暗箱。","mechanism_tag":"睫状体分泌+脉络膜"},{"cue":"房水从生成到回流若在角巩膜缘受阻，为何引爆青光眼？","reveal":"睫状体血管渗透→非色素上皮主动分泌入后房→经瞳孔至前房→经前房角**小梁网**过滤→汇入**Schlemm管**（巩膜静脉窦）；房水生成过多或前房角引流受阻即致眼压骤升压迫视神经（青光眼）。","mechanism_tag":"房水循环与青光眼"}],"takeaway":"角膜透明靠“**规则胶原**+无血管+内皮泵脱水”；眼压稳态靠“睫状突分泌—小梁网—**Schlemm管**”引流平衡。","quiz":{"stem":"眼内手术机械损伤角膜最内层单层扁平上皮后，数小时内角膜基质迅速水肿增厚并失去透明性。这一病变最直接受损的微结构机制是：","options":["角膜内皮侧面Na⁺-K⁺泵向房水主动抽水失灵","角膜基质内血管网通透性骤增引起蛋白漏出","前界层基底部干池停止向浅层分裂补充细胞","睫状体非色素上皮暂停合成睫状小带胶原"],"answer_idx":0,"explain":"角膜基质本来无血管，其透明依赖规则正交胶原板层与相对脱水状态；一旦最内层**角膜内皮**受损，侧面**Na⁺-K⁺-ATPase**将基质水分泵回前房的脱水屏障崩溃，房水顺渗透压涌入基质破坏板层间距而混浊（P05）。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_eye_lens_eyelid_lacrimal","title":"晶状体调节与眼睑泪腺微结构","subject":"histology","syllabus_refs":["syl_histology_046"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"晶状体前上皮于赤道部化生为无核**晶状体纤维**并靠睫状肌调控曲度；**眼睑五层**（Meibomian/Zeis/Moll腺）与浆液性泪腺合护眼表。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P11,P24-P28"],"diagram_assets":[{"path":"assets/histo_sensory_lens_accomm_p03.webp","caption":"晶状体视远与视近调节模式图（P11）：睫状肌松弛拉紧小带使晶状体变扁（上）vs 睫状肌收缩松弛小带使晶状体变凸（下）","source_page":11}],"payload":{"bullets":["晶状体三构筑：外包弹性增厚基膜{{晶状体囊}}；前表面单层立方{{晶状体上皮}}仅{{赤道部}}保留分裂力，向心移行脱核成富{{晶状体蛋白}}的皮质环层与致密晶状体核。","营养调节与病变：晶状体{{无血管无神经}}靠房水营养；视近时{{睫状肌收缩}}前移使{{睫状小带松弛}}、凸度增大；老年弹性下降成老花眼，蛋白变性混浊成{{白内障}}。","玻璃体稳压防脱：填于晶状体与视网膜之间，含{{99%水}}、透明质酸与细胶原原纤维，维持眼压支撑视网膜防脱离，中央可见胚胎血管遗迹{{透明管}}。","眼睑五层微构：外→内为薄皮肤→皮下疏松CT→肌层（骨骼肌{{眼轮匝肌}}与平滑肌睑肌）→致密CT{{睑板}}（嵌分支管泡皮脂腺{{睑板腺}}）→{{睑结膜}}（复层柱状+杯状细胞）；睫毛伴Zeis皮脂腺与Moll汗腺。","泪腺抗菌润眼：属{{浆液性复管泡状腺}}，分泌部腺泡外包{{肌上皮细胞}}协助排泪，泪液富含水电解质、{{溶菌酶}}及分泌型IgA，协同睑板脂膜防蒸发与细菌感染。"],"trap_note":"不要混淆“眼肌收缩方向”：视近物时是睫状肌**收缩**（环径缩小前移）反而使睫状小带**松弛**，晶状体靠自身弹性回弹变凸；而睑板腺（Meibomian腺）本质是特化皮脂腺而非汗腺。","quiz":{"stem":"眼科验光前滴用M胆碱受体阻断剂（如阿托品）松弛睫状肌后，患者短期内出现明显视近物模糊。此时悬韧带与晶状体发生的即时力学改变是：","options":["睫状体前移致悬韧带松弛而晶状体变扁平","睫状体前移致悬韧带拉紧而晶状体变凸圆","睫状体后移致悬韧带拉紧而晶状体变扁平","睫状体后移致悬韧带松弛而晶状体变凸圆"],"answer_idx":2,"explain":"阿托品阻断副交感胆碱能受体令睫状肌**松弛**，睫状体向后外移位从而拉紧睫状小带，将弹性晶状体向四周牵拉变**扁平**（屈光力↓，锁定视远而无法视近即“调节麻痹”）。","remedial_node_id":"histo_eye_cornea_uvea_aqueous"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_eye_retina_relay_fovea","title":"视网膜十层、三元传导与黄斑盲点","subject":"histology","syllabus_refs":["syl_histology_046"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"视网膜借**色素上皮**外屏障与三级神经元链成十层排布，分化出高敏锐**黄斑中央凹**与无感光视神经乳头。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P13-P22"],"diagram_assets":[{"path":"assets/histo_sensory_retina_layers_p05.webp","caption":"视网膜十层光镜HE切片与分层定位（P20）：外侧①色素上皮层至内侧⑩内界膜逐层对应三级神经元与Müller细胞界膜","source_page":20}],"payload":{"bullets":["视部分界与主链：以{{锯齿缘}}分盲部与感光视部；视部外→内为{{色素上皮层 (PEC)}}及三级神经元链：{{视细胞}}→{{双极细胞}}（纵向联络）→{{节细胞}}（轴突聚成视神经）。","PEC五能与脱离面：矮柱状PEC侧具{{紧密连接}}筑血-视网膜外屏障，储{{Vit A}}、吸散光并吞噬脱落{{膜盘}}；顶部突起与视细胞间{{无牢固连接}}，成视网膜剥离好发界面。","双极感光细胞：{{视杆细胞}}外突细长，膜盘游离脱落，含{{视紫红质}}（11-顺视黄醛+视蛋白）司弱光，缺Vit A致夜盲；{{视锥细胞}}膜盘不脱落，三色视色素司强光与色觉。","十层与Müller细胞：外→内排①PEC→②视杆视锥层(外突)→③外界膜→④外核层→⑤外网层→⑥内核层→⑦内网层→⑧节细胞层→⑨神经纤维层→⑩内界膜；{{Müller细胞}}两端界膜撑护全层。","黄斑与盲点对照：{{黄斑中央凹}}仅存{{视锥细胞}}与PEC，双极/节细胞斜向旁让行{{1:1侏儒联络}}最敏锐；鼻侧{{视神经乳头}}无视细胞成盲点，供中央动静脉与神经纤维出入。"],"trap_note":"①P20课件将第②层误标“感光细胞树突”，实为感光细胞**外突**（特化纤毛外节+内节），第⑤外网层亦为感光细胞内突（轴突）而非树突；②视神经纤维在视网膜内**无髓鞘**以维持透明，穿筛板出眼球后才获得少突胶质髓鞘。","quiz":{"stem":"高度近视或眼外伤患者发生“孔源性视网膜脱离”时，光镜下神经视网膜层与外侧支撑组织发生分离的解剖弱点精确位于：","options":["脉络膜玻璃膜与色素上皮基底质膜内褶之间","色素上皮顶部突起与视细胞外节膜盘之间","双极细胞轴突与节细胞树突构成的内网层","Müller细胞外侧突形成的外界膜与外核层之间"],"answer_idx":1,"explain":"色素上皮细胞(PEC)基部借质膜内褶和基膜紧附于脉络膜玻璃膜，侧面亦有紧密连接、中间连接与缝隙连接；唯独**顶部突起**仅伸入视杆/视锥外节之间而**无牢固连接**结构，故最易沿此界面脱离（P15）。","remedial_node_id":"histo_epith_lateral_junctions"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_ear_outer_middle_labyrinth","title":"外耳中耳传音与内耳双迷路液室","subject":"histology","syllabus_refs":["syl_histology_046"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"外中耳凭弹性软骨、三层鼓膜与三听小骨杠杆传声；内耳**骨迷路**(高Na⁺外淋巴)套叠**膜迷路**(血管纹泌高K⁺内淋巴)筑耳蜗三阶。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P30-P31,P38-P40,P45"],"diagram_assets":[{"path":"assets/histo_sensory_ear_labyrinth_p12.webp","caption":"内耳双迷路套叠模式图（P45）：外层骨迷路含外淋巴，内套膜迷路（膜半规管壶腹、椭圆囊、球囊、内淋巴囊、膜蜗管）含内淋巴","source_page":45}],"payload":{"bullets":["外耳构筑：耳廓为{{弹性软骨}}覆薄皮肤；外耳道外1/3软骨部含毛囊、皮脂腺及分泌耳垢的{{耵聍腺}}（特化顶泌汗腺）；{{鼓膜}}呈三层（外复扁上皮+中放射环行胶原层+内单扁黏膜）。","中耳传音与咽鼓管：{{鼓室}}衬单扁/单立上皮，内含{{锤骨、砧骨、镫骨}}杠杆放大振动传至前庭窗；{{咽鼓管}}（骨部+软骨部）衬{{假复层纤毛柱状上皮}}通鼻咽平衡鼓压，亦为中耳炎逆行通道。","内耳双迷路套叠：颞骨岩部骨质隧道为{{骨迷路}}（骨半规管、前庭、耳蜗）；内套封闭膜性囊管称{{膜迷路}}（膜半规管、椭圆囊与球囊、膜蜗管），椭圆囊借内淋巴管通硬脑膜处内淋巴囊。","外/内淋巴离子极化：骨迷路与膜迷路间充满{{外淋巴}}（骨膜血管渗出，通蛛网膜下腔，{{高Na⁺低K⁺}}如ECF）；膜迷路腔充满{{内淋巴}}（蜗管外侧壁{{血管纹}}含血管复层上皮分泌，{{高K⁺低Na⁺}}立+80 mV电位）。","耳蜗与膜蜗管三壁：上壁为双层单扁夹薄CT的{{前庭膜}}；外侧壁为螺旋韧带及{{血管纹}}；下壁为骨螺旋板与{{基底膜}}（膜螺旋板），将耳蜗分为上方{{前庭阶}}、下方{{鼓室阶}}（均含外淋巴）及中央三角形膜蜗管。"],"trap_note":"内耳唯一含有连续毛细血管的上皮并非神经上皮，而是膜蜗管外侧壁的**血管纹**（stria vascularis）；它利用Na⁺-K⁺泵与NKCC1主动向内淋巴富集K⁺，一旦受损即失去**+80 mV**蜗内电位驱动力。","quiz":{"stem":"大剂量静脉注射袢利尿剂（抑制NKCC1共转运体）并损伤膜蜗管外侧壁复层上皮内血管结构后，患者出现急性感音神经性耳聋。此损伤直接崩溃的内耳离子微环境是：","options":["骨膜毛细血管渗入前庭阶与鼓室阶的高Na⁺外淋巴","螺旋缘上皮分泌覆于听毛上方的胶质盖膜糖蛋白","咽鼓管假复层纤毛上皮调节中耳鼓室的空气压强","血管纹主动泌入膜蜗管内的高K⁺内淋巴与蜗内电位"],"answer_idx":3,"explain":"膜蜗管外侧壁螺旋韧带表面的**血管纹**是罕见的含血管复层柱状上皮，专司主动分泌**高K⁺**低Na⁺内淋巴并建立约+80 mV蜗内正电位，为毛细胞静纤毛机械门控K⁺通道内流提供电化学驱动力（P31, P40）。","remedial_node_id":"physio_membrane_transport"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_ear_vestibular_corti_receptors","title":"壶腹嵴、位觉斑与螺旋器换能对比","subject":"histology","syllabus_refs":["syl_histology_046"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"膜迷路三大感受器以胶质覆膜密度与毛细胞纤毛格局分化：**壶腹嵴**测旋转角加速，位觉斑凭**耳石**测直线/重力，螺旋器凭听弦共振换能听觉。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P32-P37,P41-P44"],"diagram_assets":[{"path":"assets/histo_sensory_corti_organ_p11.webp","caption":"螺旋器(Corti器)光镜HE实图与模式图（P42）：内外柱细胞围成内隧道，内毛细胞(1列)与外毛细胞(3–5列)借指细胞支托并紧邻盖膜","source_page":42}],"payload":{"columns":["感受器与部位","上皮细胞、纤毛与盖覆胶质","机械刺激模态与传导通路"],"rows":[["壶腹嵴（膜半规管壶腹）","支持细胞+毛细胞（**1根9+2动纤毛**+数十静纤毛），顶覆糖胺聚糖胶状**壶腹帽**(密度≈内淋巴)","头部**旋转角加速**起止时内淋巴惯性流压偏壶腹帽→静纤毛弯向动纤毛→前庭神经传入"],["位觉斑（椭圆囊/球囊）","平坦支持+毛细胞，顶覆胶质**位砂膜**，表面嵌碳酸钙蛋白晶体**耳石**(密度＞内淋巴)","**直线加减速**及静止**重力**牵拉（椭圆囊测水平/球囊测垂直）致位砂膜偏移刺激纤毛"],["螺旋器（膜蜗管基底膜）","内外柱细胞围内隧道，内外指细胞托**内毛细胞**(1列)与**外毛细胞**(3–5列)；听毛V形无动纤毛","声波→前庭窗→外淋巴波动→**基底膜(听弦)**自蜗底(窄硬高频)至蜗顶(宽柔低频)共振"],["螺旋器盖膜剪切与分工","螺旋缘泌胶质**盖膜**悬覆听毛上方，仅**外毛细胞**较高静纤毛嵌入盖膜","听弦共振使听毛与盖膜剪切弯曲→高K⁺内淋巴内流→**IHC**主司听觉传入，**OHC**主动电放大"]],"quiz":{"stem":"长期高强度高频工业噪声暴露选择性破坏了耳蜗底转的螺旋器毛细胞与基底膜结构，导致患者对4–8 kHz高调音严重失聪而低频对话尚可。其结构力学基础在于：","options":["耳蜗底转螺旋器毛细胞独有9+2动纤毛而顶转缺失","基底膜听弦在蜗底窄硬共鸣高频而向蜗顶增宽感低频","壶腹帽在耳蜗底转密度大于内淋巴而顶转飘浮","血管纹仅分布于耳蜗底转外侧壁而不延及蜗顶"],"answer_idx":1,"explain":"基底膜内放射状排列的胶原样细丝束（听弦）自蜗底向蜗顶逐渐增宽变柔：**蜗底**短窄硬、专门对**高频声波**产生最大共振，蜗顶宽柔则共振低频；此外螺旋器毛细胞仅有V形排列的静纤毛而无动纤毛（P41, P43）。","remedial_node_id":"histo_ear_outer_middle_labyrinth"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_skin_epidermis_layers_barrier","title":"表皮五层演进：角化与渗透屏障","subject":"histology","syllabus_refs":["syl_histology_047"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"表皮角质形成细胞自基底层分裂推移向上逐步累积**张力原纤维**、透明角质颗粒与**板层颗粒**脂质封隙，完成抗磨角化与渗透屏障。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P47-P56"],"diagram_assets":[{"path":"assets/histo_sensory_epidermis_thick_thin_p14.webp","caption":"薄皮与厚皮表皮HE切片分层对照（P56）：厚皮(手掌足底)在颗粒层与极厚角质层之间独具嗜酸折光的透明层(Stratum Lucidum)","source_page":56}],"payload":{"steps":[{"cue":"基底层干细胞如何锚定真皮并启动角质形成细胞更替？","reveal":"单层矮柱/立方形基底细胞胞质富游离核糖体呈**嗜碱性**，含角蛋白丝（张力丝）；以**半桥粒**锚定基膜、以桥粒连邻细胞，活跃分裂并持续向浅层推移分化。","mechanism_tag":"基底层干池+半桥粒"},{"cue":"棘层如何借“桥粒+张力丝”抗机械撕裂并预备屏障物资？","reveal":"多边形棘细胞伸出短棘以大量**桥粒**相扣，粗大张力原纤维束锚附于桥粒胞质面抵御摩擦；高尔基体始生成卵圆形膜被**板层颗粒**（内含平行明暗板层的糖脂与固醇）。","mechanism_tag":"桥粒铆接+板层颗粒"},{"cue":"颗粒层释放哪两类核心颗粒同时达成角化与水密防水？","reveal":"梭形细胞核器渐退化，强嗜碱无膜**透明角质颗粒**（富组氨酸蛋白）裹缠角蛋白丝聚为角质前体；同时板层颗粒胞吐向胞间隙填充糖脂固醇形成膜状封闭层，构筑表皮**渗透屏障**。","mechanism_tag":"透明角质+脂质封隙"},{"cue":"透明层与角质层怎样在薄/厚皮分化并最终脱落？","reveal":"仅掌跖厚皮在颗粒层浅面见无核嗜酸折光的**透明层**；**角质层**由数层至数十层无核扁平死角质细胞构成，角蛋白丝浸埋于均质蛋白基质且胞膜增厚、间隙充脂，近表层桥粒解体脱屑。","mechanism_tag":"厚皮透明层+脱屑"}],"takeaway":"表皮防渗靠**板层颗粒**脂质胞吐，抗磨靠角蛋白丝—透明角质交联—增厚角化胞膜与**桥粒**阶梯脱落。","quiz":{"stem":"寻常型天疱疮患者体内自身抗体专一攻击棘细胞表面的桥粒芯糖蛋白，而大疱性类天疱疮抗体则攻击基底细胞底面的半桥粒成分。两者在皮肤活检中呈现的病理水疱定位差异是：","options":["天疱疮呈透明层下脱屑裂隙而类天疱疮呈角质裂","天疱疮呈表皮真皮交界水疱而类天疱疮呈棘层内疱","天疱疮因板层颗粒溶脂起疱而类天疱疮因缺角蛋白","天疱疮呈棘层松解表皮内疱而类天疱疮呈表皮下疱"],"answer_idx":3,"explain":"棘层角质形成细胞靠密集桥粒连接张力原纤维维系细胞间粘附，故抗桥粒抗体引起**棘层松解**形成表皮内水疱；基底层借**半桥粒**锚定真皮基膜，受损则整个表皮整片剥离形成表皮下水疱（P50–P51）。","remedial_node_id":"histo_epith_lateral_junctions"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_skin_nonkeratinocytes_comparison","title":"表皮三大非角质形成细胞鉴别","subject":"histology","syllabus_refs":["syl_histology_047"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"表皮嵌入三类无桥粒非角质形成细胞：**黑素细胞**运黑素防UV，**朗格汉斯细胞**含Birbeck颗粒司免疫呈递，梅克尔细胞司触觉与APUD。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P57-P61"],"diagram_assets":[{"path":"assets/histo_sensory_epidermis_cells_p15.webp","caption":"表皮组成细胞模式图（P57）：角质形成细胞阶梯演进，伴棘层蓝染树枝状朗格汉斯细胞、基底层黑素细胞与连感觉末梢的梅克尔细胞","source_page":57}],"payload":{"columns":["非角质细胞与起源","定位与光电镜鉴别特征","核心功能与临床病理关联"],"rows":[["黑素细胞 (神经嵴外胚层)","散于基底细胞间及毛球；EM富RER/Golgi，含**黑素小体**(酪氨酸酶)→黑素颗粒；无桥粒","将酪氨酸转为黑素经突起**胞吐转运**入角质细胞核上方防UV；缺酶致白化病，恶变成黑素瘤"],["朗格汉斯细胞 (骨髓单核谱系)","散于棘层；ATP酶组化显树枝状；EM核弯曲低密度无角蛋白丝，特含杆/球拍状**Birbeck颗粒**","表皮专职**抗原提呈**(APC)，表达CD1a/MHC-II，摄取加工抗原迁入淋巴结激活T细胞"],["梅克尔细胞 (表皮基底/APUD)","少见，居毛囊附近基底层；EM核小不规则，胞质基部含膜被**致密核芯小泡**与神经成类似突触","作为慢适应**机械感受器**兼弥散神经内分泌(**APUD**)细胞；恶变形成Merkel细胞癌"]],"quiz":{"stem":"长期强紫外线照射或外用免疫抑制剂后，表皮棘层内一群胞质透亮、缺乏桥粒与角蛋白丝、且电镜下特含“球拍状纵向致密线颗粒”的树枝状细胞锐减。随之最先显著削弱的皮肤防线是：","options":["表皮局部接触性抗原摄取与T细胞免疫应答","角质形成细胞核上方遮挡紫外线的黑素护盾","基底细胞向浅层分化补充渗透屏障脂质颗粒","毛囊附近皮肤对持续精细机械触压觉的感知"],"answer_idx":0,"explain":"题干描述的特征（居表皮棘层、无桥粒无角蛋白丝、电镜具杆状或球拍状**Birbeck颗粒**的树枝状细胞）正是源自骨髓单核谱系的**朗格汉斯细胞**，它专职摄取处理皮内侵入抗原并迁移至引流淋巴结呈递给T细胞（P60）。","remedial_node_id":"histo_lct_macrophage"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_skin_dermis_appendages_nail","title":"真皮双层与毛、皮脂腺、汗腺及甲","subject":"histology","syllabus_refs":["syl_histology_047"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"真皮由浅疏松**乳头层**（营养/指纹/触觉小体）与深致密**网织层**（弹性抗拉/环层小体）支撑毛囊、全浆皮脂腺、双型汗腺及指(趾)甲。","source_slides":["20260928眼耳皮肤（基础医学分论）.pdf#P62-P70","《基础医学分论》组胚教学大纲 · syl_histology_047"],"diagram_assets":[{"path":"assets/histo_sensory_skin_glands_p17.webp","caption":"皮肤附属腺体切片与立体定位（P67）：(a)开口毛囊上段、腺细胞泡状解体排脂的皮脂腺 vs (b)深层盘曲的局泌小汗腺","source_page":67}],"payload":{"bullets":["真皮双层与皮下：浅层{{乳头层}}（疏松CT突成真皮乳头，扩表皮营养面、决指纹并含{{触觉小体}}）；深层{{网织层}}（不规则致密CT含弹性胶原网与{{环层小体}}）；下接脂肪与疏松CT构成的{{皮下组织}}。","毛与立毛肌：毛根外包上皮与CT两鞘成{{毛囊}}，下端融合膨大为{{毛球}}（含增殖角化的{{毛母质细胞}}与黑素细胞），底突入富血管神经的{{毛乳头}}；钝角侧平滑肌{{立毛肌}}受交感收缩使毛竖立。","皮脂腺全浆分泌：位于毛囊与立毛肌间，囊状腺泡周边干细胞向心推移充满脂滴、核固缩后{{整个腺细胞解体}}连脂滴成{{皮脂}}排入毛囊上段，筑皮脂膜并易阻塞诱发痤疮。","两型汗腺对比：{{局泌汗腺(小汗腺)}}单曲管状遍布全身，浅染腺细胞+{{肌上皮细胞}}排稀汗，双层导管重吸收Na⁺Cl⁻调体温；{{顶泌汗腺(大汗腺)}}局限于腋窝乳晕等，腔大嗜酸细胞开于毛囊，菌解致腋臭。","指(趾)甲生发构筑：硬角化上皮板{{甲体}}覆于缺颗粒/角质层的{{甲床}}上；近端甲根深方增厚生发上皮称{{甲母质}}，持续分裂角化向前推移使甲生长，近端透显半月形白色{{甲半月}}。"],"trap_note":"皮脂腺是人体最经典的**全浆分泌**腺（整个腺细胞死亡解体化为皮脂）；而**局泌汗腺**（小汗腺）经肌上皮收缩排出低渗汗液并借双层排泄导管回收Na⁺Cl⁻，在囊性纤维化时该导管氯通道障碍致汗液盐度异常飙高。","quiz":{"stem":"比较人体皮肤内几种主要外分泌附属腺体，在青春期雄激素升高时因腺体导管阻塞、富含中性脂滴的细胞崩解碎片潴留于毛囊漏斗部从而最常诱发寻常痤疮的腺体机制是：","options":["顶泌大汗腺经出胞释放高蛋白乳状液入毛囊","局泌小汗腺借肌上皮挤压排泄水与尿素盐类","皮脂腺中心腺细胞充满脂滴固缩解体全浆排脂","甲母质基底细胞异常角化堆积阻断甲沟引流"],"answer_idx":2,"explain":"皮脂腺位于毛囊与立毛肌之间，导管多开口于毛囊上段，采用**全浆分泌**：周边干细胞不断增殖向中心推移、充满脂滴并核固缩解体，连同胞体碎片一起排出皮脂，雄激素分泌亢进或角化阻塞导管即发炎成痤疮（P68）。","remedial_node_id":"histo_epith_gland_classification"}},"added_at":"2026-11-18T11:59:36+08:00"},{"id":"histo_embryo_gametogenesis_comparison","title":"精卵发生与减数分裂不对称对比","subject":"histology","syllabus_refs":["syl_histology_048"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"精卵均经减数分裂降为单倍体，但发生时序、**休止节点**、胞质分配与变形过程迥异。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P14-P27"],"diagram_assets":[{"path":"assets/histo_embryo_sperm_ultrastructure_p015.webp","caption":"成熟精子超微模式图：顶体（高尔基体特化）、颈段中心体、中段线粒体鞘及尾部9+2轴丝与横切面","source_page":15}],"payload":{"columns":["比较维度","精子发生 (睾丸生精小管)","卵子发生与卵泡发育 (卵巢)"],"rows":[["起始与干细胞","青春期起由紧贴基膜的**A/B型精原细胞**(46,XY)持续增殖分化","胚胎期卵原细胞分化为初级卵母细胞后总量定型，青春期周期性募集"],["减数分裂休止","初级(4n)→次级(2n)→精子细胞(1n)连续完成，无长期**减数分裂休止**","初级卵母长期停滞于**MI前期**；排卵前36–48h完成MI并停于MII中期（受精才完成）"],["胞质分配与产物","均等分裂：1个初级精母→**4个等大精子细胞**(23,X或23,Y)","极度不均等：1个初级卵母→**1个成熟卵细胞**(23,X)保留胞质与皮质颗粒+极体"],["特化与外周构造","高尔基体成**顶体**(含水解酶)、中心粒生9+2轴丝、线粒体聚成中段鞘","与卵泡细胞共泌糖蛋白**透明带**(ZP1–3)，外围高柱状卵泡细胞聚成放射冠与卵丘"]],"quiz":{"stem":"某先天性纤毛不动综合征男性患者生精细胞减数分裂正常且精子数量充足，却合并反复呼吸道感染与精子完全丧失自主游动能力，最可能受累的精子形成结构及共同超微缺陷是：","options":["头部顶体帽形成受阻：高尔基体囊泡无法融合聚积酶原","中段线粒体鞘排列紊乱：多余胞质未能顺畅脱离排出","尾部轴丝运动功能丧失：9+2微管动力蛋白臂结构缺失","细胞核浓缩固缩异常：精蛋白未能正常取代组蛋白聚拢"],"answer_idx":2,"explain":"**精子形成**阶段中心粒迁至核尾侧生出**9+2轴丝**，与呼吸道纤毛共用同一套微管-动力蛋白臂滑动机械（P15、P19）；动力蛋白臂基因缺陷同步破坏呼吸道排痰与精子前向摆动。其余三项虽属精子形成变化，但不解释呼吸道纤毛同步受损。","remedial_node_id":"histo_epith_apical_microvilli_cilia"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_capacitation_acrosome","title":"精子获能与顶体反应级联","subject":"histology","syllabus_refs":["syl_histology_049"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"精子先在女性生殖道脱除糖蛋白去能膜实现**获能**，遇卵透明带才触发**顶体反应**释酶。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P28-P34","胚胎学总论（基础医学分论，2025）(1).pptx#P37"],"diagram_assets":[{"path":"assets/histo_embryo_acrosome_reaction_p028.webp","caption":"图2-3 人精子顶体反应模式图：质膜与顶体外膜多点融合形成杂合膜泡，释放顶体酶并暴露顶体内膜","source_page":28}],"payload":{"steps":[{"cue":"附睾内成熟且具备运动能力的精子，射出后为何仍不能立即穿透卵子？","reveal":"精子表面覆盖来自附睾与精浆的**糖蛋白去能因子**；须进入**女性生殖道**（子宫与输卵管）经分泌物脱除该表面被膜才获能。","mechanism_tag":"去抑制获能"},{"cue":"脱除表面糖蛋白膜完成获能后，精子的代谢与鞭毛运动发生何种跃迁？","reveal":"获能后精子膜流动性升高、**代谢明显活化**并转为**超激活运动**，同时暴露表面受体以准备识别卵周放射冠与透明带。","mechanism_tag":"代谢超激活"},{"cue":"获能精子接触放射冠与透明带后，顶体双层膜如何完成释酶穿障？","reveal":"精子质膜与**顶体外膜**多点融合起泡形成**杂合膜泡**并破裂，释放透明质酸酶与顶体蛋白酶溶解间质与透明带，最终暴露顶体内膜。","mechanism_tag":"顶体膜融合"}],"takeaway":"**先女性生殖道获能、后卵周顶体反应**是严格单向时序：获能解除表面糖蛋白封闭，顶体反应靠膜融合释酶打通透明带。","quiz":{"stem":"体外受精实验中，若将刚自雄性附睾尾部取出的活动精子未经过获能液预处理，直接与结构完整的卵冠丘复合体共孵育，最先卡滞的生理环节是：","options":["精子无法完成二次减数分裂降至单倍体","顶体表面仍被糖蛋白封闭而不能触发顶体反应","卵母细胞提前排出皮质颗粒阻断原核相向移动","受精卵在卵周腔内提前出现体积不增的快速卵裂"],"answer_idx":1,"explain":"附睾精子虽已成熟并完成减数分裂，但其头部质膜覆盖**糖蛋白去能被膜**（P34、P37）；未经**获能**脱膜便无法应答卵周信号发生顶体反应并释放水解酶穿过放射冠与透明带（P28–P29）。","remedial_node_id":"histo_embryo_gametogenesis_comparison"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_fertilization_block","title":"受精过程、防多精锁与意义","subject":"histology","syllabus_refs":["syl_histology_050"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"输卵管壶腹部24h内完成受精；**皮质与透明带反应**灭活ZP3防多精，唤醒MII并恢复二倍体。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P27-P37"],"diagram_assets":[{"path":"assets/histo_embryo_fertilization_phases_p029.webp","caption":"受精三阶段与皮质反应模式图：(1)-(3)获能精子穿放射冠与透明带，(4)质膜融合，(5)皮质颗粒胞吐阻止多精","source_page":29}],"payload":{"steps":[{"cue":"正常受精发生于何时空窗口，精子与卵子如何实现精准识别穿越？","reveal":"多在排卵后12h（极限24h内）于**输卵管壶腹部**完成；获能精子借顶体释酶穿过放射冠，识别透明带糖蛋白受体**ZP3**并溶穿透明带。","mechanism_tag":"壶腹部穿障"},{"cue":"首枚精子进入卵周腔并与卵膜融合后，卵子如何阻断第二枚精子入卵？","reveal":"卵膜下溶酶体样**皮质颗粒**瞬时胞吐至卵周间隙（皮质反应），酶解改造透明带使**ZP3受体失活**变硬（透明带反应），锁死单精受精。","mechanism_tag":"单精阻断锁"},{"cue":"精子核、质入卵并触发皮质反应后，停滞的次级卵母细胞如何完成结局？","reveal":"次级卵母细胞立即完成**第二次减数分裂**排出第2极体成成熟卵细胞；随后雌、雄原核形成并**核膜溶解融合**为二倍体受精卵。","mechanism_tag":"MII重启融合"},{"cue":"全过程历时约24小时完成受精，在遗传与个体发育上确立哪四大生物学意义？","reveal":"①启动新个体产生与物种延续；②恢复46条二倍体；③由精子(X/Y)决定**新个体遗传性别**；④双亲重组赋予**新变异特征**。","mechanism_tag":"四大遗传意义"}],"takeaway":"皮质颗粒胞吐引发**透明带ZP3失活**，既锁死单精受精，又同步唤醒卵子完成**MII分裂**并重建46条二倍体基因组。","quiz":{"stem":"若因基因突变导致次级卵母细胞皮质颗粒胞吐障碍（皮质反应缺失），在正常受精过程中最直接诱发的致命病理后果是：","options":["透明带ZP3持续保持活性引发多精入卵与三倍体流产","精子顶体外膜无法融合致使完全不能释放透明质酸酶","第1极体滞留卵周间隙并直接反向融合形成双核原核","输卵管平滑肌停止收缩致使受精地点退回至宫颈管内"],"answer_idx":0,"explain":"首精融合后卵膜下**皮质颗粒**释放至卵周间隙引发透明带反应，使精子受体糖蛋白**ZP3**变性失活（P33、P35）；一旦皮质反应缺失，其余获能精子将继续穿透透明带导致多精入卵与异常多倍体胚胎死亡。","remedial_node_id":"histo_embryo_capacitation_acrosome"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_cleavage_blastocyst_twins","title":"卵裂、桑椹胚、胚泡与孪生胎膜","subject":"histology","syllabus_refs":["syl_histology_051"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"透明带内行总体积不变的**卵裂**，第4天积液成**胚泡**；胚胎分离时机决定单卵孪生胎膜格局。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P38-P43","胚胎学总论（基础医学分论，2025）(1).pptx#P78"],"diagram_assets":[{"path":"assets/histo_embryo_cleavage_blastocyst_p040.webp","caption":"第1周卵裂与胚泡形成模式图：原核融合→2/4/8细胞期→桑椹胚→含内细胞群、胚泡腔与滋养层的胚泡","source_page":40},{"path":"assets/histo_embryo_twin_membranes_p078.webp","caption":"双卵孪生与单卵孪生形成机制：卵裂球、内细胞群或原条分离对应的胎盘与羊膜囊格局","source_page":78}],"payload":{"bullets":["卵裂动力学特征：受精卵在{{透明带}}包裹下快速有丝分裂产生{{卵裂球}}，细胞数倍增但单个体积{{变小}}（2细胞18–36h、4细胞36–48h、8细胞48–60h）。","桑椹胚与胚泡建立：{{12–16个}}卵裂球组成桑椹胚入宫腔；第4天细胞达百个并积液形成{{胚泡腔}}，外周一层扁平细胞称{{滋养层}}（胎膜胎盘前体）。","内细胞群（ICM）：贴附胚泡一极滋养层内面的细胞团即{{内细胞群}}，是{{胚体形成}}原基，具有分化为全身各类细胞的{{多能性}}（胚胎干细胞来源）。","双卵 vs 卵裂球分离：双卵孪生由双卵双精受精而成，必为{{双胎盘双羊膜}}；单卵孪生若在{{卵裂球期}}分离并各自成胚泡，仍形成{{双胎盘(或融合)双羊膜}}。","中晚期单卵分离：若{{内细胞群分离}}，共用滋养层而各自围成羊膜，呈{{单胎盘(单绒)双羊膜}}；若{{原条分离}}，则共享胎盘与羊膜呈{{单绒单羊}}（不完全分离致联体）。"],"trap_note":"临床产前超声判别单卵孪生绒毛膜性关键看分离时点：**卵裂球期**分离为双绒双羊，**内细胞群期**分离才成单绒双羊，并非所有单卵双胎都共用胎盘或羊膜。","quiz":{"stem":"早孕期超声提示某单卵双胎妊娠“共享同一个胎盘，但两胎儿之间存在明确的双层羊膜分隔（单绒毛膜双羊膜囊）”，据此可反推此次胚胎分离发生在：","options":["双枚独立成熟卵子分别在左右输卵管完成受精","第3周初三胚层胚盘原条已经分化形成之后","2至4细胞卵裂球期尚未形成共同滋养层之时","第4至8天胚泡形成后内细胞群一分为二之际"],"answer_idx":3,"explain":"当胚泡已形成外周完整的单层**滋养层**（未来共用单个胎盘）而内部**内细胞群**一分为二时，两个胚盘各自诱导独立羊膜腔，从而形成单绒毛膜双羊膜囊格局（P78）。卵裂球期分离呈双绒双羊，原条期分离呈单绒单羊。","remedial_node_id":"histo_embryo_fertilization_block"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_implantation_bilaminar","title":"胚泡植入、蜕膜反应与二胚层","subject":"histology","syllabus_refs":["syl_histology_052"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"第5–12天胚泡脱透明带埋入分泌期内膜引发**蜕膜反应**，内细胞群分化上/下二胚层与双囊。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P44-P50"],"diagram_assets":[{"path":"assets/histo_embryo_implantation_bilaminar_p045.webp","caption":"图22-7 植入过程（第7–13天）：滋养层分化为细胞/合体滋养层，内细胞群分化上/下胚层与羊膜腔、卵黄囊","source_page":45}],"payload":{"bullets":["植入三条件与时空：需{{透明带消失}}、胚泡适时入宫腔及子宫内膜处于{{分泌期}}；约在受精后{{5/6–11/12天}}植入{{子宫体部或底部}}（常见后壁）。","滋养层双层分化：接触内膜一极的滋养层分化为内层单核{{细胞滋养层}}，以及外层无细胞界限、分泌水解酶侵蚀内膜的{{合体滋养层}}（出现陷窝接母血）。","子宫内膜蜕膜反应：受胚泡刺激，内膜增厚、血管与腺体分泌旺盛且基质细胞肥大成{{蜕膜}}，依部位分胚胎深面{{底蜕膜}}、表面{{包蜕膜}}与余部{{壁蜕膜}}。","二胚层胚盘（第2周）：内细胞群分化为背侧柱状{{上胚层}}（近新现{{羊膜腔}}）与腹侧立方{{下胚层}}（近{{卵黄囊}}）；第13天现胚外中胚层、胚外体腔与体蒂。","异位妊娠谱系：胚泡滞留于子宫腔外着床称{{宫外孕}}，以{{输卵管（壶腹部占54%）}}最常见，亦偶见卵巢或腹腔；宫内着床近宫颈内口则致{{前置胎盘}}。"],"trap_note":"卵裂期若**透明带过早消失**，胚泡会在抵达子宫前就地侵蚀输卵管黏膜造成危险的**输卵管妊娠**；上胚层并非仅成外胚层，而是下周三胚层共同母源。","quiz":{"stem":"某育龄期女性因慢性输卵管炎致管腔纤毛摆动迟缓且黏膜粘连，胚泡受阻滞留并在受精后第6天即就地脱去透明带，最易直接导致下列哪种产科急症或异常？","options":["滋养层过度增生退变为葡萄状水泡块（葡萄胎）","胎盘紧邻宫颈内口覆盖出口形成中央性前置胎盘","合体滋养层就地侵蚀输卵管壁诱发输卵管异位妊娠","胚泡无法形成细胞滋养层而完全停止蜕膜样改变"],"answer_idx":2,"explain":"胚泡脱去透明带后，其**合体滋养层**即刻具备分泌蛋白酶溶解黏膜上皮与固有层的侵蚀力（P44–P46）；若因输卵管炎运行受阻而在管腔内提前脱离透明带，将就地植入输卵管壁（以壶腹部最常见，P48）形成**输卵管异位妊娠**并引发大出血风险。","remedial_node_id":"histo_embryo_cleavage_blastocyst_twins"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_gastrulation_neurulation","title":"原肠形成、脊索与神经管神经嵴","subject":"histology","syllabus_refs":["syl_histology_052"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"第3周**上胚层**经原条原结内迁重建内/中/外三胚层，**脊索诱导**神经管与神经嵴分化。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P51-P60"],"diagram_assets":[{"path":"assets/histo_embryo_gastrulation_neurulation_p056.webp","caption":"图22-13 第17–21天中胚层早期分化及神经管形成：脊索上方神经板凹陷闭合成管，中胚层三区分离","source_page":56}],"payload":{"steps":[{"cue":"第3周初扁平的二胚层胚盘如何确立头尾方向与中轴极性？","reveal":"上胚层细胞向尾侧中线迁移增殖形成**原条**（头端膨大成**原结**，中线凹为原沟），从而确立胚盘头尾与左右轴线。","mechanism_tag":"原条定轴"},{"cue":"三胚层的内、中、外胚层是否分别来自下胚层与上胚层？","reveal":"全部源自**上胚层**：首批经原条下迁的细胞**置换下胚层**形成内胚层，次批填于两层间形成中胚层，背面剩余上胚层改称外胚层。","mechanism_tag":"上胚层三向分化"},{"cue":"原结向头端迁出的细胞形成何中轴结构，如何触发胚胎诱导？","reveal":"原结细胞前迁形成**脊索**；脊索释放诱导信号（如头蛋白/卵泡抑制蛋白）**诱导**上方外胚层增生变厚形成神经板。","mechanism_tag":"脊索诱导神经板"},{"cue":"神经板折合闭合如何分出CNS与PNS，前后闭合障碍致何畸形？","reveal":"神经褶第3周末愈合成**神经管**(CNS)并游离出**神经嵴**(PNS)；前神经孔(25d)未闭致无脑儿，后神经孔(27d)未闭致脊柱裂。","mechanism_tag":"神经管双孔闭合"}],"takeaway":"**上胚层是三胚层唯一母源**；脊索作为中轴组织者诱导神经管（CNS）与神经嵴（PNS）分离，前/后神经孔按25/27天先后闭合。","quiz":{"stem":"某新生儿出生后腰骶部正中线可见脊膜膨出伴脊髓外露（开放性脊柱裂），而颅骨穹窿及大脑半球发育正常。该畸形最可能源于胚胎第4周哪一关键发育节点受阻？","options":["胚胎第25天前神经孔未按期完成背侧闭合","胚胎第27天后神经孔未按期完成背侧闭合","胚胎第18天原条细胞未能向下置换下胚层","胚胎第13天胚胎腹侧泄殖腔膜未能及时形成"],"answer_idx":1,"explain":"神经褶从颈区向头尾两端双向拉链式愈合形成神经管（P58–P59）：头端前神经孔约第25天闭合，未闭导致无脑儿；尾端**后神经孔约第27天闭合**，未闭则导致腰骶部**脊柱裂**。大脑发育正常提示前神经孔已正常闭合。","remedial_node_id":"histo_embryo_implantation_bilaminar"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_germ_layer_derivatives","title":"三胚层及神经嵴分化去向总览","subject":"histology","syllabus_refs":["syl_histology_052"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"外胚层、**神经嵴**、三部中胚层与内胚层按拓扑分化，直接筑就四大基本组织与感官皮肤。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P57-P65"],"payload":{"columns":["胚层/亚区","早期分区标志","主要衍生组织与器官结构","组胚与病理临床枢纽"],"rows":[["表面外胚层","背侧非神经外胚层与基板","**表皮及其附属器**(毛/甲/汗皮脂腺)、晶状体、内耳膜迷路、牙釉质","筑成皮肤复层角化屏障与部分感官上皮"],["神经外胚层","神经板→神经管与视泡","**中枢神经系统**(脑脊髓神经元、星形/少突/室管膜)、**视网膜**、松果体/神经垂体","唯**小胶质细胞**例外（源于中胚层单核细胞）"],["神经嵴 (第四胚层)","神经褶背外侧迁出细胞","**PNS神经节**、施万与卫星细胞、**肾上腺髓质**、黑素细胞及头面部分骨软骨","迁移受阻致先天性巨结肠或黑素缺失谱系"],["轴旁与间介中胚层","42–44对体节 + 生肾索","体节分化**皮肤真皮**、中轴骨骼与骨骼肌；间介中胚层发育为**泌尿生殖系统**","体节自头向尾每天3对，第5周出齐"],["侧板与胚内间充质","体壁/脏壁中胚层+胚内体腔","浆膜**间皮**、血管内皮、血细胞、固有CT/软骨/骨、**心肌与平滑肌**、肾上腺皮质","间皮、内皮、CT与肌组织专出中胚层"],["内胚层","头/尾/侧褶卷入成原始消化管","前/中/后肠演化为**消化呼吸管上皮**、肝胰实质腺上皮、甲状腺/甲状旁腺及膀胱上皮","主导内脏实质上皮，与脏壁中胚层共建管壁"]],"quiz":{"stem":"下列正常组织细胞群中，虽然位于中枢神经系统脑实质或表皮基底层内，却并非源自外胚层（含神经管与神经嵴），而是起源于中胚层造血/单核谱系的是：","options":["散居于大脑灰质与白质中的静息及活化小胶质细胞","定植于皮肤表皮基底层间分泌黑素的树枝状黑素细胞","构筑外周有髓神经纤维髓鞘与基膜管的施万细胞","分布于中枢室管膜旁形成髓鞘板层的少突胶质细胞"],"answer_idx":0,"explain":"大脑中的**小胶质细胞**并非神经外胚层产物，而是唯一源自**中胚层骨髓单核细胞**迁移定植于CNS的巨噬谱系（呼应神经组织概论节点）；黑素细胞与施万细胞源自外胚层神经嵴，少突胶质细胞源自神经管。","remedial_node_id":"histo_embryo_gastrulation_neurulation"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_membranes_placenta_barrier","title":"胎膜演化、绒毛分级与胎盘屏障","subject":"histology","syllabus_refs":["syl_histology_052"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"五大胎膜护育胚体；**丛密绒毛膜**与**底蜕膜**合建胎盘，借四层胎盘膜行不混血交换与内分泌。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P67-P77"],"diagram_assets":[{"path":"assets/histo_embryo_placenta_structure_p076.webp","caption":"胎盘切面结构模式图：胎儿面羊膜与丛密绒毛膜（连脐带2动1静）、母体面底蜕膜与胎盘隔、绒毛间隙母血","source_page":76}],"payload":{"bullets":["羊膜与卵黄囊/尿囊：{{羊膜}}围腔含羊水1000–1500mL（早由羊膜细胞泌、晚自{{胎儿尿液}}，\u003e2000过多/\u003c500过少）；{{卵黄囊}}胚外中胚层生最早{{血岛}}与原始生殖细胞；{{尿囊}}成脐正中韧带与脐血管。","脐带与胎盘构成：{{脐带}}(约55cm)包绕体蒂及闭锁卵黄蒂/尿囊，含{{2根脐动脉+1根脐静脉}}；6周后朝向底蜕膜的{{丛密绒毛膜}}与{{底蜕膜}}合成胎盘（朝向包蜕膜退化为平滑绒毛膜）。","绒毛干三级演化：2周末{{初级绒毛干}}（细胞+合体滋养层）→3周迁入胚外中胚层成{{次级绒毛干}}→中胚层分化出血管通连胚体即{{三级绒毛干}}；滋养层过度水泡样增生致{{葡萄胎}}。","胎盘屏障四层结构：母血入绒毛间隙浴绒毛，早期交换须穿①{{合体滋养层}}②{{细胞滋养层及基膜}}③绒毛结缔组织④{{绒毛毛细血管内皮及基膜}}；妊娠晚期②消失且合体变薄以提效。","胎盘三大功能：行母胎{{物质交换}}（两血不混流）、免疫及微生物{{屏障作用}}；{{合体滋养层}}分泌{{HCG}}、绒毛膜促乳腺生长激素及{{孕激素/雌激素}}维持妊娠。"],"trap_note":"母血与胎血在绒毛间隙**绝不直接混合**；脐带血管血流氧合性质与体循环相反：**2条脐动脉**运回乏氧血，1条脐静脉运入富氧血。","quiz":{"stem":"妊娠足月（晚期）胎盘与妊娠早期相比，物质转运效率大幅提升的同时部分病原体与药物也更易透入胎儿血循环，其关键形态学演变基础在于胎盘屏障中：","options":["绒毛毛细血管内皮基膜完全崩解形成开放血窦","底蜕膜胎盘隔发生坏死致使母血直接灌入脐静脉","绒毛中轴结缔组织增生肥厚取代所有血管内皮","细胞滋养层基本消失且合体滋养层显著变薄紧贴血管"],"answer_idx":3,"explain":"妊娠早期胎盘屏障含完整四层（合体滋养层、细胞滋养层及基膜、绒毛结缔组织、毛细血管内皮及基膜，P77）；随着妊娠推进至足月，**细胞滋养层消失**且**合体滋养层变薄**，绒毛毛细血管贴近表面使扩散距离极度缩短、交换提效而屏障微弱化。","remedial_node_id":"histo_embryo_implantation_bilaminar"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_stages_teratogen_period","title":"胚胎三期外形、胚龄与致畸敏感期","subject":"histology","syllabus_refs":["syl_histology_053"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"临床月经龄比受精龄多14天；第3–8周**胚期**器官集中塑形（8周末初具人形），是**致畸最敏感期**。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P01-P04","胚胎学总论（基础医学分论，2025）(1).pptx#P64-P66"],"diagram_assets":[{"path":"assets/histo_embryo_teratogen_critical_period_p001.webp","caption":"胚胎三阶段致畸敏感度时序图：0–2周“全或无”致死、3–8周器官发生致畸高峰、9–38周敏感度下降","source_page":1}],"payload":{"columns":["发育阶段","受精龄 (临床月经龄+14d)","核心外形与建构特征","致畸敏感度与临床转归"],"rows":[["胚前期 (Preembryonic)","受精 → 第2周末 (孕2–4周)","卵裂成胚泡、植入子宫内膜并建立**二胚层胚盘**","常呈**“全或无”效应**：重度打击致流产死亡，轻损多可代偿修复"],["胚期 (Embryonic)","第3周 → 第8周末 (孕5–10周)","三胚层卷折成胚体；**第8周末**头大尾小、颜面四肢外阴可见、**初具人形**","**致畸最敏感期**：各器官原基集中分化，致畸物极易诱发重大结构畸形"],["胎期 (Fetal)","第9周 → 第38周末 (孕11–40周)","器官系统持续生长与**功能成熟**（受精龄266天 / 临床预产期按月经龄**280天**计）","重大形态畸形敏感度**递减**，但脑、生殖等仍易受功能性发育损伤"]],"quiz":{"stem":"某孕妇于末次月经第1天算起“停经第7周（受精龄第5周）”不慎持续服用明确强致畸药物。产前评估其胎儿结局远比“受精后第1周”服药更易存活却残留心脏或肢体严重畸形，其发育生物学根源在于此时正处于：","options":["受精后0–2周胚前期未植入阶段的典型全或无致死窗口","受精后9–38周胎期各器官仅行体积扩增的成熟窗口","受精后3–8周胚期三胚层器官原基集中建构的高敏窗口","卵母细胞尚未完成首次减数分裂的原始卵泡休止窗口"],"answer_idx":2,"explain":"临床月经龄比实际**受精龄**多14天（P03），停经第7周对应受精龄第5周，正落入**第3–8周胚期**器官发生高峰（P01、P04）；此时各系统原基迅速塑形，受致畸物打击极易留存重大结构畸形。而0–2周多呈“全或无”致死，9–38周以功能成熟为主。","remedial_node_id":"histo_embryo_gastrulation_neurulation"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"histo_embryo_reproductive_engineering","title":"生殖工程、核移植与多能干细胞","subject":"histology","syllabus_refs":["syl_histology_054"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"生殖工程人工干预配子受精与细胞核记忆，涵盖辅助生殖(IVF/ICSI)、**PGT活检**与**核移植重编程**。","source_slides":["胚胎学总论（基础医学分论，2025）(1).pptx#P05","胚胎学总论（基础医学分论，2025）(1).pptx#P09","胚胎学总论（基础医学分论，2025）(1).pptx#P43"],"payload":{"columns":["技术或细胞系","操作原理与干预环节","发育潜能与遗传特征","临床适应证与伦理/风险"],"rows":[["IVF-ET 与 ICSI","体外获能自然受精(IVF) vs **单精子胞质注射**(ICSI)入MII卵母，养至囊胚移植","ICSI人工绕开顶体反应、穿透放射冠与**ZP3透明带识别**","IVF主治输卵管性不孕；ICSI主治重度少弱畸精症或受精障碍"],["PGT (植入前遗传检测)","囊胚期精准穿刺活检数枚**滋养层细胞**行染色体或单基因检测","保留**内细胞群(ICM)**完整不损胚体，筛选整倍体无病胚泡","阻断单基因遗传病与非整倍体复发流产"],["SCNT (体细胞核移植)","将供体二倍体**体细胞核**移入去核MII卵母细胞，靠卵胞质因子重编程","重建**全能性**胚胎（生殖性克隆→完整个体；治疗性克隆→匹配ESC）","证实卵胞质可擦除终末分化表观记忆；人类生殖性克隆严禁"],["ESC vs iPSC","分离培养胚泡**内细胞群**(ESC) vs 转录因子**重编程体细胞**(iPSC)","皆具体外无限扩增与分化三胚层**多能性**，iPSC无需破坏人类胚泡","直连病理再生修复；若残存未分化细胞植入体内有致**畸胎瘤**风险"]],"quiz":{"stem":"临床开展植入前遗传学检测（PGT）时，胚胎师选择在囊胚期活检数枚外周扁平细胞而非穿刺内部细胞团，其核心发育学依据在于：","options":["囊胚外周细胞携带母方全部线粒体基因且分裂最快","内细胞群是胚体形成原基而外周滋养层主要成胎盘胎膜","外周扁平细胞尚未经历卵裂因而具有最高染色质稳定度","内细胞群仅在受精后第3周原条出现后才获得二倍体核"],"answer_idx":1,"explain":"囊胚结构分工明确（P43）：**内细胞群（ICM）**将来分化为胚胎本体所有组织器官，穿刺取样极易损毁胚体；外周**滋养层**将来主要发育为胎盘与胎膜，安全取数枚细胞行基因检测即可代表胚胎核基因组而免伤胚体。","remedial_node_id":"histo_embryo_cleavage_blastocyst_twins"}},"added_at":"2026-11-18T12:26:14+08:00"},{"id":"anat_intro_position_planes_axes","title":"解剖姿势、方位轴面与运动系总览","subject":"anatomy","syllabus_refs":["syl_anatomy_001","syl_anatomy_002","syl_anatomy_003","syl_anatomy_004","syl_anatomy_005","syl_anatomy_006","syl_anatomy_007"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"确立**解剖学姿势**与**三轴三面**空间参照，统领206骨支架与运动系统三要素分工。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P1-P25"],"diagram_assets":[{"path":"assets/anat_gen_planes_axes_p018.webp","caption":"人体的矢状面（Sagittal）、冠状面（Coronal）与水平/横断面（Transverse）三维正交切面及躯干断面示意（P18）","source_page":18}],"payload":{"bullets":["标准{{解剖学姿势}}：直立平视、上肢自然下垂、{{掌心向前}}、足跟并拢足尖向前（非立正）；系统按功能、局部重浅深层次毗邻。","方位与标本：{{内/外}}(internal/external)指空腔脏器内外，{{内侧/外侧}}指距正中线远近；前臂{{尺内桡外}}、小腿{{胫内腓外}}；常用透明/干制/断层/铸型/塑化标本。","三轴三面正交：{{冠状轴}}(左右)配{{矢状面}}(分左右)；{{矢状轴}}(前后)配{{冠状/额状面}}(分前后)；{{垂直轴}}(头足)配{{水平/横断面}}(分上下)。","运动系统三要素：{{骨}}(杠杆支架与保护)、{{骨连结}}(运动枢纽定活动度)与{{骨骼肌}}(收缩动力)，在神经调控下定体表标志。","成人全身{{206 块骨}}（占体重约1/5；新生儿约1/7）：中轴骨含颅骨23+{{听小骨6}}+躯干骨51，附肢骨126（上肢64+下肢62）。"],"trap_note":"**前臂尺内桡外**必须以**掌心向前**的解剖学姿势为前提（旋前时桡骨交叉至内侧易误判）；成人**206块**骨已含6块听小骨，切勿再加成212块。","quiz":{"stem":"某患者前臂旋前位（手背朝前）平置桌面行影像检查时，临床医生按标准解剖学姿势描述前臂骨与切面方位，下列判断最准确的是：","options":["拇指侧仍称桡侧且属于外侧，水平面垂直纵轴分上下","拇指侧此时转向内侧改称尺侧，矢状面分前后两部分","小指侧始终属于外侧并称腓侧，冠状面分上下两部分","掌心贴体侧为标准解剖学姿势，垂直轴由腹侧向背侧"],"answer_idx":0,"explain":"解剖术语以**掌心向前**的标准解剖学姿势为唯一参照（P14–P18）：无论检查体位如何旋前，**拇指侧恒为桡侧（外侧）**、小指侧恒为尺侧（内侧）；**水平面/横断面**（对应垂直轴）将人体分为上下两部分，矢状面分左右，冠状面分前后。","remedial_node_id":"histo_intro_lm_em_he_methods"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_bone_shape_macrostructure","title":"骨的分类、长骨分区、构造与四路血供","subject":"anatomy","syllabus_refs":["syl_anatomy_008"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"依形态分四类骨并辨**长骨三区**与**骺板**，贯通骨质、骨膜、骨髓及**四路动脉血供**。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P26-P32,P34-P35"],"diagram_assets":[{"path":"assets/anat_gen_long_bone_regions_p027.webp","caption":"长骨纵剖形态分区：骨干（diaphysis/髓腔）、干骺端（metaphysis/骺线）与两端骨骺（epiphysis/关节软骨）（P27）","source_page":27},{"path":"assets/anat_gen_bone_blood_supply_p032.webp","caption":"长骨四路动脉供血吻合与神经淋巴分布：滋养动脉（经滋养孔发纵支）、骨膜动脉、干骺端动脉及骺动脉（P32）","source_page":32}],"payload":{"bullets":["骨形态四型：{{长骨}}(四肢杠杆)、{{短骨}}(腕跗承压)、{{扁骨}}(颅胸盆护脏，含板障)、{{不规则骨}}(椎骨等)，另含肌腱内{{籽骨}}(最大为髌骨)及含气/缝间骨。","长骨三区：中部管状{{骨干}}(diaphysis，厚骨密质围{{髓腔}})，两端{{骺}}(epiphysis，松质骨覆{{关节软骨}})，过渡区{{干骺端}}(metaphysis)幼含{{骺板}}。","骨三层结构：{{骨质}}(外层密质骨+内层承力骨小梁松质骨)、{{骨膜}}(外骨膜内层富成骨细胞与感觉神经，骨内膜衬髓腔小梁)及{{骨髓}}。","骨髓与四大功能：{{红骨髓}}造血（松质骨内终生保留），{{黄骨髓}}贮脂（大失血可逆转造血）；骨兼司支持运动、保护、造血与{{钙磷储库}}。","四路动脉血供：{{滋养动脉}}(经滋养孔供骨髓与深层皮质)、{{骨膜动脉}}(供外层皮质与骨折修复)、{{干骺端动脉}}与{{骺动脉}}（断流致{{缺血性骨坏死}}）。"],"trap_note":"股骨颈骨折或髋脱位时，**关节囊周围骺动脉分支撕裂**可致股骨头**缺血性骨坏死**；切忌只关注骨干滋养动脉而忽略端骺血供。","quiz":{"stem":"外伤性股骨近端经颈骨折术后出现股骨头塌陷及缺血性骨坏死（AVN），而骨干中段骨折断端骨膜完好时却能顺利愈合。决定这一预后分化的关键解剖因素是：","options":["股骨头仅靠干骺端髓腔内滋养动脉纵支单源供血","经关节周围入骨的骺动脉受损而骨膜吻合支不足","股骨头完全缺乏松质骨小梁无法传导骨髓腔血液","股骨干骨密质内部没有哈弗斯系统与骨膜动脉网"],"answer_idx":1,"explain":"**骺动脉**经关节囊周围入骨供应骨骺（P32），股骨头表面覆关节软骨且缺乏骨膜动脉直接吻合；股骨颈骨折撕裂骺动脉分支后易发**缺血性骨坏死**（P32、P34），而骨干骨折只要骨膜及骨膜动脉完整即可启动膜内成骨修复。","remedial_node_id":"histo_long_bone_lamellae_osteon"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_bone_chemistry_biomechanics","title":"骨的双相化学成分与老幼力学适应","subject":"anatomy","syllabus_refs":["syl_anatomy_009"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"对比骨**有机质**与**无机质**力学分工，推导脱钙骨/煅烧骨实验及老幼骨折力学差异。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P33"],"diagram_assets":[{"path":"assets/anat_gen_bone_chemistry_p033.webp","caption":"左为去有机质的煅烧骨（仅留脆性骨盐易碎成块）；右为去无机质的脱钙骨（仅留胶原韧性可打结弯曲）（P33）","source_page":33}],"payload":{"columns":["对比维度","有机质（约30%，成人3∶7）","无机质（约70%，成人3∶7）"],"rows":[["主要化学构成","**Ⅰ型胶原**纤维与蛋白多糖基质","钙磷盐形成的**羟磷灰石**晶体"],["核心力学贡献","提供骨的**韧性**与抗张能力（耐拉伸弯曲）","提供骨的**硬度**与抗压能力（耐垂直载荷）"],["经典处理实验","**脱钙骨**（酸除无机盐）：保留胶原致柔软可打结","**煅烧骨**（烧除有机质）：仅剩骨盐致松脆一碰即碎"],["全生命周期演变","儿童**有机质比例较高**：骨柔韧易弯（易青枝骨折）","老年骨量与**弹性下降**：骨脆性骤增易粉碎骨折"]],"quiz":{"stem":"将一根成人新鲜长骨浸泡于稀盐酸中彻底脱钙后再行力学测试，最可能观察到的宏观性状改变及临床对应机制是：","options":["骨质高度酥脆一碰碎裂，类比老年骨质疏松病理改变","抗压硬度显著升高抗张下降，类比青少年骺板骨化闭合","骨质柔软可弯曲成结不断，类比儿童期相对高有机质","有机胶原彻底断裂而仅存矿盐，类比骨髓造血功能退化"],"answer_idx":2,"explain":"稀酸溶解**羟磷灰石**等无机钙磷盐（脱钙），仅保留**Ⅰ型胶原**等有机质，使长骨失去硬度但保留极强韧性与抗张力而可打结弯曲（P33）；儿童因有机质比例相对高于成人 3∶7，受力时亦类似易弯不易全断（青枝骨折）。","remedial_node_id":"histo_bone_matrix_composition"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_joint_basic_auxiliary_motion","title":"滑膜关节基本与辅助结构及基本运动","subject":"anatomy","syllabus_refs":["syl_anatomy_012"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"以**关节面/囊/腔**为稳动基础，借五大辅助结构微调适配并按三轴执行基本运动。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P42-P44"],"diagram_assets":[{"path":"assets/anat_gen_synovial_joint_structure_p042.webp","caption":"滑膜关节基本结构剖面：覆关节软骨的关节面、双层关节囊（外纤维层+内滑膜）及含滑液负压的封闭关节腔（P42）","source_page":42},{"path":"assets/anat_gen_knee_auxiliary_p043.webp","caption":"膝关节辅助结构示意：囊内前后交叉韧带（ACL/PCL）稳定前后移位，纤维软骨半月板（Meniscus）改善骨面适配（P43）","source_page":43}],"payload":{"bullets":["滑膜关节三基本结构：{{关节面}}(覆透明{{关节软骨}}减摩承压)、双层{{关节囊}}(外纤维膜加固+内滑膜泌滑液)及封闭{{关节腔}}。","关节稳固关键机制：密闭关节腔内含少量{{滑液}}助润滑，并借{{关节腔内负压}}贴合骨面；穿刺破囊负压消失即易脱位。","五大辅助结构：{{韧带}}(分囊内如ACL/PCL与囊外)、{{关节盘与半月板}}(纤维软骨改善适配缓冲)、{{关节唇}}(加深关节窝)及{{滑膜襞/滑膜囊}}。","轴面对应运动：冠状轴作{{屈与伸}}(足部称跖屈/背屈)；矢状轴作{{内收与外展}}(手指以中指为轴)；垂直轴作{{旋内与旋外}}。","前臂特化与复合运动：前臂绕垂直轴{{旋前}}(桡骨交叉旋内使掌心向后)与{{旋后}}(两骨平行)；两轴以上可作画圆锥的{{环转运动}}。"],"trap_note":"**关节盘/半月板与关节唇**均属**纤维软骨**（而非覆骨面的透明关节软骨）；手指内收外展的参照轴是**中指长轴**而非人体正中矢状面。","quiz":{"stem":"膝关节镜术中向关节腔内持续灌注盐水使腔内压转为正压，同时切断前交叉韧带（ACL）并切除内侧半月板，最直接丧失的三项协同功能对应于滑膜关节的：","options":["骨膜成骨增粗、红骨髓造血微环境与黄骨髓能量储备","关节软骨细胞分裂、透明软骨软骨膜外加生长与骨化","滑膜分泌滑液润滑、纤维膜神经支配与滋养动脉供血","腔内负压吸合、胫股前后移位限制与关节面适配缓冲"],"answer_idx":3,"explain":"密闭**关节腔内负压**维持骨面吸合稳定（P42），正压灌注会消除负压；**囊内韧带**(ACL/PCL)限制骨端过度位移，**半月板**则借纤维软骨结构改善胫股关节面适配并缓冲冲击（P43）。","remedial_node_id":"anat_intro_position_planes_axes"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_synovial_joint_axes_classes","title":"滑膜关节按运动轴分类与自由度约束","subject":"anatomy","syllabus_refs":["syl_anatomy_013"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"依**单轴/双轴/多轴**几何曲面拆解六类滑膜关节，厘清**环转**与**旋转**的自由度门槛。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P45"],"payload":{"columns":["运动轴类别","关节几何亚型","典型实例与允许运动"],"rows":[["单轴关节 (1条轴)","屈戌/**滑车关节** (hinge)","**肘关节**（及踝关节等）；绕冠状轴行**屈与伸**"],["单轴关节 (1条轴)","**车轴关节** (pivot)","**寰枢正中**、近侧桡尺关节；绕垂直轴行旋前旋后"],["双轴关节 (2条垂直轴)","**椭圆关节** (ellipsoid)","**桡腕关节**；屈伸 + 收展 + **环转运动**（无主动纯旋转）"],["双轴关节 (2条垂直轴)","**鞍状关节** (saddle)","**拇指腕掌关节**；双马鞍互嵌行屈伸、收展、对掌与**环转**"],["多轴关节 (≥3条轴/多向)","**球窝** vs 平面关节","球窝（**肩、髋关节**）：屈伸/收展/旋转/环转全能；平面：微幅多向滑动"]],"quiz":{"stem":"桡腕关节（腕关节）可完成屈、伸、内收、外展及流畅的环转运动，但无法在手掌固定前提下独立绕前臂纵轴作大幅度旋内/旋外，其关节面几何形态属于：","options":["双轴椭圆关节（椭球曲面）","单轴屈戌关节（滑车关节）","单轴车轴关节（圆柱关节）","多轴球窝关节（球面关节）"],"answer_idx":0,"explain":"**椭圆关节**（如桡腕关节，P45）具备两条相互垂直的运动轴（冠状轴屈伸+矢状轴收展），两轴复合即可实现**环转运动**；但因椭圆形骨面长短径限制，无法像球窝关节（肩、髋）或车轴关节那样绕第三条垂直轴独立旋转。","remedial_node_id":"anat_joint_basic_auxiliary_motion"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_bone_ossification_plasticity","title":"骨的生长骨化、机械塑形与组织工程","subject":"anatomy","syllabus_refs":["syl_anatomy_010","syl_anatomy_011"],"syllabus_tier":"understand","node_type":"mechanism_flow","anchor_summary":"借**骺板骨化**与**茜草银丝改建**揭示长长增粗机制，衔接应力塑形与骨组织工程。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P24,P27-P28,P30"],"diagram_assets":[{"path":"assets/anat_gen_bone_growth_madder_p030.webp","caption":"骨增粗改建实证：茜草染色呈红白同心圆生长环，外固定银丝随外膜添骨与内膜吸收而迁入骨髓腔且相对距离不变（P30）","source_page":30}],"payload":{"steps":[{"cue":"纵向加长机制：青少年长骨如何在保持干骺形态下向两端持续长长？","reveal":"**骺软骨/骺板**细胞不断增生并由干骺端逐步骨化推长骨干，在X线上呈现骺与骨干间的**透亮带**；成年后骺板完全骨化闭合为**骺线**，纵长即停止。","mechanism_tag":"骺板骨化→骺线"},{"cue":"横向增粗证明：茜草染色与银丝标记如何揭示骨不会越长越实心？","reveal":"**茜草染色**呈红白同心圆证明骨外表面添新骨；骨表**银丝**位置距骺不变却逐渐进入髓腔，证实外骨膜成骨增粗与内表面破骨吸收髓腔扩大同步协调。","mechanism_tag":"外添内吸动态改建"},{"cue":"可塑性规律：运动负荷、营养、激素与年龄如何重塑骨小梁结构？","reveal":"骨为活器官（P24）：松质骨**骨小梁**顺主压/张应力方向排列（Wolff塑形），负重锻炼促成骨增密，失重废用或营养激素失衡则诱发骨吸收疏松。","mechanism_tag":"机械应力塑形"},{"cue":"骨组织工程：临床如何利用骨的可塑性修复大段骨缺损？","reveal":"依托**骨组织工程三要素**——生物可降解多孔**支架**（仿骨松质）、**种子细胞**（骨髓间充质干细胞/骨膜祖细胞）及成骨/促血管生长因子（BMP/VEGF），引导新骨爬行替代再生。","mechanism_tag":"支架·细胞·因子"}],"takeaway":"长骨靠**骺板骨化**长长、靠**外膜添骨+内膜吸收**协调增粗扩髓腔，并依机械应力可塑性与组织工程三要素持续改建修复。","quiz":{"stem":"在幼猪长骨骨干外表面相距 2 cm 处埋入两枚银丝后停止干预并待其长成，剖开骨干可见两枚银丝已移入骨髓腔内壁旁，但二者之间距离仍约 2 cm。该经典实验直接证明：","options":["长骨的纵向加长主要来自骨干中段骨膜间质均匀膨胀","骨增粗伴外膜表面添新骨与髓腔内表面同步破骨吸收","骨髓腔内的破骨细胞可将埋入骨皮质的银丝逐步推回","骺软骨透亮带仅在骨骼完全成熟后才启动纵向骨化"],"answer_idx":1,"explain":"骨干表面**银丝**随外层骨膜成骨不断添加而被包埋，同时**骨内膜**同步破骨吸收扩大髓腔，最终使银丝“进入髓腔”；而两丝间距不变正说明纵向长长发生在两端**骺板**而非骨干中间拉长（P28、P30）。","remedial_node_id":"histo_long_bone_growth_remodeling"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_direct_synarthroses_types","title":"直接连结三型结构、缓冲与骨化演化","subject":"anatomy","syllabus_refs":["syl_anatomy_014"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"依连接介质区分纤维/软骨/骨性三类无腔直接连结，对比**软骨结合**与**联合**演化。","source_slides":["人体解剖学_第一章_基础医学班 20260906.pdf#P37-P41"],"payload":{"columns":["直接连结类别","连续连接介质（无关节腔）","典型实例与动态演化"],"rows":[["1. 纤维连结 (fibrous)","**致密纤维**结缔组织（极少或无活动）","**骨缝**(颅骨)、**牙槽嵌合**(牙周膜固齿)、韧带连结(胫腓间骨间膜)"],["2a. 软骨结合 (synchondrosis)","**透明软骨**（牢固、缓冲或供生长）","**骺板**、**第1胸肋关节**、肋与肋软骨连结（部分随发育骨化）"],["2b. 联合 (symphysis)","**纤维软骨**（承压耐剪、允许微动）","**椎间盘**、**耻骨联合**（兼顾脊柱/骨盆缓冲载荷与微幅运动）"],["3. 骨性结合 (synostosis)","原纤维或软骨**骨化融合**为一体","**髋骨**(髂坐耻三骨融合)、**骶骨**(5骶椎融合)、老年骨化颅缝（最稳固无动）"]],"quiz":{"stem":"临床判读影像与解剖标本时，下列哪一组结构均属于以“纤维软骨”相连、兼具承重缓冲与微幅活动能力的软骨连结“联合（symphysis）”？","options":["成人骨化颅缝与第1胸肋关节","幼儿长骨骺板与五块融合骶椎","相邻椎体椎间盘与耻骨联合","胫腓骨间膜与牙根牙槽嵌合"],"answer_idx":2,"explain":"软骨连结按软骨基质分型（P39）：**联合（symphysis）**以抗压耐剪的**纤维软骨**连接相邻骨（典型为椎间盘、耻骨联合）；骺板与第1胸肋关节属**透明软骨结合**；髋骨、骶骨与骨化颅缝已转化为**骨性结合**，胫腓骨间膜与嵌合属**纤维连结**。","remedial_node_id":"histo_cartilage_three_types_matrix"}},"added_at":"2026-11-18T13:02:43+08:00"},{"id":"anat_upper_girdle_clavicle_scapula","title":"附肢功能与上肢带：锁骨和肩胛骨","subject":"anatomy","syllabus_refs":["syl_anatomy_039","syl_anatomy_040","syl_anatomy_041"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"确立**附肢骨**分工与每侧32块上肢骨格局，定位**S形无髓腔锁骨**及贴附2–7肋的肩胛骨标志。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P2-P4,P8,P10,P12"],"diagram_assets":[{"path":"assets/anat_upper_scapula_girdle_p004.webp","caption":"上肢带骨在胸廓后外侧的体位（覆盖第2–7肋）及肩胛骨后面（左）与前面（右）全部标志（P4，已剔除底部错标）","source_page":4}],"payload":{"bullets":["附肢骨126块分工：{{上肢骨64块}}(每侧带骨2+游离骨30)摆脱负重专司{{灵活抓取}}；下肢62块稳固承重与行走。","{{锁骨}}呈S形且{{无骨髓腔}}，分胸骨端、体与肩峰端；借胸锁关节成连于躯干的唯一关节支点，骨折好发{{中外1/3交界处}}。","{{肩胛骨}}为三角形扁骨贴胸廓后外侧{{第2–7肋}}；前面凹陷为{{肩胛下窝}}，后面借{{肩胛冈}}分出冈上窝与冈下窝。","肩胛突起与分部：肩胛冈外端膨大成{{肩峰}}(含肩峰角)，前上方指状{{喙突}}，上缘外侧有{{肩胛切迹}}；图谱分体、颈、头。","肩胛三缘三角：上/内/外三缘交会三隅；{{下角}}平第7肋（计数肋骨标志），外侧角最厚构成{{关节盂}}及盂上、盂下结节。"],"trap_note":"勘误P3混淆：“锁骨是唯一关节”实指**胸锁关节**为上肢带与中轴骨唯一关节连接；P4底框“前面观”错标，实为**左后面、右前面**。","quiz":{"stem":"某青年摔倒时以肩部外侧着地，急诊X线示左锁骨中外1/3交界处骨折，且近侧骨段明显向上移位。关于锁骨解剖与上肢带定位的判断，正确的是：","options":["锁骨内侧端直接借骨性结合焊固于胸骨柄外缘","锁骨骨干中央拥有宽大骨髓腔故中段极易横行折断","锁骨S形无髓腔且借胸锁关节作为躯干唯一关节支点","肩胛骨平第4至9肋贴附胸廓前外侧并向内伸出喙突"],"answer_idx":2,"explain":"**锁骨**呈S形且**无骨髓腔**，应力集中于内外弧交界的**中外1/3交界处**易折（P3、P12）；连接上肢带与中轴骨的唯一关节性连接为内侧的**胸锁关节**（P10），而非骨性结合；肩胛骨则位于胸廓**后外侧第2–7肋**（P4）。","remedial_node_id":"anat_intro_position_planes_axes"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_shoulder_girdle_joint","title":"上肢带连结与肩关节稳动权衡","subject":"anatomy","syllabus_refs":["syl_anatomy_046"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"剖析胸锁/肩锁关节与**喙肩弓**协同悬吊，揭示肩关节**头大窝浅囊松**致前下脱位的因果。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P9-P12"],"diagram_assets":[{"path":"assets/anat_upper_shoulder_joint_p011.webp","caption":"肩关节立体构造：薄松关节囊（上）、冠切面显示盂唇与穿囊的肱二头肌长头腱（左下）及肩锁/喙锁/喙肩韧带（右下）（P11）","source_page":11}],"payload":{"steps":[{"cue":"上肢带枢纽：肩胛骨如何借锁骨与胸骨连接并扩大上肢活动范围？","reveal":"**胸锁关节**（锁骨内端+胸骨柄+第1肋软骨，含关节盘）是连于躯干的唯一关节；肩锁关节借肩锁与喙锁韧带加固，**喙肩韧带**架成喙肩弓防上脱位。","mechanism_tag":"唯一躯干支点"},{"cue":"灵活结构之源：盂肱关节如何达成全身最大三轴活动度？","reveal":"**肱骨头大而关节盂浅小**（仅靠纤维软骨盂唇略加深），加之**关节囊薄松**，使典型球窝关节绕冠状轴屈伸、矢状轴展收、垂直轴旋转并环转。","mechanism_tag":"头大窝浅囊松"},{"cue":"稳定与薄弱窗：既已头大窝浅囊松，靠什么防脱位又哪壁最薄弱？","reveal":"稳固全靠**肱二头肌长头腱**穿经关节囊上方（伴结节间滑膜鞘）及前、后、上三面韧带与肩袖包绕；唯独**前下方**无强韧带与肌腱护持。","mechanism_tag":"三面加固唯前下弱"},{"cue":"临床脱位推演：为何跌倒外展手撑地时肱骨头总滑向特定方向？","reveal":"外展外旋暴力将大肱骨头压向最薄弱的下前壁，上方被**喙肩弓**阻挡，遂冲破关节囊形成**前下方脱位**，前后位X线见关节盂空虚（P12）。","mechanism_tag":"前下方脱位机制"}],"takeaway":"肩关节以**头大窝浅囊薄松**换取三轴大环转，借三面韧带与肱二头肌长头腱稳固，独留**前下方薄弱窗**成脱位突破口。","quiz":{"stem":"滑雪者跌倒时右上肢处于外展外旋位手掌撑地，随即肩部剧痛呈方肩畸形，X线片显示肱骨头脱离关节盂移位于喙突下方。决定肱骨头难以向上脱位却易向前下方滑出的关键构造是：","options":["上方有喙肩弓与长头腱护持而前下囊壁缺乏加强","下方关节盂骨唇深厚却在上方缺失纤维关节囊","肱二头肌长头腱绕过囊下方拉扯骨头向下滑移","胸锁关节囊内缺少关节盘限制了锁骨向上缓冲"],"answer_idx":0,"explain":"肩关节（P11）上方由**喙突、肩峰与喙肩韧带**构成的喙肩弓及穿囊通过的肱二头肌长头腱强力护持，加之囊周前、后、上三面有韧带增强，唯有**前下方囊壁薄弱空虚**，故外展外旋冲击时最易发前下方脱位（P12）。","remedial_node_id":"anat_joint_basic_auxiliary_motion"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_humerus_nerve_grooves","title":"肱骨分部标志与三处神经易损沟","subject":"anatomy","syllabus_refs":["syl_anatomy_042"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"沿肱骨近端—体—远端定位内外侧髁窝骨突，锁定**外科颈与桡/尺神经沟**三大易损险区。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P5,P8"],"diagram_assets":[{"path":"assets/anat_upper_humerus_landmarks_p005.webp","caption":"肱骨后面观（左）与前面观（右）：黄虚线标解剖颈、蓝虚线标外科颈，重点显露桡神经沟与内上髁后方尺神经沟（P5）","source_page":5}],"payload":{"bullets":["肱骨近端：半球形{{肱骨头}}周缘环沟为{{解剖颈}}；外侧{{大结节}}与前侧{{小结节}}向下各延出嵴，两嵴间为{{结节间沟}}。","近端与体分界缩窄处称{{外科颈}}（蓝虚线，骨折高发）；肱骨体中部外侧有粗糙的{{三角肌粗隆}}供三角肌止附。","肱骨体后面自内上斜向外下的浅沟为{{桡神经沟}}，贴骨走行；中段螺旋或横断骨折极易牵拉/刺伤{{桡神经}}致垂腕。","肱骨远端两关节面：外侧球形{{肱骨小头}}(前上为桡窝)接桡骨，内侧{{肱骨滑车}}(前上冠突窝、后上深{{鹰嘴窝}})接尺骨。","远端两侧隆起为{{外上髁}}与更凸的{{内上髁}}(配髁上嵴)；内上髁后下方有浅表{{尺神经沟}}，撞击或骨折易损尺神经。"],"trap_note":"严防混淆**解剖颈**（头与大小结节间，较少折）与**外科颈**（结节下移行骨干细窄处，最易骨折伤腋神经）；肱骨远端牢记“外小头、内滑车”。","quiz":{"stem":"某骑行者跌伤右臂后出现伸腕、伸指肌群瘫痪伴典型“垂腕”畸形，而肩关节外展及小指掌侧感觉保留良好。结合肱骨骨面毗邻关系，此次骨折最可能发生在：","options":["环绕肱骨头基部的近端解剖颈环沟处","大结节与小结节下方的近端外科颈缩窄处","内上髁后下方贴附滑车的浅表尺神经沟处","肱骨体后面中段斜行的螺旋状桡神经沟处"],"answer_idx":3,"explain":"**桡神经沟**斜行于肱骨体后面中段（P5），桡神经紧贴骨膜走行，故中段骨干骨折最易损伤桡神经引起前臂伸肌瘫痪（垂腕）；外科颈骨折主要危及腋神经，内上髁后方**尺神经沟**损伤则累及尺神经。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_elbow_joint_triangle","title":"肘关节三合一囊、脱位与肘后三点","subject":"anatomy","syllabus_refs":["syl_anatomy_046"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"串联**三关节共囊**、前后壁薄松及提携角163°，用**肘后三点**直线/等腰三角鉴别脱位与髁上骨折。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P13-P16"],"diagram_assets":[{"path":"assets/anat_upper_elbow_triangle_p016.webp","caption":"肘后三点体表规律（左：伸直成直线、屈90°成等腰三角形）及正常(a)/后脱位(b)/肱骨髁上骨折(c)关系对照（P16）","source_page":16}],"payload":{"bullets":["三关节{{共包一个关节囊}}：{{肱尺关节}}(滑车+滑车切迹主屈伸)、{{肱桡关节}}(小头+桡骨头凹)及车轴样{{桡尺近侧关节}}。","稳定与韧带加固：关节囊{{前、后壁薄而松弛}}，两侧由尺侧与桡侧{{副韧带}}强固，{{桡骨环状韧带}}环套桡骨头防脱出。","运动与后脱位机制：绕冠状轴屈伸，生理外翻{{提携角约163°}}；前、后囊壁薄松使跌倒撑地时尺桡骨极易{{向后脱位}}。","{{肘后三点}}定位：由肱骨{{内上髁}}、{{外上髁}}与{{尺骨鹰嘴}}构成；伸肘时三点成{{一条直线}}，屈肘90°成等腰三角形。","骨科鉴别诊断：肘关节{{后脱位}}时鹰嘴上移使三点关系{{改变}}；{{肱骨髁上骨折}}位于三点近侧，三点关系{{通常保持}}。"],"trap_note":"区分易错点：肘关节**前、后壁薄松**而两侧副韧带坚韧，故多发**后脱位**（与肩关节前下脱位相反）；此外幼童纵向牵拉前臂易致桡骨头半脱位（环状韧带松滑）。","quiz":{"stem":"8岁儿童跌倒手掌撑地后右肘剧痛肿胀拒动，急诊查体在屈肘约90°位扪及肱骨内上髁、外上髁与尺骨鹰嘴仍稳固构成等腰三角形。该体征最支持以下哪项判断？","options":["桡骨环状韧带撕裂伴桡骨头向前外侧脱位","尺桡骨近端向后上方脱位即典型肘关节后脱位","骨折线位于三点近侧的肱骨髁上骨折可能大","尺骨鹰嘴横向撕脱骨折并沿三头肌向上回缩"],"answer_idx":2,"explain":"**肘后三点**（内上髁、外上髁、尺骨鹰嘴）在屈肘90°时成等腰三角形（P14、P16）：**肱骨髁上骨折**断端位于三点近侧，关节囊内对位未被破坏，故三点关系通常保持不变；而肘关节后脱位或鹰嘴撕脱骨折均使鹰嘴相对两上髁移位而破坏三点几何关系。","remedial_node_id":"anat_upper_humerus_nerve_grooves"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_ulna_radius_contrast","title":"尺骨与桡骨倒置形态及骨端标志","subject":"anatomy","syllabus_refs":["syl_anatomy_042"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对比**尺骨上粗下细**（主肘）与**桡骨上细下粗**（主腕）的倒置结构，锁定近远端切迹与茎突。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P6,P8,P13-P14,P17"],"diagram_assets":[{"path":"assets/anat_upper_ulna_radius_p006.webp","caption":"前臂尺骨（内侧，上粗下细）与桡骨（外侧，上细下粗）后面观（左）与前面观（右）核心解剖标志（P6）","source_page":6}],"payload":{"columns":["对比维度","尺骨 Ulna (前臂内侧)","桡骨 Radius (前臂外侧)"],"rows":[["粗细倒置与分工","**上粗下细**，主要参与肘关节（主屈伸）","**上细下粗**，主要参与腕关节（承手载荷）"],["近端（肘部）标志","**滑车切迹**、鹰嘴、冠突、桡切迹、尺骨粗隆","**桡骨头**(关节凹+环状面)、颈、桡骨粗隆"],["骨体标志特征","骨间嵴与全长皮下可触的**后缘**","骨间嵴及前面**前斜线**、后面后斜线"],["远端（腕部）标志","尺骨头与茎突（借盘隔开**不入腕**）","尺切迹、**桡骨茎突**(略低)、背侧结节"]],"quiz":{"stem":"医生对比患者前臂前后位X线片与体表触诊时，将腕部外侧明显向远端突出、位置低于内侧茎突的尖端误判为“尺骨茎突”，究其解剖格局，尺骨与桡骨的结构规律实为：","options":["尺骨位于外侧且上细下粗并向下伸出较低茎突","尺骨与桡骨两端等粗且均直接对合近侧列腕骨","桡骨位于内侧且上粗下细并以鹰嘴构成滑车窝","桡骨位于外侧且上细下粗并向下伸出更低茎突"],"answer_idx":3,"explain":"按**掌心向前**标准姿势（尺内桡外），尺骨居内侧且上粗下细主力构成肘关节（P6），**桡骨**居外侧且上细下粗主力构成腕关节；桡骨远端外侧的桡骨茎突位置显著低于内侧尺骨
