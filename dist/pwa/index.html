茎突，也是临床桡骨远端骨折复位检查的标志。","remedial_node_id":"anat_upper_elbow_joint_triangle"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_carpal_bones_order","title":"腕骨八块双列排布与舟月三角豆","subject":"anatomy","syllabus_refs":["syl_anatomy_043"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"依由桡侧向尺侧排序8块短骨腕骨，贯通“**舟月三角豆，大小头状钩**”中英文名与功能定位。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P7-P8,P17"],"diagram_assets":[{"path":"assets/anat_upper_carpus_hand_p007.webp","caption":"手骨后面观（左）与前面观（右）：近远两列8块腕骨（舟月三角豆、大小头状钩）与5掌骨、14指骨（P7）","source_page":7}],"payload":{"bullets":["手骨27块总览：由近向远分为{{腕骨8块}}(短骨)、{{掌骨5块}}与{{指骨14块}}(拇2节+余四指各3节)。","近侧列4块（{{由桡向尺}}）：{{手舟骨}}(scaphoid)、{{月骨}}(lunate)、{{三角骨}}(triquetrum)、{{豌豆骨}}(pisiform)。","远侧列4块（{{由桡向尺}}）：{{大多角骨}}(trapezium)、{{小多角骨}}(trapezoid)、{{头状骨}}(capitate)、{{钩骨}}(hamate)。","功能与口诀锚点：口诀“{{舟月三角豆，大小头状钩}}”；{{豌豆骨}}属籽骨附于三角骨掌面不入腕关节，{{大多角骨}}接第1掌骨。"],"trap_note":"记忆口诀务必同时锁死方向——**自近侧列、每列均由桡向尺数**（与P7右侧前面观一致）；若误看背面观（左手）或颠倒尺桡会全列反序。","quiz":{"stem":"某腕部外伤患者前臂旋后掌心向前摄X线正位片，阅片时沿近侧列腕骨由拇指（桡）侧向小指（尺）侧依次辨认骨块，其正确排列顺序及关节参与特征是：","options":["大多角骨→小多角骨→头状骨→钩骨，整体均接桡骨","手舟骨→月骨→三角骨→豌豆骨，且豌豆骨不入腕关节","豌豆骨→三角骨→月骨→手舟骨，且三角骨不入腕关节","手舟骨→月骨→头状骨→钩骨，且手舟骨位于尺骨下方"],"answer_idx":1,"explain":"腕骨近侧列由桡侧（拇指侧）向尺侧依次为**手舟骨→月骨→三角骨→豌豆骨**（scaphoid, lunate, triquetrum, pisiform，P7）；其中前3块构成桡腕关节头，**豌豆骨**位于三角骨掌面不参与桡腕关节，远侧列则为大多角骨→小多角骨→头状骨→钩骨。","remedial_node_id":"anat_upper_ulna_radius_contrast"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_forearm_wrist_thumb","title":"前臂旋动、桡腕椭圆与拇指鞍状关节","subject":"anatomy","syllabus_refs":["syl_anatomy_046","syl_anatomy_047","syl_anatomy_048"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"联动前臂骨间膜与远近桡尺关节实现旋前旋后，析出**关节盘隔尺骨**与**拇指鞍状对掌**。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P6,P9,P17"],"diagram_assets":[{"path":"assets/anat_upper_forearm_wrist_p017.webp","caption":"前臂骨间连结与腕手关节：近/远侧桡尺关节、前臂骨间膜、三角形关节盘将尺骨头隔出桡腕关节（红框，P17）","source_page":17}],"payload":{"columns":["关节/连结单元","骨性构成与关键隔垫/韧带","轴型、运动分工与临床关联"],"rows":[["前臂骨间连结（近/远桡尺+骨间膜）","桡尺近侧关节(环状韧带) + **前臂骨间膜** + 桡尺远侧关节(含**关节盘**)","绕垂直轴行**旋前**（桡骨交叉至内）与**旋后**（两骨平行）；撑地冲击由骨间膜传向尺骨"],["桡腕关节（腕关节）","窝=桡骨腕关节面+关节盘（**尺骨不参与**）；头=**舟月三角骨**近侧关节面","双轴**椭圆关节**：屈伸、收展（尺/桡偏）与环转；前臂旋动代偿其无主动纯旋转"],["拇指腕掌关节（第1腕掌关节）","**大多角骨**远侧面 + 第1掌骨底（独立宽大关节囊，区别于余四指）","双轴**鞍状关节**：两马鞍正交互嵌行屈伸、收展、环转及人类灵巧抓取的**对掌运动**"]],"quiz":{"stem":"解剖标本显示前臂尺骨头远端被一块三角形纤维软骨关节盘紧贴隔开，同时桡骨远端呈现椭圆形凹面。若将此关节盘外科切除而保留其余韧带完整，最直接产生的结构与运动变化是：","options":["拇指大多角骨鞍面卡死致对掌运动立刻完全消失","尺骨头直接抵触腕骨并削弱桡尺远侧旋前稳定性","肱尺关节滑车切迹脱开使肘关节丧失屈伸功能","第2至第5掌骨基底融为一体丧失掌指环转幅度"],"answer_idx":1,"explain":"P17图清楚示明：**三角形关节盘**附着于桡骨尺切迹下缘与尺骨茎突根部之间，既将尺骨下端隔出桡腕关节（尺骨不直接参与腕关节），又是**桡尺远侧关节**稳固旋转（旋前/旋后）的重要连接结构；切除关节盘将直接使尺骨头碰触三角骨/月骨并失稳。","remedial_node_id":"anat_synovial_joint_axes_classes"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_upper_hand_landmarks_joints","title":"手骨分部、骨性标志与掌指小关节","subject":"anatomy","syllabus_refs":["syl_anatomy_044","syl_anatomy_045","syl_anatomy_049"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"归拢掌骨/指骨三段分部、上肢全身**体表骨性标志**及腕骨间/2–5腕掌/掌指/**指间小关节**自由度。","source_slides":["04 基础医学 上肢骨及骨联接 260915.pdf#P2-P8,P16-P17"],"payload":{"bullets":["掌骨与指骨分部：{{5块掌骨}}(1–5由桡向尺)与{{14块指骨}}(拇2余3)均分{{底、体、头}}，指骨头呈滑车状（称{{指骨滑车}}）。","带骨与臂部标志：锁骨全长及两端、肩胛骨{{肩峰}}、{{肩胛冈}}、{{喙突}}与平第7肋的{{肩胛下角}}，肱骨{{大结节}}与三角肌粗隆。","肘腕部骨性标志：肱骨{{内、外上髁}}与尺骨{{鹰嘴}}(肘后三点)、尺骨后缘及{{尺骨头/茎突}}、{{桡骨茎突}}与背侧结节。","手部平面小关节：{{腕骨间关节}}与{{第2–5腕掌关节}}关节囊紧、韧带强固，均属微动{{平面关节}}，协同缓震微滑。","掌指与指骨间关节：{{掌指关节}}(MCP)为球窝/椭圆样关节司屈伸与以{{中指}}为轴收展；{{指间关节}}(IP)为单轴{{滑车关节}}仅屈伸。"],"trap_note":"第2–5腕掌关节与第1腕掌关节同列腕掌关节但力学截然不同：前者为紧致**平面微动**，后者为独立**鞍状对掌**；手指内收/外展以中指长轴为参照，而非身体正中线。","quiz":{"stem":"手外科检查指部关节活动度时，发现患者第3指近侧指骨间关节（PIP）能顺利完成屈伸，但医生轻试被动左右侧方外展时几乎纹丝不动；而同指掌指关节（MCP）在伸指位却可左右外展。这一正常自由度差异源于：","options":["指骨间关节为单轴滑车关节而掌指关节可屈伸收展","指骨间关节内嵌纤维关节盘而掌指关节囊完全松弛","第3掌骨底与头状骨融合使掌指关节丧失屈伸能力","掌指关节属于多轴平面关节而指骨间为双轴鞍状关节"],"answer_idx":0,"explain":"**指骨间关节（IP）**（含近侧PIP和远侧DIP）是由指骨滑车与相邻指骨底构成的典型单轴滑车（屈戌）关节，仅绕冠状轴屈伸；而**掌指关节（MCP）**为球状掌骨头配浅指骨底，属椭圆/球窝样关节，伸位可作屈伸、以中指为轴的收展及环转运动（P2、P7、P17）。","remedial_node_id":"anat_upper_carpal_bones_order"}},"added_at":"2026-11-18T14:50:30+08:00"},{"id":"anat_trunk_composition_general_vertebra","title":"躯干骨组成与典型椎骨构造","subject":"anatomy","syllabus_refs":["syl_anatomy_015","syl_anatomy_016"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"确立成人**51块躯干骨**组成与功能，贯通典型椎骨一体一弓七突起及双孔通道。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P19-P23,P36"],"diagram_assets":[{"path":"assets/anat_trunk_typical_vertebra_p021.webp","caption":"典型椎骨（胸段示例）右侧面观：示椎弓根、椎间孔、关节突关节、上/下肋凹、横突及棘突（P21）","source_page":21}],"payload":{"bullets":["躯干骨共{{51 块}}：椎骨{{26 块}}(颈7/胸12/腰5/骶1/尾1)+{{胸骨 1 块}}+肋{{24 块}}(12对)，司支重、护髓护脏与红骨髓造血。","典型椎骨“一体一弓”：前方短圆柱{{椎体}}(主要承重)；后方{{椎弓}}由前段{{椎弓根}}与后段{{椎弓板}}连成，共围{{椎孔}}。","椎弓七个突起：{{棘突}}1个向后、{{横突}}2个向两侧（肌韧附着杠杆）；上、下{{关节突}}各2个，相邻微动相关节。","纵横双孔通路：各椎孔叠连成{{椎管}}容纳脊髓；相邻椎弓根上、下{{椎骨切迹}}拼合{{椎间孔}}供脊神经根与血管穿出。","功能耦联逻辑：前方宽厚椎体扛{{轴向压应力}}，后方椎弓与棘突围成闭合骨环并借{{7 个突起}}完成肌肉牵拉与限位。"],"trap_note":"原片 P21 中部外侧观虽标作 C6，实具肋凹且无横突孔，属**典型胸椎**（P22 已撤该误标）；切勿把上/下肋凹误认作椎骨切迹。","quiz":{"stem":"某患者椎骨骨折后骨片向后外侧移位并嵌塞椎间孔，最直接压迫下列哪一组穿行该孔隙的解剖结构？","options":["脊神经根及伴行的节段动静脉","脊髓颈膨大与硬脊膜外脂肪垫","椎动脉主干及其交感神经丛","黄韧带弹性纤维与后纵韧带"],"answer_idx":0,"explain":"相邻椎骨的椎上、下切迹在椎弓根处围成**椎间孔**（P21），脊神经根及节段血管由此穿出椎管；脊髓位于中央**椎管**，而椎动脉穿行颈椎横突孔。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_regional_vertebrae_matrix","title":"颈胸腰骶各部椎骨形态鉴别","subject":"anatomy","syllabus_refs":["syl_anatomy_016"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"依横突孔、肋凹与板状棘突区分五段椎骨，推导**转动/挂肋/负重/穿刺**功能差异。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P24-P27"],"diagram_assets":[{"path":"assets/anat_trunk_cervical_c1_c7_p024.webp","caption":"颈椎特化序列：C1寰椎（无体无棘）、C2枢椎（齿突）、C3–6（分叉棘突与横突孔）及C7隆椎（长而不分叉）（P24）","source_page":24}],"payload":{"columns":["椎骨分部","椎体与椎孔特征","特有标志与突起","功能与临床定位"],"rows":[["颈椎 (C1–C7)","椎体小呈椭圆形，椎孔大呈**三角形**","具**横突孔**(穿椎动静脉)；棘突多分叉；C1无体棘，C2具**齿突**，C7长不分叉","C1–C2司点头旋转；**C7隆椎**作颈后计数标志"],["胸椎 (T1–T12)","椎体呈心形，椎孔最小呈**正圆形**","体侧具* explain":"椎间盘纤维环后外侧较薄且**后纵韧带**中线宽厚而两侧渐窄（P39–P41），弯腰高负荷下髓核向后推移极易从后外侧裂隙突出，压迫穿行邻近椎间孔的**神经根**。","remedial_node_id":"histo_cartilage_three_types_matrix"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_spinal_ligaments_comparison","title":"前纵后纵与黄韧带脊柱连结","subject":"anatomy","syllabus_refs":["syl_anatomy_021","syl_anatomy_023"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对比前纵、后纵与**黄韧带**起止与纤维属性，串联椎弓韧带与关节突锁控。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P39,P42-P48"],"diagram_assets":[{"path":"assets/anat_trunk_spinal_ligaments_p045.webp","caption":"左为腰椎矢状面示前/后纵韧带、黄韧带及棘间/棘上韧带；右为颈椎示项韧带与椎动脉走行（P45）","source_page":45}],"payload":{"columns":["韧带/连结","精确位置与起止","组织材质特征","力学限制与临床意义"],"rows":[["前纵韧带","椎体与椎间盘前面（枕骨大孔区→骶骨）","宽厚坚韧规则致密胶原带","限制**过伸**，加固椎间盘前缘防椎体前移"],["后纵韧带","**椎管前壁**椎体后面（C2→骶骨，上宽下窄）","较窄致密胶原，与盘紧密附着","限制**过屈**，抑制髓核向正后方突出"],["黄韧带","连结相邻**椎弓板**，协助围成椎管后壁","富含弹性纤维呈黄色（柔韧）","助屈曲后**弹性复位**与限前屈；腰穿突破感/肥厚致狭窄"],["棘间/棘上/项韧带","棘突间/棘突尖（颈部增厚为**项韧带**至C7）","纤维束（项韧带富弹性支持头颈）","协同限制**过度前屈**；另有横突间韧带及关节突平面关节导动"]],"quiz":{"stem":"某老年患者因腰椎管后壁韧带明显增厚钙化导致间歇性跛行，MRI显示病变源自连接相邻椎弓板并向椎管内突出的结构，该结构正常时富含：","options":["大量平行弹性纤维以协助脊柱由前屈位复位","Ⅰ型胶原同心环层以缓冲椎体间的垂直重力","透明软骨细胞柱以维持成年脊柱纵向长长","疏松网状纤维支架以供应胸骨红骨髓造血"],"answer_idx":0,"explain":"**黄韧带**（ligamentum flavum，P43/P47）连结相邻椎弓板构成椎管后外侧壁，正常富含**弹性纤维**呈黄色，可限前屈并助躯干弹回直立位；退变肥厚时会压迫马尾神经。","remedial_node_id":"histo_dense_ct"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_spine_curvatures_motion_xray","title":"脊柱整体观生理曲度与阅片","subject":"anatomy","syllabus_refs":["syl_anatomy_021","syl_anatomy_024"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"整合脊柱整体尺度、**两原发两继发曲度**发育规律、畸形演变与X线阅片序列。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P28-P30,P34,P49-P56"],"diagram_assets":[{"path":"assets/anat_trunk_spine_curvatures_p053.webp","caption":"脊柱生理曲度发育：胎儿呈C形原发后凸（胸/骶曲），抬头形成颈曲，站立行走形成腰曲与腰骶角（P53）","source_page":53}],"payload":{"bullets":["整体组成与尺度：24自由椎+骶尾骨+23椎间盘+韧带关节；成人长男约{{70 cm}}、女约{{60 cm}}，老龄因椎间盘脱水渐矮。","前后两面观格局：前面观椎体{{自上而下渐大}}负重、入骶骨递减；后面观棘突纵列成正中嵴（颈分叉、胸叠瓦、腰水平）。","四生理曲度发育：{{胸曲与骶曲}}凸向后为{{原发曲度}}(胎儿已有)；{{颈曲}}(抬头)与{{腰曲}}(站走)凸向前为{{继发曲度}}，S形弹力减震。","运动与曲度异常：脊柱可作{{屈伸/侧屈/旋转/环转}}(受盘/关节面/韧带限)；胸椎过度后凸称{{驼背}}，冠状面侧弯常伴{{椎体旋转}}。","脊柱X线阅片四步：先定正/侧投照方向，再按{{椎体}}形态、{{椎间隙}}宽窄、棘突连线对齐与生理曲度依次判读序列。"],"trap_note":"切勿把原片 P29 错别字“胸屈/骶屈”记成“屈”；曲度方向口诀为**颈腰凸向前（前凸），胸骶凸向后（后凸）**，原发仅在胸与骶。","quiz":{"stem":"新生儿脊柱侧位片仅见胸段与骶尾段呈向后凸出的单一C形弧线，而6月龄后上段、1岁半学步后下段先后出现向前凸出弯曲。这两种后天出现的曲度分别是：","options":["原发曲度胸曲与骶曲（凸向前方）","继发曲度颈曲与腰曲（凸向前方）","病理性驼背与冠状面旋转型侧弯","寰枢车轴关节与骶髂耳状面融合角"],"answer_idx":1,"explain":"胎儿及新生儿脊柱仅具备凸向后的**胸曲与骶曲**（原发曲度，P52–P53）；婴儿抬头牵拉颈伸肌逐渐出现凸向前的**颈曲**，直立行走后逐渐形成凸向前的**腰曲**（继发曲度）。","remedial_node_id":"anat_trunk_spinal_ligaments_comparison"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_sternum_ribs_cage_elements","title":"胸骨胸骨角第2肋与肋骨构造","subject":"anatomy","syllabus_refs":["syl_anatomy_017","syl_anatomy_018"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"定位胸骨三部与**胸骨角平对第2肋**体表金标，串联12对肋分类与肋沟安全穿刺缘。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P31-P33,P36"],"diagram_assets":[{"path":"assets/anat_trunk_sternal_angle_p033.webp","caption":"胸骨角（蓝圈）向前微突且两侧平对第2肋软骨，是向下逐一计数肋和肋间隙的体表金标（P33）","source_page":33}],"payload":{"bullets":["胸骨三部（扁骨）：{{胸骨柄}}(颈静脉切迹/锁切迹/第1肋切迹)、{{胸骨体}}(第2–7肋切迹)与形态变异{{剑突}}(终生红骨髓适{{胸骨穿刺}})。","{{胸骨角}}临床金标：胸骨柄与体连接向前微突横嵴，两侧恒平对{{第 2 肋软骨}}（计数肋/肋间隙起点），后方约平{{第 4 胸椎下缘}}。","12对肋构成与分类：每肋由{{肋骨}}加前端{{肋软骨}}组成；{{1–7 对真肋}}直连胸骨，{{8–12 对假肋}}(8–10连成肋弓，{{11–12 浮肋}}游离)。","典型肋骨分部标志：后端{{肋头/肋颈/肋结节}}与胸椎相关节；肋体转弯成{{肋角}}，内面下缘凹陷成{{肋沟}}。","肋沟临床避险律：肋沟内由上而下走行肋间{{静脉、动脉、神经}}(VAN)，故胸膜腔穿刺须沿下一位肋骨{{上缘}}进针。"],"trap_note":"胸骨角平对的是**第2肋软骨**而非第1肋（第1肋藏于锁骨后下难触及）；计数肋间隙时，胸骨角下方紧邻的间隙即第2肋间隙。","quiz":{"stem":"胸腔闭式引流拟经左锁骨中线第2肋间隙穿刺置管时，术者需先触及体表标志并贴近目标肋骨的特定边缘进针。正确的计数起点与进针缘为：","options":["以颈静脉切迹定位第2肋，沿第3肋下缘肋沟进针","以剑胸结合定位第5肋，沿第2肋骨后外侧肋角进针","以胸骨角两侧定位第2肋，沿第3肋上缘进针避开VAN","以C7隆椎平对第1肋，贴近第2肋骨下缘血管沟进针"],"answer_idx":2,"explain":"**胸骨角**两侧恒平对第2肋软骨（P33），向下方紧邻即为第2肋间隙；因肋间静脉、动脉、神经（VAN）紧贴上位肋骨下缘内面的**肋沟**走行，穿刺必须紧贴下位肋骨上缘进针。","remedial_node_id":"anat_trunk_regional_vertebrae_matrix"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_thoracic_cage_apertures_motion","title":"胸廓两口境界与呼吸容积变化","subject":"anatomy","syllabus_refs":["syl_anatomy_025"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"界定胸廓上下两口骨骼围合，推导吸气时**提肋外翻**同步扩大三径的呼吸力学机制。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P57-P61"],"diagram_assets":[{"path":"assets/anat_trunk_thorax_apertures_p060.webp","caption":"胸廓前观：蓝圈示胸廓上口（T1-第1肋-胸骨柄上缘），绿色示肋间隙，蓝色角示两侧肋弓围成的胸骨下角（P60）","source_page":60}],"payload":{"steps":[{"cue":"骨性构筑：哪三组骨骼搭成上窄下宽圆锥形胸廓，上口与下口各自如何围合封闭？","reveal":"12胸椎+12对肋+1胸骨围成前后扁圆锥形；**胸廓上口**由T1、第1肋及软骨、胸骨柄上缘围成；**胸廓下口**由T12、11–12肋、肋弓及剑胸结合围成（膈封闭）。","mechanism_tag":"圆锥形与上下两口"},{"cue":"吸气杠杆：斜向前的肋骨绕肋椎关节轴向上抬升外翻时，如何带动胸廓三径变化？","reveal":"肋骨自然状态斜向前下；吸气肌牵拉使胸骨上提向前（**前后径增大**），同时肋体向外上方外翻（**横径增大**），叠加膈肌收缩下降使垂直径拉长。","mechanism_tag":"提肋外翻三径同步增"},{"cue":"容积与保护耦合：骨性笼架如何在保护心肺的同时完成肺通气压力驱动？","reveal":"三径同步扩大升高胸廓容积→胸膜腔与肺泡**负压加深**→空气顺压差入肺；呼气时肋借弹性肋软骨回位；全笼保护心腔、大血管、肺及肝脾上极。","mechanism_tag":"容积扩容驱动负压吸气"}],"takeaway":"12T+12对肋+1胸骨筑成上窄下宽防护笼，借斜行肋弓与肋椎轴在吸气时**提肋外翻**同步扩大前后、左右与垂直三径。","quiz":{"stem":"强直性脊柱炎患者因肋椎关节全面骨性强直融合，即使膈肌收缩力正常，深吸气时胸廓也难以出现哪种变化？","options":["膈顶向下移动拉长胸腔与腹腔垂直径","腹壁随膈肌下降顺应性轻微向前膨隆","肋上提外翻与胸骨前上移扩大横径","胸廓上口锁骨下血管通道彻底闭合"],"answer_idx":2,"explain":"呼吸时胸廓**前后径与横径**的扩大依赖于肋绕**肋椎关节**轴发生抬升和外翻（P57/P60）；一旦肋椎关节骨性强直锁死，肋骨与胸骨无法上提外翻，患者仅能依赖膈肌维持腹式呼吸。","remedial_node_id":"anat_trunk_sternum_ribs_cage_elements"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_first_rib_costal_cartilage","title":"第1肋与肋软骨形态及毗邻","subject":"anatomy","syllabus_refs":["syl_anatomy_019"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"辨析第1肋扁平上下面与**前斜角肌结节**分沟规律，衔接透明肋软骨弹性功能。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P32,P57-P60"],"payload":{"bullets":["第1肋扁平特化：短而弯、无肋沟且无肋角，不同于典型肋的“内外两面”，改呈{{上、下两面}}及内、外两缘，藏于锁骨后下。","关键毗邻标志：第1肋上面内缘突向{{前斜角肌结节}}，其前方压迹为{{锁骨下静脉沟}}，后方深沟走{{锁骨下动脉}}与臂丛。","肋软骨材质分布：12对由{{透明软骨}}构成，第1–7直连胸骨，第8–10连成肋弓，第11–12前端游离；赋予胸廓抗冲{{弹性}}。","增龄顺应性演变：青壮年肋软骨柔韧助呼吸回位，老年渐{{钙化骨化}}致胸廓变僵硬（胸外按压更易肋骨骨折）。"],"trap_note":"典型肋分内外两面、下缘有肋沟；唯第1肋水平扁平而分**上下面**，且前斜角肌结节前方为静脉、后方为动脉（前静后动）。","quiz":{"stem":"锁骨下静脉穿刺置管时若进针过深贴向第1肋骨上面，紧邻第1肋前斜角肌结节“前方”与“后方”依次毗邻的重要结构分别是：","options":["前方为肺尖胸膜顶，后方为胸导管与迷走神经","前方为锁骨下动脉，后方为头臂干与奇静脉弓","前方为臂丛神经下干，后方为胸内动脉与膈神经","前方为锁骨下静脉，后方为锁骨下动脉及臂丛"],"answer_idx":3,"explain":"第1肋上面内缘有**前斜角肌结节**作为分水岭：前斜角肌止于结节上，其前方凹沟紧贴**锁骨下静脉**，后方深沟则并行锁骨下动脉与臂丛（前静后动）。","remedial_node_id":"anat_trunk_sternum_ribs_cage_elements"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_surface_bony_landmarks","title":"躯干骨体表骨性标志与定位","subject":"anatomy","syllabus_refs":["syl_anatomy_020"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"汇整躯干前壁与后背可触及的**骨性标志**，直连计数肋间隙、腰穿与骶管麻醉定位。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P24,P26,P31,P33,P60"],"payload":{"bullets":["前胸正中三大标：胸骨柄上缘{{颈静脉切迹}}(平T2–T3)、微突横嵴{{胸骨角}}(平第2肋软骨/T4下缘)及下端{{剑突与胸骨下角}}。","前外侧肋弓标志：两侧第7–10肋软骨连成{{肋弓}}(肝脾触诊上缘基准)，借胸骨角向下逐一数清各{{肋间隙}}。","颈胸脊柱后标：低头时颈根部最突出且不分叉者为{{C7 隆椎棘突}}，由此向下逐节定位各胸椎棘突投影。","腰骶穿刺关键标：双侧髂嵴最高点连线多平{{L4 棘突}}(定位L3–L4或L4–L5腰穿隙)；臀沟上方两{{骶角}}间凹陷即{{骶管裂孔}}。"],"trap_note":"尾闾骶管裂孔虽被骶尾韧带封闭，但两侧**骶角**在俯卧位极易触及，是临床**骶管阻滞麻醉**的体表门户。","quiz":{"stem":"临床体格检查与穿刺操作中，下列哪组躯干体表骨性标志与其深部解剖定位对应关系完全准确？","options":["胸骨角平对第2肋软骨且后方平第4胸椎下缘","颈静脉切迹平对第1腰椎且可定位双侧肾门","第7颈椎棘突分叉最深且隐没于项韧带深层","两侧骶角连线水平恒对应主动脉弓最高点"],"answer_idx":0,"explain":"**胸骨角**平对第2肋软骨及第4胸椎下缘（P33）；颈静脉切迹平T2/T3，C7棘突长而不分叉易触及（P24），双侧**骶角**则夹持骨盆后方的骶管裂孔（P26）。","remedial_node_id":"anat_trunk_regional_vertebrae_matrix"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_rib_thoracic_joints","title":"肋椎关节与胸肋连结全貌","subject":"anatomy","syllabus_refs":["syl_anatomy_027"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"拆解肋头/肋横突双微动关节共轴传动，鉴别**第1胸肋软骨结合**与2–7滑膜关节。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P57-P59"],"payload":{"bullets":["后方肋椎关节双部：{{肋头关节}}(肋头连相邻两胸椎上/下肋凹及椎间盘；第1/10–12肋只连单一椎体)与{{肋横突关节}}(肋结节连同序胸椎横突肋凹)。","共轴运动机制：肋头与肋横突关节共绕穿过{{肋颈}}的斜轴同步微动，精确引导肋骨上下旋转（第11–12{{浮肋}}缺肋横突关节）。","前方胸肋连结差异：{{第 1 胸肋关节}}属牢固不可动的{{透明软骨结合}}（锚定胸廓上口），第2–7对属微动{{平面滑膜关节}}。","胸骨间与胸锁连结：8–10肋间软骨连成肋弓；{{胸骨柄体连结}}构成胸骨角；{{胸锁关节}}含{{关节盘}}，是上肢连于躯干唯一关节。"],"trap_note":"原片 P59 肋椎关节左上角误贴了一幅 **C5–C6 颈椎脱位交锁**插图，属排版串图错误，与肋椎关节结构完全无关。","quiz":{"stem":"与第2至第7对肋软骨通过滑膜腔微动连接胸骨体不同，第1肋软骨与胸骨柄之间的连结形式及主要力学意义是：","options":["囊内含纤维关节盘的鞍状关节，供肩带大范围旋转","牢固的透明软骨结合，稳固锚定第1肋环与胸廓上口","伴随骨缝锯齿咬合的纤维连结，于青少年期全部骨化","缺横突关节面的车轴关节，专门驱动浮肋向前下方降"],"answer_idx":1,"explain":"胸肋连结存在结构分型（P57–P58）：**第1胸肋关节**由透明肋软骨直接连于胸骨柄（透明软骨结合），无关节腔而极为稳固；第2–7胸肋关节则为平面滑膜关节；**胸锁关节**方含关节盘。","remedial_node_id":"anat_joint_basic_auxiliary_motion"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_trunk_thorax_age_sex_diff","title":"胸廓年龄演变与性别形态差异","subject":"anatomy","syllabus_refs":["syl_anatomy_026"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"对照新生儿桶状、成人扁锥与老年僵硬及男女胸廓性差，推演**呼吸型**与顺应性。","source_slides":["260910 基础医学班 躯干骨及连接.pdf#P57,P60"],"payload":{"columns":["对比维度","新生儿 / 女性胸廓特点","青壮年 / 男性胸廓特点","老年胸廓演变与呼吸影响"],"rows":[["横断面与前后径","新生儿呈**圆桶状**（前后径≈横径）；女性较短窄圆润","成人呈**前后扁椭圆锥形**（横径\u003e前后径）；男性宽长","骨质疏松致胸椎后凸加重，前后径再增趋向**桶状**"],["肋骨斜度与下角","新生儿肋近**水平位**；女性肋斜度大、上肋活动度较高","成人肋**斜向前下**；男性胸廓容积较大、胸骨较长","脊柱变短伴肋斜度变化，**胸廓顺应性**明显下降"],["肋软骨与呼吸型","新生儿肋难再抬升，主靠**膈肌腹式呼吸**；女性胸式占比高","成人兼具肋上提**胸式**与膈下降腹式双轨呼吸","肋软骨渐**钙化变脆**，弹性回缩减弱且外伤易骨折"]],"quiz":{"stem":"新生儿平卧时几乎完全依靠腹部随呼吸明显起伏（腹式呼吸为主），而很少出现成人那样的胸壁大幅度前后扩张，最根本的解剖原因是：","options":["新生儿胸骨尚未骨化融合且完全缺失前纵韧带","新生儿此时具有14对真肋且均已钙化成骨性结合","新生儿肺尖尚未越过胸廓上口且无胸膜腔负压","新生儿胸廓近圆桶状且肋骨呈水平位难以再上提"],"answer_idx":3,"explain":"新生儿胸廓前后径与横径近似呈**圆桶状**，且**肋骨几乎呈水平位**，吸气时肋骨已无明显向下斜向再上提扩径的空间，故主要依赖膈肌升降完成腹式呼吸。","remedial_node_id":"anat_trunk_thoracic_cage_apertures_motion"}},"added_at":"2026-11-18T14:51:26+08:00"},{"id":"anat_lower_bones_overview","title":"下肢骨组成、承重稳固特性与总览","subject":"anatomy","syllabus_refs":["syl_anatomy_050"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"确立下肢**承重稳固**优先的骨架逻辑，统领每侧 31 块（带骨 1 与游离 30）分部。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P2-P3","04 基础医学 上肢骨及骨联接 260915.pdf#P18"],"payload":{"bullets":["功能定位对比：下肢承担{{支撑体重}}、维持平衡与移动，故骨更粗壮，关节重{{稳定性与承重}}（对比上肢重灵活）。","下肢骨总数：成人每侧{{31 块}}（双侧 62 块），分为{{下肢带骨}}(1块)与{{游离下肢骨}}(30块)。","近远端序列：下肢带骨仅{{髋骨}}(1)；游离骨依序为{{股骨}}(1)、{{髌骨}}(1)、胫骨(1)与腓骨(1)。","足部骨构成：包括{{跗骨}}(7)、{{跖骨}}(5)与{{趾骨}}(14)，经典记忆口诀“髋股髌胫腓各一，跗七跖五趾十四”。"],"trap_note":"**下肢带骨**仅每侧1块髋骨，与骶骨、尾骨合围闭合骨盆环承重（不同于上肢锁骨+肩胛骨开环悬吊）；注 `04上肢#P18` 英文拼作 `Ppelvic girdle` 属笔误，正拼为 **Pelvic girdle**。","quiz":{"stem":"与上肢骨仅靠胸锁关节单点连于躯干以换取大范围灵活抓握不同，人体下肢带骨的骨架设计最核心的力学逻辑是：","options":["单侧髋骨与骶尾骨连成闭合骨环以承重传力","两侧髋骨靠游离肌肉悬吊于腰椎横突以增幅","腓骨上端直接楔入股骨髁间窝以分担轴向压","每侧下肢共有32块骨借胸骨柄衔接中轴骨架"],"answer_idx":0,"explain":"下肢承担支撑体重与移动核心任务（`05#P2–P3`），**下肢带骨（髋骨）**与骶骨、尾骨通过牢固的骶髂关节和耻骨联合形成闭合骨盆环，将躯干重力稳定传导至下肢，而上肢带骨（锁骨、肩胛骨）仅借胸锁关节单点开环悬吊（`04上肢#P10`）。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_hip_bone_acetabulum","title":"髋骨三骨融合、重要标志与髋臼","subject":"anatomy","syllabus_refs":["syl_anatomy_051"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"定位髂、坐、耻三骨融合于**髋臼**的格局，贯通髂窝棘迹与**闭孔**边界标志。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P4-P7","04 基础医学 上肢骨及骨联接 260915.pdf#P19"],"diagram_assets":[{"path":"assets/anat_lower_hip_bone_p005.webp","caption":"髋骨内、外侧面观及局部骨标本：清晰标示髂、坐、耻三部色区融合，髂嵴/四棘/耳状面/弓状线、坐骨大小切迹与髋臼月状面（05#P5）","source_page":5}],"payload":{"bullets":["三骨融合与闭孔：髋骨属{{不规则骨}}，由{{髂骨、坐骨与耻骨}}融合于髋臼；坐骨与耻骨支共同围成{{闭孔}}。","髂骨（翼/体）：上缘{{髂嵴}}（外唇增厚为{{髂结节}}），前后四棘为ASIS/AIIS与PSIS/PIIS；内面有{{髂窝}}、{{耳状面}}及{{弓状线}}。","坐骨（体/支）：后缘依序为{{坐骨大切迹}}、{{坐骨棘}}与{{坐骨小切迹}}；下后方肥厚粗糙隆起为{{坐骨结节}}（坐位负重处）。","耻骨（体/上/下支）：上缘锐嵴为{{耻骨梳}}（向内续{{耻骨嵴}}、外端{{耻骨结节}}），内侧面为{{耻骨联合面}}。","髋臼三构部：外侧面三骨体融合深窝，周缘覆软骨为{{月状面}}（关节面），中央非关节凹陷为{{髋臼窝}}，下缘缺口为{{髋臼切迹}}。"],"trap_note":"髋臼中央的**髋臼窝**并不直接与股骨头构成关节面，唯有周缘C形的**月状面**覆有关节软骨；另 `05#P7` 骨盆X线图注 `acetabulae` 属拉丁复数误拼，标准复数为 acetabula。","quiz":{"stem":"沿髋骨后缘自上而下依次触诊或识别各骨性标志并定位坐骨切迹与髋臼关节区时，下列解剖顺序与归属完全准确的是：","options":["髂前上棘→坐骨结节→坐骨大切迹→髋臼窝关节面","髂后下棘→坐骨大切迹→坐骨棘→坐骨小切迹→结节","髂窝耳状面→耻骨结节→弓状线→坐骨棘→月状面","髂结节→坐骨小切迹→坐骨棘→坐骨大切迹→闭孔"],"answer_idx":1,"explain":"依 `05#P5–P6`，髋骨后缘由上而下依次为髂后上棘、**髂后下棘**、**坐骨大切迹**、坐骨棘、坐骨小切迹和坐骨结节；髋臼内覆关节软骨与股骨头接触的是月状面而非中央非关节区的髋臼窝。","remedial_node_id":"anat_direct_synarthroses_types"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_femur_neck_fracture_avn","title":"股骨形态标志、股骨颈骨折与坏死","subject":"anatomy","syllabus_refs":["syl_anatomy_052"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"掌握人体最长长骨股骨三段标志，贯通**囊内股骨颈骨折**撕裂血供致坏死机制。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P8-P11","04 基础医学 上肢骨及骨联接 260915.pdf#P21"],"diagram_assets":[{"path":"assets/anat_lower_femur_fractures_p010.webp","caption":"股骨近端解剖与股骨颈骨折 6 型：1 头下型、2 经颈型（囊内易断血供）、3 转子间、4 转子下、5 大转子、6 小转子骨折（05#P10）","source_page":10}],"payload":{"bullets":["整体与近端：股骨占身高约{{1/4}}（人体最长粗大长骨）；上端有{{股骨头}}（头凹）、{{股骨颈}}、外上{{大转子}}（内侧{{转子窝}}）及内下{{小转子}}。","近端肌附着线嵴：大、小转子间前为{{转子间线}}、后为{{转子间嵴}}；后面转子下方外侧有{{臀肌粗隆}}（偶见第三转子），内侧有{{耻骨肌线}}。","骨干与远端标志：体后有{{粗线}}（内外侧唇分叉下成{{腘面}}）；下端有内/外侧髁及上髁、{{收肌结节}}、后{{髁间窝}}（髁间线）与前{{髌面}}。","股骨颈骨折6型：1{{头下型}}、2{{经颈型}}、3{{转子间}}、4{{转子下}}及5/6大小转子骨折；老年卧床谨防PE、压疮、UTI、DVT四大并发症。","血供断裂致坏死：{{头下型与经颈型}}属关节囊内骨折，撕裂沿颈上行入头的支持带血管易诱发{{股骨头缺血性坏死}}(AVN)；激素/酗酒亦增风险。"],"trap_note":"区分**前转子间线 vs 后转子间嵴**；`05#P9` 标本图将 NECK 误拼作 `NECH`，并同时示关节软骨粗糙退变（骨关节炎）与股骨头坏死对照。","quiz":{"stem":"老年患者跌倒后X线确诊为紧邻股骨头下方的囊内骨折，而另一患者仅为转子间囊外骨折。前者远期发生股骨头塌陷坏死风险骤增的关键解剖根源是：","options":["转子间嵴后方骨膜增厚完全封堵了髓腔引流","头下骨骺缺乏骨干滋养动脉且关节软骨再生强","经关节囊沿股骨颈上行供头的支持带血管撕裂","股骨粗线内外侧唇断裂致大收肌止点完全缺血"],"answer_idx":2,"explain":"结合长骨四路血供（`anat_bone_shape_macrostructure`）与 `05#P9–P10`：**头下型、经颈型**属于关节囊内骨折，骨折线直接撕裂沿股骨颈表面上行进入股骨头的支持带血管（骺动脉分支），仅靠股骨头韧带内微弱血管难以代偿，极易导致**股骨头缺血性坏死**。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_patella_tibia_fibula","title":"髌骨与胫骨承重vs腓骨定位对比","subject":"anatomy","syllabus_refs":["syl_anatomy_052"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对比最大籽骨髌骨、**内侧承重胫骨**与外侧不参膝的腓骨三骨核心标志。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P12-P14,P16-P17","04 基础医学 上肢骨及骨联接 260915.pdf#P22"],"diagram_assets":[{"path":"assets/anat_lower_tibia_fibula_p013.webp","caption":"胫骨与腓骨后、前面观：标示内/外侧髁、髁间隆起、胫骨粗隆、比目鱼肌线、腓骨头/颈及内、外踝（05#P13）","source_page":13}],"payload":{"columns":["对比骨骼","形态属性与近端标志","骨干与远端核心标志","关节参与与临床要点"],"rows":[["髌骨（1块/侧）","人体最大**籽骨**，三角形；上宽髌底、下尖髌尖","前面粗糙嵌股四头肌腱，后面覆软骨称**髌骨关节面**","仅与股骨**髌面**构成膝关节；横骨折常行张力带钢丝内固定"],["胫骨（小腿内侧）","内/外侧髁（上关节面）、**髁间隆起**、前/后区、胫骨粗隆、腓关节面","体具皮下**前嵴**、后比目鱼肌线、骨间缘与滋养孔；下端内踝、**腓切迹**","**小腿主要承重骨**；上端参与膝关节，下端与内踝共筑踝穴"],["腓骨（小腿外侧）","细长居外侧；上端膨大为**腓骨头**（头尖与关节面），下缩为腓骨颈","体具骨间缘、外侧面与后缘；下端下延为**外踝**及外踝窝","**不参与膝关节面**且不负重；外踝偏低靠后筑踝穴外壁"]],"quiz":{"stem":"外伤患者膝关节外下方腓骨颈处受直接撞击后出现骨裂，但膝关节屈伸负重面与股胫关节间隙均正常。依据下肢骨解剖，其膝关节软骨面得以幸免的直接原因是：","options":["腓骨头关节面完全嵌在髌骨后方关节面内","腓骨头后方与股骨外侧髁靠粗大韧带融合","腓骨颈紧贴胫骨粗隆正前方吸收全部冲击","腓骨不参与膝关节面构成且小腿由胫骨承重"],"answer_idx":3,"explain":"依 `05#P13、P33` 与 `04上肢#P22`，小腿两骨分工明确：**胫骨**粗壮居内侧承担主要体重并与股骨下端构成膝关节，而**腓骨**细长居外侧，仅上端腓骨头与胫骨外侧髁后下方的腓关节面相接，完全不参与膝关节面的构成。","remedial_node_id":"anat_lower_bones_overview"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_tarsals_seven_bones","title":"足骨总览与七块跗骨三列空间排布","subject":"anatomy","syllabus_refs":["syl_anatomy_053"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"借三列口诀精准锚定足背与足底**7块跗骨**空间定位与负重关系。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P15"],"diagram_assets":[{"path":"assets/anat_lower_foot_tarsals_p015.webp","caption":"足骨背（上面）与跖（下面）面观：直观呈示 7 块跗骨、跟骨结节、5 块跖骨与 14 块趾骨排布及口诀（05#P15）","source_page":15}],"payload":{"bullets":["足骨总框架：每侧足骨共{{26 块}}（比手骨少1块），包括{{跗骨}}(7)、{{跖骨}}(5)与{{趾骨}}(14)。","近侧列上层（{{距骨}}）：唯一与小腿骨成关节的跗骨，顶部有前宽后窄的{{距骨滑车}}承重，头向前伸接足舟骨。","近侧列下层（{{跟骨}}）：人体最大跗骨，位于距骨下方且向后突出形成{{跟骨结节}}（足跟着地支点），前方对接骰骨。","中间列内侧（{{足舟骨}}）：呈舟状居足内侧缘，后接距骨头、前接三块楔骨，与外侧列分隔明确。","远侧列四骨：自内向外依次为{{内侧楔骨}}、{{中间楔骨}}、{{外侧楔骨}}（前接第1–3跖骨）及外侧的{{骰骨}}（后接跟骨、前接第4–5跖骨）。"],"trap_note":"手腕骨8块（双列各4），而足跗骨仅**7块**；且**距骨在上、跟骨在下**，并非如腕骨那样全部并排处于同一水平面，这是足弓隆起与重力向下向前后分流的结构起点。","quiz":{"stem":"某足外伤患者X线显示足外侧缘一块方形跗骨骨折，该骨向后直接衔接跟骨、向前支撑第4与第5跖骨底。根据跗骨空间排布，此受累骨块为：","options":["远侧外侧骰骨","中间内侧舟骨","近侧上方距骨","远侧内侧楔骨"],"answer_idx":0,"explain":"口诀“**一二三楔骰内舟，距上跟下后出头**”（`05#P15`）：近侧列上距下跟，中间列内侧为足舟骨，远侧列内侧为1–3楔骨（对应第1–3跖骨），而居远侧列**外侧**、后接跟骨、前接第4–5跖骨底的正是**骰骨**。","remedial_node_id":"anat_lower_patella_tibia_fibula"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_sacroiliac_pubic_symphysis","title":"骨盆带连结：骶髂关节与耻骨联合","subject":"anatomy","syllabus_refs":["syl_anatomy_060"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"对比**骶髂关节**与**耻骨联合**如何兼顾骨盆闭环稳固与妊娠期分娩弹性。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P19-P23"],"payload":{"columns":["骨盆带连结结构","连结类型与关节面构成","加固结构与生理功能"],"rows":[["骶髂关节","**滑膜关节**（微动平面）；骶骨与髂骨耳状面构成","关节囊紧张且配**强韧韧带**加固；传递躯干重力至双下肢，缓冲冲击"],["耻骨联合","软骨连结（**联合**）；两侧耻骨联合面覆透明软骨","中间夹含耻骨联合腔的**纤维软骨耻骨间盘**，配耻骨上/弓韧带；孕期略松弛"],["闭孔膜与闭膜管","纤维膜封闭**闭孔**大部；膜上缘与闭孔沟围成管道","封堵骨盆下外口并供肌肉附着；**闭膜管**供闭孔血管神经穿行入股内侧"]],"quiz":{"stem":"妊娠晚期女性受松弛素调控后，骨盆前正中连结可出现轻度拉宽与微幅滑移以增大产道径线，同时仍维持极强抗压抗剪力。该结构由外向内的分层构成依次为：","options":["关节囊纤维层→滑膜层→负压滑液关节腔","耻骨联合面→透明软骨→纤维软骨耻骨间盘","骨密质外板→松质板障→红色骨髓间质网","规则致密纤维膜→骨间韧带→单纯骨性融合"],"answer_idx":1,"explain":"依 `05#P21` 冠状切面，**耻骨联合**属于软骨连结中的“联合”（`anat_direct_synarthroses_types`），由两侧耻骨联合面表面的**透明软骨**及中央富含裂隙（耻骨联合腔）的**纤维软骨耻骨间盘**构成，上下由耻骨上韧带与耻骨弓韧带加固；另注 `05#P20` 骶髂韧带图注被白块遮盖，切勿臆测未印出的韧带名称，且 `05#P22` 右侧 `Public symphysis` 应为 **Pubic symphysis**。","remedial_node_id":"histo_cartilage_three_types_matrix"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_pelvic_ligaments_brim","title":"骨盆韧带、坐骨大小孔与骨盆界线","subject":"anatomy","syllabus_refs":["syl_anatomy_058","syl_anatomy_057"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"整合骶结节与骶棘韧带围成**坐骨大小孔**，以**骨盆界线**划定大小骨盆出入口。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P22-P26","04 基础医学 上肢骨及骨联接 260915.pdf#P20"],"diagram_assets":[{"path":"assets/anat_lower_pelvis_foramina_sex_p026.webp","caption":"骨盆韧带孔道与性差对比：下示骶棘/骶结节/耻骨梳韧带封闭出坐骨大孔与小孔；上示女性 vs 男性耻骨下角形态差异（05#P26）","source_page":26}],"payload":{"bullets":["骨盆构成与界线：两侧髋骨、骶骨、尾骨及其连结围成骨盆；{{界线}}(terminal line)划出骨盆入口，分出大、小骨盆。","界线六段全环：自后向前依次为{{骶骨岬}}→{{骶翼前缘}}→{{髂骨弓状线}}→{{耻骨梳}}→{{耻骨嵴}}→{{耻骨联合上缘}}。","大小骨盆与盆腔：界线以上为{{大骨盆}}(假骨盆，托腹腔脏器)；以下为{{小骨盆}}(真骨盆)，介于{{骨盆入口}}与出口之间为骨盆腔。","骨盆出口边界：由{{尾骨尖}}、{{骶结节韧带}}、坐骨结节、坐骨支、耻骨下支与{{耻骨联合下缘}}围成（两耻骨下支夹出耻骨弓）。","两韧带封两孔：{{骶结节韧带}}(连坐骨结节)与{{骶棘韧带}}(连坐骨棘)分别将坐骨大、小切迹封闭为{{坐骨大孔}}与{{坐骨小孔}}。"],"trap_note":"**骨盆界线**走过的是**耻骨梳与耻骨嵴**（`05#P22` 右侧列表误拼 `Public crest` 实为 Pubic crest），而坐骨棘与骶结节韧带属骨盆出口及后壁范围；盆腔神经血管与肌肉多经坐骨大、小孔出入臀区与会阴。","quiz":{"stem":"臀部深层解剖或骨盆CT读片时，若沿骨盆后下壁追踪血管神经穿行通道并区分“骨盆入口（界线）”与“骨盆出口”骨性韧带边界，下列判断正确的是：","options":["坐骨大孔由骶棘韧带与坐骨小切迹共同封闭形成","骶结节韧带既参与围成坐骨小孔又构成骨盆出口","坐骨棘与骶骨岬均属于围成骨盆入口界线的标志","耻骨弓与骶翼前缘共同围成小骨盆的骨盆下出口"],"answer_idx":1,"explain":"依 `05#P24、P26`：**骶结节韧带**（骶尾骨外侧缘→坐骨结节）和**骶棘韧带**（骶尾骨外侧缘→坐骨棘）将坐骨大、小切迹封闭为坐骨大孔与坐骨小孔，同时骶结节韧带又与尾骨尖、坐骨结节等共同构成骨盆出口的菱形后外侧界；界线（骨盆入口）由骶骨岬、骶翼前缘、弓状线、耻骨梳、耻骨嵴及耻骨联合上缘组成。","remedial_node_id":"anat_lower_hip_bone_acetabulum"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_pelvis_sex_dimorphism","title":"男、女性骨盆形态特征与产道性差","subject":"anatomy","syllabus_refs":["syl_anatomy_057"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对照男女性骨盆六项核心性差，阐明女性骨盆**宽浅圆筒化**对分娩的适应。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P25-P28"],"payload":{"columns":["比较项目","男性骨盆（承重力学优先）","女性骨盆（妊娠分娩适应）"],"rows":[["整体形态与髂骨翼","整体**窄而长**；髂骨翼较垂直","整体**宽而短**；髂骨翼较水平向外展"],["骨盆入口形态","较窄，骶岬前突明显常呈**心形**","较宽阔，多呈**圆形**或横椭圆形"],["骨盆腔与出口","腔较**深窄**（漏斗状）；出口较小","腔较**浅宽**（圆筒状）；出口较大"],["耻骨下角（耻骨弓）","**夹角较小**，约 70°～75°（并指角）","**夹角较大**，约 90°～100°（拇食指角）"]],"quiz":{"stem":"产科骨盆外测量或法医骨学标本鉴定中，面对一具呈现“骨盆腔窄深似漏斗、入口心形、髂骨翼近垂直、耻骨弓顶夹角约 72°”的成人完整骨盆标本，最准确的判读是：","options":["女性骨盆因骨质疏松导致的耻骨联合软骨骨化","未成熟女童尚未完成髂坐耻融合的骨盆形态","正常女性适应胎儿经产道自然娩出的典型形态","典型男性骨盆强调躯干垂直承重与窄短杠杆力"],"answer_idx":3,"explain":"依 `05#P25–P28` 男女骨盆对比表：**男性骨盆**窄而长、髂骨翼较垂直、入口窄呈心形、骨盆腔深窄（漏斗状）、出口小且耻骨下角 **70°～75°**；而女性骨盆宽而浅（圆筒状）、入口圆或横椭圆、耻骨下角 90°～100° 以容纳胎头通过。","remedial_node_id":"anat_lower_pelvic_ligaments_brim"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_hip_joint_stability_injury","title":"髋关节稳固机制、三轴运动与撞击伤","subject":"anatomy","syllabus_refs":["syl_anatomy_056"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"解析**深髋臼与三韧带**如何造就稳固多轴球窝关节，推导跳伞与车祸伤型。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P29-P32"],"diagram_assets":[{"path":"assets/anat_lower_hip_ligaments_p029.webp","caption":"髋关节稳定结构：前髂股/耻股韧带、后坐股韧带、深化关节窝的髋臼唇及囊内含营养血管的股骨头韧带（05#P29）","source_page":29}],"payload":{"bullets":["基本构成与稳固设计：{{股骨头}}嵌入深髋臼（较肩深），周缘{{髋臼唇}}与{{髋臼横韧带}}加深关节窝，包以厚紧{{关节囊}}（深层{{轮匝带}}环颈）。","囊外三大韧带：直立牵紧稳定骨头——前上方倒Y形最强的{{髂股韧带}}(抗过伸)、前下方{{耻股韧带}}(限外展外旋)及后方{{坐股韧带}}。","囊内韧带与血供：{{股骨头韧带}}连髋臼横韧带与股骨头凹，被滑膜包被（囊内滑膜外），内含{{营养股骨头}}的细小血管。","三轴多向运动：属典型多轴{{球窝关节}}——横轴行{{屈伸}}、前后轴行{{收展}}、纵轴行{{旋内与旋外}}，三轴复合行{{环转}}。","轴向冲击损伤机制：{{跳伞}}下肢直立着地轴向冲击致股骨头穿入髋臼（{{中心性骨折脱位}}）；{{车祸}}屈髋屈膝轴向撞击致{{髋后脱位}}或前骨盆环骨折。"],"trap_note":"**[重大图注勘误]** `05#P31` 第3幅示意图（`Longitudinal axis`）实示股骨绕纵轴的**旋内与旋外**，原幻灯片中文误标为“环转”（环转需屈伸+收展两轴以上复合）；另 `05#P30` 英文图注 `Frmoral Neck` 系 Femoral Neck 误拼。","quiz":{"stem":"车祸中前排乘客在“屈髋、屈膝”坐姿下双膝猛烈撞击前仪表盘后，常出现下肢内收内旋短缩畸形且合并后上方骨性脱出。结合髋关节囊韧带力学分布，这一伤型发生的核心原因在于：","options":["屈髋屈膝时后方坐股韧带相对薄弱而股骨头直抵后上关节囊","倒Y形髂股韧带此时处于极度拉断状态使股骨头向正前脱出","股骨头韧带被骤然扯紧将股骨头横向推入闭孔形成前脱位","髋关节绕纵轴作高速环转运动导致髂骨翼发生纵向剪切断裂"],"answer_idx":0,"explain":"依 `05#P29、P32`：直立时强韧的倒Y形**髂股韧带**（前上）与耻股、坐股韧带均被牵紧；而当**屈髋屈膝**时前方髂股韧带松弛，股骨头向相对薄弱的后下方关节囊与坐股韧带顶推，膝部受轴向冲击即沿股骨干后传引发髋关节后脱位（跳伞直立着地则是股骨头沿股骨颈轴直撞髋臼底致中心性骨折脱位）。","remedial_node_id":"anat_synovial_joint_axes_classes"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_knee_joint_stabilizers","title":"膝关节囊周韧带、滑膜囊与稳动分工","subject":"anatomy","syllabus_refs":["syl_anatomy_056"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"掌握最大滑膜关节膝关节组成（**腓骨不参与**）、囊周五大韧带及**滑膜囊**分布。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P33-P38","04 基础医学 上肢骨及骨联接 260915.pdf#P23-P24"],"diagram_assets":[{"path":"assets/anat_lower_knee_stabilizers_p038.webp","caption":"膝关节稳定结构：(a) 矢状面滑囊/脂肪垫与ACL/PCL；(b) 顶面 C/O 形半月板；(c) 前面髌韧带、支持带与内外副韧带（05#P38）","source_page":38}],"payload":{"bullets":["骨面与运动轴：人体最大滑膜关节，由{{股骨下端、胫骨上端与髌骨}}构成（{{腓骨不参与}}）；以{{屈、伸}}为主，{{屈膝时}}可作小幅旋转。","囊外前两侧韧带：囊薄松靠周缘加固——前有{{髌韧带}}与髌内外侧支持带，内侧有贴囊的{{胫侧副韧带}}，外侧有索状不贴囊的{{腓侧副韧带}}。","囊外后与连接韧带：后方有{{腘斜韧带}}（半膜肌腱延续）与{{腘弓韧带}}加固；前有{{膝横韧带}}连两半月板，后有{{板股后韧带}}（`04上肢#P23`）。","囊内交叉韧带：{{前、后交叉韧带}}位于{{纤维关节囊内、滑膜外}}，在屈伸全程紧张防止胫骨前后错移。","滑膜囊与皱襞垫：{{髌下脂肪垫}}填前间隙并突入{{翼状襞}}与髌下滑膜襞；周围有与腔相通的{{髌上囊}}及髌前囊、髌下皮下/深囊减摩。"],"trap_note":"勘误：`04上肢#P24` 错把胫侧副韧带混排在“外：”行（应为**内侧胫侧副、外侧腓侧副**）；`05#P34` 图注 `Patelar lig.` 漏拼一 `l`（正拼 Patellar lig.）；交叉韧带属**囊内滑膜外**而非浸泡在滑液内。","quiz":{"stem":"膝关节滑膜腔行穿刺抽液或关节镜前外侧入路操作时，若针尖穿经紧贴关节面后方的前交叉韧带表面包膜却并未抽出滑液，此时解剖层次尚处于：","options":["胫侧副韧带与内侧半月板外缘的融合纤维","膝关节纤维囊内部但位于滑膜层被覆的外侧","髌上囊顶端与股四头肌深层之间的游离肌间隙","腓侧副韧带与腓骨头韧带交汇的关节囊外层"],"answer_idx":1,"explain":"依 `05#P38`，**前、后交叉韧带**位于**关节纤维囊内、滑膜之外**（被滑膜向前反折包绕，故未直接浸泡于关节滑液腔内）；而髌上囊在股四头肌腱深面通常直接与膝关节滑膜腔相通（`05#P37`）。","remedial_node_id":"anat_joint_basic_auxiliary_motion"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_knee_menisci_cruciate_matrix","title":"半月板C/O形差异与前后交叉韧带","subject":"anatomy","syllabus_refs":["syl_anatomy_056"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"对照内侧C形与外侧O形半月板活动度及 **ACL 与 PCL** 限位方向，推导运动损伤。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P33-P40","04 基础医学 上肢骨及骨联接 260915.pdf#P23-P24"],"payload":{"columns":["膝内稳定结构","形态走形与关键毗邻","力学限制功能与临床易损机制"],"rows":[["内侧半月板","较大呈**“C”形**；外缘紧附胫侧副韧带致活动度小","深化适配与减震；屈膝旋转挤压**极易撕裂**（桶柄/鹦鹉嘴等6型）"],["外侧半月板","较小近**“O”形**；不连腓侧副韧带且毗邻腘肌腱","活动度较大故撕裂相对少；继发软骨磨损可致**骨关节炎**与置换"],["前交叉韧带(ACL)","起自胫骨髁间前区，斜向**后上外**止于股骨外侧髁内面","伸膝拉紧**限制胫骨前移**；急停扭转易断致前抽屉试验阳性"],["后交叉韧带(PCL)","起自胫骨髁间后区，斜向**前上内**止于股骨内侧髁外面","屈膝拉紧**限制胫骨后移**；胫骨近端后撞击易断致后抽屉阳性"]],"quiz":{"stem":"篮球运动员屈膝变向急停时胫骨相对股骨猛烈外旋并伴膝外翻撞击，术后发现同时合并内侧副韧带、前交叉韧带与一侧半月板联合撕裂（“悲惨三联征”）。最常同遭撕裂的半月板及解剖诱因是：","options":["外侧半月板近O形且外缘直接融合于腓侧副韧带","内侧半月板因膝横韧带牵拉向前完全脱出关节腔","内侧半月板呈C形且外缘贴附胫侧副韧带活动受限","外侧半月板受腘斜韧带向上拉扯致纵向桶柄撕裂"],"answer_idx":2,"explain":"依 `05#P33–P36`：**内侧半月板**呈较大“C”形且外缘与**胫侧副韧带**紧密相连，活动度明显小于呈“O”形且不与腓侧副韧带相连的外侧半月板；当屈膝旋转并发外翻应力牵扯胫侧副韧带与ACL时，活动受限的内侧半月板极易在股胫髁间被挤压撕裂。","remedial_node_id":"histo_cartilage_three_types_matrix"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_ankle_mortise_sprain","title":"踝穴距骨滑车几何与足内翻扭伤机制","subject":"anatomy","syllabus_refs":["syl_anatomy_056"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"揭示**距骨滑车前宽后窄**几何锁合与两侧韧带强弱差如何决定内翻伤靶点。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P42-P44"],"diagram_assets":[{"path":"assets/anat_lower_ankle_mortise_p042.webp","caption":"踝关节与胫腓连结立体图：A 踝穴咬合与下胫腓韧带，B–C 距骨滑车“前宽后窄”楔入内外踝之间（05#P42）","source_page":42}],"payload":{"steps":[{"cue":"骨性咬合与运动轴：胫骨下端与内外踝如何扣住距骨滑车，属于何种关节？","reveal":"胫骨下端与内踝、外踝共同围成“门框”状**踝穴**，咬合距骨滑车构成单轴**滑车（屈戌）关节**；关节囊前、后壁薄松，仅绕冠状轴作背屈与跖屈。","mechanism_tag":"踝穴滑车单轴屈伸"},{"cue":"两侧韧带力学对比：内侧与外侧副韧带在形态与抗拉强度上有何悬殊？","reveal":"内侧为宽厚强韧的扇形**三角韧带**（稳固抗外翻）；外侧则由相对分散且较薄弱的三条独立韧带——**距腓前、跟腓与距腓后韧带**加固（且外踝低于内踝）。","mechanism_tag":"内强三角vs外弱三束"},{"cue":"几何稳定性反转：为何足“背屈”极稳而“跖屈”却变松易崴脚？","reveal":"距骨滑车顶面呈**前宽后窄**楔形（`05#P42C`）：**背屈**时较宽的前部楔入踝穴撑紧下胫腓联合而高度稳定；跖屈时较窄的后部滑入踝穴，侧方骨性间隙增大而松动。","mechanism_tag":"前宽后窄几何锁合"},{"cue":"临床常见扭伤定案：下楼梯踩空或穿高跟鞋足内翻扭伤最先撕裂哪条韧带？","reveal":"足处于**跖屈位**时踝穴最松，叠加外侧韧带薄弱与内翻趋势，外侧前缘张力集中于**距腓前韧带**，使其成为踝关节扭伤最常撕裂的靶点。","mechanism_tag":"跖屈内翻伤距腓前"}],"takeaway":"背屈宽部楔入**踝穴**极稳，而跖屈窄部入穴松动叠加外侧韧带弱于内侧三角韧带，决定了跖屈内翻最易撕裂**距腓前韧带**。","quiz":{"stem":"急诊接诊一名穿高跟鞋下楼梯踩空致右踝急剧跖屈内翻扭伤、外踝前下方肿胀压痛剧烈而内踝无明显压痛的患者。医生结合踝关节几何与韧带力学判断其最先受损的韧带是：","options":["跟腓后交叉韧带","小腿骨间膜下段","内侧三角韧带深层","外侧距腓前韧带"],"answer_idx":3,"explain":"足跖屈位时**距骨滑车**较窄的后部位于踝穴内使骨性卡锁最松（`05#P42–P43`），加之强韧的内侧**三角韧带**与低伸的外踝共同限制外翻而迫使足向内翻，使外侧三韧带中最靠前且最薄弱的距腓前韧带最先承受过度张力而撕裂。","remedial_node_id":"anat_synovial_joint_axes_classes"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_foot_arches_structure","title":"足弓三弓构成、维系机制与扁平足","subject":"anatomy","syllabus_refs":["syl_anatomy_059"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"【补全】拆解**三弓骨性构成**、静动力悬吊机制与**扁平足**发病规律。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P18(目录列及足部关节，P43止于踝关节；依复旦《系统解剖学》大纲补全)"],"payload":{"bullets":["整体构型与功能：跗跖骨借韧带肌腱联成凸向上的弹性{{足弓}}，以{{跟骨结节及第1、5跖骨头}}三点负重，缓冲震荡并护足底血管神经。","内侧纵弓（弹性弓）：弓高富弹性，由{{跟骨、距骨(弓顶)、足舟骨}}、{{3块楔骨}}及{{第1–3跖骨}}构成，主司跑跳弹性推进。","外侧纵弓（支撑弓）：弓低而稳固，由{{跟骨、骰骨}}及{{第4–5跖骨}}构成，着地面积稳、主司直立持续负重。","横弓横向稳定：由{{骰骨、3块楔骨}}及{{第1–5跖骨基部}}共同构成凸向上方的横向拱形，增强前中足横向抗压。","维系与扁平足：静力靠骨楔合、{{跖长/弹簧韧带}}及足底腱膜，动力靠{{胫骨后肌与腓骨长肌}}交叉悬吊；松弛塌陷致{{扁平足}}压迫痛。"],"trap_note":"**[课件漏讲补全说明]** 原课件 `05#P18` 仅于目录预告足部关节，P43即告结未展开 `syl_anatomy_059` 足弓；注意**距骨是内侧纵弓的最高弓顶**（而非外侧纵弓成员），且第1跖骨头与第5跖骨头+跟骨结节共同构成足底三点负重面。","quiz":{"stem":"长期负重站立或胫骨后肌肌腱功能衰竭患者出现足内侧缘贴地塌陷、步态丧失弹性且足底伴放射性压痛（典型获得性扁平足）。以下关于塌陷核心结构与受损机制的描述正确的是：","options":["受累最高弹性弓为内侧纵弓，距骨下陷致足底神经血管受压","塌陷主因外侧纵弓失去骰骨与第4–5跖骨间的弹性缓冲","足横弓仅由7块跗骨组成而跖骨基部完全不参与维持拱形","正常直立时重力全集中于足舟骨结节单点直接接触地面"],"answer_idx":0,"explain":"依《系统解剖学》标准：**内侧纵弓**（跟-距[弓顶]-舟-三楔-1~3跖）最高且富弹性，依赖跟舟足底韧带（弹簧韧带）、足底腱膜及**胫骨后肌**等悬吊；其塌陷时距骨头向内下移位压平内侧纵弓，丧失三点负重缓冲并压迫足底血管神经引起疼痛。","remedial_node_id":"anat_lower_tarsals_seven_bones"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_landmarks_metatarsals_phalanges","title":"跖趾骨分部与下肢体表骨性标志","subject":"anatomy","syllabus_refs":["syl_anatomy_054","syl_anatomy_055"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"汇总跖骨5与趾骨14分部及下肢从髋至足的**体表骨性标志**定位坐标。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P5,P8,P13,P15","04 基础医学 上肢骨及骨联接 260915.pdf#P18,P21-P22"],"payload":{"bullets":["跖骨5块分部：由内向外第1–5跖骨各分{{跖骨底}}(近端)、{{跖骨体}}与{{跖骨头}}(远端)；第5跖骨底外侧向后外突出{{第5跖骨粗隆}}体表可触。","趾骨14块分部：{{第1趾(拇趾)仅2节}}(近节与远节趾骨)，{{第2–5趾各3节}}(近/中/远节)，各节分底、体与滑车/粗隆。","髋股部标志：体表可触{{髂嵴、髂前上棘、髂后上棘}}、坐骨结节（坐位支点）、{{耻骨结节}}、{{股骨大转子}}(测股骨干与髋脱位)及股骨内外上髁。","膝踝足标志：可触{{髌骨}}、{{胫骨粗隆}}与皮下{{胫骨前嵴}}、{{腓骨头}}(避腓总神经)、{{内踝}}、{{外踝}}及后下方{{跟骨结节}}。"],"trap_note":"内、外踝在临床脉管穿刺与神经保护上至关重要：**大隐静脉恒经内踝前方**上行，**小隐静脉绕外踝后方**上行；膝外侧腓骨头/腓骨颈紧贴腓总神经，石膏压迫极易致足下垂。","quiz":{"stem":"临床急诊需行下肢隐静脉穿刺建立通路，并在膝外侧打石膏固定小腿骨折时预防神经压迫。下列利用下肢体表骨性标志进行的操作定位准确的是：","options":["于内踝后方1 cm处寻及大隐静脉起始主干穿刺","在耻骨结节正上方两横指处直接定位跟骨结节支点","石膏塑形时需在腓骨颈及腓骨头下方垫厚棉防压神经","第1足趾由近节、中节和远节三块趾骨串联构成"],"answer_idx":2,"explain":"**腓骨头与腓骨颈**体表明显且紧邻贴骨走行的腓总神经，固定时须充分衬垫减压；大隐静脉经**内踝前方**上行，小隐静脉绕外踝后方上行（`anat_lower_limb_veins`）；且拇趾仅有近/远2节趾骨（`05#P15`）。","remedial_node_id":"anat_lower_limb_veins"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_lower_tibiofibular_foot_joints","title":"小腿骨连结与足部诸关节定位","subject":"anatomy","syllabus_refs":["syl_anatomy_061","syl_anatomy_062"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"【含062补全】梳理**胫腓三连结**锁合踝穴，补齐**足部诸关节**位置功能。","source_slides":["05 基础医学 下肢骨及其连结 20260920.pdf#P18,P41-P42","04 基础医学 上肢骨及骨联接 260915.pdf#P23-P24"],"payload":{"bullets":["近侧胫腓关节：由{{腓骨头关节面}}与胫骨外侧髁{{腓关节面}}构成微动平面关节，借{{腓骨头前、后韧带}}加固（`04上肢#P23–P24`）。","小腿骨间膜：连接胫、腓两骨{{骨间缘}}的纤维膜（韧带连结），向上下传递应力、分隔前后肌群并供{{小腿肌附着}}。","远侧胫腓联合：由胫骨下端{{腓切迹}}与腓骨下端借{{胫腓前/后韧带与骨间韧带}}紧密连结，紧锁{{踝穴}}防止距骨劈开。","跗骨间关节【补全】：含距骨与跟骨间{{距跟(距下)关节}}、{{距跟舟关节}}与{{跟骰关节}}（后二者合称跗横关节），主司足内翻外翻。","跗跖与跖趾【补全】：{{跗跖关节}}(3楔+骰 vs 1–5跖骨底)微动稳足弓；{{跖趾关节}}(跖骨头 vs 近节趾骨底)行屈伸与微收展。"],"trap_note":"**[课件漏讲补全说明]** 原课件 `05#P41–P42` 详述了小腿胫腓连结（注意 `P41` 英文图将 Fibula 误拼为 `Fibular`），但 P43 讲完踝关节后遗漏了 `syl_anatomy_062`；须明确足的**内翻/外翻主要发生在距下关节与跗横关节**，而非单轴滑车型的踝关节。","quiz":{"stem":"踝关节（距小腿关节）仅为单轴滑车关节，只能沿冠状轴做背屈与跖屈；但人在崎岖路面行走时足部仍能灵活完成内翻与外翻微调。主要承担足内翻、外翻运动的关节组合定位于：","options":["远侧胫腓骨间韧带联合与小腿骨间膜之间","近侧胫腓关节的腓骨头与胫骨外侧髁之间","跗骨间关节（距下关节与距跟舟/跟骰关节）","远侧第2至第5趾骨滑车与远节趾骨底之间"],"answer_idx":2,"explain":"依《系统解剖学》定位（`05#P42` 及 `syl_anatomy_062` 补全）：**踝关节**仅作背屈/跖屈；而足的内翻与外翻主要发生于距骨下方的**距跟（距下）关节**以及距跟舟关节、跟骰关节（合称跗横关节/Chopart关节）等跗骨间关节；跗跖关节（Lisfranc关节）位于远侧跗骨与跖骨底间起稳定微动作用，跖趾关节主要作屈伸运动。","remedial_node_id":"anat_lower_ankle_mortise_sprain"}},"added_at":"2026-11-18T15:16:27+08:00"},{"id":"anat_skull_divisions_age_overview","title":"颅的分部、23块骨与年龄比例","subject":"anatomy","syllabus_refs":["syl_anatomy_028"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"成人颅含**23块骨**（脑颅8+面颅15），脑面颅比例随颌面生长从3∶1降至2∶1。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P2-P5,P43"],"payload":{"bullets":["计数口径：成人共{{23块颅骨}}（不含6块听小骨，计入共{{29块}}）；本课程将{{舌骨}}归入面颅15块。","分部功能：后上方{{脑颅骨}}（8块）围成颅腔保护脑；前下部{{面颅骨}}（15块）围成{{眶、鼻腔与口腔}}支架。","比例演进：新生儿脑颅与面颅比例约{{3∶1}}（面颅仅占全颅1/8），成人面颅增速追至约{{2∶1}}（占1/4）。","发育调控：适度{{机械负荷}}（咀嚼呼吸肌牵拉）联合遗传、激素及营养共同引导颅骨生后塑形改建。"],"trap_note":"英文教材常将舌骨单列（计 22 块颅骨），审题需认准国内课程标准口径：23 块（含舌骨、不含 6 块听小骨）。","quiz":{"stem":"一名新生儿头颅占比极大而面庞短小，随乳牙萌出、咀嚼负荷增加及鼻旁窦充气至成年期，其面颅占全颅的比例及脑面比例发生了何种演进？","options":["面颅占比由1/8升至1/4且脑面比由3∶1降至2∶1","面颅占比由1/4降至1/8且脑面比由2∶1升至3∶1","脑颅与面颅等速增长使二者比例始终恒定在3∶1","听小骨随年龄并入面颅使颅骨总数由23增至29"],"answer_idx":0,"explain":"新生儿脑发育领先，脑颅大而面颅仅占全颅1/8（脑面比约**3∶1**）；生后随牙齿萌出、咀嚼肌负荷及鼻旁窦发育，面颅加速生长至成人占1/4（脑面比约**2∶1**），而颅骨总数（**23块**，另6块听小骨）恒定不变。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_sphenoid_temporal_ethmoid","title":"脑颅8骨与蝶颞筛三块复杂骨","subject":"anatomy","syllabus_refs":["syl_anatomy_029"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"脑颅6种8骨围成颅腔，**蝶骨**居中贯通三窝、**颞骨**岩部藏耳迷路、**筛骨**呈巾形通嗅觉。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P3,P6-P13,P46-P48"],"diagram_assets":[{"path":"assets/anat_skull_sphenoid_parts_p09.webp","caption":"蝶骨在颅底位置及游离标本上/前面观：一体（含蝶鞍与蝶窦）、小翼、大翼与翼突（P9）","source_page":9}],"payload":{"bullets":["脑颅6种8骨：不成对4块为{{额骨}}（眶顶/额窦）、{{筛骨}}、{{蝶骨}}、{{枕骨}}（枕髁/枕骨大孔）；成对2对为{{顶骨}}、{{颞骨}}。","蝶骨一体三突：{{蝶骨体}}含蝶窦、{{蝶鞍}}（垂体窝/鞍背）与前缘{{筛棘}}；小翼穿视神经管，大翼排{{圆卵棘三孔}}，翼突分内外侧板。","颞骨三分部：分为{{鳞部}}、{{岩部}}（上面{{鼓室盖}}、后面{{内耳门}}）及{{鼓部}}；注意{{乳突}}仅属骨性突起而非独立分部。","筛骨“巾”字构型：上方{{鸡冠}}与水平{{筛板}}（筛孔通嗅丝），中央{{垂直板}}成鼻中隔上部，两侧{{筛骨迷路}}含筛窦、眶板及上/中鼻甲。","岩部与中耳互通：颞骨乳突内含{{乳突小房}}，经乳突窦向前直接通连中耳{{鼓室}}，是中耳炎向颅后扩散路径。"],"trap_note":"两大易错点：P8 图中“筛棘（Ethmoidal spine）”位于蝶骨体前缘（与筛板相接）而非筛骨；P11 筛骨“Ceribrifom/Pendicular”为拼写笔误，且蓝色数字误标。","quiz":{"stem":"关于颅底中心脑颅诸骨的结构归属与临床毗邻关系，以下解剖学判定哪一项最准确？","options":["颞骨乳突属于与鳞部并列的第四独立分部","蝶骨体前正中伸出筛棘与筛骨筛板相接","筛骨迷路向内下伸出上中下三对鼻甲板","乳突小房借骨膜封闭而不与中耳鼓室相通"],"answer_idx":1,"explain":"**筛棘（Ethmoidal spine）**位于蝶骨体前缘正中（P8/P9），与筛板相接；颞骨仅分**鳞、岩、鼓**三部，乳突属突起且借乳突窦通鼓室；筛骨仅生**上、中鼻甲**，下鼻甲为独立面颅骨。","remedial_node_id":"anat_skull_divisions_age_overview"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_facial_maxilla_mandible","title":"面颅15骨与上下颌骨结构重塑","subject":"anatomy","syllabus_refs":["syl_anatomy_030"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"面颅9种15骨支架五官，**上颌骨**一体四突含窦，唯一可动的**下颌骨**随失牙废用萎缩。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P4,P14-P23,P48-P49"],"diagram_assets":[{"path":"assets/anat_skull_mandible_resorption_fractures_p15.webp","caption":"下颌骨失牙后废用性骨吸收（颏孔相对上移）、无牙与新生儿下颌对比及骨折部位占比分布（P15）","source_page":15}],"payload":{"bullets":["面颅9种15骨：不成对3块为{{下颌骨}}、{{犁骨}}（鼻中隔后下）、{{舌骨}}；成对6对为{{上颌、鼻、泪、颧、腭、下鼻甲}}。","上颌骨一体四突：{{上颌体}}内含上颌窦，向外伸出{{额突、颧突、牙槽突、腭突}}（腭突+腭骨水平板共筑硬腭）。","下颌骨标志：{{下颌体}}外有{{颏孔}}，{{下颌支}}内面有{{下颌孔}}（下牙槽神经阻滞点），上端前{{冠突}}、后{{髁突}}（下颌头）。","失牙废用萎缩：多颗牙长期脱落触发牙槽骨{{废用性萎缩}}，使{{颏孔}}位置显著上移并接近剩余牙槽嵴顶（P15）。","下颌骨骨折分布：好发依次为{{联合19.2%}}、{{下颌体18.1%}}、{{下颌角16.2%}}、{{髁突14.8%}}、髁下12.6%与支11.3%（P15）。"],"trap_note":"下鼻甲是成对的独立面颅骨，切勿混同筛骨的上/中鼻甲；外伤时下颌联合、下颌体与髁突颈部因应力集中及截面突变最易骨折。","quiz":{"stem":"长期全口无牙的老年患者行下颌神经阻滞麻醉或义齿基托压迫时，医师发觉原本居于下颌体中部的颏孔几乎贴近牙槽嵴顶缘，其根本机制是：","options":["下颌骨下缘随衰老向下方高速新骨沉积","髁突与冠突骨质过度增生向上牵拉下颌体","牙槽突缺失咬合刺激而发生严重废用性萎缩","颏神经干随年龄增长主动向上穿透密质骨"],"answer_idx":2,"explain":"P15 明确提示：多颗牙丧失后牙槽骨失去咀嚼**机械负荷**，引发渐进性**废用性骨吸收**（10 年至 30 年高度锐减），下颌体上部塌缩而使原本位置相对固定的**颏孔**显得贴近牙槽嵴顶。","remedial_node_id":"anat_bone_shape_macrostructure"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_lateral_pterion_hematoma","title":"翼点H形汇合与硬膜外血肿机制","subject":"anatomy","syllabus_refs":["syl_anatomy_031"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"**翼点**为四骨H形薄弱交界，骨折撕裂深面**脑膜中动脉前支**诱发急性硬膜外血肿。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P26,P31,P43"],"diagram_assets":[{"path":"assets/anat_skull_lateral_pterion_p26.webp","caption":"颅侧面观：额、顶、颞骨鳞部与蝶骨大翼H形相接构成翼点，邻颧弓、外耳门与乳突（P26）","source_page":26}],"payload":{"steps":[{"cue":"定位与骨缝构筑：颅侧面颞窝内哪四块骨相接成薄弱的H形翼点？","reveal":"额骨、顶骨、颞骨鳞部与蝶骨大翼四骨在颞窝前下部交会成H形骨缝，称**翼点（pterion）**，缺乏厚板障缓冲而骨质极薄（P31）。","mechanism_tag":"四骨H形交界"},{"cue":"深面血管毗邻：是什么血管紧贴翼点内板骨沟走行？","reveal":"起自上颌动脉的**脑膜中动脉**经棘孔入颅后，其前支直接紧贴翼点内表面骨沟向上行走，部分骨沟甚至闭合为骨管，使血管被骨壁牢牢固定。","mechanism_tag":"动脉沟贴合"},{"cue":"外伤力学瀑布：颞部遭钝击骨折为何引发危及生命的急症？","reveal":"翼点微裂即可直接割破被固定在骨沟内的脑膜中动脉前支；高压动脉血强行剥离硬脑膜外层与颅骨内板，形成双凸透镜状**硬膜外血肿**压迫脑干。","mechanism_tag":"硬膜外血肿"}],"takeaway":"**翼点**是额、顶、颞鳞、蝶大翼H形薄弱区，内面紧贴脑膜中动脉前支，骨折易致高压动脉性**硬膜外血肿**。","quiz":{"stem":"患者左侧颞部受球棒撞击后短暂清醒，数小时后突发剧烈头痛伴左侧瞳孔散大及右侧偏瘫，急诊CT示左颞顶部双凸透镜形高密度影。受损血管直接经过哪一颅底骨孔入颅？","options":["右侧颈动脉管与破裂孔交界处","同侧卵圆孔伴行下颌神经主干","同侧枕骨大孔与椎动脉并行","同侧蝶骨大翼棘孔入颅中窝"],"answer_idx":3,"explain":"撞击点翼点内面紧邻脑膜中动脉前支，动脉撕裂致典型双凸透镜状**硬膜外血肿**；该动脉本身经蝶骨大翼后外侧的**棘孔**进入颅中窝，而非经卵圆孔或破裂孔。","remedial_node_id":"histo_flat_bone_diploe_structure"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_cranial_fossae_layout","title":"颅底内面三窝阶梯分界与容纳","subject":"anatomy","syllabus_refs":["syl_anatomy_032"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"颅底内面呈**前高后低三级阶梯**，以蝶骨小翼与颞骨岩部为界分别托举额叶、颞叶垂体与脑干小脑。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P28-P29,P33"],"payload":{"columns":["颅窝名称（位置高低）","主要构成骨与后界分界线","容纳脑结构与薄弱临床关联"],"rows":[["颅前窝（最高最浅）","额骨眶部+筛骨筛板+蝶骨小翼；后界为**蝶骨小翼后缘**与前床突","容纳大脑额叶；筛板薄而多孔，骨折撕裂硬膜易致**脑脊液鼻漏**与嗅觉丧失"],["颅中窝（居中似蝶形）","中央蝶骨体（蝶鞍）+两侧大翼与岩部前面；后界为鞍背与**岩部上缘**","容纳大脑颞叶与垂体；垂体瘤压迫视交叉，岩部**鼓室盖**极薄易传中耳感染"],["颅后窝（最深最大）","枕骨（斜坡/枕鳞）+颞骨岩部后面；前界为鞍背及岩部上缘，后止横窦沟","容纳小脑、脑桥和延髓；幕下占位迫使小脑扁桃体经**枕骨大孔**疝入延髓"]],"quiz":{"stem":"颅底外伤或中耳病变引发不同定位体征时，若患者出现外耳道流血性脑脊液伴颞叶脑挫裂伤，但无嗅觉丧失及枕下脑干受压表现，最提示病变累及哪一颅窝及分界标志？","options":["介于蝶骨小翼后缘与岩部上缘间的颅中窝","位于蝶骨小翼后缘前方的颅前窝筛板","位于颞骨岩部后缘下方的颅后窝斜坡","完全局限于颅盖顶骨矢状缝旁的板障"],"answer_idx":0,"explain":"**颅中窝**前起蝶骨小翼后缘、后止鞍背与颞骨岩部上缘（P33），内部容纳大脑颞叶并横跨颞骨岩部**鼓室盖**与内耳门，故岩部骨折常引起外耳道脑脊液漏及颞叶损伤。","remedial_node_id":"anat_skull_sphenoid_temporal_ethmoid"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_cranial_base_foramina","title":"颅底十大孔裂管与神经血管通行","subject":"anatomy","syllabus_refs":["syl_anatomy_032"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"按前中后三窝系统归位**P45十大孔裂管**及CN I–XII通路，严防**破裂孔**颈内动脉穿行误区。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P28-P30,P45"],"diagram_assets":[{"path":"assets/anat_skull_cranial_base_foramina_p29.webp","caption":"颅底内面观主要孔、管、裂与静脉窦沟定位（注意P28/P29中盲孔与筛孔勿混，且Porcess系原图拼误）（P29）","source_page":29}],"payload":{"columns":["所在颅窝与孔裂管","核心通过神经与血管结构（P45标准表）","高频陷阱与临床辨析"],"rows":[["颅前窝：筛孔","传导嗅觉的**嗅神经丝**（CN I）经筛板多孔垂直入颅止于 ":2,"explain":"眶底主要由薄弱的**上颌骨眶面**构成（下方即上颌窦），其上行有通向**眶下孔**的**眶下沟/管**（含眶下神经，司下睑/上唇感觉）；爆裂性眶底骨折时眼下直肌嵌顿致上视受限，卡压眶下神经致面颊上唇麻木。","remedial_node_id":"anat_skull_cranial_base_foramina"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_nasal_cavity_sinuses","title":"骨性鼻腔四壁与鼻旁窦引流","subject":"anatomy","syllabus_refs":["syl_anatomy_033"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"骨性鼻腔分顶底及中隔外侧壁，**四组鼻旁窦**减重温湿共鸣并分道开口于**中鼻道**与**蝶筛隐窝**。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P19-P22,P35-P37,P41-P42"],"diagram_assets":[{"path":"assets/anat_skull_nasal_septum_lateral_wall_p41.webp","caption":"鼻腔外侧壁（三鼻甲/鼻道、蝶筛隐窝、蝶腭孔）与鼻中隔（垂直板、犁骨、软骨及额/蝶窦）对照（P41）","source_page":41}],"payload":{"bullets":["顶与底边界：顶由鼻骨、额骨鼻部及{{筛板}}组成；底为{{骨腭}}（前{{上颌骨腭突}}+后{{腭骨水平板}}，P42）。","内侧与外侧壁：{{骨性鼻中隔}}由{{筛骨垂直板}}（上）和{{犁骨}}（下）组成；外侧壁上/中鼻甲属筛骨，{{下鼻甲}}为独立骨。","四组鼻旁窦功能：{{额窦、筛窦、上颌窦、蝶窦}}均含气并开口于鼻腔，司{{减轻颅重}}、温湿吸入气及{{增强发声共鸣}}。","核心引流与入路：{{额窦}}向下经鼻额管引流至{{中鼻道}}（P36）；{{蝶窦}}开口于上鼻甲后上方的{{蝶筛隐窝}}（P42），正对蝶鞍垂体窝。"],"trap_note":"极高危原片纠偏：P37 矢状切面把垂体窝下方的“蝶窦”英文误标为 Ethmoidal Sinus（应为 Sphenoidal Sinus）；P36 上颌窦蓝色箭头方向画反。","quiz":{"stem":"神经外科医生经鼻腔微创切除垂体瘤（经蝶入路）时，在内镜下循鼻中隔后上方越过上鼻甲后，紧贴哪一隐窝切开即可直接进入垂体窝前下方的蝶窦腔？","options":["位于下鼻甲外下方的下鼻道鼻泪管口","位于中鼻甲下方的中鼻道额窦引流沟","位于上鼻甲上方与筛板交界的嗅区隙","位于上鼻甲后上方的蝶筛隐窝蝶窦口"],"answer_idx":3,"explain":"P20、P21 与 P42 清晰显示：**蝶窦**直接开口于上鼻甲后上方的**蝶筛隐窝**，且蝶窦顶壁即为垂体窝鞍底，是经鼻蝶入路切除垂体瘤的解剖走廊（注意 P37 误将蝶窦英文写成了 Ethmoidal Sinus）。","remedial_node_id":"anat_skull_sphenoid_temporal_ethmoid"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_tmj_structure_motion","title":"颅骨三连结与颞下颌关节脱位","subject":"anatomy","syllabus_refs":["syl_anatomy_034"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"颅骨以**颅缝/软骨/TMJ**三式连结；关节盘分双腔，大张口时下颌头前滑越过**关节结节**致前脱位。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P38-P39,P43"],"diagram_assets":[{"path":"assets/anat_skull_tmj_motion_p39.webp","caption":"颞下颌关节构造（下颌窝、关节结节、关节盘、关节囊）及闭合、轻张口、大张口前滑运动轨迹（P39）","source_page":39}],"payload":{"steps":[{"cue":"三式总览与双腔构造：颅骨连结中唯一可动滑膜关节的关节面与关节盘如何分隔？","reveal":"除颅缝（纤维连结）与颅底软骨结合外，颞下颌关节由下颌头与颞骨下颌窝及关节结节构成，囊内**关节盘**将其分为上（滑动）、下（转动）两腔（P38）。","mechanism_tag":"关节盘分上下腔"},{"cue":"张闭口耦合轨迹：从轻张口到大张口（P39），下颌头与关节盘如何接力运动？","reveal":"轻张口主要在下腔绕冠状轴转动；大张口时，翼外肌牵引下颌头连同关节盘在上腔沿下颌窝前壁显著**向前滑动**至关节结节下方（P39）。","mechanism_tag":"转动转向前滑"},{"cue":"前脱位杠杆危机：过度大张口（大笑/打哈欠）为何必定发生“前”脱位而非后脱位？","reveal":"TMJ关节囊前壁薄松而阻力小；大张口过猛时，下颌头**向前越过关节结节**并被咀嚼肌痉挛锁死于颞下窝，复位须先向下再向后推回。","mechanism_tag":"前越关节结节"}],"takeaway":"两侧颞下颌关节协同运动，关节盘分上滑下转两腔；前囊薄松使过度大张口时下颌头易向前越过关节结节发生**前脱位**。","quiz":{"stem":"患者打哈欠后双侧耳屏前凹陷、下颌前伸呈“闭口不能”状态，确诊颞下颌关节脱位。下列关于下颌头脱位方位与徒手复位施力方向的组合，正确的是：","options":["下颌头向前滑越关节结节，复位须向下再向后推","下颌头向后撞破外耳道前壁，复位须向上再向前拉","下颌头向上嵌入颅中窝底，复位须纯水平向内侧推","下颌头向下脱离关节囊，复位须先向后上方直接提拉"],"answer_idx":0,"explain":"P39示大张口时下颌头与关节盘向前滑向关节结节；过度张口导致下颌头**向前越过关节结节**前坡而被咀嚼肌拉住锁闭，故复位必须克服肌痉挛先**向下**使其低于关节结节顶，再**向后**送回下颌窝。","remedial_node_id":"anat_joint_basic_auxiliary_motion"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_neonatal_fontanelles","title":"新生儿颅比例、四囟与生后演进","subject":"anatomy","syllabus_refs":["syl_anatomy_035"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"新生儿面颅仅占全颅**1/8**，未骨化**四囟**（前囟菱形1–2岁闭合、后囟三角6–8周闭合）承压塑形与临床触诊。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P5,P32,P43"],"diagram_assets":[{"path":"assets/anat_skull_neonatal_fontanelles_p32.webp","caption":"新生儿颅侧面与上面观：前囟（菱形）、后囟（三角形）、蝶囟、乳突囟及三大颅缝（P32）","source_page":32}],"payload":{"columns":["新生儿颅核心特征","解剖定位与形态/数值","闭合时窗与临床意义"],"rows":[["脑面颅比例差","面颅仅占全颅**1/8**（成人1/4），脑面比3∶1→2∶1","因胎期脑速长而牙/颌/鼻旁窦未发育；生后颌面加速追赶"],["前囟（最大膜性间隙）","位于矢状缝与冠状缝交会处，呈**菱形**","通常**1–2岁**闭合；临床触诊：隆起示颅高压，凹陷示脱水，迟闭示佝偻病/甲减"],["后囟","位于矢状缝与人字缝交会处，呈**三角形**","最早在生后**6–8周**闭合；产科分娩中作胎头方位触诊标志"],["蝶囟 \u0026 乳突囟","分别位于颅侧方前（对应蝶大翼）与后（对应乳突区）","生后不久闭合；与前后囟协同容许颅盖骨轻度**重叠塑形通过产道**"]],"quiz":{"stem":"儿科急诊接诊一名 10 月龄腹泻高热伴抽搐婴儿，体检发现其头顶中央菱形膜性凹陷明显下陷而枕后未触及软膜间隙。该体征组合说明：","options":["矢状缝与人字缝交会处未如期在1–2岁闭合","前囟尚未闭合提示重度脱水且后囟已正常闭合","前囟提前骨化闭锁伴发蝶囟脑脊液外膨隆","乳突囟持续开放导致颞骨鳞部发育异常"],"answer_idx":1,"explain":"10月龄婴儿正常情况：后囟（矢状+人字缝交界，三角）已于生后**6–8周**闭合；**前囟**（矢状+冠状缝交界，菱形）至**1–2岁**方闭合，此刻前囟明显凹陷正反映患儿急性重度脱水致颅内压降低。","remedial_node_id":"anat_skull_divisions_age_overview"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_surface_bony_landmarks","title":"颅骨体表与侧位影像骨性标志","subject":"anatomy","syllabus_refs":["syl_anatomy_038"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"整合体表**可扪及颅骨标志**（神经三孔线/翼点/乳突/下颌角）与侧位片**蝶鞍/眶耳平面**定位。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P7,P25-P27,P31,P34"],"payload":{"columns":["定位分区与标志","解剖依托骨与触诊/影像特征","临床操作与定标用途"],"rows":[["前面三孔垂线（眶上/眶下/颏孔）","分居额骨眶上缘、上颌眶下缘下及下颌体；可连成近垂直线","三叉神经末梢（V₁/V₂/V₃）体表**阻滞麻醉**与压痛查体靶点"],["颞侧与颅侧标志（翼点/颧弓/乳突/外耳门）","颧弓浅在；翼点居颧弓上2横指；**乳突**（内含气房）居中耳后方","外伤查硬膜外血肿；连眶下缘与外耳门上缘定**眶耳平面**（P7）"],["下颌与后枕标志（下颌头/下颌角/枕外隆凸）","张闭口可扪及耳屏前下颌头；下颌角转折清晰；枕后正中**枕外隆凸**","下颌角内上方对应下颌孔麻醉区；枕外隆凸定颅后窝窦汇高度"],["头颅侧位X线标志（P34）","中央**蝶鞍**（垂体窝/前后床突）、下方蝶窦、后方斜坡与乳突气房","评估垂体瘤致蝶鞍扩大、鼻窦炎透光度及枕髁/寰枢椎交界对齐"]],"quiz":{"stem":"急诊接诊颌面外伤患者需在体表快速确立标准头颅解剖水平基准面，并评估患者三叉神经第一、二、三支末梢出颅压痛点。下列定位组合最规范的是：","options":["连结眉间与枕外隆凸，查顶结节、鸡冠及舌下神经管","连结前囟与下颌角，查翼点、破裂孔与茎乳孔压痛","连结眶下缘与外耳门上缘，查眶上切迹、眶下孔与颏孔","连结鼻根点与乳突尖，查视神经管、圆孔与下颌孔"],"answer_idx":2,"explain":"P7标准定位：连结眶下缘与外耳门上缘构成的水平面即**眶耳平面**（Frankfurt plane）；正面三叉神经终末支（V₁眶上、V₂眶下、V₃颏神经）体表压痛及阻滞靶点分别为近垂直排列的**眶上切迹、眶下孔与颏孔**。","remedial_node_id":"anat_intro_position_planes_axes"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_skull_external_views_survey","title":"颅顶后侧与颅底外面观全貌","subject":"anatomy","syllabus_refs":["syl_anatomy_037"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"【了解拓展】按顶、后、侧及颅底外面四方位系统检视**颅缝、项线、颞窝与骨腭/外口**宏观格局。","source_slides":["03 基础医学 颅骨及其连结 0913.pdf#P24,P26-P27,P30"],"payload":{"columns":["观察方位（P24/26/27/30）","主要参与骨与界线/缝","代表性外部标志（含原片纠偏）"],"rows":[["颅顶面观（\u0026 颅盖内面观）","额骨+两侧顶骨+枕骨；冠状缝、**矢状缝**与人字缝交会人字点","内面正中上矢状窦沟、动脉沟及蛛网膜粒压迹（P24正名**foveolae**）"],["颅后面观 \u0026 侧面观","枕鳞、顶骨后下、颞骨鳞/乳突部；侧面分颞窝（上/下颞线）与颧弓","枕外隆凸、上/下项线、翼点、外耳门（P30正名**meatus**）、茎突"],["颅底外面观·前区（骨腭）","上颌骨腭突（前）+腭骨水平板（后）；正中/横缝接鼻后孔与犁骨","切牙孔、腭大/小孔；P30“额正中/横缝”误印，实为**腭正中缝/腭横缝**"],["颅底外面观·中后区","鼻后孔后至枕骨大孔前后延及枕鳞（蝶体/大翼/岩部/枕骨）","翼突内外板、卵圆/棘/破裂孔、**颈动脉管外口**、茎乳孔、枕髁与髁管"]],"quiz":{"stem":"观察干制成人颅骨“颅底外面观”标本，由前向后沿中线至颞骨岩部下面依次辨认骨性标志时，以下哪一项名称或归属纠正了原教学幻灯片（P30）中的印刷谬误？","options":["软骨封闭的破裂孔其实位于枕骨大孔正后方枕外嵴末端","切牙孔开口于腭骨水平板后缘并直接通连蝶腭孔","茎乳孔介于颧弓与下颌窝前方供动眼神经穿出颅底","硬腭上的骨缝应称腭正中缝与腭横缝而非额正中横缝"],"answer_idx":3,"explain":"P30 原图误将腭骨与上颌骨腭突之间的“Median/Transverse palatine suture”印作“额正中缝/额横缝”，正确名称应为**腭正中缝与腭横缝**；同页“Ext. acouistic pore”亦应正名为 **External acoustic meatus**。","remedial_node_id":"anat_skull_cranial_base_foramina"}},"added_at":"2026-11-18T15:17:40+08:00"},{"id":"anat_musc_ax_general_structure","title":"骨骼肌基本构造、四大形态与羽肌力学","subject":"anatomy","syllabus_refs":["syl_anatomy_063"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"全身约600余块**骨骼肌**占体重40%，依**肌腹**与腱/腱膜构筑分化出四形态与羽状力学优势。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P2,P4-P7"],"diagram_assets":[{"path":"assets/anat_musc_ax_shapes_p07.webp","caption":"骨骼肌形态分类图谱：长肌、羽肌（半羽/双羽/多羽）、阔肌带腱膜、轮匝肌、二腹肌与腱划（P7）","source_page":7}],"payload":{"bullets":["器官概览：骨骼肌属随意横纹肌，成人约{{600多块}}占体重{{40%}}；每块肌均含肌组织、结缔组织被膜及血管神经。","基本构造：中间能收缩的{{肌腹}}配合两端无收缩力的致密结缔组织{{肌腱}}（阔肌呈薄片状称{{腱膜}}）；部分长肌被{{腱划}}分隔。","四大形态：{{长肌}}（四肢主大范围运动）、{{短肌}}（躯干深层稳固）、{{阔肌}}（胸腹壁兼护脏与呼吸）、{{轮匝肌}}（环形关闭眼口裂孔）。","羽状与并行力学：{{并行肌/梭形肌}}肌纤维长而缩短幅度大；{{羽状肌}}（半羽/双羽/多羽）增大生理横截面积从而产生更强肌力（P6–P7）。"],"trap_note":"PPT P4 心肌图标下方误复贴了骨骼肌 HE 切片，但功能分类本身准确：**心肌与平滑肌**同属不随意肌，而**骨骼肌与心肌**同具横纹（收缩快而有力）。","quiz":{"stem":"比较相同体积的三角肌（多羽肌）与缝匠肌（细长并行肌），两者的肌纤维排布差异主要导致哪项宏观力学表现？","options":["三角肌生理横截面积更大且产生最大肌力更强","缝匠肌生理横截面积更大且缩短速度慢而持久","三角肌因缺肌腱附着而主要依靠筋膜直接收缩","缝匠肌因含大量腱划而专司环形关闭体表孔裂"],"answer_idx":0,"explain":"**多羽肌**（三角肌）借斜行短肌束汇聚于多条肌腱，大幅增加**生理横截面积**从而爆发高肌力；细长并行肌（缝匠肌）肌纤维长，优势在于缩短距离大、运动幅度宽。","remedial_node_id":"histo_muscle_general_classification"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_origin_antagonism","title":"骨骼肌起止转换律与原动拮抗功能群","subject":"anatomy","syllabus_refs":["syl_anatomy_063"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"骨骼肌**起点与止点**随动作固定端切换而互换，在关节两侧成对组成**原动与拮抗**功能群。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P9"],"diagram_assets":[{"path":"assets/anat_musc_ax_origin_antagonist_p09.webp","caption":"图3-2 肌的起、止点定位与图3-3 屈/伸前臂时原动肌（肱二头肌/肱三头肌）与拮抗肌角色互换（P9）","source_page":9}],"payload":{"bullets":["起止定义：跨关节附着两骨时，近端相对不动一端称{{起点（定点）}}，远端发生位移一端称{{止点（动点）}}。","起止转换律：定动点可随姿势转化，如{{胸大肌}}正常内收肱骨；{{攀爬单杠}}固定上肢时，止点变定点反将躯干向上牵拉。","功能群角色：直接完成某动作的主力肌为{{原动肌}}，作用相反且同步松弛协调控制的对侧肌为{{拮抗肌}}（如屈肘时肱二头肌 vs 肱三头肌）。","成对配布规律：全身肌群在关节轴两侧成对配置为{{屈肌与伸肌}}、{{内收肌与外展肌}}、{{旋内肌与旋外肌}}及{{旋前肌与旋后肌}}。"],"trap_note":"“拮抗肌”并非消极阻碍运动，而是通过适度离心张力抑制惯性冲击、保证关节运动**精准平稳**；**原动与拮抗**角色随关节运动方向反转而互换。","quiz":{"stem":"一名攀岩者双手紧握上方岩点引体向上并将躯干拉近横杠时，其胸大肌与背阔肌的力学支点发生了何种转化？","options":["两肌由等张收缩转变为肌腹不缩短的等长维持","肱骨端由动点变为定点从而反拉躯干向上移动","原动肌与拮抗肌角色互换使肩关节强力外展","肌腱取代肌腹主动收缩以缩短力臂牵拉胸廓"],"answer_idx":1,"explain":"肌的**起点（定点）与止点（动点）**具有相对性。当双手握杠固定肱骨时，原本的远端止点转化为**定点**，胸大肌与背阔肌收缩反而将躯干作为动点向上牵拉。","remedial_node_id":"anat_musc_ax_general_structure"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_auxiliary_apparatus","title":"肌的辅助装置：筋膜、滑膜囊与腱鞘","subject":"anatomy","syllabus_refs":["syl_anatomy_064"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"**深筋膜**借肌间隔筑骨筋膜鞘，滑膜囊与双层腱鞘减摩防弓弦并通过**腱系膜**供血。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P10-P11"],"diagram_assets":[{"path":"assets/anat_musc_ax_fascia_sheath_p11.webp","caption":"A. 浅深筋膜、肌间隔与筋膜鞘；B. 腱鞘立体与横断面示纤维鞘、滑膜鞘壁脏两层及腱系膜（P11）","source_page":11}],"payload":{"bullets":["浅筋膜（皮下筋膜）：位于真皮深面，由含脂肪的{{疏松结缔组织}}构成，内行{{浅静脉、皮神经}}与浅淋巴结，司保温缓冲。","深筋膜（固有筋膜）：由致密结缔组织包被肌群并深入附骨形成{{肌间隔}}，围成互不相通的{{骨筋膜鞘}}以约束肌力与导引血管神经。","滑膜囊（synovial bursa）：垫于肌腱与骨面间的封闭{{滑液小囊}}，减少高速滑动摩擦（部分可与邻近关节腔相通）。","腱鞘双层结构：套于腕踝长肌腱外，分外层约束防弓弦的{{纤维层（纤维腱鞘）}}与内层分泌滑液的{{滑膜层}}（壁层+脏层）。","腱系膜（mesotendineum）：滑膜层脏壁两层在骨面移行折叠形成的双层系膜，是携{{血管、神经}}进入肌腱的生命通路。"],"trap_note":"剔除 P10 腱系膜横线伪影与 P11 左图“digitits”错拼后需牢记：四肢深筋膜骨筋膜鞘**无弹性扩张余地**，急性出血肿胀易诱发**骨筋膜室综合征**。","quiz":{"stem":"手部屈指肌腱在狭窄指屈肌腱鞘内发生严重化脓性炎症并产生高压积液时，肌腱最易先发生缺血坏死的解剖原因为何？","options":["浅筋膜脂肪液化阻断了指骨骨膜的直接渗出","纤维腱鞘与骨膜增厚令滑膜腔失去闭合特性","高压积液直接压闭腱系膜内的肌腱供血血管","滑膜鞘壁层脱离纤维鞘导致肌腱弓弦样脱位"],"answer_idx":2,"explain":"包裹肌腱的滑膜脏层与壁层之间通过**腱系膜**移行，指屈肌腱的营养血管经**腱系膜**入腱；当鞘内脓液高压蓄积时极易压闭腱系膜血管，造成肌腱迅速缺血坏死。","remedial_node_id":"histo_dense_ct"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_naming_axes","title":"肌命名七律与肌群配布对关节轴的规律","subject":"anatomy","syllabus_refs":["syl_anatomy_065"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"肌名常直标**形态、位置**与起止；肌群按关节**运动轴**数在轴两侧成对配布。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P8-P9"],"payload":{"columns":["归纳维度","核心解剖规则","代表肌与关节轴对应示例"],"rows":[["形态 / 大小 / 构造与部位","直接以几何外形、相对体积、肌头/腹数或所处骨性窝/间隙命名","**斜方肌**、三角肌（形）；腰大肌（大小+位）；**肱三头肌**（头数+位）；冈上肌、骨间肌（位）"],["起止 / 作用 / 位置与肌纤维方向","连缀起止骨点、单一主导动作或体壁位置与纤维斜/横走向","**胸锁乳突肌**、胸骨舌骨肌（起）；旋后肌、大收肌（用）；**腹外斜肌**、腹横肌（位+向）"],["单轴关节配布（屈戌 / 车轴）","仅有 1 条运动轴（冠状轴或垂直轴），仅需 1 对拮抗肌群跨轴配布","肘关节（冠状轴）配**屈伸肌群**；桡尺关节（垂直轴）配**旋前与旋后肌**"],["双轴与三轴关节配布","2 条轴配 2 对肌群（4 方位）；3 条轴配 3 对肌群（可协同环转）","桡腕双轴配屈伸+收展 2 对；**肩/髋三轴球窝**配屈伸、收展、旋内外 3 对拮抗肌群"]],"quiz":{"stem":"若某滑膜关节因骨面构型仅保留一条垂直轴而限制了冠状轴和矢状轴运动，则跨越该关节配布的肌群组合最符合哪一规律？","options":["同时配置屈伸、收展与旋转三对独立肌群","在关节前后侧配置强大屈肌群与伸肌群","依托多羽状阔肌包裹关节囊以完成环转","围绕垂直轴成对配置旋前与旋后或旋转肌"],"answer_idx":3,"explain":"肌群严格**垂直跨越关节运动轴**配布。仅具垂直轴的车轴关节无法执行屈伸或收展，仅需绕垂直轴成对配置**旋前肌与旋后肌**（如桡尺近远侧关节）。","remedial_node_id":"anat_synovial_joint_axes_classes"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_masticatory_tmj","title":"咀嚼肌四肌起止功能与翼外肌张口机制","subject":"anatomy","syllabus_refs":["syl_anatomy_066"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"咀嚼肌全受**下颌神经**支配；前三肌上提闭口，唯**翼外肌**牵髁突向前张口研磨。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P15"],"diagram_assets":[{"path":"assets/anat_musc_ax_masticatory_p15.webp","caption":"咀嚼肌位置与层次：右上示颞肌与咬肌浅层；右下示深面翼外肌（近水平）与翼内肌（斜向下后）（P15）","source_page":15}],"payload":{"columns":["咀嚼肌（CN V₃支配）","精确起点与止点（补齐P15留白）","下颌动作与颞下颌关节(TMJ)关联"],"rows":[["咬肌 (Masseter)","起于**颧弓下缘及内面** → 止于下颌角外侧面咬肌粗隆","强力**上提下颌骨**（闭口），浅部斜纤维微助下颌前伸"],["颞肌 (Temporalis)","起于**颞窝**及颞深筋膜（经颧弓深面） → 止于下颌骨**冠突**及下颌支前缘","上提下颌骨（**闭口**）；后部近水平纤维强力牵拉下颌**向后复位**"],["翼内肌 (Medial pterygoid)","起于蝶骨**翼突窝**及上颌结节 → 止于下颌角内侧面**翼肌粗隆**","与咬肌形成肌肉吊带夹持下颌角，强力**上提下颌骨**并辅助前伸"],["翼外肌 (Lateral pterygoid)","起于蝶骨大翼颞下面及翼突外侧板 → 止于下颌颈及TMJ**关节盘/囊**","双侧牵髁突向前**协同张口**；单侧使下颌移向**对侧**；痉挛过牵致前脱位"]],"quiz":{"stem":"右侧下颌神经受损导致右侧翼外肌单独麻痹而左侧功能正常时，嘱患者用力大张口并前伸下颌，其下颌骨颏部中线会出现何种典型偏移？","options":["向右侧偏斜因左侧正常翼外肌推向患侧","向左侧偏斜因左侧正常翼外肌牵向同侧","保持正中不偏仅表现为闭口咬合力量减弱","向后上方移位因患侧颞肌失拮抗强力后拉"],"answer_idx":0,"explain":"单侧**翼外肌**收缩将下颌推向对侧。右侧翼外肌瘫痪后，健侧（左侧）翼外肌失去对侧平衡，向前内侧牵拉左侧髁突，结果将整个下颌颏部推偏至**患侧（右侧）**。","remedial_node_id":"anat_skull_tmj_structure_motion"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_scm_scalenes_fissure","title":"胸锁乳突肌、斜角肌与斜角肌间隙通路","subject":"anatomy","syllabus_refs":["syl_anatomy_069"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"胸锁乳突肌单侧倾同转对，前中斜角肌与第1肋围成**斜角肌间隙**穿行**锁骨下动脉和臂丛**。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P16-P17,P19-P20"],"diagram_assets":[{"path":"assets/anat_musc_ax_scalene_fissure_p20.webp","caption":"斜角肌间隙（Scalene fissure）：前、中斜角肌与第1肋围成间隙，内含锁骨下动脉与臂丛，前斜角肌前面贴行膈神经（P20）","source_page":20}],"payload":{"steps":[{"cue":"定位胸锁乳突肌（SCM）起止，为何单侧痉挛会造成头倾与转脸方向相反？","reveal":"SCM起自胸骨柄前面与锁骨胸骨端，斜向后上止于**颞骨乳突**；一侧收缩牵乳突向下后，致**头向同侧倾斜而脸转向对侧**（双侧收缩头后仰，头固定则提胸廓助深吸气）。","mechanism_tag":"SCM斜向力矩"},{"cue":"前、中、后斜角肌起止如何辅助深吸气，且各自止于第几肋？","reveal":"三肌均起自**颈椎横突**；前、中斜角肌止于第1肋，后斜角肌止于第2肋；头颈固定时收缩上提第1、2肋扩大胸廓上口，**辅助深吸气**（一侧收缩致颈椎侧屈）。","mechanism_tag":"斜角肌提肋吸气"},{"cue":"前中斜角肌与第1肋如何围成斜角肌间隙？锁骨下动脉、锁骨下静脉与臂丛各行于何处？","reveal":"前斜角肌、中斜角肌与第1肋构成三角形**斜角肌间隙**，内穿锁骨下动脉与臂丛；**锁骨下静脉**行于前斜角肌前方（不入间隙），膈神经贴前斜角肌前面下行。","mechanism_tag":"间隙神经血管分隔"}],"takeaway":"记住前斜角肌的“前静后动+臂丛”分界：痉挛或颈肋压迫**斜角肌间隙**时最先损伤锁骨下动脉与臂丛下干，通常不累及前方的锁骨下静脉。","quiz":{"stem":"一名患者因先天性颈肋伴前斜角肌肥厚卡压“斜角肌间隙”引发胸廓出口综合征，下列哪一组结构受压表现最典型且可直接归因于该间隙狭窄？","options":["锁骨下静脉回流受阻伴同侧颈阔肌完全瘫痪","同侧桡动脉搏动减弱伴臂丛尺侧麻木与肌萎缩","同侧舌骨下肌群弛缓伴声带内收障碍与声音嘶哑","对侧头面部倾斜伴双侧颈外静脉怒张伴脑水肿"],"answer_idx":1,"explain":"**斜角肌间隙**内穿行**锁骨下动脉和臂丛**；间隙狭窄直接压迫两者致远端桡动脉搏动减弱及臂丛（尤其下干C8-T1尺侧）麻木萎缩。锁骨下静脉走在前斜角肌前方，不经过该间隙。","remedial_node_id":"anat_trunk_sternum_ribs_cage ["syl_anatomy_075"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"膈借**中心腱**与肌性周边（含下6肋起部）分隔胸腹腔；吸气下降并按**T12/T10/T8**穿行三裂孔。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P35"],"diagram_assets":[{"path":"assets/anat_musc_ax_diaphragm_p35.webp","caption":"膈下面观：中央三叶草中心腱与腔静脉孔、食管裂孔、主动脉裂孔及腰大肌、腰方肌毗邻（P35）","source_page":35}],"payload":{"steps":[{"cue":"膈的穹窿构筑有何特征？其肋部到底起自哪些肋骨（纠正P35笔误）？","reveal":"膈封闭胸廓下口呈右高左低的穹窿状（右顶因肝衬托更高），周围肌性部起自剑突（胸骨部）、**下6肋（第7–12肋，勘误P35误作6th肋）**及L1–3椎体（腰部膈脚），向心止于**中心腱**。","mechanism_tag":"穹窿三部起止"},{"cue":"受膈神经（C3–C5）支配收缩时，膈如何协同完成吸气与静脉回流抽吸？","reveal":"收缩时穹窿下降，主要增大**胸廓垂直径**致胸膜腔负压更负而肺吸气；同时中心腱下降轻拉**腔静脉孔扩大**促下腔静脉回流，并与腹肌协同增加腹压（咳嗽、排便、分娩）。","mechanism_tag":"垂直径与呼吸泵"},{"cue":"膈的三大裂孔由下向上按 T12 → T10 → T8 如何排布，各自通过什么结构？","reveal":"**主动脉裂孔（T12）**居正中腱性拱下，穿主动脉与胸导管；**食管裂孔（T10）**居左前肌性部，穿食管与迷走神经；腔静脉孔（T8）居中心腱右侧，穿下腔静脉。","mechanism_tag":"三裂孔T12-T10-T8"}],"takeaway":"“T12主动脉胸导管（腱孔不受压）→ T10食管迷走神经（肌孔防反流）→ T8下腔静脉（中心腱吸气扩孔促回流）”，构造完美匹配生理功能。","quiz":{"stem":"深吸气时膈肌强力收缩下降以扩大胸廓垂直径，此时三大裂孔中由于完全被肌纤维包绕而最不易被动牵拉扩大的通道及穿行结构是？","options":["T8水平腔静脉孔，内穿下腔静脉与右膈神经","T10水平食管裂孔，内穿食管和迷走神经","T12水平主动脉裂孔，内穿主动脉和胸导管","T12水平腰肋三角，内穿腹壁上动脉与淋巴管"],"answer_idx":1,"explain":"**食管裂孔（T10）**位于膈的肌性部且受右膈脚肌纤维环绕，收缩时呈“夹持”协同防胃食管反流；**腔静脉孔（T8）**在中心腱内随吸气扩大，主动脉裂孔（T12）居骨腱后方不受压。","remedial_node_id":"anat_trunk_thoracic_cage_apertures_motion"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_abdominal_muscles","title":"腹前外侧肌四肌与腹后群腰方腰大肌","subject":"anatomy","syllabus_refs":["syl_anatomy_077"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"腹壁前外侧四肌借斜横纵**纤维交织**护脏增腹压、降肋呼气；腹后群**腰方肌**定第12肋助膈发力。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P36-P45,P59-P61"],"diagram_assets":[{"path":"assets/anat_musc_ax_abdom_triptych_p44.webp","caption":"腹前外侧肌群纤维方向与层次：1腹外斜肌（手插袋），2腹内斜肌，3腹直肌，4腹横肌（P44）","source_page":44}],"payload":{"columns":["腹壁肌群","起止要点与纤维走向","特殊衍生结构与功能要点"],"rows":[["腹外斜肌 (Obliquus externus)","起**下8肋外面** → 纤维自**外上斜向内下**，后下止髂嵴前部，余移为腱膜","下缘卷曲成**腹股沟韧带**（ASIS至耻骨结节），衍生腔隙/耻骨梳韧带与**浅环**"],["腹内斜肌 (Obliquus internus)","起胸腰筋膜、髂嵴及腹股沟韧带**外1/2** → **自外下斜向内上**止下3肋及腱膜","下部与腹横肌腱膜融成**腹股沟镰**（联合腱），并分出**提睾肌**随精索下降"],["腹横肌 (Transversus abdominis)","起下6肋软骨内面、胸腰筋膜、髂嵴及腹股沟韧带**外1/3** → **横行向前内**","最深层阔肌，其深面贴**腹横筋膜**，下部参与构成**联合腱**；主要束腹增腹压"],["腹直肌 (Rectus abdominis)","起**耻骨联合与耻骨嵴** → 纵行向上止胸骨剑突及第5–7肋软骨前面","含3–4条**腱划**；前外侧四肌共同**护脏增腹压**（排便/分娩/呕咳）、降肋呼气及屈转脊柱"],["腹后群：腰方肌与腰大肌","腰方肌连**髂嵴与第12肋**/L1–4横突；腰大肌起T12–L5经髂耻弓入股小转子","腰方肌**下降固定第12肋**（稳固膈肌锚点）并同侧侧屈躯干；腰大肌主屈髋"]],"quiz":{"stem":"下列关于腹前外侧壁三层阔肌起始于腹股沟韧带的跨越范围及特殊衍生结构归属的判定，哪一项完全正确？","options":["腹外斜肌腱膜下缘形成联合腱与提睾肌","腹横肌起始于腹股沟韧带全长并围成浅环","腹内斜肌起于韧带外1/2并分化出提睾肌","腹直肌经腱划形成腔隙韧带与耻骨梳韧带"],"answer_idx":2,"explain":"腹股沟韧带、腔隙/耻骨梳韧带及浅环均由腹外斜肌腱膜衍生；腹内斜肌起于腹股沟韧带**外侧1/2**，下部与腹横肌（起于外1/3）共组联合腱，并单独分化出**提睾肌**。","remedial_node_id":"anat_lower_hip_bone_acetabulum"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_abdom_layers_nerves","title":"腹前外侧壁层次、血管神经与体表标志","subject":"anatomy","syllabus_refs":["syl_anatomy_079"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"腹壁由浅入深分8层，**肋间神经**夹行腹内斜与腹横肌间，**腹壁上下动脉**与脐周浅静脉网沟通上下腔与门脉。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P52,P55-P58","06 基础医学 肌学总论 头颈肌 0922.pdf#P38"],"diagram_assets":[{"path":"assets/anat_musc_ax_abdom_layers_p38.webp","caption":"腹前外侧壁开窗层次双语对照：由浅入深依次显露腹外斜肌及其腱膜、腹内斜肌、腹横肌与腹直肌（Deck 6·P38）","source_page":38}],"payload":{"bullets":["八层由浅入深：皮肤→{{浅筋膜}}（脐下分脂肪Camper层与膜性Scarpa层）→三层阔肌→{{腹横筋膜}}→{{腹膜外筋膜}}→壁腹膜。","神经层位与勘误：第7–11肋间神经及肋下神经行于{{腹内斜肌与腹横肌之间}}；下腹另走{{髂腹下神经}}（上）与{{髂腹股沟神经}}（下）。","深浅血管吻合：深层由{{腹壁上动脉}}（胸廓内动脉）与{{腹壁下动脉}}（髂外动脉）在腹直肌后吻合；浅层{{胸腹壁静脉}}连上、下腔静脉系。","四大体表标志：正中少血管{{腹白线}}（手术纵切口）、腹直肌外缘{{半月线}}、{{腱划}}（仅贴前层不粘后层）及平{{L3–L4}}的脐。"],"trap_note":"纠偏两处课件图误：① P52 横断面将**腹横筋膜**（7）与**腹膜外筋膜**（6，原错译“腹外筋膜”）深浅顺序倒置；② P55 右下标示两个“髂腹股沟神经”，上方一条实为**髂腹下神经**。","quiz":{"stem":"外科医生实施麦氏切口或旁正中切口逐层分离腹前外侧壁肌肉时，在下列哪一对肌层的筋膜间隙中最易遇并需保护第 10 肋间神经及伴行血管？","options":["浅筋膜Camper与Scarpa层之间","腹外斜肌腱膜与腹内斜肌肌腹之间","腹横筋膜与壁层腹膜外脂肪之间","腹内斜肌深面与腹横肌浅面之间"],"answer_idx":3,"explain":"分布于腹前外侧壁的第 7–11 肋间神经、肋下神经以及髂腹下/髂腹股沟神经主干均行于**腹内斜肌与腹横肌之间的神经血管平面**，切开时须注意钝性分离保护。","remedial_node_id":"anat_musc_ax_abdominal_muscles"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_rectus_sheath","title":"腹直肌鞘构成、弓状线上下转化规律","subject":"anatomy","syllabus_refs":["syl_anatomy_080"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"弓状线（脐下4–5 cm）以下**腹直肌鞘后层缺如**，三肌腱膜全走前方，腹直肌直接与**腹横筋膜**相贴。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P45,P47-P52"],"diagram_assets":[{"path":"assets/anat_musc_ax_rectus_sheath_p50.webp","caption":"腹直肌鞘横断面对比：A. 弓状线以上（腹内斜肌腱膜分前后两层包绕）；B. 弓状线以下三肌腱膜全经前方，后层缺如直接贴腹横筋膜（P50）","source_page":50},{"path":"assets/anat_musc_ax_arcuate_dissection_p48.webp","caption":"腹直肌鞘正面掀层解剖：示鞘后层下缘弓状线游离缘、切除腹直肌后暴露的腹横筋膜与胸腰筋膜（P48）","source_page":48}],"payload":{"columns":["解剖比较项目","弓状线以上（脐下 4–5 cm 之上）","弓状线以下（脐下 4–5 cm 之下）"],"rows":[["腹直肌鞘前层","腹外斜肌腱膜 + **腹内斜肌腱膜前层**","**三层阔肌腱膜全部**（腹外斜+腹内斜+腹横肌腱膜）均合走前方"],["腹直肌鞘后层","**腹内斜肌腱膜后层** + 腹横肌腱膜（完整坚韧）","**后层完全缺如**（其下端游离缘即**弓状线 / 半环线**）"],["腹直肌后面毗邻（重点勘误）","隔**腹直肌鞘后层**相邻腹横筋膜（腱划不粘后层，积液可向下流）","直接与**腹横筋膜**相贴（勘误：非 P51 误写的“直接与腹膜接触”）"],["血管穿行与白线结构","腹壁上动脉自肋弓下沿鞘后下行；白线在脐上宽 1–2 cm 易发白线疝","**腹壁下动静脉**跨弓状线前缘入鞘与腹壁上血管吻合；脐下白线窄厚"]],"quiz":{"stem":"下腹部正中旁切口位于脐下 6 cm 处，切开腹直肌鞘前层并将腹直肌向外侧牵开后，紧贴在腹直肌肌腹深面的结构直接是？","options":["失去后层保护的腹横筋膜层","融合而成的腹横肌后层腱膜","覆盖小肠表面的壁层腹膜","腹内斜肌分裂出的后层腱膜"],"answer_idx":0,"explain":"脐下 4–5 cm 的**弓状线**以下腹直肌鞘后层缺如，三层扁肌腱膜全移至前方构成前层；因此腹直肌后面并非直接贴腹膜（纠正 P51 谬误），而是直接贴邻**腹横筋膜**。","remedial_node_id":"anat_musc_ax_abdominal_muscles"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_inguinal_canal","title":"腹股沟管四壁两口、内容与斜直疝鉴别","subject":"anatomy","syllabus_refs":["syl_anatomy_078"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"腹股沟管长4–5 cm斜穿下腹壁，四壁两口通**精索/子宫圆韧带**与髂腹股沟神经，以**腹壁下动脉**分斜直疝。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P53-P54"],"diagram_assets":[{"path":"assets/anat_musc_ax_inguinal_canal_p54.webp","caption":"腹股沟管两性解剖对照：左示女性子宫圆韧带经管至大阴唇；右示男性四壁、浅环、腹壁下动脉与精索（P54）","source_page":54}],"payload":{"bullets":["位置与四壁：居腹股沟韧带内侧半上方斜长{{4–5 cm}}；前壁为{{腹外斜肌腱膜}}（外1/3加腹内斜肌），后壁为{{腹横筋膜}}（内1/3加联合腱）。","顶底与两口：上壁为{{腹内斜肌与腹横肌弓状下缘}}，下壁为{{腹股沟韧带}}；内口为{{深环（腹环）}}，外口为耻骨结节外上方的{{浅环（皮下环）}}。","通过内容（勘误）：男性穿行{{精索和髂腹股沟神经}}（修正P54漏“髂”字）；女性穿行{{子宫圆韧带和髂腹股沟神经}}（伴生殖股神经生殖支）。","斜直疝铁律：深环位于{{腹壁下动脉外侧}}，经此入管可坠入阴囊者为{{腹股沟斜疝}}；由该动脉内侧{{腹股沟三角}}直接顶出后壁者为直疝。"],"trap_note":"腹股沟斜行构造（外深内浅）在腹压骤增时使前壁紧压后壁形成“**自闭瓣**”；回纳疝块后**压住深环**（腹股沟韧带中点上方 1.5 cm）不再突出者为斜疝，仍突出者为直疝。","quiz":{"stem":"术中打开腹股沟管前壁后，医师观察到患者疝囊颈位于腹壁下动脉的内侧、直接顶推腹横筋膜及联合腱区域突向皮下而不经深环，该疝应诊断为？","options":["腹股沟斜疝，因经腹壁下动脉外侧进入管内","腹股沟直疝，因经海氏三角后壁直接膨出","股疝，因经腹股沟韧带深方股环向大腿突入","白线疝，因经弓状线以下脐正中缺损处膨出"],"answer_idx":1,"explain":"**腹壁下动脉**是术中鉴别斜疝与直疝的金标准：经该动脉外侧的深环入管为斜疝；经该动脉内侧的**腹股沟三角**（Hesselbach 三角）直接向后壁突出的为直疝。","remedial_node_id":"anat_musc_ax_abdominal_muscles"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_facial_landmarks","title":"面肌分布共性与头面肌性体表标志","subject":"anatomy","syllabus_refs":["syl_anatomy_067","syl_anatomy_068"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"**表情肌**起骨止皮且呈轮匝/放射状分布，统一受**面神经(CN VII)**支配，协同咬肌颞肌成头面标志。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P13-P15"],"diagram_assets":[{"path":"assets/anat_musc_ax_facial_p13.webp","caption":"面肌（表情肌）侧面分布：枕额肌（额腹、帽状腱膜、枕腹）、眼轮匝肌与口轮匝肌（P13）","source_page":13}],"payload":{"bullets":["分布共性：位置浅表多{{起自颅骨或筋膜而止于面部皮肤}}，呈{{环形（轮匝肌）或放射状}}排列于眼裂、口裂与鼻孔周围以司闭锁或牵开。","四大核心群：{{枕额肌}}（额腹提眉+帽状腱膜+枕腹）、{{眼轮匝肌}}（闭眼）、口周肌（{{口轮匝肌}}闭口/吹奏用{{颊肌}}）及鼻肌。","神经支配对比：全部表情肌均受{{面神经（CN VII）}}支配（区别于下颌神经 CN V₃ 支配的咀嚼肌）；瘫痪致同侧额纹消失、闭眼不能及口角歪向健侧。","头面肌性标志：紧咬牙时下颌角前上方隆起可触及{{咬肌}}，颞窝区鼓动为{{颞肌}}，蹙眉隆起为{{额腹}}，口角外深贴齿弓处为{{颊肌}}。"],"trap_note":"面部表情肌无深筋膜紧密包裹、且与皮下血管疏松相融，因此外伤伤口易因皮肌牵拉**裂开**，面部危险三角感染亦极易扩散。","quiz":{"stem":"患者右侧面神经出茎乳孔后完全受损致周围性面瘫，下列哪一项面部体征与面部肌群受累情况的对应判定最准确？","options":["紧咬牙时右侧咬肌无法隆起，下颌偏向左侧","右侧颞窝肌腹显著萎缩，无法完成闭口咀嚼","右侧额纹消失、闭眼露白，微笑时口角歪向左侧","左侧鼻唇沟变浅且鼓腮时左侧口角漏气明显"],"answer_idx":2,"explain":"**面神经（CN VII）**支配全部表情肌（枕额肌额腹、眼轮匝肌、口轮匝肌与颊肌）；右侧周围性面瘫时右侧额纹消失、眼裂闭合不全，健侧（左侧）口周肌牵拉使口角歪向**左侧**；咬肌和颞肌属咀嚼肌（CN V₃支配）不受累。","remedial_node_id":"anat_musc_ax_masticatory_tmj"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_neck_groups_layers","title":"颈肌分层分群与舌骨上下肌群协同","subject":"anatomy","syllabus_refs":["syl_anatomy_070"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"颈肌分**浅、中（舌骨上下）、深**三群；**舌骨下四肌**（补齐P16留白）协同舌骨上四肌调控吞咽与张口。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P16-P19"],"payload":{"columns":["颈肌分层与分群","组成成员（补全P16/P18遗漏项）","位置特征与主导协同功能"],"rows":[["颈浅肌群（2 块）","**颈阔肌**（浅筋膜内薄肌）+ **胸锁乳突肌**","颈阔肌绷紧颈皮拉口角向下（CN VII）；SCM转头仰头（副神经）"],["颈中层·舌骨上肌群（4 块）","二腹肌、下颌舌骨肌、茎突舌骨肌、**颏舌骨肌**（补齐P18图漏标）","构成口底；下颌固定时**上提舌骨**助吞咽，舌骨固定时**下拉下颌**助张口"],["颈中层·舌骨下肌群（4 块，补全P16）","浅层：**胸骨舌骨**、肩胛舌骨肌；深层：**胸骨甲状**、甲状舌骨肌","吞咽后**下降舌骨和喉复位**（仅甲状舌骨肌可上提喉），并向下锚定舌骨"],["颈深肌群（外侧 + 内侧）","外侧：前、中、后**斜角肌**；内侧：**椎前肌**（头长肌、颈长肌等）","斜角肌提第1–2肋助深吸气并围成斜角肌间隙；椎前肌居颈椎前方屈头颈"]],"quiz":{"stem":"某患者用力大张口抵抗下颌阻力时，除翼外肌牵引髁突向前外，还必须依赖哪两组颈部肌群共同协同发力完成口底锚定与下颌下拉？","options":["胸锁乳突肌向后拉乳突同时颈阔肌向上牵拉舌骨","前中斜角肌上提第1肋同时后斜角肌固定肩胛骨","椎前长肌强力仰伸颈椎同时茎突舌骨肌上提颅底","舌骨下肌群先固定舌骨随后舌骨上肌群下拉下颌"],"answer_idx":3,"explain":"正常下颌固定时**舌骨上肌群**上提舌骨；而大张口时，必须先由**舌骨下四肌**（胸骨舌骨、肩胛舌骨、胸骨甲状、甲状舌骨肌）收缩向下锚定舌骨，**舌骨上肌群**（尤其二腹肌前腹、下颌舌骨肌、颏舌骨肌）才能反向下拉下颌骨。","remedial_node_id":"anat_musc_ax_scm_scalenes_fissure"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_back_layers_fascia","title":"背浅深肌层次、胸腰筋膜与背部两三角","subject":"anatomy","syllabus_refs":["syl_anatomy_072","syl_anatomy_073"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"背肌分浅（提肩/菱形勘误）深两层；**胸腰筋膜**三层包裹竖脊与腰方肌，并在浅层交错留出**听诊与腰三角**。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P21-P25"],"payload":{"bullets":["背浅两层（勘误）：1层为斜方肌、背阔肌；2层为{{肩胛提肌}}（起自**C1–4横突**而非棘突，上提肩胛）与{{菱形肌}}（起C7–T5棘突，**后缩**肩胛）。","背深肌组成：外侧浅层含{{竖脊肌与夹肌（头/颈夹肌）}}（双侧仰头伸脊柱，夹肌单侧转头向同侧）；深层含横突棘肌群等短肌；另有上下后锯肌。","胸腰筋膜三层：腰部最发达分三层；{{后层}}被覆竖脊肌后面（作背阔肌起点），{{中层}}分隔竖脊肌与腰方肌，{{前层}}覆腰方肌前面（腰肋韧带）。","背部两大薄弱三角：{{听诊三角}}（斜方肌、背阔肌与肩胛骨内侧缘间，听肺下叶）与{{腰三角（Petit三角）}}（背阔肌、腹外斜肌与髂嵴间，底为腹内斜肌）。"],"trap_note":"PPT P23 存在两处错位：① 肩胛提肌误作起自“第1–4颈椎棘突”（实际为**横突**）；② 菱形肌框内误贴了肩胛提肌“上提肩胛骨”作用文案（菱形肌主使肩胛骨向脊柱**后缩**并下回旋）。","quiz":{"stem":"关于背部浅深层次肌肉起点订正及胸腰筋膜/背部局部三角的解剖对应，下列哪一项判断最准确？","options":["肩胛提肌起自C1–4横突，胸腰筋膜中层分隔竖脊肌与腰方肌","肩胛提肌起自C1–4棘突，腰三角由斜方肌背阔肌与肩胛缘围成","菱形肌主要强力上提肩胛骨，听诊三角底壁仅覆盖壁腹膜脂肪","胸腰筋膜前层被覆竖脊肌表面，并直接移行构成腹外斜肌腱膜"],"answer_idx":0,"explain":"**肩胛提肌**起自第 1–4 颈椎**横突**（纠正 P23 棘突笔误）；**胸腰筋膜**后层覆竖脊肌背面，**中层**位于竖脊肌与腰方肌之间，前层覆腰方肌前面；听诊三角居肩胛区，腰三角居髂嵴上方。","remedial_node_id":"anat_musc_ax_back_major_muscles"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_ax_diaphragm_weak_points","title":"膈的生理性薄弱点与膈疝好发机制","subject":"anatomy","syllabus_refs":["syl_anatomy_076"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"**胸肋三角**与**腰肋三角**缺肌质覆被，联合食管裂孔构成膈疝三大突破口。","source_slides":["07 基础医学 肌学总论 头颈 躯干肌.pdf#P35"],"payload":{"bullets":["胸肋三角（Larrey间隙）：位于膈的{{胸骨部与肋部}}起点之间（剑突两侧），仅覆稀疏结缔组织、穿行{{腹壁上动脉}}，腹压剧增可发{{胸骨旁疝（Morgagni疝）}}。","腰肋三角（Bochdalek间隙）：位于膈的{{肋部与腰部}}起点之间（第12肋上方），呈三角形缺肌区，上面邻胸膜、下面直接邻近{{肾周脂肪囊}}。","临床侧别与通路：因右侧有肝遮挡缓冲，先天性后外侧膈疝（{{Bochdalek疝}}）多发于{{左侧}}；腰肋三角亦是肾周脓肿穿破膈入胸膜腔的通路。","食管裂孔薄弱点：膈食管韧带退变或长期腹压升高时，胃底与贲门经{{食管裂孔}}向上突入纵隔形成{{食管裂孔疝}}（滑动型与食管旁型）。"],"trap_note":"PPT P35 未列出膈肌生理性薄弱点，务必按《系统解剖学》补全**胸肋三角**（前内侧、腹壁上动脉）与**腰肋三角**（后外侧、左侧易发先天疝）的空间定位。","quiz":{"stem":"一名新生儿出生后即出现严重呼吸困难，胸片示左侧胸腔内充满含气肠襻且纵隔向右移位，手术探查见膈肌后外侧第 12 肋上方存在先天性融合缺损，该病变累及的生理性薄弱区是？","options":["右侧中心腱内腔静脉孔周边薄弱区","胸骨剑突两侧的胸肋三角薄弱区","膈肋部与腰部起点间的腰肋三角","脊柱前方主动脉裂孔与膈脚之间"],"answer_idx":2,"explain":"**腰肋三角**（Bochdalek 间隙）位于膈肋部与腰部起点之间，缺乏肌纤维而仅隔胸腹膜，胚胎期胸腹膜裂孔未闭时常在左侧发生**先天性后外侧膈疝**。","remedial_node_id":"anat_musc_ax_diaphragm_hiatuses"}},"added_at":"2026-11-18T20:19:51+08:00"},{"id":"anat_musc_limb_deltoid_teres_major","title":"四肢肌总纲与三角肌·大圆肌","subject":"anatomy","syllabus_refs":["syl_anatomy_081","syl_anatomy_082"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"确立上肢灵活、下肢稳重分工，拆解**三角肌与大圆肌**起止力偶及**肩袖**构筑。","source_slides":["07 基础医学-运动系统 肌学 上下肢 李倩.pdf#P1-P5"],"diagram_assets":[{"path":"assets/anat_musc_limb_shoulder_cuff_p02.webp","caption":"上肢带肌浅深层观：三角肌、冈上/下肌、小圆肌、大圆肌与肱三头肌毗邻（P02）","source_page":2}],"payload":{"steps":[{"cue":"四肢肌总纲：上肢与下肢肌群在骨杠杆功能上有何总体分化？","r
