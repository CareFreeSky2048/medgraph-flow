正协同与 S 形陡坡：为何别构酶不遵守米氏双曲线，反而在生理调节上更灵敏？","reveal":"当底物本身作正协同效应剂时，首分子结合诱发相邻亚基对底物亲和力陡增，令 V-[S] 呈 S 形曲线；其中段斜率极陡，使底物微幅波动即可撬动酶速率大幅响应。","mechanism_tag":"正协同 S 形曲线 · 高灵敏中段"},{"cue":"异促激活 vs 抑制移位：加入别构激活剂（如 AMP/F-2,6-BP）或抑制剂（ATP）时曲线如何偏转？","reveal":"别构激活剂稳定高亲和 R 态，使 S 形曲线向左移动（甚至转成米氏矩形双曲线）；别构抑制剂稳定低亲和 T 态，使曲线显著向右移动，实现整条通路（如 PFK-1 vs FBPase-1）联动。","mechanism_tag":"激活左移(R态) · 抑制右移(T态)"}],"takeaway":"别构调节靠非共价改变多亚基四级构象完成“秒级反馈”；口诀：激活稳R左移变双曲，抑制锁T右移减灵敏。","quiz":{"stem":"某肝脏寡聚限速酶单独测定时 V-[S] 呈典型 S 形曲线；加入微量生理小分子代谢物 M（结构与底物完全不同）后，酶的 Vmax 不变但半饱和底物浓度 [S]₀.₅ 明显下降，曲线显著左移并趋近矩形双曲线。对 M 作用的合理解释是：","options":["M 结合别构部位使寡聚酶由低亲和 T 态转向高亲和 R 态","M 作为底物类似物抢占活性中心并同步降低表观 Km","M 触发蛋白激酶磷酸化该酶并诱导一级肽键部分水解","M 破坏亚基非共价键诱发轻度聚沉从而减少有效酶浓度"],"answer_idx":0,"explain":"结构异于底物且使 S 形曲线左移、Vmax 不变、趋近矩形双曲线的小分子是典型的正协同别构激活剂：它结合酶活性中心外的别构部位，把寡聚体稳态推向高亲和力 R 态，从而极大降低 [S]₀.₅。","remedial_node_id":"biochem_enzyme_michaelis_km_vmax"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_zymogen_and_covalent","title":"酶原激活 vs 共价修饰快速调节与级联","subject":"biochem","syllabus_refs":["syl_biochem_005","syl_biochem_006"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"酶原经局部不可逆水解露活防自噬；共价修饰靠两组相反酶(耗ATP等)实现可逆级联放大；慢调节改酶含量。","source_slides":["第2章酶-20260915.pptx#P25-P26,P154-P155,P164-P178"],"payload":{"columns":["调控机制类型","分子化学变化与可逆性","经典通路与修饰酶系","核心生理意义与病理断点"],"rows":[["酶原激活 (Zymogen)","切去特定抑制短肽，一级结构改变致构象重排形成/暴露活性中心；单向不可逆","肠激酶激活胰蛋白酶原，进而级联激活糜蛋白酶原、弹性蛋白酶原等","酶原储酶并防细胞自消化（若在胰腺内提前激活则诱发急性胰腺炎）"],["酶促共价修饰","其他酶催化基团共价接/脱，一级结构微改且双向反应各由不同酶催化、总体可逆","磷酸化(Ser/Thr/Tyr，激酶耗ATP vs 磷酸酶)；乙酰化(ACLY/PKM2)；甲基/糖基化","级联放大(如肾上腺素→cAMP→PKA→糖原分解放大10⁸倍)，快速省能"],["酶含量慢调节","改变酶蛋白分子绝对量（转录诱导/阻遏合成 vs 溶酶体/泛素蛋白酶体降解 t₁/₂）","底物/激素调控转录因子（慢速长效）及多聚泛素链标记（如SIRT2去乙酰化促ACLY降解）","适应长期营养或激素周期切换，非应激急救主线"]],"quiz":{"stem":"关于“酶原激活”与“酶蛋白磷酸化共价修饰”这两大体内快速调节方式的本质区别，下列分析正确的是：","options":["酶原激活靠小分子别构调节剂非共价可逆触发而不改变一级结构","酶原激活因局部肽键断裂而不可逆，磷酸化则由两套相反酶催化可逆互变","磷酸化去磷酸化的逆反应只需蛋白激酶自身逆转催化而无需耗能","两者都通过转录水平诱导增加新酶合成从而导致反应速率慢速提升"],"answer_idx":1,"explain":"酶原激活是有限蛋白水解切断特定肽键、丢弃抑制短肽使活性中心暴露的过程，在细胞外不可逆转；而磷酸化修饰中“蛋白激酶耗ATP加水磷酸”与“蛋白磷酸酶水解除磷酸”分属两个独立不可逆反应，共同实现酶活性的可逆快速切换及级联放大。","remedial_node_id":"biochem_enzyme_active_center_es"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_isoenzymes_ldh_ck","title":"同工酶本质、LDH/CK 谱与心肝诊断","subject":"biochem","syllabus_refs":["syl_biochem_005"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"同工酶催化相同反应但一级/理化/免疫性质不同(含可变剪接)；LDH1–5 与 CK1–3 具器官特异性助诊心梗肝病。","source_slides":["第2章酶-20260915.pptx#P54-P59,P185,P197"],"payload":{"bullets":["同工酶定义与分子来源：催化{{相同的化学反应}}，但酶蛋白的分子结构（多基因编码或同一前体mRNA{{可变剪接}}）、理化性质（电泳行为、Km）与免疫学性质不同，活性中心三维构象相似。","乳酸脱氢酶 (LDH) 四聚体谱：由心肌型 {{H 亚基}}与骨骼肌型 {{M 亚基}}随机组装为 LDH₁(H₄) 至 LDH₅(M₄) 五种电泳带；{{LDH₁ 对乳酸亲和力高}}（主氧化乳酸），LDH₅ 主促丙酮酸还原为乳酸。","肌酸激酶 (CK) 二聚体谱：由脑型 B 与肌型 M 亚基组成 3 种二聚体——{{CK₁(BB) 主在脑}}，{{CK₂(MB) 高度特异于心肌}}，{{CK₃(MM) 主在骨骼肌}}。","临床同工酶谱诊断反转：正常血清 LDH₂ \u003e LDH₁；{{急性心肌梗死}}时心肌释放致血清 {{LDH₁ \u003e LDH₂ 且 CK-MB 剧增}}；急性病毒性肝炎或骨骼肌损伤则表现为 {{LDH₅ 显著升高}}。"],"trap_note":"经典辨析：同工酶催化的是【同一个化学反应】（底物和产物完全相同），区别在于不同组织通过表达不同 Km 与调节特性的同工酶（如 HK vs GK、LDH₁ vs LDH₅）适配自身代谢方向。","quiz":{"stem":"某胸痛患者与某黄疸患者同日查血清总 LDH 活性均显著升高。若进一步行血清 LDH 同工酶琼脂糖凝胶电泳并加测 CK 同工酶，支持“急性心肌梗死”而非“急性病毒性肝炎”的特异性图谱组合是：","options":["血清 LDH₅ 泳带明显深染伴 ALT 升高，CK₂(MB) 未见升高","血清 LDH₃ 显著增高伴肺部浸润，CK₁(BB) 占总活力90%","血清 LDH₁ \u003e LDH₂（翻转现象）伴 CK₂(MB) 显著升高","血清 LDH₁ 至 LDH₅ 全部等比例消失且 CK₃(MM) 骤降"],"answer_idx":2,"explain":"心肌富含 LDH₁(H₄)（占心肌73%）及特异二聚体 CK₂(MB)。心肌梗死细胞坏死释酶入血后，血清 LDH₁ 超过正常居首的 LDH₂ 形成“LDH₁\u003eLDH₂”翻转，伴随 CK-MB 特异性升高；而肝损伤与骨骼肌病变则以 LDH₅(M₄) 升高为特征。","remedial_node_id":"biochem_protein_tertiary_quaternary_folding"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_catalytic_mechanisms","title":"【拓展】酶降低活化能与四大催化分子机制","subject":"biochem","syllabus_refs":["syl_biochem_007"],"syllabus_tier":"understand","node_type":"mechanism_flow","anchor_summary":"酶不改反应ΔG与平衡点，靠结合能、邻近定向、表面脱溶剂及酸碱/亲核共价催化极大幅度降低活化能ΔG*。","source_slides":["第2章酶-20260915.pptx#P13-P15,P75-P90"],"diagram_assets":[{"path":"assets/biochem_enzyme_activation_energy_p78.webp","caption":"酶通过改走低活化能(ΔG*)中间途径加速反应达平衡，但不改变反应始末自由能差 ΔG","source_page":78}],"payload":{"steps":[{"cue":"热力学与动力学边界：加酶后为何反应速率狂飙 10⁸–10²⁰ 倍，平衡常数却纹丝不动？","reveal":"酶只能催化热力学允许(ΔG\u003c0)的自发反应、不改反应始末自由能差ΔG与平衡点；酶通过改变反应途径并释放次级键结合能(4–30 kJ/mol·个)大幅降低过渡态活化能ΔG*(每降5.7 kJ/mol加速10倍)。","mechanism_tag":"降ΔG*不改ΔG · 结合能驱动"},{"cue":"邻近定向与表面脱溶剂效应：酶蛋白裂隙如何把稀溶液双分子反应变成“分子内反应”？","reveal":"邻近效应将底物富集锁定于活性中心，定向效应对齐反应轨道大幅降低活化熵；同时疏水活性中心排除水化膜（表面脱溶剂化效应），消除了水分子静电屏蔽与干扰。","mechanism_tag":"邻近定向 · 疏水脱溶剂"},{"cue":"多元催化接力：胰凝乳蛋白酶是如何协同打断顽固肽键的？","reveal":"活性中心酸性/碱性氨基酸侧链（His、Asp/Glu、Cys、Ser）执行广义酸碱催化（瞬时供/受质子），并由 His57 夺质子激活 Ser195 产生强亲核烷氧负离子进攻羰基碳形成共价酰基酶中间体完成水解。","mechanism_tag":"酸碱催化 + 亲核共价催化"}],"takeaway":"生物催化高效本质是“三维裂隙降熵脱溶剂 + 多功能酸碱/共价基团分段跨越低矮活化能垒”，绝不违背热力学平衡。","quiz":{"stem":"向某可逆放能反应（无酶时 ΔG = -25 kJ/mol，平衡常数 Keq = 10⁴）中加入足量专一性高效蛋白酶。当该反应重新充分达到化学平衡时，下列关于热力学与动力学变化的陈述正确的是：","options":["反应活化能与平衡常数均同步升高使产物量倍增","反应自由能变 ΔG 转为更负从而推动正反应彻底进行","达平衡时间缩短且酶在反应结束后被消耗分解","正逆反应活化能同等降低但 Keq 与 ΔG 保持不变"],"answer_idx":3,"explain":"催化剂（包括酶）只能同等降低正逆反应活化能以缩短达到平衡的时间，绝不改变反应始末自由能变 ΔG 与平衡常数 Keq，反应前后酶本身的质与量亦保持不变。","remedial_node_id":"biochem_enzyme_active_center_es"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_enzyme_kinetics_ec_medicine","title":"【拓展】Km测定、酶分类命名与医学应用","subject":"biochem","syllabus_refs":["syl_biochem_007"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"双倒数/Hanes作图测定Km与Vmax(IU/kat单位)；EC七大分类(含易位酶)服务于血清酶谱诊断、靶向抑酶与ELISA工程。","source_slides":["第2章酶-20260915.pptx#P60-P72,P116-P117,P180-P193"],"payload":{"bullets":["动力学作图测定与酶活单位：{{Lineweaver-Burk双倒数法}}(1/V 对 1/[S])直观但低浓度误差放大，{{Hanes作图}}([S]/V 对 [S])误差更匀；1 IU=1 μmol/min，1 kat=1 mol/s（{{1 IU = 16.67×10⁻⁹ kat}}）。","EC 国际七大分类（按反应类型）：1.氧化还原酶 · 2.转移酶(GPT) · 3.水解酶 · 4.裂合酶(醛缩酶/柠檬酸合酶) · 5.异构酶 · 6.连接酶(耦联NTP) · 7.{{易位酶}}(如 Na⁺-K⁺-ATPase)。","血清酶诊断与靶向抑酶治疗：肝炎飙升 {{ALT/AST}}、胆管梗阻飙升 {{ALP/GGT}}、急性胰腺炎飙升 {{淀粉酶/脂酶}}、有机磷中毒 {{胆碱酯酶↓↓}}；肿瘤重编程靶点含 LDHA/ACLY 及 {{IDH1/2 突变抑制剂}}。","医学检验与酶工程：酶法偶联定量检测代谢物、{{ELISA 酶联免疫标记}}、分子克隆工具酶；{{固定化酶}}可固相反复利用，过渡态类似物免疫动物可得具催化活性的{{抗体酶(abzyme)}}。"],"trap_note":"新版分类细节：除传统六大酶外，国际生物化学联合会已新增第 7 类【易位酶(translocases)】（如跨膜转运质子或 Na⁺/K⁺ 的 ATP 酶）；另有别构调节与共价修饰的代谢重编程癌细胞靶点（ACLY/PKM2）。","quiz":{"stem":"急诊接诊一名突发剧烈上腹痛伴呕吐患者，急查血清酶谱显示：血清淀粉酶 ↑↑↑、血清脂肪酶 ↑↑↑，而 ALT/AST、CK-MB 与胆碱酯酶均在正常范围。该酶谱结果最支持下列哪项诊断与酶学测定原则？","options":["高度提示急性胰腺炎，测酶活性应测反应初速率并可用IU或kat定量","高度提示急性心肌梗死，宜用抗体酶替代双倒数法计算底物浓度","高度提示有机磷农药中毒，因脂肪酶受共价磷酰化激活而大量漏出","高度提示胆管恶性梗阻，因为脂肪酶归属 EC 第7类膜易位酶家族"],"answer_idx":0,"explain":"急性胰腺炎时胰腺腺泡受损释放大量淀粉酶与脂肪酶入血（显著 ↑↑↑），可借酶活测定明确诊断；临床测定酶活性须处于最适条件、底物饱和并取反应初速率（耗底物\u003c5%），以国际单位 IU 或催量 kat 标定。","remedial_node_id":"biochem_enzyme_michaelis_km_vmax"}},"added_at":"2026-11-17T08:47:06+08:00"},{"id":"biochem_lipid_classification_efa","title":"脂质分类、构象与必需脂肪酸","subject":"biochem","syllabus_refs":["syl_biochem_014","syl_biochem_015"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"脂肪(95%TG)主储能保温，类脂(5%PL/胆固醇)构膜；缺Δ⁹以上去饱和酶决定亚油酸与α-亚麻酸必需性。","source_slides":["脂质代谢-2026.pdf#P4-P46"],"payload":{"bullets":["脂质总分：{{甘油三酯(95%)}}储存于脂肪组织供能保温；{{类脂(5%)}}含磷脂、糖脂、胆固醇(酯)，主司生物膜与活性前体。","脂肪酸编码：{{Δ系}}从羧基C1起算双键位，{{ω(n)系}}从甲基末端起算；人体缺{{Δ⁹以上(Δ¹²/Δ¹⁵)}}去饱和酶且ω-3/6/9互不转化。","顺反构象：天然多为{{顺式双键}}使碳链弯折增加膜流动性；人工氢化产生的{{反式脂肪酸}}形似直棍，嵌入膜后降流动性并升高血黏度。","必需脂肪酸：须由植物摄取{{亚油酸(18:2 ω-6)}}与{{α-亚麻酸(18:3 ω-3)}}；{{花生四烯酸(20:4 ω-6)}}由亚油酸衍生故常同归必需。","二十碳衍生物：花生四烯酸衍生成{{PG(五碳环)}}、促血小板聚集的{{TXA₂}}(抗凝PGI₂拮抗)及慢反应物质{{LT(共轭三烯)}}。"],"trap_note":"游离胆固醇本身是醇而非酯，但因疏水特征仍归类脂；反式脂肪虽有双键却呈线性直链，效应趋近饱和脂肪。","quiz":{"stem":"若长期完全摄入精制无植物油膳食，体内最先受限且无法由油酸补足的生物合成前体是？","options":["亚油酸衍生出的花生四烯酸及前列腺素","乙酰CoA合成的十六碳软脂酸及硬脂酸","磷脂酰乙醇胺经甲基化生成的卵磷脂","肝内质网Δ⁹去饱和酶催化生成的油酸"],"answer_idx":0,"explain":"人体缺乏Δ⁹以上（Δ¹²、Δ¹⁵）去饱和酶，且ω-3、ω-6、ω-9三族不饱和脂肪酸不能互变；油酸(ω-9)无法转化为亚油酸(ω-6)及下游花生四烯酸，进而影响PG/TX/LT合成。","remedial_node_id":"biochem_enzyme_specificity_kinetics_factors"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_lipid_digestion_absorption","title":"胆盐乳化、辅脂酶与双轨脂吸收","subject":"biochem","syllabus_refs":["syl_biochem_016"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"胆盐两亲乳化脂滴后须靠胰蛋白酶激活的辅脂酶锚定胰脂酶，吸收依链长分走门静脉或淋巴CM。","source_slides":["脂质代谢-2026.pdf#P47-P62"],"diagram_assets":[{"path":"assets/biochem_lipid_digestion_p61.webp","caption":"肠道脂质消化吸收全景：胆盐微团→辅脂酶协同胰脂酶/PLA₂水解→中短链走门静脉 vs 长链重酯化入乳糜微粒(CM)走淋巴管","source_page":61}],"payload":{"steps":[{"cue":"水油不溶的食糜油滴如何在十二指肠上段扩大酶促接触面积？","reveal":"肝合成的【胆汁酸盐】凭疏水面贴脂滴、亲水面朝水，将大油团乳化成细小脂质微团并稳定混合微团跨水层。","mechanism_tag":"胆盐两亲乳化"},{"cue":"胆盐吸附微团表面反而会排挤胰脂酶，谁负责把它“钉”回脂-水界面？","reveal":"【辅脂酶原】经胰蛋白酶切去N端五肽激活为【辅脂酶】，分别以疏水键抓脂滴、氢键锚定胰脂酶（1,3位水解；奥利司他可共价抑制其活性丝氨酸）。","mechanism_tag":"辅脂酶桥接锚定"},{"cue":"短/中链甘油三酯与长链甘油三酯的吸收路径为何一分为二？","reveal":"短/中链TG（水溶性较高）在肠细胞内彻底水解为FFA+甘油后直接入【门静脉】；长链FA、2-MAG、胆固醇和溶血磷脂走淋巴分流。","mechanism_tag":"门静脉快通道"},{"cue":"肠黏膜细胞如何把外源长链消化产物改造成自身甘油三酯并绕开肝脏入血？","reveal":"借【甘油一酯途径】以2-甘油一酯重酯化为TG，连同CE、PL及apo B48装配成【乳糜微粒(CM)】，经淋巴管直入体循环优先供肝外组织。","mechanism_tag":"CM淋巴旁路"}],"takeaway":"辅脂酶本身无酶活却防胆盐驱离胰脂酶；长链脂质借甘油一酯途径入CM走淋巴绕肝，有别于糖与短链脂肪酸走门静脉。","quiz":{"stem":"胰蛋白酶原激活彻底障碍时，即使胰脂酶与胆盐分泌正常，脂肪泻依然加重的直接原因是？","options":["肝细胞无法再以胆固醇合成初级胆汁酸","辅脂酶原无法切去N端五肽而失锚定作用","短链脂肪酸无法通过门静脉上皮细胞吸收","肠黏膜甘油二酯途径的磷脂酸磷酸酶失活"],"answer_idx":1,"explain":"辅脂酶在胰腺泡以无活性的辅脂酶原分泌，必须依赖肠腔内胰蛋白酶切除N端五肽才具结合域；缺乏活性辅脂酶时，胆盐覆盖脂水界面会将胰脂酶排挤出微团表面。","remedial_node_id":"biochem_enzyme_zymogen_and_covalent"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_lipolysis_glycerol_fate","title":"脂肪动员ATGL/HSL级联与甘油去路","subject":"biochem","syllabus_refs":["syl_biochem_022"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"脂解激素经cAMP-PKA磷酸化Perilipin-1释放CGI激活限速酶ATGL并锚定HSL，FFA靠清蛋白运往外周，甘油归肝肾。","source_slides":["脂质代谢-2026.pdf#P65-P77"],"diagram_assets":[{"path":"assets/biochem_lipid_lipolysis_p72.webp","caption":"禁食期脂肪动员级联：胰高血糖素→Gs-AC-cAMP-PKA→磷酸化Perilipin释放CGI激活ATGL并募集HSL-P→清蛋白运FFA至肌细胞","source_page":72}],"payload":{"steps":[{"cue":"禁食或交感兴奋时，哪类激素开关启动脂肪细胞内储存甘油三酯的水解？","reveal":"【脂解激素】（胰高血糖素、肾上腺素、NE）激活Gs-AC-cAMP-PKA轴；【抗脂解激素】（胰岛素、PGE₂）则逆向抑制该级联。","mechanism_tag":"cAMP-PKA脂解开关"},{"cue":"静止时脂滴外被Perilipin-1包被绝缘，PKA磷酸化如何同时解锁ATGL与HSL？","reveal":"Perilipin-1磷酸化后释放共激活因子【CGI激活限速酶ATGL】（TG→DAG），并暴露位点锚定磷酸化的【HSL】（DAG→MAG），终由MGL释放甘油+3 FFA。","mechanism_tag":"Perilipin双锁解锁"},{"cue":"疏水游离脂肪酸(FFA)释出脂肪细胞后如何安全穿过水相血浆到达心、肝、骨骼肌？","reveal":"1分子【血浆清蛋白】可非共价结合约10分子FFA运往全身高耗能器官氧化，低白蛋白血症会削弱FFA转运效率。","mechanism_tag":"清蛋白载体运FFA"},{"cue":"脂肪细胞为何不能重新利用自己释放出的甘油合成脂肪，而必须把它送回肝肾？","reveal":"脂肪细胞缺乏【甘油激酶】；甘油随血入肝、肾等组织经甘油激酶→3-磷酸甘油→磷酸二羟丙酮（进入糖酵解氧化或糖异生补血糖）。","mechanism_tag":"肝肾甘油激酶分流"}],"takeaway":"ATGL是脂肪动员第一限速酶（HSL受激素磷酸化调控紧随其后）；脂肪细胞缺甘油激酶，故甘油专往肝肾氧化或异生。","quiz":{"stem":"某基因突变导致脂滴包被蛋白Perilipin-1无法被PKA磷酸化，禁食状态下脂肪细胞内最直接受阻的环节是？","options":["肝细胞内甘油激酶无法将游离甘油磷酸化","血浆清蛋白结合长链游离脂肪酸位点丧失","CGI无法释放且HSL难锚定于脂滴","单酰甘油脂肪酶MGL失去催化水解活性"],"answer_idx":2,"explain":"未磷酸化的Perilipin-1像绝缘盾一样禁锢CGI使ATGL静默；仅当PKA将其多点磷酸化后，才会释放CGI激活ATGL并为磷酸化的HSL提供脂滴停泊锚定位点。","remedial_node_id":"histo_adipose_tissue"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_fa_beta_oxidation_shuttle","title":"脂肪酸活化、肉碱穿梭与β-氧化产能","subject":"biochem","syllabus_refs":["syl_biochem_017"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"胞液活化净耗2高能磷酸键，借外膜限速酶CPT1肉碱穿梭入线粒体基质行4步螺旋产乙酰CoA，16C软脂酸净产106 ATP。","source_slides":["脂质代谢-2026.pdf#P78-P90,P96"],"diagram_assets":[{"path":"assets/biochem_lipid_carnitine_shuttle_p82.webp","caption":"脂肪酸活化与肉碱穿梭：胞液脂酰CoA合成酶→外膜限速酶CPT1生成脂酰肉碱→内膜转位酶→CPT2还原脂酰CoA进入β-氧化","source_page":82}],"payload":{"steps":[{"cue":"胞液游离脂肪酸启动氧化的第一步活化代价是多少？为何不可逆？","reveal":"内质网与线粒体外膜的【脂酰CoA合成酶】消耗1分子ATP生成AMP+PPi，PPi随即可水解驱动反应单向进行，净耗【2个高能磷酸键】。","mechanism_tag":"耗2键单向活化"},{"cue":"长链脂酰CoA不能穿过线粒体内膜，由哪三步“肉碱穿梭”构成整个β-氧化的限速关口？","reveal":"外膜限速酶【CPT1(肉碱脂酰转移酶Ⅰ)】生成脂酰肉碱→经内膜【肉碱-脂酰肉碱转位酶】换入→基质【CPT2】复原脂酰CoA并返还肉碱。","mechanism_tag":"CPT1限速穿梭"},{"cue":"线粒体基质每轮β-氧化按哪4步连续拆下2个碳？分别把氢交给谁？","reveal":"依【脱氢(FAD→FADH₂)→加水→再脱氢(NAD⁺→NADH+H⁺)→硫解(CoASH)】4步，生成1分子乙酰CoA、1 FADH₂、1 NADH及少2碳脂酰CoA。","mechanism_tag":"四步螺旋脱氢硫解"},{"cue":"以16碳软脂酸为例，彻底氧化经TCA和呼吸链净生成多少ATP？","reveal":"7轮产8乙酰CoA+7 NADH+7 FADH₂：总产8×10 + 7×2.5 + 7×1.5 = 108 ATP，扣除活化2高能键，净产【106 ATP】。","mechanism_tag":"106 ATP精确核算"}],"takeaway":"长链脂肪酸在胞液耗2高能键活化后，经限速酶CPT1肉碱穿梭入线粒体行4步β-氧化螺旋，软脂酸彻底氧化净产106 ATP。","quiz":{"stem":"原发性肉碱缺乏或CPT1遗传缺陷患者，在空腹运动数小时后最可能出现的代谢危象是？","options":["脂肪酸大量转入过氧化物酶体产能暴增","胞液丙酮酸脱氢酶活性骤升并伴高血糖","肌糖原与肝糖原无需动员仍持续高储备","长链脂肪酸难入线粒体伴低酮性低血糖"],"answer_idx":3,"explain":"CPT1或肉碱穿梭受阻使长链脂酰CoA无法进入线粒体行β-氧化，肝脏失去乙酰CoA原料无法生酮（低酮），外周被迫疯狂耗糖且肝糖异生供能匮乏，引发低酮性低血糖与肌无力。","remedial_node_id":"biochem_tca_cycle_steps_energy"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_fa_special_oxidation_elongation","title":"【拓展】特殊脂肪酸氧化与碳链加长","subject":"biochem","syllabus_refs":["syl_biochem_019"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"补充不饱和FA异构/表构酶、过氧化物酶体VLCFA缩短、奇碳丙酰CoA依赖VitB₁₂入TCA及碳链延长。","source_slides":["脂质代谢-2026.pdf#P91-P95,P137-P139"],"payload":{"bullets":["不饱和FA氧化：遇顺Δ³烯酰CoA需{{Δ³顺-Δ²反-烯酰CoA异构酶}}扳正双键；遇顺Δ²烯酰CoA水化产出D型羟脂酰CoA，须靠{{表构酶}}转为L型继续氧化。","超长链FA(C20/22)：先在{{过氧化物酶体}}经FAD依赖的脂肪酸氧化酶缩短碳链（不偶联ATP而产H₂O₂），短链再送线粒体行经典β-氧化。","奇数碳FA终点：末轮生成{{丙酰CoA}}(3C)，经生物素羧化酶→D/L-甲基丙二酰CoA→{{Vit B₁₂(5'-脱氧腺苷钴胺素)变位酶}}转为琥珀酰CoA入TCA。","软脂酸碳链加长：{{内质网}}(主，丙二酰CoA供2C+CoASH延至C24)与{{线粒体}}(乙酰CoA逆β-氧化至C24/26)，均由NADPH供氢。","内质网去饱和：动物具有Δ⁴/Δ⁵/Δ⁸/Δ⁹去饱和酶，依赖膜上{{Cyt b₅电子传递链}}引入双键，仍无法突破Δ⁹上方。"],"trap_note":"偶数碳脂肪酸分解全成乙酰CoA不能净异生为糖；唯独奇数碳脂肪酸末端的丙酰CoA转成琥珀酰CoA后可净生成葡萄糖。","quiz":{"stem":"严重维生素B₁₂缺乏患者除巨幼细胞贫血外，尿液中常出现甲基丙二酸显著升高，其直接代谢阻塞点在？","options":["L-甲基丙二酰CoA向琥珀酰CoA的变位反应","软脂酰CoA经CPT1跨线粒体内膜的肉碱转运","顺Δ³-烯酰CoA向反Δ²-烯酰CoA的双键异构","超长链脂酰CoA在过氧化物酶体的初步断链"],"answer_idx":0,"explain":"奇数碳脂肪酸（及Ile/Met/Thr/Val和胆固醇侧链）降解生成的丙酰CoA先羧化为D/L-甲基丙二酰CoA，最后一步由5'-脱氧腺苷钴胺素（Vit B₁₂）作辅酶的变位酶转为琥珀酰CoA，B₁₂缺乏使上游蓄积成甲基丙二酸血症/尿症。","remedial_node_id":"biochem_fa_beta_oxidation_shuttle"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_ketogenesis_extrahepatic_use","title":"酮体肝产肝外用分工与酮症酸中毒","subject":"biochem","syllabus_refs":["syl_biochem_020","syl_biochem_021"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"肝线粒体经HMG-CoA合酶/裂解酶产酮却缺转硫酶而不能自用，酮体过血脑屏障供脑肌却在糖尿病诱发酸中毒。","source_slides":["脂质代谢-2026.pdf#P99-P112,P229"],"diagram_assets":[{"path":"assets/biochem_lipid_ketone_shuttle_p105.webp","caption":"酮体器官间能源输出：肝线粒体将过量乙酰CoA合成乙酰乙酸/β-羟丁酸输出，经血至骨骼肌/心肌/脑转为乙酰CoA入TCA供能","source_page":105}],"payload":{"steps":[{"cue":"酮体包含哪三种成分？肝脏线粒体凭哪两步专属关键酶将乙酰CoA转为酮体？","reveal":"酮体=【乙酰乙酸、D(-)-β-羟丁酸、丙酮】。肝线粒体2乙酰CoA→乙酰乙酰CoA→限速酶【HMG-CoA合酶】→肝特有【HMG-CoA裂解酶】产乙酰乙酸，再转其余两态。","mechanism_tag":"肝线粒体生酮酶系"},{"cue":"肝为什么“只产酮不用酮”？水溶酮体输出对脑与饥饿机体的意义是什么？","reveal":"肝缺乏【琥珀酰CoA转硫酶】与乙酰乙酸CoA硫激酶而无法活化利用；酮体水溶无需载体、可过血脑屏障替脑肌供能，饥饿时减少耗糖、节省蛋白质。","mechanism_tag":"肝外能源输出分工"},{"cue":"心、肾、脑、骨骼肌线粒体如何把血中运来的酮体送入TCA循环产能？","reveal":"β-羟丁酸氧化回乙酰乙酸→主要靠【琥珀酰CoA转硫酶】（借琥珀酰CoA不耗ATP，肾心脑另具乙酰乙酸CoA硫激酶）转为乙酰乙酰CoA→硫解为2乙酰CoA。","mechanism_tag":"肝外转硫酶活化"},{"cue":"未控制1型糖尿病为何高发酮症酸中毒与烂苹果味呼气？","reveal":"胰岛素匮乏使脂肪动员及糖异生暴走，后者抽空【草酰乙酸】阻滞TCA，海量乙酰CoA涌向酮体超肝外氧化极限，酸性酮体压低血pH并由肺呼出【丙酮】。","mechanism_tag":"OAA抽空与酮症酸中毒"}],"takeaway":"酮体是肝向肝外输出的水溶燃料：肝有HMG-CoA裂解酶无转硫酶（只产不用），糖异生抽空OAA则推高生酮致酸中毒。","quiz":{"stem":"未治疗1型糖尿病患者呼气带烂苹果味且血pH降至7.15时，肝细胞内促发乙酰CoA大量涌向酮体的核心代谢瓶颈是？","options":["肝细胞线粒体琥珀酰CoA转硫酶表达异常升高","糖异生加速抽空草酰乙酸致TCA循环入口受阻","外周血浆清蛋白浓度过低无法结合游离脂肪酸","丙二酸单酰CoA大量积聚激活肝外膜CPT1活性"],"answer_idx":1,"explain":"胰岛素绝对缺乏时，胰高血糖素驱动肝糖异生将草酰乙酸(OAA)转为PEP耗糖异生；OAA枯竭令大量β-氧化产生的乙酰CoA无法与OAA缩合进TCA，被迫转由HMG-CoA合酶/裂解酶涌向酮体，酸性产物蓄积引发酸中毒、丙酮经肺呼出。","remedial_node_id":"biochem_tca_regulation_hub"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_fa_synthesis_citrate_fasn","title":"柠檬酸穿梭、NADPH与软脂酸合成","subject":"biochem","syllabus_refs":["syl_biochem_018"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"乙酰CoA借柠檬酸-丙酮酸循环穿出线粒体，配PPP所供14 NADPH经ACC限速与FASN二聚体7轮缩合还原为软脂酸。","source_slides":["脂质代谢-2026.pdf#P114-P135"],"payload":{"steps":[{"cue":"糖酵解在线粒体生成的乙酰CoA透不过内膜，靠什么穿梭进入胞液作脂肪酸合成碳源？","reveal":"靠【柠檬酸-丙酮酸循环】：乙酰CoA与OAA缩成柠檬酸出膜→胞液【ATP-柠檬酸裂解酶】裂解出乙酰CoA；OAA→苹果酸经【苹果酸酶】变丙酮酸回线粒体并产部分NADPH。","mechanism_tag":"柠檬酸-丙酮酸循环"},{"cue":"软脂酸合成是高度耗氢的还原过程，14分子NADPH+H⁺主要来自哪里？","reveal":"主要源于胞液【磷酸戊糖途径(PPP)】的G6PD/6PGD两步脱氢，次要补充来自柠檬酸-丙酮酸循环胞液【苹果酸酶】反应。","mechanism_tag":"PPP主供NADPH"},{"cue":"胞液乙酰CoA如何活化成高活性二碳供体，哪一步是脂肪酸合成的限速步骤？","reveal":"限速酶【乙酰CoA羧化酶(ACC)】（辅基【生物素】、Mn²⁺激活）耗1 ATP将乙酰CoA与HCO₃⁻羧化为【丙二酸单酰CoA】，脱羧放能推动缩合。","mechanism_tag":"ACC生物素限速"},{"cue":"哺乳动物脂肪酸合成酶(FASN)怎样完成从乙酰基到16碳软脂酸的7轮循环？","reveal":"FASN是单基因编码的【7种酶活性同源二聚体】（以ACP为酰基载体），7轮重复【缩合(脱CO₂)→加氢(NADPH)→脱水→再加氢(NADPH)】，终由硫酯酶释放软脂酸。","mechanism_tag":"FASN七轮缩合还原"}],"takeaway":"总式：1乙酰CoA + 7丙二酰CoA + 14 NADPH → 软脂酸(16C) + 7 CO₂ + 6 H₂O + 8 CoA + 14 NADP⁺；碳靠柠檬酸穿梭、氢主靠PPP、速控在ACC。","quiz":{"stem":"大鼠肝细胞实验若特异性抑制磷酸戊糖途径限速酶G6PD，即便胞液乙酰CoA和ATP充足，软脂酸合成仍急剧下降的直接原因是？","options":["柠檬酸无法穿过线粒体内膜进入胞液裂解","丙二酸单酰CoA在ACC催化下完全无法生成","β-酮脂酰和烯脂酰两步还原缺少主要NADPH来源","乙酰CoA羧化酶的生物素辅基无法结合HCO₃⁻"],"answer_idx":2,"explain":"合成1分子软脂酸每轮需2分子NADPH（分别用于β-酮脂酰还原和烯脂酰还原），7轮共耗14分子NADPH，其最主要供应途径正是磷酸戊糖途径（苹果酸酶仅能部分补充）。","remedial_node_id":"biochem_pentose_phosphate_pathway"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_lipid_acc_cpt1_reciprocal_switch","title":"脂酸合成 vs β-氧化与ACC开关","subject":"biochem","syllabus_refs":["syl_biochem_017","syl_biochem_018","syl_biochem_021"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"丙二酸单酰CoA既是合成原料又是CPT1强抑制剂，借胰岛素/胰高血糖素对ACC的共价与别构调控防止无效循环。","source_slides":["脂质代谢-2026.pdf#P96,P108-P112,P119-P123,P136,P140-P141,P149"],"diagram_assets":[{"path":"assets/biochem_lipid_acc_cpt1_switch_p149.webp","caption":"肝细胞脂代谢互反调节跷跷板：胰岛素激活ACC升高丙二酰CoA从而抑制CPT1，切断β-氧化与生酮并导向脂合成","source_page":149}],"payload":{"columns":["比较维度","脂肪酸合成（胞液）","脂肪酸 β-氧化（线粒体）"],"rows":[["酶系与酰基载体","FASN多功能二聚体 · ACP(含泛酰巯基乙胺)","4种独立酶分散存在 · CoASH"],["二碳单位与氢载体","丙二酰CoA进(脱CO₂) · 耗14 NADPH","乙酰CoA出 · 产7 FADH₂ + 7 NADH"],["循环四步与β-羟构型","缩合→还原→脱水→还原 · D(-)构型","脱氢→加水→再脱氢→硫解 · L(+)构型"],["穿梭与核心限速酶","柠檬酸-丙酮酸循环 · 限速酶ACC(需HCO₃⁻)","肉碱穿梭 · 限速酶CPT1(受丙二酰CoA抑)"],["别构与激素开关","柠檬酸聚合激活ACC / 胰岛素去磷酸化(+)","AMPK/胰高血糖素磷酸化抑ACC→解除CPT1抑"]],"quiz":{"stem":"进食高糖餐后胰岛素升高时，肝细胞内抑制已合成新脂肪酸立刻被送入线粒体氧化（避免无效循环）的核心分子机制是？","options":["高血糖直接关闭线粒体内膜呼吸链复合物","长链脂酰CoA变构聚合激活胞液ACC酶","肝细胞内线粒体数量在餐后发生可逆缩减","ACC升高丙二酰CoA进而抑制CPT1"],"answer_idx":3,"explain":"饱食时胰岛素促进ACC去磷酸化（且糖代谢堆高的柠檬酸使ACC聚合成活性纤维），大量生成丙二酰CoA；它既作FASN合成原料，又直接竞争性抑制线粒体外膜CPT1，精准锁死脂酰CoA进线粒体。","remedial_node_id":"biochem_enzyme_allosteric_regulation"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_tg_synthesis_fatty_liver","title":"甘油三酯合成、VLDL输出与脂肪肝","subject":"biochem","syllabus_refs":["syl_biochem_022"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"肠走甘油一酯途径改造外源脂，肝/脂走甘油二酯途径依赖糖供3-磷酸甘油；肝合成TG须搭VLDL运出否则致脂肪肝。","source_slides":["脂质代谢-2026.pdf#P59-P60,P142-P148,P209,P230"],"payload":{"columns":["比较维度","甘油一酯途径（肠黏膜）","甘油二酯途径（肝/脂肪细胞）"],"rows":[["起始甘油骨架","吸收的 2-甘油一酯（直接酰化改造外源脂）","糖代谢DHAP或肝甘油激酶生成的 3-磷酸甘油"],["关键中间产物","2-MAG → 1,2-DAG → TG","3-磷酸甘油 → 磷脂酸(脱Pi) → 1,2-DAG → TG"],["糖脂单向联系","不依赖胞内糖酵解供骨架","葡萄糖可生脂，但PDH不可逆使偶碳FA不能生糖"],["合成后去向与病变","装配 apo B48 成 CM 经淋巴管输出","脂肪细胞就地储存；肝须打包成VLDL输出防脂肪肝"]],"quiz":{"stem":"长期严格禁食仅靠静脉输注偶碳脂肪酸乳剂而不补糖时，患者仍会持续出现低血糖倾向的根本生化原因在于？","options":["PDH反应不可逆使乙酰CoA不能净转糖","肝细胞内甘油三酯脂肪酶完全缺乏甘油激酶活性","脂肪细胞产生的磷酸二羟丙酮无法进入血液循环","高浓度酮体强烈抑制肝脏磷酸烯醇式丙酮酸羧激酶"],"answer_idx":0,"explain":"糖代谢可通过PDH生成乙酰CoA及DHAP生成3-磷酸甘油合成脂肪；但PDH催化的反应在体内不可逆（且TCA每进2C即脱2分子CO₂），故偶数碳脂肪酸拆出的海量乙酰CoA无法净生成丙酮酸或糖异生（仅TG释放的10%甘油可异生）。","remedial_node_id":"biochem_pdh_complex_mechanism"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_phospholipid_sphingolipid_metabolism","title":"甘油磷脂与鞘磷脂代谢及溶血损伤","subject":"biochem","syllabus_refs":["syl_biochem_023"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"甘油磷脂靠CTP活化走双途径并供肺泡表面活性物质与PIP₂信号；PLA₂产溶血磷脂可致急性胰腺炎，鞘氨醇衍鞘磷脂。","source_slides":["脂质代谢-2026.pdf#P11-P17,P150-P165"],"payload":{"bullets":["重要甘油磷脂：{{卵磷脂(PC)}}与脑磷脂(PE)占75%以上，其中{{二软脂酰卵磷脂}}由Ⅱ型肺泡上皮合成作表面活性物质；{{心磷脂}}富于线粒体内膜。","信号转导磷脂：{{PIP₂}}可经PLC裂解为IP₃(促ER释Ca²⁺)+DAG共同激活PKC，或经PI3K(PTEN拮抗)加3位磷酸成{{PIP₃}}招募AKT。","CTP活化双途径：{{甘油二酯途径}}以CDP-胆碱/乙醇胺合成PC/PE（PE亦可得3个SAM甲基转PC）；{{CDP-甘油二酯途径}}合成PI、PS与心磷脂。","磷脂酶与胰腺炎：{{PLA₂}}切sn-2位释放花生四烯酸并生成强表面活性{{溶血磷脂}}；胆石梗阻胆汁反流胰管，胰PLA₂将卵磷脂变为溶血卵磷脂破坏腺泡膜。","鞘磷脂代谢：软脂酰CoA+丝氨酸(耗PLP/NADPH)生鞘氨醇→酰胺化为母体{{神经酰胺}}→连CDP-胆碱成{{神经鞘磷脂}}(髓鞘主成分)，溶酶体PLC类酶水解。"],"trap_note":"合成甘油三酯及甘油磷脂虽共享1,2-DAG，但磷脂极性头基活化专属依赖CTP（而非ATP或UTP）。","quiz":{"stem":"急性胆源性胰腺炎患者因胆管结石胆汁逆流入胰管，引起胰腺实质自身消化与细胞膜溶解崩解的关键生化反应是？","options":["胆盐激活胰脂酶快速水解腺泡细胞内储存的甘油三酯","胰液磷脂酶A₂将胆汁卵磷脂水解成强膜毒性的溶血磷脂","肝细胞胆固醇7α-羟化酶受阻导致胆汁酸合成急剧减少","胰腺内溶酶体神经鞘磷脂酶把神经酰胺转成磷酸胆碱"],"answer_idx":1,"explain":"正常胆汁富含卵磷脂，当胆道结石梗阻导致胆汁反流入胰管并激活胰液中的PLA₂时，卵磷脂sn-2位被水解生成具有极强表面活性的溶血卵磷脂，直接破坏细胞膜双脂层诱发急性胰腺炎。","remedial_node_id":"biochem_tg_synthesis_fatty_liver"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_cholesterol_synthesis_hmgcoa","title":"胆固醇合成、HMG-CoA还原酶与调节","subject":"biochem","syllabus_refs":["syl_biochem_025","syl_biochem_024"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"肝/肠胞液内质网耗18乙酰CoA+36ATP+16NADPH经限速酶HMG-CoA还原酶造MVA及胆固醇，受反馈/磷酸化/昼夜节律锁控。","source_slides":["脂质代谢-2026.pdf#P18-P21,P167-P182"],"diagram_assets":[{"path":"assets/biochem_lipid_hmgcoa_divergence_p175.webp","caption":"HMG-CoA代谢双岔路口：肝线粒体经HMG-CoA裂解酶生酮体 vs 胞液/内质网经限速酶HMG-CoA还原酶(耗2 NADPH)生成MVA走向胆固醇","source_page":175}],"payload":{"steps":[{"cue":"27C胆固醇的母核结构特征、主要分布功能及从头合成的惊人原料代价是什么？","reveal":"母核为【环戊烷多氢菲】，1/4在脑神经、肝最丰，稳膜流动性并作激素/胆盐前体。肝(70–80%)与肠胞液/滑面ER合1分子胆固醇耗【18乙酰CoA+36ATP+16NADPH】。","mechanism_tag":"高耗料高耗能高耗氢"},{"cue":"胞液HMG-CoA如何跨越进入胆固醇通道？与线粒体酮体合成的分界酶是谁？","reveal":"胞液硫解酶与HMG-CoA合酶产HMG-CoA后，由内质网限速酶【HMG-CoA还原酶】（耗2 NADPH）生成【甲羟戊酸(MVA)】，再经5C异戊烯焦磷酸→30C鲨烯→27C胆固醇。","mechanism_tag":"HMG-CoA还原酶限速"},{"cue":"HMG-CoA还原酶如何同时接受细胞内胆固醇反馈与胰岛素/甲状腺素的协同调控？","reveal":"胆固醇/MVA既别构抑酶又抑基因转录；【胰岛素】促去磷酸化激活（【甲状腺素】诱导合成且促转胆汁酸）；胰高血糖素/皮质醇与饥饿则磷酸化或阻遏抑酶。","mechanism_tag":"三重反馈与激素调节"},{"cue":"为何临床常嘱高脂血症患者在晚饭后或睡前服用短效他汀类降脂药？","reveal":"肝HMG-CoA还原酶具昼夜节律（【午夜最高、中午最低】）；他汀竞争性抑酶减少内源合成，并反射性上调肝表面【LDL受体】加速血LDL清除。","mechanism_tag":"他汀节律与LDLR上调"}],"takeaway":"线粒体HMG-CoA裂解成酮，胞液/ER HMG-CoA还原酶(午夜峰值)耗2 NADPH生成MVA造胆固醇；他汀晚服精准压制合成峰值并上调LDLR。","quiz":{"stem":"甲状腺功能减退（甲减）患者常伴明显高胆固醇血症，而甲亢患者血胆固醇却常偏低，这与甲状腺素作用于胆固醇代谢的哪一特征最相符？","options":["甲状腺素强力诱导肝HMG-CoA还原酶基因持续高表达","甲状腺素直接竞争抑制外周组织表面LDL受体内吞","甲状腺素既促胆固醇合成但更强烈促其转化为胆汁酸","甲状腺素磷酸化激活肝细胞内ACAT加速胆固醇酯化"],"answer_idx":2,"explain":"甲状腺素虽能诱导肝HMG-CoA还原酶增加胆固醇合成，但其促进胆固醇在肝内转化为胆汁酸排出体外的效应更占优势；因此甲亢时血胆固醇偏低，而甲减时胆汁酸转化受阻导致高胆固醇血症。","remedial_node_id":"biochem_enzyme_competitive_inhibition"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_cholesterol_transformation_bile","title":"胆固醇去路：胆汁酸、激素与VitD₃","subject":"biochem","syllabus_refs":["syl_biochem_026","syl_biochem_024"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"环戊烷多氢菲不能降解，肝7α-羟化酶转胆汁酸为主去路，兼转肾上腺/性腺类固醇激素及皮肤7-脱氢胆固醇→VitD₃。","source_slides":["脂质代谢-2026.pdf#P183-P189"],"payload":{"bullets":["母核命运：人体缺乏拆解{{环戊烷多氢菲}}母核的酶，胆固醇无法彻底氧化产ATP，仅能侧链修饰转化或经胆道随粪排泄。","主要去路（肝）：肝细胞微粒体限速酶{{胆固醇7α-羟化酶}}将27C胆固醇转为24C初级胆汁酸，再结合甘氨酸/牛磺酸成胆盐入肠乳化脂肪。","类固醇激素：肾上腺皮质球/束/网三带分别合成{{醛固酮、皮质醇、雄激素}}；睾丸间质细胞造{{睾酮}}，卵巢卵泡内膜/黄体造雌二醇与孕酮。","维生素D₃活链：皮肤{{7-脱氢胆固醇}}经紫外线转为Vit D₃，再依次经{{肝25-羟化}}与{{肾1α-羟化}}生成1,25-(OH)₂D₃促肠钙吸收（缺之致佝偻/软骨病）。","直接排泄：部分未吸收胆固醇在结肠受细菌还原C5=C6双键生成难吸收的亲脂性{{粪固醇}}，直接随粪便排出体外。"],"trap_note":"胆汁酸合成的限速酶是胆固醇7α-羟化酶（非HMG-CoA还原酶）；VitD₃需经肝、肾先后两次羟化方具最强升血钙活性。","quiz":{"stem":"慢性肾衰竭尿毒症患者即使日照充足且肝功能良好，仍易发肾性骨营养不良和低钙抽搐，其胆固醇下游转化障碍位点在？","options":["皮肤7-脱氢胆固醇经UV裂环变成前维生素D₃","肝微粒体7α-羟化酶催化胆固醇生成初级胆汁酸","结肠细菌将未吸收胆固醇还原生成难吸收粪固醇","肾微粒体1α-羟化酶催化生成活性VitD₃"],"answer_idx":3,"explain":"维生素D₃活性形成需要三站接力：皮肤紫外照射生成VitD₃→肝25-羟化成25-(OH)D₃→最后必须在肾皮质微粒体完成关键的1α-羟化生成1,25-(OH)₂D₃才能高效促小肠吸钙。","remedial_node_id":"biochem_cholesterol_synthesis_hmgcoa"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_lipoprotein_classification_apoproteins","title":"四大血浆脂蛋白分类与载脂蛋白开关","subject":"biochem","syllabus_refs":["syl_biochem_027"],"syllabus_tier":"master","node_type":"comparison_matrix","anchor_summary":"依密度(CM\u003cVLDL\u003cLDL\u003cHDL)及电泳(原点/前β/β/α)区分四类微粒，分别借apo B48/B100/CⅡ/AⅠ/E充当酶与受体钥匙。","source_slides":["脂质代谢-2026.pdf#P8,P192-P201,P227"],"payload":{"columns":["脂蛋白（电泳名）","合成部位与核心脂质","关键载脂蛋白开关","主要生理运输方向"],"rows":[["CM（原点 · 密度\u003c0.96）","小肠黏膜 · 外源TG(80–95%)","apo B48(合成) · CⅡ(激活LPL) · E","外源性TG与胆固醇→外周与肝"],["VLDL（前β · 0.96–1.006）","肝细胞 · 内源TG(50–70%)","apo B100(识别LDLR) · CⅡ · E","内源性TG→外周（合成受阻成脂肪肝）"],["LDL（β · 1.006–1.063）","血浆VLDL转化 · 胆固醇(45–50%)","apo B100（唯一主载脂蛋白）","内源性胆固醇→肝与肝外（致AS）"],["HDL（α · 1.063–1.210）","肝/肠/血浆 · 蛋白50%+PL25%","apo AⅠ(激活LCAT/认HDL-R) · CⅡ库","肝外胆固醇逆向转运→肝变胆酸（抗AS）"]],"quiz":{"stem":"遗传性apo CⅡ完全缺失的患者即使能正常合成并分泌CM和VLDL，空腹血浆静置仍呈乳糜状且甘油三酯极高，核心原因在于？","options":["毛细血管内皮脂蛋白脂肪酶(LPL)缺乏激活剂","小肠黏膜细胞无法装配apo B48形成新生CM","血浆卵磷脂胆固醇脂酰转移酶(LCAT)完全失活","肝细胞表面LDL受体无法识别含有apo E的残粒"],"answer_idx":0,"explain":"位于组织毛细血管内皮细胞表面的脂蛋白脂肪酶(LPL)必须由CM和VLDL表面的apo CⅡ激活才能水解核心甘油三酯；apo CⅡ缺失致使CM与VLDL均无法卸下TG，造成严重高乳糜/高TG血症（注：apo CⅢ相反抑制LPL）。","remedial_node_id":"biochem_lipid_digestion_absorption"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_lipoprotein_trafficking_as","title":"脂蛋白代谢流向、RCT与动脉粥样硬化","subject":"biochem","syllabus_refs":["syl_biochem_027"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"LPL/HL依次卸下CM与VLDL脂酰转为LDL；ox-LDL逃脱LDLR负反馈被清道夫受体吞成泡沫细胞，唯靠HDL借ABCA1-LCAT-CETP逆运回肝。","source_slides":["脂质代谢-2026.pdf#P202-P226,P231-P243"],"diagram_assets":[{"path":"assets/biochem_lipid_lipoprotein_traffic_p226.webp","caption":"血浆脂蛋白代谢四路全景：外源CM(蓝)、内源VLDL/IDL/LDL(棕)、HDL逆向胆固醇转运RCT(紫)及肝胆汁酸肠肝循环(绿)","source_page":226}],"payload":{"steps":[{"cue":"外源乳糜微粒(CM)如何快速卸下甘油三酯并被肝脏清扫？空腹血为何不含CM？","reveal":"CM从HDL借来apo CⅡ激活毛细血管【LPL】水解TG供外周，残粒凭【apo E】经肝LRP/LDLR清除；半寿期仅5–15分故空腹12–14h血中不含CM。","mechanism_tag":"外源CM快速清扫"},{"cue":"内源VLDL→IDL→LDL级联后，正常的LDL受体(apo B/E受体)途径怎样维持细胞胆固醇自稳？","reveal":"2/3 LDL经LDLR内吞溶酶体释放游离胆固醇：抑制【HMG-CoA还原酶】与【LDLR合成】、激活【ACAT】酯化储存；LDLR突变则致家族性高胆固醇血症。","mechanism_tag":"LDLR负反馈自稳"},{"cue":"既然LDLR有负反馈上限，血浆高LDL为何仍会在动脉壁堆出泡沫细胞与粥样硬化(AS)？","reveal":"内皮受损后LDL滞留内膜下氧化成mmLDL→【ox-LDL】，转被巨噬/平滑肌表面无负反馈限制的【清道夫受体(SR)】狂吞成【泡沫细胞】并诱发AS（Lp(a)亦促斑块）。","mechanism_tag":"ox-LDL清道夫通道"},{"cue":"HDL如何分步执行“胆固醇逆向转运(RCT)”实现抗动脉粥样硬化？","reveal":"盘状新生HDL借【ABCA1】从泡沫细胞移出游离胆固醇→【LCAT(apo AⅠ激活)】酯化推入内核变球状HDL₃→经【CETP】换入VLDL/LDL(70%回肝LDLR)或直走肝SR-BI(20%)/apoE-R(10%)入肝转胆汁酸。","mechanism_tag":"ABCA1-LCAT-CETP逆运"}],"takeaway":"CM运外源TG、VLDL运内源TG、LDL运胆固醇易氧化致泡沫细胞，而HDL凭ABCA1/LCAT/CETP把外周胆固醇送回肝变胆汁酸排出。","quiz":{"stem":"与正常LDL受体途径相比，巨噬细胞通过清道夫受体(SR)摄取ox-LDL最终演变为泡沫细胞最致命的调控差别在于？","options":["巨噬细胞缺乏溶酶体水解酶使胆固醇酯完全无法降解","清道夫受体仅识别含有apo B48而不含apo B100的微粒","清道夫受体表达不受胞内高游离胆固醇浓度负反馈下调","摄取ox-LDL后细胞内ACAT活性被游离胆固醇彻底关闭"],"answer_idx":2,"explain":"正常LDL受体受胞内游离胆固醇严格负反馈抑制，细胞“吃饱”即关闭受体；而巨噬/平滑肌细胞的清道夫受体无此负反馈刹车，会无休止吞噬内膜下ox-LDL直至胞内蓄满胆固醇酯滴变泡沫细胞。","remedial_node_id":"biochem_lipoprotein_classification_apoproteins"}},"added_at":"2026-11-17T09:15:28+08:00"},{"id":"biochem_ketoacid_glucogenic_ketogenic","title":"α-酮酸三大去路与生糖生酮氨基酸归类","subject":"biochem","syllabus_refs":["syl_biochem_030"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"α-酮酸经再氨基化、氧化供能或按碳骨架入口分流为生糖(13种)、生酮(亮/赖2种)及生糖兼生酮(5种)。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P30,P37-P38,P43-P45"],"diagram_assets":[{"path":"assets/biochem_aa_ketoacid_hub_p45.webp","caption":"糖、脂质、氨基酸代谢相互联系（图12-1）：丙酮酸↔Ala、草酰乙酸↔Asp、α-酮戊二酸↔Glu/Gln 三大枢纽与生糖/生酮入口","source_page":45}],"payload":{"columns":["代谢类别","包含氨基酸（共20种）","碳骨架入口与代谢去路"],"rows":[["生糖氨基酸 (13种)","Gly/Ser/Val/His/Arg/Cys/Pro/Ala/Glu/Gln/Asp/Asn/Met","转为丙酮酸或TCA草酰乙酸/α-酮戊二酸/琥珀酰CoA，经糖异生净产糖"],["生酮氨基酸 (仅2种)","亮氨酸 (Leu)、赖氨酸 (Lys)","仅降解为乙酰CoA或乙酰乙酸，受PDH不可逆锁闭只能生酮不能净生糖"],["生糖兼生酮 (5种)","异亮/苯丙/酪/苏/色 (一本落色书)","碳链裂解分别产出丙酮酸/延胡索酸/琥珀酰CoA及乙酰CoA/乙酰乙酸"],["再氨基与供能","丙酮酸↔Ala · OAA↔Asp · α-KG↔Glu","接回氨基生成非必需氨基酸，或入TCA循环氧化提供约1/5人体能量"]],"quiz":{"stem":"向禁食糖尿病模型动物仅单独灌胃大量亮氨酸与赖氨酸（配足量热卡）后，血中将呈现哪种特征性改变？","options":["丙酮酸绕行糖异生净转化令空腹血糖迅速升高","草酰乙酸大量积累并经苹果酸穿梭彻底转变为糖","酮体水平明显升高但无法实现葡萄糖净合成增加","琥珀酰CoA池扩大推动丙二酰CoA抑制酮体生成"],"answer_idx":2,"explain":"亮氨酸和赖氨酸是仅有的2种纯生酮氨基酸，碳骨架只生成乙酰CoA或乙酰乙酸；因丙酮酸脱氢酶复合体(PDH)不可逆，乙酰CoA无法净转化为草酰乙酸或葡萄糖，只能生酮。","remedial_node_id":"biochem_pdh_complex_mechanism"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_one_carbon_fh4","title":"一碳单位概念、FH₄载体五形式与来源","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"master","node_type":"structure_cloze","anchor_summary":"Ser/Gly/His/Trp分解产生五种活性一碳基团（不含CO₂），由FH₄的N⁵、N¹⁰位携载并互变。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P9-P15"],"diagram_assets":[{"path":"assets/biochem_aa_onecarbon_fh4_p11.webp","caption":"四氢叶酸(FH₄)以N⁵与N¹⁰位共价结合甲基、亚甲基、次甲基、甲酰基、亚氨甲基五种一碳单位结构图","source_page":11}],"payload":{"bullets":["概念界定：某些氨基酸分解代谢产生的含1个碳原子的活性有机基团，但绝对不包括{{CO₂}}。","运载体生成：叶酸经{{二氢叶酸还原酶(DHFR)}}消耗2分子{{NADPH}}还原为5,6,7,8-四氢叶酸(FH₄)，以{{N⁵、N¹⁰}}位携碳。","五种携带形式：甲基({{-CH₃}})、亚甲基({{-CH₂-}})、次甲基({{=CH-}})、甲酰基({{-CHO}})、亚氨甲基({{-CH=NH}})。","四大来源氨基酸（“干丝煮蛇”）：{{丝氨酸}}（最主要，羟甲基转移酶）、{{甘氨酸}}（裂解酶）、{{组氨酸}}与{{色氨酸}}。","不可逆瓶颈：五种形式可经NADPH/NAD⁺氧化还原互变，唯独{{N⁵,N¹⁰-CH₂-FH₄ → N⁵-CH₃-FH₄}}生理上几乎不可逆。"],"trap_note":"CO₂虽含单碳但属彻底氧化终产物（由生物素携带），不是一碳单位；N⁵-CH₃-FH₄生成后无法逆退回亚甲基/甲酰基形式。","quiz":{"stem":"同位素示踪发现某患者丝氨酸β-碳原子无法进入胸苷酸合成，且甘氨酸裂解途径受阻，最可能缺乏的辅酶或催化形式是？","options":["生物素辅基结合的游离碳酸氢根及羧基供体","四氢叶酸及其携载的N⁵,N¹⁰-亚甲基形式","S-腺苷甲硫氨酸携带的活性甲基供体基团","泛酸衍生的辅酶A分子末端携带的活性酰基"],"answer_idx":1,"explain":"丝氨酸（丝氨酸羟甲基转移酶）与甘氨酸（甘氨酸裂解酶）分解均直接产生N⁵,N¹⁰-亚甲基-FH₄（N⁵,N¹⁰-CH₂-FH₄），该形式直接将甲基供予dUMP合成dTMP；CO₂由生物素携载而不属一碳单位。","remedial_node_id":"biochem_enzyme_cofactors_vitamins"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_one_carbon_nucleotides_drugs","title":"一碳单位核酸合成、巨幼贫与抗叶酸药","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"一碳单位供嘌呤与dTMP合成，缺乏FH₄致巨幼细胞贫血；磺胺抑细菌FH₂合成酶，MTX抑人DHFR。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P16-P17"],"payload":{"steps":[{"cue":"一碳单位如何把氨基酸代谢直接接入嘌呤与胸苷酸(DNA)合成？","reveal":"N¹⁰-CHO-FH₄为嘌呤环C2、C8供碳；N⁵,N¹⁰-CH₂-FH₄将dUMP甲基化为dTMP（反应氧化生成FH₂，须靠DHFR再生FH₄）。","mechanism_tag":"嘌呤与dTMP原料"},{"cue":"缺乏叶酸或DHFR受抑时，为何造血细胞表现为“核幼浆老”的巨幼细胞贫血？","reveal":"FH₄池枯竭令嘌呤与dTMP合成瘫痪、DNA复制停滞，而RNA与胞质血红蛋白合成照常进行，细胞体积增大却核发育迟滞。","mechanism_tag":"巨幼细胞贫血"},{"cue":"磺胺类抗菌药与甲氨蝶呤(MTX)抗肿瘤为何均靶向叶酸链却毒性分化？","reveal":"细菌自合成叶酸而人靠外源摄取：磺胺竞争抑细菌FH₂合成酶（不伤人酶）；MTX强力竞争抑人及肿瘤细胞DHFR，全面阻断FH₄再生。","mechanism_tag":"抗代谢双药靶点"}],"takeaway":"一碳单位是氨基酸连接核苷酸合成的总桥；磺胺阻断细菌FH₂合成，甲氨蝶呤(MTX)阻断真核细胞DHFR还原再生FH₄。","quiz":{"stem":"大剂量甲氨蝶呤(MTX)化疗后常用“亚叶酸(N⁵-甲酰FH₄)”而非普通叶酸解救正常骨髓细胞，其生化逻辑是？","options":["普通叶酸易被细菌FH₂合成酶竞争拮抗失去药效","普通叶酸可直接阻断核苷酸从头合成加重贫血","亚叶酸能绕过一碳单位直接催化脱氧核糖还原","MTX锁死DHFR后唯有亚叶酸能补足FH₄"],"answer_idx":3,"explain":"普通叶酸必须经DHFR两步还原成为FH₄才有活性，而MTX已竞争性锁死DHFR；亚叶酸本身已是还原型四氢叶酸衍生物，可绕过DHFR直接转化补充一碳单位池。","remedial_node_id":"biochem_enzyme_competitive_inhibition"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_methionine_sam_cycle","title":"甲硫氨酸循环、SAM供甲基与B₁₂陷阱","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"master","node_type":"mechanism_flow","anchor_summary":"Met耗ATP生成直接甲基供体SAM；经Hcy再甲基化再生Met依赖Vit B₁₂，缺B₁₂触发甲基陷阱致巨幼贫。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P18-P25"],"diagram_assets":[{"path":"assets/biochem_aa_sam_methyl_p20.webp","caption":"S-腺苷甲硫氨酸(SAM)在甲基转移酶催化下向RH移交活性甲基转为S-腺苷同型半胱氨酸并脱腺苷生成同型半胱氨酸","source_page":20}],"payload":{"steps":[{"cue":"甲硫氨酸为何必须先消耗ATP活化成SAM才能充当体内万能甲基供体？","reveal":"腺苷转移酶催化ATP脱去PPi+Pi生成锍正离子【SAM】，使其甲基高度活化为直接供体（合成肌酸、肾上腺素、卵磷脂与DNA甲基化）。","mechanism_tag":"SAM直接供甲基"},{"cue":"SAM交出甲基后如何演变为同型半胱氨酸(Hcy)并维持甲硫氨酸循环？","reveal":"SAM转甲基成S-腺苷同型半胱氨酸(SAH)后水解为【同型半胱氨酸】，再接受间接甲基供体【N⁵-CH₃-FH₄】的甲基再生甲硫氨酸。","mechanism_tag":"甲硫氨酸循环"},{"cue":"为何缺乏维生素B₁₂会像缺叶酸一样诱发一碳单位障碍与巨幼细胞贫血？","reveal":"催化Hcy再甲基化的甲硫氨酸合成酶专需【Vit B₁₂】；缺B₁₂使【N⁵-CH₃-FH₄】因前步不可逆而死锁堆积，游离FH₄耗竭（甲基陷阱）。","mechanism_tag":"Vit B₁₂甲基陷阱"},{"cue":"高同型半胱氨酸(Hcy)血症损伤血管，其代谢清除受哪三种B族维生素调控？","reveal":"Hcy既靠【叶酸+Vit B₁₂】再甲基化回Met，又可经依赖【Vit B₆(PLP)】的转硫途径不可逆转成半胱氨酸，三者任一缺乏均可致高Hcy血症。","mechanism_tag":"叶酸/B₁₂/B₆调Hcy"}],"takeaway":"N⁵-CH₃-FH₄是间接甲基供体，SAM是直接供体；Vit B₁₂卡在甲硫氨酸合成酶与FH₄再生交界处，缺B₁₂引发甲基陷阱。","quiz":{"stem":"恶性贫血患者因内因子缺乏导致严重维生素B₁₂吸收障碍时，胞内叶酸与一碳单位代谢池的特征性异常是？","options":["N⁵-甲基FH₄大量堆积而游离FH₄再生耗竭","亚甲基FH₄大量逆向分解成自由叶酸随尿排出","SAM在细胞质过度积聚反馈关闭腺苷转移酶","同型半胱氨酸经甲硫氨酸合成酶转为半胱氨酸"],"answer_idx":0,"explain":"N⁵,N¹⁰-CH₂-FH₄还原成N⁵-CH₃-FH₄不可逆，唯独依赖Vit B₁₂的甲硫氨酸合成酶能把N⁵-CH₃-FH₄脱甲基释放出游离FH₄。缺B₁₂使叶酸全被困死在N⁵-CH₃-FH₄，阻断嘌呤与dTMP合成。","remedial_node_id":"biochem_one_carbon_fh4"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_cysteine_taurine_paps","title":"半胱氨酸：二硫键、GSH、牛磺酸与PAPS","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"半胱氨酸借巯基形成蛋白二硫键并供GSH抗氧化，还可氧化脱羧成牛磺酸及耗ATP活化为PAPS。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P26-P29"],"payload":{"bullets":["巯基(-SH)与二硫键：2分子半胱氨酸脱氢可逆连成{{胱氨酸}}（如溶菌酶4对二硫键稳固构象）；游离-SH维系LDH等{{巯基酶}}活性。","谷胱甘肽(GSH)：含半胱氨酸核心{{-SH}}及谷氨酸{{γ-肽键}}，专司清除自由基与H₂O₂、维持红细胞膜与巯基酶还原态。","牛磺酸合成：半胱氨酸氧化为磺基丙氨酸再脱羧成{{牛磺酸}}，在肝内与初级胆汁酸结合生成{{结合胆汁酸}}增强乳化。","活性硫酸根(PAPS)：半胱氨酸氧化供SO₄²⁻，耗2分子ATP活化成{{PAPS}}（3'-磷酸腺苷-5'-磷酰硫酸），供肝结合解毒与硫酸化蛋白聚糖。"],"trap_note":"甲硫氨酸可通过同型半胱氨酸转硫把硫原子转给丝氨酸生成半胱氨酸，故半胱氨酸属非必需氨基酸；但转硫不可逆，半胱氨酸绝不能逆转成甲硫氨酸。","quiz":{"stem":"尽管体内半胱氨酸可经转硫途径由甲硫氨酸衍生而来，但长期摄取足量半胱氨酸却完全无甲硫氨酸膳食仍致负氮平衡，原因是？","options":["半胱氨酸不能氧化提供肝生物转化所需的PAPS","半胱氨酸无法在红细胞内参与合成谷胱甘肽(GSH)","半胱氨酸无法逆向再甲基化合成同型半胱氨酸碳链","半胱氨酸无法脱羧生成牛磺酸参与胆汁酸的结合"],"answer_idx":2,"explain":"甲硫氨酸借同型半胱氨酸把硫转给丝氨酸碳骨架合成半胱氨酸，故摄入Cys可节省Met，但该转硫过程单向不可逆且人体无法合成同型半胱氨酸的四碳链，因此Met仍为必需氨基酸。","remedial_node_id":"biochem_methionine_sam_cycle"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_aromatic_phe_tyr_disorders","title":"苯丙氨酸与酪氨酸代谢及三大遗传酶缺陷","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"Phe羟化为Tyr后再分流合成儿茶酚胺、黑色素或开环分解；对应酶缺陷依次致PKU、白化病与黑尿症。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P30-P34"],"diagram_assets":[{"path":"assets/biochem_aa_tyr_pathways_p31.webp","caption":"酪氨酸两条主要合成支路对比：神经/肾上腺经酪氨酸羟化酶→儿茶酚胺 vs 黑色素细胞经酪氨酸酶→多巴醌→黑色素","source_page":31}],"payload":{"columns":["遗传病 / 分流","缺陷酶与关键辅因子","蓄积代谢物与临床表型机制"],"rows":[["苯丙酮尿症 (PKU)","苯丙氨酸羟化酶 (需BH₄ + NADPH)","Phe转氨成苯丙酮酸/苯乙酸(鼠尿味)；缺Tyr致毛发浅与智力障碍"],["白化病 (Albinism)","黑色素细胞酪氨酸酶 (Tyr→多巴醌)","吲哚醌与黑色素合成受阻；皮肤毛发虹膜发白、畏光且易患皮肤癌"],["尿黑酸尿症 (黑尿症)","尿黑酸氧化酶/分解酶 (羟苯丙酮酸后)","尿黑酸随尿排出遇空气氧化变黑，沉积软骨引褐黄病性关节炎"],["儿茶酚胺合成支路","酪氨酸羟化酶(BH₄)→多巴→DA→NE→E(SAM)","分布于神经与肾上腺髓质，独立于黑色素细胞酪氨酸酶"]],"quiz":{"stem":"先天性白化病患者皮肤毛发呈白色且极易晒伤，但肾上腺髓质与交感神经仍能正常合成肾上腺素和去甲肾上腺素，这说明？","options":["苯丙氨酸羟化酶可替代酪氨酸酶合成肾上腺素","儿茶酚胺走酪氨酸羟化酶通路独立于酪氨酸酶","肾上腺髓质可通过尿黑酸氧化酶绕道生成多巴胺","高浓度苯丙酮酸能够直接激活肾上腺多巴脱羧酶"],"answer_idx":1,"explain":"白化病仅缺失黑色素细胞中的酪氨酸酶（负责酪氨酸→多巴→多巴醌→黑色素）；神经元与肾上腺髓质合成儿茶酚胺使用另一套酶——依赖BH₄的酪氨酸羟化酶，因此完全不受白化病波及。","remedial_node_id":"biochem_enzyme_cofactors_vitamins"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_aa_nutrition_digestion","title":"【拓展】氮平衡、必需氨基酸互补与蛋白消化","subject":"biochem","syllabus_refs":["syl_biochem_028"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"依16%含氮律判定氮平衡；9种必需氨基酸互补提效；胃酸与肠激酶启动酶原瀑布及Na⁺主动吸收。","source_slides":["2026-基医-氨基酸代谢-1.pdf#P4-P14"],"payload":{"bullets":["氮平衡三态：按蛋白平均含氮{{16%}}(定氮×6.25)计，正常成人总平衡、发育/孕妇/恢复期{{正平衡}}、饥饿/烧伤呈{{负平衡}}。","9种必需氨基酸（“假设来租借一两本书”）：{{Met/Trp/Lys/His/Val/Ile/Leu/Phe/Thr}}；谷类缺{{赖氨酸}}与豆类缺蛋/色氨酸互补。","酶原激活瀑布：胃蛋白酶原由HCl及自身激活；小肠{{肠激酶}}先激活{{胰蛋白酶原}}，再激活其余内/外肽酶切成1/3氨基酸+2/3寡肽。","耗能主动吸收：小肠刷状缘借7类载体同向转运氨基酸/寡肽与Na⁺，再靠{{Na⁺-K⁺泵}}耗ATP排Na⁺，消化并消除食物抗原性。"],"trap_note":"精氨酸体内可合成但快速生长期易供不应求，归为半必需氨基酸；三聚氰胺含氮66%曾在伪造凯氏定氮中冒充真蛋白。","quiz":{"stem":"先天性肠激酶（肠致活酶）完全缺乏的新生儿出现严重蛋白质吸收不良与低蛋白血症，其核心酶学机制是？","options":["胰蛋白酶原无法激活致使后续胰酶原级联停摆","胃壁细胞盐酸分泌障碍令胃蛋白酶原无法激活","小肠黏膜细胞钠泵失去ATP供能致主动吸收受阻","胃蛋白酶特异性水解碱性氨基酸肽键功能丧失"],"answer_idx":0,"explain":"肠激酶负责激活胰蛋白酶原生成胰蛋白酶，而胰蛋白酶又负责激活胰凝乳蛋白酶原、弹性蛋白酶原和羧肽酶原A/B；缺乏肠激酶将直接导致整个小肠胰蛋白酶级联激活瘫痪。","remedial_node_id":"biochem_enzyme_zymogen_and_covalent"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_aa_decarboxylation_amines","title":"【拓展】氨基酸PLP脱羧产生物活性胺与NO","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"understand","node_type":"comparison_matrix","anchor_summary":"PLP依赖脱羧酶产GABA、组胺、5-HT与多胺（MAO灭活），精氨酸则由NOS/BH₄生成NO。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P3-P8,P35,P40-P41"],"payload":{"columns":["生物活性物","前体氨基酸与关键酶","核心生理功能与临床靶点"],"rows":[["GABA","谷氨酸 → L-谷氨酸脱羧酶(PLP)","脑内抑制性神经递质；苯二氮䓬类作用于GABA受体"],["组胺","组氨酸 → 肥大细胞组氨酸脱羧酶","强扩血管增通透性、缩支气管、促胃酸；H₁抗过敏/H₂抑酸"],["5-HT / 烟酸","色氨酸 → 羟化酶(BH₄)+脱羧酶","脑内抑制传导、外周缩血管；肝加氧分解供一碳与烟酸"],["多胺(精脒/精胺)","鸟氨酸(ODC→腐胺)+脱羧基SAM","促细胞增殖；血/尿多胺增高用作肿瘤辅助诊断监测指标"],["一氧化氮(NO)","精氨酸 → NOS(耗NADPH，需BH₄)","激活sGC升cGMP舒血管(硝酸酯类与PDE5抑制剂通路)"]],"quiz":{"stem":"某患者因重度维生素B₆缺乏出现中枢兴奋惊厥与转氨功能障碍，此时哪一种氨基酸衍生信号分子的合成酶不直接受PLP缺失卡阻？","options":["谷氨酸经脱羧酶生成中枢抑制性递质GABA","组氨酸经肥大细胞脱羧酶生成扩血管的组胺","5-羟色氨酸经脱羧酶生成中枢递质5-HT","精氨酸经NOS借BH₄与NADPH生成NO"],"answer_idx":3,"explain":"GABA、组胺、5-HT均依赖以磷酸吡哆醛(PLP)为辅酶的氨基酸脱羧酶；而精氨酸经一氧化氮合酶(NOS)生成NO消耗NADPH并依赖BH₄/FAD/FMN/血红素，不依赖PLP。","remedial_node_id":"biochem_transamination_deamination"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"biochem_bcaa_catabolism_mma","title":"【拓展】支链氨基酸分解、MMA与mTOR","subject":"biochem","syllabus_refs":["syl_biochem_032"],"syllabus_tier":"understand","node_type":"mechanism_flow","anchor_summary":"Val/Leu/Ile共经转氨脱羧β-氧化分化生糖生酮；MUT/Vit B₁₂缺陷致甲基丙二酸血症(MMA)；Leu激活mTORC1。","source_slides":["2026-基医-氨基酸代谢-3.pdf#P36-P39"],"payload":{"steps":[{"cue":"三种必需支链氨基酸(Val/Leu/Ile)分解的共同前三步及碳骨架分化是什么？","reveal":"依次经转氨基、氧化脱羧及β-氧化分化：缬氨酸纯生糖(琥珀酰CoA)、亮氨酸纯生酮(乙酰CoA)、异亮氨酸生糖兼生酮。","mechanism_tag":"支链共分解分化"},{"cue":"为何丙酰CoA途径的MUT酶或Vit B₁₂缺陷会致致命性甲基丙二酸血症(MMA)？","reveal":"Val/Ile生成的丙酰CoA经甲基丙二酰CoA变位酶(MUT，辅酶Vit B₁₂)转琥珀酰CoA；阻断后甲基丙二酸蓄积诱发酸中毒与细胞毒。","mechanism_tag":"MUT/B₁₂卡点→MMA"},{"cue":"除氧化供能外，亮氨酸如何作为营养信号分子开关调控合成代谢？","reveal":"亮氨酸是细胞内【mTORC1】的主要激活剂，整合营养与胰岛素/IGF-1信号促进4EBP1/S6K1蛋白合成并抑制AMPK。","mechanism_tag":"亮氨酸激活mTOR"}],"takeaway":"支链氨基酸皆属必需氨基酸；Vit B₁₂既调控甲硫氨酸循环，又调控MUT防止甲基丙二酸血症（可与单纯叶酸缺乏鉴别）。","quiz":{"stem":"一名婴儿反复呕吐伴严重代谢性酸中毒，检测发现血和尿中甲基丙二酸与同型半胱氨酸同步显著升高，最符合哪种缺陷？","options":["单纯膳食叶酸缺乏引发四氢叶酸一碳池迅速耗竭","支链酮酸脱氢酶缺陷阻止亮氨酸生成乙酰CoA","B₁₂代谢障碍同步阻断MUT与甲硫氨酸合成酶","单纯MUT基因突变令甲基丙二酰CoA无法异构"],"answer_idx":2,"explain":"人体仅有两个依赖Vit B₁₂的酶：甲基丙二酰CoA变位酶(MUT)与甲硫氨酸合成酶。单纯MUT缺陷仅升甲基丙二酸，单纯缺叶酸仅升同型半胱氨酸，唯有Vit B₁₂代谢缺陷使二者同升。","remedial_node_id":"biochem_fa_special_oxidation_elongation"}},"added_at":"2026-11-17T09:47:28+08:00"},{"id":"physio_research_levels_methods","title":"生理学三研究水平与实验方法转化","subject":"physiology","syllabus_refs":["syl_physiology_001"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"生理学从整体、器官系统及细胞分子三水平开展在体/离体、急/慢性与动物/人体实验，重在从离体回归整体转化。","source_slides":["基础医学分论-1-绪论机体功能的调节20261014.pptx#P3-P12"],"payload":{"bullets":["实验医学奠基：17世纪 William Harvey 著《动物心血运动论》，确立生理学作为{{实验性生物学}}科学探索功能与调控规律。","三大研究水平：{{整体水平}}（运动对心肺及冷刺激内分泌整合）、{{器官和系统水平}}（心电扩布与NE效应）及{{细胞和分子水平}}（普通/细胞生理，如肌缩与腺泌）。","三对实验方法：{{在体(in vivo) vs 离体(in vitro)}}、{{急性 vs 慢性实验}}、{{动物 vs 人体实验}}；病理学/病生常用动物与离体模型模拟疾病轴。","知识外推铁律：理解器官机制必须完成两大跨尺度矫正——{{从离体到整体}}（补回神经体液整合）与{{从动物到人体}}（警惕种属差异）。"],"trap_note":"离体器官实验剥离了神经反射与体液激素背景，能看清局部自身调节本质，却不可直接等同于在体完整机体的净效应！","quiz":{"stem":"灌流离体兔心时加入去 :"2026-11-17T11:19:24+08:00"},{"id":"physio_gpcr_second_messengers","title":"GPCR开关与cAMP/IP₃双信使轴","subject":"physiology","syllabus_refs":["syl_physiology_006"],"syllabus_tier":"familiar","node_type":"mechanism_flow","anchor_summary":"GPCR激活Gα-GTP/GDP分子开关并解离Gβγ，分别经Gs/Gi调控AC-cAMP-PKA或经Gq激活PLC-IP₃/DAG-Ca²⁺-PKC通路。","source_slides":["细胞跨膜物质转运-基础医学分论2026-chyh.pdf#P40-P45"],"payload":{"steps":[{"cue":"第一步开关：配体结合7次跨膜GPCR后，异三聚体G蛋白如何完成从静息到激活的切换？","reveal":"构象改变促使Gα亚基释放GDP并结合GTP转为激活态，随即将Gα-GTP与Gβγ复合体解离，各自激活下游效应器；待Gα自带GTP酶水解GTP为GDP即复位关闭。","mechanism_tag":"Gα-GTP/GDP 开关"},{"cue":"Gs/Gi vs Gt 分支：针对腺苷酸环化酶(AC)与磷酸二酯酶(PDE)，不同G蛋白怎样反向调控环核苷酸？","reveal":"Gs激活AC促ATP→cAMP↑，进而活化PKA磷酸化靶酶（如肝糖原分解与脂肪动员ATGL/HSL级联）；Gi则抑制AC↓；视杆细胞Gt激活PDE分解cGMP导致Na⁺通道关闭。","mechanism_tag":"AC-cAMP-PKA 轴"},{"cue":"Gq-PLC双信使轴：磷脂酶C(PLC)裂解膜磷脂PIP₂后产生的IP₃与DAG如何分工引爆双效应？","reveal":"水溶性IP₃扩散至内质网/肌质网开放IP₃受体钙通道促Ca²⁺瞬时飙升（驱动平滑肌药物-机械收缩耦联）；留于膜上的脂溶性DAG协同Ca²⁺激活膜蛋白激酶C(PKC)。","mechanism_tag":"PLC-IP₃/Ca²⁺-DAG-PKC"}],"takeaway":"记住GPCR三分支速配：Gs/Gi 管 AC→cAMP→PKA；Gq 管 PLC 裂解 PIP₂ 出 IP₃(放Ca²⁺) 与 DAG(活PKC)；Gt 管 PDE 降 cGMP。","quiz":{"stem":"若向细胞内显微注射一种不可被水解的 GTP 类似物（GTPγS），抑制 Gα 亚基的 GTP 酶水解终止功能，此时肾上腺素刺激后的 Gs-AC-PKA 通路将表现为何种异常？","options":["Gα恒定锁定于GDP失活态并使AC彻底关闭","膜外受体结合配体受阻并随即发生内吞降解","Gα持续解离激活AC致胞内cAMP高企难消","PLC被强制锁定抑制态阻断膜PIP₂的生成"],"answer_idx":2,"explain":"Gα自带GTP酶活性负责将GTP水解回GDP从而自动关闭信号；不可水解的GTPγS把Gα永久锁定在激活态，持续驱动AC大量生成cAMP（类似霍乱毒素机制）。","remedial_node_id":"physio_signaling_receptor_matrix"}},"added_at":"2026-11-17T11:19:24+08:00"},{"id":"physio_local_vs_action_potential","title":"电紧张与局部电位总和 vs 动作电位传导","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"膜电容Cm与膜电阻Rm决定电紧张电位按长度常数λ指数衰减；局部兴奋具等级性与总和性，达阈电位后转变为全或无不衰减AP。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P35,P40-P44"],"payload":{"columns":["生物电类型","膜电导与物理本质","幅度、总和与传导特征"],"rows":[["电紧张电位","静息膜被动电学特性(膜电容Cm充放电 + 膜电阻Rm)","按空间指数衰减 V=V₀e^(-x/λ)（距离达长度常数λ时降至0.37V₀）"],["局部电位/局部兴奋","被动电紧张电位 + 阈下少量Na⁺/阳离子通道主动开放","等级性（随刺激增强而大）、衰减性扩布、无不应期，可行时间与空间总和"],["动作电位(AP)","达阈电位后电压门控Na⁺通道爆发正反馈再生循环","全或无（幅度恒定不叠加）、具绝对不应期；局部电流或有髓郎飞结跳跃不衰减传导"]],"quiz":{"stem":"关于骨骼肌神经-肌接头处的终板电位(EPP)与突触后神经元兴奋性突触后电位(EPSP)的共性，下列表述最准确的是：","options":["两者均由电压门控Na⁺通道正反馈开放引发且呈全或无","两者均属可叠加总和且随传播距离指数衰减的局部电位","两者均因自身具有绝对不应期而无法产生时间和空间总和","两者均能在无髓与有髓神经纤维上实现不衰减的远距传导"],"answer_idx":1,"explain":"EPP与EPSP都是由化学门控通道局部开放引起的去极化局部电位，本质为电紧张扩布加局部离子流，具有等级性、无不应期、可时间/空间总和及衰减传导特征。","remedial_node_id":"physio_resting_potential"}},"added_at":"2026-11-17T11:19:24+08:00"},{"id":"physio_excitability_refractory_cycle","title":"动作电位后电位、兴奋性四期与阈电位调控","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"AP周期依次经历绝对不应期(Nav失活)、相对不应期(K⁺外流)、超常期(ADP近阈)与低常期(AHP远阈)；低血钙下移阈电位诱发惊厥。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P18,P27-P34,P38-P39"],"diagram_assets":[{"path":"assets/physio_excitability_cycle_p38.webp","caption":"动作电位波形与兴奋性周期变化四阶段对齐图：绝对不应期(Nav失活)→相对不应期(K⁺外流)→超常期→低常期","source_page":38}],"payload":{"steps":[{"cue":"绝对不应期 (ARP)：为何锋电位期间无论给予多强的电刺激都绝对无法再引发第二个AP？","reveal":"电压门控Na⁺通道已全部激活或正处于失活态(h门关闭)，兴奋性降为零；该期时长严格限定AP呈脉冲式离散传递而不会相互融合。","mechanism_tag":"Nav失活 · ARP=0"},{"cue":"相对不应期 (RRP)：复极后期部分Nav通道已复活，为何此时仍需“阈上刺激”且新AP幅度偏小？","reveal":"部分Nav仍未摆脱失活且电压门控K⁺通道持续开放抵抗去极化，故阈强度高于正常（兴奋性\u003c100%），须更强刺激才能抢回主导。","mechanism_tag":"部分复活 + Kv抵抗"},{"cue":"后电位决定超常期 vs 低常期：为何先经历兴奋性\u003e100%的超常期，随后又跌入\u003c100%的低常期？","reveal":"去极化后电位(负后电位ADP)时Nav已基本复活且Vm仍略高于RP更接近阈电位，故入超常期；随后超极化后电位(正后电位AHP，因K⁺外流/生电钠泵)拉远至阈电位的差距，遂入低常期。","mechanism_tag":"ADP近阈 · AHP远阈"},{"cue":"阈电位偏转临床断点：细胞外低Ca²⁺或局麻药分别如何拨动阈电位水平？","reveal":"低血钙减弱Ca²⁺对膜外Na⁺通道屏蔽使阈电位下移（更易爆发AP，引发低钙惊厥）；局麻药锁死Nav失活态使阈电位上移、兴奋性骤降。神经元轴突始段Nav密度最高故阈最低。","mechanism_tag":"低钙下移 · 局麻上移"}],"takeaway":"记忆锚点：绝对不应期看Nav失活(兴奋性=0)，超常期趁负后电位近阈，低常期因正后电位远阈；低血钙下移阈电位诱发惊厥。","quiz":{"stem":"甲状旁腺意外切除导致严重低钙血症患者出现手足搐搦（低钙惊厥），其神经纤维膜兴奋性陡升的根本电生理机制是：","options":["细胞外低Ca²⁺激活K⁺漏通道使静息电位明显超极化","低Ca²⁺大幅加快Na⁺-K⁺泵速率并抬高动作电位超射值","低Ca²⁺减弱膜外屏蔽作用使阈电位下移更接近静息电位","低Ca²⁺彻底消除绝对不应期使兴奋直接融合而不间断"],"answer_idx":2,"explain":"细胞外Ca²⁺可稳定膜表面电荷并提高Na⁺通道开放阈值；低钙血症时阈电位水平向静息电位下移，导致极微小刺激即可触发神经肌肉自发放电抽搐。","remedial_node_id":"physio_action_potential"}},"added_at":"2026-11-17T11:19:24+08:00"},{"id":"physio_voltage_patch_clamp_gap","title":"电压钳/膜片钳分离电导与缝隙连接电传递","subject":"physiology","syllabus_refs":["syl_physiology_007"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"电压钳借负反馈钳制Vm配合TTX/TEA拆解内/外向电流，膜片钳千兆欧封接测单通道；缝隙连接凭连接子实现细胞间双向电传递。","source_slides":["生物电 陈咏华_细胞生物电活动-基础医学分论2026-chyh.pdf#P7,P23-P29,P36"],"payload":{"bullets":["波形与电流定义：内负外正称{{极化}}，去极化跨0mV翻转呈内正外负称{{反极化/超射}}；{{内向电流}}（如Na⁺内流）促去极化，{{外向电流}}（如K⁺外流）促复极/超极化。","电压钳 (Voltage Clamp) 逻辑：膜含电容Cm与电阻Rm令Vm随时变动；H-H负反馈电路把Vm固定于指令电位，消除电容电流后用{{补偿电流}}按 I=G(Vm-E) 反推通道电导。","药理拆解与膜片钳：{{河豚毒素(TTX)}}专断电压门控Na⁺内向电流，{{四乙胺(TEA)}}专断K⁺外向电流；Neher \u0026 Sakmann {{膜片钳}}凭千兆欧封接隔离1–5μm膜片记录单通道。","细胞间直接电传递：{{缝隙连接 (Gap junction)}}在2–4nm间隙内由双侧六聚体{{连接子(connexon)}}对接成亲水通道，使心肌闰盘与单单位平滑肌呈功能合胞体同步收缩。"],"trap_note":"电压钳消除的是因电压改变带来的电容充电电流(Ic=Cm·dV/dt)，从而只测量纯跨膜离子电流(Ii)；而缝隙连接传兴奋几乎无时间延搁且可双向扩布！","quiz":{"stem":"在枪乌贼巨轴突电压钳去极化阶跃实验中，若向浴液加入四乙胺(TEA)后再记录总跨膜离子电流，示波器上将单独显现出：","options":["一过性快速启动并随即衰减的内向Na⁺电流","延迟激活且呈持久平台的外向K⁺复极电流","完全呈直线且双向对称的零电容补偿电流","只随胞外[Cl⁻]浓度线性变化的被动漏电流"],"answer_idx":0,"explain":"TEA选择性阻断延迟激活的电压门控K⁺外向电流，从而剥离掉复极外向电流成分，使快速激活又迅速失活的一过性Na⁺内向电流单独显现（TTX则相反）。","remedial_node_id":"physio_action_potential"}},"added_at":"2026-11-17T11:19:24+08:00"},{"id":"physio_contraction_summation_motor_unit","title":"等长等张、强直收缩与运动单位大小原则","subject":"physiology","syllabus_refs":["syl_physiology_008"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"骨骼肌多先等长蓄力后等张缩短；高频刺激借Ca²⁺累加产强直收缩(3–4倍单收缩)，运动单位按大小原则募集并维持肌紧张。","source_slides":["肌细胞的收缩-基础医学分论2026-chyh.pdf#P19,P23-P24"],"payload":{"bullets":["收缩形式双态：{{等长收缩}}（仅张力↑、长度不变，对抗重负荷）vs {{等张收缩}}（张力恒定等于后负荷、肌纤维缩短做功）；整体生理活动绝大多数呈{{先等长后等张收缩}}。","时间(频率)总和：单次阈上刺激引起{{单收缩}}；若后一刺激落在舒张期成{{不完全强直收缩}}，落在收缩期内则叠加成张力达单收缩 {{3–4倍}} 的{{完全强直收缩}}。","强直为何能叠加而AP不能？因动作电位历时极短(1–3ms)且有绝对不应期绝不叠加，但高频AP连续触发终池放Ca²⁺使胞质{{[Ca²⁺]i高企}}并拉紧串联弹性成分。","空间总和与运动单位：单个{{α运动神经元}}及其支配的全部骨骼肌纤维合称{{运动单位}}；张力随同步募集运动单位数增加（{{多纤维总和}}），严格遵守{{大小原则}}（小单位低阈先募集）。","姿势稳态机制：{{肌紧张 (Muscle tone)}}是指缓慢持续牵拉下由少数运动单位交替轮流收缩维持骨骼肌一定紧张度（不疲劳），是维持躯体姿势的反射基础。"],"trap_note":"高频率刺激引起骨骼肌完全强直收缩时，叠加的是胞质Ca²⁺浓度与机械张力，神经和肌膜上的动作电位本身依然是一个个离散的脉冲，绝不融合！","quiz":{"stem":"用手指轻捏一枚鸡蛋与举起沉重哑铃时，脊髓对前臂肌群运动单位的募集策略符合 Henneman“大小原则”，其真实调控顺序是：","options":["优先激活大直径快缩运动单位再依次补足小单位","所有运动单位始终以单收缩脉冲等比例同步发放","先募低阈小运动单位随用力加大递增募大单位","借平滑肌样缝隙连接将全部肌纤维同步去极化"],"answer_idx":2,"explain":"依大小原则，胞体小、轴突细、兴奋阈值低的慢肌运动单位最先被募集完成精细捏持与持久抗重力；仅当需要爆发大力量时才逐步追加高阈值大运动单位。","remedial_node_id":"physio_ec_coupling_sliding"}},"added_at":"2026-11-17T11:19:24+08:00"},{"id":"physio_energy_substrates_atp_cp","title":"能源底物分工、ATP/CP缓冲与能量平衡","subject":"physiology","syllabus_refs":["syl_physiology_009"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"糖供能50%–70%、脂肪占储能75%；ATP为直接能量货币，CP作肌脑储备库；BMI 24/28界定超重肥胖。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P3-P10"],"diagram_assets":[{"path":"assets/physio_energy_starvation_stores_p08.webp","caption":"饥饿期间糖(\u003c1天耗竭)、脂肪(数周主力)与蛋白质储备动态消耗曲线(改自Guyton 1966)","source_page":8}],"payload":{"bullets":["糖占日常供能 {{50%–70%}}（有氧1mol产30–32 ATP，无氧仅2 ATP却为红细胞唯一路径）；脂肪供能30%–50%却占体内总储能 {{75%}}。","蛋白质主司组织更新与合成酶激素，仅长期饥饿/极度消耗时分解供能；其含氮基团随{{尿素}}等排出，体内氧化不完全致热价低于体外。","底物释放能量55%–75%先转化为热能维持体温，25%–45%载入 {{ATP}}；{{磷酸肌酸 (CP)}} 存于肌与脑中充当ATP的高能磷酸键储存库。","能量利用终局：除{{骨骼肌收缩}}对外做机械功外，机体其余一切生命活动消耗的能量最终全部转化为热能。","能量正平衡致肥胖、负平衡致消瘦；{{体质指数 (BMI)}} = 体重(kg)/身高²(m²)，我国成人标准 {{24}} 为超重、{{28}} 为肥胖。"],"trap_note":"糖是日常供能主力但总储备极小，饥饿1天内即耗竭；磷酸肌酸(CP)不能直接驱动肌丝滑行，必须经肌酸激酶将高能键转给ADP再生ATP。","quiz":{"stem":"某受试者连续断食 2 周且仅饮水（无额外体力劳作），其体内三大储能底物消耗特征最符合哪项判断？","options":["糖储备迅速耗竭，脂肪供能主导但保留蛋白","蛋白质最先大批分解，脂肪储备完全被锁定","肝糖原维持两周供能，磷酸肌酸逐日消耗殆尽","脂肪热价低于糖类，供能效率下降迫使停跳"],"answer_idx":0,"explain":"糖类虽占日常供能主力但储存量少、饥饿1天内耗竭；脂肪占储能75%且单位质量产热约糖2倍，在数周饥饿期承担主力供能从而保护自身蛋白质不被过早分解。","remedial_node_id":"biochem_tca_cycle_steps_energy"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_calorimetry_thermal_equiv","title":"直接 vs 间接测热与热价、氧热价","subject":"physiology","syllabus_refs":["syl_physiology_010"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"安静不做外功时产热量等于能量代谢量；蛋白在体内含氮产物未燃尽导致生物热价(18.0)\u003c物理热价(23.4)。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P11-P15"],"payload":{"columns":["能源/测热维度","物理热价 vs 生物热价","氧热价与呼吸商 (RQ)"],"rows":[["糖类 (Carbohydrate)","17.2 vs 17.2 kJ/g（体内外均彻底氧化为CO₂和H₂O）","氧热价 21.1 kJ/L（最高）· RQ = 1.00"],["脂肪 (Fat)","39.8 vs 39.8 kJ/g（单位质量产热约为糖2倍）","氧热价 19.6 kJ/L · RQ = 0.71（需O₂多）"],["蛋白质 (Protein)","23.4 vs 18.0 kJ/g（氨基成尿素尿酸排出未燃尽）","氧热价 18.9 kJ/L · RQ = 0.80"],["直接 vs 间接测热","直接测热（绝热小室水流测温，设备繁琐仅科研）","间接测热（定比定律测O₂/CO₂与尿氮，临床实用）"]],"quiz":{"stem":"弹式热量计测得蛋白质物理热价为 23.4 kJ/g，而人体氧化测定其生物热价仅 18.0 kJ/g，这一差值的直接生化原因是：","options":["蛋白质分子碳氢键在肌细胞内只能行无氧酵解","含氮基团未完全氧化而随尿素和尿酸排出体外","蛋白质呼吸商大于 1.0 导致氧热价被显著低估","氨基酸在肝内经三羧酸循环直接转为中性脂肪"],"answer_idx":1,"explain":"糖和脂肪体内外氧化终产物均为CO₂与H₂O，故物理热价等于生物热价；蛋白质中氮元素在体内转变为尿素、尿酸与肌酐随尿排出，这部分残余化学能未释放为热量。","remedial_node_id":"biochem_urea_cycle"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_rq_nprq_clinical_eval","title":"呼吸商(RQ)变动解析与非蛋白呼吸商","subject":"physiology","syllabus_refs":["syl_physiology_010"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"RQ反映氧化底物(糖1.0/脂0.71/混0.85)但受通气与酸碱干扰；测尿氮剥离蛋白得NPRQ，简法取0.82×20.20 kJ/L。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P16-P21"],"diagram_assets":[{"path":"assets/physio_energy_nprq_workflow_p18.webp","caption":"间接测热法演算流程：尿氮÷0.16扣除蛋白O₂/CO₂与产热后求非蛋白呼吸商(NPRQ)查表得总产热","source_page":18}],"payload":{"steps":[{"cue":"如何由实测 RQ = CO₂产生量 / O₂消耗量 推断机体主导氧化底物？","reveal":"纯糖氧化 RQ≈1.00；糖尿病糖利用障碍改以脂肪供能，RQ降至≈0.71；长期饥饿分解蛋白RQ≈0.80；正常混合食约0.85；体内糖大量转化为脂肪时净释CO₂，RQ可\u003e1。","mechanism_tag":"底物RQ漂移"},{"cue":"为何不能只凭 RQ 数值断定代谢底物切换？通气与酸碱失衡如何伪装 RQ？","reveal":"剧烈运动乳酸↑、肺过度通气或代谢性酸中毒使肺排出额外CO₂，造成RQ假性\u003e1；相反，肺通气不足或碱中毒潴留CO₂则压低实测RQ。","mechanism_tag":"通气/酸碱干扰"},{"cue":"临床如何“定氮剥离蛋白”算出非蛋白呼吸商 (NPRQ)，又如何简化？","reveal":"据蛋白含氮16%规律测尿氮÷0.16得氧化蛋白量，减去其O₂/CO₂得NPRQ查表；临床简化法取NPRQ=0.82（氧热价20.20 kJ/L），仅测耗O₂量误差仅1%–2%（自由活动用²H₂¹⁸O双标记水法）。","mechanism_tag":"定氮与临床简法"}],"takeaway":"RQ 受底物氧化比与呼吸排 CO₂ 双重决定；经尿氮剥离蛋白后按 NPRQ=0.82（氧热价 20.20 kJ/L）仅测耗氧量即可准确估算能量代谢率。","quiz":{"stem":"患者动脉血气示严重代谢性酸中毒伴明显深大过度通气（Kussmaul 呼吸），此时瞬时测得的呼吸商 (RQ) 若升至 1.15，最合理的解释是：","options":["胰岛素绝对不足迫使骨骼肌改以脂肪β-氧化为主","体内大量脂肪正在转化为糖原并净消耗二氧化碳","代偿性肺过度通气吹出额外二氧化碳造成假性升高","尿氮排泄骤降使非蛋白呼吸商直接超过 1.0 阈值"],"answer_idx":2,"explain":"RQ 仅在呼吸与酸碱稳态下反映细胞氧化底物；严重酸中毒或剧烈运动时过度通气使呼出CO₂远超组织实际生成量，导致RQ假性超过1.0。","remedial_node_id":"physio_calorimetry_thermal_equiv"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_energy_factors_sda","title":"能量代谢影响因素与食物特殊动力效应","subject":"physiology","syllabus_refs":["syl_physiology_011"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"肌肉活动影响最显著(耗氧可增10–20倍伴EPOC)；蛋白SDA高达30%源于肝内脱氨/尿素合成耗能。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P22-P28"],"payload":{"bullets":["影响代谢四大因素中{{肌肉活动}}最显著（占体重40%，耗氧随强度剧增10–20倍）；恢复期还需额外耗氧偿还{{氧债 (EPOC)}}，约20%乳酸氧化供80%再合成糖原。","安静思考与睡眠脑代谢变动极小，但{{精神紧张}}（恐惧愤怒）因无意识肌紧张与交感/甲状腺素/肾上腺素分泌而显著升高代谢。","环境温度 {{20–30℃}} 代谢最低最稳定；\u003c20℃ 因战栗与肌紧张上升，\u003e30℃ 因酶促加快、发汗及呼吸循环功增而升高。","{{食物特殊动力效应 (SDA)}}指进食后1h起延续2–8h额外产热：{{蛋白质高达 30%}}，糖6%、脂肪4%、混合膳食约10%。","SDA与胃肠消化吸收无关（静脉输注氨基酸仍出现，肝切除后消失），主因{{肝脏处理氨基酸脱氨与合成尿素/糖原}}及BAT激活额外耗能。"],"trap_note":"不要把 SDA 误解为胃肠蠕动耗能！静注氨基酸照样产生30% SDA而切除肝脏后立即消失，直接锁定肝脏氨基酸代谢与尿素合成（4高能键/分子）的耗能代价。","quiz":{"stem":"实验分别给正常犬与全肝切除犬经静脉恒速输注等热量混合氨基酸，观察到后者食物特殊动力效应 (SDA) 几乎消失，该现象证明 SDA 机制关键在于：","options":["肠道平滑肌蠕动与消化液主动分泌消耗大量ATP","小肠上皮细胞钠依赖性主动重吸收氨基酸耗能","骨骼肌吸收氨基酸后立即触发高频率寒战产热","肝内氨基酸脱氨及尿素合成等处理耗能显著↑"],"answer_idx":3,"explain":"静脉输注避开了消化道却仍有蛋白SDA，否定胃肠消化吸收主因；全肝切除后该效应消失，证实其核心机制在肝脏内处理氨基酸脱氨基、合成尿素与糖原的额外耗能。","remedial_node_id":"biochem_urea_cycle"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_bmr_surface_law","title":"基础状态(BMR)、体表面积定律与甲亢","subject":"physiology","syllabus_refs":["syl_physiology_012"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"基础状态需清醒静卧放松、餐后12–14h、室温20–25℃；按体表面积标化比较BMR，正常±15%内。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P29-P34"],"diagram_assets":[{"path":"assets/physio_energy_bmr_thyroid_p34.webp","caption":"正常人群(±15%)与粘液水肿(-20%至-40%)及甲亢(+25%至+80%)基础代谢率分布对照(图7-4)","source_page":34}],"payload":{"bullets":["{{基础状态}}四硬条件：清醒静卧肌肉放松、无精神紧张、{{餐后 12–14 小时}}（避开SDA）、室温 {{20–25℃}}（最低稳定能耗温区）。","BMR 维持呼吸循环等基本生命活动，略高于无梦熟睡期；个体间必须依{{体表面积定律}}以 kJ/(m²·h) 对比，不可直接按体重对比。","临床简算：BMR = 20.20 kJ/L × 每小时耗氧量(L) ÷ 体表面积(m²)；体表面积用 Stevenson 公式（0.0061×身高+0.0128×体重-0.1529）。","生理规律：同龄男性 \u003e 女性，儿童 \u003e 成人 \u003e 老人；相对值在 {{±15%}} 为正常，超过 {{±20%}} 考虑病理性改变。","病理诊断：{{甲亢}}显著升高 25%–80%，{{甲减（粘液水肿）}}降低 20%–40%；白血病、红细胞增多症与糖尿病亦↑，肾病综合征常↓。"],"trap_note":"基础代谢率不是人体最低代谢率（无梦熟睡时更低）；体型越小者体表面积/体重比越大、散热越快，因此同单位体重产热反而高于大型个体，只能按体表面积定律比。","quiz":{"stem":"一位体重 70 kg 的成年男性患者上午进食高蛋白早餐后 2 小时，在 15℃ 诊室静坐测得相对基础代谢率偏高 +28%，临床判断首先应排除的干扰是：","options":["未达空腹与中性室温引发SDA及冷产热","未采用双标记水法测量自由活动氧耗率","男性绝对值低于女性且体表面积估算失灵","清醒期基础代谢率低于无梦熟睡期水平"],"answer_idx":0,"explain":"受检者餐后2h正值蛋白SDA高峰(可持续2–8h)，且15℃室温低于20–25℃中性温区会诱发肌紧张与冷产热，均未达到基础状态测定要求，不能据此确诊甲亢。","remedial_node_id":"physio_energy_factors_sda"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_body_temp_core_shell_rhythms","title":"体核 vs 体壳温度及体温生理波动","subject":"physiology","syllabus_refs":["syl_physiology_013"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"生理体温指约37℃稳定体核温度（冷缩热扩体壳边界）；受SCN日节律(≤1℃)与黄体孕激素调节。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P35-P42"],"diagram_assets":[{"path":"assets/physio_thermo_core_shell_p36.webp","caption":"0℃、20℃ 与 35℃ 室温下人体体核温度与体壳温度分布范围的动态缩扩对比","source_page":36}],"payload":{"bullets":["{{体核温度}}（心脑肺腹腔脏器，稳定约37℃）即生理学所指“体温”；{{体壳温度}}（皮肤、皮下、肌肉）温差大，且二者分布边界随环境冷热可变。","临床测温基准：{{直肠 (36.5–37.7℃)}} \u003e 口腔 (36.3–37.2℃) \u003e 腋窝 (36.0–37.0℃)；食管近右心房，鼓膜接近下丘脑脑温。","昼夜节律由下丘脑{{视交叉上核 (SCN)}}生物钟控制：清晨 2–6 时最低，午后 1–6 时最高，日波动幅度不超过 {{1℃}}。","性别与年龄：女高约0.3℃，育龄女性排卵日最低、排卵后因黄体{{孕激素}}升高 0.3–0.6℃；新生儿\u003e成人\u003e老人（早产儿调节不完善）。","极端耐受限度：剧烈运动可升 1–2℃；脑温 \u003e42℃ 严重受损，\u003e44–45℃ 蛋白不可逆变性致死；\u003c34℃ 意识障碍，\u003c28℃ 心跳停止。"],"trap_note":"体核与体壳并无死板的解剖边界：0℃ 寒冷时四肢血管收缩并入体壳，体核缩退至胸腹与颅腔；35℃ 炎热时体核温区大举向四肢末梢扩展以利外周散热。","quiz":{"stem":"健康育龄女性在 25℃ 恒温环境下连续一月晨起刚醒卧床测舌下基础体温，某日突降约 0.2℃ 后于次日起持续升高 0.4℃ 维持两周，其内在机制是：","options":["下丘脑视交叉上核昼夜节律突然提前至凌晨两点","排卵后黄体分泌孕激素升高作用于体温调节中枢","室温25℃引起四肢体壳血管扩张令体核向肢端扩展","卵泡期雌激素峰直接刺激骨骼肌产生节律性战栗"],"answer_idx":1,"explain":"育龄女性基础体温随卵巢周期呈双相波动：排卵日体温最低，排卵后黄体分泌的孕激素及其代谢产物作用于下丘脑中枢，使基础体温升高 0.3–0.6℃ 直至下次月经。","remedial_node_id":"physio_bmr_surface_law"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_heat_production_organs_ucp","title":"产热器官切换、战栗与BAT解偶联产热","subject":"physiology","syllabus_refs":["syl_physiology_014"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"安静内脏占产热56%(肝为主)，运动骨骼肌占73%+；战栗不做功全变热，BAT靠UCP1质子漏解偶联产热。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P43-P49"],"payload":{"steps":[{"cue":"安静与运动时，体内主要产热引擎如何进行比例切换？","reveal":"安静时内脏(34%体重，以肝脏为主)贡献总产热56%、脑16%、骨骼肌仅18%；运动或劳动时骨骼肌(40%体重)产热飙升至73%以上成为绝对主力。","mechanism_tag":"安静内脏/运动骨骼肌"},{"cue":"突发寒冷刺激时，神经系统如何触发快速骨骼肌产热与肾上腺反应？","reveal":"下丘脑经脊髓前角运动神经元引起屈肌与伸肌同时不随意节律性收缩（战栗，不做外功全转为热，常先有战栗前肌紧张）；交感兴奋促肾上腺髓质释E/NE快速升代谢。","mechanism_tag":"战栗与快轴调节"},{"cue":"为何新生儿及长期寒冷适应主要依赖褐色脂肪组织 (BAT) 非战栗产热？","reveal":"BAT(含丰富血红蛋白及含铁呼吸酶，占非战栗产热70%)线粒体内膜高表达UCP，消除质子浓度差解除氧化与ATP合酶偶联直接放热；TRH-TSH-T₃/T₄起效慢但持久增UCP。","mechanism_tag":"BAT与UCP解偶联"}],"takeaway":"安静靠内脏、运动靠骨骼肌；寒冷急性期靠战栗与交感E/NE快速产热，新生儿与持久御寒靠甲状腺轴和BAT-UCP解偶联质子漏产热。","quiz":{"stem":"新生儿暴露于寒冷环境时几乎不发生骨骼肌战栗却能迅速维持体温；若人为敲除褐色脂肪组织(BAT)线粒体内膜 UCP1 基因，将直接导致：","options":["黄脂肪单大脂滴立即加速转化为肌糖原维持收缩","脑干网状结构改由脊髓前角启动高频屈伸肌战栗","呼吸链质子梯度滞留受制于ATP反馈而产热锐减","甲状腺激素轴完全停止分泌TRH且肾上腺髓质衰竭"],"answer_idx":2,"explain":"BAT 靠 UCP1 消除跨线粒体内膜 H⁺ 电化学梯度，使氧化过程绕开 ATP 合酶的呼吸控制限制直接放热；缺失 UCP1 后质子无法漏流回基质，氧化速率受高 ATP/ADP 抑制导致产热骤降。","remedial_node_id":"histo_adipose_tissue"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"physio_heat_loss_physics_sweat_vaso","title":"四大物理散热、发汗机制与皮肤血流调控","subject":"physiology","syllabus_refs":["syl_physiology_014"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"辐射占室温裸体60%，环境≥皮温时蒸发(2.43 kJ/g)为唯一散热；温热发汗走交感ACh且低渗致高渗性脱水。","source_slides":["能量代谢与体温-基础医学分论2026-chyh.ppt#P50-P59"],"diagram_assets":[{"path":"assets/physio_thermo_heat_loss_p51.webp","caption":"21℃裸体状态下人体辐射(60%)、传导(3%+空气15%)、对流与蒸发(22%)四种散热路径图解(Fig 74.4)","source_page":51}],"payload":{"columns":["散热通路/效应器","物理驱动条件与关键数值","生理神经调控与临床应用"],"rows":[["辐射 (Radiation)","21℃裸体占60% · 取决于皮-环温差与有效辐射面积","低温蜷缩减辐射面积；环境≥皮温时反转为辐射吸热"],["传导与对流","接触温差与导热性(物体3%+空气15%)；风速加速对流","棉毛/空气导热差保暖；冰帽冰袋(传导)配电扇(对流)降温"],["不感 vs 可感蒸发","每克水汽化吸热 2.43 kJ · 环境≥皮温时唯一散热出口","不感蒸发约1000 mL/日(皮600–800+气道200–400)，补液必计"],["汗腺与皮肤血流","小汗腺分泌低渗汗(99%水+1%溶质) · 大汗致高渗性脱水","温热发汗为交感胆碱能(ACh)，精神发汗为肾上腺素能；冷缩动静脉吻合支"]],"quiz":{"stem":"在 40℃ 高温无风且相对湿度接近 100% 的密闭车间持续作业，人体核心体温迅速飙升失控，最核心的物理散热瓶颈在于：","options":["皮肤小动脉交感紧张度骤增关闭了动静脉吻合支","精神性发汗受交感肾上腺素能神经抑制停止泌汗","21℃ 时仅占 22% 的热射线辐射能力突然下降","环境超皮温使辐射传导失效且高湿阻断蒸发散热"],"answer_idx":3,"explain":"当环境温度≥皮肤温度(40℃\u003e33℃)时辐射、传导与对流均无法散热，蒸发成为唯一出路；然而近100%湿度阻碍汗液由体表汽化，使机体彻底丧失最后一条物理散热途径并迅速走向过热。","remedial_node_id":"physio_body_temp_core_shell_rhythms"}},"added_at":"2026-11-17T11:47:59+08:00"},{"id":"pathophys_health_subhealth_disease","title":"健康、亚健康与疾病稳态光谱","subject":"pathophys","syllabus_refs":["syl_pathophys_001"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"健康是躯体精神社会完好稳态；亚健康为功能低下过渡态；疾病是病因致稳态紊乱的异常生命活动。","source_slides":["疾病概论 -2026.pdf#P14-P25"],"payload":{"columns":["比较维度","健康 / 亚健康","疾病 (Disease)"],"rows":[["核心本质","健康=躯体稳态+心理+社会完好；亚健康=介于两者间的功能低下态","一定病因作用下，机体内稳态调节紊乱而导致的异常生命活动"],["表征与分类","亚健康分躯体性/心理性/社会适应三型，尚未出现器官器质病变","引起功能代谢形态异常：主观称症状、客观称体征（另有综合征/MUPS）"],["动态与宏观","全健康(One Health)统合人-动物-环境；纠正作息应激可逆转亚健康","具自然史与临床进程：急性(\u003c3周)、亚急性(3周–3月)、慢性(\u003e3月如NCD)"]],"quiz":{"stem":"关于疾病与亚健康本质的病理生理学判断，下列哪项描述最准确？","options":["疾病本质上仅等价于患者主观感受到的躯体不适","亚健康属于慢性非传染性疾病并伴不可逆纤维化","疾病是病因损害下因稳态紊乱引发的异常生命活动","医学无法解释的躯体症状均可直接诊断为完全康复"],"answer_idx":2,"explain":"疾病并非单纯主观不适或单细胞受损，而是在一定病因作用下，机体内稳态调节紊乱而导致的异常生命活动，伴随功能、代谢与形态结构变化。","remedial_node_id":"physio_homeostasis_feedback"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_etiology_vs_condition","title":"病因、致病条件与诱因的因果转化","subject":"pathophys","syllabus_refs":["syl_pathophys_001"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"病因决定疾病特异性且必不可少；条件调控易感性且含加强病因的诱因；两者随疾病谱可互换。","source_slides":["疾病概论 -2026.pdf#P30-P31,P44-P45"],"payload":{"columns":["要素分类","定义与致病角色","关键判别与转换规律"],"rows":[["病因 (原因)","引起疾病必不可少、赋予疾病特征并决定特异性的因素","无此病因绝不发生该特异疾病（如结核杆菌→肺结核）"],["致病条件","促进或减缓疾病发生的机体状态、自然环境或社会因素","非所有疾病必需（大烧伤/电击可无条件直致病）；与病因可互换"],["诱因 / 危险因素","诱因是条件中加强病因促发病者；危险因素多属慢病流行病学相关","营养不良是肺结核的条件/诱因，却直接是营养不良症的病因"]],"quiz":{"stem":"长期营养不良、过度疲劳者接触少量结核杆菌即发肺结核，但也有人被强电击直接致死。下列分析正确的是：","options":["营养不良在肺结核中作条件，在营养不良症中作病因","所有疾病发生都必须具备特定致病条件缺一不可","结核杆菌与营养不良均赋予肺结核相同的疾病特异性","危险因素消除后疾病概率不变故与病因完全等同"],"answer_idx":0,"explain":"病因与条件在不同疾病中可相互转化：营养不良降低免疫力，促进少量结核杆菌致肺结核（充当条件/诱因），而对营养不良症本身则是特异性病因；强电击伤等理化因素可无需条件直接致病。","remedial_node_id":"pathophys_health_subhealth_disease"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_etiology_seven_classes","title":"七大类病因与微生态/表观遗传特征","subject":"pathophys","syllabus_refs":["syl_pathophys_002"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"七大病因按致病特点分化：物理无选择仅引病、化学有选择全程作用、遗传/先天/免疫/心理各有通路。","source_slides":["疾病概论 -2026.pdf#P31-P43"],"payload":{"bullets":["生物因素与微生态：病原微生物与寄生虫具特定入侵门户与定位并诱发免疫及耐药变异；皮肤肠道共生菌数达人体自身细胞 {{10倍}} 并维系稳态。","物理 vs 化学因素：物理因素多仅{{引发疾病}}、潜伏期短且对组织无选择性；化学因素具{{器官选择性}}、在病程全程作用且可中和解毒。","遗传与表观遗传：染色体畸变与单基因突变致{{分子病}}（如 HbS 镰状贫血、G6PD 蚕豆病）；环境通过 DNA 甲基化改写{{遗传易感性}}。","先天因素：母体妊娠期接触毒物/射线/药物或感染损伤胎儿致{{先天性疾病}}（如法洛四联症），出生即有但{{不一定}}由亲代基因遗传。","免疫、营养与心理社会：涵盖过敏/自免/AIDS(伤CD4⁺T细胞)、营养缺盈(如缺VitD佝偻病)及心理应激诱发的{{心身疾病}}。"],"trap_note":"切勿混淆“先天性疾病”与“遗传性疾病”：先天指母体妊娠期损伤胎儿，非必遗传；单基因病也可受表观遗传与环境修饰。","quiz":{"stem":"比较物理因素与化学因素这两大类外源性病因的致病特点，下列哪项判断符合发病学规律？","options":["物理因素与化学因素均对靶器官具有高度选择性","化学毒物仅负责启动疾病而在后续进展中不再参与","物理损伤潜伏期均漫长且能靠体内酶促中和彻底解毒","化学因素具组织选择性并在疾病发生发展全程起作用"],"answer_idx":3,"explain":"物理因素（如机械力、电流）通常只引发疾病而不继续干预病程，潜伏期极短且对组织无明显选择性；化学因素（毒物/强酸碱）有一定器官选择性，在病程中持续作用且可被稀释、中和或解毒。","remedial_node_id":"pathophys_etiology_vs_condition"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_pathogenesis_general_laws","title":"发病学三大规律与因果交替恶性循环","subject":"pathophys","syllabus_refs":["syl_pathophys_001","syl_pathophys_003"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"稳态失衡是总起点，损伤与抗损伤互为动力且可转化，因果交替驱动良性恢复或恶性休克循环。","source_slides":["疾病概论 -2026.pdf#P46-P51"],"diagram_assets":[{"path":"assets/pathophys_vicious_cycle_p50.webp","caption":"创伤大失血时损伤与抗损伤转化及因果交替良性/恶性循环图解","source_page":50}],"payload":{"steps":[{"cue":"稳态失衡如何成为疾病发展的总开关（内稳态失衡律）？","reveal":"正常生理靠负反馈维持稳态（如 T₃/T₄ 抑制 TRH/TSH）。当合成酶遗传缺陷导致 T₃/T₄ 不足、负反馈失效时，TSH 持续过度刺激终致甲状腺肿。","mechanism_tag":"负反馈断裂→稳态失衡"},{"cue":"损伤与抗损伤谁决定疾病方向，两者界限绝对吗？","reveal":"两者斗争构成疾病发展基本动力，但无绝对界限且可相互转化：失血早期小动脉收缩保动脉压属抗损伤，收缩过久却加重组织缺氧滑向损伤。","mechanism_tag":"抗损伤超限转为损伤"},{"cue":"原始病因所致的后果怎样借“因果交替”演变成休克恶性循环？","reveal":"创伤失血→心输出量↓→血管收缩→组织缺氧→酸中毒→微循环淤血→进一步心输出量↓，每步结果变为新原因层层放大；及时清创输血输液可切入良性恢复环。","mechanism_tag":"结果变新因→恶性/良性环"},{"cue":"局部病变与整体状态如何相互牵制（局部与整体律）？","reveal":"局部感染经神经体液引全身发热，而全身病态支配局部结局（如糖尿病易发足部溃疡疖痈、尿毒症致肾性骨病），临床切忌“头疼医头、脚疼医脚”。","mechanism_tag":"局部与整体双向互塑"}],"takeaway":"识别“代偿何时反转为损伤”与“打破因果交替恶性循环的关键环节”，正是临床抢救抓主要矛盾的切入点。","quiz":{"stem":"创伤大失血患者早期出现外周小动脉强烈收缩，随后逐渐陷入微循环淤血与不可逆休克。这一转折直接体现了：","options":["局部病灶与全身稳态完全隔离互不干扰的结果","抗损伤代偿超限转为损伤并驱动因果交替循环","物理性病因在初次打击后自动消退并自行终止","负反馈调节增强促使毛细血管微循环立即复常"],"answer_idx":1,"explain":"失血早期小动脉收缩有助于维持血压（抗损伤），但持续过久导致组织缺氧、酸中毒与微循环淤血，抗损伤遂转化为损伤并经因果交替放大为休克恶性循环。","remedial_node_id":"physio_homeostasis_feedback"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_pathogenesis_four_mechanisms","title":"疾病发生发展的四大基本机制","subject":"pathophys","syllabus_refs":["syl_pathophys_003"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"病因经神经反射与心身通路、五类体液分泌、细胞选择性损毁及蛋白构象分子异常推动疾病演变。","source_slides":["疾病概论 -2026.pdf#P52-P56"],"payload":{"bullets":["神经机制：病因既可直接损毁神经（有机磷/乙脑病毒），也可借{{压力感受器反射}}引休克，社会心理因素伤中枢则致{{心身疾病}}。","体液机制因子：涵盖电解质(Na⁺/K⁺/Ca²⁺)、激素、化学介质(组胺/PG/补体/凝血纤溶)与{{细胞因子}}的数量或活性异常。","体液五种分泌途径：内分泌、旁分泌、自分泌、神经分泌，以及信号直接作用于产生细胞自身的{{内在分泌}}（intracrine）。","细胞机制：致病因子可无选择（强酸碱/缺氧）或{{选择性}}（如疟原虫侵红细胞）损伤代谢、功能与结构，破坏细胞自稳调节。","分子机制：任何疾病皆有细胞与分子参与；患病表型本质源于特定{{蛋白质结构或功能}}变异，同时受基因序列与细胞微环境塑形。"],"trap_note":"勿将自分泌（autocrine，分泌到胞外再结合自身膜受体）与内在分泌（intracrine，不分泌出胞直接在胞内作用）混淆。","quiz":{"stem":"某信号分子在靶细胞内合成后不释放到细胞外液，直接作用于同一细胞内的靶点引发病理稳态改变，此体液机制属于：","options":["经血液循环远距离调控靶细胞的经典内分泌","释放至细胞间隙再结合自身膜受体的自分泌","不经分泌出胞直接在胞内发挥作用的内在分泌","弥散至邻近不同类型靶细胞的局部旁分泌调节"],"answer_idx":2,"explain":"体液因子有五种作用方式：内分泌经血远距、旁分泌作用于邻细胞、自分泌出胞后反作用于自身膜受体、神经分泌由神经元释放入血，而内在分泌（intracrine）则在产生细胞内部直接起效。","remedial_node_id":"pathophys_pathogenesis_general_laws"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_outcomes_recovery_death","title":"疾病转归：完全康复与心肺/脑死亡比较","subject":"pathophys","syllabus_refs":["syl_pathophys_001","syl_pathophys_003"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"完全康复需形态代谢功能全复原；不完全康复留基本病变与后遗症；现代死亡判定转向全脑功能永久丧失。","source_slides":["疾病概论 -2026.pdf#P57-P60,P72"],"payload":{"columns":["转归类型","核心特征与定义","功能/形态及临床判别"],"rows":[["完全康复","疾病所致损伤完全消失，自稳调节彻底恢复","功能、代谢及形态结构完全复常，不留任何后遗症"],["不完全康复","损伤得到控制、主要症状消失，但基本病变未全愈","靠代偿维持功能，常留有后遗症（Sequelae，如心瓣膜瘢痕）"],["心肺 vs 脑死亡","传统心肺死亡看心跳呼吸停；脑死亡指全脑不可逆丧失","脑死亡涵盖大脑+间脑+脑干永久停止，标志机体整体功能终结"]],"quiz":{"stem":"患者经急性风湿性心内膜炎治疗后发热消退、心悸症状消失，但超声心动图仍见二尖瓣增厚粘连伴轻度关闭不全。其转归属于：","options":["主要症状已消但留存基本病理改变的不完全康复","损伤彻底清除且形态代谢均复原的完全康复结局","仅有主观躯体不适而无器官器质改变的亚健康态","全脑及脑干功能永久性停止不可逆的脑死亡状态"],"answer_idx":0,"explain":"不完全康复的本质在于主要临床症状虽已消退，但基本病理改变尚未完全恢复（如瓣膜纤维瘢痕形成），机体靠代偿维持且遗留后遗症；完全康复要求功能、代谢、形态均完全复常。","remedial_node_id":"pathophys_pathogenesis_four_mechanisms"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_brain_death_criteria_ethics","title":"脑死亡五大判定标准与三大医学意义","subject":"pathophys","syllabus_refs":["syl_pathophys_001","syl_pathophys_003"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"脑死亡须符合呼吸停等五项严苛标准，与保留脑干及自主呼吸的植物状态截然不同，具三大医学伦理价值。","source_slides":["疾病概论 -2026.pdf#P59-P61,P73"],"diagram_assets":[{"path":"assets/pathophys_brain_death_vs_pvs_p60.webp","caption":"脑死亡（全脑不可逆丧失）与植物状态（保留自主呼吸与脑干反射）五维度鉴别表","source_page":60}],"payload":{"bullets":["判定标准①–②：{{自主呼吸停止}}为诊断脑死亡的首要指标，且须伴随{{不可逆性深度昏迷}}。","判定标准③–⑤：{{脑干神经反射消失}}（瞳孔散大固定及对光/角膜/咳嗽/吞咽反射均消失）、{{脑电波消失}}及脑血液循环完全停止。","鉴别植物状态：植物人仅{{大脑皮质}}认知意识丧失，仍存在睡眠-醒觉周期并保留皮质下中枢及{{自主呼吸}}与脑干反射，有恢复可能。","三大医学伦理意义：① 协助判定{{死亡时间}}并适时终止复苏抢救；② 节省卫生资源、减轻家庭社会经济情感负担；③ 有利于{{器官移植}}。"],"trap_note":"诊断脑死亡的首要指标是“自主呼吸停止”（而非单纯心跳停止或脑电波平直）；面对呼吸机维持心跳者切忌误把植物状态当脑死亡。","quiz":{"stem":"心脏骤停复苏后患者陷入长期无意识状态，但监测显示仍存在睡眠-醒觉周期、保留自主呼吸与瞳孔对光反射。下列判断正确的是：","options":["已满足自主呼吸停止等五项指标，可立即确诊脑死亡","因无主观意识且心跳依赖药物，应直接判定为脑死亡","符合全脑（大脑、间脑、脑干）功能不可逆永久丧失","属大脑皮质受损而脑干及自主呼吸尚存的植物状态"],"answer_idx":3,"explain":"如图所示，植物状态（植物人）系大脑皮质功能严重受损，但保留了皮质下中枢及脑干功能，故仍保有自主呼吸、脑干反射与睡眠-醒觉周期；脑死亡须全脑（含脑干）不可逆丧失且自主呼吸停止。","remedial_node_id":"pathophys_outcomes_recovery_death"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_disease_models_research","title":"【拓展】疾病研究三模型与转化医学","subject":"pathophys","syllabus_refs":["syl_pathophys_004"],"syllabus_tier":"understand","node_type":"structure_cloze","anchor_summary":"整体动物、离体器官与离体细胞模型各有优缺；结合流行病/临床研究构筑实验室到床边双向转化。","source_slides":["疾病概论 -2026.pdf#P62-P69"],"payload":{"bullets":["整体动物模型：保留完整神经体液调控与多器官联动，但体内{{干扰因素复杂}}且与人类存在种属生理差异。","离体器官模型：剥离全身调控干扰以便精准测单器官功能（如灌流心脏），缺点是离体后{{难以长久维持}}活性。","离体细胞模型：原代细胞贴近在体特性但{{均一性差且增殖能力低}}；细胞株易于扩增但传代后易丧失原代特性或发生变异。","临床证据与转化医学：证据可靠度降序为 Meta→RCT→队列→病例对照→个案；践行 Bench↔Bedside 双向转化与精准三级预防。"],"trap_note":"单一细胞株突变虽能澄清分子通路，但必须回归离体器官与整体动物模型验证系统代偿，方能走向临床转化。","quiz":{"stem":"为验证某降压靶点对心肌收缩力本身（排除交感反射与血压干扰）的直接作用且要求实验连续观察两周，最需警惕的局限是：","options":["离体心脏灌流虽无神经干扰却可无限期稳定存活数周","离体器官难以长久维持而传代细胞株又易丧失原代特性","整体动物模型彻底隔离了全身体液调控因而毫无干扰","横断面临床调查在证据等级上显著高于随机对照试验"],"answer_idx":1,"explain":"离体器官模型虽排除神经体液干扰，但离体状态难以长久维持（通常数小时）；细胞株虽可长期传代，却可能部分丧失原代心肌细胞特性或发生变异；临床证据最高为 Meta 与 RCT。","remedial_node_id":"physio_research_levels_methods"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_concept_gas","title":"应激概念分类与GAS全身适应三期","subject":"pathophys","syllabus_refs":["syl_pathophys_007"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"应激是强烈刺激下稳态适应重建；依性质时长效应分急慢性与良劣性，经典呈GAS三期与病理三联征。","source_slides":["应激-20251029.pdf#P6-P25"],"payload":{"columns":["维度 / 分期","关键机制与激素主导","生物学效应与临床结局"],"rows":[["概念与分类","应激原含外环境、内环境紊乱及心理社会因素(LCU\u003e300高危)","分躯体/心理、急/慢性及双重效应：良性(eustress) vs 劣性(distress)"],["警觉期 → 抵抗期","警觉期 SAM 兴奋为主(战或逃)伴 GC↑；抵抗期转以 GC↑ 主导交感渐退","警觉期快速动员但短促；抵抗期抗损伤增强但免疫开始受抑"],["衰竭期 \u0026 三联征","GC 持续升高但 GC 受体数量与亲和力均下降，能量储备枯竭","防御崩溃内环境失调；Selye 经典病理三联征：肾上腺肿大、胃肠溃疡、淋巴结退化"]],"quiz":{"stem":"长期严重创伤患者由“全身适应综合征（GAS）抵抗期”步入“衰竭期”后，虽测得血浆糖皮质激素（GC）仍高，抗损伤能力却急剧崩溃，根本原因是：","options":["蓝斑-交感系统尚未在早期启动儿茶酚胺释放","GC 受体数量及亲和力下降且机体能量储备枯竭","肾上腺皮质彻底萎缩不再合成任何类固醇激素","淋巴结过度代偿增生耗尽全身血清免疫球蛋白"],"answer_idx":1,"explain":"GAS 衰竭期尽管血浆 GC 持续居高，但长期高水平暴露导致 GC 受体数量和亲和力下降（脱敏），叠加能量储备耗竭，最终内环境严重失调并出现应激相关疾病。","remedial_node_id":"physio_regulation_modes_body_fluid"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_other_hormones_immune","title":"应激伴随激素网络与免疫双向调控","subject":"pathophys","syllabus_refs":["syl_pathophys_008"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"β-内啡肽镇痛抑轴、ADH/醛固酮保水钠、胰高血糖素升糖；应激对免疫呈“急适增强、慢强抑制”双向效应。","source_slides":["应激-20251029.pdf#P36-P40"],"payload":{"bullets":["代谢激素切挡：胰岛 α 细胞泌{{胰高血糖素↑}}促糖异生与分解，β 细胞泌{{胰岛素↓}}减少糖利用；生长激素急性↑而慢性↓。","容量与内源制动：下丘脑室旁核泌 ADH 与球状带泌{{醛固酮↑}}保水保钠；腺垂体释放{{β-内啡肽↑}}镇痛并负反馈抑制 LSAM/HPAC 过亢。","生长/性腺/甲状腺轴抑：高 CRH 与 GC 协同下调 GnRH/LH/FSH 及甲状腺轴，抑制生长与生殖功能节约应急资源。","双向对话基础：免疫细胞表面表达 GC、CA 等受体响应神经内分泌指令，同时免疫系统也分泌{{细胞因子与神经肽}}反向调控中枢。","免疫双向效应：{{急性适度}}生理性应激增强先天性免疫；{{慢性强烈}}应激靠高 GC 与 CA 抑制 NK/T/B 细胞，易发感染或诱发自免病。"],"trap_note":"β-内啡肽不仅具有强镇痛效应，更是限制 LSAM 与 HPAC 轴过度亢进的重要内源刹车；CRH、GH、雌激素等部分因子可短时增强免疫，但持续高 GC/CA 占压倒性抑制。","quiz":{"stem":"急性温和运动刺激与长期高强度心理应激对机体免疫功能截然不同，下列机制对比准确的是：","options":["急性适度应激增强先天免疫，慢性强应激因高GC/CA全面抑制免疫","急性适度应激彻底耗竭NK细胞，慢性强应激则持续激活抗体合成","免疫细胞缺乏儿茶酚胺与GC膜/核受体，仅由腺垂体β-内啡肽单独支配","慢性强烈应激中因CRH大幅上升使特异性T淋巴细胞应答显著亢进"],"answer_idx":0,"explain":"急性、适度生理性应激能动员先天性免疫应答增强防御；而慢性、强烈应激下持续高浓度的糖皮质激素和儿茶酚胺全面抑制先天免疫、T 细胞介导细胞免疫及体液免疫。","remedial_node_id":"pathophys_stress_axes"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_apr_app","title":"急性期反应与急性期蛋白正负调控","subject":"pathophys","syllabus_refs":["syl_pathophys_008"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"应激激活单核巨噬细胞NF-κB释放IL-1/TNF/IL-6，驱动肝细胞海量合成正APP并下调负APP抗感染修护。","source_slides":["应激-20251029.pdf#P41-P45"],"diagram_assets":[{"path":"assets/pathophys_stress_app_nfkb_p42.webp","caption":"炎症/感染激活单核-巨噬细胞NF-κB释放IL-1/TNF-α/IL-6并刺激肝细胞分泌APP机制图","source_page":42}],"payload":{"steps":[{"cue":"强烈应激引发急性期反应(APR)时，哪条胞内转录开关最先点火？","reveal":"感染/烧伤/创伤激活单核-巨噬细胞 NF-κB 入核结合 κB 序列，海量转录并释放 IL-1、TNF-α 与 IL-6 等细胞因子入血。","mechanism_tag":"NF-κB→细胞因子风暴"},{"cue":"肝脏为主的细胞接收到 IL-1/TNF-α 与 IL-6 后如何精准重排血浆蛋白？","reveal":"IL-1/TNF 刺激生成 CRP、血清淀粉样蛋白 A (SAA，升千倍) 及补体 C3；IL-6 诱导 α₁-抗胰蛋白酶、纤维蛋白原与铜蓝蛋白；白蛋白/前白蛋白/运铁蛋白等“负 APP”则同步减少。","mechanism_tag":"正APP暴增 vs 负APP下调"},{"cue":"CRP、铜蓝蛋白与结合珠蛋白在“抗感染与抗损伤”中如何协同？","reveal":"CRP(6–8h↑, 48–72h达峰)调理细菌并激活补体，纤维连接蛋白促巨噬吞噬；蛋白酶抑制物防自溶；铜蓝蛋白激活 SOD 清自由基并氧化亚铁，结合珠蛋白回收游离 Hb。","mechanism_tag":"调理补体+抑酶抗氧化"},{"cue":"急性期反应为何早期“促凝”而后期“促纤溶”？","reveal":"早期纤维蛋白原与凝血因子↑加速局部微血栓隔离、阻止病原扩散；后期纤溶酶原↑适时激活纤溶系统溶解纤维蛋白基质，利于组织再生修复。","mechanism_tag":"早凝限扩→晚纤溶修复"}],"takeaway":"肝脏借下调白蛋白等“负 APP”腾出氨基酸原料，集中爆产千倍飙升的 CRP/SAA 等“正 APP”构筑血浆防线。","quiz":{"stem":"大面积烧伤后 48 小时，患者血清 C-反应蛋白（CRP）飙升近千倍、纤维蛋白原显著升高，而血清白蛋白与运铁蛋白却明显低于正常。最合理的解释是：","options":["肝细胞发生急性脂肪变并完全丧失所有血浆分泌功能","肾小球滤过膜完全崩解选择性仅漏出白蛋白与运铁蛋白","APR期负急性期蛋白合成受抑以优先供给正APP生产","纤维蛋白原直接降解了白蛋白的肽链作为交联骨架原料"],"answer_idx":2,"explain":"急性期反应(APR)中，CRP、SAA 与纤维蛋白原属正急性期蛋白急剧上升（CRP 48–72h 达峰）；而白蛋白、前白蛋白与运铁蛋白属负急性期蛋白主动减少，使肝脏氨基酸资源优先用于防御蛋白合成。","remedial_node_id":"pathophys_ep_tlr4_signaling"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_cellular_hsp_ros","title":"细胞应激：HSP伴侣、UPR与氧化应激","subject":"pathophys","syllabus_refs":["syl_pathophys_008"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"细胞借HSF-HSP分子伴侣复性蛋白、GRP78解离启动UPR三分支、ROS-NRF2平衡存活或凋亡。","source_slides":["应激-20251029.pdf#P46-P59"],"diagram_assets":[{"path":"assets/pathophys_stress_hsp_hsf_p55.webp","caption":"变性蛋白竞争结合HSP70释放HSF磷酸化三聚入核结合HSE(GAAnnTTC)诱导HSP70闭合环路","source_page":55}],"payload":{"steps":[{"cue":"HSP“分子伴侣”与分泌型 APP 有何本质分工？HSP90 如何遥控激素？","reveal":"HSP 属非分泌型胞内蛋白，凭 C 端基质识别区结合暴露疏水区（防聚集）、借 N 端高度保守 ATP 酶域促折叠/复性或导泛素降解；HSP90 更全程伴护 GR 调节 GC 生物效应。","mechanism_tag":"胞内伴侣防聚+HSP90控GR"},{"cue":"细胞如何感知蛋白变性并瞬时扩增 HSP70 产量？","reveal":"静息时 HSP70 锚定抑制转录因子 HSF；应激产生的变性蛋白竞抢 HSP70 使 HSF 游离，HSF 磷酸化三聚入核结合热休克元件 HSE (GAAnnTTC) 强力启动 HSP70 转录。","mechanism_tag":"竞争释放HSF→HSE闭环"},{"cue":"内质网未折叠蛋白堆积如何借 GRP78 启动 UPR 三条减负分支？","reveal":"错误折叠蛋白抢走分子伴侣 GRP78，释放三大感应蛋白：PERK 磷酸化 eIF2α 减少新蛋白翻译（过强促凋亡）、ATF6 剪切入核与 IRE1 剪接 XBP1 mRNA，共促伴侣表达与降解。","mechanism_tag":"GRP78解离→PERK/ATF6/IRE1"},{"cue":"活性氧 (ROS) 为何被称为启动细胞应激的第二信使？","reveal":"多种应激原诱发 ROS 升高：适度 ROS 促使 KEAP1 与 NRF2 解离入核结合 ARE 激活 GPX4/GSH 抗氧化促存活；ROS 过载则引 DNA 基因毒损伤并转向凋亡（如缺血再灌注）。","mechanism_tag":"ROS第二信使→NRF2存活vs凋亡"}],"takeaway":"细胞靠竞争性释放机制（变性蛋白抢 HSP70 放 HSF、抢 GRP78 放 UPR、ROS 放 NRF2）将蛋白/氧化危机转化为转录自救开关。","quiz":{"stem":"若在细胞内过表达大量不能结合变性蛋白、却能死死钳住热休克因子（HSF）的突变型 HSP70，热应激后最可能发生的阻断是：","options":["内质网GRP78彻底脱离PERK并阻断了IRE1二聚化","HSF无法游离磷酸化三聚入核结合HSE启动HSP表达","肝细胞内NF-κB立即终止转录白蛋白等负急性期蛋白","线粒体基质内泛素直接替代ATP酶结构域降解核糖体"],"answer_idx":1,"explain":"如图 P55 闭环机制所示，应激诱导 HSP70 表达依赖于变性蛋白竞争夺走与 HSF 结合的 HSP70，释放游离 HSF 磷酸化三聚体并入核结合 HSE (GAAnnTTC)；钳死 HSF 将锁死转录上调。","remedial_node_id":"biochem_protein_tertiary_quaternary_folding"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_cvd_ulcer","title":"应激性心血管病变与消化道溃疡机制","subject":"pathophys","syllabus_refs":["syl_pathophys_009"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"急性心理应激诱发冠脉痉挛/心碎综合征及猝死；慢性应激促冠心病高血压；胃黏膜缺血+屏障崩解成应激性溃疡。","source_slides":["应激-20251029.pdf#P3-P4,P63-P71"],"diagram_assets":[{"path":"assets/pathophys_stress_cvd_p66.webp","caption":"急性应激（冠脉痉挛/血栓→心源性猝死）与慢性应激（脂异常/RAA水钠潴留→冠心病/高血压）心血管路径","source_page":66}],"payload":{"steps":[{"cue":"梅阿姨丧夫后酷似心梗却冠脉无狭窄：急性心理应激如何伤心？","reveal":"绝经后女性突发强心理应激常诱发“心碎综合征”（应激性心肌病）：高 CA 致 ST 段抬高、心肌酶升及心尖顿抑但冠脉无明显狭窄且可逆；若致冠脉痉挛叠加 APR 血液高黏高凝，则引发心源性猝死。","mechanism_tag":"心碎综合征 vs 冠脉痉挛猝死"},{"cue":"慢性心理社会应激怎样把“血管应急缩紧”固化为冠心病与高血压？","reveal":"慢性持续 GC↑致脂代谢异常推高动脉粥样硬化（冠心病），同时增强血管平滑肌对 CA 敏感性；交感持续兴奋使微动脉管壁增厚并激活 RAA-ADH 轴水钠潴留，锁定慢性高血压。","mechanism_tag":"慢应激→动脉硬化+高血压"},{"cue":"消化道：功能性肠易激(IBS)与器质性应激性溃疡(SU)有何分层？","reveal":"IBS 与心理应激相关，因抑制胃排空并亢进结肠运动而现腹痛排便紊乱但无器质异常；SU 则是重伤/大手术后急性胃十二指肠黏膜糜烂溃疡穿孔出血，危重时发病率达 75%–100%。","mechanism_tag":"IBS功能紊乱 vs SU器质破溃"},{"cue":"应激性溃疡的“最基本条件”与“必要条件”如何合力破穿胃壁？","reveal":"最基本条件是 LSAM 致胃黏膜缺血（HCO₃⁻ 难运走反向弥散 H⁺）；必要条件是缺血致黏液-碳酸氢盐凝胶屏障崩解，叠加 GC 促胃酸胃蛋白酶↑、抑上皮再生及胆汁反流与 ROS 损毁。","mechanism_tag":"缺血基本条件+屏障崩解"}],"takeaway":"心血管病是第一位的应激相关疾病；区分心碎综合征（冠脉造影通畅可逆）与真性冠脉闭塞，以及抓牢胃黏膜缺血这一SU最基本条件，至关重要。","quiz":{"stem":"62 岁女性惊闻噩耗后剧烈胸痛伴心电图 ST 段抬高及肌钙蛋白升高，超声见心尖部运动显著减弱，但急诊冠脉造影未见明显狭窄。其诊断及特点是：","options":["急性大面积动脉粥样硬化斑块破裂，收缩功能永久丧失","持续高GC诱导慢性RAA水钠潴留所致的原发性高血压","典型冠心病伴全胃黏膜屏障缺血崩解导致的应激性溃疡","急性心理应激诱发的应激性心肌病，心功能短期常可逆"],"answer_idx":3,"explain":"心碎综合征（应激性心肌病）好发于绝经后女性，由剧烈心理或躯体应激诱发，临床表现极似急性心梗，但冠脉造影无明显狭窄且急性心收缩低下常可在短期内恢复。","remedial_node_id":"pathophys_stress_axes"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_ptsd_metabolic","title":"PTSD精神障碍与应激代谢内分泌重塑","subject":"pathophys","syllabus_refs":["syl_pathophys_009","syl_pathophys_008"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"ASD随应激原撤除速愈，PTSD延迟发生且撤除后仍恶化；高CA/GC引负氮高血糖并抑制GH/HPG/HPT。","source_slides":["应激-20251029.pdf#P60-P62,P73-P82"],"payload":{"columns":["系统分类","急性应激 / 代谢反应","慢性恶化 / PTSD 与内分泌抑制"],"rows":[["心理行为与ASD","积极反应急中生智，消极呈逃避/否认；急性应激障碍\u003c1h即发(兴奋或木僵)","ASD 在应激原消除后预后良好不留人格缺陷；适应障碍发生于1月内\u003c6月"],["PTSD 与抑郁症","遭受异乎寻常灾难性心理创伤后，经潜伏期延迟出现并长期持续","PTSD 反复重现体验伴易激惹回避，撤除应激原后仍继续恶化；抑郁症伴高GC及免疫紊乱"],["高代谢与内分泌","CA+GC+胰高血糖素使糖原分解/糖异生/脂解↑、胰岛素↓，引应激高血糖/糖尿","蛋白分解↑呈负氮平衡(消瘦)；慢性心理应激抑 GH/HPT 致心因性侏儒及 HPG 闭经不育"]],"quiz":{"stem":"灾后一名救援人员当时仅表现为短暂失眠，数月回归安全环境后却开始反复噩梦闪回灾难画面、极度惊恐回避且症状逐月加重。此转归鉴别为：","options":["撤除应激原后仍延迟进展恶化的创伤后应激障碍(PTSD)","强刺激1小时内即刻暴发且撤除刺激即速愈的急性应激障碍","仅因自身人格脆弱产生且通常6个月内自限缓解的适应障碍","因儿童期长期高CRH抑制GH与甲状腺轴导致的心因性侏儒"],"answer_idx":0,"explain":"急性应激障碍（ASD）在严重刺激后 1 小时内即发且撤除应激原后预后良好；而 PTSD（创伤后应激障碍）具延迟起病与长期持续特征，最关键的是在应激原撤除后仍继续进展恶化。","remedial_node_id":"pathophys_stress_concept_gas"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"pathophys_stress_prevention_principles","title":"病理性应激防治四原则与激素双刃剑","subject":"pathophys","syllabus_refs":["syl_pathophys_010"],"syllabus_tier":"familiar","node_type":"structure_cloze","anchor_summary":"病理性应激重在祛除应激原、心理护理与情感急救、对应激低下者审慎用GC并补营养增抵抗力。","source_slides":["应激-20251029.pdf#P74,P83-P84"],"payload":{"bullets":["原则一·祛除应激原：首要迅速消除或隔离躯体及心理致病刺激（抗感染、止痛、纠酸纠休克），从源头切断{{劣性应激级联}}。","原则二·心理护理与情感急救：针对失败、反刍、孤独与创伤后失落早期实施{{心理危机干预}}，阻断 ASD 滑向 PTSD 与抑郁症。","原则三·审慎把控 GC 双刃剑：高 GC 状态下切忌盲目外源加重溃疡与感染，仅对肾上腺功能低下等{{应激反应低下者}}合理补用 GC。","原则四·营养与胰岛素支持：严重持久应激呈负氮平衡与胰岛素抵抗，须及时补充{{营养底物与胰岛素}}提升全身抗损伤能力。"],"trap_note":"外源性糖皮质激素是一把双刃剑：仅在肾上腺皮质功能不全或应激低下危象时补充以发挥允许作用，切勿把 GC 当作所有应激的常规抗炎剂。","quiz":{"stem":"大面积严重烧伤第 3 天患者处于极度高代谢伴早期黑便潜血阳性（并发应激性溃疡），此时针对糖皮质激素的临床决策应是：","options":["立即大剂量静推GC以彻底取代儿茶酚胺的血管收缩作用","一律长期加用高浓度GC以永久防止全身适应综合征衰竭","避免盲目外源叠加GC防加重胃溃疡与感染，护胃同时营养支持","全面停用肠内外营养与胰岛素以靠自体负氮平衡自行代偿"],"answer_idx":2,"explain":"严重烧伤早期体内内源性 GC 已剧增并诱发应激性溃疡，盲目外源加用 GC 会加剧胃酸/蛋白酶分泌、抑上皮修复与免疫抑制；仅当应激反应低下时方合理使用 GC，同时补足营养和胰岛素。","remedial_node_id":"pathophys_stress_axes"}},"added_at":"2026-11-17T12:41:18+08:00"},{"id":"patho_atrophy_metaplasia_morphology","title":"适应形态：褐色萎缩、假肥大与化生","subject":"pathology","syllabus_refs":["syl_pathology_001","syl_pathology_002","syl_pathology_003","syl_pathology_004"],"syllabus_tier":"core_underlined","node_type":"structure_cloze","anchor_summary":"区分发育不全/真假肥大/化生起源与心肌褐色萎缩形态","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P26-P51"],"diagram_assets":[{"path":"assets/patho_injury_brown_atrophy_p33.webp","caption":"心肌褐色萎缩：冠脉迂曲与核旁脂褐素颗粒","source_page":33}],"payload":{"bullets":["萎缩概念与生理型：已{{发育正常}}的器官或细胞体积缩小、数目减少（区别于{{发育不全}}）；生理性萎缩见于动脉导管闭锁、{{青春期胸腺退化}}及老年脑/生殖器萎缩。","病理性萎缩五因：包括{{营养不良性}}（饥饿或脑动脉粥样硬化）、压迫性（{{肾盂积水}}压迫肾实质）、{{失用性}}（骨折石膏固定）、去神经性及内分泌性（席汉综合征垂体靶腺萎缩）。","心肌褐色萎缩：大体心脏体积缩小、表面{{深褐色}}，因心外膜脂肪消失使{{冠状动脉呈蛇形迂曲}}；光镜心肌纤维变细，核两旁见黄褐色{{脂褐素}}颗粒；电镜见细胞器减少与{{自噬泡}}增多。","肥大/假肥大与增生：永久细胞主要行{{代偿性肥大}}（如高血压左室壁向心性增厚）；{{假性肥大}}指实质萎缩伴间质纤维/脂肪过度增生使体积反大；病理性增生去除刺激后{{可逆转}}。","化生与不典型增生：化生由{{未分化储备细胞}}重分化（限同胚层），如支气管{{假复层纤毛柱状上皮}}化生为{{鳞状上皮}}、胃黏膜{{肠上皮化生}}或间叶骨化生；{{不典型增生}}现极性丧失属癌前病变。"],"trap_note":"支气管鳞状上皮化生增强抗摩擦却丧失纤毛排痰易致感染；胃肠化生常呈AB/PAS阳性；化生本身仍属良性适应，区别于已现核异型的不典型增生。","quiz":{"stem":"高龄长期卧床患者尸检见心脏重量仅210g、心室壁变薄呈深褐色，心外膜冠状动脉迂曲呈蚯蚓状，镜下心肌细胞核两旁聚集细小黄褐色颗粒。下列对冠脉迂曲与胞质颗粒成因的判定最准确的是：","options":["冠脉壁玻璃样变致管腔扩张，胞质为含铁血黄素","心外膜脂肪消瘦萎缩显迂曲，胞质为自噬残体脂褐素","冠脉侧支动脉代偿增粗迂曲，胞质为胆红素沉积","心室壁心肌假性脂肪替代扩张，胞质为黑色素颗粒"],"answer_idx":1,"explain":"心肌褐色萎缩（P33）系营养不良与老年消耗所致，心脏实质缩小及心外膜脂肪减少使原有冠状动脉相对过长而呈蛇形迂曲，并非血管增粗或玻变；镜下核两旁黄褐色颗粒系细胞器自噬后未被溶酶体消化的脂褐素残体。","remedial_node_id":"patho_cellular_adaptation"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_hyaline_degeneration","title":"玻璃样变性三大类型与鉴别","subject":"pathology","syllabus_refs":["syl_pathology_007"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"区分细胞内/细动脉壁/结缔组织三类均质红染蛋白蓄积机制","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P70-P76"],"diagram_assets":[{"path":"assets/patho_injury_hyaline_arteriole_p75.webp","caption":"高血压肾入球小动脉壁玻璃样变性（均质粉染、管壁增厚管腔狭窄）","source_page":75}],"payload":{"columns":["玻变类型","实质机制与累及物质","典型病变器官/包涵体","关键形态与鉴别名目"],"rows":[["细胞内玻璃样变","重吸收过量血浆蛋白或细胞骨架/免疫球蛋白聚集","肾小管蛋白滴、浆细胞Russell体、酒精肝Mallory体","胞质均质红染圆滴；肾小管蛋白滴PAS强阳性"],["细动脉壁玻璃样变","内皮通透性↑→血浆蛋白渗入内皮下凝固+基膜增厚","缓进型良性高血压与糖尿病肾入球小动脉、脾中央动脉","管壁均质红染增厚、管腔狭小；区别急进型纤维蛋白样坏死"],["纤维结缔组织玻变","老化胶原纤维交联增粗融合，成纤维细胞明显减少","陈旧瘢痕、动脉粥样硬化纤维斑块、纤维化肾小球","HE粉染无结构均质条索、韧性丧失；刚果红染色阴性"]],"quiz":{"stem":"某68岁患者陈旧心肌梗死瘢痕区切片呈均质无结构粉染条索、成纤维细胞极少，且刚果红染色完全阴性；而另一肾病综合征患者肾近曲小管上皮胞质见大量PAS阳性红染小滴。两者形态同称“玻璃样变”的实质共性在于：","options":["均为不可逆胶原纤维发生纤维蛋白样坏死解体","均由反向平行β-折叠原纤维抗酶解沉积形成","均为光镜下呈均质粉染的蛋白质蓄积形态学描述","均因毛细血管高压渗出致血浆白蛋白被动滞留"],"answer_idx":2,"explain":"“玻璃样变性”并非单一化学成分或单一发病机制的独立疾病，而是细胞内、细动脉壁或纤维结缔组织中蛋白质异常蓄积、在HE染色下同呈半透明均质粉染的形态学统称；瘢痕玻变刚果红阴性，肾小管小滴系滤过血浆蛋白重吸收所致。","remedial_node_id":"histo_collagen_fibrillogenesis"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_amyloidosis_mechanisms","title":"淀粉样变性：β-折叠原纤维与特殊染色","subject":"pathology","syllabus_refs":["syl_pathology_009"],"syllabus_tier":"core_underlined","node_type":"mechanism_flow","anchor_summary":"反向平行β-折叠抗降解机制、AL/AA/Aβ前体与刚果红苹果绿双折光","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P77-P86"],"diagram_assets":[{"path":"assets/patho_injury_amyloid_birefringence_p80.webp","caption":"淀粉样物质HE云雾状均质红染、刚果红橘红及偏光显微镜苹果绿双折光","source_page":80}],"payload":{"steps":[{"step_index":1,"cue":"生化学前体与四大常见亚型（P81）","reveal":"AL型（骨髓瘤/浆细胞单克隆轻链）、AA型（慢性结核/类风湿致IL-6↑→肝合成SAA继发沉积）、Aβ型（Alzheimer病脑老年斑）、ATTR型（甲状腺素运载蛋白突变/老年心脏沉积）及透析相关β2-微球蛋白。"},{"step_index":2,"cue":"超微结构与抗降解本质（P78-P79）","reveal":"错误折叠蛋白聚集并结合5% P组分黏多糖，电镜呈7.5–10 nm无分支直行原纤维；X线衍射呈特征性反向平行β-折叠片层（antiparallel β-pleated sheet），使其能抵抗蛋白酶水解并不可逆沉积于细胞外。"},{"step_index":3,"cue":"光镜特点与特种确诊染色（P78, P80）","reveal":"HE下在血管壁、基底膜与间质内呈淡伊红色云雾状均质物；刚果红（Congo red）染色呈橘红色，偏光显微镜下现苹果绿双折光（确诊金标准）；遇碘呈红褐色、加稀硫酸呈深蓝色。"},{"step_index":4,"cue":"器官大体形态与压迫结局（P82-P86）","reveal":"受累器官常体积增大、质地变硬韧、切面呈半透明蜡样光泽（如西米脾/火腿脾、肝Disse间隙沉积）；沉积物持续挤压邻近实质细胞并阻碍微循环物质交换，最终导致实质细胞缺血萎缩与器官衰竭。"}],"takeaway":"细胞外淀粉样原纤维凭借反向平行β-折叠抗酶解，靠刚果红橘红+偏光苹果绿双折光一锤定音。","quiz":{"stem":"慢性化脓性骨髓炎迁延十余年患者出现大量蛋白尿与肝脾肿大，肾活检见肾小球系膜及毛细血管壁大量淡伊红云雾状物质沉积，刚果红染色在偏光镜下见特征性苹果绿双折光。该沉积原纤维的直接前体蛋白及二级构象最可能为：","options":["急性期肝合成SAA裂解后呈反向平行β-折叠","浆细胞κ轻链过量合成呈α-螺旋胶原样卷曲","神经元APP裂解后呈交叉免疫球蛋白二硫聚体","巨噬细胞分泌溶菌酶与硫酸软骨素共价聚合物"],"answer_idx":0,"explain":"慢性化脓性感染、结核或类风湿长期刺激单核巨噬细胞释放IL-1/IL-6，诱导肝合成血清淀粉样蛋白A（SAA），经局部水解错误折叠成反向平行β-折叠原纤维（AA型继发性淀粉样变性），其抗蛋白酶降解并在刚果红偏光下显苹果绿双折光；单克隆轻链见于AL型骨髓瘤。","remedial_node_id":"biochem_protein_tertiary_quaternary_folding"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_mucoid_vs_amyloid_degeneration","title":"黏液样变性 vs 淀粉样与玻变","subject":"pathology","syllabus_refs":["syl_pathology_008","syl_pathology_009"],"syllabus_tier":"core_underlined","node_type":"comparison_matrix","anchor_summary":"黏多糖浅灰蓝星芒细胞基质vs淀粉样橘红苹果绿vs胶原玻变","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P77-P87"],"diagram_assets":[{"path":"assets/patho_injury_mucoid_he_p87.webp","caption":"黏液样变性HE形态：浅灰蓝色疏松黏液基质与星芒状多角形细胞","source_page":87}],"payload":{"columns":["鉴别维度","黏液样变性 (P87)","淀粉样变性 (P77-P86)","结缔组织玻变 (P76)"],"rows":[["主要沉积物质","间质黏多糖（透明质酸）与蛋白质","错误折叠蛋白+5% P组分黏多糖","老化交联融合的Ⅰ/Ⅲ型胶原纤维"],["HE染色形态","间质疏松水肿、浅灰蓝基质伴星芒细胞","淡伊红云雾状均质物压迫萎缩实质","均匀粉染无结构玻璃样条索，细胞稀少"],["特染核心指征","甲苯胺蓝异染红紫；刚果红阴性；PAS阴性","刚果红橘红＋偏光苹果绿双折光；碘褐","刚果红阴性；Masson三色保留胶原染色"],["典型疾病场景","甲减黏液水肿、风湿热早期、黏液瘤","多发性骨髓瘤(AL)、结核(AA)、AD脑斑","陈旧心肌瘢痕、粥样斑块纤维帽"]],"quiz":{"stem":"甲减患者胫前皮肤呈非凹陷性增厚，活检真皮间质高度疏松、呈浅灰蓝色水肿样，其中散布带细长突起的星芒状多角形间叶细胞，刚果红与一般PAS染色均为阴性。该间质中过量蓄积的主体成分是：","options":["经内皮渗出并凝固的血浆白蛋白与纤维蛋白原","透明质酸等间质黏多糖及蛋白组成的黏液物质","具有抗酶解7.5 nmβ-折叠原纤维P组分","胶原纤维交联老化融合形成的中性糖蛋白条索"],"answer_idx":1,"explain":"该表现为典型的间质黏液样变性（甲减黏液水肿，P87）：甲减时成纤维细胞受激素代谢调节失衡，间质大量蓄积透明质酸等酸性黏多糖与蛋白质，HE呈浅灰蓝色疏松基质并见星芒状多角形细胞；黏液样变性刚果红阴性，一般PAS阴性而甲苯胺蓝呈异染红紫色。","remedial_node_id":"patho_amyloidosis_mechanisms"}},"added_at":"2026-11-17T15:15:06+08:00"},{"id":"patho_pathological_pigmentation","title":"病理性色素沉着与普鲁士蓝鉴别","subject":"pathology","syllabus_refs":[],"syllabus_tier":"familiar","node_type":"comparison_matrix","anchor_summary":"区分含铁血黄素/脂褐素/黑色素/胆红素/肺炭末着色与来源","source_slides":["细胞组织的适应和损伤 曾文姣 （基医4学时）2026秋 更新.pptx#P88-P90, #P95"],"diagram_assets":[{"path":"assets/patho_injury_hemosiderin_p88.webp","caption":"含铁血黄素：HE棕黄色折光颗粒与普鲁士蓝深蓝色铁反应","source_page":88}],"payload":{"columns":["色素名称","本质来源与沉积部位","HE与特殊染色鉴别","关键病理临床场景"],"rows":[["含铁血黄素","巨噬细胞降解血红蛋白→含Fe³⁺颗粒","HE粗大棕黄有折光；普鲁士蓝深蓝(+)","左心衰肺淤血心力衰竭细胞、陈旧出血、血色病"],["脂褐素","自噬溶酶体未消化膜脂过氧化残体","心肌/肝核两旁细小黄褐颗粒；普鲁士蓝(-)","老年/慢性消耗心肌褐色萎缩（消耗性色素）"],["黑色素","神经嵴来源黑素细胞酪氨酸酶催化","HE深棕褐色；DOPA与银染(+)","色素痣、恶性黑色素瘤、Addison病肤色加深"],["胆红素与炭末","血红素无铁衍生物；吸入外源碳粒","胆栓呈黄绿褐色；肺炭末黑粒均普鲁士蓝(-)","胆汁淤积/黄疸；吸烟与城市肺门淋巴结炭沉着"]],"quiz":{"stem":"某慢阻肺伴风湿性二尖瓣狭窄患者咯铁锈色痰并伴极度营养不良消瘦，分别取痰涂片肺泡巨噬细胞及尸检萎缩心肌切片行普鲁士蓝（Prussian blue）反应。下列镜下着色结果最符合机制的是：","options":["两种
